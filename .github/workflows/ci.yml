name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Validated server release version, without the v prefix.
        type: string
        default: ''
      build-release:
        description: Build Linux distribution archives after the quality gates.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: proctor-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GOFLAGS: -buildvcs=false -mod=readonly
  GOPRIVATE: github.com/sudosylabs/proctor
  GO_TEST: node ${{ github.workspace }}/build/ci/go-test.mjs
  PROCTOR_TEST_REPORT_DIR: ${{ github.workspace }}/.build/ci

jobs:
  quality:
    name: Formatting and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Select linter comparison revision
        id: lint-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            revision=$(git rev-parse 'HEAD^' 2>/dev/null || git rev-parse HEAD)
          elif [ "$EVENT_NAME" = pull_request ]; then
            revision=$PULL_REQUEST_BASE
          elif [ "$EVENT_NAME" = push ]; then
            if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
            fi
            git cat-file -e "$PUSH_BEFORE^{commit}"
            revision=$PUSH_BEFORE
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            revision=$(git merge-base HEAD FETCH_HEAD)
          else
            printf 'unsupported event for incremental linting: %s\n' "$EVENT_NAME" >&2
            exit 2
          fi
          test -n "$revision"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Run formatting and linter gates
        env:
          LINT_BASE_REV: ${{ steps.lint-base.outputs.revision }}
        run: make quality
      - name: Verify CI tooling
        run: node --test build/ci/*.test.mjs

  hermetic:
    name: Hermetic and independent modules
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The standard suites check the route error tables. Race instrumentation
      # puts the whole-module analysis over the hosted runner's memory budget.
      GO_TEST_RACE_FLAGS: -p 2 -skip '^TestRouteErrorTablesMatchReachableCodes$$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The module pin check compares pinned commits with the tree.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Install locked webapp dependencies
        run: make webapp-install
      - name: Install matching browsers and Linux dependencies
        working-directory: webapp
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      # The runner has been stopped mid gate with no failing test and no log.
      # Each target of `make check` (build/make/test.mk) runs as its own step,
      # so a stop names the target and earlier steps keep their logs, and a
      # sampler records memory and the largest processes every 15 seconds.
      # Keep these steps in step with the `check` and `server-check` targets.
      - name: Start runner resource sampler
        run: |
          nproc
          free -m
          df -h "$GITHUB_WORKSPACE" /tmp
          mkdir -p .build/ci
          nohup bash -c 'while :; do
            printf "%s mem_used=%sM mem_avail=%sM swap_used=%sM load=%s\n" \
              "$(date -u +%H:%M:%S)" \
              "$(free -m | awk "/^Mem:/{print \$3}")" \
              "$(free -m | awk "/^Mem:/{print \$7}")" \
              "$(free -m | awk "/^Swap:/{print \$3}")" \
              "$(cut -d" " -f1-3 /proc/loadavg)"
            ps -eo rss=,args= --sort=-rss | head -5 | awk "{printf \"  %6dM %s\n\", \$1/1024, substr(\$0, index(\$0,\$2), 120)}"
            sleep 15
          done' > .build/ci/runner-resources.log 2>&1 &
      - name: Check brand artwork and build scripts
        run: make brand-check build-scripts-check
      - name: Check webapp
        if: ${{ !cancelled() }}
        run: make webapp-check
      - name: Check documentation site
        if: ${{ !cancelled() }}
        run: make docs-check
      - name: Check mail templates
        if: ${{ !cancelled() }}
        run: make mail-templates-check
      - name: Check server contracts and static rules
        if: ${{ !cancelled() }}
        run: make -C server architecture errors-check i18n-check openapi-agreement asyncapi-check vet
      - name: Run server tests
        if: ${{ !cancelled() }}
        run: make -C server test
      - name: Run server race tests
        if: ${{ !cancelled() }}
        run: make -C server test-race
      - name: Report runner resources and kernel kills
        if: ${{ always() }}
        run: |
          free -m
          echo "Highest memory use sampled:"
          sort -t= -k2 -n -r <(grep -o 'mem_used=[0-9]*' .build/ci/runner-resources.log) | head -1 || true
          echo "Last samples:"
          tail -n 120 .build/ci/runner-resources.log || true
          echo "Kernel out-of-memory kills:"
          sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process' || echo none
      - name: Verify independent modules
        if: ${{ !cancelled() }}
        run: make independent-modules
      - name: Verify internal module pins
        if: ${{ !cancelled() }}
        run: make module-pins-check
      - name: Retain tests, coverage, browser traces, and HTML reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hermetic-test-reports
          path: .build/ci/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  integration:
    name: Dependency-backed integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Run server and reusable-adapter integration suites
        run: make integration
      - name: Retain integration test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports
          path: .build/ci/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  cluster:
    name: Three-node certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Certify active-active development topology
        run: make cluster-smoke
      - name: Retain service diagnostics after failure
        if: failure()
        run: |
          mkdir -p .build/ci
          make cluster-diagnostics > .build/ci/cluster.log 2>&1
      - name: Upload cluster diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-diagnostics
          path: .build/ci/cluster.log
          include-hidden-files: true
          retention-days: 7
      - name: Stop cluster
        if: always()
        run: make cluster-down || true

  e2e:
    name: Browser end-to-end against a real server
    needs: [hermetic]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Install locked webapp dependencies
        run: make webapp-install
      - name: Install Chromium and its Linux dependencies
        working-directory: webapp
        run: npx --no-install playwright install --with-deps chromium
      - name: Run end-to-end journeys
        run: make e2e
      - name: Upload end-to-end traces, reports, and server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: .build/ci/e2e/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  release:
    name: Reproducible release artifacts
    needs: [quality, hermetic, integration, cluster, e2e]
    if: ${{ github.event_name != 'push' || github.ref_type != 'tag' || inputs.build-release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Build archives and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_id) }}
        run: make VERSION="$RELEASE_VERSION" dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proctor-linux-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
