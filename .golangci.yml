version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - fatcontext
    - funlen
    - gocheckcompilerdirectives
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - testifylint
    - unconvert
    - unused
  settings:
    # A function is bounded by how much it does, not by how many lines it
    # takes: a line limit rewards packing several fields onto one line.
    funlen:
      lines: -1
      statements: 80
      ignore-comments: true
    lll:
      line-length: 160
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        # Exported application, HTTP, and SQL Store declarations carry a doc
        # comment that starts with their name. The exclusion rules below scope
        # this rule to those packages.
        - name: exported
          arguments:
            - disableStutteringCheck
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST1005
    testifylint:
      enable-all: true
      disable:
        # Deterministic tests compare exact float values on purpose.
        - float-compare
        # Canonical encodings are compared byte for byte on purpose.
        - encoded-compare
        # assert error checks stay where a test reports every failure.
        - require-error
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # The staticcheck half of the comments preset: documentation style is
      # enforced by revive's exported rule where it applies.
      - linters:
          - staticcheck
        text: "(ST1000|ST1020|ST1021|ST1022)"
      # Paths are relative to each module's go.mod.
      - linters:
          - revive
        path-except: "^(app|httpapi|store/sqlstore)/"
      # A line may run long only where breaking it would change its text:
      # a comment, or one long string literal. Tests, conformance suites,
      # seed fixtures and generated code are not held to the limit.
      - linters:
          - lll
        source: '^\s*//|"[^"]{100,}"|`[^`]{100,}'
      - linters:
          - lll
        path: "(_test\\.go$|_gen\\.go$|^store/storetest/|^testlib/|^cmd/ptool/devseed/|^model/attempt_configuration_manifest\\.go$)"
      # Tests, conformance suites and developer commands may run long.
      - linters:
          - funlen
        path: "(_test\\.go$|^store/storetest/|^testlib/|^cmd/ptool/devseed/|^cmd/mailpreview/)"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
