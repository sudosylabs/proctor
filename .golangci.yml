version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - fatcontext
    - funlen
    - gocheckcompilerdirectives
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - misspell
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - testifylint
    - unconvert
    - unused
  settings:
    # A function is bounded by how much it does, not by how many lines it
    # takes: a line limit rewards packing several fields onto one line.
    funlen:
      lines: -1
      statements: 80
      ignore-comments: true
    # A repository package is imported under its own name. The packages
    # listed first share their name with another package some file imports
    # beside them (two mail packages, three memory packages, net/smtp, go-redis),
    # so each has the one alias it takes when a file must tell them apart.
    importas:
      alias:
        - pkg: github.com/sudosylabs/proctor/packages/cache/memory
          alias: memorycache
        - pkg: github.com/sudosylabs/proctor/packages/cache/redis
          alias: rediscache
        - pkg: github.com/sudosylabs/proctor/packages/mail
          alias: mailpkg
        - pkg: github.com/sudosylabs/proctor/packages/mail/memory
          alias: memorymail
        - pkg: github.com/sudosylabs/proctor/packages/mail/smtp
          alias: mailsmtp
        - pkg: github.com/sudosylabs/proctor/packages/vfs/local
          alias: localvfs
        - pkg: github.com/sudosylabs/proctor/packages/vfs/memory
          alias: memoryvfs
        - pkg: github.com/sudosylabs/proctor/server/app/mail
          alias: appmail
        - pkg: github.com/sudosylabs/proctor/(?:[\w/]+/)?(\w+)
          alias: $1
    lll:
      line-length: 160
    # US spelling in comments and strings ("canceled", "behavior").
    # Programme is the glossary's term, catalogue is the spelling of the
    # catalogue identifiers and file names, and dialogue is correct US usage.
    misspell:
      locale: US
      ignore-rules:
        - programme
        - programmes
        - catalogue
        - catalogues
        - catalogued
        - uncatalogued
        - dialogue
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        # Exported application, HTTP, and SQL Store declarations carry a doc
        # comment that starts with their name. The exclusion rules below scope
        # this rule to those packages.
        - name: exported
          arguments:
            - disableStutteringCheck
        # One receiver name per type, at most three letters, never self or
        # this. staticcheck ST1016 reports mixed names as well.
        - name: receiver-naming
          arguments:
            - max-length: 3
        # Initialisms keep one case (userID, apiURL) and names carry no
        # underscores. staticcheck ST1003 covers most declarations; this rule
        # adds locals introduced with :=.
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST1005
    testifylint:
      enable-all: true
      disable:
        # Deterministic tests compare exact float values on purpose.
        - float-compare
        # Canonical encodings are compared byte for byte on purpose.
        - encoded-compare
        # assert error checks stay where a test reports every failure.
        - require-error
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # The staticcheck half of the comments preset: documentation style is
      # enforced by revive's exported rule where it applies.
      - linters:
          - staticcheck
        text: "(ST1000|ST1020|ST1021|ST1022)"
      # Paths are relative to each module's go.mod. The naming rules of
      # revive apply everywhere; only its exported rule is scoped.
      - linters:
          - revive
        path-except: "^(app|httpapi|store/sqlstore)/"
        text: "^exported: "
      # A doc comment is not required where it could only restate a name
      # documented elsewhere: a SQL Store method implements a method the
      # store contract documents, and a Command or Query type is the input
      # of the use case it is named for.
      - linters:
          - revive
        path: "^store/sqlstore/"
        text: "exported method .* should have comment"
      - linters:
          - revive
        text: "exported type \\w+(Command|Query) should have comment"
      # A request cookie serializes only name=value; G124 is about responses.
      - linters:
          - gosec
        path: "_test\\.go$"
        text: "G124"
      # A line may run long only where breaking it would change its text:
      # a comment, or one long string literal. Tests, conformance suites,
      # seed fixtures and generated code are not held to the limit.
      - linters:
          - lll
        source: '^\s*//|"[^"]{100,}"|`[^`]{100,}'
      - linters:
          - lll
        path: "(_test\\.go$|_gen\\.go$|^store/storetest/|^testlib/|^cmd/ptool/devseed/|^model/attempt_configuration_manifest\\.go$)"
      # Tests, conformance suites and developer commands may run long.
      - linters:
          - funlen
        path: "(_test\\.go$|^store/storetest/|^testlib/|^cmd/ptool/devseed/|^cmd/mailpreview/)"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
