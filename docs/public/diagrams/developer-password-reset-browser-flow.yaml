blocks:
  - row:
      - card: Reset link
        text: "The token arrives in the URL fragment, `#token=…`"
      - card: Clean the URL
        text: Removes the whole fragment from history, then reads one token
        accent: true
      - card: Ready form
        text: Keeps the token out of the page and out of storage
      - card: Send
        text: Posts only the token and password. The confirmation stays local.
  - row:
      - card: Complete
        text: Clears the token and fields, shows the done task, focuses its heading
      - card: Unusable link
        text: Clears the token and fields, shows one way to recover
      - card: Try again
        text: Keeps safe input and shows the error beside its field or the button
    links: none
    from:
      - {from: 4, to: 1, label: "`204`"}
      - {from: 4, to: 2}
      - {from: 4, to: 3}
