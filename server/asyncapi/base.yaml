asyncapi: '3.0.0'
info:
  title: Proctor Realtime API
  version: '1.0.0'
  description: The messages of the authenticated WebSocket at /api/v1/websocket. The HTTP upgrade itself is the OpenAPI operation connectWebSocket. Realtime events tell an interface that something changed; durable HTTP resources remain the authority.
defaultContentType: application/json
servers:
  proctor:
    host: proctor.example.edu
    protocol: wss
    description: One Proctor installation. Replace the host with the installation's public origin.
