          - $ref: '../../../schemas/realtime/event_frame.json'
          - type: object
            required:
              - event
              - action
              - data
            properties:
              event:
                type: string
                const: exam_attempt_connection_opened
              action:
                type: string
                const: exam.sitting.view
              data:
                $ref: '../../../schemas/realtime/exam_attempt_connection_changed.json'
