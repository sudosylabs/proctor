# Exam authoring events, sent to subscribers holding exam.view.
components:
  messages:
    exam_created:
      name: exam_created
      title: Exam created
      summary: An Exam was created. The event has no data.
      description: An Exam was created. The event has no data. Delivered to connections that subscribe to exam.view on the exam.
      tags:
        - name: event
        - name: Exams
      payload:
        allOf:
          - $ref: '../../../schemas/realtime/event_frame.json'
          - type: object
            required:
              - event
              - action
            properties:
              event:
                type: string
                const: exam_created
              action:
                type: string
                const: exam.view
            not:
              required:
                - data
      examples:
        - name: example
          payload:
            id: '8kpous3h9nfemqtwz47ydgjcx1'
            event: exam_created
            sequence: 40
            action: exam.view
            resource:
              type: exam
              id: ia56br8kpous3h9nfemqtwz47y
    exam_draft_updated:
