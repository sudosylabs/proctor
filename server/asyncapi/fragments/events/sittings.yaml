        - name: event
        - name: Sittings
      payload:
        allOf:
          - $ref: '../../../schemas/realtime/event_frame.json'
          - type: object
            required:
              - event
              - user_id
              - data
            properties:
              event:
                type: string
                const: candidate.exam_activity.changed
              data:
                $ref: '../../../schemas/realtime/collection_invalidation.json'
