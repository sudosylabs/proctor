                type: string
                const: exam_sitting_schedule_updated
              action:
                type: string
                const: exam.sitting.view
              data:
                $ref: '../../../schemas/realtime/exam_sitting_changed.json'
      examples:
        - name: example
          payload:
            id: '8kpous3h9nfemqtwz47ydgjcx1'
            event: exam_sitting_schedule_updated
            sequence: 41
            action: exam.sitting.view
            resource:
              type: exam_sitting
              id: h9nfemqtwz47ydgjcx1ia56br8
            data:
              exam_id: ia56br8kpous3h9nfemqtwz47y
              exam_sitting_id: h9nfemqtwz47ydgjcx1ia56br8
              state: scheduled
              revision: 2
              changed_at: '2026-08-01T09:30:00Z'
    exam_sitting_canceled:
      name: exam_sitting_canceled
      title: Sitting canceled
      summary: A Sitting was canceled before it opened.
      description: A Sitting was canceled before it opened. Delivered to connections that subscribe to exam.sitting.view on the exam sitting.
      tags:
        - name: event
        - name: Sittings
      payload:
        allOf:
          - $ref: '../../../schemas/realtime/event_frame.json'
          - type: object
            required:
              - event
              - action
              - data
            properties:
              event:
                type: string
                const: exam_sitting_canceled
              action:
                type: string
                const: exam.sitting.view
              data:
                $ref: '../../../schemas/realtime/exam_sitting_changed.json'
      examples:
        - name: example
          payload:
            id: '8kpous3h9nfemqtwz47ydgjcx1'
            event: exam_sitting_canceled
            sequence: 42
            action: exam.sitting.view
            resource:
              type: exam_sitting
              id: h9nfemqtwz47ydgjcx1ia56br8
            data:
              exam_id: ia56br8kpous3h9nfemqtwz47y
              exam_sitting_id: h9nfemqtwz47ydgjcx1ia56br8
              state: canceled
              revision: 3
              changed_at: '2026-08-01T09:30:00Z'
    exam_sitting_lifecycle_changed:
      name: exam_sitting_lifecycle_changed
      title: Sitting lifecycle changed
      summary: A Sitting opened, paused, resumed, was extended, or closed. Sent to Sitting viewers.
      description: A Sitting opened, paused, resumed, was extended, or closed. Sent to Sitting viewers. Delivered to connections that subscribe to exam.sitting.view on the exam sitting.
      tags:
        - name: event
        - name: Sittings
      payload:
        allOf:
          - $ref: '../../../schemas/realtime/event_frame.json'
          - type: object
