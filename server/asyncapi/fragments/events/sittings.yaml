    manager.sitting_board.changed:
      name: manager.sitting_board.changed
      title: Sitting board changed
      summary: Refetch the manager board of one Sitting.
      description: Refetch the manager board of one Sitting. Delivered to connections that subscribe to exam.sitting.view on the exam sitting.
