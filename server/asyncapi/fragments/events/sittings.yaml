# Sitting events and the board and activity invalidations.
components:
  messages:
    exam_sitting_scheduled:
      name: exam_sitting_scheduled
      title: Sitting scheduled
      summary: A Sitting was scheduled.
      description: A Sitting was scheduled. Delivered to connections that subscribe to exam.sitting.view on the exam sitting.
      tags:
        - name: event
        - name: Sittings
      payload:
        allOf:
          - $ref: '../../../schemas/realtime/event_frame.json'
          - type: object
            required:
              - event
              - action
              - data
            properties:
              event:
                type: string
                const: exam_sitting_scheduled
              action:
                type: string
                const: exam.sitting.view
              data:
                $ref: '../../../schemas/realtime/exam_sitting_changed.json'
      examples:
        - name: example
          payload:
            id: '8kpous3h9nfemqtwz47ydgjcx1'
            event: exam_sitting_scheduled
            sequence: 40
            action: exam.sitting.view
            resource:
              type: exam_sitting
              id: h9nfemqtwz47ydgjcx1ia56br8
            data:
              exam_id: ia56br8kpous3h9nfemqtwz47y
              exam_sitting_id: h9nfemqtwz47ydgjcx1ia56br8
              state: scheduled
              revision: 1
              changed_at: '2026-08-01T09:30:00Z'
    exam_sitting_schedule_updated:
      name: exam_sitting_schedule_updated
      title: Sitting schedule updated
      summary: A scheduled Sitting's Exam Revision, Class, start or end changed.
      description: A scheduled Sitting's Exam Revision, Class, start or end changed. Delivered to connections that subscribe to exam.sitting.view on the exam sitting.
      tags:
        - name: event
        - name: Sittings
      payload:
        allOf:
          - $ref: '../../../schemas/realtime/event_frame.json'
          - type: object
            required:
              - event
              - action
              - data
            properties:
