              exam_sitting_id: h9nfemqtwz47ydgjcx1ia56br8
              state: paused
              revision: 5
              reason_code: manager_paused
              scheduled_end_at: '2026-08-01T11:00:00Z'
              changed_at: '2026-08-01T09:30:00Z'
    exam_sitting_content_corrected:
      name: exam_sitting_content_corrected
      title: Sitting content corrected
      summary: A live correction moved the Sitting to another Exam Revision. Sent to Sitting viewers.
      description: A live correction moved the Sitting to another Exam Revision. Sent to Sitting viewers. Delivered to connections that subscribe to exam.sitting.view on the exam sitting.
