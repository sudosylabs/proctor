              - data
            properties:
              event:
                type: string
                const: exam_sitting_content_corrected
              action:
                type: string
                const: exam.sitting.participate
              data:
                $ref: '../../../schemas/realtime/exam_sitting_content_corrected.json'
      examples:
        - name: example
          payload:
            id: '8kpous3h9nfemqtwz47ydgjcx1'
            event: exam_sitting_content_corrected
            sequence: 46
            action: exam.sitting.participate
            resource:
              type: exam_sitting
