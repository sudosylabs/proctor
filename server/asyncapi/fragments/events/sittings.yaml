              exam_id: ia56br8kpous3h9nfemqtwz47y
              exam_sitting_id: h9nfemqtwz47ydgjcx1ia56br8
              state: paused
              revision: 5
              reason_code: manager_paused
              scheduled_end_at: '2026-08-01T11:00:00Z'
              changed_at: '2026-08-01T09:30:00Z'
    exam_sitting_lifecycle_changed_for_candidate:
      name: exam_sitting_lifecycle_changed
