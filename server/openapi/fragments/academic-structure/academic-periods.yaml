paths:
  /api/v1/academic-periods:
    get:
      operationId: listAcademicPeriods
      summary: List or search Academic Periods visible through authorized owner scopes
      tags:
        - Academic structure
      description: >-
        Lists the Academic Periods the caller can see through permissions on the Institution or on Academic Units, ordered by `sort` and `dir`: by default by start time, then name, then identifier, oldest first. An Academic Period is a span of academic time, such as a year or semester. Seeing one gives no access to its Classes or students. Each item carries `class_count`, the active Classes of the Period that you hold class.view on, counted up to 10,000, with `class_count_is_lower_bound`; both are omitted if you hold class.view nowhere.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Text to find in the Academic Period name or display name, matched literally and ignoring case.
          schema:
            type: string
        - name: owner_type
          in: query
          required: false
          description: Keeps the Academic Periods of one kind of owner. Filters only narrow what you can already see.
          schema:
            type: string
            enum:
              - institution
              - academic_unit
        - name: owner_id
          in: query
          required: false
          description: Keeps the Academic Periods of this owner. It needs `owner_type`.
          schema:
            $ref: '#/components/schemas/ID'
        - name: active_at
          in: query
          required: false
          description: Keeps the Academic Periods covering this instant, from `start_at` up to but not including `end_at`.
          schema:
            type: string
            format: date-time
        - name: overlaps_from
          in: query
          required: false
          description: >-
            Keeps the Academic Periods that share an instant with the range from this instant, an RFC 3339 date-time.
            A period overlaps when it ends after `overlaps_from` and, if `overlaps_until` is given, starts before it.
            Use it with `overlaps_until` to list a calendar or academic year.
          schema:
            type: string
            format: date-time
        - name: overlaps_until
          in: query
          required: false
          description: >-
            Ends the overlap range, exclusive, an RFC 3339 date-time. A period overlaps when it starts before
            `overlaps_until` and, if `overlaps_from` is given, ends after it. With both given, it must be later than
            `overlaps_from`.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: >-
            The page order, each key followed by identifier: `start` (start time, then name, the default) or `name`.
            A cursor only continues the sort and direction that produced it, so repeat both when following it.
          schema:
            type: string
            enum:
              - start
              - name
            default: start
        - name: dir
          in: query
          required: false
          description: The direction of `sort`.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/AcademicPeriodListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAcademicPeriod
      summary: Create an Institution- or Academic-Unit-owned Academic Period
      tags:
        - Academic structure
      description: >-
        Creates an Academic Period owned by the Institution or by one Academic Unit. The caller needs permission on that owner itself. `start_at` is included in the Period and `end_at` is not. Both are RFC 3339 times. Send an Idempotency-Key so a retry after an unclear failure can't create a second Period.
      x-proctor-auth: principal_required
      x-proctor-idempotency: optional
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_period.invalid
        - academic_period.conflict
        - administration.unavailable
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicPeriod'
      responses:
        "201":
          $ref: '#/components/responses/AcademicPeriodCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/academic-periods/{academic_period_id}:
    parameters:
      - $ref: '#/components/parameters/AcademicPeriodID'
    get:
      operationId: getAcademicPeriod
      summary: Get an Academic Period
      tags:
        - Academic structure
      description: >-
        Returns one Academic Period when the caller can see its owner. The response gives its owner and start and end times. It does not give access to the Classes that run in it.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AcademicPeriodOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateAcademicPeriod
      summary: Update an Academic Period without changing its owner
      tags:
        - Academic structure
      description: >-
        Changes some of an Academic Period's display fields or its start and end times. Its owner stays the same. Proctor rejects new times that would break the Classes and memberships that depend on the Period or that conflict with its current saved state.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_period.invalid
        - academic_period.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateAcademicPeriod'
      responses:
        "200":
          $ref: '#/components/responses/AcademicPeriodOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      requestBody:
        $ref: '#/components/requestBodies/ArchiveAcademic'
      operationId: archiveAcademicPeriod
      summary: Archive an Academic Period with no active Classes or enrollments
      tags:
        - Academic structure
      description: >-
        Archives one Academic Period, but only when no active Class or enrollment still depends on it. Its history is kept. Archiving never deletes Classes, ends memberships or moves students on.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/academic-periods/<academic-period-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_period.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/AcademicPeriodArchived'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    AcademicPeriodID:
      name: academic_period_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Academic Period identifier.
  requestBodies:
    CreateAcademicPeriod:
      description: The owner, machine name, display text and RFC 3339 start and end times for a new Academic Period.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAcademicPeriodRequest'
          example:
            owner_type: institution
            owner_id: ybndrfg8ejkmcpqxot1uwisza3
            name: 2026-2027
            display_name: 2026–2027
            start_at: '2026-08-01T00:00:00Z'
            end_at: '2027-07-31T23:59:59Z'
    UpdateAcademicPeriod:
      description: The Academic Period display fields or times to change. Its owner can't change.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateAcademicPeriodRequest'
          example:
            display_name: Academic Year 2026–2027
            end_at: '2027-08-31T23:59:59Z'
  responses:
    AcademicPeriodOK:
      description: Academic Period
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicPeriodResponse'
          example:
            revision: 2
            id: sjebyge5cpbop1xwo4eds74ejb
            created_at: '2026-07-15T09:00:00Z'
            updated_at: '2026-07-28T10:30:00Z'
            owner_type: institution
            owner_id: wj3drgzdpnf54rxf5d8qd3dqne
            name: 2026-2027
            display_name: Academic Year 2026–2027
            description: Academic year 2026 to 2027.
            start_at: '2026-08-01T00:00:00Z'
            end_at: '2027-09-01T00:00:00Z'
    AcademicPeriodCreated:
      description: Academic Period created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicPeriodResponse'
          example:
            revision: 1
            id: sjebyge5cpbop1xwo4eds74ejb
            created_at: '2026-07-15T09:00:00Z'
            updated_at: '2026-07-15T09:00:00Z'
            owner_type: institution
            owner_id: wj3drgzdpnf54rxf5d8qd3dqne
            name: 2026-2027
            display_name: 2026–2027
            description: Academic year 2026 to 2027.
            start_at: '2026-08-01T00:00:00Z'
            end_at: '2027-08-01T00:00:00Z'
    AcademicPeriodListOK:
      description: Academic Period collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicPeriodListResponse'
          example:
            items:
              - revision: 1
                id: sjebyge5cpbop1xwo4eds74ejb
                created_at: '2026-07-15T09:00:00Z'
                updated_at: '2026-07-15T09:00:00Z'
                owner_type: institution
                owner_id: wj3drgzdpnf54rxf5d8qd3dqne
                name: 2026-2027
                display_name: 2026–2027
                description: Academic year 2026 to 2027.
                start_at: '2026-08-01T00:00:00Z'
                end_at: '2027-08-01T00:00:00Z'
                class_count: 24
                class_count_is_lower_bound: false
              - revision: 1
                id: hmyjmj68dw6gdxctnghbrhwcth
                created_at: '2026-07-20T14:00:00Z'
                updated_at: '2026-07-20T14:00:00Z'
                owner_type: academic_unit
                owner_id: 14j8umgczgrdp95w77zuxmxfu9
                name: 2026-2027-semester-2
                display_name: Semester 2, 2026–2027
                description: ''
                start_at: '2027-01-11T00:00:00Z'
                end_at: '2027-06-01T00:00:00Z'
            next_cursor: eyJzdGFydF9hdCI6IjIwMjctMDEtMTFUMDA6MDA6MDBaIiwibmFtZSI6IjIwMjYtMjAyNy1zZW1lc3Rlci0yIiwiaWQiOiJobXlqbWo2OGR3NmdkeGN0bmdoYnJod2N0aCIsInNvcnQiOiJzdGFydCIsImRpciI6ImFzYyJ9
    AcademicPeriodArchived:
      description: Academic Period archived
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
  schemas:
    AcademicPeriodResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - owner_type
        - owner_id
        - name
        - display_name
        - description
        - start_at
        - end_at
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Starts at 1 and goes up with every change. Send it as `expected_revision` on an update or archive so the
            change fails if someone else changed the Academic Period first.
        id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period identifier.
        created_at:
          type: string
          format: date-time
          description: When the Academic Period was created.
        updated_at:
          type: string
          format: date-time
          description: When the Academic Period last changed.
        archived_at:
          type: string
          format: date-time
          description: When the Academic Period was archived. Omitted while it is active.
        owner_type:
          type: string
          enum:
            - institution
            - academic_unit
          description: Whether the Institution or an Academic Unit owns the Academic Period. It can't change.
        owner_id:
          $ref: '#/components/schemas/ID'
          description: The identifier of the Institution or Academic Unit that owns the Academic Period.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Unique among
            the owner's active Academic Periods.
        display_name:
          type: string
          description: Name shown to people, up to 128 characters.
        description:
          type: string
          description: Longer text shown to people, up to 1,024 characters. Empty when none was given.
        start_at:
          type: string
          format: date-time
          description: When the Academic Period starts. This instant is part of the Period.
        end_at:
          type: string
          format: date-time
          description: When the Academic Period ends. This instant is not part of the Period, and it is always after `start_at`.
        class_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            On a listed Academic Period only: how many of its active Classes you hold class.view on. Absent if you
            hold class.view nowhere. It is exact below 10,000; at 10,000 counting stops and
            `class_count_is_lower_bound` is true.
        class_count_is_lower_bound:
          type: boolean
          description: True when `class_count` stopped at 10,000. Present with `class_count`.
    AcademicPeriodListResponse:
      description: One page of Academic Periods in the requested sort order and direction.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AcademicPeriodResponse'
          description: The Academic Periods on this page.
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CreateAcademicPeriodRequest:
      description: The owner, display fields and time span for a new Academic Period.
      type: object
      additionalProperties: false
      required:
        - owner_type
        - owner_id
        - name
        - display_name
        - start_at
        - end_at
      properties:
        owner_type:
          type: string
          enum:
            - institution
            - academic_unit
          description: Whether the Institution or an Academic Unit owns the new Academic Period.
        owner_id:
          $ref: '#/components/schemas/ID'
          description: The identifier of the Institution or Academic Unit named by `owner_type`.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, starting with a letter or digit, at
            most 64 characters. It must be unique among the owner's active Academic Periods.
        display_name:
          type: string
          description: Name shown to people, 1 to 128 characters.
        description:
          type: string
          description: Optional longer text shown to people, up to 1,024 characters.
        start_at:
          type: string
          format: date-time
          description: When the Academic Period starts. This instant is part of the Period.
        end_at:
          type: string
          format: date-time
          description: When the Academic Period ends. This instant is not part of the Period, and it must be after `start_at`.
    UpdateAcademicPeriodRequest:
      description: The Academic Period fields you can change. Fields you leave out or send as null stay as they are, except where noted.
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional. The `revision` from your last read. If the Academic Period has changed since, the request fails
            with `academic_period.conflict` and nothing changes. Without it, the change applies whatever the current
            revision. Null is rejected.
        name:
          type:
            - string
            - "null"
          description: >-
            New machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. It must be
            unique among the owner's active Academic Periods. Omitted or null leaves it unchanged. An empty string is rejected.
        display_name:
          type:
            - string
            - "null"
          description: >-
            New name shown to people, 1 to 128 characters. Omitted or null leaves it unchanged. An empty string is
            rejected.
        description:
          type:
            - string
            - "null"
          description: >-
            New longer text, up to 1,024 characters. Omitted or null leaves it unchanged. An empty string clears
            it.
        start_at:
          type: string
          format: date-time
          description: New start time, which is part of the Period. Omitted leaves it unchanged. Null is rejected.
        end_at:
          type: string
          format: date-time
          description: New end time, which is not part of the Period and must be after the start. Omitted leaves it unchanged. Null is rejected.
