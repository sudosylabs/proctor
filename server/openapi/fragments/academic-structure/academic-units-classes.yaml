paths:
  /api/v1/academic-units/{academic_unit_id}/classes:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: searchClasses
      summary: Search Classes owned by an Academic Unit
      tags:
        - Academic structure
      description: >-
        Searches the active Classes under the active Programmes this Academic Unit owns directly. The caller needs class.view on the Academic Unit. Results describe the Classes only: they never enroll students or give the caller permission on a Class. Items are ordered by name, then by identifier, in the `dir` direction. The first page, read without a cursor, also reports `total`, the number of Classes the filters match across every page. It is exact below 10,000. At 10,000 counting stops and `total_is_lower_bound` is true. Later pages carry no total, so keep the first page's. Each item carries `student_count`, the Class's current members counted up to 10,000, with `student_count_is_lower_bound`, but only when the caller holds class.members.view on this Academic Unit. Otherwise both are omitted.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Text to find in the Class name or display name, matched literally and ignoring case.
          schema:
            type: string
        - name: dir
          in: query
          required: false
          description: >-
            Sort by name, then by identifier, ascending (`asc`, the default) or descending (`desc`). A cursor works
            only with the direction that produced it.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/ClassListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
