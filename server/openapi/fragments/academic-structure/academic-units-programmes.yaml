paths:
  /api/v1/academic-units/{academic_unit_id}/programmes:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: listProgrammes
      summary: List or search Programmes owned by an Academic Unit
      tags:
        - Academic structure
      description: >-
        Lists the active Programmes this Academic Unit owns directly, optionally narrowed by `q`. Programmes of Units further down are not included. List them through those Units. The first page, read without a cursor, also reports `total`, the number of Programmes the filters match across every page. It is exact below 10,000. At 10,000 counting stops and `total_is_lower_bound` is true. Later pages carry no total, so keep the first page's.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Text to find in the Programme name or display name, matched literally and ignoring case.
          schema:
            type: string
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProgramme
      summary: Create a Programme owned by an Academic Unit
      tags:
        - Academic structure
      description: >-
        Creates a Programme owned by the Academic Unit in the path. The caller's management permission is checked again when the request is handled. Creating a Programme does not create Programme Levels, Classes, enrollments, Roles or Role Bindings.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme.invalid
        - programme.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateProgramme'
      responses:
        "201":
          $ref: '#/components/responses/ProgrammeCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateProgramme:
      description: The machine name and display text for a Programme owned by the Academic Unit in the path.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateProgrammeRequest'
          example:
            name: bsc-computer-science
            display_name: BSc Computer Science
            description: Undergraduate computer science programme.
  responses:
    ProgrammeCreated:
      description: Programme created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeResponse'
          example:
            revision: 1
            id: g63dcrphk8idgyjgzbrpajosz6
            created_at: '2026-08-02T09:30:00Z'
            updated_at: '2026-08-02T09:30:00Z'
            academic_unit_id: 14j8umgczgrdp95w77zuxmxfu9
            kind: undergraduate
            name: bsc-computer-science
            display_name: BSc Computer Science
            description: Undergraduate computer science programme.
    ProgrammeListOK:
      description: Programme collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeListResponse'
          example:
            items:
              - revision: 1
                id: g63dcrphk8idgyjgzbrpajosz6
                created_at: '2026-08-02T09:30:00Z'
                updated_at: '2026-08-02T09:30:00Z'
                academic_unit_id: 14j8umgczgrdp95w77zuxmxfu9
                kind: undergraduate
                name: bsc-computer-science
                display_name: BSc Computer Science
                description: Undergraduate computer science programme.
                level_count: 3
                level_count_is_lower_bound: false
                class_count: 9
                class_count_is_lower_bound: false
                student_count: 412
                student_count_is_lower_bound: false
              - revision: 2
                id: 889766ufjgio6kbpzjbufozksq
                created_at: '2026-08-02T09:40:00Z'
                updated_at: '2026-08-15T13:05:00Z'
                academic_unit_id: 14j8umgczgrdp95w77zuxmxfu9
                kind: postgraduate
                name: msc-data-science
                display_name: MSc Data Science
                description: Taught postgraduate programme in data science.
            total: 2
            total_is_lower_bound: false
  schemas:
    ProgrammeListResponse:
      description: One page of Programmes, ordered by name and then by identifier. Only the first page carries the total.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProgrammeResponse'
          description: The Programmes on this page.
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many Programmes match the filters across every page. Present only on the first page. Counting stops
            at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached 10,000 and there may be more. Present with `total`.
    CreateProgrammeRequest:
      description: The machine name and display text for a new Programme.
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
      properties:
        kind:
          $ref: '#/components/schemas/ProgrammeKind'
          description: Optional. The kind of Programme. Omitted or empty means `other`.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, starting with a letter or digit, at
            most 64 characters. It must be unique among the Academic Unit's active Programmes.
        display_name:
          type: string
          description: Name shown to people, 1 to 128 characters.
        description:
          type: string
          description: Optional longer text shown to people, up to 1,024 characters.
