paths:
  /api/v1/academic-units:
    get:
      operationId: listAcademicUnits
      summary: List or search Academic Units
      tags:
        - Academic structure
      description: >-
        Without `q`, lists the top-level Academic Units of the Institution. With `q`, searches every active Academic Unit in the Institution whose name or display name contains the text, ignoring case. Both need academic_unit.view on the Institution. Seeing an Academic Unit does not let the caller change it. Results come in pages ordered by name and then by identifier, at most `limit` per page.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body --get \
              --url 'https://proctor.example.edu/api/v1/academic-units' \
              --header 'Authorization: Bearer <access-token>' \
              --header 'Accept: application/json' \
              --data-urlencode 'q=computer' \
              --data-urlencode 'limit=50'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - administration.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Text to find in the name or display name, matched literally and ignoring case. Without it, only
            top-level Academic Units are listed.
          schema:
            type: string
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createRootAcademicUnit
      summary: Create a root Academic Unit
      tags:
        - Academic structure
      description: >-
        Creates a top-level Academic Unit in the Institution. The caller needs academic_unit.manage on the Institution. Send an Idempotency-Key to make retries safe: a retry with the same key and body returns the first result, and the same key with a different body is a conflict. The server sets the new Unit's identifier, timestamps and Institution.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/academic-units' \
              --header 'Authorization: Bearer <access-token>' \
              --header 'Content-Type: application/json' \
              --header 'Idempotency-Key: docs-academic-unit-001' \
              --data '{"name":"computer-science","display_name":"Computer Science","description":"Teaching and research in computing."}'
      x-proctor-auth: principal_required
      x-proctor-idempotency: optional
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - academic_unit.invalid
        - academic_unit.conflict
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicUnit'
      responses:
        "201":
          $ref: '#/components/responses/AcademicUnitCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/academic-units/{academic_unit_id}:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: getAcademicUnit
      summary: Get an Academic Unit
      tags:
        - Academic structure
      description: >-
        Returns one Academic Unit when the caller holds academic_unit.view on it. The response names its Institution and parent. It does not include the Units beneath it or any permission grants.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - resource.not_found
        - administration.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateAcademicUnit
      summary: Update or reparent an Academic Unit
      tags:
        - Academic structure
      description: >-
        Changes some of an Academic Unit's fields and can move it under another parent. A move needs management permission on both the Unit and its new parent, or on the Institution when it becomes top-level. Proctor rejects the whole change if it would create a cycle, cross Institutions, rely on out-of-date data or break the hierarchy in any other way. Nothing is applied in that case.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit.invalid
        - academic_unit.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateAcademicUnit'
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      requestBody:
        $ref: '#/components/requestBodies/ArchiveAcademic'
      operationId: archiveAcademicUnit
      summary: Archive an Academic Unit
      tags:
        - Academic structure
      description: >-
        Archives one empty Academic Unit and keeps its place in the hierarchy and its audit history. Proctor does not archive anything beneath it: if the Unit still has active child Units, Programmes, memberships or permission grants, the request fails instead.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/academic-units/<academic-unit-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/AcademicUnitArchived'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateAcademicUnit:
      description: >-
        The Academic Unit fields to change, and optionally a new parent. Fields you leave out or send as null stay
        as they are.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateAcademicUnitRequest'
          example:
            display_name: School of Computer Science
            description: Computing teaching and research.
  responses:
    AcademicUnitOK:
      description: Academic Unit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitResponse'
          example:
            revision: 3
            id: 14j8umgczgrdp95w77zuxmxfu9
            created_at: '2026-08-01T09:00:00Z'
            updated_at: '2026-08-12T11:45:00Z'
            institution_id: wj3drgzdpnf54rxf5d8qd3dqne
            kind: department
            parent_id: ih1r84kij94nrwis97rft6rduh
            name: computer-science
            display_name: School of Computer Science
            description: Computing teaching and research.
            member_count: 412
            member_count_is_lower_bound: false
            member_counts_by_affiliation:
              student: 376
              student_is_lower_bound: false
              staff: 36
              staff_is_lower_bound: false
              teacher: 21
              teacher_is_lower_bound: false
              external: 0
              external_is_lower_bound: false
            administrators:
              - id: 4ufo8k7p1h3m5bxj9y6rqwtzse
                display_name: Priya Raman
                username: praman
                profile_picture_url: /api/v1/users/4ufo8k7p1h3m5bxj9y6rqwtzse/profile-picture
              - id: n3c8xa5hk1ymqpz7rj6wtf4ub9
                display_name: Ahmed Farouk
            administrators_more: 0
    AcademicUnitArchived:
      description: Academic Unit archived
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
  schemas:
    UpdateAcademicUnitRequest:
      description: The Academic Unit fields you can change, including a move to another parent.
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional. The `revision` from your last read. If the Academic Unit has changed since, the request fails
            with `academic_unit.conflict` and nothing changes. Without it, the change applies whatever the current
            revision. Null is rejected.
        parent_id:
          type:
            - string
            - "null"
          pattern: ^$|^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
          description: >-
            The Academic Unit to move this one under. An empty string makes it top-level. Omitted or null leaves the
            parent unchanged.
        kind:
          type:
            - string
            - "null"
          enum:
            - faculty
            - school
            - department
            - office
            - other
            - null
          description: The new kind of Academic Unit. Omitted or null leaves it unchanged.
        name:
          type:
            - string
            - "null"
          description: >-
            New machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Omitted or
            null leaves it unchanged. An empty string is checked like any other value, so it is rejected.
        display_name:
          type:
            - string
            - "null"
          description: >-
            New name shown to people, 1 to 128 characters. Omitted or null leaves it unchanged. An empty string is
            rejected.
        description:
          type:
            - string
            - "null"
          description: >-
            New longer text, up to 1,024 characters. Omitted or null leaves it unchanged. An empty string clears
            it.
