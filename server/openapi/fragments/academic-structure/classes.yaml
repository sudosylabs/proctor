paths:
  /api/v1/classes/{class_id}:
    parameters:
      - $ref: '#/components/parameters/ClassID'
    get:
      operationId: getClass
      summary: Get a Class using exact Class scope authorization
      tags:
        - Academic structure
      description: >-
        Returns one active Class. Proctor checks the caller's permission on this Class itself. Being able to list Classes elsewhere is not enough. The response names its Programme Level and Academic Period and does not include its students. A caller who holds class.members.view on the Class also gets its first three teachers.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ClassDetailOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateClass
      summary: Update a Class and optionally move its parent references
      tags:
        - Academic structure
      description: >-
        Changes some of a Class's fields. It can also move the Class to another Programme Level or Academic Period when the caller is allowed to and the target can take it. The Class's membership history is kept, and Proctor checks again that its members' Academic Period rules still hold.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.invalid
        - class.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateClass'
      responses:
        "200":
          $ref: '#/components/responses/ClassOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      requestBody:
        $ref: '#/components/requestBodies/ArchiveAcademic'
      operationId: archiveClass
      summary: Archive a Class with no active members or role bindings
      tags:
        - Academic structure
      description: >-
        Archives one Class, but only when it has no active members or Role Bindings. Past enrollment and audit records are kept. Archiving never ends a membership or Role Binding for you.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/classes/<class-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/ClassArchived'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateClass:
      description: The Class fields to change, including its Programme Level or Academic Period.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateClassRequest'
          example:
            display_name: Computer Science Level 100 — B
            academic_period_id: ybndrfg8ejkmcpqxot1uwisza3
  responses:
    ClassOK:
      description: Class
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassResponse'
          example:
            revision: 2
            id: 6xoche483hwrx5rpu8jzjoe7qg
            created_at: '2026-08-05T08:30:00Z'
            updated_at: '2026-08-18T12:00:00Z'
            programme_level_id: iqcx3qc9sbbt6ocshszfqgq6ci
            academic_period_id: sjebyge5cpbop1xwo4eds74ejb
            name: cs-level-100-a
            display_name: Computer Science Level 100 — B
            description: First-year Class A.
    ClassDetailOK:
      description: Class
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassDetailResponse'
          example:
            revision: 2
            id: 6xoche483hwrx5rpu8jzjoe7qg
            created_at: '2026-08-05T08:30:00Z'
            updated_at: '2026-08-18T12:00:00Z'
            programme_level_id: iqcx3qc9sbbt6ocshszfqgq6ci
            academic_period_id: sjebyge5cpbop1xwo4eds74ejb
            name: cs-level-100-a
            display_name: Computer Science Level 100 — B
            description: First-year Class A.
            teachers:
              - id: 3n9ki8z1o5xkw7yq4m6rtbh5ce
                display_name: Priya Raman
                username: praman
                profile_picture_url: /api/v1/users/3n9ki8z1o5xkw7yq4m6rtbh5ce/profile-picture
            teachers_more: 0
    ClassArchived:
      description: Class archived
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
  schemas:
    UpdateClassRequest:
      description: The Class fields you can change. Fields you leave out or send as null stay as they are.
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional. The `revision` from your last read. If the Class has changed since, the request fails
            with `class.conflict` and nothing changes. Without it, the change applies whatever the current
            revision. Null is rejected.
        programme_level_id:
          type:
            - string
            - "null"
          description: The Programme Level to move the Class to. Omitted or null leaves it unchanged.
        academic_period_id:
          type:
            - string
            - "null"
          description: The Academic Period to move the Class to. Omitted or null leaves it unchanged.
        name:
          type:
            - string
            - "null"
          description: >-
            New machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. It must be
            unique among active Classes with the same Programme Level and Academic Period. Omitted or null leaves it unchanged. An empty string is rejected.
        display_name:
          type:
            - string
            - "null"
          description: >-
            New name shown to people, 1 to 128 characters. Omitted or null leaves it unchanged. An empty string is
            rejected.
        description:
          type:
            - string
            - "null"
          description: >-
            New longer text, up to 1,024 characters. Omitted or null leaves it unchanged. An empty string clears
            it.
