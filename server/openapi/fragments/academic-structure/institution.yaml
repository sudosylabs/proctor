paths:
  /api/v1/institution:
    get:
      operationId: getInstitution
      summary: Get the installation Institution
      tags:
        - Academic structure
      description: >-
        Returns the one Institution this Proctor installation serves, to a caller allowed to see it. An installation always serves exactly one Institution. The response contains no deployment secrets or infrastructure settings.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/InstitutionOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateInstitution
      summary: Update the installation Institution
      tags:
        - Academic structure
      description: >-
        Changes some of the Institution's name and display fields or its Exam capacity limits. The caller needs permission on the whole Institution. The update can't change the installation's identity, add another Institution or change the identifiers of anything the Institution owns.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - institution.invalid
        - institution.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateInstitution'
      responses:
        "200":
          $ref: '#/components/responses/InstitutionOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateInstitution:
      description: The Institution fields to change. Fields you leave out or send as null stay as they are.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateInstitutionRequest'
          example:
            display_name: Northbridge University
            description: Teaching, learning, and examination services.
  responses:
    InstitutionOK:
      description: Installation Institution
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InstitutionResponse'
          example:
            id: wj3drgzdpnf54rxf5d8qd3dqne
            created_at: '2026-07-01T08:00:00Z'
            updated_at: '2026-08-14T09:30:00Z'
            name: northbridge
            display_name: Northbridge University
            description: Teaching, learning, and examination services.
            exam_capacity:
              resource_maximum_count: 10
              resource_maximum_bytes: 10485760
              workspace_maximum_entries: 500
              workspace_maximum_file_bytes: 10485760
              workspace_maximum_total_bytes: 52428800
  schemas:
    UpdateInstitutionRequest:
      description: The Institution fields you can change. Fields you leave out or send as null stay as they are.
      type: object
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
          description: >-
            New machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Omitted or
            null leaves it unchanged. An empty string is rejected.
        display_name:
          type:
            - string
            - "null"
          description: >-
            New name shown to people, 1 to 128 characters. Omitted or null leaves it unchanged. An empty string is
            rejected.
        description:
          type:
            - string
            - "null"
          description: >-
            New longer text, up to 1,024 characters. Omitted or null leaves it unchanged. An empty string clears
            it.
        exam_capacity:
          type:
            - object
            - "null"
          additionalProperties: false
          description: >-
            The Institution's Exam capacity limits. Omitted or null leaves them unchanged. An object replaces all five
            limits at once, so send every member. Published Revisions keep the limits they were published with.
          required:
            - resource_maximum_count
            - resource_maximum_bytes
            - workspace_maximum_entries
            - workspace_maximum_file_bytes
            - workspace_maximum_total_bytes
          properties:
            resource_maximum_count:
              type: integer
              minimum: 1
              maximum: 100
              description: Most Exam Resources one Exam may include.
            resource_maximum_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 104857600
              description: Largest size of one Exam Resource, in bytes.
            workspace_maximum_entries:
              type: integer
              minimum: 1
              maximum: 5000
              description: Most entries, files and folders together, one Workspace may hold.
            workspace_maximum_file_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 104857600
              description: Largest size of one Workspace file, in bytes.
            workspace_maximum_total_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 1073741824
              description: Largest combined size of all files in one Workspace, in bytes.
