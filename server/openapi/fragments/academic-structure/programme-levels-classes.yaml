paths:
  /api/v1/programme-levels/{programme_level_id}/classes:
    parameters:
      - $ref: '#/components/parameters/ProgrammeLevelID'
    get:
      parameters:
        - name: dir
          in: query
          required: false
          description: >-
            Sort by name, then by identifier, ascending (`asc`, the default) or descending (`desc`). A cursor works
            only with the direction that produced it.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listClasses
      summary: List Classes for a Programme Level
      tags:
        - Academic structure
      description: >-
        Lists the active Classes of one Programme Level. Each item describes the Class itself and leaves out its roster, candidate Attempts and permission grants. Items are ordered by name, then by identifier, in the `dir` direction. The first page, read without a cursor, also reports `total`, the number of Classes across every page. It is exact below 10,000. At 10,000 counting stops and `total_is_lower_bound` is true. Later pages carry no total, so keep the first page's. Each item carries `student_count`, the Class's current members counted up to 10,000, with `student_count_is_lower_bound`, but only when the caller holds class.members.view on this Programme Level. Otherwise both are omitted.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ClassListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createClass
      summary: Create a Class for a Programme Level and Academic Period
      tags:
        - Academic structure
      description: >-
        Creates a Class, a group of students, under the Programme Level in the path and in the Academic Period named in the body. Proctor checks the Programme Level and the Academic Period before creating it. No student is enrolled automatically.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.invalid
        - class.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateClass'
      responses:
        "201":
          $ref: '#/components/responses/ClassCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateClass:
      description: The Academic Period, machine name and display text for a new Class under the Programme Level in the path.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateClassRequest'
          example:
            academic_period_id: ybndrfg8ejkmcpqxot1uwisza3
            name: cs-level-100-a
            display_name: Computer Science Level 100 — A
            description: First-year Class A.
  responses:
    ClassCreated:
      description: Class created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassResponse'
          example:
            revision: 1
            id: 6xoche483hwrx5rpu8jzjoe7qg
            created_at: '2026-08-05T08:30:00Z'
            updated_at: '2026-08-05T08:30:00Z'
            programme_level_id: iqcx3qc9sbbt6ocshszfqgq6ci
            academic_period_id: sjebyge5cpbop1xwo4eds74ejb
            name: cs-level-100-a
            display_name: Computer Science Level 100 — A
            description: First-year Class A.
  schemas:
    CreateClassRequest:
      description: The Academic Period and display fields for a new Class.
      type: object
      additionalProperties: false
      required:
        - academic_period_id
        - name
        - display_name
      properties:
        academic_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period the Class runs in.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, starting with a letter or digit, at
            most 64 characters. It must be unique among active Classes with the same Programme Level and Academic
            Period.
        display_name:
          type: string
          description: Name shown to people, 1 to 128 characters.
        description:
          type: string
          description: Optional longer text shown to people, up to 1,024 characters.
