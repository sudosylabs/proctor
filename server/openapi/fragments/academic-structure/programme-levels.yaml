paths:
  /api/v1/programme-levels/{programme_level_id}:
    parameters:
      - $ref: '#/components/parameters/ProgrammeLevelID'
    get:
      operationId: getProgrammeLevel
      summary: Get a Programme Level
      tags:
        - Academic structure
      description: >-
        Returns one active Programme Level when the caller can see the Programme and Academic Unit above it. The response does not include its Classes and gives no access to their rosters.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeLevelOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateProgrammeLevel
      summary: Update a Programme Level without changing its Programme owner
      tags:
        - Academic structure
      description: >-
        Changes some of a Programme Level's name and display fields. The Programme that owns it stays the same. Its Classes keep pointing to it, and a change that would break their structure is rejected.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme_level.invalid
        - programme_level.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateProgrammeLevel'
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeLevelOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      requestBody:
        $ref: '#/components/requestBodies/ArchiveAcademic'
      operationId: archiveProgrammeLevel
      summary: Archive a Programme Level that has no active Classes
      tags:
        - Academic structure
      description: >-
        Archives one Programme Level, but only when it has no active Classes. Its history is kept. Archiving never archives Classes, ends enrollments or removes Role Bindings.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/programme-levels/<programme-level-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme_level.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/ProgrammeLevelArchived'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateProgrammeLevel:
      description: The Programme Level fields to change. The Programme that owns it can't change.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProgrammeLevelRequest'
          example:
            display_name: Level 100
            description: First year of the programme.
  responses:
    ProgrammeLevelOK:
      description: Programme Level
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeLevelResponse'
          example:
            revision: 2
            id: iqcx3qc9sbbt6ocshszfqgq6ci
            created_at: '2026-08-03T10:00:00Z'
            updated_at: '2026-08-10T08:20:00Z'
            programme_id: g63dcrphk8idgyjgzbrpajosz6
            name: level-100
            display_name: Level 100
            description: First year of the programme.
    ProgrammeLevelArchived:
      description: Programme Level archived
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
  schemas:
    UpdateProgrammeLevelRequest:
      description: >-
        The Programme Level fields you can change. Fields you leave out or send as null stay as they are. When you
        send `expected_revision`, it must be a positive integer.
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional. The `revision` from your last read. If the Programme Level has changed since, the request fails
            with `programme_level.conflict` and nothing changes. Without it, the change applies whatever the current
            revision. Null is rejected.
        name:
          type:
            - string
            - "null"
          description: >-
            New machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. It must be
            unique among the Programme's active Programme Levels. Omitted or null leaves it unchanged. An empty string is rejected.
        display_name:
          type:
            - string
            - "null"
          description: >-
            New name shown to people, 1 to 128 characters. Omitted or null leaves it unchanged. An empty string is
            rejected.
        description:
          type:
            - string
            - "null"
          description: >-
            New longer text, up to 1,024 characters. Omitted or null leaves it unchanged. An empty string clears
            it.
