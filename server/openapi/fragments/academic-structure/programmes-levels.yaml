paths:
  /api/v1/programmes/{programme_id}/levels:
    parameters:
      - $ref: '#/components/parameters/ProgrammeID'
    get:
      operationId: listProgrammeLevels
      summary: List or search Programme Levels owned by a Programme
      tags:
        - Academic structure
      description: >-
        Lists the active Programme Levels this Programme owns, ordered by name and then by identifier, optionally narrowed by `q`. The list does not include Classes, and seeing it does not give access to Class rosters or permissions. The first page, read without a cursor, also reports `total`, the number of Programme Levels the filters match across every page. It is exact below 10,000. At 10,000 counting stops and `total_is_lower_bound` is true. Later pages carry no total, so keep the first page's.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Text to find in the Programme Level name or display name, matched literally and ignoring case.
          schema:
            type: string
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeLevelListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProgrammeLevel
      summary: Create a Programme Level owned by a Programme
      tags:
        - Academic structure
      description: >-
        Creates a Programme Level owned by the Programme in the path. The caller's management permission is checked again when the request is handled. It does not create Classes, Academic Periods, enrollments or permission grants.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme_level.invalid
        - programme_level.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateProgrammeLevel'
      responses:
        "201":
          $ref: '#/components/responses/ProgrammeLevelCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateProgrammeLevel:
      description: The machine name and display text for a Programme Level owned by the Programme in the path.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateProgrammeLevelRequest'
          example:
            name: level-100
            display_name: Level 100
            description: First year of the programme.
  responses:
    ProgrammeLevelCreated:
      description: Programme Level created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeLevelResponse'
          example:
            revision: 1
            id: iqcx3qc9sbbt6ocshszfqgq6ci
            created_at: '2026-08-03T10:00:00Z'
            updated_at: '2026-08-03T10:00:00Z'
            programme_id: g63dcrphk8idgyjgzbrpajosz6
            name: level-100
            display_name: Level 100
            description: First year of the programme.
    ProgrammeLevelListOK:
      description: Programme Level collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeLevelListResponse'
          example:
            items:
              - revision: 1
                id: iqcx3qc9sbbt6ocshszfqgq6ci
                created_at: '2026-08-03T10:00:00Z'
                updated_at: '2026-08-03T10:00:00Z'
                programme_id: g63dcrphk8idgyjgzbrpajosz6
                name: level-100
                display_name: Level 100
                description: First year of the programme.
              - revision: 1
                id: p6y6sf8ac6m5if373fkkebj7j6
                created_at: '2026-08-03T10:05:00Z'
                updated_at: '2026-08-03T10:05:00Z'
                programme_id: g63dcrphk8idgyjgzbrpajosz6
                name: level-200
                display_name: Level 200
                description: Second year of the programme.
            next_cursor: eyJuYW1lIjoibGV2ZWwtMjAwIiwiaWQiOiJwNnk2c2Y4YWM2bTVpZjM3M2Zra2ViajdqNiIsImRpciI6ImFzYyJ9
            total: 4
            total_is_lower_bound: false
  schemas:
    ProgrammeLevelListResponse:
      description: One page of Programme Levels, ordered by name and then by identifier. Only the first page carries the total.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProgrammeLevelResponse'
          description: The Programme Levels on this page.
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many Programme Levels match the filters across every page. Present only on the first page. Counting
            stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached 10,000 and there may be more. Present with `total`.
    CreateProgrammeLevelRequest:
      description: The machine name and display text for a new Programme Level.
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
      properties:
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, starting with a letter or digit, at
            most 64 characters. It must be unique among the Programme's active Programme Levels.
        display_name:
          type: string
          description: Name shown to people, 1 to 128 characters.
        description:
          type: string
          description: Optional longer text shown to people, up to 1,024 characters.
