paths:
  /api/v1/programmes/{programme_id}:
    parameters:
      - $ref: '#/components/parameters/ProgrammeID'
    get:
      operationId: getProgramme
      summary: Get a Programme
      tags:
        - Academic structure
      description: >-
        Returns one active Programme when the caller can see the Academic Unit that owns it. The response does not include its Programme Levels or Classes.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateProgramme
      summary: Update a Programme without changing its Academic Unit owner
      tags:
        - Academic structure
      description: >-
        Changes some of a Programme's name and display fields. The Academic Unit that owns it stays the same. Its Programme Levels keep belonging to it and are not changed.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme.invalid
        - programme.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateProgramme'
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      requestBody:
        $ref: '#/components/requestBodies/ArchiveAcademic'
      operationId: archiveProgramme
      summary: Archive a Programme that has no active Programme Levels
      tags:
        - Academic structure
      description: >-
        Archives one Programme, but only when it has no active Programme Levels. Its history is kept. Archiving never changes Programme Levels, Classes, enrollments or permissions.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/programmes/<programme-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/ProgrammeArchived'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateProgramme:
      description: The Programme fields to change. The Academic Unit that owns it can't change.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProgrammeRequest'
          example:
            display_name: Bachelor of Science in Computer Science
            description: Undergraduate computer science programme.
  responses:
    ProgrammeOK:
      description: Programme
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeResponse'
          example:
            revision: 2
            id: g63dcrphk8idgyjgzbrpajosz6
            created_at: '2026-08-02T09:30:00Z'
            updated_at: '2026-08-09T15:00:00Z'
            academic_unit_id: 14j8umgczgrdp95w77zuxmxfu9
            kind: undergraduate
            name: bsc-computer-science
            display_name: Bachelor of Science in Computer Science
            description: Undergraduate computer science programme.
    ProgrammeArchived:
      description: Programme archived
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
  schemas:
    UpdateProgrammeRequest:
      description: >-
        The Programme fields you can change. Fields you leave out or send as null stay as they are. When you send
        `expected_revision`, it must be a positive integer.
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Optional. The `revision` from your last read. If the Programme has changed since, the request fails
            with `programme.conflict` and nothing changes. Without it, the change applies whatever the current
            revision. Null is rejected.
        kind:
          type:
            - string
            - "null"
          enum:
            - undergraduate
            - postgraduate
            - other
            - null
          description: The new kind of Programme. Omitted or null leaves it unchanged.
        name:
          type:
            - string
            - "null"
          description: >-
            New machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. It must be
            unique among the Academic Unit's active Programmes. Omitted or null leaves it unchanged. An empty string is rejected.
        display_name:
          type:
            - string
            - "null"
          description: >-
            New name shown to people, 1 to 128 characters. Omitted or null leaves it unchanged. An empty string is
            rejected.
        description:
          type:
            - string
            - "null"
          description: >-
            New longer text, up to 1,024 characters. Omitted or null leaves it unchanged. An empty string clears
            it.
