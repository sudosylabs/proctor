components:
  parameters:
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        A key you choose for this request. If you retry with the same key and the same body within 24 hours,
        Proctor returns the result of the first request instead of acting again. Reusing a key with a different
        body is a conflict. Treat the key as a plain string. The server gives it no other meaning.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
    ProgrammeID:
      name: programme_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Programme identifier.
    ProgrammeLevelID:
      name: programme_level_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Programme Level identifier.
  requestBodies:
    ArchiveAcademic:
      required: false
      description: >-
        Optional. Send `expected_revision` to archive only if the resource has not changed since you read it. If the
        revision is out of date, the request fails with the resource's conflict error and nothing is archived.
        Without a body, the resource is archived whatever its current revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArchiveAcademicRequest'
          example:
            expected_revision: 3
    CreateAcademicUnit:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAcademicUnitRequest'
          example:
            kind: department
            name: computer-science
            display_name: Computer Science
            description: Teaching and research in computing.
      description: >-
        The machine name and display text for the new Academic Unit. The server sets its identifier, timestamps,
        Institution and parent. A body with any other member is rejected with `request.invalid`.
  responses:
    AcademicUnitCreated:
      description: Academic Unit created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitResponse'
          example:
            revision: 1
            id: 14j8umgczgrdp95w77zuxmxfu9
            created_at: '2026-08-01T09:00:00Z'
            updated_at: '2026-08-01T09:00:00Z'
            institution_id: wj3drgzdpnf54rxf5d8qd3dqne
            kind: department
            name: computer-science
            display_name: Computer Science
            description: Teaching and research in computing.
    AcademicUnitListOK:
      description: Academic Unit collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitListResponse'
          example:
            items:
              - revision: 2
                id: 14j8umgczgrdp95w77zuxmxfu9
                created_at: '2026-08-01T09:00:00Z'
                updated_at: '2026-08-03T14:20:00Z'
                institution_id: wj3drgzdpnf54rxf5d8qd3dqne
                kind: department
                parent_id: ih1r84kij94nrwis97rft6rduh
                name: computer-science
                display_name: School of Computer Science
                description: Computing teaching and research.
              - revision: 1
                id: 1asb7sk89dp1ex339fkh3te5t4
                created_at: '2026-08-02T10:15:00Z'
                updated_at: '2026-08-02T10:15:00Z'
                institution_id: wj3drgzdpnf54rxf5d8qd3dqne
                kind: department
                parent_id: ih1r84kij94nrwis97rft6rduh
                name: software-engineering
                display_name: Software Engineering
                description: ''
            next_cursor: eyJuYW1lIjoic29mdHdhcmUtZW5naW5lZXJpbmciLCJpZCI6IjFhc2I3c2s4OWRwMWV4MzM5ZmtoM3RlNXQ0IiwiZGlyIjoiYXNjIn0
    ClassListOK:
      description: Class collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassListResponse'
          example:
            items:
              - revision: 1
                id: 6xoche483hwrx5rpu8jzjoe7qg
                created_at: '2026-08-05T08:30:00Z'
                updated_at: '2026-08-05T08:30:00Z'
                programme_level_id: iqcx3qc9sbbt6ocshszfqgq6ci
                academic_period_id: sjebyge5cpbop1xwo4eds74ejb
                name: cs-level-100-a
                display_name: Computer Science Level 100 — A
                description: First-year Class A.
                student_count: 48
                student_count_is_lower_bound: false
              - revision: 3
                id: 39kqk53i4cswfzbi7hbai1r8qg
                created_at: '2026-08-05T08:35:00Z'
                updated_at: '2026-08-20T16:10:00Z'
                programme_level_id: iqcx3qc9sbbt6ocshszfqgq6ci
                academic_period_id: sjebyge5cpbop1xwo4eds74ejb
                name: cs-level-100-b
                display_name: Computer Science Level 100 — B
                description: First-year Class B.
                student_count: 45
                student_count_is_lower_bound: false
            next_cursor: eyJuYW1lIjoiY3MtbGV2ZWwtMTAwLWIiLCJpZCI6IjM5a3FrNTNpNGNzd2Z6Ymk3aGJhaTFyOHFnIiwiZGlyIjoiYXNjIn0
            total: 6
            total_is_lower_bound: false
  schemas:
    ArchiveAcademicRequest:
      type: object
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The `revision` from your last read of the resource. If the resource has changed since, nothing is
            archived. Null is rejected.
    AcademicUnitResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - institution_id
        - kind
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Starts at 1 and goes up with every change. Send it as `expected_revision` on an update or archive so the
            change fails if someone else changed the Academic Unit first.
        id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit identifier.
        created_at:
          type: string
          format: date-time
          description: When the Academic Unit was created.
        updated_at:
          type: string
          format: date-time
          description: When the Academic Unit last changed.
        archived_at:
          type: string
          format: date-time
          description: When the Academic Unit was archived. Omitted while it is active.
        institution_id:
          $ref: '#/components/schemas/ID'
          description: The Institution the Academic Unit belongs to.
        parent_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit this one sits directly under. Omitted for a top-level Academic Unit.
        kind:
          $ref: '#/components/schemas/AcademicUnitKind'
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Unique among
            the Institution's active Academic Units.
        display_name:
          type: string
          description: Name shown to people, up to 128 characters.
        description:
          type: string
          description: Longer text shown to people, up to 1,024 characters. Empty when none was given.
        member_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many people are members of this Academic Unit now. Present only if you hold
            academic_unit.members.view on it. It is exact below 10,000; at 10,000 counting stops and
            `member_count_is_lower_bound` is true.
        member_count_is_lower_bound:
          type: boolean
          description: True when `member_count` stopped at 10,000. Present with `member_count`.
        member_counts_by_affiliation:
          $ref: '#/components/schemas/AcademicUnitAffiliationCounts'
        administrators:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/PersonRef'
          description: >-
            Up to three people who administer this Academic Unit: each holds a current Role Binding scoped exactly to
            it, of a Role that grants academic_unit.manage. Earliest first. Present, possibly empty, only if you hold
            role_binding.view on the Academic Unit.
        administrators_more:
          type: integer
          minimum: 0
          description: How many more administrators there are than `administrators` lists. Present with `administrators`.
    AcademicUnitAffiliationCounts:
      description: >-
        How many of the Academic Unit's current members hold each current Affiliation kind. A person can hold several
        kinds, so these don't add up to `member_count`. Each is exact below 10,000; at 10,000 counting stops and its
        `_is_lower_bound` flag is true. Present with `member_count`.
      type: object
      additionalProperties: false
      required:
        - student
        - student_is_lower_bound
        - staff
        - staff_is_lower_bound
        - teacher
        - teacher_is_lower_bound
        - external
        - external_is_lower_bound
      properties:
        student:
          type: integer
          minimum: 0
          maximum: 10000
        student_is_lower_bound:
          type: boolean
        staff:
          type: integer
          minimum: 0
          maximum: 10000
        staff_is_lower_bound:
          type: boolean
        teacher:
          type: integer
          minimum: 0
          maximum: 10000
        teacher_is_lower_bound:
          type: boolean
        external:
          type: integer
          minimum: 0
          maximum: 10000
        external_is_lower_bound:
          type: boolean
    AcademicUnitListResponse:
      description: One page of Academic Units, ordered by name and then by identifier.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AcademicUnitResponse'
          description: The Academic Units on this page.
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    AcademicUnitKind:
      type: string
      enum:
        - faculty
        - school
        - department
        - office
        - other
      description: >-
        What kind of Academic Unit this is, for people reading the tree. It is only a label: it changes no rule about
        what the Academic Unit may contain.
    CreateAcademicUnitRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
      properties:
        kind:
          $ref: '#/components/schemas/AcademicUnitKind'
          description: Optional. The kind of Academic Unit. Omitted or empty means `other`.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, starting with a letter or digit, at
            most 64 characters. It must be unique among the Institution's active Academic Units.
        display_name:
          type: string
          description: Name shown to people, 1 to 128 characters.
        description:
          type: string
          description: Optional longer text shown to people, up to 1,024 characters.
    ProgrammeResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - academic_unit_id
        - kind
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Starts at 1 and goes up with every change. Send it as `expected_revision` on an update or archive so the
            change fails if someone else changed the Programme first.
        id:
          $ref: '#/components/schemas/ID'
          description: The Programme identifier.
        created_at:
          type: string
          format: date-time
          description: When the Programme was created.
        updated_at:
          type: string
          format: date-time
          description: When the Programme last changed.
        archived_at:
          type: string
          format: date-time
          description: When the Programme was archived. Omitted while it is active.
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit that owns the Programme. It can't change.
        kind:
          $ref: '#/components/schemas/ProgrammeKind'
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Unique among
            the Academic Unit's active Programmes.
        display_name:
          type: string
          description: Name shown to people, up to 128 characters.
        description:
          type: string
          description: Longer text shown to people, up to 1,024 characters. Empty when none was given.
        level_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many active Programme Levels the Programme has. Present only if you hold programme_level.view on its Academic Unit.  It is exact below 10,000; at 10,000 counting stops and `level_count_is_lower_bound` is true.
        level_count_is_lower_bound:
          type: boolean
          description: True when `level_count` stopped at 10,000. Present with `level_count`.
        class_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many active Classes the Programme has, counting only the Classes you hold class.view on. Absent if you hold class.view nowhere. It is exact below 10,000; at 10,000 counting stops and `class_count_is_lower_bound` is true.
        class_count_is_lower_bound:
          type: boolean
          description: True when `class_count` stopped at 10,000. Present with `class_count`.
        student_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many students the Programme has now, counting the distinct Users currently enrolled in the Classes you hold class.members.view on, as a Class's `student_count` does. Absent if you hold class.members.view nowhere. It is exact below 10,000; at 10,000 counting stops and `student_count_is_lower_bound` is true.
        student_count_is_lower_bound:
          type: boolean
          description: True when `student_count` stopped at 10,000. Present with `student_count`.
    ProgrammeKind:
      type: string
      enum:
        - undergraduate
        - postgraduate
        - other
      description: >-
        What kind of Programme this is, for people reading the structure. It is only a label: it changes no rule about
        the Programme's levels.
    ProgrammeLevelResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - programme_id
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Starts at 1 and goes up with every change. Send it as `expected_revision` on an update or archive so the
            change fails if someone else changed the Programme Level first.
        id:
          $ref: '#/components/schemas/ID'
          description: The Programme Level identifier.
        created_at:
          type: string
          format: date-time
          description: When the Programme Level was created.
        updated_at:
          type: string
          format: date-time
          description: When the Programme Level last changed.
        archived_at:
          type: string
          format: date-time
          description: When the Programme Level was archived. Omitted while it is active.
        programme_id:
          $ref: '#/components/schemas/ID'
          description: The Programme that owns the Programme Level. It can't change.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Unique among
            the Programme's active Programme Levels.
        display_name:
          type: string
          description: Name shown to people, up to 128 characters.
        description:
          type: string
          description: Longer text shown to people, up to 1,024 characters. Empty when none was given.
        class_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many active Classes the Programme Level has, counting only the Classes you hold class.view on. Absent if you hold class.view nowhere. It is exact below 10,000; at 10,000 counting stops and `class_count_is_lower_bound` is true.
        class_count_is_lower_bound:
          type: boolean
          description: True when `class_count` stopped at 10,000. Present with `class_count`.
        student_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many students the Programme Level has now, counting the distinct Users currently enrolled in the Classes you hold class.members.view on, as a Class's `student_count` does. Absent if you hold class.members.view nowhere. It is exact below 10,000; at 10,000 counting stops and `student_count_is_lower_bound` is true.
        student_count_is_lower_bound:
          type: boolean
          description: True when `student_count` stopped at 10,000. Present with `student_count`.
    ClassResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - programme_level_id
        - academic_period_id
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Starts at 1 and goes up with every change. Send it as `expected_revision` on an update or archive so the
            change fails if someone else changed the Class first.
        id:
          $ref: '#/components/schemas/ID'
          description: The Class identifier.
        created_at:
          type: string
          format: date-time
          description: When the Class was created.
        updated_at:
          type: string
          format: date-time
          description: When the Class last changed.
        archived_at:
          type: string
          format: date-time
          description: When the Class was archived. Omitted while it is active.
        programme_level_id:
          $ref: '#/components/schemas/ID'
          description: The Programme Level the Class belongs to.
        academic_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period the Class runs in.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Unique among
            active Classes with the same Programme Level and Academic Period.
        display_name:
          type: string
          description: Name shown to people, up to 128 characters.
        description:
          type: string
          description: Longer text shown to people, up to 1,024 characters. Empty when none was given.
    ClassDetailResponse:
      description: >-
        One Class. It includes the Class's teachers when the caller holds class.members.view on that Class.
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - programme_level_id
        - academic_period_id
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Starts at 1 and goes up with every change. Send it as `expected_revision` on an update or archive so the
            change fails if someone else changed the Class first.
        id:
          $ref: '#/components/schemas/ID'
          description: The Class identifier.
        created_at:
          type: string
          format: date-time
          description: When the Class was created.
        updated_at:
          type: string
          format: date-time
          description: When the Class last changed.
        archived_at:
          type: string
          format: date-time
          description: When the Class was archived. Omitted while it is active.
        programme_level_id:
          $ref: '#/components/schemas/ID'
          description: The Programme Level the Class belongs to.
        academic_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period the Class runs in.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Unique among
            active Classes with the same Programme Level and Academic Period.
        display_name:
          type: string
          description: Name shown to people, up to 128 characters.
        description:
          type: string
          description: Longer text shown to people, up to 1,024 characters. Empty when none was given.
        teachers:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/PersonRef'
          description: >-
            Up to three of the Class's teachers, by name: the people holding a current Role Binding at the Class
            itself. Present only when the caller holds class.members.view on this Class, as an empty list when the
            Class has none.
        teachers_more:
          type: integer
          minimum: 0
          description: How many more teachers the Class has beyond `teachers`. Present with `teachers`.
    ClassListResponse:
      description: One page of Classes in the requested order. Only the first page carries the total.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassListItemResponse'
          description: The Classes on this page.
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many Classes match the filters across every page. Present only on the first page. Counting stops at
            10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached 10,000 and there may be more. Present with `total`.
    ClassListItemResponse:
      description: >-
        One Class in a Class listing. It includes the current student count and the teachers when the caller
        holds class.members.view on that Class.
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - programme_level_id
        - academic_period_id
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Starts at 1 and goes up with every change. Send it as `expected_revision` on an update or archive so the
            change fails if someone else changed the Class first.
        id:
          $ref: '#/components/schemas/ID'
          description: The Class identifier.
        created_at:
          type: string
          format: date-time
          description: When the Class was created.
        updated_at:
          type: string
          format: date-time
          description: When the Class last changed.
        archived_at:
          type: string
          format: date-time
          description: When the Class was archived. Omitted while it is active.
        programme_level_id:
          $ref: '#/components/schemas/ID'
          description: The Programme Level the Class belongs to.
        academic_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period the Class runs in.
        name:
          type: string
          description: >-
            Machine name: lowercase letters, digits, hyphens and underscores, at most 64 characters. Unique among
            active Classes with the same Programme Level and Academic Period.
        display_name:
          type: string
          description: Name shown to people, up to 128 characters.
        description:
          type: string
          description: Longer text shown to people, up to 1,024 characters. Empty when none was given.
        student_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many members the Class has now, counted up to 10,000. Present only when the caller holds
            class.members.view on this Class. To sort a page by it, sort on the client.
        student_count_is_lower_bound:
          type: boolean
          description: True when `student_count` reached 10,000. Present with `student_count`.
        teachers:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/PersonRef'
          description: >-
            Up to three of the Class's teachers, by name: the people holding a current Role Binding at the Class
            itself. Present only when the caller holds class.members.view on this Class, as an empty list when the
            Class has none.
        teachers_more:
          type: integer
          minimum: 0
          description: How many more teachers the Class has beyond `teachers`. Present with `teachers`.
