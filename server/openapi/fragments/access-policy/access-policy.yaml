paths:
  /api/v1/access-policy:
    get:
      operationId: getAccessPolicy
      summary: Get the revisioned Access Policy and bounded transition history
      tags:
        - Access policy
      description: >-
        Returns the installation's whole current Access Policy, the deployment facts an administrator needs to edit it, and up to 100 of its most recent changes. Provider secrets and mail settings are never included.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - access_policy.unavailable
        - access_policy.blocked
        - access_policy.revision_conflict
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AccessPolicyOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceAccessPolicy
      summary: Revision-fenced replacement of the installation Access Policy
      tags:
        - Access policy
      description: >-
        Replaces the whole Access Policy. Send the `revision` you read as `expected_revision`. If the policy has changed since, the request fails and nothing changes. Proctor checks again, as it saves the change, that the deployment supports the new settings and that a system administrator can still sign in. When you ask it to, Proctor signs out Sessions that used a sign-in method you are turning off. If the change starts requiring two-step verification for role holders, it also signs out their Sessions that have not proved a second factor. When a Session length gets shorter, running Sessions get the earlier deadline. The request needs a recent, strongly authenticated interactive Session and an Idempotency-Key.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request PUT \
              --url 'https://proctor.example.edu/api/v1/access-policy' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'Content-Type: application/json' \
              --header 'Idempotency-Key: docs-access-policy-008' \
              --data '{"expected_revision":7,"revoke_existing_sessions":true,"local_login_enabled":true,"public_registration_enabled":false,"invitation_admission_enabled":true,"invitation_local_credential_enabled":true,"desktop_authorization_enabled":true,"provider_admissions":{"university_oidc":"invitation_required"},"role_holder_mfa_required":true,"session_idle_minutes":480,"session_absolute_minutes":null}'
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - request.invalid
        - access_policy.invalid
        - access_policy.revision_conflict
        - access_policy.blocked
        - access_policy.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReplaceAccessPolicy'
      responses:
        "200":
          $ref: '#/components/responses/AccessPolicyOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/access-policy/preflight:
    post:
      operationId: preflightAccessPolicy
      summary: Evaluate an Access Policy replacement without mutating it
      tags:
        - Access policy
      description: >-
        Checks a proposed Access Policy without saving it. Proctor compares it with the current revision and checks the configured providers, Invitation mail delivery, two-step verification support and whether a system administrator could still sign in. It also counts the role holders without two-step verification and their Sessions that have not proved a second factor. Nothing is saved and the revision is not held for you, so the replacement runs every check again.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - access_policy.invalid
        - access_policy.revision_conflict
        - access_policy.unavailable
        - access_policy.blocked
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/PreflightAccessPolicy'
      responses:
        "200":
          $ref: '#/components/responses/AccessPolicyPreflightOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    PreflightAccessPolicy:
      description: The whole proposed Access Policy, with the `expected_revision` it is based on. Nothing is saved.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessPolicySettingsRequest'
          example:
            expected_revision: 7
            revoke_existing_sessions: true
            local_login_enabled: true
            public_registration_enabled: false
            invitation_admission_enabled: true
            invitation_local_credential_enabled: true
            desktop_authorization_enabled: true
            provider_admissions:
              university_oidc: invitation_required
            role_holder_mfa_required: true
            session_idle_minutes: 480
            session_absolute_minutes: null
    ReplaceAccessPolicy:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessPolicySettingsRequest'
          example:
            expected_revision: 7
            revoke_existing_sessions: true
            local_login_enabled: true
            public_registration_enabled: false
            invitation_admission_enabled: true
            invitation_local_credential_enabled: true
            desktop_authorization_enabled: true
            provider_admissions:
              university_oidc: invitation_required
            role_holder_mfa_required: true
            session_idle_minutes: 480
            session_absolute_minutes: null
      description: >-
        The whole new Access Policy, with the `expected_revision` it is based on. Every setting is required, so a
        setting you forget can't quietly keep an unsafe earlier value.
  responses:
    AccessPolicyOK:
      description: The current Access Policy, its recent changes and the deployment facts for editing it
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessPolicyResponse'
          example:
            id: fotnmte5o3j9wftdm5rtbfofqr
            revision: 4
            created_at: '2026-07-01T08:00:00Z'
            updated_at: '2026-08-20T13:15:00Z'
            local_login_enabled: true
            public_registration_enabled: false
            invitation_admission_enabled: true
            invitation_local_credential_enabled: true
            desktop_authorization_enabled: true
            provider_admissions:
              university_oidc: invitation_required
            role_holder_mfa_required: true
            role_holder_mfa_enforced: true
            session_idle_minutes: 480
            session_absolute_minutes: null
            session_idle_minutes_default: 10080
            session_idle_minutes_maximum: 10080
            session_absolute_minutes_default: 43200
            session_absolute_minutes_maximum: 43200
            history:
              - from_revision: 3
                to_revision: 4
                actor_user_id: o87yi4tenx8kodmcuup1hmtsbo
                actor:
                  id: o87yi4tenx8kodmcuup1hmtsbo
                  display_name: Priya Raman
                changed_fields:
                  - revoke_existing_sessions
                  - role_holder_mfa_required
                summary: Priya Raman changed signing everyone out, two-step for role holders
                changed_at: '2026-08-20T13:15:00Z'
                outcome: applied
              - from_revision: 2
                to_revision: 3
                actor_user_id: o87yi4tenx8kodmcuup1hmtsbo
                actor:
                  id: o87yi4tenx8kodmcuup1hmtsbo
                  display_name: Priya Raman
                changed_fields:
                  - session_idle_minutes
                summary: Priya Raman changed the idle session timeout
                changed_at: '2026-08-02T10:00:00Z'
                outcome: applied
            available_providers:
              - id: university_oidc
                display_name: University sign-in
                type: oidc
            durable_mail: true
    AccessPolicyPreflightOK:
      description: What would stop the proposed Access Policy, and how many role holders and Sessions it affects
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessPolicyPreflightResponse'
          example:
            blockers: []
            role_holders_without_mfa_count: 3
            role_holder_single_factor_session_count: 5
  schemas:
    ProviderAdmissionMode:
      description: >-
        How a configured external sign-in provider lets people in once it has proved who they are. `linked_only`
        signs in only identities already linked to a User. `invitation_required` also lets a new identity in by
        accepting an Invitation. `auto_provision` also creates a User for a new identity, when the provider
        supports it. A provider with no entry can't be used to sign in.
      type: string
      enum:
        - linked_only
        - invitation_required
        - auto_provision
    AccessPolicySettingsRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - revoke_existing_sessions
        - local_login_enabled
        - public_registration_enabled
        - invitation_admission_enabled
        - invitation_local_credential_enabled
        - desktop_authorization_enabled
        - provider_admissions
        - role_holder_mfa_required
        - session_idle_minutes
        - session_absolute_minutes
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The `revision` of the policy you based this proposal on. If the policy has changed since, the request
            fails with `access_policy.revision_conflict`.
        revoke_existing_sessions:
          type: boolean
          description: >-
            Applies to this change only and is not stored. When true, Proctor signs out active Sessions that used a
            sign-in method this change turns off. If this change starts requiring two-step verification for role
            holders, it also signs out their live Sessions that have not proved a second factor.
        local_login_enabled:
          type: boolean
          description: Whether people may sign in with a local password.
        public_registration_enabled:
          type: boolean
          description: Whether anyone may create their own local account through public registration.
        invitation_admission_enabled:
          type: boolean
          description: Whether pending Invitations can be accepted to let their recipients in.
        invitation_local_credential_enabled:
          type: boolean
          description: Whether someone accepting an Invitation may set a local password.
        desktop_authorization_enabled:
          type: boolean
          description: Whether Proctor Desktop may sign in through the browser authorization flow.
        provider_admissions:
          type: object
          maxProperties: 64
          propertyNames:
            pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
          additionalProperties:
            $ref: '#/components/schemas/ProviderAdmissionMode'
          description: >-
            The admission mode for each external sign-in provider you turn on, keyed by provider ID. Leave a
            provider out to turn it off.
        role_holder_mfa_required:
          type: boolean
          description: >-
            Whether every role holder must use two-step verification. A role holder is any User with a current Role
            Binding at any scope, system administrators included. A role holder without a second factor who signs in
            on the web gets a Session that can only set up two-step verification, complete a challenge or sign out.
            Proctor Desktop refuses that sign-in with `authentication.mfa.enrollment_required`. While the server
            configuration turns two-step verification off, the requirement is paused and restricts or refuses
            nobody. Clients may label this switch "Two-step required for staff". It has nothing to do with the staff
            member Affiliation.
        session_idle_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 527040
          description: >-
            How long a Session may stay unused before it ends, in minutes. Null uses the deployment default. The value
            must be at least the deployment minimum, which is longer than an access credential lasts and longer than
            the delay before activity is recorded. It must be at most `session_idle_minutes_maximum` and never longer
            than the absolute Session length in force. Shortening it moves running Sessions' idle deadlines earlier.
            Lengthening it never extends a running Session.
        session_absolute_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 527040
          description: >-
            How long a Session may last from sign-in, in minutes. Null uses the deployment default. The value must be
            at least the deployment minimum, which is longer than the recent sign-in window and the idle minimum, and
            at most `session_absolute_minutes_maximum`. Shortening it moves running Sessions' deadlines and their
            credentials' expiry earlier. Lengthening it never extends a running Session.
    AccessPolicyTransitionResponse:
      description: A summary of one applied change to the Access Policy. A recorded change can't be edited.
      type: object
      additionalProperties: false
      required:
        - from_revision
        - to_revision
        - actor_user_id
        - changed_fields
        - summary
        - changed_at
        - outcome
      properties:
        from_revision:
          type: integer
          format: int64
          minimum: 1
          description: The policy revision before the change.
        to_revision:
          type: integer
          format: int64
          minimum: 2
          description: The policy revision the change produced.
        actor_user_id:
          $ref: '#/components/schemas/ID'
          description: The User who made the change.
        actor:
          $ref: '#/components/schemas/PersonRef'
          description: The User who made the change, named.
        summary:
          type: string
          maxLength: 2048
          description: One sentence in the request's language naming who changed which settings.
        changed_fields:
          description: >-
            The settings whose values changed, in alphabetical order. It includes `revoke_existing_sessions` when the
            change was made with that option on.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - local_login_enabled
              - public_registration_enabled
              - invitation_admission_enabled
              - invitation_local_credential_enabled
              - desktop_authorization_enabled
              - provider_admissions
              - role_holder_mfa_required
              - session_idle_minutes
              - session_absolute_minutes
              - revoke_existing_sessions
        changed_at:
          type: string
          format: date-time
          description: When the change was saved.
        outcome:
          type: string
          const: applied
          description: The result of the change. Only applied changes are recorded, so it is always `applied`.
    AccessPolicyResponse:
      description: The current Access Policy, the deployment facts needed to edit it and its most recent changes.
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - created_at
        - updated_at
        - local_login_enabled
        - public_registration_enabled
        - invitation_admission_enabled
        - invitation_local_credential_enabled
        - desktop_authorization_enabled
        - provider_admissions
        - role_holder_mfa_required
        - role_holder_mfa_enforced
        - session_idle_minutes
        - session_absolute_minutes
        - session_idle_minutes_default
        - session_idle_minutes_maximum
        - session_absolute_minutes_default
        - session_absolute_minutes_maximum
        - history
        - available_providers
        - durable_mail
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The Access Policy identifier.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Goes up by one with every applied change. Send it as `expected_revision` when you preflight or replace
            the policy.
        created_at:
          type: string
          format: date-time
          description: When the Access Policy was created.
        updated_at:
          type: string
          format: date-time
          description: When the Access Policy last changed.
        local_login_enabled:
          type: boolean
          description: Whether people may sign in with a local password.
        public_registration_enabled:
          type: boolean
          description: Whether anyone may create their own local account through public registration.
        invitation_admission_enabled:
          type: boolean
          description: Whether pending Invitations can be accepted to let their recipients in.
        invitation_local_credential_enabled:
          type: boolean
          description: Whether someone accepting an Invitation may set a local password.
        desktop_authorization_enabled:
          type: boolean
          description: Whether Proctor Desktop may sign in through the browser authorization flow.
        provider_admissions:
          type: object
          maxProperties: 64
          propertyNames:
            pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
          additionalProperties:
            $ref: '#/components/schemas/ProviderAdmissionMode'
          description: >-
            The admission mode of each external sign-in provider the policy turns on, keyed by provider ID. A
            provider that is not listed is off.
        role_holder_mfa_required:
          type: boolean
          description: Whether every role holder, a User with a current Role Binding at any scope, must use two-step verification. Clients may label it "Two-step required for staff".
        role_holder_mfa_enforced:
          type: boolean
          readOnly: true
          description: >-
            Whether the role holder two-step verification requirement is in force: true only while `role_holder_mfa_required` is on and the server configuration enables two-step verification. While it is false with the setting on, the requirement is paused and nobody is restricted or refused.
        session_idle_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 527040
          description: The idle Session length the policy sets, in minutes. Null while the deployment default applies.
        session_absolute_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 527040
          description: The absolute Session length the policy sets, in minutes. Null while the deployment default applies.
        session_idle_minutes_default:
          type: integer
          minimum: 0
          description: The deployment idle Session length in whole minutes, which applies while `session_idle_minutes` is null.
        session_idle_minutes_maximum:
          type: integer
          minimum: 0
          maximum: 527040
          description: The longest idle Session length the policy may set, in minutes. The deployment configuration sets this limit.
        session_absolute_minutes_default:
          type: integer
          minimum: 0
          description: The deployment absolute Session length in whole minutes, which applies while `session_absolute_minutes` is null.
        session_absolute_minutes_maximum:
          type: integer
          minimum: 0
          maximum: 527040
          description: The longest absolute Session length the policy may set, in minutes. The deployment configuration sets this limit.
        history:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AccessPolicyTransitionResponse'
          description: Up to 100 of the most recent applied changes, newest first.
        available_providers:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ExternalAuthenticationProviderResponse'
          description: >-
            Every external sign-in provider configured on this deployment, whether or not the policy turns it on.
            Only these may appear in `provider_admissions`.
        durable_mail:
          type: boolean
          description: >-
            Whether the deployment can reliably deliver Invitation and account-security mail. Without it, a change
            that newly depends on Invitations is blocked.
    AccessPolicyBlockerResponse:
      description: One reason the proposed Access Policy can't be applied right now.
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - provider_unavailable
            - provider_admission_unsupported
            - invitation_delivery_unavailable
            - last_system_administrator_path
            - mfa_unavailable
          description: >-
            Why the proposal is blocked. `provider_unavailable`: a provider in `provider_admissions` is not
            configured on this deployment. `provider_admission_unsupported`: the provider can't create Users, so
            `auto_provision` is not allowed. `invitation_delivery_unavailable`: the proposal newly depends on
            Invitations while the deployment can't reliably deliver mail. `last_system_administrator_path`: no
            system administrator would have a way left to sign in. `mfa_unavailable`: the proposal starts requiring
            two-step verification for role holders while the server configuration turns two-step verification
            off.
        provider_id:
          type: string
          description: The ID of the provider the blocker is about. Omitted when the blocker is not about one provider.
    AccessPolicyPreflightResponse:
      description: >-
        What would stop a proposed Access Policy today, and how many role holders and Sessions lack two-step
        verification.
      type: object
      additionalProperties: false
      required:
        - blockers
        - role_holders_without_mfa_count
        - role_holder_single_factor_session_count
      properties:
        role_holders_without_mfa_count:
          type: integer
          minimum: 0
          description: >-
            How many active role holders, Users with a current Role Binding at any scope, have no active second
            factor.
        role_holder_single_factor_session_count:
          type: integer
          minimum: 0
          description: >-
            How many live Sessions of active role holders have not proved a second factor. These are the Sessions
            `revoke_existing_sessions` signs out when the proposal starts requiring two-step verification for role
            holders.
        blockers:
          type: array
          maxItems: 66
          items:
            $ref: '#/components/schemas/AccessPolicyBlockerResponse'
          description: Each problem found, sorted by code and provider. Empty when none was found. The replacement still runs every check again.
