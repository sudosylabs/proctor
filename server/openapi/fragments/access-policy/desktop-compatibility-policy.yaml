paths:
  /api/v1/desktop-releases:
    get:
      operationId: listDesktopReleases
      summary: List the Proctor Desktop builds this server verifies
      tags:
        - Access policy
      description: >-
        Lists the verified Proctor Desktop builds compiled into this server release, newest release first, with when
        each was released and which is the newest for its platform and architecture. The Desktop Compatibility Policy
        can only narrow this list. It needs access_policy.view on the Institution, as reading the policy does. It is
        empty until signed releases exist.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - desktop_compatibility_policy.revision_conflict
        - desktop_compatibility_policy.unavailable
        - request.invalid
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          description: The verified Proctor Desktop builds
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesktopReleaseListResponse'
              example:
                items:
                  - release: 1.4.0
                    build_id: desktop-1.4.0-darwin-arm64
                    platform: darwin
                    architecture: arm64
                    released_at: '2026-09-01T12:00:00Z'
                    newest: true
                  - release: 1.3.2
                    build_id: desktop-1.3.2-darwin-arm64
                    platform: darwin
                    architecture: arm64
                    released_at: '2026-07-14T09:00:00Z'
                    newest: false
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/desktop-compatibility-policy:
    get:
      operationId: getDesktopCompatibilityPolicy
      summary: Get the Institution Desktop Compatibility Policy
      tags:
        - Access policy
      description: >-
        Returns the Institution's whole Desktop Compatibility Policy. This server release ships with a fixed list of verified Proctor Desktop builds, and the policy can only narrow that list: it can't allow a build the server doesn't know. It holds no update feed and no download location.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - desktop_compatibility_policy.unavailable
        - desktop_compatibility_policy.revision_conflict
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/DesktopCompatibilityPolicyOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceDesktopCompatibilityPolicy
      summary: Replace the Institution Desktop Compatibility Policy
      tags:
        - Access policy
      description: >-
        Replaces the whole policy. Send the `revision` you read as `expected_revision`. If the policy has changed since, the request fails and nothing changes. The request needs a recent, strongly authenticated interactive system administrator Session and an Idempotency-Key, and it fails if the change can't be audited. Revoked build IDs and the administrator message are left out of ordinary audit records.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request PUT \
              --url 'https://proctor.example.edu/api/v1/desktop-compatibility-policy' \
              --header 'Authorization: Bearer <interactive-system-administrator-session>' \
              --header 'Content-Type: application/json' \
              --header 'Idempotency-Key: docs-desktop-policy-001' \
              --data '{"expected_revision":3,"minimum_desktop_release":"1.4.0","revoked_desktop_builds":[{"build_id":"desktop-build-2026-08-17","reason":"Crashes when the laptop wakes"}],"administrator_message":"Update Proctor Desktop before your next exam.","availability":"maintenance","retry_at":"2026-08-28T11:00:00Z"}'
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - request.invalid
        - desktop_compatibility_policy.invalid
        - desktop_compatibility_policy.revision_conflict
        - desktop_compatibility_policy.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReplaceDesktopCompatibilityPolicy'
      responses:
        "200":
          $ref: '#/components/responses/DesktopCompatibilityPolicyOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ReplaceDesktopCompatibilityPolicy:
      required: true
      description: >-
        The whole new policy, with the `expected_revision` it is based on. Every setting is required, even when it
        is empty.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DesktopCompatibilityPolicyRequest'
          example:
            expected_revision: 3
            minimum_desktop_release: 1.4.0
            revoked_desktop_builds:
              - build_id: desktop-build-2026-08-17
                reason: Crashes when the laptop wakes
            administrator_message: Update Proctor Desktop before your next exam.
            availability: maintenance
            retry_at: '2026-08-28T11:00:00Z'
  responses:
    DesktopCompatibilityPolicyOK:
      description: The current Desktop Compatibility Policy
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DesktopCompatibilityPolicyResponse'
          example:
            revision: 3
            minimum_desktop_release: 1.4.0
            revoked_desktop_builds:
              - build_id: desktop-build-2026-08-17
                release: 1.3.2
                platform: darwin
                architecture: arm64
                reason: Crashes when the laptop wakes
                revoked_at: '2026-08-28T10:11:12Z'
                revoked_by:
                  id: 4ufo8k7p1h3m5bxj9y6rqwtzse
                  display_name: Priya Raman
            administrator_message: Update Proctor Desktop before your next exam.
            availability: maintenance
            retry_at: '2026-08-28T11:00:00Z'
            created_at: '2026-08-01T12:00:00Z'
            updated_at: '2026-08-28T10:11:12Z'
  schemas:
    DesktopCompatibilityPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - minimum_desktop_release
        - revoked_desktop_builds
        - administrator_message
        - availability
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The `revision` of the policy you based this replacement on. If the policy has changed since, the request
            fails with `desktop_compatibility_policy.revision_conflict`.
        minimum_desktop_release:
          type: string
          maxLength: 64
          description: >-
            The oldest Proctor Desktop release the Institution accepts, written as a plain semantic version such as
            `1.4.0`, with no leading `v`. Older releases are refused. Send an empty string for no Institution minimum.
        revoked_desktop_builds:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/DesktopBuildRevocationRequest'
          description: >-
            Desktop builds to refuse even though this server release lists them as verified, each build at most once.
            Send an empty list to revoke none. A build that stays revoked for the same reason keeps who revoked it and
            when; a new build, or a new reason, is recorded as revoked by you now.
        administrator_message:
          type: string
          maxLength: 500
          description: >-
            Plain text, up to 500 characters, that the server sends to Proctor Desktop with its compatibility status. Leading and
            trailing spaces are removed, and control characters are rejected. Send an empty string for no message.
        availability:
          type: string
          enum:
            - ready
            - maintenance
          description: >-
            `ready` lets Proctor Desktop sign in and start Attempts. `maintenance` refuses Desktop sign-in and Attempt
            entry until you set it back to `ready`.
        retry_at:
          type: string
          format: date-time
          description: >-
            Optional. When Proctor Desktop should try again during maintenance. Leave it out for no retry time, and
            always leave it out while `availability` is `ready`. Null is rejected.
    DesktopCompatibilityPolicyResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - minimum_desktop_release
        - revoked_desktop_builds
        - administrator_message
        - availability
        - created_at
        - updated_at
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Goes up with every change. Send it as `expected_revision` when you replace the policy.
        minimum_desktop_release:
          type: string
          maxLength: 64
          description: The oldest Proctor Desktop release the Institution accepts. Empty when the Institution sets no minimum.
        revoked_desktop_builds:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/DesktopBuildRevocation'
          description: Desktop builds refused even though this server release lists them as verified, ordered by build ID.
        administrator_message:
          type: string
          maxLength: 500
          description: Plain text the server sends to Proctor Desktop with its compatibility status. Empty when there is no message.
        availability:
          type: string
          enum:
            - ready
            - maintenance
          description: >-
            `ready` while Proctor Desktop may sign in and start Attempts. `maintenance` while Desktop sign-in and
            Attempt entry are refused.
        retry_at:
          type: string
          format: date-time
          description: When Proctor Desktop should try again. Present only during maintenance when a retry time is set.
        created_at:
          type: string
          format: date-time
          description: When the policy was created.
        updated_at:
          type: string
          format: date-time
          description: When the policy last changed.
    DesktopBuildRevocationRequest:
      type: object
      additionalProperties: false
      required:
        - build_id
        - reason
      properties:
        build_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: The Desktop build ID to refuse.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            Why the build is refused, shown to administrators, up to 500 characters. Leading and trailing spaces are
            removed, and control characters are rejected.
    DesktopBuildRevocation:
      type: object
      additionalProperties: false
      required:
        - build_id
        - reason
        - revoked_at
        - revoked_by
      properties:
        build_id:
          type: string
          description: The refused Desktop build ID.
        release:
          type: string
          description: The build's release. Omitted for a build this server's catalogue doesn't list.
        platform:
          type: string
          enum:
            - darwin
            - win32
            - linux
          description: The build's platform. Omitted for a build this server's catalogue doesn't list.
        architecture:
          type: string
          enum:
            - arm64
            - x64
          description: The build's architecture. Omitted for a build this server's catalogue doesn't list.
        reason:
          type: string
          description: Why the build is refused.
        revoked_at:
          type: string
          format: date-time
          description: When the build was revoked for this reason.
        revoked_by:
          $ref: '#/components/schemas/PersonRef'
          description: Who revoked it.
    DesktopReleaseListResponse:
      description: >-
        One page of the Proctor Desktop builds this server release verifies, newest release first. The list is
        compiled into the server, so its pages never change while it runs. It is empty until signed releases exist.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DesktopRelease'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    DesktopRelease:
      type: object
      additionalProperties: false
      required:
        - release
        - build_id
        - platform
        - architecture
        - released_at
        - newest
      properties:
        release:
          type: string
          description: The release, a plain semantic version such as `1.4.0`.
        build_id:
          type: string
          description: The build ID, as `revoked_desktop_builds` names it.
        platform:
          type: string
          enum:
            - darwin
            - win32
            - linux
        architecture:
          type: string
          enum:
            - arm64
            - x64
        released_at:
          type: string
          format: date-time
          description: When the release was published.
        newest:
          type: boolean
          description: True for the highest release this server verifies for the build's platform and architecture.
