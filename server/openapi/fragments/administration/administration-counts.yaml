paths:
  /api/v1/administration/counts:
    get:
      operationId: getAdministrationCounts
      summary: Summarise administration work waiting on the caller
      tags:
        - Administration
      description: >-
        Returns the counts shown as badges in administration navigation. `pending_invitations` counts pending
        Invitations that have not expired. `failed_jobs` counts operator-visible Jobs that failed in the last seven
        days. `failed_mail_deliveries` counts mail deliveries that ended in the `failed` state. Suppressed and
        canceled deliveries are not failures. `open_onboarding_imports` counts unexpired administrative onboarding
        imports that are still uploading, parsing, waiting to be committed or running, not counting student
        progressions. `open_sittings` counts the Institution's Sittings under way (open, paused or closing), for a
        holder of Institution-wide desktop_compatibility_policy.manage, so they can see what a maintenance window
        would interrupt. The other counts apply the same permission and visibility checks as their resource lists,
        and record permission decisions the same way. A count the
        caller may not list is left out, together with its `_is_lower_bound` flag. If a count can't be read, the
        request fails rather than reporting zero. Counting stops at 1,000: the count is then 1,000 and its flag is
        true. Only an interactive Session may read the counts.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - administration.unavailable
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - desktop_compatibility_policy.unavailable
        - invitation.unavailable
        - job.query.invalid
        - job.unavailable
        - mail.unavailable
        - onboarding_import.unavailable
        - request.invalid
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AdministrationCountsOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    AdministrationCountsOK:
      description: The administration counts the caller may see, each capped at 1,000
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdministrationCountsResponse'
          example:
            pending_invitations: 12
            pending_invitations_is_lower_bound: false
            failed_jobs: 0
            failed_jobs_is_lower_bound: false
            failed_mail_deliveries: 1000
            failed_mail_deliveries_is_lower_bound: true
  schemas:
    AdministrationCountsResponse:
      description: >-
        Counts for administration navigation. Each count is present only when the caller may list its resource,
        always with its lower-bound flag.
      type: object
      additionalProperties: false
      properties:
        pending_invitations:
          type: integer
          minimum: 0
          maximum: 1000
          description: Pending, unexpired Invitations within the caller's Invitation visibility.
        pending_invitations_is_lower_bound:
          type: boolean
          description: True when `pending_invitations` reached 1,000 and there may be more. Present with `pending_invitations`.
        failed_jobs:
          type: integer
          minimum: 0
          maximum: 1000
          description: Operator-visible Jobs that failed and were last updated in the last seven days.
        failed_jobs_is_lower_bound:
          type: boolean
          description: True when `failed_jobs` reached 1,000 and there may be more. Present with `failed_jobs`.
        failed_mail_deliveries:
          type: integer
          minimum: 0
          maximum: 1000
          description: Mail deliveries that ended in the `failed` state. Suppressed and canceled deliveries are not counted.
        failed_mail_deliveries_is_lower_bound:
          type: boolean
          description: True when `failed_mail_deliveries` reached 1,000 and there may be more. Present with `failed_mail_deliveries`.
        open_onboarding_imports:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            Unexpired administrative onboarding imports not yet completed, canceled, or failed, within the caller's
            onboarding import visibility. Student progressions are not counted.
        open_onboarding_imports_is_lower_bound:
          type: boolean
          description: True when `open_onboarding_imports` reached 1,000 and there may be more. Present with `open_onboarding_imports`.
        open_sittings:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            The Institution's Sittings that have opened and not yet closed. Present only for a holder of
            Institution-wide desktop_compatibility_policy.manage.
        open_sittings_is_lower_bound:
          type: boolean
          description: True when `open_sittings` reached 1,000 and there may be more. Present with `open_sittings`.
