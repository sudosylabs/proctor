paths:
  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: browserSourceList
      summary: List owned Participation Browser sources
      description: Returns up to 49 browser activity source statuses for one Participation you own, in the order the sources started. The response is at most 1 MiB. You need a Session for the registered key that owns the Participation. If any source is still live, you also need the current Connection headers. Use this to recover sources after a lost response. It gives no access to Browser Activity history.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_not_open
        - exam.attempt.unavailable
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/NativeDeliveryCredential'
        - $ref: '#/components/parameters/NativeDeliveryConnectionID'
        - name: participation_id
          in: query
          required: true
          description: ID of the Participation you own whose browser activity sources you want.
          schema:
            $ref: '#/components/schemas/ID'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          $ref: '#/components/responses/BrowserSourceListOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources/{source_session_id}:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/BrowserSourceSessionID'
    get:
      operationId: browserSourceStatus
      summary: Recover an owned Browser source
      description: 'Returns the status of one browser activity source: who owns it, its counters and whether it has been closed. Use it when a start or reset response was lost. You must be the User who owns the source, with a current Session for the registered key. A live source also needs the current Connection headers. Owning a closed source does not let you interact with the Attempt. The response is at most 16 KiB.'
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_not_open
        - exam.attempt.unavailable
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/NativeDeliveryCredential'
        - $ref: '#/components/parameters/NativeDeliveryConnectionID'
      responses:
        '200':
          $ref: '#/components/responses/BrowserSourceStatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources/{source_session_id}/gaps:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/BrowserSourceSessionID'
    post:
      operationId: declareBrowserDeliveryGaps
      summary: Declare permanent missing Browser positions
      description: Declares sequence numbers of a browser activity source that the client can never deliver. The server always checks that the registered key still owns the source. A live source also needs the current Connection headers. Repeating the same declaration returns the same result. Declared gaps never create event receipts. For a closed source, the request must arrive before the upload deadline, which can't change.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_not_open
        - exam.attempt.unavailable
        - exam.delivery.upload_expired
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
        - idempotency.key_required
        - idempotency.key_invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NativeDeliveryCredential'
        - $ref: '#/components/parameters/NativeDeliveryConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/DeclareDeliveryGaps'
      responses:
        '200':
          $ref: '#/components/responses/BrowserDeliveryGapResultOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources/{source_session_id}/seal:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/BrowserSourceSessionID'
    post:
      operationId: sealBrowserDelivery
