  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources/{source_session_id}/events:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/BrowserSourceSessionID'
    post:
      operationId: appendHistoricalBrowserDelivery
      summary: Upload retained events for a closed Browser source
      description: Uploads stored events for a browser activity source that is already closed. You need the registered key that owns the source, and the events must use the policy revision and digest the source started with. Candidate Connection headers are rejected. Each event keeps its receipt even if it is sent again in a different batch. Receipt progress is reported separately from positions settled by declared gaps. The upload deadline and any declared final position can't change.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_not_open
        - exam.attempt.unavailable
        - exam.delivery.upload_expired
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
        - idempotency.key_required
        - idempotency.key_invalid
        - exam.delivery.batch_conflict
        - exam.delivery.replay_window_exceeded
        - exam.delivery.pending_capacity
        - exam.delivery.append_rate_limited
        - exam.attempt.browser_activity_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/BrowserActivityBatch'
      responses:
        '200':
          $ref: '#/components/responses/BrowserActivityAcknowledgementOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-codeSamples:
        - lang: Shell
          label: Append the original protected batch
          source: |-
            curl --request POST "$PROCTOR_URL/api/v1/exam-attempts/$ATTEMPT_ID/security-batches" \
              --header "Authorization: DPoP $ACCESS_TOKEN" \
              --header "DPoP: $DPOP_PROOF" \
              --header "Idempotency-Key: $IDEMPOTENCY_KEY" \
              --header "Content-Type: application/json" \
              --data-binary @native-batch.json
  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources/{source_session_id}/receipts:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/BrowserSourceSessionID'
    get:
      operationId: browserDeliveryReceipts
      summary: Read bounded per-event Browser receipts
      description: Returns up to 64 stored event receipts in ascending sequence order. Missing positions are skipped. next_cursor continues at the next stored receipt and is left out on the last page. The response is at most 16 KiB. The same ownership and live Connection rules apply as for the source status.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_not_open
        - exam.attempt.unavailable
        - exam.delivery.upload_expired
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/NativeDeliveryCredential'
        - $ref: '#/components/parameters/NativeDeliveryConnectionID'
        - name: limit
          in: query
          required: false
          description: Largest number of stored receipts to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 64
            default: 64
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          $ref: '#/components/responses/BrowserReceiptPageOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    BrowserSourceSessionID:
      name: source_session_id
      in: path
      required: true
      description: 'ID of the browser activity source: a lowercase UUID version 4 that the Desktop assigned when it started the source.'
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  schemas:
    BrowserSourceStatus:
      type: object
      additionalProperties: false
      required:
        - missing_ranges_truncated
        - server_time
        - allocated_through_sequence
        - terminal_missing_through_sequence
        - closure
        - declaration_revision
        - detail_mode
        - budget_scope
        - summary_only_reason
        - summary
        - highest_contiguous_sequence
        - settled_through_sequence
        - highest_seen_sequence
        - missing_ranges
        - source_session_id
        - attempt_id
        - participation_id
        - generation
        - policy_revision_id
        - policy_digest
        - predecessor_source_session_id
        - start_transition
        - runtime_reset_reason
        - started_at
        - remaining_correction_starts
        - remaining_runtime_reset_starts
      properties:
        missing_ranges_truncated:
          description: True when there are more missing ranges than missing_ranges lists.
          type: boolean
        server_time:
          description: Server time when the status was read.
          type: string
          format: date-time
        allocated_through_sequence:
          description: Highest sequence number reserved for the source so far.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        terminal_missing_through_sequence:
          description: Positions up to this one that were not received are permanently missing, for example after the upload deadline passed. Zero when there is no such cutoff.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        closure:
          description: Whether and how the server closed the source.
          $ref: '#/components/schemas/DeliveryClosure'
        declaration_revision:
          description: Number of gap and final declarations recorded for the source. Send it as expected_revision in the next declaration.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        detail_mode:
          description: collecting while individual events are kept. summary_only after a delivery limit was reached or detailed delivery was stopped, when only summary counts are kept.
          type: string
          enum:
            - collecting
            - summary_only
        budget_scope:
          description: Whether the Participation limit or the lifetime Attempt limit caused summary_only. Null while collecting.
          type:
            - string
            - 'null'
          enum:
            - participation
            - attempt
            - null
        summary_only_reason:
          description: Which limit was reached, or local_loss_inventory_exhausted when the client stopped detailed delivery. Null while collecting.
          type:
            - string
            - 'null'
          enum:
            - records
            - bytes
            - positions
            - metadata
            - local_loss_inventory_exhausted
            - null
        summary:
          description: The latest summary of undelivered events. Null until the client sends one.
          type:
            - object
            - 'null'
          additionalProperties: false
          required:
            - summary_sequence
            - unretained_record_count
            - count_complete
          properties:
            summary_sequence:
              description: Number of this summary. Each changed summary uses a higher number.
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            unretained_record_count:
              description: Total number of events produced but not delivered so far.
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
            count_complete:
              description: Whether the count is exact.
              type: boolean
            first_unretained_at:
              description: When the first undelivered event was produced, by the client clock. Omitted when unknown.
              type: string
              format: date-time
            last_unretained_at:
              description: When the most recent undelivered event was produced, by the client clock. Omitted when unknown.
              type: string
              format: date-time
        highest_contiguous_sequence:
          description: Highest sequence number such that every event from 1 up to it has been received.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        settled_through_sequence:
          description: Highest sequence number such that every position up to it has been received or declared missing.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        highest_seen_sequence:
          description: Highest sequence number the server has received.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        missing_ranges:
          description: Up to the first 32 ranges of positions that are neither received nor declared missing, in ascending order.
          type: array
          items:
            $ref: '#/components/schemas/SequenceRange'
          maxItems: 32
        source_session_id:
          description: ID of the browser activity source.
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        attempt_id:
          description: ID of the Exam Attempt.
          $ref: '#/components/schemas/ID'
        participation_id:
          description: ID of the Attempt Participation that started the source.
          $ref: '#/components/schemas/ID'
        generation:
          description: Participation Generation that started the source.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        policy_revision_id:
          description: ID of the Exam Revision whose Browser Policy the source uses.
          $ref: '#/components/schemas/ID'
        policy_digest:
          description: SHA-256 digest of that Browser Policy, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        predecessor_source_session_id:
          description: ID of the source this one replaced. Null when start_transition is initial.
          type:
            - string
            - 'null'
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        start_transition:
          description: Why the source started. initial for the first source, policy_correction after a live correction to the Browser Policy, and runtime_reset after the browser runtime was reset.
          type: string
          enum:
            - initial
            - policy_correction
            - runtime_reset
        runtime_reset_reason:
          description: Why the browser runtime was reset. Present only when start_transition is runtime_reset, otherwise null.
          type:
            - string
            - 'null'
          enum:
            - coordinator_restarted
            - spool_unavailable
            - source_corrupt
            - null
        started_at:
          description: When the source started.
          type: string
          format: date-time
        remaining_correction_starts:
          description: How many more sources this Participation may start after a policy correction. It starts at 32.
          type: integer
          format: int64
          minimum: 0
          maximum: 32
        remaining_runtime_reset_starts:
          description: How many more sources this Participation may start after a runtime reset. It starts at 16.
          type: integer
          format: int64
          minimum: 0
          maximum: 16
      description: Status of one browser activity source, at most 16 KiB. The policy and how the source started can't change. The server alone decides when it closes, and after that history can be uploaded only until a fixed deadline. The remaining-start counters cover the whole Participation, and neither retries nor retirement give starts back. The status grants no permission to navigate.
    BrowserSourceList:
      description: Browser activity sources of one Participation, in start order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          description: Source statuses on this page.
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/BrowserSourceStatus'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    BrowserEventReceipt:
      description: Receipt for one stored browser activity event.
      type: object
      additionalProperties: false
      required:
        - sequence
        - event_digest
        - received_at
      properties:
        sequence:
          description: Sequence number of the event in its source.
          type: integer
          format: int64
          minimum: 1
          maximum: 50000
        event_digest:
          description: SHA-256 digest of the event record, prefixed with sha256:. It does not depend on how events were batched or sent.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        received_at:
          description: When the server first stored the event.
          type: string
          format: date-time
          pattern: Z$
    BrowserActivityAcknowledgement:
      description: Receipts for the events just sent, with the source's current delivery progress.
      type: object
      additionalProperties: false
      required:
        - highest_contiguous_sequence
        - settled_through_sequence
        - highest_seen_sequence
        - allocated_through_sequence
        - terminal_missing_through_sequence
        - missing_ranges
        - missing_ranges_truncated
        - source_session_id
        - receipts
        - server_time
      properties:
        highest_contiguous_sequence:
          description: Highest sequence number such that every event from 1 up to it has been received.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        settled_through_sequence:
          description: Highest sequence number such that every position up to it has been received or declared missing.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        highest_seen_sequence:
          description: Highest sequence number the server has received.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        allocated_through_sequence:
          description: Highest sequence number reserved for the source so far.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        terminal_missing_through_sequence:
          description: Positions up to this one that were not received are permanently missing. Zero when there is no such cutoff.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        missing_ranges:
          description: Up to the first 32 ranges of positions that are neither received nor declared missing, in ascending order.
          type: array
          items:
            $ref: '#/components/schemas/SequenceRange'
          maxItems: 32
        missing_ranges_truncated:
          description: True when there are more missing ranges than missing_ranges lists.
          type: boolean
        source_session_id:
          description: ID of the browser activity source.
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        receipts:
          description: One receipt for each event in the request.
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/BrowserEventReceipt'
        server_time:
          description: Server time when the events were acknowledged.
          type: string
          format: date-time
          pattern: Z$
    BrowserReceiptPage:
      description: One page of stored event receipts.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          description: Receipts on this page, in ascending sequence order.
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/BrowserEventReceipt'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    BrowserDeliveryGapResult:
      description: Receipt for a gap declaration, with the source's current status.
      type: object
      additionalProperties: false
      required:
        - receipt
        - status
      properties:
        receipt:
          description: Receipt for the declaration.
          $ref: '#/components/schemas/DeliveryGapReceipt'
        status:
          description: Status of the source after the declaration.
          $ref: '#/components/schemas/BrowserSourceStatus'
    BrowserDeliverySummaryResult:
      description: The recorded summary, with the source's current status.
      type: object
      additionalProperties: false
      required:
        - summary
        - status
      properties:
        summary:
          description: The summary the server recorded.
          $ref: '#/components/schemas/UnretainedDeliverySummary'
        status:
          description: Status of the source after the summary.
          $ref: '#/components/schemas/BrowserSourceStatus'
    BrowserActivityBatch:
      type: object
      additionalProperties: false
      required:
        - source_session_id
        - participation_id
        - generation
        - policy_revision_id
        - policy_digest
        - events
      properties:
        source_session_id:
          description: ID of the browser activity source. It must match the path.
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        participation_id:
          description: ID of the Attempt Participation that started the source.
          $ref: '#/components/schemas/ID'
        generation:
          description: Participation Generation that started the source.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        policy_revision_id:
          description: ID of the Exam Revision whose Browser Policy the source uses.
          $ref: '#/components/schemas/ID'
        policy_digest:
          description: SHA-256 digest of that Browser Policy, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        events:
          description: The events, 1 to 64, in ascending sequence order.
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/BrowserDeliveryRecord'
      description: Stored browser activity events for one closed source, at most 256 KiB. Sequence numbers must be unique and increase strictly, and every event must use the source's policy revision. Each event digest covers only its own record, so it does not depend on how events are batched or sent.
