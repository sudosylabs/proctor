paths:
  /api/v1/exam-attempts/{exam_attempt_id}/delivery-limits:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: deliveryBudget
      summary: Read current delivery limits
      description: Returns the delivery usage of one Participation you own, together with the lifetime counters of the Attempt across every Participation Generation. The response is at most 8 KiB. You need a current Session for the registered key that owns the Participation. Retiring records or deleting the client's local spool never gives quota back. The snapshot doesn't allow interaction or raise any limit.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_not_open
        - exam.attempt.unavailable
        - exam.delivery.upload_expired
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/NativeDeliveryCredential'
        - $ref: '#/components/parameters/NativeDeliveryConnectionID'
        - name: participation_id
          in: query
          required: true
          description: ID of the Participation you own whose delivery limits you want.
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryBudgetOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/delivery-limits/stop-details:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: stopDeliveryDetails
      summary: Stop detailed delivery for a Participation
      description: 'Stops detailed delivery for one family, native or browser, for the current Participation, because the client has run out of room to track lost records. You need the live registered Desktop Connection and an Idempotency-Key. The stop can''t be undone. It fixes the reserved positions where they are and marks the rest as permanently missing, without making up receipts. The response holds the current budget and the affected statuses: at most one native stream or 49 browser sources, within 1 MiB. A retry with the same key checks live authority again and never affects a later Participation Generation. No quota is given back. This request alone never creates an Integrity Flag, a Suspension or a block on interaction.'
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_not_open
        - exam.attempt.unavailable
        - exam.delivery.upload_expired
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
        - idempotency.key_required
        - idempotency.key_invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/StopDeliveryDetails'
      responses:
        '200':
          $ref: '#/components/responses/StopDeliveryDetailsOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    DeliveryQuotaUsage:
      description: Usage and limits for one delivery family, for either the current Participation or the whole Attempt.
      type: object
      additionalProperties: false
      required:
        - retained_records
        - retained_bytes
        - allocated_positions
        - record_limit
        - byte_limit
        - position_limit
        - summary_only
        - stop_reason
      properties:
        retained_records:
          description: Number of records the server has kept so far.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        retained_bytes:
          description: Total size in bytes of the records the server has kept so far.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        allocated_positions:
          description: Number of sequence positions reserved so far.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        record_limit:
          description: Most records the server will keep.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        byte_limit:
          description: Most bytes of records the server will keep.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        position_limit:
          description: Most sequence positions that can be reserved.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        summary_only:
          description: True once detailed delivery has stopped. After that the server keeps only summary counts, and the counters no longer change.
          type: boolean
        stop_reason:
          description: Why detailed delivery stopped. records, bytes, positions and metadata name the limit that was reached. local_loss_inventory_exhausted means the client stopped it. Null while detailed delivery continues.
          type:
            - string
            - 'null'
          enum:
            - records
            - bytes
            - positions
            - metadata
            - local_loss_inventory_exhausted
            - null
    DeliveryFamilyBudget:
      description: Delivery usage for one family, native or browser.
      type: object
      additionalProperties: false
      required:
        - participation
        - attempt
        - pending_bytes
        - pending_byte_limit
      properties:
        participation:
          description: Usage of the current Participation Generation.
          $ref: '#/components/schemas/DeliveryQuotaUsage'
        attempt:
          description: Lifetime usage of the Attempt across every Participation Generation.
          $ref: '#/components/schemas/DeliveryQuotaUsage'
        pending_bytes:
          description: Bytes of records the server has received but not yet processed, for example because earlier positions are still missing.
          type: integer
          format: int64
          minimum: 0
          maximum: 2097152
        pending_byte_limit:
          description: Most bytes that may wait to be processed. Always 2 MiB.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          enum:
            - 2097152
    DeliveryBudgetSnapshot:
      description: Delivery usage of one Participation and of its Attempt.
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - native
        - browser
        - browser_flag_groups
        - browser_evidence_records
        - browser_evidence_bytes
        - explicit_missing_intervals
        - control_metadata_bytes
        - server_time
      properties:
        participation_id:
          description: ID of the Attempt Participation.
          $ref: '#/components/schemas/ID'
        generation:
          description: Participation Generation of that Participation.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        native:
          description: Usage for native security delivery.
          $ref: '#/components/schemas/DeliveryFamilyBudget'
        browser:
          description: Usage for browser activity delivery.
          $ref: '#/components/schemas/DeliveryFamilyBudget'
        browser_flag_groups:
          description: Number of browser Integrity Flag groups recorded for the Attempt. At most 256.
          type: integer
          format: int64
          minimum: 0
          maximum: 256
        browser_evidence_records:
          description: Number of browser Integrity Evidence records kept for the Attempt. At most 10,000.
          type: integer
          format: int64
          minimum: 0
          maximum: 10000
        browser_evidence_bytes:
          description: Total size in bytes of the browser Integrity Evidence kept for the Attempt. At most 8 MiB.
          type: integer
          format: int64
          minimum: 0
          maximum: 8388608
        explicit_missing_intervals:
          description: Number of declared missing ranges recorded for the Attempt. At most 4,096.
          type: integer
          format: int64
          minimum: 0
          maximum: 4096
        control_metadata_bytes:
          description: Bytes of delivery control metadata recorded for the Attempt, such as declarations and receipts. At most 2 MiB.
          type: integer
          format: int64
          minimum: 0
          maximum: 2097152
        server_time:
          description: Server time when the snapshot was taken.
          type: string
          format: date-time
          pattern: Z$
    StopDeliveryDetails:
      description: Which delivery family to stop detailed delivery for, and why.
      type: object
      additionalProperties: false
      required:
        - family
        - reason
      properties:
        family:
          description: 'The delivery family to stop: native security streams or browser activity sources.'
          type: string
          enum:
            - native
            - browser
        reason:
          description: 'Why delivery is stopping. Only local_loss_inventory_exhausted is accepted: the client has no room left to track lost records.'
          type: string
          enum:
            - local_loss_inventory_exhausted
    StopDeliveryDetailsResult:
      description: The budget after the stop, with the statuses it affected. Only the requested family is filled in.
      type: object
      additionalProperties: false
      required:
        - budget
        - native
        - browser
      properties:
        budget:
          description: Delivery usage after the stop.
          $ref: '#/components/schemas/DeliveryBudgetSnapshot'
        native:
          description: Status of the native security stream after the stop. Null when family is browser.
          oneOf:
            - $ref: '#/components/schemas/NativeSecurityStreamStatus'
            - type: 'null'
        browser:
          description: Statuses of the Participation's browser activity sources after the stop. Empty when family is native.
          type: array
          maxItems: 49
          items:
            $ref: '#/components/schemas/BrowserSourceStatus'
  requestBodies:
    StopDeliveryDetails:
      required: true
      description: The delivery family the client has run out of room to track lost records for. At most 2 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StopDeliveryDetails'
          example:
            family: browser
            reason: local_loss_inventory_exhausted
  responses:
    DeliveryBudgetOK:
      description: Current delivery usage and lifetime limits, at most 8 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeliveryBudgetSnapshot'
