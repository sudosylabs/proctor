components:
  responses:
    AssistantTranscript:
      description: One page of an assistant transcript and the inventory that binds all of it
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssistantTranscriptResponse'
          example:
            items:
              - sequence: 1
                created_at: '2026-08-01T09:30:00Z'
                gap: false
                turn:
                  conversation_id: 8kpous3h9nfemqtwz47ydgjcx1
                  turn_id: h9nfemqtwz47ydgjcx1ia56br8
                  role: candidate
                  text: Why does my loop never end?
                  model: ''
                  usage:
                    input: 0
                    cache_read: 0
                    cache_write: 0
                    output: 0
                    estimated: false
                  final: true
                  stop_reason: ''
            inventory:
              records: 1
              bytes: 312
              gaps: 0
              digest: sha256:4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945
  schemas:
    SendAssistantMessageRequest:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 16384
          description: The message; line breaks and tabs are its only control characters.
    AssistantTurnStartedResponse:
      type: object
      additionalProperties: false
      required:
        - conversation_id
        - turn_id
        - replayed
      properties:
        conversation_id:
          $ref: '#/components/schemas/ID'
        turn_id:
          $ref: '#/components/schemas/ID'
        replayed:
          type: boolean
          description: Whether this answers a retry of an earlier send.
    DecideAssistantApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - accept
            - decline
    AssistantTranscriptExportResponse:
      type: object
      additionalProperties: false
      required:
        - exam_attempt_id
        - records
        - inventory
      properties:
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
        records:
          type: array
          maxItems: 20000
          items:
            $ref: '#/components/schemas/AssistantRecord'
        inventory:
          $ref: '#/components/schemas/AssistantInventory'
    AssistantTranscriptResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - inventory
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AssistantRecord'
        inventory:
          $ref: '#/components/schemas/AssistantInventory'
        next_cursor:
          type: string
          description: >-
            Token for the next page. Send it back unchanged as `cursor`, and do not parse it. Omitted on the last
            page.
    AssistantRecord:
      type: object
      additionalProperties: false
      description: >-
        One transcript record, a turn or a tool call. Gap marks a record the server wrote for a turn that ended
        abnormally, such as at a seal or a provider failure.
      required:
        - sequence
        - created_at
        - gap
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        gap:
          type: boolean
        turn:
          $ref: '#/components/schemas/AssistantTurn'
        call:
          $ref: '#/components/schemas/AssistantCall'
    AssistantTurn:
      type: object
      additionalProperties: false
      description: >-
        A candidate message, or part of a reply. A reply's text and its end are separate records; the final record
        carries the stop reason and the turn's usage, which includes any rewrite.
      required:
        - conversation_id
        - turn_id
        - role
        - text
        - model
        - usage
        - final
        - stop_reason
      properties:
        conversation_id:
          $ref: '#/components/schemas/ID'
        turn_id:
          $ref: '#/components/schemas/ID'
        role:
          type: string
          enum:
            - candidate
            - assistant
        text:
          type: string
        model:
          type: string
          maxLength: 256
        usage:
          $ref: '#/components/schemas/AssistantUsage'
        final:
          type: boolean
        stop_reason:
          type: string
          enum:
            - ''
            - end_turn
            - tool_use
            - max_tokens
            - stop_sequence
            - refusal
            - canceled
            - sealed
            - access_lost
            - budget_exhausted
            - rate_limited
            - overloaded
            - invalid
            - context_too_long
            - unavailable
            - lease_expired
    AssistantUsage:
      type: object
      additionalProperties: false
      description: Tokens a turn used. Estimated marks a figure the server estimated because the provider's count was lost.
      required:
        - input
        - cache_read
        - cache_write
        - output
        - estimated
      properties:
        input:
          type: integer
          format: int64
          minimum: 0
        cache_read:
          type: integer
          format: int64
          minimum: 0
        cache_write:
          type: integer
          format: int64
          minimum: 0
        output:
          type: integer
          format: int64
          minimum: 0
        estimated:
          type: boolean
    AssistantCall:
      type: object
      additionalProperties: false
      description: >-
        One phase of a tool call: requested, decision (an approval answer), reserved (a command slot), completed,
        or applied (a Pair proposal matched by a candidate batch). A command's reservation names its assistant:N
        process tag before the process starts. Its completion carries the exit code; the Workspace journal names
        the call in the author of every change an Agent edit made.
      required:
        - conversation_id
        - turn_id
        - call_id
        - tool
        - phase
        - arguments
        - result
        - outcome
        - duration_milliseconds
        - approval
        - process_tag
        - truncated
      properties:
        conversation_id:
          $ref: '#/components/schemas/ID'
        turn_id:
          $ref: '#/components/schemas/ID'
        call_id:
          $ref: '#/components/schemas/ID'
        tool:
          type: string
          enum:
            - list_files
            - read_file
            - search
            - read_terminal
            - run_command
            - start_session
            - send_input
            - stop_session
            - propose_edit
            - apply_edit
            - output_check
        phase:
          type: string
          enum:
            - requested
            - reserved
            - decision
            - completed
            - applied
            - session_ended
        arguments:
          type: object
          additionalProperties: true
          description: The arguments as the model sent them, on the requested phase.
        result:
          type: string
          description: >-
            Bounded tool result text. On a completed propose_edit call with outcome proposed, this is a JSON
            object serialized as text, with path (workspace path), base_content_version (the expected current
            file version, or an empty string for a new file), sha256 (lowercase hexadecimal SHA-256 of the full
            replacement), size_bytes (replacement UTF-8 byte count), and diff (a complete unified replacement
            diff). A matching ordinary candidate batch adds an applied phase to this call; the workspace write
            remains authored by the candidate. Other tools return text, and an applied phase contains a matching
            marker rather than the proposal object.
        outcome:
          type: string
          enum:
            - ''
            - ok
            - error
            - declined
            - canceled
            - proposed
            - applied
            - rewrite
            - replaced
            - exited
            - stopped
            - timed_out
            - sealed
            - ended
        duration_milliseconds:
          type: integer
          format: int64
          minimum: 0
        approval:
          type: string
          enum:
            - ''
            - pending
            - accept
            - decline
            - auto
            - expired
        process_tag:
          type: string
        exit_code:
          type: integer
        signal:
          type: string
          maxLength: 16
        truncated:
          type: boolean
    AssistantSession:
      type: object
      additionalProperties: false
      required: [tag, command, state, started_at]
      properties:
        tag:
          type: string
          pattern: '^assistant:[1-9][0-9]{0,9}$'
        command:
          type: string
        state:
          type: string
          enum: [running, ended]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [exited, stopped, timed_out, sealed, ended]
    AssistantSessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 52
          items:
            $ref: '#/components/schemas/AssistantSession'
        next_cursor:
          type: string
    AssistantSessionScreen:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
    AssistantInventory:
      type: object
      additionalProperties: false
      description: The transcript's record and byte counts, its gaps, and a SHA-256 digest chained over every record in order.
      required:
        - records
        - bytes
        - gaps
        - digest
      properties:
        records:
          type: integer
          format: int64
          minimum: 0
          maximum: 20000
        bytes:
          type: integer
          format: int64
          minimum: 0
        gaps:
          type: integer
          format: int64
          minimum: 0
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
