paths:
  /api/v1/exam-attempts/{exam_attempt_id}/assistant/messages:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: sendCandidateAssistantMessage
      summary: Ask the assistant
      tags:
        - Attempts and workspaces
      description: >-
        Records the candidate's message and starts the assistant's reply, which streams to the candidate's
        originating session as exam_attempt_assistant_* events and is recorded in the transcript. The answer is 202 with
        the turn the message started; a retry with the same Idempotency-Key and text returns the same turn without
        starting another. One turn runs at a time per Attempt: while one runs the request fails with
        exam.attempt.assistant_busy. The request also fails when the Exam Revision does not offer the assistant,
        when the installation has it off, and when the Attempt's allowance of turns or tokens is spent. The
        assistant acts only while the candidate's own access holds: a seal or the end of the participation ends a
        running turn, which the transcript records.
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.assistant_unavailable
        - exam.attempt.assistant_disabled
        - audit.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.attempt.assistant_busy
        - exam.attempt.assistant_budget_exhausted
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        description: The candidate's message, 1 to 16 KiB of text.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAssistantMessageRequest'
            example:
              text: Why does my loop never end?
      responses:
        '202':
          description: The message was recorded and the reply started
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantTurnStartedResponse'
              example:
                conversation_id: 8kpous3h9nfemqtwz47ydgjcx1
                turn_id: h9nfemqtwz47ydgjcx1ia56br8
                replayed: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/assistant/turns:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: listCandidateAssistantTranscript
      summary: Read the assistant transcript
      tags:
        - Attempts and workspaces
      description: >-
        Pages the candidate's own assistant transcript in record order: each message, reply, tool call, approval
        and output check, as recorded. Realtime deltas are hints; this is what a client keeps, and it reloads from
        here after a dropped socket. It needs only the candidate's Session, so the transcript stays readable after
        submission. The inventory covers the whole transcript, and at the seal its digest is bound to the
        Submission.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.attempt.assistant_unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - exam.delivery.metadata_capacity
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          $ref: '#/components/responses/AssistantTranscript'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/assistant/export:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: exportCandidateAssistantTranscript
      summary: Download the sealed assistant transcript
      tags:
        - Attempts and workspaces
      description: Downloads the candidate's own sealed assistant transcript and the inventory that verifies it as one JSON attachment. A current candidate Session is required. The download is unavailable before sealing or after retirement.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.attempt.assistant_unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - exam.delivery.metadata_capacity
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The candidate's complete sealed transcript
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              description: Instructs the client to download the JSON document.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantTranscriptExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/assistant/turns/{turn_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - name: turn_id
        in: path
        required: true
        description: The running turn to stop.
        schema:
          $ref: '#/components/schemas/ID'
    post:
      operationId: cancelCandidateAssistantTurn
      summary: Stop the assistant's turn
      tags:
        - Attempts and workspaces
      description: >-
        Stops the running turn wherever it runs: the model call ends, any assistant command is killed, and the
        transcript records the turn as canceled. Tokens already spent stay spent.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/exam-attempts/8kpous3h9nfemqtwz47ydgjcx1/assistant/turns/h9nfemqtwz47ydgjcx1ia56br8/cancel' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-Attempt-Connection-ID: <connection-id>' \
              --header 'X-Proctor-Attempt-Credential: <continuity-credential>'
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.assistant_unavailable
        - exam.attempt.assistant_disabled
        - exam.attempt.assistant_turn_not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
      responses:
        '204':
          description: The turn was stopped
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/assistant/approvals/{call_id}:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - name: call_id
        in: path
        required: true
        description: The tool call that waits for the candidate's approval.
        schema:
          $ref: '#/components/schemas/ID'
    post:
      operationId: decideCandidateAssistantApproval
      summary: Approve or decline an assistant command or edit
      tags:
        - Attempts and workspaces
      description: >-
        Answers an exam_attempt_assistant_approval_requested event. When the Exam asks for approvals, each command
        and each edit waits for the candidate; an unanswered request is declined after five minutes. The answer is
        recorded once: a second answer, or one after the expiry, fails with
        exam.attempt.assistant_approval_conflict.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.assistant_unavailable
        - exam.attempt.assistant_disabled
        - exam.attempt.assistant_approval_not_found
        - exam.attempt.assistant_approval_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
      requestBody:
        required: true
        description: Accept or decline this pending command or edit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideAssistantApprovalRequest'
            example:
              decision: accept
      responses:
        '204':
          description: The answer was recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
