paths:
  /api/v1/exam-attempts/{exam_attempt_id}/workspace/changes:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: listCandidateExamWorkspaceChanges
      summary: List ordered acknowledged Workspace changes
      description: Returns the Workspace changes the server accepted after workspace_cursor, in order, for the candidate's active Attempt. If the server no longer keeps enough history to continue from that cursor, the response tells the client to reload the full file list instead.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - name: workspace_cursor
          in: query
          required: false
          description: List only changes made after this Workspace Cursor. Zero, or leaving it out, starts at the oldest change the server still keeps. Leave it out when you continue a listing with cursor.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/CandidateWorkspaceJournalOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    CandidateWorkspaceJournalOK:
      description: One page of Workspace changes in order, or a signal to reload the full file list.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateWorkspaceJournalResponse'
          example:
            workspace_id: wj3drgzdpnf54rxf5d8qd3dqne
            current_cursor: 17
            items:
              - cursor: 15
                entry_id: 14j8umgczgrdp95w77zuxmxfu9
                kind: file
                operation: replace_file
                old_path: answers/main.go
                new_path: answers/main.go
                content_version: kVcIsgUpj6Sg9aheovEZXzUjpw
                changed_at: '2026-08-01T09:12:40Z'
              - cursor: 16
                entry_id: saqjfmjqqy9mo1yj4zwed73333
                kind: file
                operation: move_entry
                old_path: answers/draft.txt
                new_path: answers/notes.txt
                content_version: VhOGu5NgyvhwvSuqK4dWGlgnoA
                changed_at: '2026-08-01T09:14:05Z'
            next_cursor: eyJhZnRlcl93b3Jrc3BhY2VfY3Vyc29yIjoxNn0
            refresh_required: false
  schemas:
    CandidateWorkspaceJournalEntryResponse:
      description: One change the server accepted in the Attempt Workspace.
      type: object
      additionalProperties: false
      required:
        - cursor
        - entry_id
        - kind
        - operation
        - changed_at
      properties:
        cursor:
          description: Workspace Cursor of this change. Cursors go up by one with each change, with no gaps.
          type: integer
          format: int64
          minimum: 1
        entry_id:
          description: ID of the Workspace Entry that changed.
          $ref: '#/components/schemas/ID'
        kind:
          description: Whether the changed entry is a file or a directory.
          type: string
          enum:
            - file
            - directory
        operation:
          description: The kind of change.
          type: string
          enum:
            - create_file
            - create_directory
            - replace_file
            - move_entry
            - delete_entry
        old_path:
          description: Path of the entry before the change. Present for replace_file, move_entry and delete_entry. For replace_file it equals new_path.
          $ref: '#/components/schemas/StarterWorkspacePath'
        new_path:
          description: Path of the entry after the change. Present for create_file, create_directory, replace_file and move_entry. Omitted for delete_entry.
          $ref: '#/components/schemas/StarterWorkspacePath'
        content_version:
          description: Workspace Content Version of the file after the change. Present when a file is created, replaced or moved. Omitted for directories and deletions.
          $ref: '#/components/schemas/WorkspaceContentVersion'
        changed_at:
          description: When the server accepted the change.
          type: string
          format: date-time
        recursive:
          type: boolean
          description: True when this deletion removes the directory at old_path and everything inside it, meaning every path that starts with old_path followed by a slash. Apply the whole removal at this one cursor.
    CandidateWorkspaceJournalResponse:
      description: One page of Workspace changes after the requested cursor.
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - current_cursor
        - items
        - refresh_required
      properties:
        workspace_id:
          description: ID of the Attempt Workspace.
          $ref: '#/components/schemas/ID'
        current_cursor:
          description: Latest Workspace Cursor of the Workspace when the server read this page.
          type: integer
          format: int64
          minimum: 0
        items:
          description: Changes in ascending cursor order. Empty when refresh_required is true.
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CandidateWorkspaceJournalEntryResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        refresh_required:
          description: True when the server can't continue from the requested cursor, because the cursor is ahead of the Workspace or older than the history the server keeps. The page is then empty, and the client must reload the full file list.
          type: boolean
