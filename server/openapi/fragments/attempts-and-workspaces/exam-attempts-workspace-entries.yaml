paths:
  /api/v1/exam-attempts/{exam_attempt_id}/workspace/entries/{attempt_workspace_entry_id}:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/AttemptWorkspaceEntryID'
    patch:
      operationId: moveCandidateExamWorkspaceEntry
      summary: Rename or move one Workspace entry
      description: Renames or moves one file or directory from its expected path to a new path in the active Workspace, in a single step. If the path is out of date, the move would put a directory inside itself, or something already exists at the destination, the request fails and the Workspace is left unchanged. The parent directory of the destination must already exist.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.attempt.workspace.path_conflict
        - exam.attempt.workspace.entry_conflict
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/MoveCandidateWorkspaceEntry'
      responses:
        "200":
          $ref: '#/components/responses/CandidateWorkspaceMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteCandidateExamWorkspaceEntry
      summary: Delete a Workspace entry or a guarded directory subtree
      description: Deletes one Workspace entry, but only when its expected path still matches and, for a file, its expected Workspace Content Version still matches. A directory must be empty unless recursive is true. A recursive delete needs the expected_workspace_cursor from the client's file list. It fails if any other Workspace change happened after that cursor. Otherwise it removes the directory and everything inside it in a single step, recorded as one recursive change. No other change needs a Workspace Cursor.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.attempt.workspace.path_conflict
        - exam.attempt.workspace.entry_conflict
        - exam.attempt.workspace.content_conflict
        - exam.attempt.workspace.directory_not_empty
        - exam.attempt.workspace.cursor_conflict
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/DeleteCandidateWorkspaceEntry'
      responses:
        "200":
          $ref: '#/components/responses/CandidateWorkspaceMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    MoveCandidateWorkspaceEntry:
      required: true
      description: The active Participation and its generation, the entry's current path, and the path to move it to.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MoveCandidateWorkspaceEntryRequest'
          example:
            participation_id: ybndrfg8ejkmcpqxot1uwisza3
            generation: 2
            expected_path: answers/draft.txt
            destination_path: answers/final.txt
    DeleteCandidateWorkspaceEntry:
      required: true
      description: The active Participation and its generation, and the state the entry must still have for the delete to go ahead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteCandidateWorkspaceEntryRequest'
          example:
            participation_id: ybndrfg8ejkmcpqxot1uwisza3
            generation: 2
            expected_path: answers/draft.txt
            expected_content_version: ybndrfg8ejkmcpqxot1uwisza4
  schemas:
    MoveCandidateWorkspaceEntryRequest:
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - expected_path
        - destination_path
      properties:
        participation_id:
          description: ID of the active Attempt Participation, returned when the candidate connected to the Attempt.
          $ref: '#/components/schemas/ID'
        generation:
          description: Participation Generation of the active Participation. A write from an older generation is rejected.
          type: integer
          format: int64
          minimum: 1
        expected_path:
          description: Path the entry must still have. If it has moved since the client last saw it, the request fails.
          $ref: '#/components/schemas/StarterWorkspacePath'
        destination_path:
          description: New Workspace Path for the entry. It must differ from expected_path, nothing may exist there, and its parent directory must exist.
          $ref: '#/components/schemas/StarterWorkspacePath'
    DeleteCandidateWorkspaceEntryRequest:
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - expected_path
      properties:
        participation_id:
          description: ID of the active Attempt Participation, returned when the candidate connected to the Attempt.
          $ref: '#/components/schemas/ID'
        generation:
          description: Participation Generation of the active Participation. A write from an older generation is rejected.
          type: integer
          format: int64
          minimum: 1
        expected_path:
          description: Path the entry must still have. If it has moved since the client last saw it, the request fails.
          $ref: '#/components/schemas/StarterWorkspacePath'
        expected_content_version:
          $ref: '#/components/schemas/WorkspaceContentVersion'
          description: Workspace Content Version the file must still have. Required to delete a file. Leave it out for a directory.
        recursive:
          type: boolean
          default: false
          description: When true, deletes this directory and everything inside it in a single step. Needs expected_workspace_cursor and can't be used on a file.
        expected_workspace_cursor:
          type: integer
          format: int64
          minimum: 0
          description: Workspace Cursor of the client's current file list. Send it only when recursive is true. If any other change happened after this cursor, the request fails with a conflict.
      allOf:
        - if:
            required: [recursive]
            properties:
              recursive:
                const: true
          then:
            required: [expected_workspace_cursor]
            not:
              required: [expected_content_version]
          else:
            not:
              required: [expected_workspace_cursor]
