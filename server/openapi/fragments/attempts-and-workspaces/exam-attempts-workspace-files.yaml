paths:
  /api/v1/exam-attempts/{exam_attempt_id}/workspace/files:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: createCandidateExamWorkspaceFile
      summary: Stage and acknowledge one Workspace file
      tags:
        - Attempts and workspaces
      description: Uploads one new file to the candidate's active Attempt Workspace. The request is multipart, with the metadata part first. Its size is limited both by the API and by the Exam Revision the Attempt uses. It needs the Attempt credential bound to the Session, an open Connection, the active Participation Generation, a SHA-256 digest of the content, and an Idempotency-Key.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/exam-attempts/<exam-attempt-id>/workspace/files' \
              --header 'Authorization: DPoP <desktop-session-access-credential>' \
              --header 'DPoP: <fresh-proof-for-this-post-target-and-current-nonce>' \
              --header 'X-Proctor-Attempt-Credential: <attempt-credential>' \
              --header 'X-Proctor-Attempt-Connection-ID: <attempt-connection-id>' \
              --header 'Idempotency-Key: docs-workspace-file-019' \
              --form 'metadata={"participation_id":"<participation-id>","generation":2,"path":"answers/main.go","media_type":"text/plain","size":128,"sha256":"<sha256>"};type=application/json' \
              --form 'content=@main.go;type=application/octet-stream'
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.attempt.workspace.path_conflict
        - exam.attempt.workspace.entry_conflict
        - exam.attempt.workspace.entry_limit
        - exam.attempt.workspace.size_limit
        - exam.attempt.workspace.object_conflict
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CandidateWorkspaceFileUploadMultipart'
            encoding:
              metadata:
                contentType: application/json
              content:
                contentType: application/octet-stream
        description: 'Exactly two multipart parts, in order: the JSON metadata, then the file content. The Attempt credential and Connection go in headers, never in form fields.'
      responses:
        "201":
          $ref: '#/components/responses/CandidateWorkspaceMutationCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/workspace/files/{attempt_workspace_entry_id}/content:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/AttemptWorkspaceEntryID'
    get:
      operationId: getCandidateExamWorkspaceContent
      summary: Render a protected candidate Workspace file inline
      tags:
        - Attempts and workspaces
      description: Streams one file from the active Workspace. Before it sends anything, the server checks the Session, the Attempt credential, the open Connection, the current Participation, and that the Attempt can still be read. The response never reveals where the file is stored. Responses are private and not cached (no-store), use nosniff, carry an ETag, and return 304 when the content has not changed.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request GET \
              --url 'https://proctor.example.edu/api/v1/exam-attempts/<exam-attempt-id>/workspace/files/<workspace-entry-id>/content' \
              --header 'Authorization: DPoP <desktop-session-access-credential>' \
              --header 'DPoP: <fresh-proof-for-this-get-target-and-current-nonce>' \
              --header 'X-Proctor-Attempt-Credential: <attempt-credential>' \
              --header 'X-Proctor-Attempt-Connection-ID: <attempt-connection-id>' \
              --output 'main.go'
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - name: If-None-Match
          in: header
          required: false
          description: One or more entity tags from an earlier protected-content response. A match returns 304 without a body.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/CandidateExamProtectedContent'
        "304":
          $ref: '#/components/responses/CandidateExamContentNotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceCandidateExamWorkspaceFile
      summary: Replace one exact Workspace file content state
      description: Replaces the content of one Workspace file, but only when its expected path and Workspace Content Version still match. The server checks the multipart upload (metadata part first), the digest, the active Participation Generation, the open Connection and the Idempotency-Key before it accepts the new content.
      x-codeSamples:
        - lang: Shell
          label: Replace acknowledged Workspace content
          source: |-
            curl --request PUT \
              --header "Authorization: DPoP $PROCTOR_DESKTOP_ACCESS_CREDENTIAL" \
              --header "DPoP: $PROCTOR_DPOP_PROOF" \
              --header "X-Proctor-Attempt-Credential: $ATTEMPT_CREDENTIAL" \
              --header "X-Proctor-Attempt-Connection-ID: $ATTEMPT_CONNECTION_ID" \
              --header "Idempotency-Key: workspace-replace-020" \
              --form 'metadata={"participation_id":"ybndrfg8ejkmcpqxot1uwisza3","generation":2,"expected_path":"answers/main.go","expected_content_version":3,"media_type":"text/plain","size":128,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"};type=application/json' \
              --form 'content=@./main.go;type=application/octet-stream' \
              https://proctor.example.edu/api/v1/exam-attempts/ybndrfg8ejkmcpqxot1uwisza4/workspace/files/ybndrfg8ejkmcpqxot1uwisza5/content
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.attempt.workspace.path_conflict
        - exam.attempt.workspace.entry_conflict
        - exam.attempt.workspace.content_conflict
        - exam.attempt.workspace.size_limit
        - exam.attempt.workspace.object_conflict
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        description: The replacement metadata first, then the file content. Both parts must describe the same content, and the server checks them before it accepts the change.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReplaceCandidateWorkspaceFileMultipart'
            encoding:
              metadata:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "200":
          $ref: '#/components/responses/CandidateWorkspaceMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    CandidateWorkspaceFileUploadMetadata:
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - path
        - media_type
        - size
        - sha256
      properties:
        participation_id:
          $ref: '#/components/schemas/ID'
          description: ID of the active Attempt Participation, returned when the candidate connected to the Attempt.
        generation:
          type: integer
          format: int64
          minimum: 1
          description: Participation Generation of the active Participation. A write from an older generation is rejected.
        path:
          $ref: '#/components/schemas/StarterWorkspacePath'
          description: Workspace Path of the new file. Its parent directory must already exist and nothing may exist at the path yet.
        media_type:
          type: string
          minLength: 1
          maxLength: 255
          description: Media type of the file content.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: Exact length of the content in bytes. It must fit both the limit of the Exam Revision and the API limit.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: Lowercase hexadecimal SHA-256 digest of the content. The server rejects the upload if the content does not match.
    CandidateWorkspaceFileUploadMultipart:
      type: object
      additionalProperties: false
      required:
        - metadata
        - content
      description: 'Exactly two parts, in order: the JSON metadata, then the file content. The whole request may be at most 100 MiB plus 64 KiB.'
      properties:
        metadata:
          description: JSON metadata that describes the file. It must be the first part.
          $ref: '#/components/schemas/CandidateWorkspaceFileUploadMetadata'
        content:
          description: The file content. It must be the second part and match the size and digest in metadata.
          type: string
          format: binary
    ReplaceCandidateWorkspaceFileMetadata:
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - expected_path
        - expected_content_version
        - media_type
        - size
        - sha256
      properties:
        participation_id:
          $ref: '#/components/schemas/ID'
          description: ID of the active Attempt Participation, returned when the candidate connected to the Attempt.
        generation:
          type: integer
          format: int64
          minimum: 1
          description: Participation Generation of the active Participation. A write from an older generation is rejected.
        expected_path:
          $ref: '#/components/schemas/StarterWorkspacePath'
          description: Path the file must still have before its content can be replaced.
        expected_content_version:
          $ref: '#/components/schemas/WorkspaceContentVersion'
          description: Workspace Content Version the client last received for this file. If the file changed since then, the request fails instead of overwriting the newer content.
        media_type:
          type: string
          minLength: 1
          maxLength: 255
          description: Media type of the replacement content.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: Exact length of the replacement content in bytes. It must fit both the limit of the Exam Revision and the API limit.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: Lowercase hexadecimal SHA-256 digest of the replacement content. The server rejects the upload if the content does not match.
    ReplaceCandidateWorkspaceFileMultipart:
      type: object
      additionalProperties: false
      required:
        - metadata
        - content
      description: 'Exactly two parts, in order: the JSON replacement metadata, then the file content.'
      properties:
        metadata:
          description: JSON metadata that describes the replacement. It must be the first part.
          $ref: '#/components/schemas/ReplaceCandidateWorkspaceFileMetadata'
        content:
          description: The replacement file content. It must be the second part and match the size and digest in metadata.
          type: string
          format: binary
