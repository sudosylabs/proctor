paths:
  /api/v1/exam-attempts/{exam_attempt_id}/workspace:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: listCandidateExamWorkspace
      summary: List one protected candidate Workspace page
      description: Lists one page of the files and directories in the candidate's active Attempt Workspace. The request needs the Attempt credential bound to the Session and an open Connection. Every page is tied to the Workspace Cursor of the first page. If the Workspace changes while you page through it, the response tells you to start again from the first page.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - name: limit
          in: query
          required: false
          description: Largest number of Workspace entries to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Cursor from next_cursor of the previous page. Send it back unchanged. Don't build or parse it yourself.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/CandidateExamWorkspaceListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    CandidateExamWorkspaceListOK:
      description: One page of the Attempt Workspace file list.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateExamWorkspaceListResponse'
          example:
            workspace_id: wj3drgzdpnf54rxf5d8qd3dqne
            workspace_cursor: 14
            items:
              - id: ih1r84kij94nrwis97rft6rduh
                kind: directory
                path: answers
              - id: 14j8umgczgrdp95w77zuxmxfu9
                kind: file
                path: answers/main.go
                content_version: W8zNIQt3uL4FFQKoKGwRDIOYQ_
                media_type: text/x-go
                size: 2184
                sha256: 6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b
            next_cursor: eyJ3b3Jrc3BhY2VfY3Vyc29yIjoxNCwiYWZ0ZXJfZW50cnlfaWQiOiIxNGo4dW1nY3pncmRwOTV3Nzd6dXhteGZ1OSJ9
            refresh_required: false
  schemas:
    CandidateExamWorkspaceListResponse:
      description: One page of the files and directories in the Attempt Workspace.
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - workspace_cursor
        - items
        - refresh_required
      properties:
        workspace_id:
          description: ID of the Attempt Workspace.
          $ref: '#/components/schemas/ID'
        workspace_cursor:
          description: Workspace Cursor this page reflects. Use it as workspace_cursor when you list changes made after this listing.
          type: integer
          format: int64
          minimum: 0
        items:
          description: Files and directories on this page, in ascending path order. Empty when refresh_required is true.
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CandidateExamWorkspaceItemResponse'
        next_cursor:
          type: string
          description: Cursor for the next page. Omitted on the last page. Send it back unchanged as cursor. It holds no Workspace path.
        refresh_required:
          type: boolean
          description: True when the Workspace changed after the first page was read. The page is then empty, and you must start again from the first page.