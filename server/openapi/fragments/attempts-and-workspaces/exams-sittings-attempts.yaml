paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: listExamAttempts
      summary: List bounded candidate Attempts for one Exam Sitting
      description: Lists the Attempts of one Exam Sitting, after checking again that the caller may manage it. You can filter by Attempt state. Rows contain no candidate credentials, answers, private Integrity Evidence or internal lease data.
      tags:
        - Attempts and workspaces
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: Return only Attempts in these states. Repeat the parameter for each state, at most three, without duplicates.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            uniqueItems: true
            items:
              $ref: '#/components/schemas/ExamAttemptState'
        - name: limit
          in: query
          required: false
          description: Largest number of Attempts to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Cursor from next_cursor of the previous page. Send it back unchanged. Attempts are listed newest
            first.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ExamAttemptManagerListOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: getExamAttempt
      summary: Get one manager-safe Exam Attempt projection
      description: Returns one Attempt, after checking that it belongs to the Exam and Sitting in the path and that the caller may manage it. The response shows the Attempt's operational state. It contains no candidate credentials, answers or private evidence.
      tags:
        - Attempts and workspaces
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - audit.unavailable
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/ExamAttemptManagerOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/browser-activity:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: listExamAttemptBrowserActivity
      summary: List privacy-minimized Browser Activity for one managed Attempt
      description: Returns one page of top-level browser navigation records for an Attempt, with only the details the review needs. The server checks that the caller is currently an Exam Manager of this Exam and holds the separate Browser Activity view permission, and it checks again on every page. Administrator, teacher, integrity review and general export permissions don't replace it. Responses are not cached. They contain no Session, Connection, Desktop Registration, credentials, page content or private Submission Review state.
      tags:
        - Attempts and workspaces
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - audit.unavailable
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Largest number of browser activity records to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Cursor from next_cursor of the previous page. Send it back unchanged. Don't try to read browser
            locations from it.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/BrowserActivityListOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/reallow:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: reallowExamAttempt
      summary: Re-allow one exact suspended Exam Attempt
      tags:
        - Attempts and workspaces
      description: Ends the given active Suspension and returns the Attempt to Ready. Integrity Evidence is kept. No continuity credential, Participation, Session binding or Connection is created, so the candidate must enter again and pass every admission check.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.revision_conflict
        - exam.attempt.suspension_conflict
        - exam.attempt.state_conflict
        - exam.attempt.sitting_not_open
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReallowExamAttempt'
      responses:
        '200':
          $ref: '#/components/responses/ExamAttemptReallowed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/suspend:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: suspendExamAttempt
      summary: Suspend (kick) one exact active Exam Attempt
      tags:
        - Attempts and workspaces
      description: Lets an Exam Manager suspend an Attempt at once. It ends the active Participation Generation as kicked, closes its open Connection and opens one manual Suspension, with no Integrity Flag. While suspended, the Attempt refuses connections, Workspace and Exam material access, and Submission until someone allowed to re-allows it. The candidate sees only the reason manager_suspended. The manager's private reason is kept only in the Suspension record. Database time decides the outcome. Once the Sitting's scheduled end has passed, the request fails with exam.attempt.sitting_not_open. If the Participation Lease had already run out, the server records that Connection Loss (Integrity Flag, evidence and policy Suspension) and fails with exam.attempt.connection_lost instead.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.revision_conflict
        - exam.attempt.state_conflict
        - exam.attempt.sitting_not_open
        - exam.attempt.connection_lost
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SuspendExamAttempt'
      responses:
        '200':
          $ref: '#/components/responses/ExamAttemptSuspended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    SuspendExamAttempt:
      required: true
      description: The Attempt revision you expect and the private reason for the suspension, which is audited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuspendExamAttemptRequest'
          example:
            expected_revision: 3
            reason: Candidate left the examination room without permission.
    ReallowExamAttempt:
      required: true
      description: The active Suspension, the Attempt revision you expect and the private reason for the re-allow, which is audited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReallowExamAttemptRequest'
          example:
            suspension_id: ybndrfg8ejkmcpqxot1uwisza3
            expected_revision: 4
            reason: Candidate identity was reverified by the invigilator.
  responses:
    ExamAttemptSuspended:
      description: The Attempt is suspended. The private reason is not returned.
