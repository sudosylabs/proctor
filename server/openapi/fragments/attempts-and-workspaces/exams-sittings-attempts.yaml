  schemas:
    BrowserActivityListResponse:
      description: One page of browser activity records.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          description: Records on this page.
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/BrowserActivityItemResponse'
        next_cursor:
          description: Cursor for the next page. Omitted on the last page. Send it back unchanged as cursor.
          type: string
    BrowserActivityItemResponse:
      description: One browser activity record.
      type: object
      additionalProperties: false
      required:
        - source_session_id
        - generation
        - sequence
        - kind
        - policy_revision_id
        - client_occurred_at
        - location
        - matched_rule_id
        - block_reason
        - received_at
        - redirect_from_sequence
      properties:
        source_session_id:
          description: ID of the browser activity source that recorded the event.
          type: string
          format: uuid
        generation:
          description: Participation Generation the source belonged to.
          type: integer
          format: int64
          minimum: 1
        sequence:
          description: Sequence number of the event in its source.
          type: integer
          format: int64
          minimum: 1
        kind:
          description: 'What happened: the browser opened or closed, a top-level page loaded or redirected, or a top-level navigation was blocked.'
          type: string
          enum:
            - browser_opened
            - browser_closed
            - top_level_navigation
            - top_level_redirect
            - blocked_top_level_navigation
        policy_revision_id:
          description: ID of the Exam Revision whose Browser Policy applied.
          $ref: '#/components/schemas/ID'
        client_occurred_at:
          description: When the event happened, by the client clock.
          type: string
          format: date-time
        location:
          description: Where the navigation went, with only the details needed for review. A successful navigation, or an HTTPS one the policy blocked, has an HTTPS host, a port only when it isn't the default, and a path. A blocked HTTP navigation has the same parts with the scheme http. Any other scheme that isn't allowed keeps only its lowercase scheme, with empty host and path. A block for invalid_url has empty scheme, host and path. Query strings, fragments, user information, local paths and scheme content are never kept. Null for browser_opened and browser_closed.
          type:
            - object
            - 'null'
          additionalProperties: false
          required:
            - scheme
            - host
            - path
          properties:
            scheme:
              description: Lowercase URL scheme, or empty for an invalid URL.
              type: string
              maxLength: 32
              pattern: ^$|^[a-z][a-z0-9+.-]{0,31}$
            host:
              description: Host name. Empty when only the scheme is kept.
              type: string
            port:
              description: Port number, present only when it isn't the default for the scheme.
              type: string
              pattern: ^[0-9]{1,5}$
            path:
              description: URL path. Empty when only the scheme is kept.
              type: string
        matched_rule_id:
          description: ID of the Browser Policy rule that allowed the navigation. Null when no rule matched or the event is not a navigation.
          type:
            - string
            - 'null'
        block_reason:
          description: Why the navigation was blocked. Null unless kind is blocked_top_level_navigation.
          type:
            - string
            - 'null'
          enum:
            - scheme_not_allowed
            - origin_not_allowed
            - path_not_allowed
            - redirect_not_allowed
            - invalid_url
            - null
        received_at:
          description: When the server received the event.
          type: string
          format: date-time
        redirect_from_sequence:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 50000
          description: Sequence number of the earlier event in the same source that this redirect came from. Null when the event is not a redirect.
          format: int64
    ExamAttemptState:
      description: Lifecycle state of an Exam Attempt. ready means the candidate may enter. active means a Participation is in progress. suspended means a Suspension blocks the Attempt. submitted means the Attempt has a Submission and is finished.
      type: string
      enum:
        - ready
        - active
        - suspended
        - submitted
    AttemptParticipationState:
      description: Whether a Participation is still active or has ended.
      type: string
      enum:
        - active
        - ended
    AttemptParticipationEndReason:
      description: Why a Participation ended.
      type: string
      enum:
        - interrupted
        - lease_expired
        - kicked
        - submitted
        - sitting_closed
    AttemptConnectionState:
      description: Whether a Connection is open or closed.
      type: string
      enum:
        - open
        - closed
    AttemptConnectionCloseReason:
      description: Why a Connection closed.
      type: string
      enum:
        - transport_closed
        - interrupted
        - lease_expired
        - kicked
        - submitted
        - sitting_closed
    ExamAttemptWorkspaceResponse:
      description: The Attempt Workspace.
      type: object
      additionalProperties: false
      required:
        - id
        - cursor
        - created_at
        - updated_at
      properties:
        id:
          description: ID of the Attempt Workspace.
          $ref: '#/components/schemas/ID'
        cursor:
          description: Current Workspace Cursor. It goes up by one with every accepted change.
          type: integer
          format: int64
          minimum: 0
        created_at:
          description: When the Workspace was created.
          type: string
          format: date-time
        updated_at:
          description: When the Workspace last changed.
          type: string
          format: date-time
    ExamAttemptParticipationResponse:
      description: The latest Attempt Participation.
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - generation
        - renewal_sequence
        - started_at
        - updated_at
        - lease_expires_at
      properties:
        id:
          description: ID of the Participation.
          $ref: '#/components/schemas/ID'
        state:
          description: Whether the Participation is active or has ended.
          $ref: '#/components/schemas/AttemptParticipationState'
        generation:
          description: Participation Generation. Each new entry into the Attempt gets the next number.
          type: integer
          format: int64
          minimum: 1
        renewal_sequence:
          description: Sequence number of the latest lease renewal. It only goes up.
          type: integer
          format: int64
          minimum: 0
        started_at:
          description: When the Participation started.
          type: string
          format: date-time
        updated_at:
          description: When the Participation last changed, such as at its latest renewal.
          type: string
          format: date-time
        lease_expires_at:
          description: When the Participation Lease runs out, or ran out.
          type: string
          format: date-time
        ended_at:
          description: When the Participation ended. Present only when state is ended.
          type: string
          format: date-time
        end_reason:
          description: Why the Participation ended. Present only when state is ended.
          $ref: '#/components/schemas/AttemptParticipationEndReason'
    ExamAttemptConnectionResponse:
      description: An Attempt Connection.
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - opened_at
      properties:
        id:
          description: ID of the Connection.
          $ref: '#/components/schemas/ID'
        state:
          description: Whether the Connection is open or closed.
          $ref: '#/components/schemas/AttemptConnectionState'
        opened_at:
          description: When the Connection opened.
          type: string
          format: date-time
        closed_at:
          description: When the Connection closed. Present only when state is closed.
          type: string
          format: date-time
        close_reason:
          description: Why the Connection closed. Present only when state is closed.
          $ref: '#/components/schemas/AttemptConnectionCloseReason'
    ExamAttemptSuspensionResponse:
      type: object
      additionalProperties: false
      description: One Suspension. A policy Suspension links its Integrity Flag in integrity_flag_id. A manual Suspension, when an Exam Manager kicks the candidate, links no Flag and names the manager in suspended_by_user_id.
      required:
        - id
        - participation_id
        - generation
        - state
        - source
        - candidate_reason
        - started_at
      properties:
        id:
          description: ID of the Suspension. Send it as suspension_id to re-allow the Attempt.
          $ref: '#/components/schemas/ID'
        participation_id:
          description: ID of the Participation that was active when the Suspension started.
          $ref: '#/components/schemas/ID'
        integrity_flag_id:
          description: ID of the Integrity Flag that caused a policy Suspension. Omitted for a manual Suspension.
          $ref: '#/components/schemas/ID'
        generation:
          description: Participation Generation that was active when the Suspension started.
          type: integer
          format: int64
          minimum: 1
        state:
          description: Whether the Suspension is still active or has been closed by a re-allow.
          type: string
          enum:
            - active
            - closed
        source:
          description: policy when a rule suspended the Attempt automatically. manual when an Exam Manager did.
          type: string
          enum:
            - policy
            - manual
        candidate_reason:
          description: The reason the candidate is shown.
          type: string
          enum:
            - secure_connectivity_lost
            - focus_policy_review_required
            - native_policy_review_required
            - manager_suspended
        started_at:
          description: When the Suspension started.
          type: string
          format: date-time
        ended_at:
          description: When the Suspension was closed. Omitted while it is active.
          type: string
          format: date-time
        reallowed_by_user_id:
          description: ID of the User who re-allowed the Attempt. Omitted while the Suspension is active.
          $ref: '#/components/schemas/ID'
        suspended_by_user_id:
          description: ID of the Exam Manager who suspended the Attempt. Present only for a manual Suspension.
          $ref: '#/components/schemas/ID'
    ExamAttemptManagerResponse:
      description: An Exam Attempt, as a manager may see it.
      type: object
      additionalProperties: false
      required:
        - id
        - exam_id
        - exam_sitting_id
        - candidate_user_id
        - admission_revision_id
        - state
        - created_at
        - updated_at
        - revision
        - workspace
      properties:
        id:
          description: ID of the Exam Attempt.
          $ref: '#/components/schemas/ID'
        exam_id:
          description: ID of the Exam.
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          description: ID of the Exam Sitting.
          $ref: '#/components/schemas/ID'
        candidate_user_id:
          description: ID of the candidate User.
          $ref: '#/components/schemas/ID'
        admission_revision_id:
          description: ID of the Exam Revision the Attempt was admitted with.
          $ref: '#/components/schemas/ID'
        state:
          description: Current state of the Attempt.
          $ref: '#/components/schemas/ExamAttemptState'
        created_at:
          description: When the Attempt was created.
          type: string
          format: date-time
        updated_at:
          description: When the Attempt last changed.
          type: string
          format: date-time
        submitted_at:
          description: When the Attempt was submitted. Present only when state is submitted.
          type: string
          format: date-time
        revision:
          description: Revision of the Attempt. It goes up with every change. Send it as expected_revision when you suspend or re-allow the Attempt.
          type: integer
          format: int64
          minimum: 1
        workspace:
          description: The Attempt Workspace.
          $ref: '#/components/schemas/ExamAttemptWorkspaceResponse'
        latest_participation:
          description: The most recent Participation. Omitted when the candidate has never entered.
          $ref: '#/components/schemas/ExamAttemptParticipationResponse'
        current_connection:
          description: The open Connection. Omitted when no Connection is open.
          $ref: '#/components/schemas/ExamAttemptConnectionResponse'
        active_suspension:
          description: The active Suspension. Omitted unless the Attempt is suspended.
          $ref: '#/components/schemas/ExamAttemptSuspensionResponse'
        ended_by_user_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The manager who ended the Attempt. Present only when a manager ended it, and only for callers who
            may manage the Sitting.
        ended_by:
          $ref: '#/components/schemas/PersonRef'
          description: The manager who ended the Attempt, named. Present with ended_by_user_id.
        end_reason_text:
          type: string
          description: The manager's private reason for ending the Attempt. Present with ended_by_user_id.
    ReallowExamAttemptRequest:
      description: Which Suspension to close, and why.
      type: object
      additionalProperties: false
      required:
        - suspension_id
        - expected_revision
        - reason
      properties:
        suspension_id:
          description: ID of the active Suspension to close.
          $ref: '#/components/schemas/ID'
        expected_revision:
          description: The Attempt revision you last saw. The request fails if the Attempt changed since.
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Private reason for the re-allow. Leading and trailing spaces are removed. It is kept only in the Suspension record and never returned or logged.
    ExamAttemptReallowResponse:
      description: The result of a re-allow.
      type: object
      additionalProperties: false
      required:
        - exam_attempt_id
        - exam_sitting_id
        - state
        - attempt_revision
        - suspension_id
        - suspension_state
        - candidate_reason
        - reallowed_by_user_id
      properties:
        exam_attempt_id:
          description: ID of the Exam Attempt.
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          description: ID of the Exam Sitting.
          $ref: '#/components/schemas/ID'
        state:
          description: State of the Attempt after the re-allow.
          type: string
          const: ready
        attempt_revision:
          description: New revision of the Attempt.
          type: integer
          format: int64
          minimum: 1
        suspension_id:
          description: ID of the Suspension that was closed.
          $ref: '#/components/schemas/ID'
        suspension_state:
          description: State of the Suspension. Always closed.
          type: string
          const: closed
        candidate_reason:
          description: The reason the candidate was shown for the Suspension.
          type: string
          enum:
            - secure_connectivity_lost
            - focus_policy_review_required
            - native_policy_review_required
            - manager_suspended
        reallowed_by_user_id:
          description: ID of the User who re-allowed the Attempt.
          $ref: '#/components/schemas/ID'
    SuspendExamAttemptRequest:
      description: The revision you expect and why you are suspending the Attempt.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - reason
      properties:
        expected_revision:
          description: The Attempt revision you last saw. The Attempt must be active and unchanged since.
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Private reason for the suspension. Leading and trailing spaces are removed. It is kept only in the Suspension record and never returned or logged.
    ExamAttemptSuspendResponse:
      description: The result of a manual suspension.
      type: object
      additionalProperties: false
      required:
        - exam_attempt_id
        - exam_sitting_id
        - state
        - attempt_revision
        - suspension_id
        - suspension_state
        - source
        - candidate_reason
        - suspended_by_user_id
        - connection_closed
      properties:
        exam_attempt_id:
          description: ID of the Exam Attempt.
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          description: ID of the Exam Sitting.
          $ref: '#/components/schemas/ID'
        state:
          description: State of the Attempt. Always suspended.
          type: string
          const: suspended
        attempt_revision:
          description: New revision of the Attempt.
          type: integer
          format: int64
          minimum: 2
        suspension_id:
          description: ID of the new Suspension. Send it as suspension_id to re-allow the Attempt.
          $ref: '#/components/schemas/ID'
        suspension_state:
          description: State of the Suspension. Always active.
          type: string
          const: active
        source:
          description: Always manual.
          type: string
          const: manual
        candidate_reason:
          description: The reason the candidate is shown. Always manager_suspended.
          type: string
          const: manager_suspended
        suspended_by_user_id:
          description: ID of the Exam Manager who suspended the Attempt.
          $ref: '#/components/schemas/ID'
        connection_closed:
          type: boolean
          description: True when the suspension closed the candidate's open Connection.
    ExamAttemptManagerListResponse:
      description: One page of Exam Attempts.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          description: Attempts on this page, newest first.
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExamAttemptManagerResponse'
        next_cursor:
          type: string
          description: Cursor for the next page. Omitted on the last page. Send it back unchanged as cursor.