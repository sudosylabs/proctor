            exam_sitting_id: 889766ufjgio6kbpzjbufozksq
            state: suspended
            attempt_revision: 4
            suspension_id: 5ebqfbnezgahdbx9oy7rfr6oro
            suspension_state: active
            source: manual
            candidate_reason: manager_suspended
            suspended_by_user_id: f6tcxyfofj3n3buuqfjaw9j1jn
            connection_closed: true
