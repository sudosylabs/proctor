paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/candidate-statuses:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: listExamSittingCandidateStatuses
      summary: List the minimized candidate-status board for one Exam Sitting
      tags:
        - Attempts and workspaces
      description: >-
        Returns one bounded row per authoritative Sitting candidate after current exam.sitting.view
        authorization. Presence is derived from the authoritative Participation lease at server_time. The
        projection excludes Sessions, credentials, connections, evidence, private reasons, and Review
        decisions.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of candidate-status rows to return from the live Sitting projection.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque live-view keyset cursor over ascending candidate User identity.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ExamSittingCandidateStatusesOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
components:
  responses:
    ExamSittingCandidateStatusesOK:
      description: Minimized live candidate-status board
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingCandidateStatusesResponse'
  schemas:
    SittingCandidatePresenceState:
      type: string
      enum:
        - not_started
        - ready
        - connected
        - reconnecting
        - lease_expired
        - suspended
        - submitted
    SittingCandidateIdentityResponse:
      type: object
      additionalProperties: false
      required:
        - user_id
        - username
        - display_name
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
          minLength: 1
        display_name:
          type: string
    SittingCandidateSubmissionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - submitted_at
        - provenance
      properties:
        id:
          $ref: '#/components/schemas/ID'
        submitted_at:
          type: string
          format: date-time
        provenance:
          $ref: '#/components/schemas/ExamSubmissionProvenance'
    SittingCandidateAttemptResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - revision
        - created_at
        - updated_at
        - submission
      properties:
        id:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          enum:
            - ready
            - active
            - suspended
            - submitted
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        submission:
          oneOf:
            - $ref: '#/components/schemas/SittingCandidateSubmissionResponse'
            - type: 'null'
    SittingCandidatePresenceResponse:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/SittingCandidatePresenceState'
        last_lease_renewed_at:
          type: string
          format: date-time
        lease_expires_at:
          type: string
          format: date-time
    SittingCandidateSuspensionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - candidate_reason
        - reallow_available
      properties:
        id:
          $ref: '#/components/schemas/ID'
        candidate_reason:
          type: string
          enum:
            - secure_connectivity_lost
            - focus_policy_review_required
            - native_policy_review_required
            - manager_suspended
        reallow_available:
          type: boolean
    SittingCandidateStatusItemResponse:
      type: object
      additionalProperties: false
      required:
        - candidate
        - current_class_membership
        - attempt
        - presence
        - suspension
        - integrity_attention_count
      properties:
        candidate:
          $ref: '#/components/schemas/SittingCandidateIdentityResponse'
        current_class_membership:
          type: boolean
        attempt:
          oneOf:
            - $ref: '#/components/schemas/SittingCandidateAttemptResponse'
            - type: 'null'
        presence:
          $ref: '#/components/schemas/SittingCandidatePresenceResponse'
        suspension:
          oneOf:
            - $ref: '#/components/schemas/SittingCandidateSuspensionResponse'
            - type: 'null'
        integrity_attention_count:
          type: integer
          format: int64
          minimum: 0
        native_security:
          $ref: '#/components/schemas/NativeSecuritySummary'
    ExamSittingCandidateStatusesResponse:
      type: object
      additionalProperties: false
      required:
        - server_time
        - exam_id
        - exam_sitting_id
        - sitting_state
        - sitting_revision
        - items
      properties:
        server_time:
          type: string
          format: date-time
        exam_id:
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
        sitting_state:
          $ref: '#/components/schemas/ExamSittingState'
        sitting_revision:
          type: integer
          format: int64
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/SittingCandidateStatusItemResponse'
        next_cursor:
          type: string
    NativeSecuritySummary:
      type: object
      additionalProperties: false
      description: >-
        The candidate's live native standing: how many rule status changes are kept, the live Participation's source
        health and each enforce rule's status as the server evaluates it, whether Desktop is containing the
        candidate window, and the Attempt's screen clips by state. It contains no facts, source-instance or
        application identities, and an application outside the catalog is never named. A rule that is not met is
        not a misconduct finding; its Flag is reviewed like any other.
      required:
        - retained_condition_records
        - live_coverage_available
        - sources
        - rules
        - contained
        - screen_clips
      properties:
        rules:
          type: array
          maxItems: 64
          description: The live Participation's enforce rules, by rule ID; empty when nothing is live.
          items:
            type: object
            additionalProperties: false
            required:
              - rule_id
              - capability
              - reason
              - status
              - occurrences
            properties:
              rule_id:
                type: string
                maxLength: 128
              capability:
                type: string
                pattern: ^[a-z][a-z0-9_]{0,63}$
              reason:
                type: string
                maxLength: 128
                description: The registry's reason ID for the rule, such as display.single_display_required.
              status:
                type: string
                enum:
                  - met
                  - not_met
                  - unknown
              unknown_cause:
                type: string
                enum:
                  - unavailable
                  - gap
                  - unhealthy
                  - permission
                  - partial
                  - checking
              open_occurrence:
                type: integer
                format: int64
                minimum: 1
                description: The occurrence open now, counted from 1 in this Participation; absent when none is open.
              occurrences:
                type: integer
                format: int64
                minimum: 0
        contained:
          type: boolean
          description: Whether Desktop reports it is containing the candidate window right now.
        screen_clips:
          type: object
          additionalProperties: false
          required:
            - requested
            - recording
            - uploading
            - ready
            - failed
          properties:
            requested:
              type: integer
              minimum: 0
            recording:
              type: integer
              minimum: 0
            uploading:
              type: integer
              minimum: 0
            ready:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
        retained_condition_records:
          type: integer
          format: int64
          minimum: 0
          maximum: 200000
        live_coverage_available:
          type: boolean
        sources:
          type: array
          maxItems: 11
          items:
            type: object
            additionalProperties: false
            required:
              - source_id
              - health
              - permission
              - complete
            properties:
              source_id:
                type: string
              health:
                type: string
                enum:
                  - starting
                  - healthy
                  - degraded
                  - failed
                  - recovering
                  - stopped
              permission:
                type: string
                enum:
                  - denied
                  - granted
                  - not_determined
                  - restricted
                  - unavailable
              complete:
                type: boolean
