paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/candidate-statuses:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: listExamSittingCandidateStatuses
      summary: List the minimized candidate-status board for one Exam Sitting
      tags:
        - Attempts and workspaces
      description: Returns one row for each candidate of the Sitting, after checking that the caller currently holds exam.sitting.view. Presence comes from the Participation Lease as it stands at server_time. Rows contain no Sessions, credentials, Connections, evidence, private reasons or Submission Review decisions.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Largest number of candidate rows to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Cursor from next_cursor of the previous page. Send it back unchanged.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ExamSittingCandidateStatusesOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
components:
  responses:
    ExamSittingCandidateStatusesOK:
      description: One page of the live candidate-status board.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingCandidateStatusesResponse'
          example:
            server_time: '2026-08-01T09:45:00Z'
            exam_id: 39kqk53i4cswfzbi7hbai1r8qg
            exam_sitting_id: 889766ufjgio6kbpzjbufozksq
            sitting_state: open
            sitting_revision: 4
            items:
              - candidate:
                  user_id: nybc6xhg593upqice3sdeyro5k
                  username: student.ada
                  display_name: Ada Student
                current_class_membership: true
                attempt:
                  id: 1asb7sk89dp1ex339fkh3te5t4
                  state: active
                  revision: 3
                  created_at: '2026-08-01T09:00:04Z'
                  updated_at: '2026-08-01T09:02:10Z'
                  submission: null
                presence:
                  state: connected
                  last_lease_renewed_at: '2026-08-01T09:44:50Z'
                  lease_expires_at: '2026-08-01T09:45:20Z'
                suspension: null
                integrity_attention_count: 0
                native_security:
                  retained_condition_records: 2
                  live_coverage_available: true
                  sources:
                    - source_id: display-topology
                      health: healthy
                      permission: granted
                      complete: true
                    - source_id: clipboard
                      health: degraded
                      permission: granted
                      complete: false
              - candidate:
                  user_id: dfa1x1n7mkthyoziwxnupsmyia
                  username: student.bo
                  display_name: Bo Student
                current_class_membership: true
                attempt: null
                presence:
                  state: not_started
                suspension: null
                integrity_attention_count: 0
            next_cursor: eyJjYW5kaWRhdGVfdXNlcl9pZCI6ImRmYTF4MW43bWt0aHlveml3eG51cHNteWlhIn0
  schemas:
    SittingCandidatePresenceState:
      description: Where a candidate stands in the Sitting. not_started has no Attempt yet. ready has an Attempt in the Ready state. connected is in progress with an open Connection. reconnecting is in progress with a valid lease but no open Connection. lease_expired is in progress but the Participation Lease has run out. suspended and submitted follow the Attempt state.
      type: string
      enum:
        - not_started
        - ready
        - connected
        - reconnecting
        - lease_expired
        - suspended
        - submitted
    SittingCandidateIdentityResponse:
      description: The candidate User.
      type: object
      additionalProperties: false
      required:
        - user_id
        - username
        - display_name
      properties:
        user_id:
          description: ID of the candidate User.
          $ref: '#/components/schemas/ID'
        username:
          description: Username of the candidate.
          type: string
          minLength: 1
        display_name:
          description: Display name of the candidate.
          type: string
    SittingCandidateSubmissionResponse:
      description: The candidate's Submission.
      type: object
      additionalProperties: false
      required:
        - id
        - submitted_at
        - provenance
      properties:
        id:
          description: ID of the Submission.
          $ref: '#/components/schemas/ID'
        submitted_at:
          description: When the Submission was made.
          type: string
          format: date-time
        provenance:
          description: How the Submission was made.
          $ref: '#/components/schemas/ExamSubmissionProvenance'
    SittingCandidateAttemptResponse:
      description: The candidate's Exam Attempt.
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - revision
        - created_at
        - updated_at
        - submission
      properties:
        id:
          description: ID of the Exam Attempt.
          $ref: '#/components/schemas/ID'
        state:
          description: Current state of the Attempt.
          type: string
          enum:
            - ready
            - active
            - suspended
            - submitted
        revision:
          description: Revision of the Attempt. It goes up with every change. Send it as expected_revision when you suspend or re-allow the Attempt.
          type: integer
          format: int64
          minimum: 1
        created_at:
          description: When the Attempt was created.
          type: string
          format: date-time
        updated_at:
          description: When the Attempt last changed.
          type: string
          format: date-time
        submission:
          description: The Submission. Null until the Attempt is submitted.
          oneOf:
            - $ref: '#/components/schemas/SittingCandidateSubmissionResponse'
            - type: 'null'
    SittingCandidatePresenceResponse:
      description: The candidate's presence, worked out at server_time.
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          description: Presence of the candidate.
          $ref: '#/components/schemas/SittingCandidatePresenceState'
        last_lease_renewed_at:
          description: When the latest Participation Lease was last renewed. Omitted when the candidate has never had a Participation.
          type: string
          format: date-time
        lease_expires_at:
          description: When the latest Participation Lease runs out, or ran out. Omitted when the candidate has never had a Participation.
          type: string
          format: date-time
    SittingCandidateSuspensionResponse:
      description: The active Attempt Suspension.
      type: object
      additionalProperties: false
      required:
        - id
        - candidate_reason
        - reallow_available
      properties:
        id:
          description: ID of the Suspension. Send it as suspension_id to re-allow the Attempt.
          $ref: '#/components/schemas/ID'
        candidate_reason:
          description: The reason the candidate is shown.
          type: string
          enum:
            - secure_connectivity_lost
            - focus_policy_review_required
            - manager_suspended
        reallow_available:
          description: Whether the caller can re-allow the Attempt now. True only when the caller is allowed to, the Exam isn't archived, the Sitting is Open or Paused and its scheduled end hasn't passed.
          type: boolean
    SittingCandidateStatusItemResponse:
      description: One candidate's row on the status board.
      type: object
      additionalProperties: false
      required:
        - candidate
        - current_class_membership
        - attempt
        - presence
        - suspension
        - integrity_attention_count
      properties:
        candidate:
          description: The candidate User.
          $ref: '#/components/schemas/SittingCandidateIdentityResponse'
        current_class_membership:
          description: Whether the candidate is still a member of the Sitting's Class.
          type: boolean
        attempt:
          description: The candidate's Attempt. Null when the candidate has not started.
          oneOf:
            - $ref: '#/components/schemas/SittingCandidateAttemptResponse'
            - type: 'null'
        presence:
          description: The candidate's presence.
          $ref: '#/components/schemas/SittingCandidatePresenceResponse'
        suspension:
          description: The active Suspension. Null unless the Attempt is suspended.
          oneOf:
            - $ref: '#/components/schemas/SittingCandidateSuspensionResponse'
            - type: 'null'
        integrity_attention_count:
          description: Number of integrity issues on the Attempt that still need attention, such as discrepancies not covered by a finalized Submission Review or gaps in the delivered integrity data. Zero when there is no Attempt.
          type: integer
          format: int64
          minimum: 0
        native_security:
          description: Native security summary for the Attempt. Omitted when the candidate has no Attempt.
          $ref: '#/components/schemas/NativeSecuritySummary'
    ExamSittingCandidateStatusesResponse:
      description: One page of the candidate-status board for a Sitting.
      type: object
      additionalProperties: false
      required:
        - server_time
        - exam_id
        - exam_sitting_id
        - sitting_state
        - sitting_revision
        - items
      properties:
        server_time:
          description: Server time the board was worked out at.
          type: string
          format: date-time
        exam_id:
          description: ID of the Exam.
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          description: ID of the Exam Sitting.
          $ref: '#/components/schemas/ID'
        sitting_state:
          description: Current state of the Sitting.
          $ref: '#/components/schemas/ExamSittingState'
        sitting_revision:
          description: Current revision of the Sitting.
          type: integer
          format: int64
          minimum: 1
        items:
          description: Candidate rows, in ascending order of candidate User ID.
          type: array
          items:
            $ref: '#/components/schemas/SittingCandidateStatusItemResponse'
        next_cursor:
          description: Cursor for the next page. Omitted on the last page. Send it back unchanged as cursor.
          type: string
    NativeSecuritySummary:
      type: object
      additionalProperties: false
      description: A count of native condition records and the health of the live native sources. It holds no detector, occurrence or source instance IDs, and it is not a finding of misconduct.
      required:
        - retained_condition_records
        - live_coverage_available
        - sources
      properties:
        retained_condition_records:
          description: Number of native condition records kept for the Attempt. Zero once its integrity data has been retired.
          type: integer
          format: int64
          minimum: 0
          maximum: 200000
        live_coverage_available:
          description: Whether the Desktop has reported live native source coverage. When false, sources is empty.
          type: boolean
        sources:
          description: Health of each live native source.
          type: array
          maxItems: 11
          items:
            description: Health of one native source.
            type: object
            additionalProperties: false
            required:
              - source_id
              - health
              - permission
              - complete
            properties:
              source_id:
                description: The native source.
                type: string
              health:
                description: Health the source last reported.
                type: string
                enum:
                  - starting
                  - healthy
                  - degraded
                  - failed
                  - recovering
                  - stopped
              permission:
                description: Whether the operating system lets the source run.
                type: string
                enum:
                  - denied
                  - granted
                  - not_determined
                  - restricted
                  - unavailable
              complete:
                description: Whether the source reports complete coverage.
                type: boolean
