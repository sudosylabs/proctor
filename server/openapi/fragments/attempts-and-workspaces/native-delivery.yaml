paths:
  /api/v1/exam-attempts/{exam_attempt_id}/security-streams/{stream_id}:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/NativeStreamID'
    get:
      operationId: nativeDeliveryStatus
      summary: Read native delivery settlement
      description: Returns the delivery status of one native security stream. The caller must be the User who owns the stream, with a valid Session for the registered key bound at admission. While the stream is live, the request also needs the current Connection headers. After the server closes the stream, uploading history never reopens the Attempt for interaction or moves the upload deadline. Receipts confirm only batches the server stored. Positions the client gave up on count as settled, but the server never makes up content for them. The status is at most 16 KiB.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_not_open
        - exam.attempt.unavailable
        - exam.delivery.upload_expired
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/NativeDeliveryCredential'
        - $ref: '#/components/parameters/NativeDeliveryConnectionID'
      responses:
        '200':
          $ref: '#/components/responses/NativeSecurityStreamStatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
