paths:
  /api/v1/exam-sittings/{exam_sitting_id}/security-preflights:
    parameters:
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: prepareSecurityPreflight
      summary: Prepare a secure Desktop admission challenge
      description: Starts a security preflight for a Sitting. You need an eligible registered Desktop Session, and the build, native registry, source manifest and configuration manifest must exactly match an admitted release. The server keeps one pending challenge per Session and Sitting, valid for 120 seconds, and a new request replaces it. This creates no Attempt, Workspace or Participation. When a Ready Attempt is entered again, the response includes its fixed Attempt Configuration. An active or suspended Attempt can't get a new preflight. If an Institution catalog is unavailable, or native coverage the policy enforces is missing, the request fails.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.desktop_incompatible
        - exam.attempt.sitting_not_open
        - exam.attempt.management_authority_conflict
        - exam.attempt.configuration_unsupported
        - exam.attempt.unavailable
        - exam.security.preflight_expired
        - exam.security.preflight_superseded
        - exam.security.preflight_consumed
        - exam.security.preflight_rate_limited
        - exam.security.policy_changed
        - exam.security.session_changed
        - exam.security.configuration_unsupported
        - exam.security.attempt_not_ready
        - exam.security.catalog_missing
        - exam.security.unsupported_capability
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/PrepareSecurityPreflightRequest'
      responses:
        '200':
          $ref: '#/components/responses/SecurityPolicyResponseOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/security-preflights/{security_preflight_id}/report:
    parameters:
      - $ref: '#/components/parameters/SecurityPreflightID'
    post:
      operationId: reportSecurityPreflight
      summary: Report minimized privileged preflight results
      description: Records the Desktop's preflight report. The server checks again that the registered Session, candidate, build, Sitting and policy are the same, then stores the report and its digest. Every enforced and baseline requirement must be ready. Coverage that is honestly reported as degraded but is only observed may still be eligible. A blocked report creates no Attempt and no Integrity Flag. A retry keeps the original receipt time. Connect must use a current eligible report within 30 seconds.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.desktop_incompatible
        - exam.attempt.sitting_not_open
        - exam.attempt.management_authority_conflict
        - exam.attempt.configuration_unsupported
        - exam.attempt.unavailable
        - exam.security.preflight_expired
        - exam.security.preflight_superseded
        - exam.security.preflight_consumed
        - exam.security.preflight_rate_limited
        - exam.security.policy_changed
        - exam.security.session_changed
        - exam.security.configuration_unsupported
        - exam.security.attempt_not_ready
        - exam.security.catalog_missing
        - exam.security.unsupported_capability
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SecurityPreflightReport'
      responses:
        '200':
          $ref: '#/components/responses/SecurityPreflightResultOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/security-policy:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: recoverExamSecurityPolicy
      summary: Recover the active Desktop security receipt
      description: Returns the active Participation's security binding and its original fixed Attempt Configuration to the registered Desktop Session that owns it. Use it when a transport failure left the Desktop unsure of the outcome. The server checks the current Session, key, compatibility, eligibility and lease. An open Connection is not needed. To enter a Ready Attempt again, start a new preflight instead. This read grants no new permission and never renews the lease.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.desktop_incompatible
        - exam.attempt.sitting_not_open
        - exam.attempt.management_authority_conflict
        - exam.attempt.configuration_unsupported
        - exam.attempt.unavailable
        - exam.security.preflight_expired
        - exam.security.preflight_superseded
        - exam.security.preflight_consumed
        - exam.security.preflight_rate_limited
        - exam.security.policy_changed
        - exam.security.session_changed
        - exam.security.configuration_unsupported
        - exam.security.attempt_not_ready
        - exam.security.catalog_missing
        - exam.security.unsupported_capability
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/SecurityPolicyRecoveryOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    SecurityPreflightID:
      name: security_preflight_id
      in: path
      required: true
      description: ID of the security preflight, returned when you started it.
      schema:
        type: string
        minLength: 26
        maxLength: 26
        pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
  requestBodies:
    PrepareSecurityPreflightRequest:
      required: true
      description: Digests of the Desktop release artifacts, and optionally the Ready Attempt to enter again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrepareSecurityPreflightRequest'
          example:
            native_registry_digest: sha256:79faa1141236b073dff2ff802ce67abce3082417a7a4fa2954615e4226acd1e0
            source_manifest_digest: sha256:2c624232cdd221771294dfbb310aca000a0df6ac8b66b696d90ef06fdefb64a3
            configuration_manifest_fingerprint: sha256:19581e27de7ced00ff1ce50b2047e7a567c76b1cbaebabe5ef03f7c3017bb5b7
    SecurityPreflightReport:
      required: true
      description: The Desktop's preflight report. It holds only the minimum the check needs, with no native content or inventories.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityPreflightReport'
          example:
            challenge: Xq3vR8tNw2LmYp7KdF0sJc5HbZ1gUe9AoT4iVk6Ex2M
