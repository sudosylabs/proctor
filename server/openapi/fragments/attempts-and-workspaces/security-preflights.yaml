paths:
  /api/v1/exam-sittings/{exam_sitting_id}/security-preflights:
    parameters:
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: prepareSecurityPreflight
      summary: Prepare a secure Desktop admission challenge
      description: >-
        Requires an eligible registered Desktop Session and an exact admitted build, capability registry and
        configuration manifest. Stores one pending 120-second challenge per Session and Sitting; a
        successor supersedes it. Does not create an Attempt, Workspace or Participation. Ready rejoin returns
        frozen configuration; active and suspended Attempts cannot obtain a replacement preflight. Unavailable
        Institution catalogs, or a family enforced where the release does not certify enforcement on the
        candidate's platform, fail closed.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.desktop_incompatible
        - exam.attempt.sitting_not_open
        - exam.attempt.management_authority_conflict
        - exam.attempt.configuration_unsupported
        - exam.attempt.unavailable
        - exam.security.preflight_expired
        - exam.security.preflight_superseded
        - exam.security.preflight_consumed
        - exam.security.preflight_rate_limited
        - exam.security.policy_changed
        - exam.security.session_changed
        - exam.security.configuration_unsupported
        - exam.security.attempt_not_ready
        - exam.security.catalog_missing
        - exam.security.unsupported_capability
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/PrepareSecurityPreflightRequest'
      responses:
        '200':
          $ref: '#/components/responses/SecurityPolicyResponseOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-sittings/{exam_sitting_id}/security-policy:
    parameters:
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: getSecurityPolicyOverview
      summary: Read the policy for the readiness overview
      description: >-
        Resolves the Sitting's current native policy, under the same eligibility checks as preparing a preflight,
        for the overview a candidate's Desktop shows before Start: the capabilities it activates, the rules it
        checks, the recorder switch and the disclosure. It creates no preflight, records nothing and grants nothing,
        so the overview may hold it for as long as it is open. At Start, compare readiness_digest with the one the
        prepared preflight returns; if they differ, refresh the overview.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.desktop_incompatible
        - exam.attempt.sitting_not_open
        - exam.attempt.management_authority_conflict
        - exam.attempt.unavailable
        - exam.security.unsupported_capability
        - exam.security.catalog_missing
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The policy the readiness overview checks the machine against
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicyOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/security-preflights/{security_preflight_id}/report:
    parameters:
      - $ref: '#/components/parameters/SecurityPreflightID'
    post:
      operationId: reportSecurityPreflight
      summary: Report minimized privileged preflight results
      description: >-
        Rechecks the same registered Session, candidate, build, Sitting and policy before storing the bounded
        report and its canonical digest. The server evaluates every readiness rule on the reported facts; each
        enforced and baseline rule must be met, and an unknown status blocks. Observed rules never block. A blocked report creates no Attempt or misconduct Flag.
        Retry preserves the original receipt time; Connect must consume a current eligible report within 30
        seconds.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.desktop_incompatible
        - exam.attempt.sitting_not_open
        - exam.attempt.management_authority_conflict
        - exam.attempt.configuration_unsupported
        - exam.attempt.unavailable
        - exam.security.preflight_expired
        - exam.security.preflight_superseded
        - exam.security.preflight_consumed
        - exam.security.preflight_rate_limited
        - exam.security.policy_changed
        - exam.security.session_changed
        - exam.security.configuration_unsupported
        - exam.security.attempt_not_ready
        - exam.security.catalog_missing
        - exam.security.unsupported_capability
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SecurityPreflightReport'
      responses:
        '200':
          $ref: '#/components/responses/SecurityPreflightResultOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/security-policy:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: recoverExamSecurityPolicy
      summary: Recover the active Desktop security receipt
      description: >-
        Returns the exact active Participation binding and original frozen configuration to its owning
        registered Desktop Session after transport ambiguity. Checks current Session, key, compatibility,
        eligibility and lease. An open transport Connection is not required. Ready reentry uses a fresh
        preflight. This read creates no authority and never renews the lease.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - exam.delivery.control_rate_limited
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.registered_desktop_required
        - exam.attempt.desktop_incompatible
        - exam.attempt.sitting_not_open
        - exam.attempt.management_authority_conflict
        - exam.attempt.configuration_unsupported
        - exam.attempt.unavailable
        - exam.security.preflight_expired
        - exam.security.preflight_superseded
        - exam.security.preflight_consumed
        - exam.security.preflight_rate_limited
        - exam.security.policy_changed
        - exam.security.session_changed
        - exam.security.configuration_unsupported
        - exam.security.attempt_not_ready
        - exam.security.catalog_missing
        - exam.security.unsupported_capability
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/SecurityPolicyRecoveryOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    SecurityPreflightID:
      name: security_preflight_id
      in: path
      required: true
      description: Server-issued canonical preflight transaction ID returned by preparation.
      schema:
        type: string
        minLength: 26
        maxLength: 26
        pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
  requestBodies:
    PrepareSecurityPreflightRequest:
      required: true
      description: Complete bounded artifact identities and optional Ready Attempt selector.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrepareSecurityPreflightRequest'
          example:
            native_registry_digest: sha256:b8da9b04779e2fa14d7e6d63393c80b9499749291c7132cf41745bddbf0e5313
            configuration_manifest_fingerprint: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    SecurityPreflightReport:
      required: true
      description: Complete bounded minimized preflight report, with no native content or inventory.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityPreflightReport'
          example:
            challenge: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            policy_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            policy_content_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            security_session_id: synthetic-security-session
            capabilities: []
            rules: []
            reported_at: '2026-09-08T08:00:00.000Z'
  responses:
    SecurityPolicyResponseOK:
      description: Authenticated security preflight result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityPolicyResponse'
    SecurityPreflightResultOK:
      description: Authenticated security preflight result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityPreflightResult'
    SecurityPolicyRecoveryOK:
      description: >-
        The exact retained active security receipt and frozen configuration for its owning registered Desktop
        Session.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecurityPolicyRecovery'
  schemas:
    PrepareSecurityPreflightRequest:
      type: object
      additionalProperties: false
      required:
        - native_registry_digest
        - configuration_manifest_fingerprint
      properties:
        attempt_id:
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        native_registry_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        configuration_manifest_fingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    SecurityPreflightChallenge:
      type: object
      additionalProperties: false
      required:
        - preflight_id
        - challenge
        - issued_at
        - expires_at
      properties:
        preflight_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        challenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    EffectiveExamSecurityPolicy:
      type: object
      additionalProperties: false
      required:
        - policy_id
        - revision
        - ordinal
        - digest
        - institution_id
        - exam_revision_id
        - sitting_id
        - scope
        - issued_at
        - active_from
        - application_release_id
        - matrix_id
        - target_tuple
        - registry_digest
        - focus_loss_mode
        - connection_loss_mode
        - resolved_exception_refs
        - evidence_class_id
        - visibility_class_id
        - retention_class_id
        - capabilities
        - screen_recording
        - activations
        - rules
      properties:
        activations:
          type: array
          maxItems: 32
          description: The capabilities Desktop runs for this policy, with the sub-categories each selects.
          items:
            $ref: '#/components/schemas/NativeActivation'
        rules:
          type: array
          maxItems: 64
          description: >-
            The compiled native rules: the release's baseline, unchanged, then the rules compiled from the Exam's
            family selections. Desktop evaluates them on the device; the server evaluates them again on the same facts.
          items:
            $ref: '#/components/schemas/NativeRule'
        policy_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        revision:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[ -~]+$
        ordinal:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        institution_id:
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        exam_revision_id:
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        sitting_id:
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        scope:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - kind
                - admission_scope_id
              properties:
                kind:
                  type: string
                  const: admission
                admission_scope_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            - type: object
              additionalProperties: false
              required:
                - kind
                - attempt_id
              properties:
                kind:
                  type: string
                  const: attempt
                attempt_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        issued_at:
          type: string
          format: date-time
        active_from:
          type: string
          format: date-time
        application_release_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        matrix_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        target_tuple:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        registry_digest:
          type: string
          const: sha256:b8da9b04779e2fa14d7e6d63393c80b9499749291c7132cf41745bddbf0e5313
        focus_loss_mode:
          type: string
          enum:
            - disabled
            - observe
            - enforce
        connection_loss_mode:
          type: string
          const: enforce
        resolved_exception_refs:
          type: array
          minItems: 0
          maxItems: 0
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        evidence_class_id:
          type: string
          const: native_integrity
        visibility_class_id:
          type: string
          const: examiner_restricted
        retention_class_id:
          type: string
          const: native_minimized
        screen_recording:
          $ref: '#/components/schemas/NativeScreenRecordingPolicy'
        capabilities:
          type: array
          minItems: 10
          maxItems: 10
          description: >-
            Exactly one family in this order: process_application, interactive_session, clipboard, printing,
            removable_storage, virtualization, network_configuration, camera, microphone, external_capture.
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                  - allowed_application_ids
                properties:
                  id:
                    type: string
                    const: process_application
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
                  allowed_application_ids:
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    description: >-
                      The only catalog applications the candidate may run, sorted and unique: IDs from the Desktop release's
                      application catalog, each one it marks allowable. Empty adds no allowlist. When the family is on, the
                      catalog's never-allowable applications are always blocked.
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        allowed_application_ids:
                          const: []
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                properties:
                  id:
                    type: string
                    const: interactive_session
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                  - observe_os_clipboard_changes
                  - strategy
                properties:
                  id:
                    type: string
                    const: clipboard
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
                  observe_os_clipboard_changes:
                    type: boolean
                  strategy:
                    type: string
                    enum:
                      - disabled
                      - private_attempt
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        observe_os_clipboard_changes:
                          const: false
                        strategy:
                          const: disabled
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        strategy:
                          const: disabled
                        observe_os_clipboard_changes:
                          const: true
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        strategy:
                          const: private_attempt
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                  - candidate_print_commands
                  - monitored_spooler
                properties:
                  id:
                    type: string
                    const: printing
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
                  candidate_print_commands:
                    type: string
                    enum:
                      - not_applied
                      - deny
                  monitored_spooler:
                    type: string
                    enum:
                      - not_required
                      - required
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        candidate_print_commands:
                          const: not_applied
                        monitored_spooler:
                          const: not_required
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        candidate_print_commands:
                          const: not_applied
                        monitored_spooler:
                          const: required
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        candidate_print_commands:
                          const: deny
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                  - enabled_sub_capabilities
                properties:
                  id:
                    type: string
                    const: removable_storage
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
                  enabled_sub_capabilities:
                    type: array
                    maxItems: 2
                    uniqueItems: true
                    items:
                      type: string
                      enum:
                        - removable_block_storage
                        - portable_mtp
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        enabled_sub_capabilities:
                          const: []
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                  - rule
                properties:
                  id:
                    type: string
                    const: virtualization
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
                  rule:
                    type: string
                    enum:
                      - not_applied
                      - block_recognized_guest
                      - require_certified_physical_environment
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        rule:
                          const: not_applied
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        rule:
                          enum:
                            - block_recognized_guest
                            - require_certified_physical_environment
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        rule:
                          enum:
                            - block_recognized_guest
                            - require_certified_physical_environment
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                  - enabled_sub_capabilities
                properties:
                  id:
                    type: string
                    const: network_configuration
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
                  enabled_sub_capabilities:
                    type: array
                    maxItems: 3
                    uniqueItems: true
                    items:
                      type: string
                      enum:
                        - system_proxy_state
                        - os_managed_vpn_state
                        - tunnel_interface_state
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        enabled_sub_capabilities:
                          const: []
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                  - concurrent_use_check
                  - require_ready
                properties:
                  id:
                    type: string
                    const: camera
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
                  concurrent_use_check:
                    type: string
                    enum:
                      - not_required
                      - supported_required
                  require_ready:
                    type: boolean
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        concurrent_use_check:
                          const: not_required
                        require_ready:
                          const: false
                  - if:
                      properties:
                        mode:
                          enum:
                            - observe
                            - enforce
                    then:
                      anyOf:
                        - properties:
                            require_ready:
                              const: true
                        - properties:
                            concurrent_use_check:
                              const: supported_required
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                  - concurrent_use_check
                  - require_ready
                properties:
                  id:
                    type: string
                    const: microphone
                  mode:
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
                  concurrent_use_check:
                    type: string
                    enum:
                      - not_required
                      - supported_required
                  require_ready:
                    type: boolean
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        concurrent_use_check:
                          const: not_required
                        require_ready:
                          const: false
                  - if:
                      properties:
                        mode:
                          enum:
                            - observe
                            - enforce
                    then:
                      anyOf:
                        - properties:
                            require_ready:
                              const: true
                        - properties:
                            concurrent_use_check:
                              const: supported_required
              - type: object
                additionalProperties: false
                required:
                  - id
                  - mode
                  - outcome
                properties:
                  id:
                    type: string
                    const: external_capture
                  mode:
                    type: string
                    enum:
                      - disabled
                  outcome:
                    type: string
                    description: What an enforce occurrence of this family leads to; flag unless mode is enforce.
                    enum:
                      - flag
                      - flag_and_suspend
          prefixItems:
            - properties:
                id:
                  const: process_application
            - properties:
                id:
                  const: interactive_session
            - properties:
                id:
                  const: clipboard
            - properties:
                id:
                  const: printing
            - properties:
                id:
                  const: removable_storage
            - properties:
                id:
                  const: virtualization
            - properties:
                id:
                  const: network_configuration
            - properties:
                id:
                  const: camera
            - properties:
                id:
                  const: microphone
            - properties:
                id:
                  const: external_capture
      description: >-
        Frozen native semantics for a Participation. issued_at and active_from use millisecond UTC precision,
        with issued_at <= active_from <= activation time. There is no policy expiry; the renewable
        Participation lease is the sole live authority. The digest excludes only digest; scope rebinding
        preserves the separately computed content digest.

    SecurityCatalogBinding:
      type: object
      additionalProperties: false
      required:
        - kind
        - catalog_id
        - revision
        - digest
      properties:
        kind:
          type: string
          enum:
            - application
            - storage_function
            - managed_network_profile
            - network_adapter_class
            - tunnel_class
            - detector
        catalog_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        revision:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[ -~]+$
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    FrozenAttemptConfiguration:
      type: object
      additionalProperties: false
      required:
        - manifest_fingerprint
        - registry_fingerprint
        - desktop_build
        - desktop_target
        - user_settings_revision
        - presentation
        - approved_commands
        - approved_keybindings
        - attempt_configuration_revision
        - digest
      properties:
        manifest_fingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        registry_fingerprint:
          type: string
          pattern: ^fnv1a64:[0-9a-f]{16}$
        desktop_build:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        desktop_target:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        user_settings_revision:
          $ref: '#/components/schemas/ID'
        presentation:
          $ref: '#/components/schemas/AttemptConfigurationPresentation'
        approved_commands:
          type: array
          description: >-
            Sorted unique approved catalog IDs; keybindings must resolve to selected commands. Raw key chords
            are rejected.
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        approved_keybindings:
          type: array
          description: >-
            Sorted unique approved catalog IDs; keybindings must resolve to selected commands. Raw key chords
            are rejected.
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        attempt_configuration_revision:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[ -~]+$
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    BrowserActivityDisclosure:
      type: object
      additionalProperties: false
      required:
        - notice_id
        - audience
        - retention_policy_revision
        - browser_activity_retention_days
        - retention_anchor
        - may_create_integrity_evidence
      properties:
        notice_id:
          type: string
          const: integrated_browser_activity
        audience:
          type: string
          const: exam_managers_with_browser_activity_permission
        retention_policy_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        browser_activity_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
        retention_anchor:
          type: string
          const: eligible_closed_sitting_records_completion
        may_create_integrity_evidence:
          type: boolean
      description: >-
        Localized collection notice, not consent or history-read authority. Zero days means no configured
        automatic expiry. Holds, approval, grace and source reconciliation still apply; minimized integrity
        evidence can have a different period.
    SecurityPolicyOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - server_time
        - policy
        - readiness_digest
        - capability_matrix_digest
        - catalog_bindings
        - browser_activity_disclosure
      properties:
        server_time:
          type: string
          format: date-time
        policy:
          $ref: '#/components/schemas/EffectiveExamSecurityPolicy'
        readiness_digest:
          $ref: '#/components/schemas/ReadinessDigest'
        capability_matrix_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        catalog_bindings:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/SecurityCatalogBinding'
        browser_activity_disclosure:
          $ref: '#/components/schemas/BrowserActivityDisclosure'
    ReadinessDigest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
      description: >-
        Identifies what the readiness overview shows and Desktop enforces: the activations and rules, family
        selections, recorder switch, and the registry, matrix and catalogs they rest on. Unlike the policy content
        digest it leaves out the policy's own identity, so the overview and the preflight prepared at Start carry the
        same value exactly when nothing that matters changed.
    SecurityPolicyResponse:
      type: object
      additionalProperties: false
      required:
        - server_time
        - policy
        - policy_content_digest
        - readiness_digest
        - capability_matrix_digest
        - catalog_bindings
        - preflight_challenge
        - frozen_attempt_configuration
        - browser_activity_disclosure
      properties:
        server_time:
          type: string
          format: date-time
        policy:
          $ref: '#/components/schemas/EffectiveExamSecurityPolicy'
        policy_content_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        readiness_digest:
          $ref: '#/components/schemas/ReadinessDigest'
        capability_matrix_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        catalog_bindings:
          type: array
          minItems: 0
          maxItems: 32
          items:
            $ref: '#/components/schemas/SecurityCatalogBinding'
        preflight_challenge:
          $ref: '#/components/schemas/SecurityPreflightChallenge'
        frozen_attempt_configuration:
          oneOf:
            - $ref: '#/components/schemas/FrozenAttemptConfiguration'
            - type: 'null'
        browser_activity_disclosure:
          $ref: '#/components/schemas/BrowserActivityDisclosure'
      description: >-
        Privileged registered-Desktop response bounded to 128 KiB. Catalog bindings are unique and sorted by
        kind then catalog_id. First admission returns null configuration; Ready rejoin returns the original
        immutable configuration.
    SecurityPreflightReport:
      type: object
      additionalProperties: false
      required:
        - challenge
        - policy_digest
        - policy_content_digest
        - security_session_id
        - capabilities
        - rules
        - reported_at
      properties:
        challenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        policy_content_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        security_session_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        capabilities:
          type: array
          maxItems: 32
          description: One fresh fact for every activated capability at Start, in the policy's activation order.
          items:
            $ref: '#/components/schemas/NativeCapabilityReadiness'
        rules:
          type: array
          maxItems: 64
          description: Desktop's own status for every readiness rule.
          items:
            $ref: '#/components/schemas/NativeRuleReport'
        reported_at:
          type: string
          format: date-time
      description: >-
        What Desktop observed at Start, at most 128 KiB: one fresh fact for each activated capability and its own
        status for each readiness rule. No inventories, media, clipboard bytes, OS errors or arbitrary details are
        accepted. The server evaluates the readiness rules on these facts and its result decides admission. The
        server computes the report digest. Client reported_at is provenance; server time controls challenge expiry
        and admission freshness.

    SecurityPreflightResult:
      type: object
      additionalProperties: false
      required:
        - preflight_id
        - report_digest
        - admission
        - reason_codes
        - rules
        - server_time
        - expires_at
      properties:
        rules:
          type: array
          maxItems: 64
          description: >-
            The server's own status for every readiness rule, evaluated on the reported state. Where it differs from
            Desktop's, the server's decides admission.
          items:
            $ref: '#/components/schemas/NativeRuleReport'
        preflight_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        report_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        admission:
          type: string
          enum:
            - eligible
            - blocked
        reason_codes:
          type: array
          minItems: 0
          maxItems: 16
          items:
            type: string
            enum:
              - preflight_expired
              - native_rule_unmet
          uniqueItems: true
        server_time:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    AdmittedSecurity:
      type: object
      additionalProperties: false
      required:
        - policy
        - policy_content_digest
        - preflight_id
        - preflight_report_digest
        - preflight_policy_digest
        - participation_id
        - generation
        - security_session_id
        - delivery_stream_id
        - renewal_interval_seconds
      properties:
        policy:
          $ref: '#/components/schemas/EffectiveExamSecurityPolicy'
        policy_content_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        preflight_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        preflight_report_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        preflight_policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        participation_id:
          type: string
          pattern: ^[a-z0-9]{26}$
          minLength: 26
          maxLength: 26
        generation:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        security_session_id:
          type: string
          minLength: 1
          maxLength: 128
        delivery_stream_id:
          type: string
          minLength: 1
          maxLength: 128
        renewal_interval_seconds:
          type: integer
          format: int64
          const: 5
    SecurityPolicyRecovery:
      type: object
      additionalProperties: false
      required:
        - server_time
        - security
        - frozen_attempt_configuration
        - security_control
      properties:
        server_time:
          type: string
          format: date-time
        security:
          $ref: '#/components/schemas/AdmittedSecurity'
        frozen_attempt_configuration:
          $ref: '#/components/schemas/FrozenAttemptConfiguration'
        security_control:
          $ref: '#/components/schemas/SecurityControlResult'
    DeliveryWatermarkRejection:
      type: object
      additionalProperties: false
      required:
        - family
        - source_id
        - reason
      properties:
        family:
          type: string
          enum:
            - native
            - browser
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        reason:
          type: string
          enum:
            - closed_source
            - position_limit
    SecurityControlResult:
      type: object
      additionalProperties: false
      description: >-
        How the server processed Desktop's latest security control: the lease renewal and its delivery watermarks.
        A renewal never changes whether the candidate may interact; only closing native delivery does.
      required:
        - processed_control_sequence
        - processed_control_digest
        - security_interaction_allowed
        - delivery_watermark_rejections
      properties:
        processed_control_sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        processed_control_digest:
          type: [string, 'null']
          pattern: ^sha256:[0-9a-f]{64}$
        security_interaction_allowed:
          type: boolean
        delivery_watermark_rejections:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DeliveryWatermarkRejection'
    NativeActivation:
      type: object
      additionalProperties: false
      required:
        - capability
        - categories
      properties:
        capability:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        categories:
          type: array
          maxItems: 16
          description: The sub-categories the capability runs; empty means every registered one.
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,63}$
    NativeRule:
      type: object
      additionalProperties: false
      description: One requirement, in the rule grammar Desktop publishes.
      required:
        - rule_id
        - capability
        - mode
        - phase
        - reason
        - requirement
      properties:
        rule_id:
          type: string
          maxLength: 128
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
        capability:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        mode:
          type: string
          enum:
            - enforce
            - observe
        phase:
          type: string
          enum:
            - readiness
            - participation
            - both
        reason:
          type: string
          maxLength: 128
          description: A reason registered for the capability; Desktop owns its localized text.
        requirement:
          $ref: '#/components/schemas/NativeCondition'
    NativeCondition:
      description: >-
        Exactly one of a comparison of a registered field with a typed value, a combination of conditions, or an
        application condition matched on the device. Nesting is at most three deep.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - Compare
          properties:
            Compare:
              type: object
              additionalProperties: false
              required:
                - field
                - op
                - value
              properties:
                field:
                  type: string
                  maxLength: 128
                op:
                  type: string
                  enum:
                    - eq
                    - ne
                    - lt
                    - le
                    - gt
                    - ge
                    - in
                    - not_in
                value:
                  description: A whole number, one of an enumerated field's values, a boolean, or a list of them for in and not_in.
        - type: object
          additionalProperties: false
          required:
            - All
          properties:
            All:
              $ref: '#/components/schemas/NativeConditionList'
        - type: object
          additionalProperties: false
          required:
            - Any
          properties:
            Any:
              $ref: '#/components/schemas/NativeConditionList'
        - type: object
          additionalProperties: false
          required:
            - Not
          properties:
            Not:
              type: object
              additionalProperties: false
              required:
                - condition
              properties:
                condition:
                  $ref: '#/components/schemas/NativeCondition'
        - type: object
          additionalProperties: false
          required:
            - AppsAbsent
          properties:
            AppsAbsent:
              $ref: '#/components/schemas/NativeCatalogApplications'
        - type: object
          additionalProperties: false
          required:
            - AppsOnly
          properties:
            AppsOnly:
              $ref: '#/components/schemas/NativeCatalogApplications'
    NativeConditionList:
      type: object
      additionalProperties: false
      required:
        - conditions
      properties:
        conditions:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/NativeCondition'
    NativeCatalogApplications:
      type: object
      additionalProperties: false
      required:
        - catalog_app_ids
      properties:
        catalog_app_ids:
          type: array
          minItems: 1
          maxItems: 256
          description: Catalog application IDs in ASCII order.
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,63}$
    NativeCapabilityReadiness:
      type: object
      additionalProperties: false
      required:
        - capability
        - source_instance_id
        - sequence
        - permission
        - health
        - certainty
        - state
        - summary
      properties:
        capability:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        source_instance_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: The sequence the capability's event stream continues from.
        permission:
          type: string
          enum:
            - not_determined
            - granted
            - denied
            - restricted
            - unavailable
        health:
          type: string
          enum:
            - unsupported
            - healthy
            - degraded
            - failed
            - stopped
        certainty:
          type: string
          enum:
            - complete
            - partial
            - unknown
        state:
          type: object
          description: >-
            The capability's minimized full state, valid against its published state schema, at most 16 KiB. It never
            holds what must not leave the device. A field named "<capability>.<name>" is read from state.<name>.
        summary:
          type: object
          description: >-
            The counts Desktop derives from the state, valid against its published summary schema, at most 16 KiB. A
            field named "<capability>.summary.<name>" is read from summary.<name>.
    NativeRuleReport:
      type: object
      additionalProperties: false
      required:
        - rule_id
        - status
      properties:
        rule_id:
          type: string
          maxLength: 128
        status:
          type: string
          enum:
            - met
            - not_met
            - unknown
        unknown_cause:
          type: string
          description: Why the rule is unknown; present only when status is unknown.
          enum:
            - unavailable
            - gap
            - unhealthy
            - permission
            - partial
            - checking
