  schemas:
    PrepareSecurityPreflightRequest:
      description: Digests of the Desktop release artifacts.
      type: object
      additionalProperties: false
      required:
        - native_registry_digest
        - source_manifest_digest
        - configuration_manifest_fingerprint
      properties:
        attempt_id:
          description: ID of a Ready Attempt the candidate is entering again. Leave it out for a first entry.
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        native_registry_digest:
          description: SHA-256 digest of the native registry in the Desktop build, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        source_manifest_digest:
          description: SHA-256 digest of the native source manifest in the Desktop build, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        configuration_manifest_fingerprint:
          description: SHA-256 fingerprint of the Attempt Configuration manifest in the Desktop build, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    SecurityPreflightChallenge:
      description: A one-time challenge the preflight report must echo.
      type: object
      additionalProperties: false
      required:
        - preflight_id
        - challenge
        - issued_at
        - expires_at
      properties:
        preflight_id:
          description: ID of the preflight. Use it in the report URL.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        challenge:
          description: 'Random challenge: 32 bytes as URL-safe base64 without padding. Send it back unchanged in the report.'
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        issued_at:
          description: When the server issued the challenge.
          type: string
          format: date-time
        expires_at:
          description: When the challenge stops being accepted, 120 seconds after issued_at.
          type: string
          format: date-time
    EffectiveExamSecurityPolicy:
      type: object
      additionalProperties: false
      required:
        - policy_id
        - revision
        - ordinal
        - digest
        - institution_id
        - exam_revision_id
        - sitting_id
        - scope
        - issued_at
        - active_from
        - application_release_id
        - matrix_id
        - target_tuple
        - registry_digest
        - focus_loss_mode
        - connection_loss_mode
        - resolved_exception_refs
        - evidence_class_id
        - visibility_class_id
        - retention_class_id
        - capabilities
      properties:
        policy_id:
          description: ID of the security policy.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        revision:
          description: Revision label of the policy.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[ -~]+$
        ordinal:
          description: Participation Generation this policy was issued for.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        digest:
          description: SHA-256 digest of the whole policy except this member, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        institution_id:
          description: ID of the Institution that owns the Exam.
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        exam_revision_id:
          description: ID of the Exam Revision the policy comes from.
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        sitting_id:
          description: ID of the Exam Sitting.
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        scope:
          description: 'What the policy is bound to: one admission in progress, or one Attempt once the candidate has connected.'
          oneOf:
            - type: object
              description: Bound to one admission in progress.
              additionalProperties: false
              required:
                - kind
                - admission_scope_id
              properties:
                kind:
                  description: Always admission.
                  type: string
                  const: admission
                admission_scope_id:
                  description: ID of the admission.
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            - type: object
              description: Bound to one Attempt.
              additionalProperties: false
              required:
                - kind
                - attempt_id
              properties:
                kind:
                  description: Always attempt.
                  type: string
                  const: attempt
                attempt_id:
                  description: ID of the Exam Attempt.
                  type: string
                  minLength: 26
                  maxLength: 26
                  pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
        issued_at:
          description: When the server issued the policy.
          type: string
          format: date-time
        active_from:
          description: When the policy took effect.
          type: string
          format: date-time
        application_release_id:
          description: ID of the verified Desktop release the policy was resolved for.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        matrix_id:
          description: ID of that release's capability matrix.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        target_tuple:
          description: Platform target of the Desktop build.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        registry_digest:
          description: SHA-256 digest of the native registry the policy uses, prefixed with sha256:.
          type: string
          const: sha256:79faa1141236b073dff2ff802ce67abce3082417a7a4fa2954615e4226acd1e0
        focus_loss_mode:
          description: 'How Focus Loss is handled: not at all, observed only, or enforced.'
          type: string
          enum:
            - disabled
            - observe
            - enforce
        connection_loss_mode:
          description: How Connection Loss is handled. Always enforce.
          type: string
          const: enforce
        resolved_exception_refs:
          description: Policy exceptions that apply. Currently always empty.
          type: array
          minItems: 0
          maxItems: 0
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        evidence_class_id:
          description: Class of the Integrity Evidence the policy produces.
          type: string
          const: native_integrity
        visibility_class_id:
          description: Who may see that evidence.
          type: string
          const: examiner_restricted
        retention_class_id:
          description: How long that evidence is kept.
          type: string
          const: native_minimized
        capabilities:
          type: array
          minItems: 10
          maxItems: 10
          description: 'Settings for each native capability family, exactly one per family in this order: process_application, interactive_session, clipboard, printing, removable_storage, virtualization, network_configuration, camera, microphone, external_capture.'
          items:
            oneOf:
              - type: object
                description: Settings for watching running applications.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - allowed_application_ids
                properties:
                  id:
                    description: Always process_application.
                    type: string
                    const: process_application
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  allowed_application_ids:
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    description: IDs of allowed applications from the Institution application catalog, sorted and without duplicates. Executable paths, names, commands and regular expressions are not accepted. Empty when mode is disabled.
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        allowed_application_ids:
                          const: []
              - type: object
                description: Settings for watching the interactive session.
                additionalProperties: false
                required:
                  - id
                  - mode
                properties:
                  id:
                    description: Always interactive_session.
                    type: string
                    const: interactive_session
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
              - type: object
                description: Settings for the clipboard.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - observe_os_clipboard_changes
                  - strategy
                properties:
                  id:
                    description: Always clipboard.
                    type: string
                    const: clipboard
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  observe_os_clipboard_changes:
                    description: Whether changes to the operating system clipboard are observed. True when mode is observe, false when it is disabled.
                    type: boolean
                  strategy:
                    description: private_attempt gives the Attempt its own clipboard, and is required when mode is enforce. Otherwise disabled.
                    type: string
                    enum:
                      - disabled
                      - private_attempt
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        observe_os_clipboard_changes:
                          const: false
                        strategy:
                          const: disabled
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        strategy:
                          const: disabled
                        observe_os_clipboard_changes:
                          const: true
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        strategy:
                          const: private_attempt
              - type: object
                description: Settings for printing.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - candidate_print_commands
                  - monitored_spooler
                properties:
                  id:
                    description: Always printing.
                    type: string
                    const: printing
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  candidate_print_commands:
                    description: deny blocks print commands in the candidate interface, and is required when mode is enforce. Otherwise not_applied.
                    type: string
                    enum:
                      - not_applied
                      - deny
                  monitored_spooler:
                    description: Whether the print spooler must be monitored. required when mode is observe, not_required when it is disabled.
                    type: string
                    enum:
                      - not_required
                      - required
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        candidate_print_commands:
                          const: not_applied
                        monitored_spooler:
                          const: not_required
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        candidate_print_commands:
                          const: not_applied
                        monitored_spooler:
                          const: required
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        candidate_print_commands:
                          const: deny
              - type: object
                description: Settings for removable storage.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - allowed_storage_function_class_ids
                  - enabled_sub_capabilities
                properties:
                  id:
                    description: Always removable_storage.
                    type: string
                    const: removable_storage
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  allowed_storage_function_class_ids:
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    description: IDs of allowed storage function classes from the Institution catalog, sorted and without duplicates. Executable paths, names, commands and regular expressions are not accepted. Empty when mode is disabled.
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  enabled_sub_capabilities:
                    description: Which kinds of removable storage are watched. At least one when the family is on, none when it is disabled.
                    type: array
                    maxItems: 2
                    uniqueItems: true
                    items:
                      type: string
                      enum:
                        - removable_block_storage
                        - portable_mtp
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        allowed_storage_function_class_ids:
                          const: []
                        enabled_sub_capabilities:
                          const: []
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
              - type: object
                description: Settings for virtual machine detection.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - rule
                properties:
                  id:
                    description: Always virtualization.
                    type: string
                    const: virtualization
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  rule:
                    description: block_recognized_guest acts on a recognized virtual machine. require_certified_physical_environment requires a certified physical machine. not_applied when mode is disabled.
                    type: string
                    enum:
                      - not_applied
                      - block_recognized_guest
                      - require_certified_physical_environment
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        rule:
                          const: not_applied
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        rule:
                          enum:
                            - block_recognized_guest
                            - require_certified_physical_environment
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        rule:
                          enum:
                            - block_recognized_guest
                            - require_certified_physical_environment
              - type: object
                description: Settings for network configuration.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - allowed_adapter_class_ids
                  - allowed_managed_profile_ids
                  - allowed_tunnel_class_ids
                  - enabled_sub_capabilities
                properties:
                  id:
                    description: Always network_configuration.
                    type: string
                    const: network_configuration
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  allowed_adapter_class_ids:
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    description: IDs of allowed network adapter classes from the Institution catalog, sorted and without duplicates. Empty when mode is disabled.
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  allowed_managed_profile_ids:
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    description: IDs of allowed managed network profiles from the Institution catalog, sorted and without duplicates. Empty when mode is disabled.
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  allowed_tunnel_class_ids:
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    description: IDs of allowed tunnel classes from the Institution catalog, sorted and without duplicates. Empty when mode is disabled.
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  enabled_sub_capabilities:
                    description: Which parts of the network configuration are watched. At least one when the family is on, none when it is disabled.
                    type: array
                    maxItems: 5
                    uniqueItems: true
                    items:
                      type: string
                      enum:
                        - system_proxy_state
                        - os_managed_vpn_state
                        - tunnel_interface_state
                        - route_change
                        - network_source_health
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        allowed_adapter_class_ids:
                          const: []
                        allowed_managed_profile_ids:
                          const: []
                        allowed_tunnel_class_ids:
                          const: []
                        enabled_sub_capabilities:
                          const: []
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
              - type: object
                description: Settings for the camera.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - concurrent_use_check
                  - require_ready
                properties:
                  id:
                    description: Always camera.
                    type: string
                    const: camera
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  concurrent_use_check:
                    description: supported_required means the Desktop must be able to tell when another application is using the camera.
                    type: string
                    enum:
                      - not_required
                      - supported_required
                  require_ready:
                    description: Whether the camera must be ready before the candidate can connect.
                    type: boolean
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        concurrent_use_check:
                          const: not_required
                        require_ready:
                          const: false
                  - if:
                      properties:
                        mode:
                          enum:
                            - observe
                            - enforce
                    then:
                      anyOf:
                        - properties:
                            require_ready:
                              const: true
                        - properties:
                            concurrent_use_check:
                              const: supported_required
              - type: object
                description: Settings for the microphone.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - concurrent_use_check
                  - require_ready
                properties:
                  id:
                    description: Always microphone.
                    type: string
                    const: microphone
                  mode:
                    description: Whether the family is off, observed only, or enforced.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  concurrent_use_check:
                    description: supported_required means the Desktop must be able to tell when another application is using the microphone.
                    type: string
                    enum:
                      - not_required
                      - supported_required
                  require_ready:
                    description: Whether the microphone must be ready before the candidate can connect.
                    type: boolean
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        concurrent_use_check:
                          const: not_required
                        require_ready:
                          const: false
                  - if:
                      properties:
                        mode:
                          enum:
                            - observe
                            - enforce
                    then:
                      anyOf:
                        - properties:
                            require_ready:
                              const: true
                        - properties:
                            concurrent_use_check:
                              const: supported_required
              - type: object
                description: Settings for external capture.
                additionalProperties: false
                required:
                  - id
                  - mode
                properties:
                  id:
                    description: Always external_capture.
                    type: string
                    const: external_capture
                  mode:
                    description: Whether the family is on. Currently always disabled.
                    type: string
                    enum:
                      - disabled
          prefixItems:
            - properties:
                id:
                  const: process_application
            - properties:
                id:
                  const: interactive_session
            - properties:
                id:
                  const: clipboard
            - properties:
                id:
                  const: printing
            - properties:
                id:
                  const: removable_storage
            - properties:
                id:
                  const: virtualization
            - properties:
                id:
                  const: network_configuration
            - properties:
                id:
                  const: camera
            - properties:
                id:
                  const: microphone
            - properties:
                id:
                  const: external_capture
      description: The native security rules fixed for a Participation, with where they came from. issued_at and active_from are UTC with millisecond precision, and issued_at is never later than active_from. The policy has no expiry. Only the renewable Participation Lease keeps it in force. The digest covers every member except digest itself. When the scope moves from the admission to the Attempt, the separately computed content digest stays the same.
    SecurityCatalogBinding:
      description: One Institution catalog the policy refers to, pinned to a revision.
      type: object
      additionalProperties: false
      required:
        - kind
        - catalog_id
        - revision
        - digest
      properties:
        kind:
          description: What the catalog lists.
          type: string
          enum:
            - application
            - storage_function
            - managed_network_profile
            - network_adapter_class
            - tunnel_class
            - detector
        catalog_id:
          description: ID of the catalog.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        revision:
          description: Revision of the catalog the policy uses.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[ -~]+$
        digest:
          description: SHA-256 digest of that catalog revision, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    FrozenAttemptConfiguration:
      description: The Attempt Configuration fixed at first admission, with where it came from.
      type: object
      additionalProperties: false
      required:
        - manifest_fingerprint
        - registry_fingerprint
        - desktop_build
        - desktop_target
        - user_settings_revision
        - presentation
        - approved_commands
        - approved_keybindings
        - attempt_configuration_revision
        - digest
      properties:
        manifest_fingerprint:
          description: Fingerprint of the Attempt Configuration manifest of the Desktop build that was admitted, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        registry_fingerprint:
          description: Fingerprint of the Desktop settings registry of that build, prefixed with fnv1a64:.
          type: string
          pattern: ^fnv1a64:[0-9a-f]{16}$
        desktop_build:
          description: ID of the Desktop build that was admitted.
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        desktop_target:
          description: Target platform of that build.
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        user_settings_revision:
          description: Revision of the User Settings Document the configuration was built from.
          $ref: '#/components/schemas/ID'
        presentation:
          description: Presentation settings fixed for the Attempt.
          $ref: '#/components/schemas/AttemptConfigurationPresentation'
        approved_commands:
          type: array
          description: IDs of approved commands from the Desktop settings catalog, sorted and without duplicates. Raw key chords are rejected.
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        approved_keybindings:
          type: array
          description: IDs of approved keybindings from the Desktop settings catalog, sorted and without duplicates. Each keybinding must map to one of the approved commands. Raw key chords are rejected.
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        attempt_configuration_revision:
          description: Server-assigned revision of the Attempt Configuration.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[ -~]+$
        digest:
          description: SHA-256 digest of the configuration, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    BrowserActivityDisclosure:
      type: object
      additionalProperties: false
      required:
        - notice_id
        - audience
        - retention_policy_revision
        - browser_activity_retention_days
        - retention_anchor
        - may_create_integrity_evidence
      properties:
        notice_id:
          description: ID of the notice text. Always integrated_browser_activity.
          type: string
          const: integrated_browser_activity
        audience:
          description: 'Who can see the collected activity: Exam Managers who hold the Browser Activity permission.'
          type: string
          const: exam_managers_with_browser_activity_permission
        retention_policy_revision:
          description: Revision of the Institution Retention Policy the notice reflects.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        browser_activity_retention_days:
          description: How many days browser activity is kept after the retention starting point. Zero means no automatic expiry is set.
          type: integer
          minimum: 0
          maximum: 36500
        retention_anchor:
          description: 'When the retention period starts: when Sitting Records Completion is recorded for a Closed Sitting.'
          type: string
          const: eligible_closed_sitting_records_completion
        may_create_integrity_evidence:
          description: Whether a blocked navigation can become Integrity Evidence under this Browser Policy.
          type: boolean
      description: A notice to show the candidate about browser activity collection, shown in their language. It is not consent and gives no right to read history. Zero days means no automatic expiry is set. Holds, approval, grace periods and source reconciliation still apply, and minimized Integrity Evidence can be kept for a different period.
    SecurityPolicyResponse:
      type: object
      additionalProperties: false
      required:
        - server_time
        - policy
        - policy_content_digest
        - capability_matrix_digest
        - catalog_bindings
        - preflight_challenge
        - frozen_attempt_configuration
        - browser_activity_disclosure
      properties:
        server_time:
          description: Server time when the response was made.
          type: string
          format: date-time
        policy:
          description: The native security policy resolved for this admission.
          $ref: '#/components/schemas/EffectiveExamSecurityPolicy'
        policy_content_digest:
          description: SHA-256 digest of the policy content, prefixed with sha256:. It stays the same when the policy's scope moves to the Attempt.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        capability_matrix_digest:
          description: SHA-256 digest of the capability matrix of the Desktop release, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        catalog_bindings:
          description: Institution catalogs the policy refers to.
          type: array
          minItems: 0
          maxItems: 32
          items:
            $ref: '#/components/schemas/SecurityCatalogBinding'
        preflight_challenge:
          description: The challenge the preflight report must echo.
          $ref: '#/components/schemas/SecurityPreflightChallenge'
        frozen_attempt_configuration:
          description: The Attempt's fixed configuration when a Ready Attempt is entered again. Null for a first admission.
          oneOf:
            - $ref: '#/components/schemas/FrozenAttemptConfiguration'
            - type: 'null'
        browser_activity_disclosure:
          description: Notice to show the candidate about browser activity collection.
          $ref: '#/components/schemas/BrowserActivityDisclosure'
      description: The security policy for the Sitting and a new preflight challenge, for a registered Desktop only. At most 128 KiB. Catalog bindings are unique and sorted by kind, then catalog_id. A first admission returns a null configuration. Entering a Ready Attempt again returns its original configuration, which can't change.
    NativeSourceCoverage:
      description: The state of one native source, as the Desktop reports it.
      type: object
      additionalProperties: false
      required:
        - source_id
        - source_instance_id
        - sequence
        - source_schema_digest
        - adapter_version
        - health
        - permission
        - complete
        - gap_count
      properties:
        source_id:
          description: The native source.
          type: string
          enum:
            - display-topology
            - candidate-window
            - capture-session
            - process-application
            - interactive-session
            - clipboard
            - print-spooler
            - removable-storage
            - virtualization
            - network-configuration
            - media-device
        source_instance_id:
          description: ID of the running instance of the source. It changes when the source resets.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        sequence:
          description: Latest sequence number of the source instance.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        source_schema_digest:
          description: SHA-256 digest of the source's schema, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        adapter_version:
          description: Version of the adapter that runs the source.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        health:
          description: Health of the source.
          type: string
          enum:
            - starting
            - healthy
            - degraded
            - failed
            - recovering
            - stopped
        permission:
          description: Whether the operating system lets the source run.
          type: string
          enum:
            - denied
            - granted
            - not_determined
            - restricted
            - unavailable
        complete:
          description: Whether the source reports complete coverage.
          type: boolean
        gap_count:
          description: Number of gaps the source instance has had. It never goes down.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    NativeCoverageClaim:
      description: What the Desktop can do for one coverage requirement.
      type: object
      additionalProperties: false
      required:
        - coverage_key
        - source_schema_digest
        - claim
        - state
      properties:
        coverage_key:
          description: Key of the coverage requirement from the native registry.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        source_schema_digest:
          description: SHA-256 digest of the schema of the source behind it, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        claim:
          description: 'What the Desktop claims it can do: enforce, observe, or nothing.'
          type: string
          enum:
            - enforce
            - observe
            - unavailable
        state:
          description: Whether that coverage is ready, degraded or unavailable.
          type: string
          enum:
            - ready
            - degraded
            - unavailable
    NativeBaselineReport:
      description: Whether the Desktop verified the baseline protections every Exam needs.
      type: object
      additionalProperties: false
      required:
        - constrained_window
        - single_physical_display
        - content_protection
      properties:
        constrained_window:
          description: Whether the Desktop verified that the exam window is constrained.
          type: string
          enum:
            - verified
            - unavailable
        single_physical_display:
          description: Whether the Desktop verified that a single physical display is in use.
          type: string
          enum:
            - verified
            - unavailable
        content_protection:
          description: Whether the Desktop verified content protection for the exam window.
          type: string
          enum:
            - verified
            - unavailable
    SecurityPreflightReport:
      type: object
      additionalProperties: false
      required:
        - challenge
        - policy_digest
        - policy_content_digest
        - capability_matrix_digest
        - security_session_id
        - source_manifest_digest
        - selected_source_categories
        - sources
        - coverage
        - baseline
        - posture
        - reported_at
      properties:
        challenge:
          description: The challenge from the preflight response, unchanged.
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        policy_digest:
          description: digest of the policy from the preflight response.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        policy_content_digest:
          description: policy_content_digest from the preflight response.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        capability_matrix_digest:
          description: capability_matrix_digest from the preflight response.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        security_session_id:
          description: ID the Desktop gives its security session.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        source_manifest_digest:
          description: SHA-256 digest of the native source manifest in the Desktop build, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        selected_source_categories:
          description: Source categories the policy selected, in the order the policy gives.
          type: array
          minItems: 0
          maxItems: 10
          items:
            type: string
            enum:
              - os-clipboard-change
              - removable-block-storage
              - portable-mtp
              - system-proxy-state
              - os-managed-vpn-state
              - tunnel-interface-state
              - route-change
              - network-source-health
              - camera
              - microphone
          uniqueItems: true
        sources:
          description: State of each native source the policy needs, in policy order.
          type: array
          minItems: 0
          maxItems: 11
          items:
            $ref: '#/components/schemas/NativeSourceCoverage'
        coverage:
          description: What the Desktop can do for each coverage requirement, sorted by coverage_key.
          type: array
          minItems: 0
          maxItems: 64
          items:
            $ref: '#/components/schemas/NativeCoverageClaim'
        baseline:
          description: Result of the baseline protection checks.
          $ref: '#/components/schemas/NativeBaselineReport'
        posture:
          description: Overall security state the Desktop reports.
          type: string
          enum:
            - compliant
            - degraded
            - contained
            - failed
        reported_at:
          description: When the Desktop made the report, by its own clock. Kept only as a record.
          type: string
          format: date-time
      description: Minimal assertions from the Desktop, at most 64 KiB. Sources and categories must match the resolved policy, in its order, and coverage keys must be sorted and exact. Inventories, media, clipboard content, operating system errors and free-form details are not accepted. The server computes the report digest. reported_at is kept only as a record. Server time decides when the challenge expires and whether the report is still fresh enough to connect.
    SecurityPreflightResult:
      description: The outcome of a preflight report.
      type: object
      additionalProperties: false
      required:
        - preflight_id
        - report_digest
        - admission
        - reason_codes
        - server_time
        - expires_at
      properties:
        preflight_id:
          description: ID of the preflight.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        report_digest:
          description: SHA-256 digest of the stored report, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        admission:
          description: eligible when the candidate may connect, blocked otherwise.
          type: string
          enum:
            - eligible
            - blocked
        reason_codes:
          description: Why the report was blocked. Empty when admission is eligible.
          type: array
          minItems: 0
          maxItems: 16
          items:
            type: string
            enum:
              - policy_changed
              - unsupported_capability
              - source_unavailable
              - permission_required
              - baseline_unavailable
              - preflight_expired
              - preflight_superseded
              - posture_blocked
              - configuration_unsupported
              - session_changed
          uniqueItems: true
        server_time:
          description: Server time when the result was made.
          type: string
          format: date-time
        expires_at:
          description: When the preflight challenge expires. After this, Connect can't use the result.
          type: string
          format: date-time
    AdmittedSecurity:
      description: The security binding of the active Participation.
      type: object
      additionalProperties: false
      required:
        - policy
        - policy_content_digest
        - preflight_id
        - preflight_report_digest
        - preflight_policy_digest
        - participation_id
        - generation
        - security_session_id
        - delivery_stream_id
        - renewal_interval_seconds
      properties:
        policy:
          description: The native security policy, now bound to the Attempt.
          $ref: '#/components/schemas/EffectiveExamSecurityPolicy'
        policy_content_digest:
          description: SHA-256 digest of the policy content, prefixed with sha256:. It is the same as at preflight.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        preflight_id:
          description: ID of the preflight Connect used.
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        preflight_report_digest:
          description: SHA-256 digest of that preflight report, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        preflight_policy_digest:
          description: Policy digest the preflight was checked against, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        participation_id:
          description: ID of the active Attempt Participation.
          $ref: '#/components/schemas/ID'
        generation:
          description: Participation Generation. It equals the policy ordinal.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        security_session_id:
          description: ID of the Desktop security session.
          type: string
          minLength: 1
          maxLength: 128
        delivery_stream_id:
          description: ID of the native security stream for this Participation.
          type: string
          minLength: 1
          maxLength: 128
        renewal_interval_seconds:
          description: How often the Desktop must renew the Participation, in seconds. Always 5.
          type: integer
          format: int64
          const: 5
    SecurityPolicyRecovery:
      description: 'What a Desktop needs to resume after a lost response: its security binding, fixed configuration and the latest coverage the server accepted.'
      type: object
      additionalProperties: false
      required:
        - server_time
        - security
        - frozen_attempt_configuration
        - current_sources
        - current_coverage
        - source_reset_receipts
        - security_coverage
      properties:
        server_time:
          description: Server time when the response was made.
          type: string
          format: date-time
        security:
          description: The security binding of the active Participation.
          $ref: '#/components/schemas/AdmittedSecurity'
        frozen_attempt_configuration:
          description: The Attempt Configuration fixed at first admission.
          $ref: '#/components/schemas/FrozenAttemptConfiguration'
        current_sources:
          description: Latest state of each native source the server accepted.
          type: array
          maxItems: 11
          items:
            $ref: '#/components/schemas/NativeSourceCoverage'
        current_coverage:
          description: Latest coverage claims the server accepted.
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/NativeCoverageClaim'
        source_reset_receipts:
          description: Receipts for the source resets the server has recorded.
          type: array
          maxItems: 11
          items:
            $ref: '#/components/schemas/SourceResetReceipt'
        security_coverage:
          description: Result of the latest coverage renewal the server processed.
          $ref: '#/components/schemas/SecurityCoverageResult'
    SourceResetReceipt:
      description: Receipt for one recorded source reset.
      type: object
      additionalProperties: false
      required:
        - reset_id
        - reset_digest
      properties:
        reset_id:
          description: ID the Desktop gave the reset.
          type: string
          minLength: 1
          maxLength: 128
        reset_digest:
          description: SHA-256 digest of the recorded reset, prefixed with sha256:.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    DeliveryWatermarkRejection:
      description: A delivery position report from the Desktop that the server rejected.
      type: object
      additionalProperties: false
      required:
        - family
        - source_id
        - reason
      properties:
        family:
          description: 'Delivery family of the source: native or browser.'
          type: string
          enum:
            - native
            - browser
        source_id:
          description: ID of the native stream or browser activity source.
          type: string
          minLength: 1
          maxLength: 128
        reason:
          description: closed_source when the source is already closed. position_limit when the reported positions are over the limit.
          type: string
          enum:
            - closed_source
            - position_limit
    SecurityCoverageResult:
      description: Result of the latest coverage renewal the server processed.
      type: object
      additionalProperties: false
      required:
        - processed_control_sequence
        - processed_control_digest
        - coverage_result
        - source_reset_receipts
        - security_interaction_allowed
        - delivery_watermark_rejections
      properties:
        processed_control_sequence:
          description: Control sequence number of the latest renewal processed. Zero when none has been processed.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        processed_control_digest:
          description: SHA-256 digest of that renewal, prefixed with sha256:. Null when none has been processed.
          type: [string, 'null']
          pattern: ^sha256:[0-9a-f]{64}$
        coverage_result:
          description: accepted when the coverage was recorded. stale_control when no newer renewal was applied. reset_required when a source changed instance without a reset record. reset_conflict when a reset record or sequence number conflicts with what the server already recorded.
          type: string
          enum:
            - accepted
            - stale_control
            - reset_required
            - reset_conflict
        source_reset_receipts:
          description: Receipts for the source resets in that renewal.
          type: array
          maxItems: 11
          items:
            $ref: '#/components/schemas/SourceResetReceipt'
        security_interaction_allowed:
          description: Whether the current security coverage still lets the candidate interact with the Attempt.
          type: boolean
        delivery_watermark_rejections:
          description: Delivery position reports in the renewal that the server rejected.
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DeliveryWatermarkRejection'
