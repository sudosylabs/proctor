components:
  responses:
    CandidateWorkspaceMutationCreated:
      description: The server accepted and recorded the new Workspace entry.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateWorkspaceMutationResponse'
          example:
            workspace_id: wj3drgzdpnf54rxf5d8qd3dqne
            workspace_cursor: 18
            operation: create_file
            entry:
              id: g63dcrphk8idgyjgzbrpajosz6
              kind: file
              path: answers/main_test.go
              content_version: EcTl31uGQ_dFCGAtmNtc0mRau8
              media_type: text/x-go
              size: 912
              sha256: d4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35
    CandidateWorkspaceMutationOK:
      description: The server accepted and recorded the Workspace change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateWorkspaceMutationResponse'
          example:
            workspace_id: wj3drgzdpnf54rxf5d8qd3dqne
            workspace_cursor: 19
            operation: move_entry
            entry:
              id: saqjfmjqqy9mo1yj4zwed73333
              kind: file
              path: answers/final.txt
              content_version: VhOGu5NgyvhwvSuqK4dWGlgnoA
              media_type: text/plain
              size: 640
              sha256: 4e07408562bedb8b60ce05c1decfe3ad16b72230967de01f640b7e4729b49fce
    CandidateExamProtectedContent:
      description: The requested Exam content, sent inline to the authorized candidate. This is not a public or export URL.
      headers:
        ETag:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
      content:
        '*/*':
          schema:
            type: string
            format: binary
    CandidateExamContentNotModified:
      description: The content has not changed since the entity tag the client sent.
      headers:
        ETag:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
  schemas:
    CandidateExamWorkspaceItemResponse:
      description: One file or directory in the Attempt Workspace. File-only members are omitted for directories.
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - path
      properties:
        id:
          description: ID of the Workspace Entry. It stays the same when the entry is renamed or moved.
          $ref: '#/components/schemas/ID'
        kind:
          description: Whether the entry is a file or a directory.
          type: string
          enum:
            - file
            - directory
        path:
          description: Current Workspace Path of the entry.
          $ref: '#/components/schemas/StarterWorkspacePath'
        content_version:
          description: Workspace Content Version of the current file content. Present only for files. Send it back unchanged when you replace or delete the file.
          $ref: '#/components/schemas/WorkspaceContentVersion'
        media_type:
          description: Media type declared for the file. Present only for files.
          type: string
          minLength: 1
          maxLength: 255
        size:
          description: File size in bytes. Present only for files.
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
        sha256:
          description: Lowercase hexadecimal SHA-256 digest of the file content. Present only for files.
          $ref: '#/components/schemas/SHA256'
      oneOf:
        - properties:
            kind:
              const: file
          required:
            - content_version
            - media_type
            - size
            - sha256
        - properties:
            kind:
              const: directory
          not:
            anyOf:
              - required:
                  - content_version
              - required:
                  - media_type
              - required:
                  - size
              - required:
                  - sha256
    CandidateWorkspaceMutationResponse:
      description: The change the server accepted and recorded in the Workspace.
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - workspace_cursor
        - operation
      properties:
        workspace_id:
          description: ID of the Attempt Workspace that changed.
          $ref: '#/components/schemas/ID'
        workspace_cursor:
          description: Workspace Cursor of this change. Keep it to continue the change listing from this point.
          type: integer
          format: int64
          minimum: 1
        operation:
          description: The kind of change the server applied.
          type: string
          enum:
            - create_file
            - create_directory
            - replace_file
            - move_entry
            - delete_entry
        entry:
          description: The entry as it is after the change. Omitted when the entry was deleted.
          $ref: '#/components/schemas/CandidateExamWorkspaceItemResponse'
