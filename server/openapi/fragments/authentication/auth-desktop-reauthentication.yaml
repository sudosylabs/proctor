paths:
  /api/v1/auth/desktop/reauthentications:
    post:
      operationId: startDesktopReauthentication
      summary: Start confirming the Desktop Session's account in the system browser
      description: Starts confirming, in the system browser, that the person using a Desktop Session is still its account holder. Only a Desktop Session can call this, with a valid DPoP proof from its registered key. Web Sessions and Personal Access Tokens are refused. Proctor stores the loopback callback address, state and S256 PKCE challenge, ties the request to the calling Session, Desktop Registration, key and User, and returns the hosted reauthentication page. The page accepts only the sign-in method the Desktop Session itself used. The request lasts at most five minutes.
      tags: [Authentication]
      x-proctor-auth: session_required
      x-proctor-error-codes: [request.invalid, authentication.rate_limited, authentication.rate_limit_unavailable, authentication.desktop_reauthentication.invalid, authentication.internal, authentication.required, authentication.token_invalid, authentication.credential_ambiguous, authentication.dpop.invalid, authentication.dpop.replayed, authentication.dpop.use_nonce, authentication.dpop.unavailable, authentication.csrf.invalid]
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody: {$ref: '#/components/requestBodies/DesktopReauthenticationStart'}
      responses:
        "201": {$ref: '#/components/responses/DesktopReauthenticationStarted'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "500": {$ref: '#/components/responses/InternalError'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/desktop/reauthentications/bind:
    post:
      operationId: bindDesktopReauthenticationBrowser
      summary: Exchange the one-time fragment proof for an HttpOnly reauthentication binding
      description: The hosted page sends the request handle, the browser proof from the page address fragment and the state. This works once. Proctor then sets a host-only HttpOnly cookie that is sent only to the Desktop reauthentication routes. The response body is empty, so the page's own scripts never see a credential.
      tags: [Authentication]
      x-proctor-auth: public
      x-proctor-error-codes: [request.invalid, authentication.desktop_reauthentication.invalid, authentication.internal]
      x-proctor-idempotency: none
      security: []
      requestBody: {$ref: '#/components/requestBodies/DesktopAuthorizationProof'}
      responses:
        "204": {$ref: '#/components/responses/SensitiveNoContent'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "500": {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/desktop/reauthentications/context:
    get:
      operationId: getDesktopReauthenticationContext
      summary: Read the hosted Desktop reauthentication context
      description: Uses the browser's reauthentication cookie to return the Desktop Session account's display name, the one sign-in method this request accepts and when the request expires. The method is either a password or the Desktop Session's own identity provider. A Web Session already open in the browser is never accepted as proof.
      tags: [Authentication]
      x-proctor-auth: public
      x-proctor-error-codes: [authentication.desktop_reauthentication.invalid, authentication.internal, authentication.credential_ambiguous]
      x-proctor-idempotency: none
      security: []
      responses:
        "200": {$ref: '#/components/responses/DesktopReauthenticationContextOK'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "500": {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/desktop/reauthentications/authenticate/password:
    post:
      operationId: authenticateDesktopReauthenticationWithPassword
      summary: Prove the Desktop Session account's password
      description: Checks the password of the Desktop Session's own User. It works only when the Desktop Session was signed in with a password. It creates no Web Session. When the Desktop Session is single_factor and the User has active Proctor two-step verification, the browser must also prove a code. The Desktop Session is updated only when Desktop calls the complete operation.
      tags: [Authentication]
      x-proctor-auth: public
      x-proctor-error-codes: [request.invalid, authentication.desktop_reauthentication.invalid, authentication.reauthentication_method_required, authentication.desktop_reauthentication.denied, authentication.credentials_invalid, authentication.rate_limited, authentication.rate_limit_unavailable, authentication.internal, authentication.credential_ambiguous, audit.unavailable, service.busy, authentication.mfa.unavailable]
      x-proctor-idempotency: none
      security: []
      requestBody: {$ref: '#/components/requestBodies/DesktopReauthenticationPassword'}
      responses:
        "200": {$ref: '#/components/responses/DesktopReauthenticationContextOK'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409": {$ref: '#/components/responses/Conflict'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "500": {$ref: '#/components/responses/InternalError'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/desktop/reauthentications/authenticate/second-factor:
    post:
      operationId: authenticateDesktopReauthenticationSecondFactor
      summary: Verify the code for Desktop reauthentication
      description: Uses the Desktop reauthentication cookie and verifies an authenticator code or one unused recovery code. The authenticated browser context can then be approved to finish confirming the Desktop Session.
      tags: [Authentication]
      x-proctor-auth: public
      x-proctor-error-codes: [request.invalid, authentication.credential_ambiguous, authentication.desktop_reauthentication.invalid, authentication.desktop_reauthentication.denied, authentication.credentials_invalid, authentication.internal, audit.unavailable, authentication.external.invalid, authentication.external.second_factor_expired, authentication.external.unavailable, authentication.mfa.code_invalid, authentication.mfa.unavailable, authentication.rate_limited, authentication.rate_limit_unavailable]
      x-proctor-idempotency: none
      security: []
      requestBody: {$ref: '#/components/requestBodies/MFACode'}
      responses:
        "200": {$ref: '#/components/responses/DesktopReauthenticationContextOK'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409": {$ref: '#/components/responses/Conflict'}
        "410": {$ref: '#/components/responses/Gone'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "500": {$ref: '#/components/responses/InternalError'}
        "502": {$ref: '#/components/responses/BadGateway'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/desktop/reauthentications/authenticate/providers/{provider_id}/login:
    get:
      operationId: beginDesktopReauthenticationExternalAuthentication
      summary: Begin fresh provider authentication for this Desktop reauthentication
      description: Accepts only the Desktop Session's own identity provider. Proctor asks the provider for a new sign-in and then returns to the hosted reauthentication page. The provider must confirm the same linked identity the Desktop Session uses. If it confirms any other account, the request is denied and the denial is recorded in the audit log. No User is created and no Session is created.
      tags: [Authentication]
      parameters:
        - $ref: '#/components/parameters/ProviderID'
        - name: state
          in: query
          required: true
          description: The state value the Desktop sent when it started this reauthentication, passed through unchanged.
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      x-proctor-auth: public
      x-proctor-error-codes: [request.invalid, authentication.desktop_reauthentication.invalid, authentication.reauthentication_method_required, authentication.internal, authentication.external.provider_not_found, authentication.external.request.invalid, authentication.external.unavailable, authentication.external.account_not_linked, authentication.external.rejected, authentication.desktop_authorization.invalid, authentication.token_invalid, authentication.rate_limited, authentication.rate_limit_unavailable, authentication.credential_ambiguous]
      x-proctor-idempotency: none
      security: []
      responses:
        "303": {$ref: '#/components/responses/ExternalAuthenticationRedirect'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "500": {$ref: '#/components/responses/InternalError'}
        "502": {$ref: '#/components/responses/BadGateway'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/desktop/reauthentications/approve:
    post:
      operationId: approveDesktopReauthentication
      summary: Hand the confirmed proof back to Proctor Desktop
      description: Needs the browser's reauthentication cookie, the same state the Desktop sent, a successful proof and a Desktop Session that is still active. Proctor then issues one single-use code that expires within a minute. It returns the loopback address to send the browser to, which carries only that code and the state.
      tags: [Authentication]
      x-proctor-auth: public
      x-proctor-error-codes: [request.invalid, authentication.desktop_reauthentication.invalid, authentication.internal, authentication.credential_ambiguous]
      x-proctor-idempotency: none
      security: []
      requestBody: {$ref: '#/components/requestBodies/DesktopAuthorizationState'}
      responses:
        "200": {$ref: '#/components/responses/DesktopAuthorizationApproved'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "500": {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/desktop/reauthentications/cancel:
    post:
      operationId: cancelDesktopReauthentication
      summary: Terminally cancel the browser-bound Desktop reauthentication
      description: Checks the browser's reauthentication cookie and the state, then cancels the reauthentication for good. Every remaining browser proof for it stops working.
      tags: [Authentication]
      x-proctor-auth: public
      x-proctor-error-codes: [request.invalid, authentication.desktop_reauthentication.invalid, authentication.internal, authentication.credential_ambiguous]
      x-proctor-idempotency: none
      security: []
      requestBody: {$ref: '#/components/requestBodies/DesktopAuthorizationState'}
      responses:
        "204": {$ref: '#/components/responses/SensitiveNoContent'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "500": {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/desktop/reauthentications/complete:
    post:
      operationId: completeDesktopReauthentication
      summary: Redeem the reauthentication code as recent authentication
      description: The Desktop redeems the code. The request must carry a DPoP proof from the same Desktop Session and registered key that started the reauthentication. Proctor checks the PKCE verifier, the state, that the code has not expired and has not been used, and checks the proof and the Session again. It then records the new proof time on that Session and saves the audit record with it. No Session is created, the Desktop Registration stays the same and the current access credentials keep working.
      tags: [Authentication]
      x-proctor-auth: session_required
      x-proctor-error-codes: [request.invalid, authentication.rate_limited, authentication.rate_limit_unavailable, authentication.desktop_reauthentication.invalid, authentication.credentials_invalid, authentication.internal, audit.unavailable, authentication.required, authentication.token_invalid, authentication.credential_ambiguous, authentication.dpop.invalid, authentication.dpop.replayed, authentication.dpop.use_nonce, authentication.dpop.unavailable, authentication.csrf.invalid]
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody: {$ref: '#/components/requestBodies/DesktopReauthenticationComplete'}
      responses:
        "200": {$ref: '#/components/responses/DesktopReauthenticationCompleted'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "500": {$ref: '#/components/responses/InternalError'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
components:
  requestBodies:
    DesktopReauthenticationStart:
      description: The loopback callback address, state and S256 PKCE challenge for the new reauthentication.
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DesktopReauthenticationStartRequest'}
          example:
            callback_url: http://127.0.0.1:53108/Wm7xQ2cVb9LtRk4nYz6HdPs1FgJ8aEoU3iTkBvN5wQe
            state: Rk2pV8mXc5LwTq9bNz3YhDs7FgJ1aEoU6iTkBvM4xWe
            code_challenge: 47DEQpj8HBSa-_TImW-5JCeuQeRkm5NMpJWZG3hSuFU
    DesktopReauthenticationPassword:
      description: The password of the Desktop Session's own account. There is no username to choose.
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DesktopReauthenticationPasswordRequest'}
          example:
            password: correct-horse-battery-staple-2026
    DesktopReauthenticationComplete:
      description: The one-time code from the loopback callback, the PKCE verifier and the state.
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DesktopReauthenticationCompleteRequest'}
          example:
            code: Nc4wT7qXb1MvRk8zYh2HdPs5FgJ9aEoU6iTkBvL3xQe
            code_verifier: M25iVXpKU3puUjFaYWg3T1NDTDQtcW1ROUY5YXlwalNoc0hhakxifmZHag
            state: Rk2pV8mXc5LwTq9bNz3YhDs7FgJ1aEoU6iTkBvM4xWe
  responses:
    DesktopReauthenticationStarted:
      description: The Desktop reauthentication request was created
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DesktopAuthorizationStartResponse'}
          example:
            authorization_url: 'https://proctor.example.edu/reauthenticate/desktop?request=Hs6nW1cQx8LmRv3tKb5YpZd9FgJ4aEoU2iTkBvM7xNe&state=Rk2pV8mXc5LwTq9bNz3YhDs7FgJ1aEoU6iTkBvM4xWe#proof=Ty9mK5wQz2LxRb7cNh1YdPs3FgJ6aEoU8iTkBvM4xWq'
            expires_at: '2026-08-01T09:05:00Z'
    DesktopReauthenticationContextOK:
      description: What the hosted page needs to show for the current Desktop reauthentication
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DesktopReauthenticationContextResponse'}
          example:
            state: bound
            display_name: Ada Candidate
            authentication_method: external
            provider:
              id: campus-sso
              display_name: Campus single sign-on
              type: oidc
            expires_at: '2026-08-01T09:05:00Z'
    DesktopReauthenticationCompleted:
      description: The Desktop Session counts as recently authenticated
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DesktopReauthenticationCompleteResponse'}
          example:
            authentication_strength: multi_factor
            recently_authenticated_until: '2026-08-01T09:17:00Z'
  schemas:
    DesktopReauthenticationStartRequest:
      type: object
      additionalProperties: false
      required: [callback_url, state, code_challenge]
      properties:
        callback_url:
          type: string
          format: uri
          maxLength: 1024
          description: The Desktop's loopback callback address, checked by the same rules as Desktop authorization. It must use http, the host 127.0.0.1 or [::1], a port from 49152 through 65535, and a path made of one random token of 43 URL-safe base64 characters.
        state: {description: "A random value the Desktop makes for this reauthentication: 32 random bytes as 43 URL-safe base64 characters. The hosted page and the complete call must send the same value back.", type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        code_challenge: {description: "The PKCE S256 challenge: the URL-safe base64 SHA-256 hash of the code_verifier the Desktop will send to the complete call, without padding.", type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    DesktopReauthenticationPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {description: "The local password of the Desktop Session's account. Treat it as a secret and keep it out of traces and logs.", type: string, format: password, maxLength: 1024}
    DesktopReauthenticationCompleteRequest:
      type: object
      additionalProperties: false
      required: [code, code_verifier, state]
      properties:
        code: {description: "The one-time code from the code query parameter Proctor added to the loopback callback address.", type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        code_verifier: {description: "The PKCE verifier whose S256 hash the Desktop sent as code_challenge.", type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$'}
        state: {description: "The state value the Desktop sent when it started this reauthentication.", type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    DesktopReauthenticationContextResponse:
      type: object
      additionalProperties: false
      required: [state, display_name, authentication_method, expires_at]
      properties:
        state: {description: "Where the reauthentication stands. bound means this browser holds the request but has not proved the account yet. second_factor_required means the primary proof succeeded and a code is needed. authenticated means the proof succeeded and the request is waiting for approval.", type: string, enum: [bound, second_factor_required, authenticated]}
        display_name:
          type: string
          description: The Desktop Session account's display name, so the person can see whose sign-in they are confirming.
        authentication_method:
          type: string
          enum: [password, external]
          description: The one sign-in method this reauthentication accepts. It is always the method the Desktop Session itself used.
        provider:
          $ref: '#/components/schemas/ExternalAuthenticationProviderResponse'
          description: The Desktop Session's own identity provider. Present only when authentication_method is external.
        expires_at: {description: "When this reauthentication request expires. It lasts at most five minutes.", type: string, format: date-time}
    DesktopReauthenticationCompleteResponse:
      type: object
      additionalProperties: false
      required: [recently_authenticated_until, authentication_strength]
      properties:
        recently_authenticated_until:
          type: string
          format: date-time
          description: Until this time, actions that need a recent sign-in are allowed. After it, they ask for reauthentication again.
        authentication_strength:
          type: string
          enum: [single_factor, multi_factor]
          description: The strength of the Desktop Session after confirming the account.
