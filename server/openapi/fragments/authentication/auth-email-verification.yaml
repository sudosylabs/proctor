paths:
  /api/v1/auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      summary: Request an email-verification message
      description: >-
        Emails a new short-lived verification link to the signed-in User's current email address when it is not yet verified. The response is the same in every case, so it reveals nothing about the account. A new link may replace any earlier link that still works.
      x-codeSamples:
        - lang: Shell
          label: Request verification mail
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/auth/email-verification/request
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_recovery.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          $ref: '#/components/responses/SensitiveAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/email-verification/complete:
    post:
      operationId: completeEmailVerification
      summary: Consume an email-verification credential
      description: >-
        Uses up one valid verification token and marks the email address it was issued for as verified. A token works once and can't verify any other address. An invalid or expired token reveals no account details.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/CompleteEmailVerification'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/email-verification/inspect:
    post:
      operationId: inspectEmailVerification
      summary: Read the address an email-verification credential would confirm
      description: >-
        Returns the address an active verification token was issued for, so the hosted page can show it before the person confirms. It never uses up, extends or reissues the token, and it records no audit event. It shares the rate limits of completion, counted per token and per source address. A token that is unknown, malformed, expired, replaced or already used gets the same generic invalid-token error as completion. The token is sent in the body so it stays out of URLs and logs. The result is for display only: completion checks the token again.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/InspectEmailVerification'
      responses:
        "200":
          $ref: '#/components/responses/EmailVerificationInspected'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/email-change/undo:
    post:
      operationId: undoEmailChange
      summary: Undo an email change from the previous address
      description: >-
        Uses up the one-time undo token that Proctor emails to an account's previous address when its email changes. Within the configured undo window, it restores that address as the account's verified email, cancels pending verification and password-reset links, signs out every Session of the account and records an audit event. An invalid, expired or already used token reveals no account details. If another account now uses the previous address, the undo is refused.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
        - authentication.email_change_undo.conflict
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/UndoEmailChange'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/email-change/undo/inspect:
    post:
      operationId: inspectEmailChangeUndo
      summary: Read the email change an undo credential would reverse
      description: >-
        For one active undo token, returns the previous address it would restore, the account's current address masked as in the warning email, and when the change happened. It never uses up, extends or reissues the token, and it records no audit event. It shares the rate limits of the undo, counted per token and per source address. A token that is unknown, malformed, expired or already used gets the same generic invalid-token error as the undo itself. The token is sent in the body so it stays out of URLs and logs. Only the undo itself checks whether the previous address is still free.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/InspectEmailChangeUndo'
      responses:
        "200":
          $ref: '#/components/responses/EmailChangeUndoInspected'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    EmailVerificationInspected:
      description: The address the active verification token would confirm
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailVerificationInspectionResponse'
          example:
            email: student.one@example.edu
    EmailChangeUndoInspected:
      description: The email change the active undo token would reverse
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeUndoInspectionResponse'
          example:
            restored_email: student.one@example.edu
            masked_current_email: s***@example.org
            changed_at: '2026-08-01T00:00:00Z'
  requestBodies:
    InspectEmailVerification:
      required: true
      description: The email-verification token from the link's fragment. This call reads the token and does not use it up.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountTokenInspectionRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    InspectEmailChangeUndo:
      required: true
      description: The undo token from the link's fragment. This call reads the token and does not use it up.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountTokenInspectionRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    UndoEmailChange:
      required: true
      description: The one-time undo token emailed to the previous address.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeUndoRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    CompleteEmailVerification:
      required: true
      description: The one-time email-verification token from the verification email.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailVerificationCompletionRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  schemas:
    EmailVerificationCompletionRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          description: The verification token from the link in the verification email, as 43 URL-safe base64 characters.
    EmailChangeUndoRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          description: The undo token from the link emailed to the previous address, as 43 URL-safe base64 characters.
    AccountTokenInspectionRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          description: The token from the emailed link's fragment, as 43 URL-safe base64 characters. It is read and not used up.
    EmailVerificationInspectionResponse:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The address the token was issued for and would mark verified.
    EmailChangeUndoInspectionResponse:
      type: object
      additionalProperties: false
      required:
        - restored_email
        - masked_current_email
        - changed_at
      properties:
        restored_email:
          type: string
          format: email
          description: The previous address the undo would restore. The token was emailed to this address.
        masked_current_email:
          type: string
          description: The account's current address, masked as in the email-change warning (first character, up to three asterisks, and the domain).
        changed_at:
          type: string
          format: date-time
          description: When the email change happened.
