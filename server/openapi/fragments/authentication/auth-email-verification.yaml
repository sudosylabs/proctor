paths:
  /api/v1/auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      summary: Request an email-verification message
      description: >-
        Requests a new short-lived verification message for the authenticated User's current unverified email address. The response is deliberately non-enumerating, and any prior usable verification credential may be superseded.
      x-codeSamples:
        - lang: Shell
          label: Request verification mail
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/auth/email-verification/request
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_recovery.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          $ref: '#/components/responses/SensitiveAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/email-verification/complete:
    post:
      operationId: completeEmailVerification
      summary: Consume an email-verification credential
      description: >-
        Consumes one valid short-lived verification token and marks its bound email address verified. The token is single use, cannot verify another address, and an invalid or expired token reveals no account details.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/CompleteEmailVerification'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/email-verification/inspect:
    post:
      operationId: inspectEmailVerification
      summary: Read the address an email-verification credential would confirm
      description: >-
        Returns the address bound to one active verification token so the hosted page can name it before the person confirms. It never consumes, extends, or reissues the token and records no audit event. It is rate-limited by token and source with the completion policy, and an unknown, malformed, expired, superseded, or already used token receives the same generic invalid-credential outcome as completion. The token travels in the body so it stays out of URLs and logs; the result is presentation only and completion rechecks the token.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/InspectEmailVerification'
      responses:
        "200":
          $ref: '#/components/responses/EmailVerificationInspected'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/email-change/undo:
    post:
      operationId: undoEmailChange
      summary: Undo an email change from the previous address
      description: >-
        Consumes the single-use undo token Proctor mails to an account's previous address when its email changes. Within the configured undo window it restores that address as the verified account email, cancels pending verification and password-reset links, signs out every Session of the account, and records an audit event. An invalid, expired, or already used token reveals no account details; a previous address that another account now holds is refused.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
        - authentication.email_change_undo.conflict
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/UndoEmailChange'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/email-change/undo/inspect:
    post:
      operationId: inspectEmailChangeUndo
      summary: Read the email change an undo credential would reverse
      description: >-
        Returns, for one active undo token, the previous address it would restore, the account's current address masked as in the warning mail, and when the change was applied. It never consumes, extends, or reissues the token and records no audit event. It is rate-limited by token and source with the undo policy, and an unknown, malformed, expired, or already used token receives the same generic invalid-credential outcome as the undo itself. The token travels in the body so it stays out of URLs and logs; whether the previous address is still free is decided only by the undo.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/InspectEmailChangeUndo'
      responses:
        "200":
          $ref: '#/components/responses/EmailChangeUndoInspected'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    EmailVerificationInspected:
      description: The address the active verification token would confirm
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailVerificationInspectionResponse'
          example:
            email: student.one@example.edu
    EmailChangeUndoInspected:
      description: The email change the active undo token would reverse
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeUndoInspectionResponse'
          example:
            restored_email: student.one@example.edu
            masked_current_email: s***@example.org
            changed_at: '2026-08-01T00:00:00Z'
  requestBodies:
    InspectEmailVerification:
      required: true
      description: Supplies the email-verification token from the link fragment; it is read, not consumed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountTokenInspectionRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    InspectEmailChangeUndo:
      required: true
      description: Supplies the undo token from the link fragment; it is read, not consumed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountTokenInspectionRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    UndoEmailChange:
      required: true
      description: Supplies the one-time undo token delivered to the previous email address.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailChangeUndoRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    CompleteEmailVerification:
      required: true
      description: Supplies the one-time email-verification token delivered through the configured mail channel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailVerificationCompletionRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  schemas:
    EmailVerificationCompletionRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    EmailChangeUndoRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    AccountTokenInspectionRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
    EmailVerificationInspectionResponse:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The address the token was issued for and would mark verified.
    EmailChangeUndoInspectionResponse:
      type: object
      additionalProperties: false
      required:
        - restored_email
        - masked_current_email
        - changed_at
      properties:
        restored_email:
          type: string
          format: email
          description: The previous address the undo would restore; the token was mailed to it.
        masked_current_email:
          type: string
          description: The account's current address, masked as in the email-change warning (first character, up to three asterisks, and the domain).
        changed_at:
          type: string
          format: date-time
          description: When the email change was applied.
