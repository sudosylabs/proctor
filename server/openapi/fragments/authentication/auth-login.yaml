paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create an interactive session
      tags:
        - Authentication
      description: >-
        Checks a local username or email address and password, then creates an interactive Session for the declared client type. Web and Desktop clients receive their credentials as host-only cookies, and the response body leaves out tokens. A CLI client receives the access and refresh tokens in the body. An account with two-step verification turned on must also send a current authenticator code or one unused recovery code. A failed sign-in does not say which value was wrong. Every attempt that passes the rate limit is recorded in the audit log, whether it succeeds or fails. If that audit record can't be written, the sign-in fails with audit.unavailable and no usable Session is issued. The request must use Content-Type application/json, optionally with charset=utf-8. A cross-origin browser request or a wrong media type returns request.invalid before the password is checked or any cookie is set. Native clients may omit browser origin headers.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/auth/login' \
              --header 'Content-Type: application/json' \
              --data '{"login_id":"ada@example.edu","password":"correct-horse-battery-staple-2026","client_type":"cli","device_name":"Exam workstation"}'
      x-proctor-auth: public
      x-proctor-error-codes:
        - authentication.mfa.enrollment_required
        - request.invalid
        - authentication.client_type.invalid
        - authentication.password.invalid
        - service.busy
        - authentication.credentials_invalid
        - authentication.mfa.required
        - authentication.mfa.code_invalid
        - authentication.mfa.unavailable
        - authentication.sessions.maximum_reached
        - authentication.desktop_authorization.account_session_locked
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.internal
        - audit.unavailable
        - authentication.external.invalid
        - authentication.session.invalid
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        "200":
          $ref: '#/components/responses/AuthenticationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
          example:
            login_id: ada@example.edu
            password: correct-horse-battery-staple-2026
            client_type: cli
            device_id: lab-3-workstation-12
            device_name: Exam workstation
      description: >-
        The username or email address, password and client type, with an optional device ID and name and an optional two-step verification code. These values are secrets: never log them.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login_id
        - password
        - client_type
      properties:
        login_id:
          type: string
          description: The username or email address of the local account. Case and surrounding spaces are ignored.
        password:
          type: string
          description: The account's local password. Treat it as a secret and keep it out of traces and logs.
        client_type:
          type: string
          enum:
            - desktop
            - cli
            - web
          description: The kind of client the new Session is for. It decides whether credentials come back as cookies (web, desktop) or in the body (cli).
        device_id:
          type: string
          description: An identifier the client chooses for its device and keeps the same across sign-ins, up to 128 bytes. It is shown in Session management.
        device_name:
          type: string
          description: A readable device name shown in Session management, up to 128 characters.
        mfa_code:
          type: string
          description: A current six-digit authenticator code, or one unused recovery code. Required when the account has two-step verification turned on.
