paths:
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password-reset message
      description: >-
        Emails a short-lived password-reset link to the address when it belongs to an active account that has a local password and local sign-in is allowed. The response is the same whether or not such an account exists, so it can't be used to discover accounts.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/RequestPasswordReset'
      responses:
        "202":
          $ref: '#/components/responses/SensitiveAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      summary: Consume a password-reset credential
      description: >-
        Uses up one valid reset token, sets the new password and signs out every Session of the account. The new password must meet the password rules. When the server keeps a password history, it must not match a recent password. A token that has expired, was already used or was replaced by a newer one is rejected without revealing anything about the account. The response also clears any browser authentication cookies.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - service.busy
        - request.invalid
        - authentication.password.invalid
        - authentication.password.pattern_invalid
        - authentication.password.common_invalid
        - authentication.password.identity_invalid
        - authentication.password.reused
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/CompletePasswordReset'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    RequestPasswordReset:
      required: true
      description: The email address to send the password-reset link to.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetRequest'
          example:
            email: student.one@example.edu
    CompletePasswordReset:
      required: true
      description: The one-time reset token and the new password. Both are secrets, so never log them.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetCompletionRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            password: correct-horse-battery-staple-2026
  schemas:
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The email address of the account whose password should be reset.
    PasswordResetCompletionRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: The reset token from the link in the password-reset email, as 43 URL-safe base64 characters.
        password:
          type: string
          description: The new local password. It must meet the password rules and must not contain the username, the part of the email address before the @, or the person's name. When the server keeps a password history, it must not match a recent password.
