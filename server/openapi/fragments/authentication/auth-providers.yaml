paths:
  /api/v1/auth/providers:
    get:
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listAuthenticationProviders
      summary: List external authentication providers selected by current Access Policy
      description: >-
        Lists the external sign-in providers that the current Access Policy allows, sorted by provider ID. Each entry has only what a sign-in page needs to show. Provider secrets, discovery settings and disabled providers are left out. The list can change at any time, so don't cache it as fixed.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - authentication.internal
        - request.invalid
      security: []
      x-proctor-idempotency: none
      responses:
        "200":
          $ref: '#/components/responses/ExternalAuthenticationProviderListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/providers/{provider_id}/login:
    parameters:
      - $ref: '#/components/parameters/ProviderID'
    get:
      operationId: beginExternalAuthentication
      summary: Begin external authentication
      description: >-
        Starts a short-lived sign-in with the chosen provider and redirects the browser to it. Proctor ties the sign-in to a one-time state value so the callback can only finish this attempt. It checks the return path and device details before issuing any redirect.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.external.request.invalid
        - authentication.external.provider_not_found
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.external.unavailable
        - authentication.external.rejected
        - authentication.internal
        - authentication.desktop_authorization.invalid
        - authentication.external.account_not_linked
        - authentication.token_invalid
      x-proctor-idempotency: none
      security: []
      parameters:
        - $ref: '#/components/parameters/ReturnTo'
        - $ref: '#/components/parameters/ClientType'
        - $ref: '#/components/parameters/DeviceID'
        - $ref: '#/components/parameters/DeviceName'
      responses:
        "303":
          $ref: '#/components/responses/ExternalAuthenticationRedirect'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/BadGateway'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: beginInvitationExternalAuthentication
      summary: Begin invitation-bound external authentication
      description: >-
        Starts an external sign-in tied to one Invitation claim. The identity that comes back from the provider can then accept only that Invitation, whose contents can't change. The claim is never put in the provider redirect or returned to another account. It works only when the provider requires an Invitation and Invitation sign-up is turned on for it.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.external.request.invalid
        - authentication.external.provider_not_found
        - authentication.external.account_not_linked
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.external.unavailable
        - authentication.external.rejected
        - authentication.internal
        - authentication.desktop_authorization.invalid
        - authentication.token_invalid
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/BeginInvitationExternalAuthentication'
      responses:
        "303":
          $ref: '#/components/responses/ExternalAuthenticationRedirect'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/BadGateway'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/providers/{provider_id}/callback:
    parameters:
      - $ref: '#/components/parameters/ProviderID'
    get:
      operationId: completeExternalAuthentication
      summary: Complete external authentication
      description: >-
        Checks the provider's callback and uses up the one-time sign-in state. It then creates or updates only the account link that this sign-in was started for, and redirects to the checked return path. Provider credentials are never exposed.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - authentication.mfa.enrollment_required
        - authentication.credentials_invalid
        - request.invalid
        - authentication.external.invalid
        - authentication.external.provider_not_found
        - authentication.external.rejected
        - authentication.external.unavailable
        - authentication.external.account_conflict
        - authentication.external.account_not_linked
        - authentication.method.disabled
        - authentication.method.last_usable
        - authentication.method.not_found
        - authentication.method.provider_conflict
        - authentication.method.conflict
        - authentication.method.unavailable
        - authentication.sessions.maximum_reached
        - authentication.desktop_authorization.account_session_locked
        - authentication.internal
        - audit.unavailable
      x-proctor-idempotency: none
      security: []
      responses:
        "303":
          $ref: '#/components/responses/ExternalAuthenticationRedirect'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/BadGateway'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    ReturnTo:
      name: return_to
      in: query
      required: false
      description: The path on this server to return to after the provider callback, such as /exams. It must start with a single slash and have no host or fragment. Other values are rejected. Defaults to /.
      schema:
        type: string
        maxLength: 2048
    ClientType:
      name: client_type
      in: query
      required: false
      description: The kind of client that receives the signed-in result. Only web is accepted. Desktop sign-in goes through Desktop authorization instead.
      schema:
        type: string
        enum:
          - web
        default: web
    DeviceID:
      name: device_id
      in: query
      required: false
      description: An identifier the client chooses for its device, up to 128 bytes. It is recorded on the new Session.
      schema:
        type: string
    DeviceName:
      name: device_name
      in: query
      required: false
      description: A readable device name, up to 128 characters, shown in Session management.
      schema:
        type: string
  requestBodies:
    BeginInvitationExternalAuthentication:
      required: true
      description: The one-time Invitation claim, the path to return to after sign-in and an optional device ID and name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalAuthenticationStartRequest'
          example:
            invitation_claim: q7Vt2mXb9KpL4wRz8NcY1dHs6FgJ0aEoUiTkBvM3xQe
            return_to: /invitations/complete
            device_id: exam-laptop-01
            device_name: Exam laptop
  responses:
    ExternalAuthenticationProviderListOK:
      description: External authentication provider collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExternalAuthenticationProviderListResponse'
          example:
            items:
              - id: campus-sso
                display_name: Campus single sign-on
                type: oidc
              - id: library-cas
                display_name: Library CAS
                type: cas
    ExternalAuthenticationRedirect:
      description: Browser redirect
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Location:
          description: Validated redirect URI
          schema:
            type: string
            format: uri-reference
  schemas:
    ExternalAuthenticationProviderListResponse:
      description: One page of the collection in its stable order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The providers on this page, sorted by provider ID.
          items:
            $ref: '#/components/schemas/ExternalAuthenticationProviderResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
          description: Pass this back as cursor to get the next page. Left out on the last page.
    ExternalAuthenticationStartRequest:
      type: object
      additionalProperties: false
      required:
        - invitation_claim
      properties:
        invitation_claim:
          type: string
          description: The one-time claim from the Invitation link, as 43 URL-safe base64 characters. Treat it as a secret.
          pattern: ^[A-Za-z0-9_-]{43}$
        return_to:
          type: string
          description: The path on this server to return to after sign-in. It must start with a single slash and have no host or fragment. Defaults to /.
          maxLength: 2048
        device_id:
          type: string
          description: An identifier the client chooses for its device, up to 128 bytes. It is recorded on the new Session.
        device_name:
          type: string
          description: A readable device name, up to 128 characters, shown in Session management.
