paths:
  /api/v1/auth/reauthenticate/password:
    post:
      operationId: reauthenticatePassword
      summary: Refresh the current Session's password proof
      description: >-
        Checks the current User's password again and records the time of this new proof on a Session that was signed in with a password. The Session keeps its ID, credentials and expiry times, and its original sign-in and two-step verification times stay as they were. A Session that was signed in through an external provider must reauthenticate with that provider instead. This call doesn't perform the sensitive action itself: the client sends that as its own request afterwards. The call is rate limited. A successful proof is saved together with its audit record, so neither is kept without the other.
      tags:
        - Authentication
      x-proctor-auth: mfa_recovery_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - service.busy
        - request.invalid
        - authentication.credentials_invalid
        - authentication.reauthentication_method_required
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.internal
        - audit.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/PasswordReauthentication'
      responses:
        "200":
          $ref: '#/components/responses/PasswordReauthenticationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/reauthenticate/external:
    post:
      operationId: beginExternalReauthentication
      summary: Refresh the current Session's original provider proof
      description: >-
        Starts a new sign-in with the provider that the current Web Session originally used. The callback is accepted only for the same User, external identity, Session and credential. For OIDC, Proctor sends max_age=0 and prompt=login and requires a new auth_time. For CAS, it sets renew on both sign-in and ticket validation. On success, the Session records the time of this new proof, and its original sign-in and two-step verification times stay as they were. The task picks one of a fixed set of hosted pages to return to. That page still asks for the sensitive action as a separate request.
      tags: [Authentication]
      x-proctor-auth: mfa_recovery_session_required
      x-proctor-error-codes:
        - request.invalid
        - authentication.reauthentication_method_required
        - authentication.external.request.invalid
        - authentication.external.provider_not_found
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.external.unavailable
        - authentication.external.rejected
        - authentication.internal
        - audit.unavailable
        - authentication.desktop_authorization.invalid
        - authentication.external.account_not_linked
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/ExternalReauthentication'
      responses:
        "200":
          $ref: '#/components/responses/ExternalReauthenticationStarted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/BadGateway'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    PasswordReauthentication:
      description: The current User's password. It proves the person is still present on a Session that was signed in with a password, before the pending sensitive task continues.
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PasswordReauthenticationRequest'}
          example: {password: correct-horse-battery-staple-2026}
    ExternalReauthentication:
      description: Which hosted page to return to after signing in again with the current Session's original provider. The sensitive action itself is still a separate request.
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ExternalReauthenticationRequest'}
          example: {task: security}
  responses:
    PasswordReauthenticationOK:
      description: The existing Session after successful fresh proof.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SessionResponse'}
          example:
            id: 14j8umgczgrdp95w77zuxmxfu9
            created_at: '2026-08-01T08:00:00Z'
            updated_at: '2026-08-01T09:12:05Z'
            user_id: wj3drgzdpnf54rxf5d8qd3dqne
            client_type: web
            device_name: Chrome on macOS
            authentication_method: password
            authentication_strength: multi_factor
            mfa_recovery_required: false
            mfa_enrollment_required: false
            authenticated_at: '2026-08-01T08:00:00Z'
            reauthenticated_at: '2026-08-01T09:12:05Z'
            mfa_completed_at: '2026-08-01T08:00:20Z'
            last_activity_at: '2026-08-01T09:12:05Z'
            idle_expires_at: '2026-08-08T09:12:05Z'
            expires_at: '2026-08-31T08:00:00Z'
    ExternalReauthenticationStarted:
      description: The provider address to send the browser to. The response also sets a short-lived HttpOnly cookie that ties the sign-in to this browser.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ExternalReauthenticationResponse'}
          example:
            redirect_url: 'https://sso.example.edu/authorize?client_id=proctor&max_age=0&prompt=login&response_type=code&state=Jd3kQ9vLr2XwT7bNc5ZpYh8sMfA1gUeK0oRiVtEyWqC'
  schemas:
    ExternalReauthenticationRequest:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task:
          type: string
          description: >-
            The hosted page to return to: security for the account security page, or connect-provider to finish connecting another sign-in provider. connect-provider is refused while the Session must first recover two-step verification.
          enum: [security, connect-provider]
    ExternalReauthenticationResponse:
      type: object
      additionalProperties: false
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri
          description: The provider's sign-in address. Send the browser there to sign in again.
    PasswordReauthenticationRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: The current User's password. Never log or store it.
