paths:
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh credentials
      description: >-
        Replaces the current Session's refresh credential with a new one in a single step and returns a new access and refresh token pair. If the request used the refresh cookie, the new credentials are set as cookies and the body leaves out tokens. A Desktop refresh credential must use the DPoP authorization scheme with a new proof signed by the Desktop's registered key and carrying the server's current nonce. Each refresh credential works once. Sending a used one again is treated as a replay and revokes the Session it belongs to.
      x-codeSamples:
        - lang: Shell
          label: Rotate a native-client refresh token
          source: |-
            curl --request POST \
              --header "Authorization: DPoP $PROCTOR_REFRESH_TOKEN" \
              --header "DPoP: $PROCTOR_DPOP_PROOF" \
              https://proctor.example.edu/api/v1/auth/refresh
      tags:
        - Authentication
      x-proctor-auth: refresh_credential_required
      x-proctor-error-codes:
        - authentication.mfa.enrollment_required
        - authentication.token_invalid
        - authentication.internal
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.required
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - refreshBearerAuth: []
        - refreshDPoPAuth: []
        - refreshCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/AuthenticationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
