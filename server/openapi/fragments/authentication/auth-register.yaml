paths:
  /api/v1/auth/register:
    post:
      operationId: registerLocalUser
      summary: Register one unverified local account when current policy permits
      description: >-
        Creates one local account with an unverified email address, but only when the current Access Policy allows public registration and local sign-in. The first and last names are what the person says they are called. They are shown on the profile and do not prove identity. Registering does not make the account a member of any Institution or grant it any access. Proctor emails a verification link to the address. The response returns no credentials.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - service.busy
        - request.invalid
        - authentication.password.invalid
        - authentication.password.pattern_invalid
        - authentication.password.common_invalid
        - authentication.password.identity_invalid
        - authentication.registration.invalid
        - authentication.registration.invitation_required
        - authentication.registration.unavailable
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PublicRegistration'
      responses:
        "202":
          $ref: '#/components/responses/SensitiveAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    PublicRegistration:
      required: true
      description: The new account's first and last names, a username no other account uses, an email address and a local password that meets the password rules. Public registration does not accept a display name.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicRegistrationRequest'
          example:
            first_name: Ada
            last_name: Okafor
            username: student.one
            email: student.one@example.edu
            password: correct-horse-battery-staple-2026
  schemas:
    PublicRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
        - username
        - email
        - password
      properties:
        first_name:
          type: string
          description: The person's first name, shown on the profile. Surrounding spaces are removed, and it can't be blank.
          minLength: 1
          maxLength: 64
        last_name:
          type: string
          description: The person's last name, shown on the profile. Surrounding spaces are removed, and it can't be blank.
          minLength: 1
          maxLength: 64
        username:
          type: string
          description: The sign-in name for the new account. No other account may already use it.
          minLength: 1
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 254
          description: The account email address. It is stored in lower case, and the verification link is sent to it.
        password:
          type: string
          description: The new local password. It must meet the password rules and must not contain the username, the part of the email address before the @, or the person's name.
