paths:
  /api/v1/authentication-methods/providers/{provider_id}/connect:
    parameters:
      - $ref: '#/components/parameters/ProviderID'
    post:
      operationId: beginProviderConnection
      summary: Begin a proof-bound provider connection for the exact current User
      description: >-
        Starts a short-lived connection to an external provider for the current User and returns the address to send the browser to. The interactive Session must have passed two-step verification and must have signed in or reauthenticated recently. When the provider sign-in finishes, the identity can be linked only to this User.
      tags:
        - Authentication
      x-proctor-auth: strong_recent_session_required
      x-proctor-error-codes:
        - request.invalid
        - authentication.external.provider_not_found
        - authentication.external.unavailable
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.internal
        - audit.unavailable
        - authentication.desktop_authorization.invalid
        - authentication.external.account_not_linked
        - authentication.external.rejected
        - authentication.external.request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/BeginProviderConnection'
      responses:
        "201":
          $ref: '#/components/responses/ProviderConnectionCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/BadGateway'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    BeginProviderConnection:
      required: true
      description: The path on this server to return to after the provider connection finishes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BeginProviderConnectionRequest'
          example:
            return_to: /settings/authentication
  responses:
    ProviderConnectionCreated:
      description: The provider connection was started
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderConnectionResponse'
          example:
            redirect_url: 'https://sso.example.edu/authorize?client_id=proctor&response_type=code&scope=openid&state=Bq7wN2cXk9LmRv4tKz6YhDs1FgJ8aEoU3iTpBvM5xWe'
            expires_at: '2026-08-01T09:20:00Z'
  schemas:
    BeginProviderConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        return_to:
          type: string
          description: The path on this server to return to, such as /settings/authentication. It must start with a single slash and have no host or fragment. Defaults to /.
          maxLength: 2048
    ProviderConnectionResponse:
      type: object
      additionalProperties: false
      required:
        - redirect_url
        - expires_at
      properties:
        redirect_url:
          type: string
          format: uri
          description: The provider's sign-in address. Send the browser there to connect the identity.
        expires_at:
          type: string
          format: date-time
          description: When this connection attempt expires. Finish the provider sign-in before then.
