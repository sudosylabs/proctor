paths:
  /api/v1/authentication-methods:
    get:
      operationId: listAuthenticationMethods
      summary: List the current User's authentication methods without credential material
      description: >-
        Returns whether the current User has a local password, and the name and type of each linked external identity. Password hashes, provider subject IDs, tokens and other credentials are never returned.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AuthenticationMethodListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/authentication-methods/password:
    put:
      operationId: enrollPassword
      summary: Enroll a policy-permitted local password after strong recent authentication
      description: >-
        Adds a local password to the current User. This works only when the Access Policy allows local passwords and the interactive Session has passed two-step verification and has signed in or reauthenticated recently. Proctor stores only a hash of the password and never returns it.
      tags:
        - Authentication
      x-proctor-auth: strong_recent_session_required
      x-proctor-error-codes:
        - service.busy
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - authentication.password.invalid
        - authentication.password.pattern_invalid
        - authentication.password.common_invalid
        - authentication.password.identity_invalid
        - authentication.password.reused
        - authentication.method.disabled
        - authentication.method.conflict
        - authentication.method.unavailable
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/EnrollPassword'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: removePassword
      summary: Remove the current User's local password while preserving another usable method
      description: >-
        Removes the current User's local password. The interactive Session must have passed two-step verification and must have signed in or reauthenticated recently. If removing it would leave the User no way to sign in, the request is refused and nothing changes. On success, every Session that was signed in with the password is revoked and outstanding password-reset links stop working.
      x-codeSamples:
        - lang: Shell
          label: Remove the local password
          source: |-
            curl --request DELETE \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/authentication-methods/password
      tags:
        - Authentication
      x-proctor-auth: strong_recent_session_required
      x-proctor-error-codes:
        - authentication.method.last_usable
        - authentication.method.not_found
        - authentication.method.conflict
        - authentication.method.unavailable
        - audit.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/authentication-methods/password/change:
    post:
      operationId: changePassword
      summary: Replace the current User's local password after strong recent authentication
      description: >-
        Replaces the current User's local password. This works only when the Access Policy allows local sign-in and the interactive Session has passed two-step verification and has signed in or reauthenticated recently. The new password must meet the password rules. It must fit the configured length limits and must not be a common password or a simple pattern. It must not contain the username, the part of the email address before the @, or the person's name, and it must not match one of the account's recent passwords. The calling Session stays signed in. Every other Session of the User is revoked, outstanding password-reset links stop working, and the account's email address receives a password-changed notice.
      x-codeSamples:
        - lang: Shell
          label: Change the local password
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"password":"lantern-orchard-copper-tide"}' \
              https://proctor.example.edu/api/v1/authentication-methods/password/change
      tags:
        - Authentication
      x-proctor-auth: strong_recent_session_required
      x-proctor-error-codes:
        - service.busy
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - authentication.password.invalid
        - authentication.password.pattern_invalid
        - authentication.password.common_invalid
        - authentication.password.identity_invalid
        - authentication.password.reused
        - authentication.method.not_found
        - authentication.method.disabled
        - authentication.method.conflict
        - authentication.method.unavailable
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/ChangePassword'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/authentication-methods/providers/{external_identity_id}:
    parameters:
      - name: external_identity_id
        in: path
        required: true
        description: The ID of the linked external identity to remove, as listed in providers[].id. It is not the provider's subject ID or any credential.
        schema:
          $ref: '#/components/schemas/ID'
    delete:
      operationId: unlinkExternalIdentity
      summary: Unlink one exact provider identity while preserving another usable method
      description: >-
        Unlinks one of the current User's external identities. The interactive Session must have passed two-step verification and must have signed in or reauthenticated recently. If this identity is the User's last way to sign in, the request is refused and nothing changes. On success, every Session that was signed in through this identity is revoked.
      x-codeSamples:
        - lang: Shell
          label: Unlink an external identity
          source: |-
            curl --request DELETE \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/authentication-methods/providers/ybndrfg8ejkmcpqxot1uwisza3
      tags:
        - Authentication
      x-proctor-auth: strong_recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - authentication.method.last_usable
        - authentication.method.not_found
        - authentication.method.conflict
        - authentication.method.unavailable
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EnrollPassword:
      required: true
      description: The local password to add. It must meet the password rules. Keep it out of logs, traces and analytics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnrollPasswordRequest'
          example:
            password: correct-horse-battery-staple-2026
    ChangePassword:
      required: true
      description: The new local password. It must meet the password rules. Keep it out of logs, traces and analytics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangePasswordRequest'
          example:
            password: lantern-orchard-copper-tide
  responses:
    AuthenticationMethodListOK:
      description: The current User's sign-in methods, without provider subject IDs or credentials
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationMethodResponse'
          example:
            password: true
            providers:
              - id: 889766ufjgio6kbpzjbufozksq
                provider_id: campus-sso
                display_name: Campus single sign-on
                type: oidc
  schemas:
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          description: "The new local password. It must meet the password rules and must not contain the username, the part of the email address before the @, or the person's name. When the server keeps a password history, it must not match a recent password."
    EnrollPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          description: "The local password to add. It must meet the password rules and must not contain the username, the part of the email address before the @, or the person's name."
    AuthenticationProviderMethodResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - provider_id
        - display_name
        - type
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of this linked external identity. Use it to unlink the identity.
        provider_id:
          type: string
          description: The ID of the configured provider this identity signs in through.
          pattern: ^[a-z0-9][a-z0-9._-]{0,63}$
        display_name:
          type: string
          description: The provider's display name.
        type:
          type: string
          description: The provider's protocol, such as oidc or cas.
    AuthenticationMethodResponse:
      type: object
      additionalProperties: false
      required:
        - password
        - providers
      properties:
        password:
          type: boolean
          description: Whether the User has a local password.
        providers:
          type: array
          description: The external identities linked to the User.
          maxItems: 64
          items:
            $ref: '#/components/schemas/AuthenticationProviderMethodResponse'
