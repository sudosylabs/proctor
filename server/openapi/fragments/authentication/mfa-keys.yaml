paths:
  /api/v1/mfa/keys:
    get:
      operationId: inspectMFAKeyState
      summary: Inspect the MFA key ring and the live secrets each key seals
      tags:
        - Authentication
      description: >-
        Returns the ID of the primary key this server node uses to encrypt new authenticator secrets, and the primary key the last rekey made required on every node. For each encryption key still in use, it also returns how many live authenticator secrets it encrypts and whether this node has the key configured. Use it to plan a key rotation, and to confirm that a key you are retiring encrypts nothing before you remove it from configuration. Key IDs are not secret. No key bytes, encrypted data or account details are returned.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.mfa.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MFAKeyStateOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mfa/rekey:
    post:
      operationId: startMFARekey
      summary: Start a durable fenced rotation of the MFA secret key
      tags:
        - Authentication
      description: >-
        Makes this node's configured primary key the required primary key for every node, then starts one background Job. The Job re-encrypts every live authenticator secret that uses another key with the primary key, one at a time. Each secret is replaced only if it still uses the key the Job read, so a change made in the meantime is never overwritten. The Job saves its place as it goes and picks up from there after a crash or after it loses its lease. A rekey is refused while another one is queued or running. The required primary key can change to a different key only after the previous rekey proved that no live secret still needs another key. From the moment it starts, every node must encrypt new secrets with the required primary key.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - authentication.mfa.rekey.invalid
        - authentication.mfa.rekey.conflict
        - authentication.mfa.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/StartMFARekey'
      responses:
        "202":
          $ref: '#/components/responses/MFARekeyAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mfa/rekey/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: The ID of the MFA rekey Job to read.
    get:
      operationId: getMFARekeyStatus
      summary: Inspect safe progress and final retirement proof for one MFA rekey Job
      tags:
        - Authentication
      description: >-
        Returns the progress of one MFA rekey Job. After the Job succeeds, it also returns the counts of live secrets that prove the retiring key encrypts nothing and can be removed from configuration. The ID of a Job of any other type returns not found. No secrets, encrypted data, account details, key bytes or worker diagnostics are returned.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - authentication.mfa.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MFARekeyStatusOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    StartMFARekey:
      description: The configured key, other than the primary key, that this rotation retires.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFARekeyRequest'
          example:
            retiring_key_id: "0123456789abcdef0123456789abcdef"
  responses:
    MFAKeyStateOK:
      description: The MFA key IDs, the required primary key and how many live secrets each key encrypts
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFAKeyStateResponse'
          example:
            primary_key_id: 3f9a1c0e7b2d4f6a8c5e0b1d2a3f4e5c
            required_primary_key_id: 3f9a1c0e7b2d4f6a8c5e0b1d2a3f4e5c
            active:
              - key_id: 0123456789abcdef0123456789abcdef
                credentials: 12
                configured: true
              - key_id: 3f9a1c0e7b2d4f6a8c5e0b1d2a3f4e5c
                credentials: 1488
                configured: true
    MFARekeyAccepted:
      description: The MFA key rotation was accepted and its Job is queued
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFARekeyResponse'
          example:
            job_id: sjebyge5cpbop1xwo4eds74ejb
            primary_key_id: 3f9a1c0e7b2d4f6a8c5e0b1d2a3f4e5c
            retiring_key_id: 0123456789abcdef0123456789abcdef
            created_at: '2026-08-01T10:00:00Z'
    MFARekeyStatusOK:
      description: The rekey Job's progress and, once it succeeds, the proof that the retiring key can be removed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFARekeyStatusResponse'
          example:
            job_id: sjebyge5cpbop1xwo4eds74ejb
            status: succeeded
            primary_key_id: 3f9a1c0e7b2d4f6a8c5e0b1d2a3f4e5c
            retiring_key_id: 0123456789abcdef0123456789abcdef
            created_at: '2026-08-01T10:00:00Z'
            updated_at: '2026-08-01T10:02:41Z'
            completed_at: '2026-08-01T10:02:41Z'
            attempt_count: 1
            maximum_attempts: 5
            processed: 12
            resealed: 12
            progress:
              current: 12
              total: 12
              stage: resealing
            proof:
              non_primary_references: 0
              retiring_references: 0
              retirement_safe: true
  schemas:
    MFASecretKeyUsage:
      description: How many live authenticator secrets one MFA key encrypts.
      type: object
      additionalProperties: false
      required:
        - key_id
        - credentials
        - configured
      properties:
        key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: The key's ID, 128 bits written as 32 lowercase hexadecimal characters. It is not secret.
        credentials:
          type: integer
          format: int64
          minimum: 1
          description: How many live authenticator secrets this key encrypts.
        configured:
          type: boolean
          description: Whether this server node has the key in its MFA key configuration.
    MFAKeyStateResponse:
      description: The MFA key IDs, the required primary key and how many live secrets each key encrypts.
      type: object
      additionalProperties: false
      required:
        - primary_key_id
        - active
      properties:
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: The ID of the key this node uses to encrypt new authenticator secrets.
        required_primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: The primary key the last rekey made required. Every node must encrypt new secrets with it. Left out before the first rekey.
        active_rekey_job_id:
          $ref: '#/components/schemas/ID'
          description: The ID of the MFA rekey Job that is queued or running. Left out when there is none.
        active:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/MFASecretKeyUsage'
          description: The keys that encrypt at least one live authenticator secret, sorted by key ID.
    MFARekeyRequest:
      description: Which key a new MFA key rotation Job retires.
      type: object
      additionalProperties: false
      required:
        - retiring_key_id
      properties:
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: The ID of the configured MFA key to retire. It must not be the primary key.
    MFARekeyResponse:
      description: The Job and keys of an accepted MFA key rotation.
      type: object
      additionalProperties: false
      required:
        - job_id
        - primary_key_id
        - retiring_key_id
        - created_at
      properties:
        job_id:
          $ref: '#/components/schemas/ID'
          description: The ID of the rekey Job. Use it to follow progress.
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: The ID of the key that secrets are re-encrypted with.
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: The ID of the key being retired.
        created_at:
          type: string
          format: date-time
          description: When the rekey Job was created.
    MFARekeyProgress:
      description: Rough progress while live authenticator secrets are re-encrypted.
      type: object
      additionalProperties: false
      required:
        - current
        - total
        - stage
      properties:
        current:
          type: integer
          format: int64
          minimum: 0
          description: How many secrets the Job has checked so far.
        total:
          type: integer
          format: int64
          minimum: 1
          description: How many secrets the Job expects to check in total.
        stage:
          type: string
          description: The step the Job is on. resealing means it is re-encrypting secrets.
          enum:
            - resealing
    MFARekeyProof:
      description: The final counts of live secrets that show whether the retiring key can be removed.
      type: object
      additionalProperties: false
      required:
        - non_primary_references
        - retiring_references
        - retirement_safe
      properties:
        non_primary_references:
          type: integer
          format: int64
          minimum: 0
          description: How many live authenticator secrets still use any key other than the primary key after the Job finished.
        retiring_references:
          type: integer
          format: int64
          minimum: 0
          description: How many live authenticator secrets still use the retiring key.
        retirement_safe:
          type: boolean
          description: True only when the final counts prove that the retiring key can be removed.
    MFARekeyStatusResponse:
      description: The rekey Job's status, its progress and, once it succeeds, the key retirement proof.
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
        - primary_key_id
        - retiring_key_id
        - created_at
        - updated_at
        - attempt_count
        - maximum_attempts
        - processed
        - resealed
      properties:
        job_id:
          $ref: '#/components/schemas/ID'
          description: The ID of the rekey Job.
        status:
          $ref: '#/components/schemas/JobStatus'
          description: The Job's current state.
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: The ID of the key that secrets are re-encrypted with.
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: The ID of the key being retired.
        created_at:
          type: string
          format: date-time
          description: When the Job was created.
        updated_at:
          type: string
          format: date-time
          description: When the Job last changed.
        completed_at:
          type: string
          format: date-time
          description: When the Job finished. Left out while it is still queued or running.
        public_error_code:
          type: string
          maxLength: 128
          description: A code saying why the Job's last run failed, such as mfa.rekey.incomplete. Left out when there is no failure to report.
        attempt_count:
          type: integer
          minimum: 0
          description: How many times the Job has started running.
        maximum_attempts:
          type: integer
          minimum: 1
          description: How many times the Job may run before it gives up.
        processed:
          type: integer
          format: int64
          minimum: 0
          description: How many secrets the Job has checked so far.
        resealed:
          type: integer
          format: int64
          minimum: 0
          description: How many of the checked secrets the Job re-encrypted. A secret that changed while the Job was working is counted as checked but not re-encrypted.
        progress:
          $ref: '#/components/schemas/MFARekeyProgress'
          description: The progress the Job last saved. Left out until the Job has saved progress.
        proof:
          $ref: '#/components/schemas/MFARekeyProof'
          description: The key retirement proof. Present only after the Job succeeds.
