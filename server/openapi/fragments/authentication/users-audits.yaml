paths:
  /api/v1/users/me/audits:
    get:
      operationId: listCurrentUserAuditEvents
      summary: List the current User's own account history
      description: >-
        Returns one page of the current Session User's own account history, newest first unless `order=asc`
        asks for oldest first. The first page, read without a cursor, also carries `total`: the number of events
        the filters match across every page, exact below 10,000 and reported as 10,000 with
        `total_is_lower_bound` at that bound. Later pages carry no total; keep the first page's. Reading the
        first page oldest first reaches the end of the history without counting pages. The history holds
        events about the User's account, whoever performed them, and account-relevant events the User performed
        on anything else. Each item carries a stable `event` name from a closed catalogue, which clients label
        themselves; rows outside the catalogue and unfinished attempts are never returned. Another person is
        never named: the actor is only `self`, `administrator`, or `system`, and the IP address and user agent
        appear only on the User's own actions. A resource identity appears only when the resource is the User,
        the Institution, or an Academic Unit or Class the User has or had a membership or Role Binding at.
        Each item also carries a `summary` sentence in the language `Accept-Language` selects, falling back to
        the installation language and then English. It keeps the same mask: the actor is "you", "an
        administrator", or "the system", and no other person is ever named. It names an Academic Unit or Class
        only where the resource identity appears, and a Role only when the event bound it to the User; otherwise
        it uses a generic noun such as "a class".
        Personal Access Tokens cannot read this history. Reading it records no authorization decision.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - audit.query.invalid
        - audit.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: created_after
          in: query
          required: false
          description: Return only events recorded at or after this RFC 3339 instant.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Return only events recorded before this RFC 3339 instant; it must be later than `created_after`.
          schema:
            type: string
            format: date-time
        - name: event
          in: query
          required: false
          description: Return only these events. Repeat the parameter to select several; omit it for all.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 64
            items:
              $ref: '#/components/schemas/SelfAuditEvent'
        - name: status
          in: query
          required: false
          description: Return only events with this outcome.
          schema:
            type: string
            enum:
              - success
              - fail
        - name: relation
          in: query
          required: false
          description: >-
            Return only events about the User's account (`subject`) or only events the User performed on
            anything else (`actor`). Omit it for both.
          schema:
            type: string
            enum:
              - subject
              - actor
        - name: order
          in: query
          required: false
          description: >-
            Read newest first (`desc`, the default) or oldest first (`asc`). A cursor continues only the order
            that produced it.
          schema:
            type: string
            enum:
              - desc
              - asc
      responses:
        "200":
          $ref: '#/components/responses/SelfAuditListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    SelfAuditListOK:
      description: One page of the current User's own account history.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SelfAuditListResponse'
          example:
            items:
              - id: ybndrfg8ejkmcpqxot1uwisza3
                created_at: '2026-08-01T09:30:00Z'
                event: password.changed
                status: success
                relation: subject
                actor:
                  kind: self
                resource:
                  type: user
                  id: ybndrfg8ejkmcpqxot1uwisza4
                client_type: web
                ip_address: 192.0.2.10
                user_agent: Mozilla/5.0
                summary: You changed your password
              - id: ybndrfg8ejkmcpqxot1uwisza5
                created_at: '2026-07-30T14:05:00Z'
                event: mfa.reset_by_administrator
                status: success
                relation: subject
                actor:
                  kind: administrator
                resource:
                  type: user
                  id: ybndrfg8ejkmcpqxot1uwisza4
                client_type: web
                summary: An administrator reset two-step verification for your account
            next_cursor: eyJjcmVhdGVkX2F0IjoiMjAyNi0wNy0zMFQxNDowNTowMFoifQ
            total: 248
            total_is_lower_bound: false
  schemas:
    SelfAuditEvent:
      description: >-
        Stable name of one account-relevant event. The catalogue is closed and may grow; clients own the
        labels and should present an unknown name generically.
      type: string
      enum:
        - academic_unit.joined
        - academic_unit.left
        - account.disabled
        - account.enabled
        - account.recovered_by_administrator
        - affiliation.ended
        - affiliation.started
        - class.enrolled
        - class.transferred_in
        - class.transferred_out
        - class.unenrolled
        - desktop.registration_renamed
        - desktop.registration_revoked
        - desktop.signed_in
        - email.change_undone
        - email.changed
        - email.verified
        - invitation.accepted
        - mfa.disabled
        - mfa.enabled
        - mfa.recovery_codes_regenerated
        - mfa.reset_by_administrator
        - mfa.setup_started
        - password.changed
        - password.enrolled
        - password.removed
        - password.reset
        - personal_access_token.created
        - personal_access_token.disabled
        - personal_access_token.enabled
        - personal_access_token.revoked
        - profile.changed
        - profile_picture.changed
        - profile_picture.removed
        - provider.unlinked
        - role.ended
        - role.granted
        - session.renamed
        - session.revoked
        - sessions.revoked_all
        - sessions.revoked_others
        - sign_in.failed
        - sign_in.succeeded
        - sign_out
    SelfAuditEventResponse:
      description: One event in the current User's own account history.
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - event
        - status
        - relation
        - actor
        - resource
        - summary
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: Time the event began.
        event:
          type: string
          anyOf:
            - $ref: '#/components/schemas/SelfAuditEvent'
            - type: string
        status:
          type: string
          enum:
            - success
            - fail
          description: Outcome of the event.
        relation:
          type: string
          enum:
            - subject
            - actor
          description: >-
            `subject` when the event is about the User's account; `actor` when the User performed it on
            anything else.
        actor:
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - self
                - administrator
                - system
              description: >-
                Who performed the event: the User, another person with authority over the account, or work
                with no signed-in actor such as a background Job, offline recovery, or an emailed link.
        resource:
          type: object
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              description: Stable type of the resource the event was recorded against.
            id:
              $ref: '#/components/schemas/ID'
        error_code:
          type: string
          maxLength: 128
          description: Stable safe failure category of a failed event.
        client_type:
          type: string
          maxLength: 32
          description: Kind of client the event came from, when recorded.
        ip_address:
          type: string
          maxLength: 64
          description: Network address of the User's own action; omitted for anyone else's.
        user_agent:
          type: string
          maxLength: 512
          description: User agent of the User's own action; omitted for anyone else's.
        summary:
          type: string
          maxLength: 2048
          description: >-
            One sentence describing the event in the negotiated language, for display only; clients that need to
            reason about the event read its codes. It never names another person, and a failed event says so.
    SelfAuditListResponse:
      description: One bounded page of the current User's own account history.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SelfAuditEventResponse'
        next_cursor:
          type: string
          maxLength: 2048
          description: Opaque continuation for the next page, omitted after the final page.
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Events matching the filters across every page, present only on the first page. At 10,000 counting
            stops and `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached the 10,000 bound and the history may be longer. Present with `total`.
