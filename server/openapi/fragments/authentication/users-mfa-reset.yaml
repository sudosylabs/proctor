paths:
  /api/v1/users/{user_id}/mfa/reset:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      operationId: resetUserMFA
      summary: Reset another User's local MFA after institution verification
      description: >-
        Resets another User's two-step verification after the Institution has checked who they are. The caller needs the protected system-administrator action user.mfa.reset and an interactive Session that has passed two-step verification and has signed in or reauthenticated recently. An administrator can't reset their own two-step verification. The Institution checks the person's identity outside Proctor and records a short reference to that check here. In one step, Proctor cancels the User's old authenticator and recovery codes, revokes all their Sessions and Personal Access Tokens, and cancels unfinished access grants. The audit record and the security notice email are saved in the same step, and the reset fails if either can't be. When the User next signs in with their password or provider, they get a limited Web Session. Normal access returns once they set up a new authenticator app. Their linked provider identities and password stay as they were. The request fails when authenticator setup is not available, or when it would leave no administrator able to sign in. Each new reset starts a new recovery round.
      tags: [Authentication]
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - authentication.mfa.reset_invalid
        - authentication.mfa.disabled
        - authentication.mfa.not_found
        - authentication.mfa.conflict
        - authentication.mfa.unavailable
        - authentication.internal
        - authentication.session_required
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/ResetUserMFA'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "501":
          $ref: '#/components/responses/NotImplemented'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ResetUserMFA:
      description: The administrator's confirmation that the User's identity was checked, a short reason for the reset and a reference to the Institution's record of that check.
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ResetUserMFARequest'}
          example:
            identity_verified: true
            reason: Authenticator is no longer available.
            verification_reference: case-2026-0042
  schemas:
    ResetUserMFARequest:
      type: object
      additionalProperties: false
      required: [identity_verified, reason, verification_reference]
      properties:
        identity_verified:
          type: boolean
          const: true
          description: Confirms that the Institution has finished checking the User's identity. Must be true.
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: Why the reset is needed, in up to 512 characters. Don't include passwords, secrets, recovery codes or identity documents.
        verification_reference:
          type: string
          minLength: 1
          maxLength: 128
          description: A reference to the Institution's record of the identity check, such as a case number. Don't include the evidence itself.
