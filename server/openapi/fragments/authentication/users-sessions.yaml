                last_activity_at: '2026-08-12T14:30:00Z'
                idle_expires_at: '2026-08-19T14:30:00Z'
                expires_at: '2026-09-11T09:30:00Z'
              - id: g63dcrphk8idgyjgzbrpajosz6
                created_at: '2026-08-01T08:00:41Z'
                updated_at: '2026-08-05T16:20:00Z'
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                client_type: desktop
                desktop_registration_id: ih1r84kij94nrwis97rft6rduh
                desktop_release: 1.4.0
                desktop_build_id: darwin-arm64-1.4.0
                desktop_platform: darwin
                desktop_architecture: arm64
                desktop_realtime_protocol: 1
                device_id: lab-3-workstation-12
                device_name: Exam laptop
                authentication_method: password
                authentication_strength: multi_factor
