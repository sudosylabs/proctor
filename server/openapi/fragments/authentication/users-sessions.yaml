                expires_at: '2026-09-11T09:30:00Z'
                current: true
              - id: g63dcrphk8idgyjgzbrpajosz6
                created_at: '2026-08-01T08:00:41Z'
                updated_at: '2026-08-11T17:05:00Z'
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                client_type: desktop
                desktop_registration_id: ih1r84kij94nrwis97rft6rduh
                desktop_release: 1.4.0
                desktop_build_id: darwin-arm64-1.4.0
                desktop_platform: darwin
                desktop_architecture: arm64
                desktop_realtime_protocol: 1
                device_id: lab-3-workstation-12
                device_name: Exam laptop
                desktop_registration_display_name: Library laptop
                authentication_method: password
                authentication_strength: multi_factor
                mfa_recovery_required: false
                mfa_enrollment_required: false
                authenticated_at: '2026-08-01T08:00:30Z'
                mfa_completed_at: '2026-08-01T08:00:30Z'
                last_activity_at: '2026-08-11T17:05:00Z'
                idle_expires_at: '2026-08-18T17:05:00Z'
                expires_at: '2026-08-31T08:00:41Z'
                current: false
  schemas:
    SessionAdministrationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - user_id
        - client_type
        - authentication_method
        - authentication_strength
        - mfa_recovery_required
        - mfa_enrollment_required
        - authenticated_at
        - last_activity_at
        - idle_expires_at
        - expires_at
      properties:
        id:
          description: "The Session ID."
          $ref: '#/components/schemas/ID'
        created_at:
          description: "When the Session was created."
          type: string
          format: date-time
        updated_at:
          description: "When the Session record last changed."
          type: string
          format: date-time
        archived_at:
          description: "When the Session record was archived. Left out when it has not been archived."
          type: string
          format: date-time
        user_id:
          description: "The ID of the User the Session belongs to."
          $ref: '#/components/schemas/ID'
        client_type:
          description: "The kind of client the Session was created for."
          type: string
        desktop_registration_id:
          description: "The ID of the Desktop Registration the Session is bound to. Present only for a desktop Session."
          $ref: '#/components/schemas/ID'
        desktop_release:
          description: "The Desktop release version recorded when the Session was created. Present only for a desktop Session."
          type: string
        desktop_build_id:
          description: "The Desktop build identifier recorded when the Session was created. Present only for a desktop Session."
          type: string
        desktop_platform:
          description: "The operating system the Desktop runs on. Present only for a desktop Session."
          type: string
          enum: [darwin, win32, linux]
        desktop_architecture:
          description: "The processor architecture the Desktop was built for. Present only for a desktop Session."
          type: string
          enum: [arm64, x64]
        desktop_realtime_protocol:
          description: "The realtime protocol version the Desktop speaks. Present only for a desktop Session."
          type: integer
          minimum: 1
        device_id:
          description: "The device identifier the client sent when it signed in. Left out when it sent none."
          type: string
        device_name:
          description: "The readable device name the client sent when it signed in. Left out when it sent none."
          type: string
        authentication_method:
          description: "How the Session was signed in: password for a local password, or the external provider's protocol, such as oidc or cas."
          type: string
        authentication_strength:
          description: "single_factor when the Session was signed in with one factor, or multi_factor when it also passed two-step verification."
          type: string
        authenticated_at:
          description: "When the Session was first signed in."
          type: string
          format: date-time
        mfa_recovery_required:
          type: boolean
          description: Whether this Session is limited, after an administrator reset two-step verification, until its User sets up a new authenticator app.
        mfa_enrollment_required:
          type: boolean
          description: >-
            Whether the Access Policy limits this Web Session until its User sets up or completes two-step verification. While it is true, the Session can only set up two-step verification, answer the two-step verification challenge, reauthenticate, read the security status and sign out.
        reauthenticated_at:
          type: string
          format: date-time
          description: When the User last proved who they are again on this Session, with the same method they signed in with. It does not change authenticated_at or mfa_completed_at. Left out when the Session has never reauthenticated.
        mfa_completed_at:
          description: "When the Session last passed two-step verification. Left out when it never has."
          type: string
          format: date-time
        last_activity_at:
          description: "When the Session was last used. Proctor records use at most once per activity update interval, so this can trail the latest request."
          type: string
          format: date-time
        idle_expires_at:
          description: "When the Session ends if it stays unused. Each recorded use of the Session moves this later."
          type: string
          format: date-time
        expires_at:
          description: "When the Session ends no matter how often it is used."
          type: string
          format: date-time
        revoked_at:
          description: "When the Session was revoked. Left out while it is still active."
          type: string
          format: date-time
        revocation_reason_code:
          description: "Why the Session was revoked. Present only when revoked_at is set."
          type: string
          anyOf:
            - $ref: '#/components/schemas/SessionRevocationReasonCode'
            - type: string
        revocation_reason:
          type: string
          description: A readable explanation of revocation_reason_code in the request's language. Present only when the Session was revoked.
    SessionAdministrationListResponse:
      description: One page of a User's Sessions, newest first.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          description: "The User's Sessions on this page, newest first."
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SessionAdministrationResponse'
        next_cursor:
          type: string
          description: Pass this back as cursor to get the next page. Treat it as a token and don't read or change it. Left out on the last page.
    CurrentUserSessionResponse:
      description: One of the current User's Sessions, marked when it is the Session that made the request.
      type: object
      additionalProperties: false
      required:
        - current
        - id
        - created_at
        - updated_at
        - user_id
        - client_type
        - authentication_method
        - authentication_strength
        - mfa_recovery_required
        - mfa_enrollment_required
        - authenticated_at
        - last_activity_at
        - idle_expires_at
        - expires_at
      properties:
        id:
          description: "The Session ID."
          $ref: '#/components/schemas/ID'
        created_at:
          description: "When the Session was created."
          type: string
          format: date-time
        updated_at:
          description: "When the Session record last changed."
          type: string
          format: date-time
        archived_at:
          description: "When the Session record was archived. Left out when it has not been archived."
          type: string
          format: date-time
        user_id:
          description: "The ID of the User the Session belongs to."
          $ref: '#/components/schemas/ID'
        client_type:
          description: "The kind of client the Session was created for."
          type: string
          enum:
            - desktop
            - cli
            - web
        desktop_registration_id:
          description: "The ID of the Desktop Registration the Session is bound to. Present only for a desktop Session."
          $ref: '#/components/schemas/ID'
        desktop_release:
          description: "The Desktop release version recorded when the Session was created. Present only for a desktop Session."
          type: string
        desktop_build_id:
          description: "The Desktop build identifier recorded when the Session was created. Present only for a desktop Session."
          type: string
        desktop_platform:
          description: "The operating system the Desktop runs on. Present only for a desktop Session."
          type: string
          enum: [darwin, win32, linux]
        desktop_architecture:
          description: "The processor architecture the Desktop was built for. Present only for a desktop Session."
          type: string
          enum: [arm64, x64]
        desktop_realtime_protocol:
          description: "The realtime protocol version the Desktop speaks. Present only for a desktop Session."
          type: integer
          minimum: 1
        device_id:
          description: "The device identifier the client sent when it signed in. Left out when it sent none."
          type: string
        device_name:
          type: string
          description: For a browser or CLI Session, the name the client reported at sign-in or the User later chose. A Desktop Session's name is desktop_registration_display_name.
        desktop_registration_display_name:
          type: string
          maxLength: 128
          description: >-
            Present only for a Desktop Session: the name of the Desktop Registration it is bound to, which is the name the User gives that device through renameDesktopRegistration.
        authentication_method:
          description: "How the Session was signed in: password for a local password, or the external provider's protocol, such as oidc or cas."
          type: string
        authentication_strength:
          description: "single_factor when the Session was signed in with one factor, or multi_factor when it also passed two-step verification."
          type: string
        authenticated_at:
          description: "When the Session was first signed in."
          type: string
          format: date-time
        mfa_recovery_required:
          type: boolean
          description: Whether the Session can't be used normally until the User sets up a new authenticator app for two-step verification.
        mfa_enrollment_required:
          type: boolean
          description: >-
            Whether the Access Policy limits this Web Session until its User sets up or completes two-step verification. While it is true, the Session can only set up two-step verification, answer the two-step verification challenge, reauthenticate, read the security status and sign out.
        reauthenticated_at:
          type: string
          format: date-time
          description: When the User last proved who they are again on this Session, with the same method they signed in with. It does not change authenticated_at or mfa_completed_at. Left out when the Session has never reauthenticated.
        mfa_completed_at:
          description: "When the Session last passed two-step verification. Left out when it never has."
          type: string
          format: date-time
        last_activity_at:
          description: "When the Session was last used. Proctor records use at most once per activity update interval, so this can trail the latest request."
          type: string
          format: date-time
        idle_expires_at:
          description: "When the Session ends if it stays unused. Each recorded use of the Session moves this later."
          type: string
          format: date-time
        expires_at:
          description: "When the Session ends no matter how often it is used."
          type: string
          format: date-time
        revoked_at:
          description: "When the Session was revoked. Left out while it is still active."
          type: string
          format: date-time
        revocation_reason_code:
          description: "Why the Session was revoked. Present only when revoked_at is set."
          type: string
          anyOf:
            - $ref: '#/components/schemas/SessionRevocationReasonCode'
            - type: string
        revocation_reason:
          type: string
          description: A readable explanation of revocation_reason_code in the request's language. Present only when the Session was revoked.
        current:
          type: boolean
          description: True for the Session that made the request.
    SessionListResponse:
      description: One page of the collection in its stable order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          description: "The current User's active Sessions on this page, newest first."
          type: array
          items:
            $ref: '#/components/schemas/CurrentUserSessionResponse'
        next_cursor:
          description: "Pass this back as cursor to get the next page. Left out on the last page."
          $ref: '#/components/schemas/NextCursor'
    RevokeOtherSessionsResponse:
      description: How many of the current User's other Sessions this request revoked.
      type: object
      additionalProperties: false
      required:
        - revoked_session_count
      properties:
        revoked_session_count:
          description: "How many other Sessions this request revoked. 0 when no other Session was active."
          type: integer
          minimum: 0
    RenameSessionRequest:
      type: object
      additionalProperties: false
      required:
        - device_name
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 128
          description: The new name. Surrounding whitespace is removed before the length is checked.
    RevokeSessionRequest:
      type: object
      additionalProperties: false
      required:
        - session_id
      properties:
        session_id:
          description: "The ID of the Session to revoke. It must belong to the current User."
          $ref: '#/components/schemas/ID'
