paths:
  /api/v1/users/{user_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: listUserSessions
      summary: List a User's Sessions for administrative review
      description: >-
        Returns one page of the given User's Sessions, newest first, when the caller currently has the administrative permission to see them. Each entry describes the device, sign-in, activity and expiry of a Session. Revoked and expired Sessions are left out unless include_revoked asks for them. Access and refresh credentials are never returned.
      tags:
        - Authentication
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - session.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: include_revoked
          in: query
          required: false
          description: Also return revoked Sessions, with their revocation time and reason.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of Sessions to return.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: A cursor from the previous page. Treat it as a token and don't read or change it.
          description: The next_cursor value from the previous page. Leave it out to get the first page.
      responses:
        "200":
          $ref: '#/components/responses/SessionAdministrationListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{user_id}/sessions/revoke-all:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      operationId: revokeUserSessions
      summary: Revoke every active Session for a User
      description: >-
        Revokes every active Session of the given User, after checking that the caller is allowed to. The revocation and its audit record are saved before the response reports success.
      x-codeSamples:
        - lang: Shell
          label: Revoke all Sessions for a User
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/ybndrfg8ejkmcpqxot1uwisza3/sessions/revoke-all
      tags:
        - Authentication
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - session.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SessionAdministrationRevoked'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{user_id}/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/SessionID'
    delete:
      operationId: revokeUserSession
      summary: Revoke one Session belonging to a User
      description: >-
        Revokes one Session of the given User. Proctor first checks that the Session belongs to that User and that the caller is still allowed to do this. The operation never takes or returns Session credentials.
      x-codeSamples:
        - lang: Shell
          label: Revoke one User Session
          source: |-
            curl --request DELETE \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/ybndrfg8ejkmcpqxot1uwisza3/sessions/ybndrfg8ejkmcpqxot1uwisza4
      tags:
        - Authentication
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - session.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SessionAdministrationRevoked'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/sessions:
    get:
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listCurrentUserSessions
      summary: List the current user's sessions
      description: >-
        Lists the current User's active Sessions, newest first, with their device, sign-in, activity and expiry details. Access tokens, refresh tokens, provider subject IDs and other credentials are left out.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.internal
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/SessionListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    patch:
      operationId: renameCurrentUserSession
      summary: Rename one current-user session
      description: >-
        Sets the device name of one of the current User's live browser or CLI Sessions. The name is trimmed, loses bidirectional and invisible formatting code points, and must be 1 to 128 characters without control characters. A Desktop Session is named by its Desktop Registration, so renaming one is refused with session.desktop_named_by_registration, whose fields.desktop_registration_id names the registration to rename through renameDesktopRegistration instead. Renaming changes no credential, so any interactive Session can do it without a recent sign-in. A Personal Access Token can't. Sending the same name again gives the same result. A Session of another User, or one that is revoked or expired, returns not found. Every rename is audited and appears in the User's own account history.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - request.invalid
        - session.id.invalid
        - session.invalid
        - session.not_found
        - session.desktop_named_by_registration
        - authentication.session_required
        - authentication.reauthentication_required
        - authentication.internal
        - audit.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/RenameSession'
      responses:
        "200":
          $ref: '#/components/responses/CurrentUserSessionOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/sessions/revoke:
    post:
      operationId: revokeCurrentUserSession
      summary: Revoke one current-user session
      description: >-
        Revokes one Session, but only when it belongs to the current User. It can be a Session on another device. If it is the Session making this request, that Session stops working right away.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - request.invalid
        - session.id.invalid
        - session.not_found
        - authentication.internal
        - audit.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/RevokeSession'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/sessions/revoke-all:
    post:
      operationId: revokeAllCurrentUserSessions
      summary: Revoke all current-user sessions
      description: >-
        Revokes every active Session of the current User, including the Session making the request, so the caller is signed out too. Afterwards, clients must throw away cached credentials and sign in again. To stay signed in on this device, use revokeOtherCurrentUserSessions instead.
      x-codeSamples:
        - lang: Shell
          label: Revoke all current-user Sessions
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/sessions/revoke-all
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.internal
        - audit.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/sessions/revoke-others:
    post:
      operationId: revokeOtherCurrentUserSessions
      summary: Sign out every other current-user session
      description: >-
        Revokes every active Session of the current User except the Session making the request. That Session stays signed in, and its cookies and credentials are left in place. The response says how many Sessions were revoked, which is zero when no other Session was active. A Personal Access Token has no Session to keep, so it is refused.
      x-codeSamples:
        - lang: Shell
          label: Sign out every other Session
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/sessions/revoke-others
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.internal
        - audit.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/OtherSessionsRevoked'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of an interactive Session.
  requestBodies:
    RenameSession:
      required: true
      description: The device name the current User chose for the Session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RenameSessionRequest'
          example:
            device_name: Office browser
    RevokeSession:
      required: true
      description: The ID of the current User's Session to revoke.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevokeSessionRequest'
          example:
            session_id: nybc6xhg593upqice3sdeyro5k
  responses:
    CurrentUserSessionOK:
      description: The renamed current-user Session
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUserSessionResponse'
          example:
            id: 14j8umgczgrdp95w77zuxmxfu9
            created_at: '2026-08-12T09:30:00Z'
            updated_at: '2026-08-12T14:30:00Z'
            user_id: wj3drgzdpnf54rxf5d8qd3dqne
            client_type: web
            device_id: browser-7
            device_name: Office browser
            authentication_method: password
            authentication_strength: single_factor
            authenticated_at: '2026-08-12T09:30:00Z'
            mfa_recovery_required: false
            mfa_enrollment_required: false
            last_activity_at: '2026-08-12T14:30:00Z'
            idle_expires_at: '2026-08-19T14:30:00Z'
            expires_at: '2026-09-11T09:30:00Z'
            current: true
    SessionAdministrationListOK:
      description: One page of the User's Sessions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionAdministrationListResponse'
          example:
            items:
              - id: 14j8umgczgrdp95w77zuxmxfu9
                created_at: '2026-08-12T09:30:00Z'
                updated_at: '2026-08-12T14:30:00Z'
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                client_type: web
                device_name: Office browser
                authentication_method: oidc
                authentication_strength: multi_factor
                mfa_recovery_required: false
                mfa_enrollment_required: false
