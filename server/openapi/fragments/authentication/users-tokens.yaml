paths:
  /api/v1/users/me/tokens:
    get:
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listPersonalAccessTokens
      summary: List current-user Personal Access Tokens
      description: >-
        Lists the current User's Personal Access Tokens, newest first, with their scopes, expiry and whether they are disabled or revoked. The secret token value is shown only once, when the token is created, and never appears in this list.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - personal_access_token.unavailable
        - authentication.reauthentication_required
        - authentication.session_required
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/PersonalAccessTokenListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createPersonalAccessToken
      summary: Create a Personal Access Token
      description: >-
        Creates a Personal Access Token with limited scopes and a fixed expiry. The interactive Session must have signed in or reauthenticated recently. The response shows the secret token value once, and Proctor never shows it again. Proctor checks that the current User may grant every requested scope at the requested Academic Unit, or across the Institution when no Academic Unit is given, and that the expiry is within the allowed lifetime.
      tags:
        - Authentication
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - personal_access_token.invalid
        - personal_access_token.maximum_reached
        - personal_access_token.unavailable
        - audit.unavailable
        - authentication.session_required
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.reauthentication_required
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreatePersonalAccessToken'
      responses:
        "201":
          $ref: '#/components/responses/PersonalAccessTokenCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/tokens/grantable-scopes:
    get:
      operationId: listGrantablePersonalAccessTokenScopes
      summary: List grantable Personal Access Token scopes
      description: >-
        Returns the Personal Access Token scopes the current User may grant right now, each with a title and description in the request's language. A scope with `institution_wide` set can be granted without an Academic Unit limit, or limited to any Academic Unit. Any other scope can be granted only when limited to one of its `academic_unit_ids` or to a unit below one of them. `academic_units` lists at most 50 of those top Academic Units, sorted by display name, and `academic_units_has_more` says whether there are more. Scopes the User can't grant anywhere are left out. Creating a token checks the User's permissions again.
      x-codeSamples:
        - lang: Shell
          label: List grantable Personal Access Token scopes
          source: |-
            curl --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/tokens/grantable-scopes
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - personal_access_token.unavailable
        - authentication.reauthentication_required
        - authentication.session_required
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/PersonalAccessTokenGrantableScopesOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/tokens/{personal_access_token_id}/disable:
    parameters:
      - $ref: '#/components/parameters/PersonalAccessTokenID'
    post:
      operationId: disablePersonalAccessToken
      summary: Disable a Personal Access Token
      description: >-
        Disables one of the current User's Personal Access Tokens, so requests that use it stop working until it is enabled again. The token record and its audit history are kept, so it can be reviewed or enabled later.
      x-codeSamples:
        - lang: Shell
          label: Disable a Personal Access Token
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/tokens/ybndrfg8ejkmcpqxot1uwisza3/disable
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - personal_access_token.unavailable
        - audit.unavailable
        - authentication.reauthentication_required
        - authentication.session_required
        - personal_access_token.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/PersonalAccessTokenOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/tokens/{personal_access_token_id}/enable:
    parameters:
      - $ref: '#/components/parameters/PersonalAccessTokenID'
    post:
      operationId: enablePersonalAccessToken
      summary: Enable a Personal Access Token
      description: >-
        Enables a disabled Personal Access Token that has not expired. The interactive Session must have signed in or reauthenticated recently, and Proctor checks again that the User may still grant the token's scopes. A revoked token can't be enabled.
      x-codeSamples:
        - lang: Shell
          label: Enable a Personal Access Token
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/tokens/ybndrfg8ejkmcpqxot1uwisza3/enable
      tags:
        - Authentication
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - personal_access_token.maximum_reached
        - personal_access_token.unavailable
        - audit.unavailable
        - authentication.session_required
        - personal_access_token.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.reauthentication_required
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/PersonalAccessTokenOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/tokens/{personal_access_token_id}:
    parameters:
      - $ref: '#/components/parameters/PersonalAccessTokenID'
    delete:
      operationId: revokePersonalAccessToken
      summary: Revoke a Personal Access Token
      description: >-
        Revokes one of the current User's Personal Access Tokens for good. The revocation is saved and recorded in the audit log. The token can't be restored or swapped for a replacement.
      x-codeSamples:
        - lang: Shell
          label: Revoke a Personal Access Token
          source: |-
            curl --request DELETE \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/tokens/ybndrfg8ejkmcpqxot1uwisza3
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - personal_access_token.unavailable
        - audit.unavailable
        - authentication.reauthentication_required
        - authentication.session_required
        - personal_access_token.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    PersonalAccessTokenID:
      name: personal_access_token_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of a Personal Access Token. This is not the secret token value.
  requestBodies:
    CreatePersonalAccessToken:
      required: true
      description: What the new token is for, its scopes, an optional Academic Unit to limit it to, and when it expires.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatePersonalAccessTokenRequest'
          example:
            description: Read exams from the registrar tool
            scopes:
              - exam.view
            academic_unit_id: o87yi4tenx8kodmcuup1hmtsbo
            expires_at: '2027-01-01T00:00:00Z'
  responses:
    PersonalAccessTokenOK:
      description: The Personal Access Token after the change
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalAccessTokenResponse'
          example:
            id: dfa1x1n7mkthyoziwxnupsmyia
            created_at: '2026-08-01T10:00:00Z'
            updated_at: '2026-08-20T15:12:00Z'
            user_id: wj3drgzdpnf54rxf5d8qd3dqne
            description: Read exams from the registrar tool
            scopes:
              - exam.view
            academic_unit_id: o87yi4tenx8kodmcuup1hmtsbo
            expires_at: '2027-01-01T00:00:00Z'
            last_used_at: '2026-08-19T07:45:00Z'
            disabled_at: '2026-08-20T15:12:00Z'
    PersonalAccessTokenCreated:
      description: The new Personal Access Token and its secret value, shown only this once
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalAccessTokenCreationResponse'
          example:
            token:
              id: dfa1x1n7mkthyoziwxnupsmyia
              created_at: '2026-08-01T10:00:00Z'
              updated_at: '2026-08-01T10:00:00Z'
              user_id: wj3drgzdpnf54rxf5d8qd3dqne
              description: Read exams from the registrar tool
              scopes:
                - exam.view
              academic_unit_id: o87yi4tenx8kodmcuup1hmtsbo
              expires_at: '2027-01-01T00:00:00Z'
            credential: Fz7kQ3wNb8LmRc2vYt5HdPs9XgJ1aEoU6iSkBvM4xWe
    PersonalAccessTokenGrantableScopesOK:
      description: The Personal Access Token scopes the current User may grant
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalAccessTokenGrantableScopesResponse'
          example:
            scopes:
              - name: audit.view
                title: View audit history
                description: Read the installation's audit history.
                resource_types:
                  - institution
                institution_wide: true
                academic_unit_ids:
                  - o87yi4tenx8kodmcuup1hmtsbo
              - name: exam.view
                title: View exams
                description: Read exams you manage, including drafts and revisions.
                resource_types:
                  - exam
                institution_wide: false
                academic_unit_ids:
                  - o87yi4tenx8kodmcuup1hmtsbo
            academic_units:
              - id: o87yi4tenx8kodmcuup1hmtsbo
                display_name: School of Computing
            academic_units_has_more: false
    PersonalAccessTokenListOK:
      description: One page of the current User's Personal Access Tokens
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalAccessTokenListResponse'
          example:
            items:
              - id: dfa1x1n7mkthyoziwxnupsmyia
                created_at: '2026-08-01T10:00:00Z'
                updated_at: '2026-08-01T10:00:00Z'
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                description: Read exams from the registrar tool
                scopes:
                  - exam.view
                academic_unit_id: o87yi4tenx8kodmcuup1hmtsbo
                expires_at: '2027-01-01T00:00:00Z'
                last_used_at: '2026-08-19T07:45:00Z'
              - id: zq993bky9h3uj4saw8iywi38cy
                created_at: '2026-03-02T12:00:00Z'
                updated_at: '2026-06-01T12:00:00Z'
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                description: Nightly job export
                scopes:
                  - job.view
                expires_at: '2026-06-01T12:00:00Z'
                last_used_at: '2026-05-31T02:00:00Z'
  schemas:
    CreatePersonalAccessTokenRequest:
      type: object
      additionalProperties: false
      required:
        - description
        - scopes
        - expires_at
      properties:
        description:
          type: string
          description: What the token is for, in up to 255 characters. It helps you recognize the token later.
        scopes:
          type: array
          description: The actions the token may perform. The current User must be able to grant each one.
          items:
            $ref: '#/components/schemas/PersonalAccessTokenScope'
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: Limits the token to resources in this Academic Unit and the units below it. Leave it out for a token that works across the Institution.
        expires_at:
          type: string
          format: date-time
          description: When the token stops working. It must fall within the server's allowed token lifetime, which is 1 hour to 90 days by default.
    PersonalAccessTokenScope:
      description: An action a Personal Access Token may carry. The grantable-scopes operation reports which of them the current User may grant.
      type: string
      enum:
        - academic.progression.manage
        - academic_audit.view
        - academic_period.manage
        - academic_period.view
        - academic_unit.manage
        - academic_unit.members.manage
        - academic_unit.members.view
        - academic_unit.view
        - audit.view
        - class.manage
        - class.members.manage
        - class.members.view
        - class.view
        - exam.attempt.browser_activity.view
        - exam.create
        - exam.create.override
        - exam.manage
        - exam.manage.override
        - exam.publish
        - exam.publish.override
        - exam.sitting.create
        - exam.sitting.create.override
        - exam.sitting.manage
        - exam.sitting.manage.override
        - exam.sitting.view
        - exam.sitting.view.override
        - exam.view
        - exam.view.override
        - institution.manage
        - invitation.create
        - invitation.manage
        - invitation.view
        - job.manage
        - job.view
        - mail.manage
        - mail.view
        - onboarding_batch.manage
        - onboarding_batch.view
        - programme.manage
        - programme.view
        - programme_level.manage
        - programme_level.view
        - session.manage
        - session.view
        - submission.release
        - submission.release.override
        - submission.review
        - submission.review.override
        - submission.view
        - submission.view.override
        - user.manage
        - user.profile_picture.manage
        - user.view
    PersonalAccessTokenGrantableScopesResponse:
      type: object
      additionalProperties: false
      required:
        - scopes
        - academic_units
        - academic_units_has_more
      properties:
        scopes:
          type: array
          description: The scopes the current User may grant somewhere. Scopes they can't grant anywhere are left out.
          items:
            $ref: '#/components/schemas/PersonalAccessTokenGrantableScope'
        academic_units:
          description: Up to 50 top Academic Units where at least one scope can be granted, sorted by display name.
          type: array
          items:
            $ref: '#/components/schemas/PersonalAccessTokenGrantableAcademicUnit'
        academic_units_has_more:
          description: True when there are more such Academic Units than are listed.
          type: boolean
    PersonalAccessTokenGrantableScope:
      type: object
      additionalProperties: false
      required:
        - name
        - title
        - description
        - resource_types
        - institution_wide
        - academic_unit_ids
      properties:
        name:
          type: string
          description: The scope name to send in scopes when creating a token. A newer server may send a name this contract does not list yet.
          anyOf:
            - $ref: '#/components/schemas/PersonalAccessTokenScope'
            - type: string
        title:
          description: A short title in the request's language.
          type: string
        description:
          description: One sentence, in the request's language, explaining what the scope allows.
          type: string
        resource_types:
          description: The resource types the action applies to.
          type: array
          items:
            type: string
            enum:
              - academic_period
              - academic_unit
              - class
              - exam
              - exam_sitting
              - institution
              - programme
              - programme_level
              - submission
              - user
        institution_wide:
          description: True when the scope can be granted without an Academic Unit limit, or limited to any Academic Unit.
          type: boolean
        academic_unit_ids:
          description: The listed `academic_units` where the scope can be granted. It can also be granted at any unit below them.
          type: array
          items:
            $ref: '#/components/schemas/ID'
    PersonalAccessTokenGrantableAcademicUnit:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit ID.
        display_name:
          type: string
          description: The Academic Unit's display name.
    PersonalAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - user_id
        - description
        - scopes
        - expires_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The Personal Access Token ID. It is not the secret token value.
        created_at:
          type: string
          format: date-time
          description: When the token was created.
        updated_at:
          type: string
          format: date-time
          description: When the token record last changed.
        archived_at:
          type: string
          format: date-time
          description: When the token record was archived. Left out when it has not been archived.
        user_id:
          $ref: '#/components/schemas/ID'
          description: The ID of the User who owns the token.
        description:
          type: string
          description: What the token is for, as its owner described it.
        scopes:
          type: array
          description: The actions the token may perform.
          items:
            type: string
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit the token is limited to, including the units below it. Left out for a token that works across the Institution.
        expires_at:
          type: string
          format: date-time
          description: When the token stops working.
        last_used_at:
          type: string
          format: date-time
          description: When a request last used the token. Use is recorded at most once per update interval, five minutes by default, so it can trail the latest request. Left out when the token has never been used.
        disabled_at:
          type: string
          format: date-time
          description: When the token was disabled. Left out while it is enabled.
        revoked_at:
          type: string
          format: date-time
          description: When the token was revoked. Left out unless it has been revoked.
    PersonalAccessTokenCreationResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - credential
      properties:
        token:
          $ref: '#/components/schemas/PersonalAccessTokenResponse'
          description: The new token's details.
        credential:
          type: string
          description: The secret token value to send as a Bearer token. Store it safely now, because Proctor never shows it again.
    PersonalAccessTokenListResponse:
      description: One page of the collection in its stable order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The tokens on this page, newest first.
          items:
            $ref: '#/components/schemas/PersonalAccessTokenResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
          description: Pass this back as cursor to get the next page. Left out on the last page.
