components:
  parameters:
    ExamExportID:
      name: exam_export_id
      in: path
      required: true
      description: ID of the export. It belongs to the Sitting or Submission named in the path.
      schema:
        $ref: '#/components/schemas/ID'
  requestBodies:
    CreateExamExport:
      description: >-
        Which categories to export, chosen for the whole request. A missing, empty, duplicate or unknown
        category is rejected.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateExamExportRequest'
          example:
            categories:
              - work
              - integrity
  responses:
    ExamExportAccepted:
      description: >-
        The export request was accepted with a fixed expiry. Poll the export at its own URL, under the same
        Sitting or Submission, to see when it is ready.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamExportResponse'
          example:
            id: rpn96r4g3jfk3t41u4dus44bzc
            exam_id: xpq79ar61ncrjiouey6d9tgp91
            exam_sitting_id: 17778cuf6b17rhtapprfjozet8
            categories:
              - work
              - integrity
            state: queued
            policy_revision: 3
            created_at: '2026-09-01T12:00:00Z'
            expires_at: '2026-09-04T12:00:00Z'
            construction_deadline: '2026-09-02T12:00:00Z'
            submission_count: 42
            file_count: 1260
            source_bytes: 734003200
    ExamExportOK:
      description: The export's details. Only the requester sees them, and only while they still have ordinary access to the records.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamExportResponse'
          example:
            id: rpn96r4g3jfk3t41u4dus44bzc
            exam_id: xpq79ar61ncrjiouey6d9tgp91
            exam_sitting_id: 17778cuf6b17rhtapprfjozet8
            categories:
              - work
              - integrity
            state: ready
            policy_revision: 3
            created_at: '2026-09-01T12:00:00Z'
            expires_at: '2026-09-04T12:00:00Z'
            construction_deadline: '2026-09-02T12:00:00Z'
            ready_at: '2026-09-01T12:18:40Z'
            submission_count: 42
            file_count: 1260
            source_bytes: 734003200
            archive_size_bytes: 741392384
            archive_sha256: 5d41a2b8c9e0f17263a4b5c6d7e8f9011a2b3c4d5e6f708192a3b4c5d6e7f809
    ExamExportArchive:
      description: >-
        The temporary ZIP archive, checked against its hash. Each new download is authorized and checked for
        expiry. No public storage URL or storage backend detail is exposed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        ETag:
          description: SHA-256 of the whole ZIP, in double quotes.
          schema:
            type: string
        Content-Disposition:
          description: Marks the response as an attachment, with a safe file name chosen by the server.
          schema:
            type: string
        X-Content-Type-Options:
          description: Always `nosniff`, so browsers don't guess a different content type.
          schema:
            type: string
            const: nosniff
      content:
        application/zip:
          schema:
            type: string
            format: binary
    ExamExportGone:
      description: The export's fixed expiry has passed, so new downloads are refused.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/exam.export.expired
            title: Export expired
            status: 410
            detail: The temporary export has expired.
            code: exam.export.expired
            request_id: req_docs_export_expired
  schemas:
    CreateExamExportRequest:
      description: Categories to include in a new export.
      type: object
      additionalProperties: false
      required:
        - categories
      properties:
        categories:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - work
              - integrity
              - browser_activity
          description: >-
            What to export: work, integrity, or both, or Browser Activity on its own. Browser Activity needs
            current Exam Manager status on this exact Exam and the dedicated history permission. Other exports
            never contain browsing URLs.
    ExamExportResponse:
      description: A request for a temporary export archive, and its state.
      type: object
      additionalProperties: false
      required:
        - id
        - exam_id
        - exam_sitting_id
        - categories
        - state
        - policy_revision
        - created_at
        - expires_at
        - construction_deadline
        - submission_count
        - file_count
        - source_bytes
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: ID of the export.
        exam_id:
          $ref: '#/components/schemas/ID'
          description: Exam the exported records belong to.
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: Sitting the exported records belong to.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: Submission that was exported. Present only for a Submission export.
        categories:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - work
              - integrity
              - browser_activity
          description: >-
            What to export: work, integrity, or both, or Browser Activity on its own. Browser Activity needs
            current Exam Manager status on this exact Exam and the dedicated history permission. Other exports
            never contain browsing URLs.
        state:
          type: string
          enum:
            - queued
            - ready
            - failed
            - expired
          description: >-
            `queued` while the archive is being built, `ready` when it can be downloaded, `failed` if building
            failed, and `expired` after `expires_at`.
        policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Retention policy revision whose export lifetime set the expiry.
        created_at:
          type: string
          format: date-time
          description: Time the export was requested. The expiry counts from this time.
        expires_at:
          type: string
          format: date-time
          description: >-
            Time after which the archive can't be downloaded. It is fixed when the export is requested.
        construction_deadline:
          type: string
          format: date-time
          description: >-
            Latest time the archive can finish building. It is at most 24 hours after the request and never
            after `expires_at`.
        ready_at:
          type: string
          format: date-time
          description: Time the archive became ready. Omitted unless the export is ready.
        submission_count:
          type: integer
          minimum: 1
          maximum: 200
          description: Number of Submissions in the export.
        file_count:
          type: integer
          minimum: 0
          maximum: 50000
          description: Number of workspace entries in the export.
        source_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 8589934592
          description: Total size, in bytes, of the original files being exported.
        archive_size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 8724152320
          description: Size of the finished ZIP, in bytes. Present only while the export is ready.
        archive_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: >-
