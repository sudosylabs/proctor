paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/exports:
    post:
      operationId: createSittingExport
      summary: Create a Sitting export
      tags:
        - Data retention
      description: >-
        Needs an interactive Session and the separate `exam.records.export` permission, held through current
        Exam Manager status and membership of the exact Academic Unit, or through its scoped override. The
        caller also needs ordinary view access to every selected Submission, and a Sitting export also needs
        Sitting view access. An integrity export also needs current Exam Manager status on this exact Exam and
        the dedicated Browser Activity view permission. These are checked when the export is created,
        replayed, read and downloaded, and the general export override can't bypass them. Candidates can't
        export their own records. Personal Access Tokens are rejected. Choose work, integrity or both
        explicitly. The whole selected scope is captured at once, so a Sitting archive is never partial. The
        limits are 200 Submissions, 50,000 workspace entries, 50,000 structured records, 8 GiB of original
        files and 64 MiB of structured JSON. A request over any limit is rejected. The policy's export
        lifetime must be set to 1 to 7 days. While it is 0, exports can't be created until someone changes it.
        The expiry counts from when the request is made, and the archive must be built within 24 hours. The
        audit record, the build Job and the protection of the selected source records are saved together. A
        retry returns the same export and never extends its expiry. The archive holds the original workspace
        files, structured records, a manifest and SHA-256 hashes. Archives can't be imported back.
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - exam.export.not_found
        - exam.export.conflict
        - exam.export.unavailable
        - exam.export.policy_unconfigured
        - exam.export.limit
        - exam.export.source_retired
        - exam.export.scope_changed
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/ExamSittingID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateExamExport'
      responses:
        '202':
          $ref: '#/components/responses/ExamExportAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/exports/{exam_export_id}:
    get:
      operationId: getSittingExport
      summary: Get a Sitting export
      tags:
        - Data retention
      description: >-
        Needs an interactive Session and the separate `exam.records.export` permission, held through current
        Exam Manager status and membership of the exact Academic Unit, or through its scoped override. The
        caller also needs ordinary view access to every selected Submission, and a Sitting export also needs
        Sitting view access. An integrity export also needs current Exam Manager status on this exact Exam and
        the dedicated Browser Activity view permission. These are checked when the export is created,
        replayed, read and downloaded, and the general export override can't bypass them. Candidates can't
        export their own records. Personal Access Tokens are rejected. Only the User who requested the export
        can read it. Credentials, ordinary read access and the exact scope are checked again on every read.
        The state is `queued`, `ready`, `failed` or `expired`. An expired export never returns its content
        hash or anything that could fetch the archive. The expiry shown is fixed, even if the policy changes
        later. No storage keys or public download URLs are returned.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - exam.export.not_found
        - exam.export.conflict
        - exam.export.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/ExamSittingID'
        - $ref: '#/components/parameters/ExamExportID'
      responses:
        '200':
          $ref: '#/components/responses/ExamExportOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/exports/{exam_export_id}/content:
    get:
      operationId: downloadSittingExport
      summary: Download a Sitting export
      tags:
        - Data retention
      description: >-
        Needs an interactive Session and the separate `exam.records.export` permission, held through current
        Exam Manager status and membership of the exact Academic Unit, or through its scoped override. The
        caller also needs ordinary view access to every selected Submission, and a Sitting export also needs
        Sitting view access. An integrity export also needs current Exam Manager status on this exact Exam and
        the dedicated Browser Activity view permission. These are checked when the export is created,
        replayed, read and downloaded, and the general export override can't bypass them. Candidates can't
        export their own records. Personal Access Tokens are rejected. Only the User who requested the export
        can download it, while it is ready and unexpired, with current credentials and ordinary read access.
        The response is an `application/zip` attachment with private, no-store caching and a safe file name.
        No presigned or public URL is issued. The `ETag` header and the `archive_sha256` field give the
        SHA-256 of the whole ZIP, and `manifest.json` lists the size and SHA-256 of each data file. Hashes
        detect changes but aren't a signature. Expiry blocks new downloads but doesn't cut off a download
        already in progress. Cleanup later checks that the archive is gone from current storage. It can't
        certify secure erasure of the storage media, or removal from backups, earlier object versions or
        replicas that operators manage.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - exam.export.not_found
        - exam.export.conflict
        - exam.export.unavailable
        - exam.export.expired
        - exam.export.not_ready
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/ExamSittingID'
        - $ref: '#/components/parameters/ExamExportID'
      responses:
        '200':
          $ref: '#/components/responses/ExamExportArchive'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/ExamExportGone'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
