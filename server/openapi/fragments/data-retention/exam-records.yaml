paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/records-completion:
    get:
      operationId: getExamSittingRecords
      summary: Inspect Sitting records completion
      tags:
        - Data retention
      description: >-
        Needs a Session and the separate `exam.records.complete` action, held through current Exam Manager
        status and membership of the exact Academic Unit, or through its scoped override. Returns the
        completion history and counts only. Records completion is separate from closing the Sitting, and a
        stale completion blocks retention. Integrity categories that were already retired don't need their
        Reviews recreated.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/ExamSittingID'
      responses:
        '200':
          $ref: '#/components/responses/ExamRecordsSnapshotOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: completeExamSittingRecords
      summary: Complete Sitting records
      tags:
        - Data retention
      description: >-
        Needs a Session and the separate `exam.records.complete` action, held through current Exam Manager
        status and membership of the exact Academic Unit, or through its scoped override. The Sitting must be
        Closed, and every remaining Submission Review must be finalized or marked unnecessary for the
        Submission's current inventory. The revision and the integrity evidence revision you send must match
        the current ones. Newly accepted evidence, or an edit to a waived Review, makes the completion stale.
        You then acknowledge the change and complete again, which restarts the retention clock. An exact
        retry, or completing when the completion is already current, doesn't restart the clock. The
        completion, the fresh credential and permission checks, the audit record and the retry result are
        saved together. Completing doesn't turn on cleanup or release Retention Holds.
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.conflict
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CompleteExamRecords'
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/ExamSittingID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/ExamRecordsCompletionOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/submissions/{submission_id}/review-waiver:
    get:
      operationId: getSubmissionReviewWaiver
      summary: Inspect a Submission Review waiver
      tags:
        - Data retention
      description: >-
        Needs a Session and the separate `exam.records.complete` action, held through current Exam Manager
        status and membership of the exact Academic Unit, or through its scoped override. Returns the recorded
        private decision, or null when there is none. Its Review revision and discrepancy count identify the
        inventory that was acknowledged. A candidate asking about their own Submission gets no answer that
        reveals the waiver. A private decision that has been retired can't be replayed.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/ExamSittingID'
        - $ref: '#/components/parameters/SubmissionID'
      responses:
        '200':
          $ref: '#/components/responses/SubmissionReviewWaiverOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: waiveSubmissionReview
      summary: Mark a Submission Review unnecessary
      tags:
        - Data retention
      description: >-
        Needs a Session and the separate `exam.records.complete` action, held through current Exam Manager
        status and membership of the exact Academic Unit, or through its scoped override. The Sitting must be
        Closed, and the waiver revision, Review revision and discrepancy count you send must match the current
        ones. Send waiver revision 0 to record the first decision. A candidate can't waive their own Review. A
        waiver is rejected while Flags are still undecided, and for a Review that is already finalized. Newly
        accepted discrepancies or later edits invalidate the waiver. The private reason is stored only in the
        waiver record and the protected retry result. The audit record holds only the reason code and IDs.
        Once the integrity records are retired, this action and its replay are rejected.
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.conflict
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/WaiveSubmissionReview'
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/ExamSittingID'
        - $ref: '#/components/parameters/SubmissionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/SubmissionReviewWaiverOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/retention-holds:
    get:
      operationId: listRetentionHolds
      summary: List preservation holds
      tags:
        - Data retention
      description: >-
        Needs a Session and `exam.records.hold`, held through current Exam Manager status and membership of
        the exact Academic Unit, or through its scoped override. Lists holds on the requested scope or below
        it, together with the higher-level holds that cover it. Holds never expire on their own. The retired
        counts recorded when each hold was created show content the hold can't bring back. The cursor is tied
        to the requested scope.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - name: exam_sitting_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only holds for this Sitting. Exam holds that cover it are included.
        - name: submission_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: >-
            Return only holds for this Submission. Needs `exam_sitting_id`. Holds on the Sitting and Exam that
            cover it are included.
        - name: include_released
          in: query
          schema:
            type: boolean
            default: false
          description: Set to `true` to include released holds. Only `true` and `false` are accepted.
        - name: limit
          in: query
          description: Maximum number of holds to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
          description: >-
            The `next_cursor` value from the previous page, sent with the same scope and `include_released`.
            Pass it unchanged and don't try to read it.
      responses:
        '200':
          $ref: '#/components/responses/RetentionHoldPageOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createRetentionHold
      summary: Preserve examination records
      tags:
        - Data retention
      description: >-
        Needs a Session and `exam.records.hold`, held through current Exam Manager status and membership of
        the exact Academic Unit, or through its scoped override. A hold on an Exam, Sitting or Submission
        covers its current content and anything added to that scope later, until someone releases it. It stops
        pending retirement but can't bring back content that was already retired. A hold on a single
        Submission that is fully retired is rejected. Broader holds still protect whatever remains below them.
        The retired counts recorded at creation show any partial retirement. The hold, its critical audit
        record and the retry result are saved together after authority is checked again.
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.conflict
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateRetentionHold'
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '201':
          $ref: '#/components/responses/RetentionHoldCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/retention-holds/{retention_hold_id}/release:
    post:
      operationId: releaseRetentionHold
      summary: Release a preservation hold
      tags:
        - Data retention
      description: >-
        Needs `retention_hold.release` on a protected system-administrator Session with a strong, recent
        sign-in. The release is audited and idempotent. Authority and the sign-in proof are checked again
        inside the transaction and on replay. The private release reason isn't written to the ordinary audit
        log. Releasing a hold doesn't restore data already retired, and records must still become eligible and
        pass a new grace period before cleanup.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.conflict
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/ReleaseRetentionHold'
      parameters:
        - $ref: '#/components/parameters/ExamID'
        - $ref: '#/components/parameters/RetentionHoldID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/RetentionHoldOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    RetentionHoldID:
      name: retention_hold_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: ID of the Retention Hold.
  requestBodies:
    CompleteExamRecords:
      description: >-
        The current completion revision and the integrity evidence revision you acknowledge, for a Closed
        Sitting whose Reviews are all finalized or waived.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompleteExamRecordsRequest'
          example:
            expected_revision: 1
            acknowledged_evidence_revision: 0
    WaiveSubmissionReview:
      description: >-
        The waiver and Review revisions and the discrepancy count you expect, and the private reason for
        waiving the Review of this Submission's current inventory.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WaiveSubmissionReviewRequest'
          example:
            expected_revision: 0
            expected_review_revision: 0
            expected_discrepancy_count: 0
            reason_code: review_not_required
            private_reason: Reviewed the current inventory; no finalized Review is needed.
    CreateRetentionHold:
      description: >-
        Optional Sitting or Submission scope and a private reason. Leave out both IDs to hold the whole Exam,
        including anything added to it later.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRetentionHoldRequest'
          example:
            until: '2027-09-01T00:00:00Z'
            reason_code: institution_request
            private_reason: Preserve records until the institution concludes its review.
    ReleaseRetentionHold:
      description: >-
        The hold's current revision and the reason for releasing it. Releasing doesn't start any deletion
        right away and can't restore records already retired.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReleaseRetentionHoldRequest'
          example:
            expected_revision: 1
            reason_code: case_closed
            private_reason: The institution has concluded its review and approved release.
  responses:
    ExamRecordsCompletionOK:
      description: >-
        The recorded completion result. An exact retry returns the original timestamp, even if the current
        state has changed since.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamRecordsCompletionResponse'
          example:
            exam_sitting_id: 4z3cy1rp9cucq7qo1g9mq94dj3
            revision: 4
            evidence_revision: 2
            completed_evidence_revision: 2
            current: true
            completed_at: '2026-09-01T10:00:00Z'
            completed_by_user_id: dpbj4ddm3hw8fkicm7nuazihkg
    ExamRecordsSnapshotOK:
      description: The Sitting's current records completion state and counts.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamRecordsSnapshotResponse'
          example:
            completion:
              exam_sitting_id: 4z3cy1rp9cucq7qo1g9mq94dj3
              revision: 1
              evidence_revision: 0
              completed_evidence_revision: 0
              current: false
            sitting_state: closed
            submission_count: 20
            pending_reviews: 2
    SubmissionReviewWaiverOK:
      description: The private decision for the current inventory, or null when none exists.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubmissionReviewWaiverEnvelope'
          example:
            waiver:
              submission_id: o59e9myujxww7zfc3kx4rn6wk5
              revision: 1
              review_revision: 0
              discrepancy_count: 0
              actor_user_id: dpbj4ddm3hw8fkicm7nuazihkg
              recorded_at: '2026-08-28T15:30:00Z'
              reason_code: review_not_required
              private_reason: Reviewed the current inventory; no finalized Review is needed.
              inventory_invalidated: false
              delivery_inventory_revision: 3
    RetentionHoldOK:
      description: The released Retention Hold. The coverage counts recorded at creation don't change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetentionHoldResponse'
          example:
            id: yftfs48pasu5fd6czhcwz6b4x3
            exam_id: xpq79ar61ncrjiouey6d9tgp91
            exam_sitting_id: 4z3cy1rp9cucq7qo1g9mq94dj3
            revision: 2
            created_at: '2026-09-01T10:00:00Z'
            created_by_user_id: dpbj4ddm3hw8fkicm7nuazihkg
            due_for_review: false
            reason_code: institution_request
            private_reason: Preserve records until the institution concludes its review.
            released_at: '2026-10-15T09:00:00Z'
            released_by_user_id: nan7rdocriztinowtuyrbqg67a
            release_reason_code: case_closed
            release_private_reason: The institution has concluded its review and approved release.
            work_retired_submission_count: 0
            integrity_retired_submission_count: 0
    RetentionHoldCreated:
      description: The new Retention Hold. Its creation-time counts show any content already retired.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetentionHoldResponse'
          example:
            id: yftfs48pasu5fd6czhcwz6b4x3
            exam_id: xpq79ar61ncrjiouey6d9tgp91
            exam_sitting_id: 4z3cy1rp9cucq7qo1g9mq94dj3
            revision: 1
            created_at: '2026-09-01T10:00:00Z'
            created_by_user_id: dpbj4ddm3hw8fkicm7nuazihkg
            due_for_review: false
            reason_code: institution_request
            private_reason: Preserve records until the institution concludes its review.
            work_retired_submission_count: 0
            integrity_retired_submission_count: 0
    RetentionHoldPageOK:
      description: One page of Retention Holds, including higher-level holds that cover the requested scope.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetentionHoldPageResponse'
          example:
            items:
              - id: yftfs48pasu5fd6czhcwz6b4x3
                exam_id: xpq79ar61ncrjiouey6d9tgp91
                exam_sitting_id: 4z3cy1rp9cucq7qo1g9mq94dj3
                revision: 1
                created_at: '2026-09-01T10:00:00Z'
                created_by_user_id: dpbj4ddm3hw8fkicm7nuazihkg
                until: '2027-09-01T00:00:00Z'
                due_for_review: false
                reason_code: institution_request
                private_reason: Preserve records until the institution concludes its review.
                work_retired_submission_count: 0
                integrity_retired_submission_count: 0
  schemas:
    ExamRecordsCompletionResponse:
      description: Records completion state of one Sitting.
      type: object
      additionalProperties: false
      required:
        - exam_sitting_id
        - revision
        - evidence_revision
        - completed_evidence_revision
        - current
      properties:
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: Sitting the completion belongs to.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Revision of the completion state. It goes up with each completion and each newly accepted
            integrity change. Send it as `expected_revision` to complete.
        evidence_revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Revision of the Sitting's accepted integrity evidence. It goes up each time new evidence is
            accepted. Send it as `acknowledged_evidence_revision` to complete.
        completed_evidence_revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Evidence revision acknowledged by the most recent completion. 0 before the first completion.
        current:
          type: boolean
          description: >-
            True when the Sitting's records are completed and no newer evidence has been accepted since.
            Retention can only start from a current completion.
        completed_at:
          type: string
          format: date-time
          description: Time of the most recent completion. Omitted before the first.
        completed_by_user_id:
          $ref: '#/components/schemas/ID'
          description: User who made the most recent completion. Omitted before the first.
        stale_at:
          type: string
          format: date-time
          description: >-
            Time newly accepted evidence made the most recent completion stale. Omitted while the completion
            is current, and before the first.
    ExamRecordsSnapshotResponse:
      description: A Sitting's records completion state, with counts that show whether it can be completed.
      type: object
      additionalProperties: false
      required:
        - completion
        - sitting_state
        - submission_count
        - pending_reviews
      properties:
        completion:
          $ref: '#/components/schemas/ExamRecordsCompletionResponse'
          description: Current records completion state.
        sitting_state:
          type: string
          enum:
            - scheduled
            - open
            - closed
            - paused
            - closing
            - canceled
          description: Delivery state of the Sitting. Records can only be completed once it is `closed`.
        submission_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of Submissions in the Sitting.
        pending_reviews:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of Submission Reviews still to finalize or waive before the records can be completed.
    SubmissionReviewWaiverResponse:
      description: A recorded decision that a Submission's current inventory needs no finalized Review.
      type: object
      additionalProperties: false
      required:
        - submission_id
        - revision
        - review_revision
        - discrepancy_count
        - actor_user_id
        - recorded_at
        - reason_code
        - private_reason
        - inventory_invalidated
        - delivery_inventory_revision
      properties:
        submission_id:
          $ref: '#/components/schemas/ID'
          description: Submission the waiver applies to.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Revision of the waiver. Send it as `expected_revision` to record a new decision.
        review_revision:
          type: integer
          format: int64
          minimum: 0
          description: Review revision the waiver acknowledged.
        discrepancy_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of integrity discrepancies the waiver acknowledged.
        actor_user_id:
          $ref: '#/components/schemas/ID'
          description: User who recorded the waiver.
        actor:
          $ref: '#/components/schemas/PersonRef'
          description: Who recorded the waiver, named.
        recorded_at:
          type: string
          format: date-time
          description: Time the waiver was recorded.
        reason_code:
          type: string
          enum:
            - institution_request
            - integrity_review
            - records_review
            - review_not_required
            - case_closed
            - mistake
            - other
          description: Reason code for the audit log. Put case details only in the matching private reason field.
        private_reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Private reason from the Institution, with no leading or trailing spaces. At most 4,000 UTF-8 bytes.
            It is never written to the ordinary audit log.
        inventory_invalidated:
          type: boolean
          description: True when the accepted delivery changed after this waiver. The waiver must then be acknowledged again.
        delivery_inventory_revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Revision of the accepted delivery inventory that this waiver acknowledged.
    SubmissionReviewWaiverEnvelope:
      description: Wrapper for a Submission's Review waiver.
      type: object
      additionalProperties: false
      required:
        - waiver
      properties:
        waiver:
          oneOf:
            - $ref: '#/components/schemas/SubmissionReviewWaiverResponse'
            - type: 'null'
          description: The recorded waiver, or null when none exists.
    RetentionHoldResponse:
      description: A Retention Hold on an Exam, a Sitting or a Submission.
      type: object
      additionalProperties: false
      required:
        - id
        - exam_id
        - revision
        - created_at
        - created_by_user_id
        - due_for_review
        - reason_code
        - private_reason
        - work_retired_submission_count
        - integrity_retired_submission_count
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: ID of the hold.
        exam_id:
          $ref: '#/components/schemas/ID'
          description: Exam the hold is on, or that contains the held Sitting or Submission.
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: Held Sitting, or the Sitting of the held Submission. Omitted for an Exam hold.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: Held Submission. Present only for a Submission hold.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Revision of the hold. Send it as `expected_revision` to release it.
        created_at:
          type: string
          format: date-time
          description: Time the hold was created.
        created_by_user_id:
          $ref: '#/components/schemas/ID'
          description: User who created the hold.
        created_by:
          $ref: '#/components/schemas/PersonRef'
          description: Who placed the hold, named.
        until:
          type: string
          format: date-time
          description: >-
            When the hold is due for review. Omitted when none was set. It never releases the hold: only a person
            does.
        due_for_review:
          type: boolean
          description: True when the hold is unreleased and `until` has passed. The hold still protects its records.
        reason_code:
          type: string
          enum:
            - institution_request
            - integrity_review
            - records_review
            - review_not_required
            - case_closed
            - mistake
            - other
          description: Reason code for the audit log. Put case details only in the matching private reason field.
        private_reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Private reason from the Institution, with no leading or trailing spaces. At most 4,000 UTF-8 bytes.
            It is never written to the ordinary audit log.
        released_at:
          type: string
          format: date-time
          description: Time the hold was released. Omitted while it is active.
        released_by_user_id:
          $ref: '#/components/schemas/ID'
          description: User who released the hold. Omitted while it is active.
        released_by:
          $ref: '#/components/schemas/PersonRef'
          description: Who released the hold, named. Omitted while it is held.
        release_reason_code:
          type: string
          enum:
            - institution_request
            - integrity_review
            - records_review
            - review_not_required
            - case_closed
            - mistake
            - other
          description: Reason code for the audit log. Put case details only in the matching private reason field.
        release_private_reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Private reason from the Institution, with no leading or trailing spaces. At most 4,000 UTF-8 bytes.
            It is never written to the ordinary audit log.
        work_retired_submission_count:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of Submissions in the hold's scope whose work was already retired when the hold was created.
            The hold can't restore them.
        integrity_retired_submission_count:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of Submissions in the hold's scope whose integrity records were already retired when the hold
            was created. The hold can't restore them.
    RetentionHoldPageResponse:
      description: One page of Retention Holds.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RetentionHoldResponse'
          description: Holds on this page.
        next_cursor:
          type: string
          maxLength: 512
          description: >-
            Token to pass as `cursor` to read the next page. Treat it as unreadable. Omitted on the last page.
    CompleteExamRecordsRequest:
      description: Completes a Sitting's records.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - acknowledged_evidence_revision
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The completion `revision` you read. The request fails if it changed since.
        acknowledged_evidence_revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The `evidence_revision` you reviewed. It must equal the current one, which confirms you have seen
            all accepted evidence.
    WaiveSubmissionReviewRequest:
      description: Records that a Submission's current inventory needs no finalized Review.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - expected_review_revision
        - expected_discrepancy_count
        - reason_code
        - private_reason
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: The waiver `revision` you read, or 0 when no waiver exists yet.
        expected_review_revision:
          type: integer
          format: int64
          minimum: 0
          description: The Review revision you read. The request fails if the Review changed since.
        expected_discrepancy_count:
          type: integer
          format: int64
          minimum: 0
          description: The number of integrity discrepancies you reviewed. The request fails if it changed.
        reason_code:
          type: string
          enum:
            - institution_request
            - integrity_review
            - records_review
            - review_not_required
            - case_closed
            - mistake
            - other
          description: Reason code for the audit log. Put case details only in the matching private reason field.
        private_reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Private reason from the Institution, with no leading or trailing spaces. At most 4,000 UTF-8 bytes.
            It is never written to the ordinary audit log.
        expected_delivery_inventory_revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          default: 0
          description: >-
            The `delivery_inventory_revision` from the current private Review snapshot, also when no Review
            exists. Leaving it out means 0, which fails if the delivery changed late.
    CreateRetentionHoldRequest:
      type: object
      additionalProperties: false
      required:
        - reason_code
        - private_reason
      properties:
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: Sitting to hold. Leave it out, together with `submission_id`, to hold the whole Exam.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: Submission to hold. Needs `exam_sitting_id`.
        until:
          type: string
          format: date-time
          description: >-
            Optional. When the hold is due for review, which must be in the future. When it passes the hold shows
            `due_for_review: true` and stays in force until a person releases it. Null is rejected.
        reason_code:
          type: string
          enum:
            - institution_request
            - integrity_review
            - records_review
            - review_not_required
            - case_closed
            - mistake
            - other
          description: Reason code for the audit log. Put case details only in the matching private reason field.
        private_reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Private reason from the Institution, with no leading or trailing spaces. At most 4,000 UTF-8 bytes.
            It is never written to the ordinary audit log.
      description: >-
        Leave out both IDs for an Exam hold, send the Sitting ID for a Sitting hold, or send both for a single
        Submission hold. null and empty IDs are rejected.
    ReleaseRetentionHoldRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - reason_code
        - private_reason
      properties:
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: Sitting the hold was created on, if any.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: Submission the hold was created on, if any.
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The hold `revision` you read. The request fails if the hold changed since.
        reason_code:
          type: string
          enum:
            - institution_request
            - integrity_review
            - records_review
            - review_not_required
            - case_closed
            - mistake
            - other
          description: Reason code for the audit log. Put case details only in the matching private reason field.
        private_reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Private reason from the Institution, with no leading or trailing spaces. At most 4,000 UTF-8 bytes.
            It is never written to the ordinary audit log.
      description: >-
        Send the same scope that was used to create the hold. Releasing never restores content already
        retired.
