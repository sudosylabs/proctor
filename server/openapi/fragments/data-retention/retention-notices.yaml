paths:
  /api/v1/users/me/retention-notices:
    get:
      operationId: listRetentionNotices
      summary: List my retention notices
      tags:
        - Data retention
      description: >-
        Returns the signed-in User's own notices about records entering deletion grace, with each notice's
        cancellation and delivery status. A notice grants no access to examination records. Reading it doesn't
        acknowledge delivery or change cleanup. Responsible Exam Managers and Institution operators get
        notices by default. Candidates get them only when the policy turns candidate notices on. When grace is
        canceled, the dates a notice gave no longer apply. Each notice names the Exam title and the Sitting's
        scheduled times so the recipient can tell which records it covers. It includes no candidate, answer or
        evidence content.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - request.invalid
        - retention.invalid
        - retention.unavailable
        - retention_policy.revision_conflict
        - retention_policy.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - in: query
          name: limit
          description: Maximum number of notices to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - in: query
          name: cursor
          description: The `next_cursor` value from the previous page. Treat it as an unreadable token and pass it unchanged.
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          $ref: '#/components/responses/RetentionNoticesOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
components:
  responses:
    RetentionNoticesOK:
      description: One page of the caller's retention notices.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetentionNoticesResponse'
          example:
            items:
              - retirement_id: 5ebqfbnezgahdbx9oy7rfr6oro
                exam_id: xpq79ar61ncrjiouey6d9tgp91
                exam_sitting_id: 17778cuf6b17rhtapprfjozet8
                submission_id: zq993bky9h3uj4saw8iywi38cy
                exam_title: Introduction to Databases final
                sitting_start_at: '2026-05-12T09:00:00Z'
                sitting_end_at: '2026-05-12T11:00:00Z'
                category: work
                state: grace
                created_at: '2026-08-01T00:00:00Z'
                retire_after: '2026-08-08T00:00:00Z'
                delivery_state: accepted
  schemas:
    RetentionNoticeResponse:
      description: A notice that one category of a Submission's records has entered deletion grace.
      type: object
      additionalProperties: false
      required:
        - retirement_id
        - exam_id
        - exam_sitting_id
        - submission_id
        - exam_title
        - sitting_start_at
        - sitting_end_at
        - category
        - state
        - created_at
        - retire_after
        - delivery_state
      properties:
        retirement_id:
          $ref: '#/components/schemas/ID'
          description: >-
            ID of the scheduled Record Retirement the notice is about. Pages are ordered by this ID.
        exam_id:
          $ref: '#/components/schemas/ID'
          description: Exam the records belong to.
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: Sitting the records belong to.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: Submission whose records are due to be retired.
        exam_title:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Title of the Exam revision the Sitting delivered. It can't change. Every recipient of the notice sees
            it, even one who no longer has access to the Exam.
        sitting_start_at:
          type: string
          format: date-time
          description: Scheduled start of the Sitting whose records the notice covers.
        sitting_end_at:
          type: string
          format: date-time
          description: Scheduled end of the Sitting whose records the notice covers.
        category:
          type: string
          enum:
            - work
            - integrity
            - browser_activity
            - security_operational
          description: >-
            Which records are due to be retired: the work, the integrity evidence, the Browser Activity or the
            security operational data of the Submission.
        state:
          type: string
          enum:
            - grace
            - canceled
            - retired
          description: >-
            `grace` means retirement is scheduled and waits for `retire_after`. `canceled` means the scheduled
            retirement was called off. `retired` means the records were removed.
        created_at:
          type: string
          format: date-time
          description: Time the notice was created.
        retire_after:
          type: string
          format: date-time
          description: >-
            Earliest time the records may be retired. It no longer applies once the retirement is canceled.
        canceled_at:
          type: string
          format: date-time
          description: Time the notice was canceled. Omitted unless it was canceled.
        delivery_state:
          type: string
          enum:
            - pending
            - queued
            - sending
            - accepted
            - suppressed
            - failed
            - canceled
          description: >-
            Status of the notice email. `pending` means the email hasn't been queued yet. The other values are
            mail delivery states. Delivery doesn't mean the recipient read it.
        delivery_error_code:
          type: string
          maxLength: 128
          description: Public reason the notice email failed or was suppressed. Omitted when there is none.
    RetentionNoticesResponse:
      description: One page of retention notices.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RetentionNoticeResponse'
          description: Notices on this page, in retirement ID order.
        next_cursor:
          type: string
          maxLength: 256
          description: >-
            Token to pass as `cursor` to read the next page. Treat it as unreadable. Omitted on the last page.
