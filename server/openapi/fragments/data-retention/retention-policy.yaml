paths:
  /api/v1/retention-policy:
    get:
      operationId: getRetentionPolicy
      summary: Get the Institution Retention Policy
      tags:
        - Data retention
      description: >-
        Returns the Institution's retention settings. The caller needs `retention_policy.view` through a
        Session. Personal Access Tokens can't read it. Examination and audit periods start at zero, which
        means no expiry is configured, never immediate deletion. `automatic_deletion_enabled` reflects a
        separate cleanup approval for the current revision. Saving settings never turns cleanup on.
        Examination periods start at the current Sitting Records Completion. Retention Holds, supporting
        integrity evidence and exports being built can protect individual records. Temporary exports need a
        lifetime of one to seven days. Backups and earlier object versions that operators keep are outside
        cleanup.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - retention_policy.unavailable
        - resource.not_found
        - retention_policy.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/RetentionPolicyOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceRetentionPolicy
      summary: Replace the Institution Retention Policy
      tags:
        - Data retention
      description: >-
        Replaces the whole policy. Send the revision you read as `expected_revision`. The caller needs a
        strong, recent interactive system-administrator Session and an `Idempotency-Key`, and every change is
        audited. The policy, its audit record and the idempotent result are saved together. Every write,
        including one that changes nothing and an exact retry, checks again at write time that the caller's
        credential, protected administrator Role and strong recent sign-in are still valid. A stale revision
        fails with `retention_policy.revision_conflict` and reports `current_revision`. An exact retry returns
        the recorded result after authorization is checked again. A write that changes nothing keeps the
        revision and timestamps. All periods are required integers. Export retention accepts 0 when it isn't
        configured, or a lifetime of 1 to 7 days. Other periods accept 0 to 36500. That upper limit is a
        technical limit, not a recommended period. A day means 24 hours. Zero leaves a period unconfigured,
        and no export can be created while the export lifetime is unconfigured. A real change to the settings
        pauses approved cleanup and cancels pending grace. A new Retention Preview and a new approval are
        needed before cleanup schedules anything again. `candidate_notices` defaults to false when omitted,
        and null is rejected.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request PUT \
              --url 'https://proctor.example.edu/api/v1/retention-policy' \
              --header 'Authorization: Bearer <interactive-system-administrator-session>' \
              --header 'Content-Type: application/json' \
              --header 'Idempotency-Key: docs-retention-policy-001' \
              --data '{"expected_revision":1,"submission_retention_days":0,"integrity_retention_days":0,"audit_retention_days":0,"export_retention_days":0,"deletion_grace_days":0}'
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - request.invalid
        - retention_policy.invalid
        - retention_policy.revision_conflict
        - retention_policy.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReplaceRetentionPolicy'
      responses:
        "200":
          $ref: '#/components/responses/RetentionPolicyOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ReplaceRetentionPolicy:
      required: true
      description: The complete policy. Every period is required, including zero values. This request can't turn on automatic deletion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyRequest'
          example:
            expected_revision: 1
            submission_retention_days: 0
            integrity_retention_days: 0
            browser_activity_retention_days: 0
            security_operational_retention_days: 0
            audit_retention_days: 0
            export_retention_days: 0
            deletion_grace_days: 0
  responses:
    RetentionPolicyOK:
      description: The Institution's retention settings and whether cleanup is currently approved.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetentionPolicyResponse'
          example:
            revision: 1
            submission_retention_days: 0
            integrity_retention_days: 0
            browser_activity_retention_days: 0
            security_operational_retention_days: 0
            audit_retention_days: 0
            export_retention_days: 0
            deletion_grace_days: 0
            candidate_notices: false
            automatic_deletion_enabled: false
            created_at: '2026-08-01T12:00:00Z'
            updated_at: '2026-08-01T12:00:00Z'
  schemas:
    RetentionPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - submission_retention_days
        - integrity_retention_days
        - browser_activity_retention_days
        - security_operational_retention_days
        - audit_retention_days
        - export_retention_days
        - deletion_grace_days
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The policy revision you read before editing. If the policy changed since, the request fails
            instead of overwriting newer settings.
        submission_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep Submission work after the current Sitting Records Completion. Zero keeps it with no
            expiry. Supporting integrity evidence, Retention Holds and source protections can keep it longer.
        integrity_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep integrity evidence, Reviews and released remarks after the current Sitting Records
            Completion. Zero keeps them with no expiry. Unresolved Reviews block completion.
        browser_activity_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep Browser Activity after the current Sitting Records Completion. Zero means no expiry
            is configured. Deletion still needs approval, a grace period, completion and no Retention Hold.
        security_operational_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep security operational data after the current Sitting Records Completion. Zero means no
            expiry is configured. Deletion still needs approval, a grace period, completion and no Retention
            Hold.
        audit_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep each completed audit or receipt event, counted from that event. Zero keeps them with
            no expiry. Unfinished work and records that still refer to them keep them longer.
        export_retention_days:
          type: integer
          minimum: 0
          maximum: 7
          description: >-
            Days a temporary export archive is kept. Creating an export needs a value from 1 to 7, so with 0
            no export can be created. An existing archive keeps the expiry set when it was requested.
        deletion_grace_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days each record waits in grace before cleanup may retire it. Cleanup can only be approved when
            this is above zero. Zero means not configured and never allows immediate deletion. Seven days is
            the suggested starting value.
        candidate_notices:
          type: boolean
          default: false
          description: >-
            Also notify candidates when their records enter grace. Exam Managers and operators are always
            notified.
    RetentionPolicyResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - submission_retention_days
        - integrity_retention_days
        - browser_activity_retention_days
        - security_operational_retention_days
        - audit_retention_days
        - export_retention_days
        - deletion_grace_days
        - candidate_notices
        - automatic_deletion_enabled
        - created_at
        - updated_at
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Current policy revision. Send it as `expected_revision` when you replace the policy.
        submission_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep Submission work after the current Sitting Records Completion. Zero keeps it with no
            expiry. Integrity evidence it supports and Retention Holds still protect it.
        integrity_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep integrity evidence, Reviews and released remarks after the current Sitting Records
            Completion. Zero keeps them with no expiry.
        browser_activity_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep Browser Activity after the current Sitting Records Completion. Zero means no expiry
            is configured. Deletion still needs approval, a grace period, completion and no Retention Hold.
        security_operational_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep security operational data after the current Sitting Records Completion. Zero means no
            expiry is configured. Deletion still needs approval, a grace period, completion and no Retention
            Hold.
        audit_retention_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days to keep completed audit and receipt events, counted from each event. Unfinished work and
            records that still refer to them keep them longer. Zero keeps them with no expiry.
        export_retention_days:
          type: integer
          minimum: 0
          maximum: 7
          description: >-
            Days a temporary export archive is kept. Creating an export needs 1 to 7 days. An existing archive
            keeps the expiry set when it was requested.
        deletion_grace_days:
          type: integer
          minimum: 0
          maximum: 36500
          description: >-
            Days each record waits in grace before it is retired. Zero means not configured, and then cleanup
            can't be approved.
        candidate_notices:
          type: boolean
          description: Whether candidates are notified too. Exam Managers and operators are always notified.
        automatic_deletion_enabled:
          type: boolean
          readOnly: true
          description: >-
            True only when a separate cleanup approval is active for this exact policy revision and the grace
            period is above zero. It can't be set directly.
        created_at:
          type: string
          format: date-time
          description: Time the policy was first created.
        updated_at:
          type: string
          format: date-time
          description: Time the policy last changed.
