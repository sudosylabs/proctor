paths:
  /api/v1/retention/control:
    get:
      operationId: getRetentionControl
      summary: Get cleanup approval
      tags:
        - Data retention
      description: >-
        Returns whether recurring cleanup is approved. The caller needs `retention_policy.view`. Approval is
        kept apart from the policy settings. While the control is `disabled` or `paused`, nothing is scheduled
        for retirement.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - retention.invalid
        - retention.unavailable
        - retention_policy.unavailable
        - resource.not_found
        - retention_policy.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/RetentionControlOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
    put:
      operationId: changeRetentionControl
      summary: Enable or pause institution cleanup
      tags:
        - Data retention
      description: >-
        Turns recurring cleanup on or pauses it. The caller needs `retention_cleanup.manage` and a strong,
        recent system-administrator sign-in. Enabling ties the approval to a fresh Retention Preview of the
        exact policy revision, and the policy's grace period must be above zero. Every change to the control
        cancels existing grace. Eligible records get a new grace period when scheduling resumes. Pausing can't
        undo retirement that already happened, and doesn't stop the removal of stored files for records
        already retired. An exact retry returns the recorded result after authorization is checked again.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - request.invalid
        - retention.invalid
        - retention.conflict
        - retention.unavailable
        - retention_policy.unavailable
        - retention_policy.revision_conflict
        - resource.not_found
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.strong_required
        - authentication.reauthentication_required
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/RetentionControlOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        $ref: '#/components/requestBodies/ChangeRetentionControl'
  /api/v1/retention/previews:
    post:
      operationId: createRetentionPreview
      summary: Preview retention eligibility
      tags:
        - Data retention
      description: >-
        Creates a Retention Preview for the given current policy revision. The caller needs
        `retention_policy.view`, and the request is written to the critical audit log. The preview lasts one
        hour and holds counts only, never content. The counts show records that are incomplete, waiting for
        their deadline, held, needed as supporting integrity evidence, protected by an export or already
        retired. Creating a preview never schedules anything for deletion.
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - request.invalid
        - retention.invalid
        - retention.conflict
        - retention.unavailable
        - retention_policy.unavailable
        - retention_policy.revision_conflict
        - resource.not_found
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '201':
          $ref: '#/components/responses/RetentionPreviewOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        $ref: '#/components/requestBodies/CreateRetentionPreview'
  /api/v1/retention/previews/{retention_preview_id}:
    get:
      operationId: getRetentionPreview
      summary: Get a retention preview
      tags:
        - Data retention
      description: >-
        Returns a Retention Preview as it was created, with its expiry. The caller needs
        `retention_policy.view`. Records may have changed since, which can change what is eligible. Every
        scheduling and final retirement step checks the live records again.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - retention.invalid
        - retention.unavailable
        - retention_policy.unavailable
        - resource.not_found
        - retention_policy.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: retention_preview_id
          in: path
          description: ID returned when the preview was created. Reading the preview doesn't extend its expiry.
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          $ref: '#/components/responses/RetentionPreviewOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/v1/retention/records/export:
    get:
      operationId: exportRetentionRecords
      summary: Download every retention record as CSV
      tags:
        - Data retention
      description: >-
        Returns every retention record of the Institution as CSV, one row per category of each Submission, with
        the Exam's title, the eligibility each page was read at (`as_of`) and the policy revision. It holds no
        content. The caller needs `retention_policy.view`. An Institution with more than 50,000 Submissions is
        refused with `retention.invalid`; page the records listing instead. Values a spreadsheet would read as a
        formula start with an apostrophe. Each export is audited.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - retention.invalid
        - retention.unavailable
        - retention_policy.unavailable
        - resource.not_found
        - retention_policy.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The records as CSV
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            text/csv:
              schema:
                type: string
              example: |
                exam_id,exam_title,exam_sitting_id,submission_id,category,blocker,eligible_at,held,completion_current,retired_at,policy_revision,as_of
                xpq79ar61ncrjiouey6d9tgp91,Algorithms final,17778cuf6b17rhtapprfjozet8,zq993bky9h3uj4saw8iywi38cy,work,retention_period,2027-06-01T12:00:00Z,false,true,,3,2026-09-01T12:00:00Z
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/retention/holds:
    get:
      operationId: listInstitutionRetentionHolds
      summary: List the Institution's Retention Holds
      tags:
        - Data retention
      description: >-
        Lists every Retention Hold of the Institution by ID, each with its Exam and who placed it. Released holds
        are left out unless `include_released=true`. The caller needs `retention_policy.view`. Private reasons
        stay on the Exam's own hold listing. A hold whose `until` has passed shows `due_for_review: true` and
        still protects its records.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - retention.invalid
        - retention.unavailable
        - retention_policy.unavailable
        - resource.not_found
        - retention_policy.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: exam_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ID'
          description: Keeps the holds on this Exam.
        - name: include_released
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include released holds as well as holds that still protect records.
        - name: reason_code
          in: query
          required: false
          description: Keep only holds placed for this reason.
          schema:
            type: string
            enum:
              - institution_request
              - integrity_review
              - records_review
              - review_not_required
              - case_closed
              - mistake
              - other
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One page of Retention Holds
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionHoldListResponse'
              example:
                items:
                  - id: yftfs48pasu5fd6czhcwz6b4x3
                    exam:
                      id: xpq79ar61ncrjiouey6d9tgp91
                      display_name: Algorithms final
                    exam_sitting_id: 4z3cy1rp9cucq7qo1g9mq94dj3
                    revision: 1
                    created_at: '2026-09-01T10:00:00Z'
                    created_by:
                      id: dpbj4ddm3hw8fkicm7nuazihkg
                      display_name: Priya Raman
                    reason_code: institution_request
                    until: '2026-12-01T00:00:00Z'
                    due_for_review: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/retention/records:
    get:
      operationId: listRetentionRecords
      summary: List retention eligibility and retirement status
      tags:
        - Data retention
      description: >-
        Lists the retention status of each Submission's records. The caller needs `retention_policy.view`.
        File names, answers, evidence and remarks are never included. By default, `limit` counts Submissions,
        and each Submission adds four items covering work, integrity, Browser Activity and security operational
        records. Set `group_by=exam` to count records by category for each Exam. In that mode, `limit` counts
        Exams and the response orders them by Exam ID. A cursor continues only the grouping that issued it. A retired category stays retired even after its detailed receipt
        expires. `purge_verified` counts come from a separate check that the stored objects are gone from
        current storage. They don't certify secure erasure of the storage media, or removal from backups,
        earlier object versions or downloads already in progress.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - retention.invalid
        - retention.unavailable
        - retention_policy.unavailable
        - resource.not_found
        - retention_policy.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: group_by
          in: query
          description: Set to `exam` for per-Exam summaries. Omit it to list records by Submission.
          schema:
            type: string
            enum: [exam]
        - $ref: '#/components/parameters/PageLimit'
        - name: cursor
          in: query
          description: The `next_cursor` value from the previous page. Treat it as an unreadable token and pass it unchanged.
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          $ref: '#/components/responses/RetentionRecordsOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
components:
  requestBodies:
    ChangeRetentionControl:
      description: >-
        The current control and policy revisions and the state you want. Enabling also needs an unexpired
        Retention Preview of that policy revision.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetentionControlRequest'
          example:
            expected_revision: 1
            expected_policy_revision: 1
            preview_id: 4cbxoynrnbnzpkfcghhsy3qxuy
            state: enabled
    CreateRetentionPreview:
      description: The current policy revision to assess. The preview lasts one hour and doesn't turn on cleanup.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetentionPreviewRequest'
          example:
            expected_revision: 1
  responses:
    RetentionControlOK:
      description: The cleanup control and the policy revision it approves.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
