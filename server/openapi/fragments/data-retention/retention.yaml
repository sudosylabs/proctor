  schemas:
    RetentionControlRequest:
      description: A change to the cleanup control.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - expected_policy_revision
        - state
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The control revision you read. The request fails if the control changed since.
        expected_policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: The policy revision you reviewed. The request fails if the policy changed since.
        preview_id:
          $ref: '#/components/schemas/ID'
          description: Retention Preview to approve cleanup with. Required to enable, omitted when pausing.
        state:
          type: string
          enum:
            - enabled
            - paused
          description: >-
            `enabled` turns recurring cleanup on. `paused` stops new scheduling.
    RetentionPreviewRequest:
      description: Which policy revision a new Retention Preview assesses.
      type: object
      additionalProperties: false
      required:
        - expected_revision
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The current policy revision to assess. The request fails if the policy changed since.
        proposed_policy:
          $ref: '#/components/schemas/RetentionProposedPolicy'
    RetentionProposedPolicy:
      description: >-
        Optional settings to preview before saving them, with the same members as the Retention Policy PUT body
        except `expected_revision`. Every member must be present and not null, or the request is refused with
        `request.invalid`. The preview counts the current records under these
        settings and is marked `proposed`.
      type: object
      additionalProperties: false
      required:
        - submission_retention_days
        - integrity_retention_days
        - browser_activity_retention_days
        - security_operational_retention_days
        - audit_retention_days
        - export_retention_days
        - deletion_grace_days
        - candidate_notices
      properties:
        submission_retention_days:
          type: integer
          minimum: 0
        integrity_retention_days:
          type: integer
          minimum: 0
        browser_activity_retention_days:
          type: integer
          minimum: 0
        security_operational_retention_days:
          type: integer
          minimum: 0
        audit_retention_days:
          type: integer
          minimum: 0
        export_retention_days:
          type: integer
          minimum: 0
        deletion_grace_days:
          type: integer
          minimum: 0
        candidate_notices:
          type: boolean
    RetentionControlResponse:
      description: Whether recurring cleanup is approved, and for which policy revision.
      type: object
      additionalProperties: false
      required:
        - revision
        - state
        - updated_at
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Current control revision. Send it as `expected_revision` when you change the control.
        state:
          type: string
          enum:
            - disabled
            - enabled
            - paused
          description: >-
            `disabled` means no cleanup approval exists. `enabled` means cleanup runs for the approved policy
            revision. `paused` means an approval exists but scheduling is stopped.
        approved_policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Policy revision the approval applies to. Omitted while `disabled`.
        approved_preview_id:
          $ref: '#/components/schemas/ID'
          description: Retention Preview the approval was based on. Omitted while `disabled`.
        updated_at:
          type: string
          format: date-time
          description: Time the control last changed.
    RetentionPreviewCounts:
      description: >-
        Counts for one record category. Each record is counted once, under the first reason that applies, so
        the other counts add up to `total`.
      type: object
      additionalProperties: false
      required:
        - total
        - eligible
        - awaiting_deadline
        - incomplete
        - held
        - unconfigured
        - supporting_work
        - export_protected
        - retired
        - eligible_exams
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: Number of records in the category.
        eligible:
          type: integer
          format: int64
          minimum: 0
          description: Records that cleanup could retire now.
        awaiting_deadline:
          type: integer
          format: int64
          minimum: 0
          description: Records whose retention period hasn't ended yet.
        incomplete:
          type: integer
          format: int64
          minimum: 0
          description: Records whose Sitting has no current Sitting Records Completion.
        held:
          type: integer
          format: int64
          minimum: 0
          description: Records protected by a Retention Hold.
        unconfigured:
          type: integer
          format: int64
          minimum: 0
          description: Records whose category has no retention period configured.
        supporting_work:
          type: integer
          format: int64
          minimum: 0
          description: Work kept because it supports integrity evidence that has no expiry.
        export_protected:
          type: integer
          format: int64
          minimum: 0
          description: Records protected because an export that includes them is being built.
        retired:
          type: integer
          format: int64
          minimum: 0
          description: Records already retired.
        eligible_exams:
          type: integer
          format: int64
          minimum: 0
          description: How many distinct Exams have at least one `eligible` record in this category.
    RetentionPreviewResponse:
      description: A one-hour Retention Preview of one policy revision. It holds counts only, never content.
      type: object
      additionalProperties: false
      required:
        - id
        - policy_revision
        - proposed
        - created_at
        - expires_at
        - work
        - integrity
        - audit
        - receipts
        - browser_activity
        - security_operational
      properties:
        audit:
          $ref: '#/components/schemas/RetentionExpiryCounts'
          description: Counts for completed audit records.
        receipts:
          $ref: '#/components/schemas/RetentionExpiryCounts'
          description: Counts for Record Retirement receipts.
        id:
          $ref: '#/components/schemas/ID'
          description: ID of the preview. Send it as `preview_id` to approve cleanup.
        policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Policy revision the preview assessed.
        proposed:
          type: boolean
          description: >-
            True when the preview counted unsaved settings from `proposed_policy` against this revision's records. A
            proposed preview shows what a change would do and can't be used to approve cleanup.
        created_at:
          type: string
          format: date-time
          description: Time the preview was created.
        expires_at:
          type: string
          format: date-time
          description: Time after which the preview can no longer be used to approve cleanup.
        work:
          $ref: '#/components/schemas/RetentionPreviewCounts'
          description: Counts for Submission work.
        integrity:
          $ref: '#/components/schemas/RetentionPreviewCounts'
          description: Counts for integrity evidence and Reviews.
        browser_activity:
          $ref: '#/components/schemas/RetentionPreviewCounts'
          description: Counts for Browser Activity.
        security_operational:
          $ref: '#/components/schemas/RetentionPreviewCounts'
          description: Counts for security operational data.
    RetentionExpiryCounts:
      description: >-
        Counts for audit records or retirement receipts. Each record is counted once, under the first reason
        that applies, so the other counts add up to `total`.
      type: object
      additionalProperties: false
      required:
        - total
        - eligible
        - awaiting_deadline
        - unconfigured
        - unfinished
        - referenced
        - held
        - purge_pending
        - source_protected
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: Number of records.
        eligible:
          type: integer
          format: int64
          minimum: 0
          description: Records that could expire now.
        awaiting_deadline:
          type: integer
          format: int64
          minimum: 0
          description: Records whose retention period hasn't ended yet.
        unconfigured:
          type: integer
          format: int64
          minimum: 0
          description: Records with no audit retention period configured.
        unfinished:
          type: integer
          format: int64
          minimum: 0
          description: Records whose audited work hasn't finished.
        referenced:
          type: integer
          format: int64
          minimum: 0
          description: Records that other records still refer to.
        held:
          type: integer
          format: int64
          minimum: 0
          description: Records protected by a Retention Hold.
        purge_pending:
          type: integer
          format: int64
          minimum: 0
          description: Receipts whose retired files are still waiting to be removed from storage.
        source_protected:
          type: integer
          format: int64
          minimum: 0
          description: Records protected because an export that relies on them is being built.
    RetentionRetirement:
      description: >-
        The scheduled or completed retirement of one category of a Submission's records. After retirement it
        remains as a short receipt with no content.
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - policy_revision
        - control_revision
        - completion_revision
        - scheduled_at
        - retire_after
        - purge_pending
        - purge_verified
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: ID of the Record Retirement.
        state:
          type: string
          enum:
            - grace
            - canceled
            - retired
          description: >-
            `grace` means retirement is scheduled and waits for `retire_after`. `canceled` means it was called
            off. `retired` means the records were removed.
        policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Policy revision in force when the retirement was scheduled.
        control_revision:
          type: integer
          format: int64
          minimum: 1
          description: Cleanup control revision that approved the retirement.
        completion_revision:
          type: integer
          format: int64
          minimum: 1
          description: Sitting Records Completion revision the retirement was based on.
        scheduled_at:
          type: string
          format: date-time
          description: Time the retirement was scheduled.
        retire_after:
          type: string
          format: date-time
          description: Earliest time the records may be retired.
        retired_at:
          type: string
          format: date-time
          description: Time the records were retired. Omitted unless `state` is `retired`.
        purge_pending:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of stored objects of the retired records still waiting to be removed from storage.
        purge_verified:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of stored objects confirmed gone from current storage. This doesn't cover backups or
            earlier object versions.
    RetentionExamSummary:
      description: One Exam's retention records, counted by category as a preview counts them.
      type: object
      additionalProperties: false
      required:
        - exam
        - work
        - integrity
        - browser_activity
        - security_operational
      properties:
        exam:
          $ref: '#/components/schemas/ExamRef'
        work:
          $ref: '#/components/schemas/RetentionPreviewCounts'
        integrity:
          $ref: '#/components/schemas/RetentionPreviewCounts'
        browser_activity:
          $ref: '#/components/schemas/RetentionPreviewCounts'
        security_operational:
          $ref: '#/components/schemas/RetentionPreviewCounts'
    RetentionExamSummariesResponse:
      description: >-
        One page of the Exams that have records, by Exam ID. In each, `eligible_exams` is 1 when the Exam has an
        eligible record in that category.
      type: object
      additionalProperties: false
      required:
        - policy_revision
        - as_of
        - items
      properties:
        policy_revision:
          type: integer
          format: int64
          minimum: 1
        as_of:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/RetentionExamSummary'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    RetentionHoldListItem:
      description: >-
        One Retention Hold of the Institution. It carries the reason codes but never the private reasons, which stay
        on the Exam's own hold listing.
      type: object
      additionalProperties: false
      required:
        - id
        - exam
        - revision
        - created_at
        - reason_code
        - due_for_review
      properties:
        id:
          $ref: '#/components/schemas/ID'
        exam:
          $ref: '#/components/schemas/ExamRef'
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: Held Sitting, or the Sitting of the held Submission. Omitted for an Exam hold.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: Held Submission. Present only for a Submission hold.
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/PersonRef'
        reason_code:
          type: string
          enum:
            - institution_request
            - integrity_review
            - records_review
            - review_not_required
            - case_closed
            - mistake
            - other
        until:
          type: string
          format: date-time
          description: When the hold is due for review. Omitted when none was set.
        due_for_review:
          type: boolean
          description: True when the hold is unreleased and `until` has passed. It still protects its records.
        released_at:
          type: string
          format: date-time
        released_by:
          $ref: '#/components/schemas/PersonRef'
        release_reason_code:
          type: string
          enum:
            - institution_request
            - integrity_review
            - records_review
            - review_not_required
            - case_closed
            - mistake
            - other
    RetentionHoldListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RetentionHoldListItem'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    RetentionRecord:
      description: Retention status of one category of one Submission's records. It contains no content.
      type: object
      additionalProperties: false
      required:
        - exam_id
        - exam
        - exam_sitting_id
        - submission_id
        - category
        - completion_revision
        - completion_current
        - has_integrity
        - held
        - shared_published_objects
        - blocker
      properties:
        exam:
          $ref: '#/components/schemas/ExamRef'
        exam_id:
          $ref: '#/components/schemas/ID'
          description: Exam the records belong to.
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: Sitting the records belong to.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: Submission the records belong to.
        category:
          type: string
          enum:
            - work
            - integrity
            - browser_activity
            - security_operational
          description: Which of the Submission's records this item covers.
        completion_revision:
          type: integer
          format: int64
          minimum: 0
          description: Revision of the Sitting's records completion.
        completed_at:
          type: string
          format: date-time
          description: Time the Sitting's records were last completed. Omitted if they were never completed.
        completion_current:
          type: boolean
          description: >-
            True when the Sitting's records completion is current. A stale or missing completion blocks
            retention.
        has_integrity:
          type: boolean
          description: True when the Submission has integrity evidence.
        held:
          type: boolean
          description: True when a Retention Hold covers these records.
        export_protected_until:
          type: string
          format: date-time
          description: >-
            Time until which an export being built protects these records. Omitted when no export protects
            them.
        retired_at:
          type: string
          format: date-time
          description: Time these records were retired. Omitted until then.
        shared_published_objects:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of shared published files the work refers to. They survive work retirement, which only
            releases the Submission's reference to them.
        blocker:
          type: string
          enum:
            - ''
            - retired
            - records_incomplete
            - preservation_hold
            - retention_unconfigured
            - supporting_integrity
            - export_in_progress
            - retention_period
          description: >-
            First reason the records can't be retired yet. Empty when they are eligible now.
            `retention_period` means the period hasn't ended. `export_in_progress` means an export is being
            built from them. `supporting_integrity` means the work supports integrity evidence with no expiry.
        eligible_at:
          type: string
          format: date-time
          description: >-
            Time the retention period ends and the records become eligible. Omitted when no period applies.
        retirement:
          $ref: '#/components/schemas/RetentionRetirement'
          description: The scheduled or completed retirement of these records. Omitted when there is none.
    RetentionRecordsResponse:
      description: One page of retention records.
      type: object
      additionalProperties: false
      required:
        - policy_revision
        - as_of
        - items
      properties:
        policy_revision:
          type: integer
          format: int64
          minimum: 1
          description: Policy revision the statuses were worked out with.
        as_of:
          type: string
          format: date-time
          description: Time the statuses were worked out.
        items:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/RetentionRecord'
          description: >-
            Records on this page, four per Submission, in the order work, integrity, Browser Activity,
            security operational.
        next_cursor:
          type: string
          maxLength: 256
          description: >-
            Token to pass as `cursor` to read the next page. Treat it as unreadable. Omitted on the last page.
