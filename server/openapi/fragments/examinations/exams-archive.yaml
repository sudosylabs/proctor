paths:
  /api/v1/exams/{exam_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    post:
      operationId: archiveExam
      summary: Archive an active Exam
      description: >-
        Archives an active Exam. The change is made only if expected_revision still matches the Exam's current revision, so a Manager working from an old copy can't hide newer work. Archiving keeps the Draft, published Revisions, Manager history, Sittings, Attempts and audit history.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.revision_conflict
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ArchiveExam'
      responses:
        "200":
          $ref: '#/components/responses/ExamIdentityOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ArchiveExam:
      required: true
      description: The Exam revision you last saw.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArchiveExamRequest'
          example:
            expected_revision: 3
  responses:
    ExamIdentityOK:
      description: The archived Exam.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamIdentityResponse'
          example:
            id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
            academic_unit_id: q4nzk1xwe7rbdg3cyjoth5mupa
            creator_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
            owner_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
            default_revision_id: t1oekp5dqa7nwrzhcx3by9mug4
            created_at: '2026-07-20T10:00:00Z'
            updated_at: '2026-09-30T17:00:00Z'
            archived_at: '2026-09-30T17:00:00Z'
            revision: 4
  schemas:
    ArchiveExamRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Exam revision you last saw. If the Exam has changed since, the request fails with a conflict.
