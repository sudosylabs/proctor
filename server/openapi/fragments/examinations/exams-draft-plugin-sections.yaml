paths:
  /api/v1/exams/{exam_id}/draft/plugin-sections/{plugin_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/PluginID'
    get:
      operationId: getExamDraftPluginSection
      summary: Get one plugin's section on the active Exam Draft
      description: >-
        Returns the section the Draft holds for the plugin, if any, and the JSON Schema the plugin publishes for
        its authoring form, if the plugin is active and offers a section. The schema is served as the plugin
        published it; the plugin, not the schema, decides what a save accepts. Reading never asks the plugin to
        validate anything.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.unavailable
        - exam.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamDraftPluginSectionOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceExamDraftPluginSection
      summary: Replace one plugin's section on the active Exam Draft
      description: >-
        Sets the plugin's section on the mutable Draft at the expected revision, or removes it when section is
        null. A section is a JSON object of at most 64 KiB that the server keeps in canonical form, so a
        different spelling of the current section is exam.draft.no_changes. It is saved only while the plugin is
        active and offers a section (otherwise exam.plugin_section.plugin_inactive) and only if the plugin
        accepts it (otherwise exam.plugin_section.invalid; the plugin's reason is not shown). Removing a section
        never asks the plugin. Publication asks the plugin again and freezes the section into the Revision.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.plugin_section.invalid
        - exam.plugin_section.plugin_inactive
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReplaceExamDraftPluginSection'
      responses:
        "200":
          $ref: '#/components/responses/ExamOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ReplaceExamDraftPluginSection:
      required: true
      description: Supplies the expected Draft revision and the plugin's complete section, or null to remove it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplaceExamDraftPluginSectionRequest'
          example:
            expected_revision: 4
            section:
              image: go-1.25
              network: none
              record_input: true
  responses:
    ExamDraftPluginSectionOK:
      description: One plugin's section on the Exam Draft and the plugin's schema for it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamDraftPluginSectionResponse'
  schemas:
    ReplaceExamDraftPluginSectionRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - section
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
        section:
          $ref: '#/components/schemas/ReplacementExamPluginSection'
    ReplacementExamPluginSection:
      type:
        - object
        - 'null'
      description: The plugin's complete section, or null to remove it.
      additionalProperties: true
    ExamDraftPluginSectionResponse:
      type: object
      additionalProperties: false
      required:
        - exam_id
        - plugin_id
        - draft_revision
      properties:
        exam_id:
          $ref: '#/components/schemas/ID'
        plugin_id:
          type: string
          pattern: ^[a-z][a-z0-9.-]{0,63}$
        draft_revision:
          type: integer
          format: int64
          minimum: 1
        section:
          $ref: '#/components/schemas/ExamPluginSection'
        schema:
          type: string
          maxLength: 65536
          description: >-
            The plugin's JSON Schema for the section, as the JSON text it published. Absent while the plugin is
            off, has failed, or offers no section.
