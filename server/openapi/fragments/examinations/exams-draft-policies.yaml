paths:
  /api/v1/exams/{exam_id}/draft/browser-policy:
    parameters:
      - $ref: "#/components/parameters/ExamID"
    put:
      operationId: configureExamDraftBrowserPolicy
      summary: Replace the Browser Policy on the active Exam Draft
      description: >-
        Replaces the whole Browser Policy on the Draft. The change is made only if expected_revision still matches
        the Draft's current revision. A disabled policy has no rules. An enabled policy lists the sites candidates
        may open, and Proctor matches pages against them by host and path in a fixed order.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/ConfigureExamDraftBrowserPolicy"
      responses:
        "200":
          $ref: "#/components/responses/ExamOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/exams/{exam_id}/draft/policies/focus-loss:
    parameters:
      - $ref: "#/components/parameters/ExamID"
    put:
      operationId: configureExamDraftFocusLoss
      summary: Replace the Focus Loss policy on the active Exam Draft
      description: >-
        Replaces the whole Focus Loss rule on the Draft. The change is made only if expected_revision still matches
        the Draft's current revision. The minimum duration, incident count, window and outcome are checked
        together, so every published Revision carries a rule that makes sense as a whole.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/ConfigureExamDraftFocusLoss"
      responses:
        "200":
          $ref: "#/components/responses/ExamOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/exams/{exam_id}/draft/policies/execution:
    parameters:
      - $ref: "#/components/parameters/ExamID"
    put:
      operationId: configureExamDraftExecution
      summary: Replace the execution policy on the active Exam Draft
      description: >-
        Replaces the execution policy on the mutable Draft at the expected revision: whether Attempts get an
        execution environment, the environment profile they are created from, whether terminal input is recorded,
        how many terminals a candidate may open, and which ports a candidate may preview. An enabled policy must name a profile that exists, is not
        retired and allows that many terminals, or the change fails with exam.execution.profile_unusable. A
        disabled policy names no profile, records nothing and opens no terminal. Publication checks the profile
        again and requires the installation to allow execution.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.execution.profile_unusable
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        description: Supplies the expected Draft revision and the complete replacement execution policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureExamDraftExecutionRequest"
            example:
              expected_revision: 4
              execution:
                enabled: true
                profile_id: ybndrfg8ejkmcpqxot1uwisza3
                record_input: false
                terminals: 2
                preview:
                  enabled: true
                  ports:
                    - from: 5173
                      to: 5173
      responses:
        "200":
          $ref: "#/components/responses/ExamOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/exams/{exam_id}/draft/assistant:
    parameters:
      - $ref: "#/components/parameters/ExamID"
    put:
      operationId: configureExamDraftAssistant
      summary: Configure the Draft assistant
      description: >-
        Replace the assistant policy behind the Draft revision fence. The profile must be active and permit the
        requested level and budgets. Publication checks installation availability.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.assistant.profile_unusable
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        description: The complete replacement assistant policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureExamDraftAssistantRequest"
            example:
              expected_revision: 4
              assistant:
                enabled: false
                profile_id: ""
                level: "off"
                approvals: always_ask
                instructions: ""
                concepts_to_avoid: []
                budgets:
                  turns: 0
                  input_tokens: 0
                  output_tokens: 0
                  tool_calls: 0
                  commands: 0
                  command_seconds: 0
                  command_timeout_seconds: 0
                code_line_budget: 10
      responses:
        "200":
          $ref: "#/components/responses/ExamOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  requestBodies:
    ConfigureExamDraftBrowserPolicy:
      required: true
      description: The Draft revision you last saw, and the complete new Browser Policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigureExamDraftBrowserPolicyRequest"
          example:
            expected_revision: 4
            browser_policy:
              enabled: true
              start_rule_id: reference
              rules:
                - rule_id: reference
                  label: Algorithms reference
                  origin: https://reference.example.edu
                  path_prefix: /algorithms
                  host_match: exact
                  allow_redirects: false
                  blocked_navigation_outcome: record
                  institution_http_exception: false
                - rule_id: library
                  label: Course library
                  origin: https://library.example.edu
                  path_prefix: /
                  host_match: exact_and_subdomains
                  allow_redirects: true
                  blocked_navigation_outcome: integrity_evidence
                  institution_http_exception: false
    ConfigureExamDraftFocusLoss:
      required: true
      description: The Draft revision you last saw, and the complete new Focus Loss rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigureExamDraftFocusLossRequest"
          example:
            expected_revision: 4
            enabled: true
            minimum_duration_milliseconds: 1500
            incident_count: 3
            window_milliseconds: 300000
            outcome: flag_and_warn
  schemas:
    ConfigureExamDraftExecutionRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - execution
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
        execution:
          $ref: "#/components/schemas/ExecutionPolicy"
    ConfigureExamDraftBrowserPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - browser_policy
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the request fails with a conflict.
        browser_policy:
          $ref: "#/components/schemas/BrowserPolicy"
          description: The new Browser Policy. It replaces the current one completely.
    ConfigureExamDraftFocusLossRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - enabled
        - minimum_duration_milliseconds
        - incident_count
        - window_milliseconds
        - outcome
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the request fails with a conflict.
        enabled:
          type: boolean
          description: True to apply the rule during Attempts.
        minimum_duration_milliseconds:
          type: integer
          format: int64
          minimum: 500
          maximum: 300000
          description: The shortest focus loss that counts as an incident, in milliseconds.
        incident_count:
          type: integer
          minimum: 1
          maximum: 100
          description: How many incidents within the window trigger the outcome.
        window_milliseconds:
          type: integer
          format: int64
          minimum: 10000
          maximum: 14400000
          description: >-
            The rolling time window in which incidents are counted, in milliseconds. It must be at least
            minimum_duration_milliseconds.
        outcome:
          type: string
          enum:
            - flag
            - flag_and_warn
            - flag_and_suspend
          description: >-
            What happens when the threshold is reached. flag marks the Attempt for review. flag_and_warn also warns
            the candidate. flag_and_suspend also suspends the Attempt.
    ConfigureExamDraftAssistantRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - assistant
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
        assistant:
          $ref: "#/components/schemas/AssistantPolicy"
