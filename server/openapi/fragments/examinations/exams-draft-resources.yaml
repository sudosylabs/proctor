paths:
  /api/v1/exams/{exam_id}/draft/resources:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listExamDraftResources
      summary: List the ordered protected resources in an Exam Draft
      description: >-
        Returns every Resource on the Draft, in order, with its name, description, content revision, media type, size and SHA-256 digest. It does not return the file content. Read the content through the separate content operation, which checks your access again.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.resource.invalid
        - exam.resource.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createExamDraftResource
      summary: Upload and append a protected resource to an Exam Draft
      description: >-
        Adds one Resource to the end of the Draft's Resource list. The upload is accepted only if expected_revision still matches the Draft's current revision, the metadata is valid, the content matches the size and digest you declared, the media type is allowed, and the Draft has room under its Resource limits. Send the metadata part first, then the content. The Resource and its content are saved together, or not at all. Send an Idempotency-Key so a retry can't add the Resource twice.
      x-codeSamples:
        - lang: Shell
          label: Append a protected PDF resource
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Idempotency-Key: exam-resource-create-001" \
              --form 'metadata={"expected_revision":3,"display_name":"Formula sheet","description_markdown":"Reference formulas for this examination.","media_type":"application/pdf","size":2048,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"};type=application/json' \
              --form 'content=@./formula-sheet.pdf;type=application/octet-stream' \
              https://proctor.example.edu/api/v1/exams/ybndrfg8ejkmcpqxot1uwisza3/draft/resources
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - service.busy
        - exam.resource.content_invalid
        - exam.resource.limit
        - exam.resource.upload_invalid
        - exam.resource.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        description: A metadata part followed by a content part. The size and SHA-256 digest in the metadata must match the uploaded bytes.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamResourceUploadMultipart'
            encoding:
              metadata:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "201":
          $ref: '#/components/responses/ExamResourceCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/resources/order:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    put:
      operationId: reorderExamDraftResources
      summary: Replace the complete order of active Exam Draft resources
      description: >-
        Sets a new order for all of the Draft's Resources. The change is made only if expected_revision still matches the Draft's current revision. List every current Resource ID exactly once. If the list is out of date or incomplete, the request fails and no Resource moves.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.resource.no_changes
        - exam.resource.order_invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReorderExamResources'
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/resources/{exam_resource_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamResourceID'
    patch:
      operationId: editExamDraftResourceMetadata
      summary: Edit one Exam Draft resource's authored metadata
      description: >-
        Changes the display name, the Markdown description, or both, for one Resource on the Draft. The change is made only if expected_revision still matches the Draft's current revision. The content, its digest and the Resource's position stay the same. A field you leave out stays as it is.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.resource.no_changes
        - exam.resource.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EditExamResourceMetadata'
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: removeExamDraftResource
      summary: Remove one resource from the active Exam Draft
      description: >-
        Removes one Resource from the Draft. The change is made only if expected_revision still matches the Draft's current revision. The Resources after it move up to fill the gap in the same step. Revisions you already published keep their copy of the Resource.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.resource.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RemoveExamResource'
      responses:
        "204":
          $ref: '#/components/responses/ExamResourceRemoved'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/resources/{exam_resource_id}/content:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamResourceID'
    get:
      operationId: getExamDraftResourceContent
      summary: Render protected Exam resource content inline
      tags:
        - Examinations
      description: >-
        Returns the Resource's content for display inside the application, after checking your access. It is not a public link and not a download or export, and it never reveals where the file is stored.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.resource.invalid
        - exam.resource.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The ETag from an earlier response for this content. If it still matches, the server returns 304 with no body.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceProtectedContent'
        "304":
          $ref: '#/components/responses/ExamProtectedContentNotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceExamDraftResourceContent
      summary: Replace an Exam Draft resource's protected content
      description: >-
        Replaces the content of one Resource. The upload is accepted only if expected_revision still matches the Draft's current revision, and the media type, size and digest you declared match the upload. Send the metadata part first, then the content. The display name, description and position stay the same, and the Resource gets a new content revision. Send an Idempotency-Key so a retry is safe.
      x-codeSamples:
        - lang: Shell
          label: Replace protected resource content
          source: |-
            curl --request PUT \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Idempotency-Key: exam-resource-replace-002" \
              --form 'metadata={"expected_revision":4,"media_type":"application/pdf","size":3072,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"};type=application/json' \
              --form 'content=@./formula-sheet-v2.pdf;type=application/octet-stream' \
              https://proctor.example.edu/api/v1/exams/ybndrfg8ejkmcpqxot1uwisza3/draft/resources/ybndrfg8ejkmcpqxot1uwisza4/content
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - service.busy
        - exam.resource.content_invalid
        - exam.resource.upload_invalid
        - exam.resource.revision_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        description: A metadata part followed by a content part. The media type, size and SHA-256 digest in the metadata must match the uploaded bytes.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamResourceContentReplacementMultipart'
            encoding:
              metadata:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EditExamResourceMetadata:
      required: true
      description: The Draft revision you last saw, and a new display name, a new description, or both.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EditExamResourceMetadataRequest'
          example:
            expected_revision: 4
            display_name: Formula sheet, revision 2
    ReorderExamResources:
      required: true
      description: The Draft revision you last saw, and every current Resource ID in the new order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReorderExamResourcesRequest'
          example:
            expected_revision: 5
            resource_ids:
              - ub3kx9eagmh7wd1qnr5ytcpzo8
              - m5fb8wq3yxtnkzar1cdjo7ghe4
    RemoveExamResource:
      required: true
      description: The Draft revision you last saw.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RemoveExamResourceRequest'
          example:
            expected_revision: 6
  responses:
    ExamResourceOK:
      description: The Resource after the change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamResourceResponse'
          example:
            id: m5fb8wq3yxtnkzar1cdjo7ghe4
            display_name: Formula sheet, revision 2
            description_markdown: Reference formulas for this examination.
            position: 0
            content_revision_id: ra9cw4kgdn1tmz7xbqp3yheu5o
            media_type: application/pdf
            size: 3072
            sha256: 882cee600c38b827dd74beae6df9fe27d6457650053774f67301f9f7c7b57c68
            updated_at: '2026-08-03T14:20:00Z'
            draft_revision: 5
    ExamResourceCreated:
      description: The new Resource.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamResourceResponse'
          example:
            id: m5fb8wq3yxtnkzar1cdjo7ghe4
            display_name: Formula sheet
            description_markdown: Reference formulas for this examination.
            position: 1
            content_revision_id: d7nq1aowmt3gcz5hxkbr9ypes8
            media_type: application/pdf
            size: 2048
            sha256: 9c5182f8be1b054637e64ab824df849735c721f43fb168720cb42688bd0e5b38
            updated_at: '2026-08-01T11:30:00Z'
            draft_revision: 4
    ExamResourceRemoved:
      description: The Resource was removed. There is no response body.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    ExamResourceListOK:
      description: The Draft's Resources, in order.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamResourceListResponse'
          example:
            items:
              - id: ub3kx9eagmh7wd1qnr5ytcpzo8
                display_name: Sorting data set
                description_markdown: Use this table for questions 3 and 4.
                position: 0
                content_revision_id: ra9cw4kgdn1tmz7xbqp3yheu5o
                media_type: text/csv
                size: 5120
                sha256: 711a6108ba2ce6ca93dd47d6817f2361db10d8ab6eec89460b2dfc2c325efabe
                updated_at: '2026-08-02T08:10:00Z'
                draft_revision: 6
              - id: m5fb8wq3yxtnkzar1cdjo7ghe4
                display_name: Formula sheet
                description_markdown: Reference formulas for this examination.
                position: 1
                content_revision_id: d7nq1aowmt3gcz5hxkbr9ypes8
                media_type: application/pdf
                size: 2048
                sha256: 9c5182f8be1b054637e64ab824df849735c721f43fb168720cb42688bd0e5b38
                updated_at: '2026-08-01T11:30:00Z'
                draft_revision: 6
    ExamResourceProtectedContent:
      description: The Resource content, for display inside the application. This is not a public link or an export.
      headers:
        ETag:
          description: The content's SHA-256 digest in quotes. Send it as If-None-Match to check for changes.
          schema:
            type: string
        Cache-Control:
          description: Only the requesting browser may cache the content, for up to 5 minutes.
          schema:
            type: string
            const: private, max-age=300
        X-Content-Type-Options:
          description: Stops browsers from guessing a different content type.
          schema:
            type: string
            const: nosniff
      content:
        '*/*':
          schema:
            type: string
            format: binary
    ExamProtectedContentNotModified:
      description: The content has not changed since the ETag you sent.
      headers:
        ETag:
          description: The content's SHA-256 digest in quotes.
          schema:
            type: string
        Cache-Control:
          description: Only the requesting browser may cache the content, for up to 5 minutes.
          schema:
            type: string
            const: private, max-age=300
        X-Content-Type-Options:
          description: Stops browsers from guessing a different content type.
          schema:
            type: string
            const: nosniff
  schemas:
    ExamResourceUploadMetadata:
      type: object
      description: The metadata part of a new Resource upload.
      additionalProperties: false
      required:
        - expected_revision
        - display_name
        - media_type
        - size
        - sha256
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the upload fails with a conflict.
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name candidates see, up to 255 characters. Leading and trailing spaces are removed.
        description_markdown:
          type: string
          maxLength: 16384
          description: An optional description, as Markdown. Up to 16,384 bytes of UTF-8.
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
          description: The media type of the content.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: The exact length of the content, in bytes. It must also fit the Draft's Resource size limit.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the content, as lowercase hex.
    ExamResourceContentReplacementMetadata:
      type: object
      description: The metadata part of a Resource content replacement.
      additionalProperties: false
      required:
        - expected_revision
        - media_type
        - size
        - sha256
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the upload fails with a conflict.
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
          description: The media type of the new content.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: The exact length of the new content, in bytes. It must also fit the Draft's Resource size limit.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the new content, as lowercase hex.
    ExamResourceUploadMultipart:
      type: object
      additionalProperties: false
      required:
        - metadata
        - content
      description: 'Exactly two parts, in this order: metadata as application/json (up to 32,768 bytes), then content.'
      properties:
        metadata:
          $ref: '#/components/schemas/ExamResourceUploadMetadata'
          description: The upload details, sent as the first part.
        content:
          type: string
          format: binary
          description: The file content.
    ExamResourceContentReplacementMultipart:
      type: object
      additionalProperties: false
      required:
        - metadata
        - content
      description: 'Exactly two parts, in this order: metadata as application/json (up to 32,768 bytes), then content.'
      properties:
        metadata:
          $ref: '#/components/schemas/ExamResourceContentReplacementMetadata'
          description: The upload details, sent as the first part.
        content:
          type: string
          format: binary
          description: The new file content.
    EditExamResourceMetadataRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      anyOf:
        - required:
            - display_name
          properties:
            display_name:
              type: string
        - required:
            - description_markdown
          properties:
            description_markdown:
              type: string
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the request fails with a conflict.
        display_name:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
          description: >-
            The new name, up to 255 characters. Leading and trailing spaces are removed. Leave it out or send null to
            keep the current name.
        description_markdown:
          type:
            - string
            - "null"
          maxLength: 16384
          description: >-
            The new description, as Markdown. Up to 16,384 bytes of UTF-8. Leave it out or send null to keep the
            current description.
    ReorderExamResourcesRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - resource_ids
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the request fails with a conflict.
        resource_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Every current Resource ID on the Draft, each once, in the order you want.
          items:
            $ref: '#/components/schemas/ID'
    RemoveExamResourceRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the request fails with a conflict.
    ExamResourceResponse:
      type: object
      description: One file attached to the Draft for candidates to read during the Exam.
      additionalProperties: false
      required:
        - id
        - display_name
        - description_markdown
        - position
        - content_revision_id
        - media_type
        - size
        - sha256
        - updated_at
        - draft_revision
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The Resource ID.
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name candidates see.
        description_markdown:
          type: string
          maxLength: 16384
          description: The description, as Markdown. Up to 16,384 bytes of UTF-8. Empty when there is none.
        position:
          type: integer
          minimum: 0
          maximum: 99
          description: Where the Resource appears in the list, counting from 0.
        content_revision_id:
          $ref: '#/components/schemas/ID'
          description: The ID of the current version of the content. It changes each time the content is replaced.
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
          description: The media type of the content.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: The length of the content, in bytes.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the content, as lowercase hex.
        updated_at:
          type: string
          format: date-time
          description: When the Resource last changed.
        draft_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft's revision at the time of this response. Send it as expected_revision with your next Draft change.
    ExamResourceListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          description: The Resources on this page, in list order.
          items:
            $ref: '#/components/schemas/ExamResourceResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
          description: Send this back as cursor to get the next page. Omitted on the last page.
