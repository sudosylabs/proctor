paths:
  /api/v1/exams/{exam_id}/draft/starter-workspace:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listExamDraftStarterWorkspace
      summary: List the complete Starter Workspace manifest for an Exam Draft
      description: >-
        Returns every file and directory in the Draft's Starter Workspace, sorted by path. When the Draft is published, these entries become the starting files of each candidate's Workspace. Files include their content version, size and digest. Read the content through the separate content operation.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.starter_workspace.invalid
        - exam.starter_workspace.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamStarterWorkspaceListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/starter-workspace/directories:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    post:
      operationId: createExamDraftStarterWorkspaceDirectory
      summary: Create an empty directory in an Exam Draft Starter Workspace
      description: >-
        Creates one empty directory at the path you give. The change is made only if expected_revision still matches the Draft's current revision. The parent directory must exist, nothing may already use the path, and the Starter Workspace must have room for another entry.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.starter_workspace.invalid
        - exam.starter_workspace.conflict
        - exam.starter_workspace.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.starter_workspace.path_conflict
        - exam.starter_workspace.parent_not_found
        - exam.starter_workspace.entry_limit
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateExamStarterWorkspaceDirectory'
      responses:
        "201":
          $ref: '#/components/responses/ExamStarterWorkspaceEntryCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/starter-workspace/files:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    post:
      operationId: createExamDraftStarterWorkspaceFile
      summary: Upload a file into an Exam Draft Starter Workspace
      description: >-
        Adds one file at the path you give. Send the metadata part first, then the content. The upload is accepted only if expected_revision still matches the Draft's current revision, the parent directory exists, the content matches the digest and any size you declared, and the Starter Workspace stays within its limits. Send an Idempotency-Key so a retry can't add the file twice.
      x-codeSamples:
        - lang: Shell
          label: Add a Starter Workspace file
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Idempotency-Key: starter-file-create-001" \
              --form 'metadata={"expected_revision":3,"path":"starter/main.go","media_type":"text/plain","size":128,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"};type=application/json' \
              --form 'content=@./main.go;type=application/octet-stream' \
              https://proctor.example.edu/api/v1/exams/ybndrfg8ejkmcpqxot1uwisza3/draft/starter-workspace/files
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.starter_workspace.invalid
        - exam.starter_workspace.conflict
        - exam.starter_workspace.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.starter_workspace.path_conflict
        - exam.starter_workspace.parent_not_found
        - exam.starter_workspace.entry_limit
        - exam.starter_workspace.total_size_limit
        - exam.starter_workspace.upload_expired
        - exam.starter_workspace.object_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        description: A metadata part followed by a content part. The path, size and SHA-256 digest are checked before the file is saved.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamStarterWorkspaceFileUploadMultipart'
            encoding:
              metadata:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "201":
          $ref: '#/components/responses/ExamStarterWorkspaceEntryCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "410":
          $ref: '#/components/responses/Gone'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/starter-workspace/entries/{starter_workspace_entry_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/StarterWorkspaceEntryID'
    patch:
      operationId: moveExamDraftStarterWorkspaceEntry
      summary: Rename or move one Starter Workspace entry by logical path
      description: >-
        Renames or moves one file or directory to a new path in a single step. The change is made only if expected_revision still matches the Draft's current revision. The request fails, and nothing changes, if the new parent doesn't exist, the path is taken, a directory would move inside itself, or the path is the same as before.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.starter_workspace.invalid
        - exam.starter_workspace.conflict
        - exam.starter_workspace.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.starter_workspace.path_conflict
        - exam.starter_workspace.parent_not_found
        - exam.starter_workspace.no_changes
        - exam.starter_workspace.move_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/MoveExamStarterWorkspaceEntry'
      responses:
        "200":
          $ref: '#/components/responses/ExamStarterWorkspaceEntryOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: removeExamDraftStarterWorkspaceEntry
      summary: Remove a Starter Workspace entry or guarded directory subtree
      description: >-
        Removes one file or directory from the Starter Workspace. The change is made only if expected_revision still matches the Draft's current revision. To remove a directory that isn't empty, set recursive to true. The directory and everything in it are then removed in one step, and the Draft revision goes up by one. Revisions you already published keep their copy of the Starter Workspace.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.starter_workspace.invalid
        - exam.starter_workspace.conflict
        - exam.starter_workspace.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.starter_workspace.directory_not_empty
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RemoveExamStarterWorkspaceEntry'
      responses:
        "204":
          $ref: '#/components/responses/ExamStarterWorkspaceEntryRemoved'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/starter-workspace/files/{starter_workspace_entry_id}/content:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/StarterWorkspaceEntryID'
    get:
      operationId: getExamDraftStarterWorkspaceFileContent
      summary: Render protected Starter Workspace file content inline
      tags:
        - Examinations
      description: >-
        Returns the file's content for display inside the application, after checking your access. It is not a public link and not a download or export, and it never reveals where the file is stored. Content that a browser would run as an active page is served as plain text.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.starter_workspace.invalid
        - exam.starter_workspace.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The ETag from an earlier response for this file. If it still matches, the server returns 304 with no body.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/ExamStarterWorkspaceProtectedContent'
        "304":
          $ref: '#/components/responses/ExamStarterWorkspaceContentNotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceExamDraftStarterWorkspaceFileContent
      summary: Replace one Starter Workspace file's content
      description: >-
        Replaces the content of one file. The upload is accepted only if expected_revision still matches the Draft's current revision and expected_content_version still matches the file's current content version. Send the metadata part first, then the content. The entry must be a file, and the content must match its digest and fit the size limits. The file then gets a new content version.
      x-codeSamples:
        - lang: Shell
          label: Replace a Starter Workspace file
          source: |-
            curl --request PUT \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Idempotency-Key: starter-file-replace-002" \
              --form 'metadata={"expected_revision":4,"expected_content_version":"ybndrfg8ejkmcpqxot1uwisza4","media_type":"text/plain","size":192,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"};type=application/json' \
              --form 'content=@./main.go;type=application/octet-stream' \
              https://proctor.example.edu/api/v1/exams/ybndrfg8ejkmcpqxot1uwisza3/draft/starter-workspace/files/ybndrfg8ejkmcpqxot1uwisza5/content
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.starter_workspace.invalid
        - exam.starter_workspace.conflict
        - exam.starter_workspace.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.starter_workspace.total_size_limit
        - exam.starter_workspace.upload_expired
        - exam.starter_workspace.object_conflict
        - exam.starter_workspace.content_conflict
        - exam.starter_workspace.entry_kind
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        description: A metadata part followed by a content part. expected_content_version stops you from overwriting someone else's newer upload.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamStarterWorkspaceFileReplacementMultipart'
            encoding:
              metadata:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "200":
          $ref: '#/components/responses/ExamStarterWorkspaceEntryOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "410":
          $ref: '#/components/responses/Gone'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    StarterWorkspaceEntryID:
      name: starter_workspace_entry_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of a file or directory in the Draft's Starter Workspace.
  requestBodies:
    CreateExamStarterWorkspaceDirectory:
      required: true
      description: The Draft revision you last saw, and the path of the new directory.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateExamStarterWorkspaceDirectoryRequest'
          example:
            expected_revision: 2
            path: starter/tests
    MoveExamStarterWorkspaceEntry:
      required: true
      description: The Draft revision you last saw, and the new path for the entry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MoveExamStarterWorkspaceEntryRequest'
          example:
            expected_revision: 5
            path: starter/src/main.go
    RemoveExamStarterWorkspaceEntry:
      required: true
      description: The Draft revision you last saw, and whether to remove a directory's contents too.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RemoveExamStarterWorkspaceEntryRequest'
          example:
            expected_revision: 6
            recursive: true
  responses:
    ExamStarterWorkspaceEntryOK:
      description: The file or directory after the change.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamStarterWorkspaceEntryResponse'
          example:
            id: x1rc8ozumg5kbqd3pnhe7twya9
            kind: file
            path: starter/src/main.go
            content_version: Qm3vT8kLp2Xw9sRj4nB7cYd1Ze
            media_type: text/plain
            size: 192
            sha256: 2873f79a86c0d8b3335cd7731b0ecf7dd4301eb19a82ef7a1cba7589b5252261
            created_at: '2026-07-28T13:00:00Z'
            updated_at: '2026-08-02T10:40:00Z'
            draft_revision: 7
    ExamStarterWorkspaceEntryCreated:
      description: The new file or directory.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamStarterWorkspaceEntryResponse'
          example:
            id: 5wbtnqe1kd3uagz7rmxyho9pc4
            kind: directory
            path: starter/tests
            created_at: '2026-07-28T12:55:00Z'
            updated_at: '2026-07-28T12:55:00Z'
            draft_revision: 3
    ExamStarterWorkspaceEntryRemoved:
      description: The entry was removed. There is no response body.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    ExamStarterWorkspaceListOK:
      description: The Draft's Starter Workspace entries, sorted by path.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamStarterWorkspaceListResponse'
          example:
            items:
              - id: 9eqk4xtm1wzbn5dryo3agh7cpu
                kind: directory
                path: starter
                created_at: '2026-07-28T12:50:00Z'
                updated_at: '2026-07-28T12:50:00Z'
              - id: x1rc8ozumg5kbqd3pnhe7twya9
                kind: file
                path: starter/main.go
                content_version: Hk7pW2qZr9Ty4Lm3Xc8Vb1Nd6s
                media_type: text/plain
                size: 128
                sha256: 2873f79a86c0d8b3335cd7731b0ecf7dd4301eb19a82ef7a1cba7589b5252261
                created_at: '2026-07-28T13:00:00Z'
                updated_at: '2026-07-28T13:00:00Z'
              - id: 5wbtnqe1kd3uagz7rmxyho9pc4
                kind: directory
                path: starter/tests
                created_at: '2026-07-28T12:55:00Z'
                updated_at: '2026-07-28T12:55:00Z'
    ExamStarterWorkspaceProtectedContent:
      description: The file content, for display inside the application. This is not a public link or an export.
      headers:
        ETag:
          description: The file's SHA-256 digest in quotes. Send it as If-None-Match to check for changes.
          schema:
            type: string
        Cache-Control:
          description: The content must not be stored by any cache.
          schema:
            type: string
            const: private, no-store
        X-Content-Type-Options:
          description: Stops browsers from guessing a different content type.
          schema:
            type: string
            const: nosniff
      content:
        '*/*':
          schema:
            type: string
            format: binary
    ExamStarterWorkspaceContentNotModified:
      description: The file has not changed since the ETag you sent.
      headers:
        ETag:
          description: The file's SHA-256 digest in quotes.
          schema:
            type: string
        Cache-Control:
          description: The content must not be stored by any cache.
          schema:
            type: string
            const: private, no-store
        X-Content-Type-Options:
          description: Stops browsers from guessing a different content type.
          schema:
            type: string
            const: nosniff
  schemas:
    CreateExamStarterWorkspaceDirectoryRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - path
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the request fails with a conflict.
        path:
          $ref: '#/components/schemas/StarterWorkspacePath'
          description: Where to create the directory. Its parent directory must already exist.
    ExamStarterWorkspaceFileUploadMetadata:
      type: object
      description: The metadata part of a new Starter Workspace file upload.
      additionalProperties: false
      required:
        - expected_revision
        - path
        - media_type
        - size
        - sha256
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the upload fails with a conflict.
        path:
          $ref: '#/components/schemas/StarterWorkspacePath'
          description: Where to put the file. Its parent directory must already exist.
        media_type:
          type: string
          minLength: 1
          maxLength: 255
          description: The file's media type, such as text/plain.
        size:
          type: integer
          format: int64
          minimum: -1
          maximum: 104857600
          description: The length of the content, in bytes. Send -1 if you don't know it. The content may never be larger than 100 MiB.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the content, as lowercase hex.
    ExamStarterWorkspaceFileReplacementMetadata:
      type: object
      description: The metadata part of a Starter Workspace file replacement.
      additionalProperties: false
      required:
        - expected_revision
        - expected_content_version
        - media_type
        - size
        - sha256
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the upload fails with a conflict.
        expected_content_version:
          $ref: '#/components/schemas/WorkspaceContentVersion'
          description: >-
            The file's content_version you last saw. If someone has replaced the content since, the upload fails, so
            you don't overwrite their change.
        media_type:
          type: string
          minLength: 1
          maxLength: 255
          description: The media type of the new content, such as text/plain.
        size:
          type: integer
          format: int64
          minimum: -1
          maximum: 104857600
          description: The length of the new content, in bytes. Send -1 if you don't know it. The content may never be larger than 100 MiB.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the new content, as lowercase hex.
