      type: object
      additionalProperties: false
      required:
        - metadata
        - content
      description: 'Exactly two parts, in this order: metadata as application/json (up to 32,768 bytes), then content.'
      properties:
        metadata:
          $ref: '#/components/schemas/ExamStarterWorkspaceFileUploadMetadata'
          description: The upload details, sent as the first part.
        content:
          type: string
          format: binary
          description: The file content.
    ExamStarterWorkspaceFileReplacementMultipart:
