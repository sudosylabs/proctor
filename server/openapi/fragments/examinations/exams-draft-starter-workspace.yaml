        media_type:
          type: string
          minLength: 1
          maxLength: 255
          description: The file's media type. Files only.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: The file's length, in bytes. Files only.
        sha256:
