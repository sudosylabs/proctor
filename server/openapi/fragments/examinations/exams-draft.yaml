paths:
  /api/v1/exams/{exam_id}/draft:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    patch:
      operationId: editExamDraftText
      summary: Edit authored title or Markdown instructions on the active Exam Draft
      description: >-
        Changes the Draft title, its Markdown instructions, or both. The change is made only if expected_revision still matches the Draft's current revision, so you never overwrite someone else's newer edit. A field you leave out or send as null stays as it is. Proctor stores the Markdown exactly as you wrote it and renders it safely when it is shown.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EditExamDraftText'
      responses:
        "200":
          $ref: '#/components/responses/ExamOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EditExamDraftText:
      required: true
      description: The Draft revision you last saw, and a new title, new instructions, or both.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EditExamDraftTextRequest'
          example:
            expected_revision: 2
            title: Distributed Systems Final
            instructions_markdown: "Read every question carefully. Save your work before submitting."
  schemas:
    EditExamDraftTextRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      anyOf:
        - required:
            - title
          properties:
            title:
              type: string
        - required:
            - instructions_markdown
          properties:
            instructions_markdown:
              type: string
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the request fails with a conflict.
        title:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
          description: >-
            The new title, up to 200 characters. Leading and trailing spaces are removed, and the result must not be
            empty. Leave it out or send null to keep the current title.
        instructions_markdown:
          type:
            - string
            - "null"
          description: >-
            The new instructions, as Markdown. Up to 65,536 bytes of UTF-8. An empty string removes the instructions.
            Leave it out or send null to keep the current instructions.
