paths:
  /api/v1/exams/{exam_id}/managers:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      operationId: listExamManagers
      summary: List bounded Exam Manager relationship provenance
      description: >-
        Lists the Users who currently manage the Exam, newest first. Each entry shows who made that User a Manager and whether they are the creator or the current owner. The response contains no User profile or credential data.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: The most Managers to return in one page, from 1 to 200. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The next_cursor value from the previous page, sent back unchanged. Omit it for the first page.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/ExamManagerListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: addExamManager
      summary: Grant an eligible User equal Exam management responsibility
      description: >-
        Makes an eligible User a Manager of the Exam, with the same management rights as the other Managers. The change is made only if expected_revision still matches the Exam's current revision. Proctor records who added the Manager and when. Adding a Manager never changes the owner, and belonging to the Academic Unit alone never makes someone a Manager.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.revision_conflict
        - exam.manager.exists
        - exam.manager.ineligible
        - exam.manager.candidate_conflict
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/AddExamManager'
      responses:
        "201":
          $ref: '#/components/responses/ExamManagerChanged'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/managers/{user_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/UserID'
    delete:
      operationId: removeExamManager
      summary: Revoke an Exam Manager relationship while preserving provenance
      description: >-
        Removes one User as a Manager of the Exam. The change is made only if expected_revision still matches the Exam's current revision. The record of who added them, and the audit history, are kept. You can't remove the current owner. Transfer ownership to someone else first.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.revision_conflict
        - exam.manager.not_found
        - exam.manager.owner_protected
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RemoveExamManager'
      responses:
        "200":
          $ref: '#/components/responses/ExamManagerChanged'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    AddExamManager:
      required: true
      description: The User to add as a Manager, and the Exam revision you last saw.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AddExamManagerRequest'
          example:
            user_id: hw5jrd1ypzt8nkq3xe7mcboa4g
            expected_revision: 3
    RemoveExamManager:
      required: true
      description: The Exam revision you last saw.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RemoveExamManagerRequest'
          example:
            expected_revision: 4
  responses:
    ExamManagerListOK:
      description: One page of the Exam's current Managers.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamManagerListResponse'
          example:
            items:
              - user_id: hw5jrd1ypzt8nkq3xe7mcboa4g
                granted_by_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
                granted_at: '2026-08-02T09:15:00Z'
                is_creator: false
                is_owner: false
              - user_id: c9me3tsk7oyhx1bwuadgz5nqrf
                granted_by_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
                granted_at: '2026-07-20T10:00:00Z'
                is_creator: true
                is_owner: true
  schemas:
    AddExamManagerRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
        - expected_revision
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
          description: The User to make a Manager.
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Exam revision you last saw. If the Exam has changed since, the request fails with a conflict.
    RemoveExamManagerRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Exam revision you last saw. If the Exam has changed since, the request fails with a conflict.
    ExamManagerListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The Managers on this page, most recently added first.
          items:
            $ref: '#/components/schemas/ExamManagerResponse'
        next_cursor:
          type: string
          description: Send this back as cursor to get the next page. Omitted on the last page.
