paths:
  /api/v1/exams/{exam_id}/draft/policies/native:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    put:
      operationId: configureExamDraftNativePolicy
      summary: Replace native security selections on the active Exam Draft
      description: >-
        Replaces the whole native policy on the Draft, with all ten families. The change is made only if
        expected_revision still matches the Draft's current revision. The desktop_candidate baseline always applies
        and you can't turn it off. Publishing fixes these choices in the Revision, so a later Draft edit never changes
        an Attempt that is already running. Every catalog ID must come from a catalog the server has admitted when
        the policy is applied to an Attempt.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ConfigureExamDraftNativePolicy'
      responses:
        '200':
          $ref: '#/components/responses/ExamOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ConfigureExamDraftNativePolicy:
      required: true
      description: The Draft revision you last saw, and the complete new native policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfigureExamDraftNativePolicyRequest'
          example:
            expected_revision: 4
            native:
              baseline_id: desktop_candidate
              families:
                - allowed_application_ids: []
                  id: process_application
                  mode: disabled
                - id: interactive_session
                  mode: disabled
                - id: clipboard
                  mode: disabled
                  observe_os_clipboard_changes: false
                  strategy: disabled
                - candidate_print_commands: not_applied
                  id: printing
                  mode: disabled
                  monitored_spooler: not_required
                - allowed_storage_function_class_ids: []
                  enabled_sub_capabilities: []
                  id: removable_storage
                  mode: disabled
                - id: virtualization
                  mode: disabled
                  rule: not_applied
                - allowed_adapter_class_ids: []
                  allowed_managed_profile_ids: []
                  allowed_tunnel_class_ids: []
                  enabled_sub_capabilities: []
                  id: network_configuration
                  mode: disabled
                - concurrent_use_check: not_required
                  id: camera
                  mode: disabled
                  require_ready: false
                - concurrent_use_check: not_required
                  id: microphone
                  mode: disabled
                  require_ready: false
                - id: external_capture
                  mode: disabled
              registry_digest: sha256:79faa1141236b073dff2ff802ce67abce3082417a7a4fa2954615e4226acd1e0
  schemas:
    ConfigureExamDraftNativePolicyRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - native
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you last saw. If the Draft has changed since, the request fails with a conflict.
        native:
          $ref: '#/components/schemas/NativeSecurityPolicy'
          description: The new native policy. It replaces the current one completely.
    NativeSecurityPolicy:
      type: object
      additionalProperties: false
      description: >-
        What Proctor Desktop watches or blocks on the candidate's computer. It always includes the fixed baseline and
        lists all ten families in a set order. The whole Exam policy, including this part, must fit in 64 KiB.
      required:
        - registry_digest
        - baseline_id
        - families
      properties:
        registry_digest:
          type: string
          const: sha256:79faa1141236b073dff2ff802ce67abce3082417a7a4fa2954615e4226acd1e0
          description: Identifies the version of the native capability registry this policy is written for. Use the value shown.
        baseline_id:
          type: string
          const: desktop_candidate
          description: The baseline controls that always apply. Always desktop_candidate.
        families:
          type: array
          minItems: 10
          maxItems: 10
          description: >-
            One entry for each family, in this order: process_application, interactive_session, clipboard, printing,
            removable_storage, virtualization, network_configuration, camera, microphone, external_capture.
          items:
            oneOf:
              - type: object
                description: Applications that start and stop on the candidate's computer during the Attempt.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - allowed_application_ids
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: process_application
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  allowed_application_ids:
                    description: >-
                      Catalog IDs of applications the candidate may use. No catalog is available yet, so the list must be empty; a non-empty list is refused with `exam.invalid`. Sorted, unique, and empty when mode is disabled. Paths, names, commands and patterns are not accepted.
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        allowed_application_ids:
                          const: []
              - type: object
                description: Whether only one interactive user session is active on the candidate's computer.
                additionalProperties: false
                required:
                  - id
                  - mode
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: interactive_session
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
              - type: object
                description: Clipboard use during the Attempt.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - observe_os_clipboard_changes
                  - strategy
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: clipboard
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  observe_os_clipboard_changes:
                    description: >-
                      Whether Proctor Desktop watches for changes to the computer's clipboard. Must be true in observe mode and false when disabled.
                    type: boolean
                  strategy:
                    description: >-
                      private_attempt gives the candidate a clipboard that is private to the Attempt. Use private_attempt in enforce mode and disabled otherwise.
                    type: string
                    enum:
                      - disabled
                      - private_attempt
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        observe_os_clipboard_changes:
                          const: false
                        strategy:
                          const: disabled
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        strategy:
                          const: disabled
                        observe_os_clipboard_changes:
                          const: true
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        strategy:
                          const: private_attempt
              - type: object
                description: Printing during the Attempt.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - candidate_print_commands
                  - monitored_spooler
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: printing
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  candidate_print_commands:
                    description: >-
                      deny blocks print commands from the candidate. Use deny in enforce mode and not_applied otherwise.
                    type: string
                    enum:
                      - not_applied
                      - deny
                  monitored_spooler:
                    description: >-
                      required makes Proctor Desktop watch print jobs in the print spooler. Must be required in observe mode and not_required when disabled.
                    type: string
                    enum:
                      - not_required
                      - required
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        candidate_print_commands:
                          const: not_applied
                        monitored_spooler:
                          const: not_required
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        candidate_print_commands:
                          const: not_applied
                        monitored_spooler:
                          const: required
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        candidate_print_commands:
                          const: deny
              - type: object
                description: Removable storage connected to the candidate's computer.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - allowed_storage_function_class_ids
                  - enabled_sub_capabilities
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: removable_storage
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  allowed_storage_function_class_ids:
                    description: >-
                      Catalog IDs of storage device classes the candidate may use. No catalog is available yet, so the list must be empty; a non-empty list is refused with `exam.invalid`. Sorted, unique, and empty when mode is disabled. Paths, names, commands and patterns are not accepted.
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  enabled_sub_capabilities:
                    description: >-
                      Which kinds of device to cover. removable_block_storage covers removable drives. portable_mtp covers devices that connect over the Media Transfer Protocol, such as phones. List at least one unless mode is disabled, and none when it is.
                    type: array
                    maxItems: 2
                    uniqueItems: true
                    items:
                      type: string
                      enum:
                        - removable_block_storage
                        - portable_mtp
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        allowed_storage_function_class_ids:
                          const: []
                        enabled_sub_capabilities:
                          const: []
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
              - type: object
                description: Whether the Attempt is running inside a virtual machine.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - rule
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: virtualization
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  rule:
                    description: >-
                      block_recognized_guest looks for a recognized virtual machine. require_certified_physical_environment requires a certified physical computer. Use not_applied when mode is disabled.
                    type: string
                    enum:
                      - not_applied
                      - block_recognized_guest
                      - require_certified_physical_environment
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        rule:
                          const: not_applied
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        rule:
                          enum:
                            - block_recognized_guest
                            - require_certified_physical_environment
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        rule:
                          enum:
                            - block_recognized_guest
                            - require_certified_physical_environment
              - type: object
                description: The network setup of the candidate's computer, such as proxies, VPNs, tunnels and routes.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - allowed_adapter_class_ids
                  - allowed_managed_profile_ids
                  - allowed_tunnel_class_ids
                  - enabled_sub_capabilities
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: network_configuration
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  allowed_adapter_class_ids:
                    description: >-
                      Catalog IDs of network adapter classes the candidate may use. No catalog is available yet, so the list must be empty; a non-empty list is refused with `exam.invalid`. Sorted, unique, and empty when mode is disabled. Paths, names, commands and patterns are not accepted.
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  allowed_managed_profile_ids:
                    description: >-
                      Catalog IDs of managed network profiles the candidate may use. No catalog is available yet, so the list must be empty; a non-empty list is refused with `exam.invalid`. Sorted, unique, and empty when mode is disabled. Paths, names, commands and patterns are not accepted.
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  allowed_tunnel_class_ids:
                    description: >-
                      Catalog IDs of tunnel classes the candidate may use. No catalog is available yet, so the list must be empty; a non-empty list is refused with `exam.invalid`. Sorted, unique, and empty when mode is disabled. Paths, names, commands and patterns are not accepted.
                    type: array
                    maxItems: 256
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  enabled_sub_capabilities:
                    description: >-
                      Which network signals to cover: system proxy settings, VPNs managed by the operating system, tunnel interfaces, route changes, and the health of the network data source. route_change is only ever observed, even in enforce mode. List at least one unless mode is disabled, and none when it is.
                    type: array
                    maxItems: 5
                    uniqueItems: true
                    items:
                      type: string
                      enum:
                        - system_proxy_state
                        - os_managed_vpn_state
                        - tunnel_interface_state
                        - route_change
                        - network_source_health
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        allowed_adapter_class_ids:
                          const: []
                        allowed_managed_profile_ids:
                          const: []
                        allowed_tunnel_class_ids:
                          const: []
                        enabled_sub_capabilities:
                          const: []
                  - if:
                      properties:
                        mode:
                          const: observe
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
                  - if:
                      properties:
                        mode:
                          const: enforce
                    then:
                      properties:
                        enabled_sub_capabilities:
                          minItems: 1
              - type: object
                description: The candidate's camera.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - concurrent_use_check
                  - require_ready
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: camera
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  concurrent_use_check:
                    description: >-
                      supported_required checks whether another application is using the camera. When mode is not disabled, set this to supported_required, set require_ready to true, or both.
                    type: string
                    enum:
                      - not_required
                      - supported_required
                  require_ready:
                    description: >-
                      Whether the camera must be ready. Must be false when mode is disabled.
                    type: boolean
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        concurrent_use_check:
                          const: not_required
                        require_ready:
                          const: false
                  - if:
                      properties:
                        mode:
                          enum:
                            - observe
                            - enforce
                    then:
                      anyOf:
                        - properties:
                            require_ready:
                              const: true
                        - properties:
                            concurrent_use_check:
                              const: supported_required
              - type: object
                description: The candidate's microphone.
                additionalProperties: false
                required:
                  - id
                  - mode
                  - concurrent_use_check
                  - require_ready
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: microphone
                  mode:
                    description: >-
                      How Proctor Desktop handles this family. disabled turns it off, observe only watches and reports, and enforce also applies the control.
                    type: string
                    enum:
                      - disabled
                      - observe
                      - enforce
                  concurrent_use_check:
                    description: >-
                      supported_required checks whether another audio stream is running on the microphone. When mode is not disabled, set this to supported_required, set require_ready to true, or both.
                    type: string
                    enum:
                      - not_required
                      - supported_required
                  require_ready:
                    description: >-
                      Whether the microphone must be ready. Must be false when mode is disabled.
                    type: boolean
                allOf:
                  - if:
                      properties:
                        mode:
                          const: disabled
                    then:
                      properties:
                        concurrent_use_check:
                          const: not_required
                        require_ready:
                          const: false
                  - if:
                      properties:
                        mode:
                          enum:
                            - observe
                            - enforce
                    then:
                      anyOf:
                        - properties:
                            require_ready:
                              const: true
                        - properties:
                            concurrent_use_check:
                              const: supported_required
              - type: object
                description: External capture. Only disabled is accepted.
                additionalProperties: false
                required:
                  - id
                  - mode
                properties:
                  id:
                    description: >-
                      Identifies the family.
                    type: string
                    const: external_capture
                  mode:
                    description: >-
                      Only disabled is accepted.
                    type: string
                    enum:
                      - disabled
          prefixItems:
            - properties:
                id:
                  const: process_application
            - properties:
                id:
                  const: interactive_session
            - properties:
                id:
                  const: clipboard
            - properties:
                id:
                  const: printing
            - properties:
                id:
                  const: removable_storage
            - properties:
                id:
                  const: virtualization
            - properties:
                id:
                  const: network_configuration
            - properties:
                id:
                  const: camera
            - properties:
                id:
                  const: microphone
            - properties:
                id:
                  const: external_capture
