paths:
  /api/v1/exams/{exam_id}/revisions/{exam_revision_id}/content:
    parameters:
      - $ref: "#/components/parameters/ExamID"
      - $ref: "#/components/parameters/ExamRevisionID"
    get:
      operationId: getExamRevisionContent
      summary: Read the title, instructions and policies a Revision froze
      description: >-
        Returns the title, instructions, integrity rules and browser rules exactly as the Revision froze them,
        in the same shape as the Draft, so you can compare a Revision with the Draft or with another Revision.
        Read-only. Needs the same permission as reading the Draft.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/ExamRevisionContentOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/exams/{exam_id}/revisions/{exam_revision_id}/resources:
    parameters:
      - $ref: "#/components/parameters/ExamID"
      - $ref: "#/components/parameters/ExamRevisionID"
    get:
      operationId: listExamRevisionResources
      summary: List the Resources a Revision froze
      description: >-
        Returns every Resource the Revision froze, in order, with its name, description, content revision, media
        type, size and SHA-256 digest, like the Draft's Resource list. It does not return file content; read that
        through the Resource's content operation.
      tags:
        - Examinations
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/ExamRevisionResourceListOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/exams/{exam_id}/revisions/{exam_revision_id}/resources/{exam_resource_id}/content:
    parameters:
      - $ref: "#/components/parameters/ExamID"
      - $ref: "#/components/parameters/ExamRevisionID"
      - $ref: "#/components/parameters/ExamResourceID"
    get:
      operationId: getExamRevisionResourceContent
      summary: Render a Resource as a Revision froze it
      description: >-
        Returns the Resource's content as the Revision froze it, for display inside the application, after
        checking your access. It is not a public link and not a download or export.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The ETag from an earlier response for this content. If it still matches, the server returns 304 with no body.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ExamResourceProtectedContent"
        "304":
          $ref: "#/components/responses/ExamProtectedContentNotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/exams/{exam_id}/revisions/{exam_revision_id}/starter-workspace:
    parameters:
      - $ref: "#/components/parameters/ExamID"
      - $ref: "#/components/parameters/ExamRevisionID"
    get:
      operationId: listExamRevisionStarterWorkspace
      summary: List the Starter Workspace a Revision froze
      description: >-
        Returns every file and directory of the Starter Workspace the Revision froze, in path order, with each
        file's content version, media type, size and SHA-256 digest. It does not return file content.
      tags:
        - Examinations
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/ExamRevisionStarterWorkspaceListOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/exams/{exam_id}/revisions/{exam_revision_id}/starter-workspace/files/{starter_workspace_entry_id}/content:
    parameters:
      - $ref: "#/components/parameters/ExamID"
      - $ref: "#/components/parameters/ExamRevisionID"
      - $ref: "#/components/parameters/StarterWorkspaceEntryID"
    get:
      operationId: getExamRevisionStarterWorkspaceFileContent
      summary: Read a Starter Workspace file as a Revision froze it
      description: >-
        Returns one Starter Workspace file's bytes as the Revision froze them, for display inside the
        application. A directory has no content and is not found.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The ETag from an earlier response for this file. If it still matches, the server returns 304 with no body.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ExamStarterWorkspaceProtectedContent"
        "304":
          $ref: "#/components/responses/ExamStarterWorkspaceContentNotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  responses:
    ExamRevisionContentOK:
      description: The title, instructions and policies the Revision froze.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExamRevisionContentResponse"
          example:
            revision_id: t1oekp5dqa7nwrzhcx3by9mug4
            exam_id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
            number: 3
            title: Algorithms — final examination
            instructions_markdown: Read every question before you begin.
            policy:
              native:
                registry_digest: sha256:e4c05771fa6f34c08c0f01aa98e33f88973baacf832c67d760457f2b4f9d734d
                baseline_id: desktop_candidate
                families:
                  - allowed_application_ids: []
                    id: process_application
                    mode: disabled
                    outcome: flag
                  - id: interactive_session
                    mode: disabled
                    outcome: flag
                  - id: clipboard
                    mode: disabled
                    observe_os_clipboard_changes: false
                    outcome: flag
                    strategy: disabled
                  - candidate_print_commands: not_applied
                    id: printing
                    mode: disabled
                    monitored_spooler: not_required
                    outcome: flag
                  - enabled_sub_capabilities: []
                    id: removable_storage
                    mode: disabled
                    outcome: flag
                  - id: virtualization
                    mode: disabled
                    outcome: flag
                    rule: not_applied
                  - enabled_sub_capabilities: []
                    id: network_configuration
                    mode: disabled
                    outcome: flag
                  - concurrent_use_check: not_required
                    id: camera
                    mode: disabled
                    outcome: flag
                    require_ready: false
                  - concurrent_use_check: not_required
                    id: microphone
                    mode: disabled
                    outcome: flag
                    require_ready: false
                  - id: external_capture
                    mode: disabled
                    outcome: flag
                screen_recording:
                  enabled: false
              connection_loss:
                outcome: flag_and_suspend
              focus_loss:
                enabled: true
                minimum_duration_milliseconds: 2000
                incident_count: 3
                window_milliseconds: 300000
                outcome: flag_and_warn
              execution:
                enabled: false
                record_input: false
                terminals: 0
                preview:
                  enabled: false
                  ports: []
              assistant:
                enabled: false
                profile_id: ""
                level: "off"
                approvals: always_ask
                instructions: ""
                concepts_to_avoid: []
                budgets:
                  turns: 0
                  input_tokens: 0
                  output_tokens: 0
                  tool_calls: 0
                  commands: 0
                  command_seconds: 0
                  command_timeout_seconds: 0
                code_line_budget: 10
            browser_policy:
              enabled: false
    ExamRevisionResourceListOK:
      description: The Resources the Revision froze, in order.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExamRevisionResourceListResponse"
          example:
            items:
              - id: 3nqhk8zmy1rxwpecb5dtg7uoaf
                display_name: Reference sheet
                description_markdown: Formulas you may use.
                position: 0
                content_revision_id: x7bkq4ezmc1hd9wptnfgy3ar5o
                media_type: application/pdf
                size: 48213
                sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
    ExamRevisionStarterWorkspaceListOK:
      description: The Starter Workspace the Revision froze, in path order.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExamRevisionStarterWorkspaceListResponse"
          example:
            items:
              - id: m8dq3xkz7w1ncrbe5pyth4gufo
                kind: directory
                path: cmd
              - id: r4bty8ozwe3kx1nqcm7dhgf5ua
                kind: file
                path: cmd/main.go
                content_version: aZ3kQ9mW2xT7vB1nP5rL8cY4dE
                media_type: text/x-go
                size: 12
                sha256: 9c56cc51b374c3ba189210d5b6d4bf57790d351c96c47c02190ecf1e430635ab
  schemas:
    ExamRevisionContentResponse:
      type: object
      description: What a Revision froze besides its files, in the same shape as the Draft.
      additionalProperties: false
      required:
        - revision_id
        - exam_id
        - number
        - title
        - instructions_markdown
        - policy
        - browser_policy
      properties:
        revision_id:
          $ref: "#/components/schemas/ID"
          description: The Revision.
        exam_id:
          $ref: "#/components/schemas/ID"
          description: The Exam the Revision belongs to.
        number:
          type: integer
          format: int64
          minimum: 1
          description: The Revision's number within its Exam, starting at 1.
        title:
          type: string
          description: The title the Revision froze.
        instructions_markdown:
          type: string
          description: The instructions the Revision froze, as Markdown. Empty when there are none.
        policy:
          $ref: "#/components/schemas/ExamPolicySet"
          description: The integrity rules the Revision froze.
        browser_policy:
          $ref: "#/components/schemas/BrowserPolicy"
          description: The browser rules the Revision froze.
    ExamRevisionResourceListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          description: The Resources on this page, in Revision order.
          items:
            $ref: "#/components/schemas/ExamRevisionResourceResponse"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
          description: Send this back as cursor to get the next page. Omitted on the last page.
    ExamRevisionResourceResponse:
      type: object
      description: One Resource as a Revision froze it.
      additionalProperties: false
      required:
        - id
        - display_name
        - description_markdown
        - position
        - content_revision_id
        - media_type
        - size
        - sha256
      properties:
        id:
          $ref: "#/components/schemas/ID"
          description: The Resource. The same Resource keeps its id across the Draft and every Revision.
        display_name:
          type: string
          description: The name candidates see.
        description_markdown:
          type: string
          description: The description candidates see, as Markdown. Empty when there is none.
        position:
          type: integer
          minimum: 0
          description: The Resource's place in the list, starting at 0.
        content_revision_id:
          $ref: "#/components/schemas/ID"
          description: The content the Revision froze. A different id means different content.
        media_type:
          type: string
          description: The content's media type.
        size:
          type: integer
          format: int64
          minimum: 0
          description: The content's size in bytes.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The SHA-256 digest of the content, in lowercase hex.
    ExamRevisionStarterWorkspaceListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          description: The entries on this page, in path order.
          items:
            $ref: "#/components/schemas/ExamRevisionStarterWorkspaceEntryResponse"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
          description: Send this back as cursor to get the next page. Omitted on the last page.
    ExamRevisionStarterWorkspaceEntryResponse:
      type: object
      description: One Starter Workspace file or directory as a Revision froze it.
      additionalProperties: false
      required:
        - id
        - kind
        - path
      properties:
        id:
          $ref: "#/components/schemas/ID"
          description: The entry. The same entry keeps its id across the Draft and every Revision.
        kind:
          type: string
          enum:
            - file
            - directory
          description: Whether the entry is a file or a directory.
        path:
          type: string
          description: The entry's path, with / between parts.
        content_version:
          type: string
          description: The file's content version. A different value means different bytes. Omitted for a directory.
        media_type:
          type: string
          description: The file's media type. Omitted for a directory.
        size:
          type: integer
          format: int64
          minimum: 0
          description: The file's size in bytes. Omitted for a directory.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The SHA-256 digest of the file, in lowercase hex. Omitted for a directory.
