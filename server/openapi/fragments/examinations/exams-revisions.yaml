paths:
  /api/v1/exams/{exam_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      operationId: listExamRevisions
      summary: List bounded immutable Exam Revision metadata
      description: >-
        Lists the Exam's published Revisions, newest first. Each entry includes digests of the policy and content, the capacity limits, Resource and Starter Workspace counts, and who published it and when. It does not return Resource content or the current Draft.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: The most Revisions to return in one page, from 1 to 200. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: The next_cursor value from the previous page, sent back unchanged. Omit it for the first page.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/ExamRevisionListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: publishExamRevision
      summary: Publish the complete validated Draft as an immutable Exam Revision
      tags:
        - Examinations
      description: >-
        Checks the whole current Draft and publishes it as a new Revision, which can't change afterwards. Publishing happens only if expected_revision still matches the Draft's current revision, so you never publish edits you haven't seen. Send an Idempotency-Key: if the response is lost, retrying with the same key returns the same result. The Revision captures the text, policies, capacity limits, Resources and Starter Workspace together.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/exams/8uk3fh7sw1mxqdbt5yrcg4oz9a/revisions' \
              --header 'Authorization: Bearer <access-token>' \
              --header 'Content-Type: application/json' \
              --header 'Idempotency-Key: docs-exam-publish-012' \
              --data '{"expected_revision":12}'
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.conflict
        - exam.draft.revision_conflict
        - exam.revision.no_changes
        - exam.revision.capacity_exceeded
        - exam.execution.disabled
        - exam.execution.profile_unusable
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/PublishExamRevision'
      responses:
        "201":
          $ref: '#/components/responses/ExamRevisionCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/revisions/{exam_revision_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamRevisionID'
    get:
      operationId: getExamRevision
      summary: Get bounded immutable Exam Revision metadata
      description: >-
        Returns one published Revision. It checks that the Revision belongs to this Exam and that you can currently manage the Exam. The response holds publication details and digests, not the current Draft or any file content.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamRevisionOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    ExamRevisionID:
      name: exam_revision_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of a published Revision of this Exam.
  requestBodies:
    PublishExamRevision:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublishExamRevisionRequest'
          example:
            expected_revision: 12
      description: >-
        The Draft revision you expect to publish. If the Draft has changed since, publishing fails instead of including changes you haven't seen.
  responses:
    ExamRevisionOK:
      description: The published Revision.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamRevisionResponse'
          example:
            id: t1oekp5dqa7nwrzhcx3by9mug4
            exam_id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
            number: 2
            source_draft_revision: 8
            title: Algorithms — final examination
            policy_schema_version: 1
            policy_digest: 823412d1eacb67956220e532959f0104603057c88704863ca38e7cd188fda812
            capacity:
              resource_maximum_count: 10
              resource_maximum_bytes: 10485760
              workspace_maximum_entries: 500
              workspace_maximum_file_bytes: 10485760
              workspace_maximum_total_bytes: 52428800
            starter_workspace_digest: 21a3230e03772a58aff1b3709a9e232850916337e1fba95c434076b6668c6e08
            content_digest: ed7002b439e9ac845f22357d822bac1444730fbdb6016d3ec9432297b9ec9f73
            resource_count: 2
            starter_workspace_entry_count: 3
            starter_workspace_total_bytes: 128
            published_by_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
            published_at: '2026-08-01T16:45:00Z'
            base_revision_id: gx7ab3nwh1ekqmd9pzucsoyt5r
            publication_kind: standard
    ExamRevisionCreated:
      description: The new Revision, published from the Draft.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamRevisionResponse'
          example:
            id: t1oekp5dqa7nwrzhcx3by9mug4
            exam_id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
            number: 2
            source_draft_revision: 8
            title: Algorithms — final examination
            policy_schema_version: 1
            policy_digest: 823412d1eacb67956220e532959f0104603057c88704863ca38e7cd188fda812
            capacity:
              resource_maximum_count: 10
              resource_maximum_bytes: 10485760
              workspace_maximum_entries: 500
              workspace_maximum_file_bytes: 10485760
              workspace_maximum_total_bytes: 52428800
            starter_workspace_digest: 21a3230e03772a58aff1b3709a9e232850916337e1fba95c434076b6668c6e08
            content_digest: ed7002b439e9ac845f22357d822bac1444730fbdb6016d3ec9432297b9ec9f73
            resource_count: 2
            starter_workspace_entry_count: 3
            starter_workspace_total_bytes: 128
            published_by_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
            published_at: '2026-08-01T16:45:00Z'
            base_revision_id: gx7ab3nwh1ekqmd9pzucsoyt5r
            publication_kind: standard
    ExamRevisionListOK:
      description: One page of the Exam's published Revisions, newest first.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamRevisionListResponse'
          example:
            items:
              - id: t1oekp5dqa7nwrzhcx3by9mug4
                exam_id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
                number: 2
                source_draft_revision: 8
                title: Algorithms — final examination
                policy_schema_version: 1
                policy_digest: 823412d1eacb67956220e532959f0104603057c88704863ca38e7cd188fda812
                capacity:
                  resource_maximum_count: 10
                  resource_maximum_bytes: 10485760
                  workspace_maximum_entries: 500
                  workspace_maximum_file_bytes: 10485760
                  workspace_maximum_total_bytes: 52428800
                starter_workspace_digest: 21a3230e03772a58aff1b3709a9e232850916337e1fba95c434076b6668c6e08
                content_digest: ed7002b439e9ac845f22357d822bac1444730fbdb6016d3ec9432297b9ec9f73
                resource_count: 2
                starter_workspace_entry_count: 3
                starter_workspace_total_bytes: 128
                published_by_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
                published_at: '2026-08-01T16:45:00Z'
                base_revision_id: gx7ab3nwh1ekqmd9pzucsoyt5r
                publication_kind: standard
            next_cursor: eyJudW1iZXIiOjIsInJldmlzaW9uX2lkIjoidDFvZWtwNWRxYTdud3J6aGN4M2J5OW11ZzQifQ
  schemas:
    PublishExamRevisionRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision you expect to publish. If the Draft has changed since, the request fails with a conflict.
    ExamRevisionResponse:
      type: object
      description: >-
        A summary of one published Revision. A Revision is a copy of the Draft taken at publication, and it can't
        change.
      additionalProperties: false
      required:
        - id
        - exam_id
        - number
        - source_draft_revision
        - title
        - policy_schema_version
        - policy_digest
        - capacity
        - starter_workspace_digest
        - content_digest
        - resource_count
        - starter_workspace_entry_count
        - starter_workspace_total_bytes
        - published_by_user_id
        - published_at
        - publication_kind
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The Revision ID.
        exam_id:
          $ref: '#/components/schemas/ID'
          description: The Exam this Revision belongs to.
        number:
          type: integer
          format: int64
          minimum: 1
          description: The Revision's number within the Exam. The first Revision is 1, and each new one adds 1.
        source_draft_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Draft revision this Revision was published from.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: The Exam title at publication.
        policy_schema_version:
          type: integer
          const: 1
          description: The version of the policy format the Revision was saved in. Always 1 today.
        policy_digest:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the Revision's integrity policy, as lowercase hex. Two Revisions with the same policy have the same digest.
        capacity:
          $ref: '#/components/schemas/ExamCapacityPolicy'
          description: The Resource and Starter Workspace limits that applied at publication.
        starter_workspace_digest:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the Starter Workspace file list and contents, as lowercase hex.
        content_digest:
          $ref: '#/components/schemas/SHA256'
          description: >-
            The SHA-256 digest of everything the Revision holds, as lowercase hex: title, instructions, policies,
            capacity, Resources and Starter Workspace. Two Revisions with the same content have the same digest.
        resource_count:
          type: integer
          minimum: 0
          maximum: 100
          description: How many Resources the Revision includes.
        starter_workspace_entry_count:
          type: integer
          minimum: 0
          maximum: 5000
          description: How many files and directories the Revision's Starter Workspace has.
        starter_workspace_total_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1073741824
          description: The total size of the Starter Workspace files, in bytes.
        published_by_user_id:
          $ref: '#/components/schemas/ID'
          description: The User who published the Revision.
        published_at:
          type: string
          format: date-time
          description: When the Revision was published.
        base_revision_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Revision this one was based on: the one the Draft was last published as, or the Revision a live
            correction changes. Omitted for the first Revision.
        publication_kind:
          type: string
          enum:
            - standard
            - live_correction
          description: >-
            standard means the Revision was published from the Draft. live_correction means it corrects a Revision
            during a running Sitting.
    ExamRevisionListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          description: The Revisions on this page, newest first.
          items:
            $ref: '#/components/schemas/ExamRevisionResponse'
        next_cursor:
          type: string
          description: Send this back as cursor to get the next page. Omitted on the last page.
