paths:
  /api/v1/exams:
    get:
      operationId: listExams
      summary: List Exams visible to the current principal
      tags:
        - Examinations
      description: >-
        Returns one row for each Exam you can see, most recently updated first. When you filter by Sitting state or schedule, an Exam is included only if at least one of its Sittings matches every Sitting filter you gave. To get the next page, send next_cursor back unchanged. A cursor does not give access to anything you could not already see.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body --get \
              --url 'https://proctor.example.edu/api/v1/exams' \
              --header 'Authorization: Bearer <access-token>' \
              --header 'Accept: application/json' \
              --data-urlencode 'archive_state=active' \
              --data-urlencode 'sitting_state=open' \
              --data-urlencode 'limit=50'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - exam.invalid
        - exam.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: academic_unit_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Exams owned by this Academic Unit. You still see only the Exams you are allowed to see.
        - name: q
          in: query
          required: false
          description: Return only Exams whose current Draft title contains this text. Matching ignores case, and wildcard characters are treated as plain text.
          schema:
            type: string
        - name: archive_state
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - archived
              - all
            default: active
          description: Return active Exams, archived Exams, or all of them. Defaults to active.
        - name: sitting_state
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            uniqueItems: true
            items:
              $ref: '#/components/schemas/ExamSittingState'
          description: Return only Exams with a Sitting in one of these states. Repeat the parameter for several states. With ends_after and starts_before, the same Sitting must also fall in that time range.
        - name: ends_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return only Exams with a Sitting scheduled to end after this time. Send it together with starts_before.
        - name: starts_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return only Exams with a Sitting scheduled to start before this time. Send it together with ends_after, and make it later than ends_after.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: The most Exams to return in one page, from 1 to 200. Defaults to 50.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: The next_cursor value from the previous page, sent back unchanged. Omit it for the first page. Don't parse it or store it as an ID.
      responses:
        "200":
          $ref: '#/components/responses/ExamListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createExam
      summary: Create an Exam and its initial Draft
      tags:
        - Examinations
      description: >-
        Creates an Exam in the Academic Unit you choose, together with its first Draft. You become its creator, owner and first Manager. You need permission to author Exams in that Academic Unit. Send an Idempotency-Key. Retrying with the same key and body returns the original result. Reusing the key with a different body is rejected as a conflict.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/exams' \
              --header 'Authorization: Bearer <access-token>' \
              --header 'Content-Type: application/json' \
              --header 'Idempotency-Key: docs-exam-001' \
              --data '{"academic_unit_id":"q4nzk1xwe7rbdg3cyjoth5mupa","title":"Algorithms — final examination","instructions_markdown":"Read every question before you begin."}'
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.conflict
        - exam.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateExam'
      responses:
        "201":
          $ref: '#/components/responses/ExamCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      operationId: getExam
      summary: Get one bounded Exam authoring view
      description: >-
        Returns the Exam, its current Draft, its owner and how many Managers it has. You must currently be allowed to manage the Exam. Published Revisions can't change, and you read them through the Revision operations.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.unavailable
        - exam.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateExam:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateExamRequest'
          example:
            academic_unit_id: q4nzk1xwe7rbdg3cyjoth5mupa
            title: Algorithms — final examination
            instructions_markdown: Read every question before you begin.
      description: The Academic Unit that will own the Exam, the Draft title, and optional Markdown instructions.
  responses:
    ExamCreated:
      description: The new Exam and its first Draft.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamResponse'
          example:
            exam:
              id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
              academic_unit_id: q4nzk1xwe7rbdg3cyjoth5mupa
              creator_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
              owner_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
              created_at: '2026-07-20T10:00:00Z'
              updated_at: '2026-07-20T10:00:00Z'
              revision: 1
            draft:
              exam_id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
              title: Algorithms — final examination
              instructions_markdown: Read every question before you begin.
              policy:
                native:
                  registry_digest: sha256:79faa1141236b073dff2ff802ce67abce3082417a7a4fa2954615e4226acd1e0
                  baseline_id: desktop_candidate
                  families:
                    - {id: process_application, mode: disabled, allowed_application_ids: []}
                    - {id: interactive_session, mode: disabled}
                    - {id: clipboard, mode: disabled, observe_os_clipboard_changes: false, strategy: disabled}
                    - {id: printing, mode: disabled, candidate_print_commands: not_applied, monitored_spooler: not_required}
                    - {id: removable_storage, mode: disabled, allowed_storage_function_class_ids: [], enabled_sub_capabilities: []}
                    - {id: virtualization, mode: disabled, rule: not_applied}
                    - {id: network_configuration, mode: disabled, allowed_adapter_class_ids: [], allowed_managed_profile_ids: [], allowed_tunnel_class_ids: [], enabled_sub_capabilities: []}
                    - {id: camera, mode: disabled, concurrent_use_check: not_required, require_ready: false}
                    - {id: microphone, mode: disabled, concurrent_use_check: not_required, require_ready: false}
                    - {id: external_capture, mode: disabled}
                connection_loss:
                  outcome: flag_and_suspend
                focus_loss:
                  enabled: true
                  minimum_duration_milliseconds: 2000
                  incident_count: 3
                  window_milliseconds: 300000
                  outcome: flag_and_warn
              browser_policy:
                enabled: false
              capacity:
                resource_maximum_count: 10
                resource_maximum_bytes: 10485760
                workspace_maximum_entries: 500
                workspace_maximum_file_bytes: 10485760
                workspace_maximum_total_bytes: 52428800
              updated_at: '2026-07-20T10:00:00Z'
              revision: 1
              resource_count: 0
              has_starter_workspace: false
            owner_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
            manager_count: 1
    ExamListOK:
      description: One page of the Exams you can see.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamListResponse'
          example:
            items:
              - id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
                academic_unit_id: q4nzk1xwe7rbdg3cyjoth5mupa
                academic_unit_display_name: School of Computing
                creator_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
                owner_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
                title: Algorithms — final examination
                updated_at: '2026-08-03T14:20:00Z'
                revision: 3
                manager_count: 2
                sitting_count: 2
                matching_sitting_count: 1
                sitting_summary:
                  id: k8pzbd3uxmw5rtc1qay7noh9ge
                  exam_revision_id: t1oekp5dqa7nwrzhcx3by9mug4
                  class_id: z3ymh7rnet5ugo1bwkqxd9ca8p
                  class_display_name: Algorithms, autumn 2026
                  scheduled_start_at: '2026-08-14T09:00:00Z'
                  scheduled_end_at: '2026-08-14T12:00:00Z'
                  state: open
                  revision: 4
            next_cursor: eyJ1cGRhdGVkX2F0IjoiMjAyNi0wOC0wM1QxNDoyMDowMFoiLCJleGFtX2lkIjoiOHVrM2ZoN3N3MW14cWRidDV5cmNnNG96OWEifQ
  schemas:
    CreateExamRequest:
      type: object
      additionalProperties: false
      required:
        - academic_unit_id
        - title
      properties:
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit that will own the Exam.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: The Draft title, up to 200 characters. Leading and trailing spaces are removed.
        instructions_markdown:
          type: string
          description: Optional instructions for candidates, as Markdown. Up to 65,536 bytes of UTF-8. Leave it out or send an empty string for no instructions.
    ExamListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The Exams on this page, most recently updated first.
          items:
            $ref: '#/components/schemas/ExamSummaryResponse'
        next_cursor:
          type: string
          description: Send this back as cursor to get the next page. Omitted on the last page.
    ExamSummaryResponse:
      type: object
      description: A short summary of one Exam for lists. It leaves out the instructions, policies, Resources and Starter Workspace.
      additionalProperties: false
      required:
        - id
        - academic_unit_id
        - academic_unit_display_name
        - creator_user_id
        - owner_user_id
        - title
        - updated_at
        - revision
        - manager_count
        - sitting_count
        - matching_sitting_count
        - sitting_summary
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The Exam ID.
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit that owns the Exam.
        academic_unit_display_name:
          type: string
          minLength: 1
          description: The name of the owning Academic Unit.
        creator_user_id:
          $ref: '#/components/schemas/ID'
          description: The User who created the Exam.
        owner_user_id:
          $ref: '#/components/schemas/ID'
          description: The User who currently owns the Exam.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: The title from the Exam's current Draft.
        updated_at:
          type: string
          format: date-time
          description: When the Exam record last changed. The list is sorted by this value, newest first.
        archived_at:
          type: string
          format: date-time
          description: When the Exam was archived. Omitted while the Exam is active.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The Exam's current revision number. Send it as expected_revision when you archive the Exam or change its Managers or owner.
        manager_count:
          type: integer
          minimum: 1
          description: How many Users currently manage the Exam, including the owner.
        sitting_count:
          type: integer
          minimum: 0
          description: How many Sittings the Exam has in total, whatever the Sitting filters.
        matching_sitting_count:
          type: integer
          minimum: 0
          description: How many of the Exam's Sittings match the Sitting filters. Without Sitting filters, this equals sitting_count.
        sitting_summary:
          type:
            - object
            - "null"
          description: >-
            The most relevant matching Sitting. Paused, closing and open Sittings come first, then the next scheduled
            one, then the most recently ended closed or canceled one. Null when no Sitting matches.
          additionalProperties: false
          required:
            - id
            - exam_revision_id
            - class_id
            - class_display_name
            - scheduled_start_at
            - scheduled_end_at
            - state
            - revision
          properties:
            id:
              $ref: '#/components/schemas/ID'
              description: The Sitting ID.
            exam_revision_id:
              $ref: '#/components/schemas/ID'
              description: The published Revision the Sitting delivers.
            class_id:
              $ref: '#/components/schemas/ID'
              description: The Class taking the Sitting.
            class_display_name:
              type: string
              minLength: 1
              description: The name of that Class.
            scheduled_start_at:
              type: string
              format: date-time
              description: When the Sitting is scheduled to start.
            scheduled_end_at:
              type: string
              format: date-time
              description: When the Sitting is scheduled to end.
            state:
              $ref: '#/components/schemas/ExamSittingState'
              description: Where the Sitting is in its lifecycle.
            revision:
              type: integer
              format: int64
              minimum: 1
              description: The Sitting's current revision number.
