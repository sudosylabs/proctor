components:
  responses:
    ExamOK:
      description: The Exam, its current Draft, its owner and how many Managers it has.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExamResponse"
          example:
            exam:
              id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
              academic_unit_id: q4nzk1xwe7rbdg3cyjoth5mupa
              creator_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
              owner_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
              default_revision_id: t1oekp5dqa7nwrzhcx3by9mug4
              created_at: "2026-07-20T10:00:00Z"
              updated_at: "2026-08-01T16:45:00Z"
              revision: 3
            draft:
              exam_id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
              title: Algorithms — final examination
              instructions_markdown: |-
                Read every question before you begin.

                You may use the formula sheet in Resources.
              policy:
                native:
                  registry_digest: sha256:e4c05771fa6f34c08c0f01aa98e33f88973baacf832c67d760457f2b4f9d734d
                  baseline_id: desktop_candidate
                  families:
                    - allowed_application_ids: []
                      id: process_application
                      mode: disabled
                      outcome: flag
                    - id: interactive_session
                      mode: disabled
                      outcome: flag
                    - id: clipboard
                      mode: disabled
                      observe_os_clipboard_changes: false
                      outcome: flag
                      strategy: disabled
                    - candidate_print_commands: not_applied
                      id: printing
                      mode: disabled
                      monitored_spooler: not_required
                      outcome: flag
                    - enabled_sub_capabilities: []
                      id: removable_storage
                      mode: disabled
                      outcome: flag
                    - id: virtualization
                      mode: disabled
                      outcome: flag
                      rule: not_applied
                    - enabled_sub_capabilities: []
                      id: network_configuration
                      mode: disabled
                      outcome: flag
                    - concurrent_use_check: not_required
                      id: camera
                      mode: disabled
                      outcome: flag
                      require_ready: false
                    - concurrent_use_check: not_required
                      id: microphone
                      mode: disabled
                      outcome: flag
                      require_ready: false
                    - id: external_capture
                      mode: disabled
                      outcome: flag
                  screen_recording:
                    enabled: false
                connection_loss:
                  outcome: flag_and_suspend
                focus_loss:
                  enabled: true
                  minimum_duration_milliseconds: 2000
                  incident_count: 3
                  window_milliseconds: 300000
                  outcome: flag_and_warn
                execution:
                  enabled: false
                  record_input: false
                  terminals: 0
                  preview:
                    enabled: false
                    ports: []
                assistant:
                  enabled: false
                  profile_id: ""
                  level: "off"
                  approvals: always_ask
                  instructions: ""
                  concepts_to_avoid: []
                  budgets:
                    turns: 0
                    input_tokens: 0
                    output_tokens: 0
                    tool_calls: 0
                    commands: 0
                    command_seconds: 0
                    command_timeout_seconds: 0
                  code_line_budget: 10
              browser_policy:
                enabled: true
                start_rule_id: reference
                rules:
                  - rule_id: reference
                    origin: https://reference.example.edu
                    path_prefix: /algorithms
                    host_match: exact
                    allow_redirects: false
                    blocked_navigation_outcome: record
                    institution_http_exception: false
              capacity:
                resource_maximum_count: 10
                resource_maximum_bytes: 10485760
                workspace_maximum_entries: 500
                workspace_maximum_file_bytes: 10485760
                workspace_maximum_total_bytes: 52428800
              base_revision_id: t1oekp5dqa7nwrzhcx3by9mug4
              updated_at: "2026-08-03T14:20:00Z"
              revision: 9
              resource_count: 2
              has_starter_workspace: true
            owner_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
            manager_count: 2
    ExamManagerChanged:
      description: The Exam after the change, and the Manager who was added, removed or made owner.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExamManagerChangeResponse"
          example:
            exam:
              id: 8uk3fh7sw1mxqdbt5yrcg4oz9a
              academic_unit_id: q4nzk1xwe7rbdg3cyjoth5mupa
              creator_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
              owner_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
              default_revision_id: t1oekp5dqa7nwrzhcx3by9mug4
              created_at: "2026-07-20T10:00:00Z"
              updated_at: "2026-08-02T09:15:00Z"
              revision: 4
            manager:
              user_id: hw5jrd1ypzt8nkq3xe7mcboa4g
              granted_by_user_id: c9me3tsk7oyhx1bwuadgz5nqrf
              granted_at: "2026-08-02T09:15:00Z"
              is_creator: false
              is_owner: false
  schemas:
    ExamManagerResponse:
      type: object
      description: One User who manages the Exam, and where that responsibility came from.
      additionalProperties: false
      required:
        - user_id
        - granted_by_user_id
        - granted_at
        - is_creator
        - is_owner
      properties:
        user_id:
          $ref: "#/components/schemas/ID"
          description: The User who manages the Exam.
        granted_by_user_id:
          $ref: "#/components/schemas/ID"
          description: The User who made this person a Manager. For the creator, this is the creator.
        granted_at:
          type: string
          format: date-time
          description: When this User became a Manager.
        is_creator:
          type: boolean
          description: True when this User created the Exam. This never changes, even after an ownership transfer.
        is_owner:
          type: boolean
          description: >-
            True when this User currently owns the Exam. In the response to a removal, it is always false, because
            the User no longer manages the Exam.
    ExamManagerChangeResponse:
      type: object
      description: The result of adding a Manager, removing one, or transferring ownership.
      additionalProperties: false
      required:
        - exam
        - manager
      properties:
        exam:
          $ref: "#/components/schemas/ExamIdentityResponse"
          description: The Exam after the change, including its new revision. Use that revision for your next change.
        manager:
          $ref: "#/components/schemas/ExamManagerResponse"
          description: The Manager the change was about.
    ExamResponse:
      type: object
      description: >-
        The authoring view of one Exam. It holds the Exam itself and its current Draft. Published Revisions are
        returned by the Revision operations instead.
      additionalProperties: false
      required:
        - exam
        - draft
        - owner_user_id
        - manager_count
      properties:
        exam:
          $ref: "#/components/schemas/ExamIdentityResponse"
          description: The Exam record. Use its revision for Exam-level changes such as archiving.
        draft:
          $ref: "#/components/schemas/ExamDraftResponse"
          description: The Exam's current Draft. Use its revision for Draft changes and publishing.
        owner_user_id:
          $ref: "#/components/schemas/ID"
          description: The User who currently owns the Exam. This is the same value as exam.owner_user_id.
        manager_count:
          type: integer
          minimum: 1
          description: How many Users currently manage the Exam, including the owner.
    ExamIdentityResponse:
      type: object
      description: >-
        The Exam record itself, without its Draft content. Its revision changes when the Exam is published,
        archived, or its Managers or owner change.
      additionalProperties: false
      required:
        - id
        - academic_unit_id
        - creator_user_id
        - owner_user_id
        - created_at
        - updated_at
        - revision
      properties:
        id:
          $ref: "#/components/schemas/ID"
          description: The Exam ID.
        academic_unit_id:
          $ref: "#/components/schemas/ID"
          description: The Academic Unit that owns the Exam.
        creator_user_id:
          $ref: "#/components/schemas/ID"
          description: The User who created the Exam. This never changes.
        owner_user_id:
          $ref: "#/components/schemas/ID"
          description: >-
            The User who currently owns the Exam. It starts as the creator and changes only by an ownership
            transfer.
        default_revision_id:
          $ref: "#/components/schemas/ID"
          description: The most recently published Revision of this Exam. Omitted until the Exam is first published.
        created_at:
          type: string
          format: date-time
          description: When the Exam was created.
        updated_at:
          type: string
          format: date-time
          description: When the Exam record last changed.
        archived_at:
          type: string
          format: date-time
          description: When the Exam was archived. Omitted while the Exam is active.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Exam's current revision number, starting at 1. Send it as expected_revision when you archive the
            Exam or change its Managers or owner.
    ExamDraftResponse:
      type: object
      description: >-
        The Exam's single editable Draft. Publishing copies it into a new Revision. Editing it afterwards never
        changes a Revision that is already published.
      additionalProperties: false
      required:
        - exam_id
        - title
        - instructions_markdown
        - policy
        - browser_policy
        - capacity
        - updated_at
        - revision
        - resource_count
        - has_starter_workspace
      properties:
        exam_id:
          $ref: "#/components/schemas/ID"
          description: The Exam this Draft belongs to.
        title:
          type: string
          description: The Exam title shown to candidates and staff.
        instructions_markdown:
          type: string
          description: >-
            The instructions shown to candidates, as Markdown. Up to 65,536 bytes of UTF-8. Empty when there are
            none.
        policy:
          $ref: "#/components/schemas/ExamPolicySet"
          description: The integrity rules for Attempts.
        browser_policy:
          $ref: "#/components/schemas/BrowserPolicy"
          description: Which websites candidates may open in the Exam browser during an Attempt.
        capacity:
          $ref: "#/components/schemas/ExamCapacityPolicy"
          description: The limits on Resources and Starter Workspace size that apply to this Draft.
        base_revision_id:
          $ref: "#/components/schemas/ID"
          description: The Revision most recently published from this Draft. Omitted until the Draft is first published.
        updated_at:
          type: string
          format: date-time
          description: When the Draft last changed.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Draft's current revision number, starting at 1. It goes up with every Draft change, including
            Resource and Starter Workspace changes. Send it as expected_revision with your next Draft change.
        resource_count:
          type: integer
          minimum: 0
          description: How many Resources the Draft has.
        has_starter_workspace:
          type: boolean
          description: True when the Draft's Starter Workspace has at least one file or directory.
    BrowserPolicy:
      type: object
      description: >-
        The websites candidates may open in the Exam browser. A disabled policy has only enabled set to false. An
        enabled policy also names a start rule and lists up to 128 rules, within 32 KiB. When several rules match a
        page, Proctor picks the one with the longest path prefix, then an exact host over a subdomain match, then
        the longest hostname, then the alphabetically smallest rule ID. The order of the rules array never decides
        the match.
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: True to give candidates the Exam browser with these rules. False turns the Exam browser off.
        start_rule_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9_-]{1,64}$
          description: >-
            The rule_id of the rule the Exam browser starts from. It must match one of the rules. Present only when
            enabled is true.
        rules:
          type: array
          minItems: 1
          maxItems: 128
          description: The allowed sites. Present only when enabled is true.
          items:
            $ref: "#/components/schemas/BrowserPolicyRule"
      oneOf:
        - properties:
            enabled:
              const: false
          not:
            anyOf:
              - required:
                  - start_rule_id
              - required:
                  - rules
        - required:
            - start_rule_id
            - rules
          properties:
            enabled:
              const: true
    BrowserPolicyRule:
      type: object
      description: One site, or part of a site, that candidates may open in the Exam browser.
      additionalProperties: false
      required:
        - rule_id
        - origin
        - path_prefix
        - host_match
        - allow_redirects
        - blocked_navigation_outcome
        - institution_http_exception
      properties:
        rule_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9_-]{1,64}$
          description: Your name for this rule, unique within the policy. Lowercase letters, digits, hyphens and underscores.
        origin:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 2048
          description: >-
            The scheme, host and optional port of the site, in ASCII. Use HTTPS. HTTP is accepted only with
            institution_http_exception. Leave out the default port (443 for HTTPS, 80 for HTTP). The host must be
            DNS labels or an IPv4 address. Internationalized names, punycode, IPv6, a trailing dot, credentials, a
            query, a fragment and any path other than / are rejected. A port is a decimal number from 1 to 65535
            with no leading zeros. An IP address works only with exact host matching.
        path_prefix:
          type: string
          pattern: ^/
          maxLength: 2048
          description: >-
            The ASCII path the rule covers. It matches that exact path and anything below it at a slash boundary.
            One trailing slash is removed when you save, unless the path is just /. Dot segments, broken percent
            escapes and encoded slashes or backslashes are rejected. Repeated slashes, percent escapes of
            unreserved characters and the letter case of percent escapes are kept as written and compared exactly.
        host_match:
          type: string
          enum:
            - exact
            - exact_and_subdomains
          description: exact matches only the origin's host. exact_and_subdomains also matches every subdomain of it.
        allow_redirects:
          type: boolean
          description: Whether the Exam browser may follow a redirect that this rule matches.
        blocked_navigation_outcome:
          type: string
          enum:
            - record
            - integrity_evidence
          description: >-
            What happens when a candidate is blocked from opening a page under this rule. record only records it.
            integrity_evidence also creates Integrity Evidence for review.
        institution_http_exception:
          type: boolean
          description: >-
            Set to true only for an HTTP rule whose host and explicit port are the same as this installation's own
            HTTPS origin. It must be false for HTTPS rules. It never allows credentials to be sent over HTTP.
    ExamPolicySet:
      type: object
      description: The integrity rules for an Attempt.
      additionalProperties: false
      required:
        - native
        - connection_loss
        - focus_loss
        - execution
        - assistant
      properties:
        native:
          $ref: "#/components/schemas/NativeSecurityPolicy"
          description: What Proctor Desktop watches or blocks on the candidate's computer.
        connection_loss:
          $ref: "#/components/schemas/ConnectionLossPolicy"
          description: What happens when the server loses its connection to an Attempt.
        focus_loss:
          $ref: "#/components/schemas/FocusLossPolicy"
          description: When leaving the Exam window counts against the candidate.
        execution:
          $ref: "#/components/schemas/ExecutionPolicy"
          description: Whether the Attempts get an execution environment, from which profile, and how many terminals.
        assistant:
          $ref: "#/components/schemas/AssistantPolicy"
    ExecutionPolicy:
      type: object
      additionalProperties: false
      description: >-
        Whether the Exam's Attempts get an execution environment and which. A disabled policy names no profile,
        records nothing and opens no terminal. Terminal output is never recorded.
      required:
        - enabled
        - record_input
        - terminals
        - preview
      properties:
        enabled:
          type: boolean
        profile_id:
          $ref: "#/components/schemas/ID"
        record_input:
          type: boolean
          description: Whether terminal input is recorded as evidence.
        terminals:
          type: integer
          minimum: 0
          maximum: 8
          description: How many terminals a candidate may open, from 1 to the profile's maximum; 0 when disabled.
        preview:
          $ref: "#/components/schemas/ExecutionPreviewPolicy"
    ExecutionPreviewPolicy:
      type: object
      additionalProperties: false
      description: >-
        Candidate previews require execution. When enabled, ranges are inclusive, sorted by the first
        port and disjoint. When disabled, the list is empty.
      required: [enabled, ports]
      properties:
        enabled:
          type: boolean
        ports:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ExecutionPreviewPortRange"
      examples:
        - enabled: false
          ports: []
        - enabled: true
          ports:
            - from: 3000
              to: 3999
            - from: 5173
              to: 5173
    ExecutionPreviewPortRange:
      type: object
      additionalProperties: false
      description: An inclusive port range. The first port is at most the last port.
      required: [from, to]
      properties:
        from:
          type: integer
          minimum: 1024
          maximum: 65535
        to:
          type: integer
          minimum: 1024
          maximum: 65535
    ConnectionLossPolicy:
      type: object
      description: What happens when the server loses its connection to a candidate's Attempt. You can't change it.
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          type: string
          const: flag_and_suspend
          description: Always flag_and_suspend. The Attempt is flagged for review and suspended.
    FocusLossPolicy:
      type: object
      description: >-
        When leaving the Exam window counts against a candidate. Each time focus is lost for at least the minimum
        duration is one incident. Reaching the incident count within the window triggers the outcome.
      additionalProperties: false
      required:
        - enabled
        - minimum_duration_milliseconds
        - incident_count
        - window_milliseconds
        - outcome
      properties:
        enabled:
          type: boolean
          description: True to apply this rule during Attempts.
        minimum_duration_milliseconds:
          type: integer
          format: int64
          minimum: 500
          maximum: 300000
          description: The shortest focus loss that counts as an incident, in milliseconds.
        incident_count:
          type: integer
          minimum: 1
          maximum: 100
          description: How many incidents within the window trigger the outcome.
        window_milliseconds:
          type: integer
          format: int64
          minimum: 10000
          maximum: 14400000
          description: The rolling time window in which incidents are counted, in milliseconds.
        outcome:
          type: string
          enum:
            - flag
            - flag_and_warn
            - flag_and_suspend
          description: >-
            What happens when the threshold is reached. flag marks the Attempt for review. flag_and_warn also warns
            the candidate. flag_and_suspend also suspends the Attempt.
    AssistantPolicyBudgets:
      type: object
      additionalProperties: false
      required:
        - turns
        - input_tokens
        - output_tokens
        - tool_calls
        - commands
        - command_seconds
        - command_timeout_seconds
      properties:
        turns:
          type: integer
          format: int64
          minimum: 0
          maximum: 2000
        input_tokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
        output_tokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
        tool_calls:
          type: integer
          format: int64
          minimum: 0
          maximum: 20000
        commands:
          type: integer
          format: int64
          minimum: 0
          maximum: 2000
        command_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
        command_timeout_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 600
    AssistantPolicy:
      type: object
      additionalProperties: false
      description: >-
        Frozen assistant allowances. Instructions and avoided concepts are visible to managers only. Only Tutor is
        currently available.
      required:
        - enabled
        - profile_id
        - level
        - approvals
        - instructions
        - concepts_to_avoid
        - budgets
        - code_line_budget
      properties:
        enabled:
          type: boolean
        profile_id:
          type: string
          description: An assistant profile ID when enabled; empty when disabled.
        level:
          type: string
          enum:
            - "off"
            - tutor
            - reviewer
            - pair
            - agent
        approvals:
          type: string
          enum:
            - always_ask
            - auto_within_level
        instructions:
          type: string
          maxLength: 4096
        concepts_to_avoid:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 80
        budgets:
          $ref: "#/components/schemas/AssistantPolicyBudgets"
        code_line_budget:
          type: integer
          minimum: 0
          maximum: 100
