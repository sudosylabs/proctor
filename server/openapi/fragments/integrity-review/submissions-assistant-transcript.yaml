paths:
  /api/v1/submissions/{submission_id}/assistant-transcript:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: listSubmissionAssistantTranscript
      summary: Read the assistant transcript sealed with a Submission
      tags:
        - Integrity review
      description: >-
        Requires the same Submission integrity-view authorization as Attempt evidence. Returns the candidate's
        assistant conversation in record order: messages, replies, tool calls with their arguments and
        results, approvals and output checks. A command's call names its assistant:N process, whose commands
        are in the Attempt evidence; an edit's call is the author of the Workspace changes it made. Read it as
        a timeline beside the candidate's own work. The inventory is the one the seal bound. Assistant use
        the Exam allows raises no Flag. No-store.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          $ref: '#/components/responses/AssistantTranscript'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/submissions/{submission_id}/assistant-usage:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: getSubmissionAssistantUsage
      summary: Summarize how the candidate used the assistant
      tags:
        - Integrity review
      description: >-
        Requires the same Submission integrity-view authorization as Attempt evidence. Counts the sealed
        transcript: messages and replies, tokens, the tools used, commands, edits proposed and applied,
        approvals and output checks. It is descriptive only and never a score or a Flag; estimated marks token
        figures the server estimated. No-store.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: How the assistant was used
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantUsageSummary'
              example:
                messages: 6
                replies: 6
                input_tokens: 18240
                output_tokens: 2210
                estimated: false
                tools: {read_file: 4, run_command: 2}
                commands: 2
                edits_proposed: 0
                edits_applied: 0
                approved: 2
                declined: 0
                expired: 0
                output_rewritten: 1
                output_replaced: 0
                gaps: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    AssistantUsageSummary:
      type: object
      additionalProperties: false
      required: [messages, replies, input_tokens, output_tokens, estimated, tools, commands, edits_proposed, edits_applied,
        approved, declined, expired, output_rewritten, output_replaced, gaps]
      properties:
        messages:
          type: integer
          format: int64
          minimum: 0
        replies:
          type: integer
          format: int64
          minimum: 0
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        estimated:
          type: boolean
        tools:
          type: object
          description: Calls by tool name.
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        commands:
          type: integer
          format: int64
          minimum: 0
        edits_proposed:
          type: integer
          format: int64
          minimum: 0
        edits_applied:
          type: integer
          format: int64
          minimum: 0
        approved:
          type: integer
          format: int64
          minimum: 0
        declined:
          type: integer
          format: int64
          minimum: 0
        expired:
          type: integer
          format: int64
          minimum: 0
        output_rewritten:
          type: integer
          format: int64
          minimum: 0
        output_replaced:
          type: integer
          format: int64
          minimum: 0
        gaps:
          type: integer
          format: int64
          minimum: 0
