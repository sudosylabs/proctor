paths:
  /api/v1/submissions/{submission_id}/attempt-evidence:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: listAttemptEvidence
      summary: Inspect the Attempt evidence sealed with a Submission
      tags:
        - Integrity review
      description: >-
        Requires the same current Submission integrity-view authorization as detailed evidence. Returns the
        append-only records the core kept for the Attempt, such as the execution environment's command log, in
        identity order. They raise no Flag and carry no decision: a record of kind `execution.gap` says coverage
        was missing. Each item names its kind, the author that produced it, the author's stream sequence, and its
        bounded detail object, which the server stores as given. The Submission seal fixed the set, whose inventory
        the Review response carries. Pages contain at most 100 records. Integrity retirement removes them.
        No-store; cursors are purpose-specific opaque keysets.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of Attempt evidence records to return.
        - name: cursor
          in: query
          schema:
            type: string
            description: Opaque Attempt evidence identity cursor.
          description: Opaque continuation from the preceding Attempt evidence page.
      responses:
        '200':
          $ref: '#/components/responses/AttemptEvidenceListOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    AttemptEvidence:
      type: object
      additionalProperties: false
      required:
        - id
        - attempt_id
        - kind
        - author
        - sequence
        - detail
        - observed_at
        - recorded_at
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        attempt_id:
          type: string
          minLength: 26
          maxLength: 26
        kind:
          type: string
          enum:
            - execution.process
            - execution.input
            - execution.gap
            - execution.overwritten
            - execution.refused
          description: >-
            `execution.process` is a slice of the command log, `execution.input` recorded terminal input,
            `execution.gap` missing coverage, `execution.overwritten` a guest change lost to a newer Workspace
            version, and `execution.refused` a guest change the Workspace refused.
        author:
          $ref: '#/components/schemas/WorkspaceAuthor'
        sequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: The position of the record in its author's stream of this kind.
        detail:
          type: object
          additionalProperties: true
          description: The author's own evidence object of at most 64 KiB, stored as given.
        observed_at:
          type: string
          format: date-time
          description: The author's observation time, never later than recorded_at.
        recorded_at:
          type: string
          format: date-time
    AttemptEvidenceListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AttemptEvidence'
        next_cursor:
          type: string
  responses:
    AttemptEvidenceListOK:
      description: Bounded private Attempt evidence, never a Flag or a guilt finding.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttemptEvidenceListResponse'
          example:
            items: []
