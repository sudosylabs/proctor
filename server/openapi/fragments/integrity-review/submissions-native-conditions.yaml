paths:
  /api/v1/submissions/{submission_id}/native-conditions:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: listNativeConditions
      summary: Inspect the native rule status changes of a Submission
      tags:
        - Integrity review
      description: >-
        Requires the same current Submission integrity-view authorization as detailed evidence. Returns every change
        of a native rule's status as the server evaluated it on the facts Desktop reported, with the delivery position
        that caused it (batch 0 is the state reported at Start), original receipt and interpretation times, and
        immutable stream and policy provenance. An occurrence opens when a rule becomes not met and closes when it is
        met again; an enforce occurrence that opens also raises its capability's native Flag. The facts themselves
        are not returned. Pages contain at most 100 records. Integrity retirement removes this material independently of native operational retention.
        No-store; cursors are purpose-specific opaque keysets.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of native condition transitions to return.
        - name: cursor
          in: query
          schema:
            type: string
            description: Opaque native condition identity cursor.
          description: Opaque continuation from the preceding native condition page.
      responses:
        '200':
          $ref: '#/components/responses/NativeConditionListOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    NativeConditionEvidence:
      type: object
      additionalProperties: false
      required:
        - id
        - attempt_id
        - participation_id
        - generation
        - stream_id
        - security_session_id
        - policy_revision_id
        - policy_digest
        - application_release_id
        - matrix_id
        - batch_sequence
        - record_index
        - transition
        - received_at
        - interpreted_at
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
        attempt_id:
          type: string
          minLength: 26
          maxLength: 26
        participation_id:
          type: string
          minLength: 26
          maxLength: 26
        generation:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        stream_id:
          type: string
          minLength: 1
          maxLength: 128
        security_session_id:
          type: string
          minLength: 1
          maxLength: 128
        policy_revision_id:
          type: string
          minLength: 26
          maxLength: 26
        policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        application_release_id:
          type: string
          minLength: 1
          maxLength: 128
        matrix_id:
          type: string
          minLength: 1
          maxLength: 128
        batch_sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 20000
        record_index:
          type: integer
          minimum: 0
          maximum: 63
        transition:
          $ref: '#/components/schemas/NativeRuleTransition'
        received_at:
          type: string
          format: date-time
        interpreted_at:
          type: string
          format: date-time
    NativeRuleTransition:
      type: object
      additionalProperties: false
      required:
        - rule_id
        - capability
        - mode
        - reason
        - to
        - at
      properties:
        rule_id:
          type: string
          maxLength: 128
        capability:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        mode:
          type: string
          enum:
            - enforce
            - observe
        reason:
          type: string
          maxLength: 128
          description: The reason ID Desktop's registry publishes for the rule; Desktop owns its wording.
        from:
          $ref: '#/components/schemas/NativeRuleReport'
        to:
          $ref: '#/components/schemas/NativeRuleReport'
        at:
          type: string
          format: date-time
          description: The device time of the change; it never moves backwards within a Participation.
        occurrence:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: The rule's occurrence this change opened or closed, counted from 1 per Participation.
        event:
          type: string
          enum:
            - opened
            - closed
    NativeConditionListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NativeConditionEvidence'
        next_cursor:
          type: string
  responses:
    NativeConditionListOK:
      description: Bounded private native condition transitions, never a guilt finding.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NativeConditionListResponse'
          example:
            items: []
