paths:
  /api/v1/submissions/{submission_id}/native-conditions:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: listNativeConditions
      summary: Inspect minimized native condition transitions for a Submission
      tags:
        - Integrity review
      description: >-
        Lists the native condition changes the desktop app reported for one Submission, such as a
        condition opening, repeating or recovering. You need the same permission as for reading integrity
        evidence. Listing them does not create a Flag or declare a violation. Each record says when it was
        received and interpreted, and which delivery stream and policy it came under. Operational health,
        gaps and resets are not included. A page holds at most 100 records. When the Submission's
        integrity data is retired, these records are removed with it, whatever the retention of other
        native data. Responses are not cached.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of native condition records to return.
        - name: cursor
          in: query
          schema:
            type: string
            description: A page cursor.
          description: >-
            The `next_cursor` from the previous page. Pass it back unchanged and do not parse or build it
            yourself.
      responses:
        '200':
          $ref: '#/components/responses/NativeConditionListOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    NativeConditionEvidence:
      type: object
      additionalProperties: false
      description: >-
        One native condition change, kept as integrity data. It records an observation only, not a
        finding.
      required:
        - id
        - attempt_id
        - participation_id
        - generation
        - stream_id
        - security_session_id
        - policy_revision_id
        - policy_digest
        - application_release_id
        - matrix_id
        - batch_sequence
        - record_index
        - occurrence
        - unresolved_opener
        - received_at
        - interpreted_at
      properties:
        id:
          type: string
          minLength: 26
          maxLength: 26
          description: The record's ID.
        attempt_id:
          type: string
          minLength: 26
          maxLength: 26
          description: The Attempt the record belongs to.
        participation_id:
          type: string
          minLength: 26
          maxLength: 26
          description: The Participation whose desktop app reported the condition.
        generation:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: The generation of that Participation.
        stream_id:
          type: string
          minLength: 1
          maxLength: 128
          description: The native delivery stream the record arrived on.
        security_session_id:
          type: string
          minLength: 1
          maxLength: 128
          description: The desktop app's native security session that reported the condition.
        policy_revision_id:
          type: string
          minLength: 26
          maxLength: 26
          description: The Exam Revision whose native policy was in force.
        policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: The digest of that native policy, as `sha256:` followed by lowercase hex.
        application_release_id:
          type: string
          minLength: 1
          maxLength: 128
          description: The desktop app release that reported the condition.
        matrix_id:
          type: string
          minLength: 1
          maxLength: 128
          description: The desktop capability matrix the policy was checked against.
        batch_sequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 20000
          description: The sequence number of the delivery batch that carried the record.
        record_index:
          type: integer
          minimum: 0
          maximum: 63
          description: The record's position within that batch, starting at 0.
        occurrence:
          $ref: '#/components/schemas/NativeOccurrence'
          description: The condition change as the desktop app reported it.
        unresolved_opener:
          type: boolean
          description: >-
            True when the server never received the report that opened this condition, because of a
            delivery gap. It stays true for later changes to the same condition.
        received_at:
          type: string
          format: date-time
          description: When the server received the batch that carried the record.
        interpreted_at:
          type: string
          format: date-time
          description: When the server interpreted the record and kept it.
    NativeConditionListResponse:
      type: object
      additionalProperties: false
      description: One page of native condition records for a Submission.
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          description: The records on this page, at most `limit`.
          items:
            $ref: '#/components/schemas/NativeConditionEvidence'
        next_cursor:
          type: string
          description: >-
            Pass this as `cursor` to get the next page. Omitted on the last page. Don't parse or
            build it yourself.
  responses:
    NativeConditionListOK:
      description: One page of private native condition records. They are observations, never a finding of guilt.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NativeConditionListResponse'
          example:
            items:
              - id: dpbj4ddm3hw8fkicm7nuazihkg
