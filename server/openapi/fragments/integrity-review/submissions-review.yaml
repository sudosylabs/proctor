paths:
  /api/v1/submissions/{submission_id}/review:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: getExamIntegrityReview
      summary: Get the authorized manager Review snapshot
      tags:
        - Integrity review
      description: >-
        Returns the Review of one Submission as a manager sees it: the Review itself, the current decision
        for each Flag, counts and the integrity state. It includes private review fields. Candidates see
        only the released result, never this response.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/ExamIntegrityReviewOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateExamIntegrityReview
      summary: Create or revise private notes and approved student remarks
      tags:
        - Integrity review
      description: >-
        Creates the Review, or replaces its private manager notes and the remarks approved for the
        candidate. Send the Review's current revision; the request fails if it changed since you read it.
        A finalized Review can't change. Repeating the request with the same Idempotency-Key does not
        repeat audit records or notifications.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.revision_conflict
        - exam.integrity_review.state_conflict
        - exam.integrity_review.incomplete
        - exam.integrity_review.too_large
        - exam.integrity_review.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/UpdateExamIntegrityReview'
      responses:
        '200':
          $ref: '#/components/responses/ExamIntegrityReviewMutationOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/submissions/{submission_id}/review/decisions/{integrity_flag_id}:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
      - $ref: '#/components/parameters/IntegrityFlagID'
    put:
      operationId: saveExamIntegrityDecision
      summary: Create or revise the one current decision for a Flag
      tags:
        - Integrity review
      description: >-
        Creates or replaces the one current decision for a Flag. Send the decision's and the Review's
        current revisions; the request fails if either changed since you read them. The outcome is an
        integrity decision, not an academic one: never a grade or a verdict of guilt. The rationale stays
        private.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.revision_conflict
        - exam.integrity_review.state_conflict
        - exam.integrity_review.incomplete
        - exam.integrity_review.too_large
        - exam.integrity_review.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SaveExamIntegrityDecision'
      responses:
        '200':
          $ref: '#/components/responses/ExamIntegrityReviewMutationOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/submissions/{submission_id}/review/finalize:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    post:
      operationId: finalizeExamIntegrityReview
      summary: Freeze the complete Review and bounded evidence inventory
      tags:
        - Integrity review
      description: >-
        Finalizes a Review at its current revision. Every required decision must be made and the integrity
        data must be complete first. Finalizing freezes the Review's private content and records a digest
        of the evidence it covered. Records that arrive later become Discrepancies and can't change what
        was finalized.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.revision_conflict
        - exam.integrity_review.state_conflict
        - exam.integrity_review.incomplete
        - exam.integrity_review.too_large
        - exam.integrity_review.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/TerminalExamIntegrityReview'
      responses:
        '200':
          $ref: '#/components/responses/ExamIntegrityReviewMutationOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/submissions/{submission_id}/review/release:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    post:
      operationId: releaseStudentExamResult
      summary: Explicitly release the approved candidate result projection
      tags:
        - Integrity review
      description: >-
        Releases the result of a finalized Review to the candidate. The candidate sees only the remarks you
        approved. Manager notes, rationales, Flags, evidence, Discrepancies and other private review data
        stay hidden.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.revision_conflict
        - exam.integrity_review.state_conflict
        - exam.integrity_review.incomplete
        - exam.integrity_review.too_large
        - exam.integrity_review.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/TerminalExamIntegrityReview'
      responses:
        '200':
          $ref: '#/components/responses/ExamIntegrityReviewMutationOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    SaveExamIntegrityDecision:
      description: The outcome and private rationale for one integrity Flag, with the current revisions.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SaveExamIntegrityDecisionRequest'
          example:
            expected_revision: 0
            expected_review_revision: 0
            outcome: inconclusive
            private_rationale: The retained evidence does not establish a reliable conclusion.
    UpdateExamIntegrityReview:
      description: The full private notes and candidate remarks, with the Review's current revision.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateExamIntegrityReviewRequest'
          example:
            expected_revision: 0
            manager_notes: Review opened; evidence assessment is pending.
            student_remarks_markdown: ''
    TerminalExamIntegrityReview:
      description: The Review to finalize or release, and its current revision.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TerminalExamIntegrityReviewRequest'
          example:
            submission_review_id: ybndrfg8ejkmcpqxot1uwisza3
            expected_revision: 7
  responses:
    ExamIntegrityReviewOK:
      description: The Review as a manager sees it, including private fields.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamIntegrityReviewResponse'
          example:
            submission_id: 39kqk53i4cswfzbi7hbai1r8qg
            exam_id: wj3drgzdpnf54rxf5d8qd3dqne
            exam_sitting_id: 14j8umgczgrdp95w77zuxmxfu9
            exam_attempt_id: 6xoche483hwrx5rpu8jzjoe7qg
            candidate_user_id: sjebyge5cpbop1xwo4eds74ejb
            integrity_state: settled
            unresolved_integrity_count: 0
            review:
              id: 5ebqfbnezgahdbx9oy7rfr6oro
              submission_id: 39kqk53i4cswfzbi7hbai1r8qg
              state: draft
              release_state: withheld
              revision: 3
              created_by_user_id: p9qhih5ecxfmifwxzocb4a4pat
              manager_notes: Focus loss during question 2 matches the reported room interruption.
              student_remarks_markdown: ''
              flag_count: 0
              evidence_count: 0
              discrepancy_count: 0
              created_at: '2026-12-15T13:02:11Z'
              updated_at: '2026-12-15T13:20:46Z'
            decisions:
              - id: fd4he19dek64i1uoo3xu638kkr
                integrity_flag_id: xpq79ar61ncrjiouey6d9tgp91
                outcome: dismissed
                revision: 1
                actor_user_id: p9qhih5ecxfmifwxzocb4a4pat
                private_rationale: Both focus losses fall within the documented room interruption.
                decided_at: '2026-12-15T13:20:46Z'
                inventory_stale: false
            browser_activity:
              state: not_applicable
              inventory_revision: 1
              source_count: 0
              pending_source_count: 0
              incomplete_source_count: 0
            delivery_inventory_revision: 0
            native_conditions:
              records: 0
              digest: sha256:b29f78624e0ba2ee6710a9b4e892d0ed2b66077bcc9ba397eb22d3302cfdcbb5
    ExamIntegrityReviewMutationOK:
      description: >-
        The change was saved. Repeating the request with the same Idempotency-Key returns the same
        response.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamIntegrityReviewMutationResponse'
          example:
            submission_id: 39kqk53i4cswfzbi7hbai1r8qg
            exam_attempt_id: 6xoche483hwrx5rpu8jzjoe7qg
            candidate_user_id: sjebyge5cpbop1xwo4eds74ejb
            review:
              id: 5ebqfbnezgahdbx9oy7rfr6oro
              submission_id: 39kqk53i4cswfzbi7hbai1r8qg
              state: draft
              release_state: withheld
              revision: 3
              created_by_user_id: p9qhih5ecxfmifwxzocb4a4pat
              manager_notes: Focus loss during question 2 matches the reported room interruption.
              student_remarks_markdown: ''
              flag_count: 0
              evidence_count: 0
              discrepancy_count: 0
              created_at: '2026-12-15T13:02:11Z'
              updated_at: '2026-12-15T13:20:46Z'
            decision:
              id: fd4he19dek64i1uoo3xu638kkr
              integrity_flag_id: xpq79ar61ncrjiouey6d9tgp91
              outcome: dismissed
              revision: 1
              actor_user_id: p9qhih5ecxfmifwxzocb4a4pat
              private_rationale: Both focus losses fall within the documented room interruption.
              decided_at: '2026-12-15T13:20:46Z'
              inventory_stale: false
  schemas:
    SaveExamIntegrityDecisionRequest:
      description: A new or replacement decision for one integrity Flag.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - expected_review_revision
        - outcome
        - private_rationale
      properties:
        submission_review_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Review's ID. Required once the Review exists. Leave it out only when this decision creates
            the Review.
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: 0 for the first decision on this Flag; otherwise the decision's current revision.
        expected_review_revision:
          type: integer
          format: int64
          minimum: 0
          description: 0 when this decision creates the Review; otherwise the Review's current revision.
        outcome:
          type: string
          enum:
            - confirmed
            - dismissed
            - inconclusive
          description: >-
            Your conclusion about the Flag: `confirmed`, `dismissed` or `inconclusive`. It is about integrity
            only, never a grade or a verdict of guilt.
        private_rationale:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Why you reached this outcome. Only managers can see it. Send valid UTF-8 with no leading or
            trailing whitespace: at most 1000 characters and 4000 bytes.
    UpdateExamIntegrityReviewRequest:
      description: >-
        The full new text of the Review. Both text members replace their current values, so send both.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - manager_notes
        - student_remarks_markdown
      properties:
        submission_review_id:
          $ref: '#/components/schemas/ID'
          description: The Review's ID. Required once the Review exists. Leave it out only when creating it.
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: 0 when creating the Review; otherwise the Review's current revision.
        manager_notes:
          type: string
          maxLength: 3000
          description: >-
            Private notes for managers. Send valid UTF-8 with no leading or trailing whitespace: at most
            3000 characters and 12000 bytes. Can be empty.
        student_remarks_markdown:
          type: string
          maxLength: 8192
          description: >-
            Remarks for the candidate, in Markdown, shown once the result is released. At most 8192
            characters and 32768 bytes of UTF-8. Can be empty. Unsafe content is removed again when the
            candidate reads the result.
    TerminalExamIntegrityReviewRequest:
      description: The Review to finalize or release, and its current revision.
      type: object
      additionalProperties: false
      required:
        - submission_review_id
        - expected_revision
      properties:
        submission_review_id:
          $ref: '#/components/schemas/ID'
          description: The Review's ID.
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Review's current revision, as last read. The request fails with a conflict if the Review has
            changed since.
    ExamIntegrityReviewDecisionResponse:
      description: The current private decision on one integrity Flag.
      type: object
      additionalProperties: false
      required:
        - id
        - integrity_flag_id
        - outcome
        - revision
        - actor_user_id
        - private_rationale
        - decided_at
        - inventory_stale
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The decision's ID.
        integrity_flag_id:
          $ref: '#/components/schemas/ID'
          description: The Flag the decision is about.
        outcome:
          type: string
          enum:
            - confirmed
            - dismissed
            - inconclusive
          description: The manager's conclusion about the Flag. It is never a grade or a verdict of guilt.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Starts at 1 and goes up each time the decision is replaced. Send it as `expected_revision` to
            replace the decision.
        actor_user_id:
          $ref: '#/components/schemas/ID'
          description: The manager who made the current decision.
        private_rationale:
          type: string
          minLength: 1
          maxLength: 1000
          description: The manager's reason for the outcome. Only managers can see it.
        decided_at:
          type: string
          format: date-time
          description: When the current decision was made.
        inventory_stale:
          type: boolean
          description: >-
            True when new evidence was accepted after this decision. Save a new decision on the Flag before
            finalizing.
    ExamSubmissionReviewResponse:
      description: >-
        The manager's private Review of a Submission. If the server accepts new integrity data after
        finalization, the Review goes back to a withheld draft. What earlier finalizations recorded is kept
        and can't change.
      type: object
      additionalProperties: false
      required:
        - id
        - submission_id
        - state
        - release_state
        - revision
        - created_by_user_id
        - manager_notes
        - student_remarks_markdown
        - flag_count
        - evidence_count
        - discrepancy_count
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The Review's ID.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: The Submission under review.
        state:
          type: string
          enum:
            - draft
            - finalized
          description: '`draft` while the Review can still change; `finalized` once it is frozen.'
        release_state:
          type: string
          enum:
            - withheld
            - released
          description: Whether the candidate's result is still withheld or has been released. Only a finalized Review can be released.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Goes up by one with every change to the Review or its decisions. Send it as the expected
            Review revision in your next change.
        created_by_user_id:
          $ref: '#/components/schemas/ID'
          description: The manager who created the Review.
        manager_notes:
          type: string
          maxLength: 3000
          description: Private notes for managers. Can be empty.
        student_remarks_markdown:
          type: string
          maxLength: 8192
          description: The remarks for the candidate, in Markdown, as saved. Can be empty.
        flag_count:
          type: integer
          minimum: 0
          maximum: 456
          description: The number of Flags covered at finalization. 0 while the Review is a draft.
        evidence_count:
          type: integer
          minimum: 0
          maximum: 30000
          description: The number of evidence records covered at finalization. 0 while the Review is a draft.
        discrepancy_count:
          type: integer
          minimum: 0
          maximum: 200
          description: The number of Discrepancies covered at finalization. 0 while the Review is a draft.
        evidence_inventory_digest:
          $ref: '#/components/schemas/SHA256'
          description: >-
            A SHA-256 digest, as lowercase hex, of the evidence the Review covered when it was finalized.
            Present only once the Review is finalized.
        created_at:
          type: string
          format: date-time
          description: When the Review was created.
        updated_at:
          type: string
          format: date-time
          description: When the Review last changed.
        finalized_at:
          type: string
          format: date-time
          description: When the Review was finalized. Present only once it is finalized.
        finalized_by_user_id:
          $ref: '#/components/schemas/ID'
          description: The manager who finalized the Review. Present only once it is finalized.
        released_at:
          type: string
          format: date-time
          description: When the result was released. Present only once it is released.
        released_by_user_id:
          $ref: '#/components/schemas/ID'
          description: The manager who released the result. Present only once it is released.
    ExamIntegrityReviewResponse:
      description: A Submission's integrity state, its Review if one exists, and the current decisions.
      type: object
      additionalProperties: false
      required:
        - submission_id
        - exam_id
        - exam_sitting_id
        - exam_attempt_id
        - candidate_user_id
        - integrity_state
        - unresolved_integrity_count
        - decisions
        - browser_activity
        - delivery_inventory_revision
        - native_conditions
      properties:
        submission_id:
          $ref: '#/components/schemas/ID'
          description: The Submission under review.
        exam_id:
          $ref: '#/components/schemas/ID'
          description: The Exam the Submission belongs to.
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: The Sitting the Submission belongs to.
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
          description: The Attempt that was sealed.
        candidate_user_id:
          $ref: '#/components/schemas/ID'
          description: The candidate who made the Submission.
        integrity_state:
          type: string
          enum:
            - settled
            - gapped
          description: '`settled` when the integrity data is complete; `gapped` when it has a known gap.'
        unresolved_integrity_count:
          type: integer
          format: int64
          minimum: 0
          description: The number of unresolved integrity items. While above 0, they can block finalization.
        review:
          $ref: '#/components/schemas/ExamSubmissionReviewResponse'
          description: The Review. Omitted until a manager creates one.
        decisions:
          type: array
          maxItems: 200
          description: The current decision for each Flag that has one. Empty until a decision is saved.
          items:
            $ref: '#/components/schemas/ExamIntegrityReviewDecisionResponse'
        browser_activity:
          $ref: '#/components/schemas/BrowserSubmissionSettlement'
        browser_evidence_overflow:
          $ref: '#/components/schemas/BrowserIntegrityOverflow'
          description: Browser events not kept as evidence because of the group limit. Omitted when none were dropped.
        delivery_inventory_revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: >-
            Goes up each time the server accepts integrity data that arrived late. Send it when you waive
            the Review, which you can do before any Review exists.
        native_conditions:
          $ref: '#/components/schemas/NativeConditionInventory'
          description: The count and digest of native condition records kept for the Attempt.
    ExamIntegrityReviewMutationResponse:
      description: The Review after the change, and the decision when the change saved one.
      type: object
      additionalProperties: false
      required:
        - submission_id
        - exam_attempt_id
        - candidate_user_id
        - review
      properties:
        submission_id:
          $ref: '#/components/schemas/ID'
          description: The Submission under review.
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
          description: The Attempt that was sealed.
        candidate_user_id:
          $ref: '#/components/schemas/ID'
          description: The candidate who made the Submission.
        review:
          $ref: '#/components/schemas/ExamSubmissionReviewResponse'
          description: The Review after the change.
        decision:
          $ref: '#/components/schemas/ExamIntegrityReviewDecisionResponse'
          description: The saved decision. Present only when the request saved a decision.
