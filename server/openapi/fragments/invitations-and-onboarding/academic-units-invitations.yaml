paths:
  /api/v1/academic-units/{academic_unit_id}/invitations/teacher:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    post:
      operationId: issueTeacherAcademicUnitInvitation
      summary: Invite a teacher into one exact Academic Unit with one delegated Role package
      description: >-
        Invites a teacher into one Academic Unit with one Role you may delegate. The request checks the recipient
        address, whether the Role can be delegated, the start and end, and your authority as the inviter. Once
        issued, the Invitation's terms cannot change. The one-time claim is sent by email and never returned to
        you.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - invitation.invalid
        - invitation.role_not_delegable
        - invitation.conflict
        - invitation.mail_unavailable
        - invitation.unavailable
        - onboarding_batch.duplicate
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        description: >-
          The recipient, the Role to delegate, an optional start and end, and suggested profile fields for the new
          teacher account.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTeacherAcademicUnitInvitationRequest'
            example:
              email: teacher.one@example.edu
              role_id: ybndrfg8ejkmcpqxot1uwisza3
              suggested_username: teacher-one
              suggested_display_name: Teacher One
              start_at: '2026-08-01T00:00:00Z'
      responses:
        "201":
          description: The Invitation was issued. The response contains neither the claim nor mailbox details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
              example:
                id: 3acmqxefoaf9c4pzapj7miff6w
                purpose: teacher_academic_unit
                state: pending
                academic_unit_id: 889766ufjgio6kbpzjbufozksq
                role_id: ybndrfg8ejkmcpqxot1uwisza3
                role_actions:
                  - class.view
                  - exam.create
                start_at: '2026-08-01T00:00:00Z'
                expires_at: '2026-07-21T09:30:00Z'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/academic-units/{academic_unit_id}/invitations/role:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    post:
      operationId: issueAcademicUnitRoleInvitation
      summary: Invite an existing User to one exact Academic Unit Role package
      description: >-
        Invites an existing User, by email address, to one Role scoped to the Academic Unit in the path. Acceptance
        cannot widen the Role, scope or dates the Invitation records. The claim is only ever sent by email and used
        to accept.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - invitation.invalid
        - invitation.role_not_delegable
        - invitation.conflict
        - invitation.mail_unavailable
        - invitation.unavailable
        - onboarding_batch.duplicate
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        description: >-
          The existing User's address, the Role to grant, and an optional start and end at the Academic Unit in the
          path.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueScopedRoleInvitationRequest'
            example:
              email: reviewer.one@example.edu
              role_id: ybndrfg8ejkmcpqxot1uwisza3
              start_at: '2026-08-01T00:00:00Z'
      responses:
        "201":
          description: The Invitation was issued. The response contains neither the claim nor mailbox details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
              example:
                id: 3nty5pzf7c7dsepkhmmn8bk64f
                purpose: academic_unit_role
                state: pending
                academic_unit_id: 889766ufjgio6kbpzjbufozksq
                role_id: ybndrfg8ejkmcpqxot1uwisza3
                role_actions:
                  - exam.view
                start_at: '2026-08-01T00:00:00Z'
                expires_at: '2026-07-21T09:30:00Z'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    IssueTeacherAcademicUnitInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role_id
      properties:
        email:
          type: string
          format: email
          description: The address to send the Invitation to. An account created on acceptance gets this address.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role the teacher gets in the Academic Unit. You must be allowed to delegate it.
        start_at:
          type: string
          format: date-time
          description: >-
            When the teacher's membership and Role start once accepted. Omit it to start when the Invitation is
            issued.
        end_at:
          type: string
          format: date-time
          description: When the membership and Role end; it must be after the start. Omit it for no end.
        expires_in_days:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 30
          description: >-
            How many whole days the Invitation can be accepted for, from 1 to 30. Omit it or send null for 7 days. A
            value outside the range is refused with invitation.invalid.
        suggested_username:
          type: string
          maxLength: 64
          description: A username to suggest. The invitee chooses their own username when accepting.
        suggested_display_name:
          type: string
          maxLength: 512
          description: The name used to greet the invitee in the Invitation email.
        suggested_first_name:
          type: string
          maxLength: 256
          description: A first name to suggest for the new account.
        suggested_last_name:
          type: string
          maxLength: 256
          description: A last name to suggest for the new account.
        suggested_locale:
          type: string
          maxLength: 35
          description: The language of the Invitation email, as a language tag such as `en`.
        suggested_timezone:
          type: string
          maxLength: 64
          description: >-
            The time zone the new account gets if the invitee gives none when accepting, such as `Europe/Paris`.
