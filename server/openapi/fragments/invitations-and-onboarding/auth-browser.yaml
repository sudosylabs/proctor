paths:
  /api/v1/auth/browser/invitations:
    post:
      operationId: startBrowserInvitation
      summary: Exchange an Invitation claim for a purpose-bound browser acceptance transaction
      description: >-
        Exchanges a one-time Invitation claim for a short-lived browser handle tied to that Invitation and its
        purpose, without using up the Invitation yet. The response does not repeat the claim, so the claim never has
        to appear in later browser URLs or logs. It names the address the Invitation was sent to, which acceptance
        uses and the browser cannot change. For a student Class Invitation only, it also gives the Class display
        name; Academic Unit and Role names are never returned.
      tags:
        - Invitations and onboarding
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/BrowserInvitationStart'
      responses:
        "201":
          $ref: '#/components/responses/BrowserInvitationStarted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/browser/invitations/accept:
    post:
      operationId: acceptBrowserInvitation
      summary: Accept an account-creating Invitation through its browser transaction
      description: >-
        Creates the invited account and applies what the Invitation grants, using one browser handle. The password
        and profile are validated, the handle is used up in the same step, and no claim or credential is ever
        returned.
      tags:
        - Invitations and onboarding
      x-proctor-auth: public
      x-proctor-error-codes:
        - service.busy
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.user_invalid
        - invitation.mail_unavailable
        - invitation.unavailable
        - authentication.password.invalid
        - authentication.password.pattern_invalid
        - authentication.password.common_invalid
        - authentication.password.identity_invalid
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/BrowserInvitationAcceptance'
      responses:
        "200":
          $ref: '#/components/responses/BrowserInvitationAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/browser/invitations/accept-session:
    post:
      operationId: acceptBrowserInvitationWithSession
      summary: Accept a scoped-role Invitation with the current browser Session
      description: >-
        Applies a Role Invitation to the signed-in User the browser handle is tied to. It never moves the Invitation
        to another User, and the handle is used up in the same step.
      tags:
        - Invitations and onboarding
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.unavailable
        - audit.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/BrowserInvitationSessionAcceptance'
      responses:
        "200":
          $ref: '#/components/responses/BrowserInvitationAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    BrowserInvitationStart:
      description: The one-time claim from the Invitation email.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserInvitationStartRequest'
          example:
            claim: zWT3q-SolqxwrFkEGxq_MAfGRuTbm0sJ07Vn-A5PnaQ
    BrowserInvitationAcceptance:
      description: The browser handle, the password and username for the new account, and optional profile fields.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserInvitationAcceptanceRequest'
          example:
            handle: 5IVl2oSEMui7aeP8X36BUp0eryeDfmJGYT17o96b474
            password: Correct-Horse-Battery-Staple-2048!
            username: student-one
            display_name: Student One
            locale: en
            timezone: Europe/Paris
    BrowserInvitationSessionAcceptance:
      description: The browser handle to accept as the signed-in User.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserInvitationSessionAcceptanceRequest'
          example:
            handle: x2Z6JZoJCDoS8BISd9ydKhVMOLsvze00_XSCdWqIN84
  responses:
    BrowserInvitationStarted:
      description: >-
        A short-lived browser acceptance has started. Its second proof is set only as an HttpOnly cookie, and
        accepting needs both the handle and that cookie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserInvitationStartResponse'
          example:
            handle: 5IVl2oSEMui7aeP8X36BUp0eryeDfmJGYT17o96b474
            purpose: student_class
            requirement: account
            expires_at: '2026-08-20T10:45:00Z'
            email: student.one@example.edu
            class_display_name: Year 10 Chemistry A
    BrowserInvitationAccepted:
      description: The Invitation was accepted, or the outcome of an earlier identical acceptance was returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationAcceptanceResponse'
          example:
            user_id: jxcnnw8a7u4ux5azhhmby97xh7
            invitation_id: ccrzmhoygspnzijnponpyw4zmu
            affiliation_id: rga9cuen6wdafkq3c6mpn3kas8
            class_member_id: o59e9myujxww7zfc3kx4rn6wk5
            replayed: false
  schemas:
    BrowserInvitationStartRequest:
      type: object
      additionalProperties: false
      required:
        - claim
      properties:
        claim:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: The one-time claim from the Invitation email.
    BrowserInvitationAcceptanceRequest:
      type: object
      additionalProperties: false
      required:
        - handle
        - password
        - username
      properties:
        handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: The `handle` returned when the browser acceptance started.
        password:
          type: string
          description: The password for the new account. It must meet the password policy.
        username:
          type: string
          maxLength: 64
          description: The username for the new account.
        display_name:
          type: string
          maxLength: 128
          description: The new account's display name.
        first_name:
          type: string
          maxLength: 64
          description: The account holder's first name.
        last_name:
          type: string
          maxLength: 64
          description: The account holder's last name.
        locale:
          type: string
          maxLength: 35
          description: The account's language, as a language tag such as `en`.
        timezone:
          type: string
          maxLength: 64
          description: >-
            The account's time zone, such as `Europe/Paris`. Omit it to use the time zone the inviter suggested.
    BrowserInvitationSessionAcceptanceRequest:
      type: object
      additionalProperties: false
      required:
        - handle
      properties:
        handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: The `handle` returned when the browser acceptance started.
    BrowserInvitationStartResponse:
      type: object
      additionalProperties: false
      required:
        - handle
        - purpose
        - requirement
        - expires_at
        - email
      properties:
        handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: >-
            The browser handle to send when accepting. It works only together with the proof cookie set on this
            response, and only until `expires_at`.
        purpose:
          type: string
          enum:
            - student_class
            - teacher_academic_unit
            - academic_unit_role
            - institution_role
          description: The purpose of the Invitation being accepted.
        requirement:
          type: string
          enum:
            - account
            - session
          description: >-
            What accepting needs. `account` means the browser creates a new account, for student Class and teacher
            Academic Unit Invitations. `session` means the invitee must be signed in, for Role Invitations.
        expires_at:
          type: string
          format: date-time
          description: When the browser handle stops working.
        email:
          type: string
          format: email
          description: >-
            The normalized address the Invitation was sent to. Account-creating acceptance gives the new account this
            address; no acceptance operation takes an address from the browser.
        class_display_name:
          type: string
          description: >-
            Display name of the Class a student Class Invitation enrolls the invitee in. Omitted for every other
            purpose.
