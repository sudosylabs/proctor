paths:
  /api/v1/institutions/{institution_id}/invitations/role:
    parameters:
      - $ref: '#/components/parameters/InstitutionID'
    post:
      operationId: issueInstitutionRoleInvitation
      summary: Invite an existing User to one exact Institution Role package
      description: >-
        Invites an existing User to one Role scoped to the Institution. It needs a strong, recent Session and runs
        the checks that keep the Institution from losing its last administrator. Acceptance cannot narrow or widen
        the Role and scope the Invitation records, and the one-time claim is kept secret.
      tags:
        - Invitations and onboarding
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - invitation.invalid
        - invitation.role_not_delegable
        - invitation.conflict
        - invitation.mail_unavailable
        - invitation.unavailable
        - onboarding_batch.duplicate
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        description: >-
          The existing User's address, the Role to grant, and an optional start and end at the Institution in the
          path.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueScopedRoleInvitationRequest'
            example:
              email: administrator.one@example.edu
              role_id: ybndrfg8ejkmcpqxot1uwisza3
              start_at: '2026-08-01T00:00:00Z'
      responses:
        "201":
          description: The Invitation was issued. The response contains neither the claim nor mailbox details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
              example:
                id: 1mm4jpw9qo8zmr1ydipa3i3a4z
                purpose: institution_role
                state: pending
                role_id: ybndrfg8ejkmcpqxot1uwisza3
                role_actions:
                  - user.view
                  - audit.view
                start_at: '2026-08-01T00:00:00Z'
                expires_at: '2026-07-21T09:30:00Z'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    InstitutionID:
      name: institution_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of this installation's Institution.
