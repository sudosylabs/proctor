paths:
  /api/v1/invitations/{invitation_id}/replacement:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    post:
      operationId: replaceInvitation
      summary: Supersede a pending Invitation with a changed immutable package
      description: >-
        Replaces a pending Invitation with a new one that has the changes you ask for. If the revision you send still
        matches, the request revokes the Invitation and issues a new one with a new one-time claim. The old claim
        cannot accept the new Invitation, and the history links the two.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - invitation.invalid
        - invitation.role_not_delegable
        - invitation.conflict
        - invitation.mail_unavailable
        - invitation.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/ReplaceInvitation'
      responses:
        "201":
          $ref: '#/components/responses/InvitationAdministrationCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ReplaceInvitation:
      description: The pending Invitation's current revision and the complete terms of the new Invitation.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReplaceInvitationRequest'
          example:
            expected_revision: 2
            purpose: student_class
            email: student.one@example.edu
            class_id: ybndrfg8ejkmcpqxot1uwisza3
            suggested_username: student-one
  responses:
    InvitationAdministrationCreated:
      description: The new Invitation. The Invitation it replaced is now `superseded`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationAdministrationResponse'
          example:
            id: o514k1ahcaicsys1cko4q4s3y8
            purpose: student_class
            state: pending
            class_id: ybndrfg8ejkmcpqxot1uwisza3
            academic_period_id: p6y6sf8ac6m5if373fkkebj7j6
            start_at: '2026-09-01T00:00:00Z'
            expires_at: '2026-08-29T14:00:00Z'
            email: student.one@example.edu
            inviter_user_id: rpn96r4g3jfk3t41u4dus44bzc
            inviter:
              id: rpn96r4g3jfk3t41u4dus44bzc
              display_name: Priya Raman
            scope:
              type: class
              id: ybndrfg8ejkmcpqxot1uwisza3
              name: Year 1 Mathematics A
            created_at: '2026-08-22T14:00:00Z'
            updated_at: '2026-08-22T14:00:00Z'
            revision: 1
            delivery:
              template_key: access.student_class_invitation
              state: queued
              masked_recipient: s***@example.edu
              created_at: '2026-08-22T14:00:00Z'
              updated_at: '2026-08-22T14:00:00Z'
              deadline: '2026-08-23T14:00:00Z'
  schemas:
    ReplaceInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - purpose
        - email
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The pending Invitation's current `revision`.
        purpose:
          type: string
          enum:
            - student_class
            - teacher_academic_unit
            - academic_unit_role
            - institution_role
          description: The purpose of the new Invitation.
        email:
          type: string
          format: email
          description: The address to send the new Invitation to.
        class_id:
          $ref: '#/components/schemas/ID'
          description: The Class of a `student_class` Invitation.
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit of a `teacher_academic_unit` or `academic_unit_role` Invitation.
        institution_id:
          $ref: '#/components/schemas/ID'
          description: The Institution of an `institution_role` Invitation.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role the new Invitation grants, for every purpose except `student_class`.
        start_at:
          type: string
          format: date-time
          description: >-
            When the relationship the new Invitation grants starts. Omit it for the default: the Academic Period's
            start for a student Class Invitation, otherwise the time of issue.
        end_at:
          type: string
          format: date-time
          description: When that relationship ends; it must be after the start. Omit it for no end.
        expires_in_days:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 30
          description: >-
            How many whole days the new Invitation can be accepted for, from 1 to 30. Omit it or send null to keep
            the replaced Invitation's own lifetime, rounded to whole days. A value outside the range is refused with
            invitation.invalid.
        suggested_username:
          type: string
          maxLength: 64
          description: A username to suggest. The invitee chooses their own username when accepting.
        suggested_display_name:
          type: string
          maxLength: 512
          description: The name used to greet the invitee in the Invitation email.
        suggested_first_name:
          type: string
          maxLength: 256
          description: A first name to suggest for the new account.
        suggested_last_name:
          type: string
          maxLength: 256
          description: A last name to suggest for the new account.
        suggested_locale:
          type: string
          maxLength: 35
          description: The language of the Invitation email, as a language tag such as `en`.
        suggested_timezone:
          type: string
          maxLength: 64
          description: >-
            The time zone the new account gets if the invitee gives none when accepting, such as `Europe/Paris`.
