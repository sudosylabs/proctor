paths:
  /api/v1/invitations:
    get:
      operationId: listInvitations
      summary: List Invitations within the caller's authorized scope
      description: >-
        Lists the Invitations you can see through your current Institution, Academic Unit or Class authority. Items
        hold safe metadata only. Claims, email contents, recipient secrets, mail provider state and acceptance
        credentials are never returned.

        The first page, read without a cursor, also reports `total`: the number of Invitations the filters and your
        visibility match across all pages. It is exact below 10,000; at 10,000 counting stops and
        `total_is_lower_bound` is true. Later pages carry no total, so keep the first page's.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - invitation.query.invalid
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: purpose
          in: query
          required: false
          description: Return only Invitations with this purpose.
          schema:
            type: string
            enum:
              - student_class
              - teacher_academic_unit
              - academic_unit_role
              - institution_role
        - name: state
          in: query
          required: false
          description: Return only Invitations in this state.
          schema:
            type: string
            enum:
              - pending
              - accepted
              - revoked
              - expired
              - superseded
        - name: email
          in: query
          required: false
          description: Return only Invitations sent to exactly this address, compared after normalizing it.
          schema:
            type: string
            format: email
        - name: target_id
          in: query
          required: false
          description: Return only Invitations for this exact Class, Academic Unit or Institution.
          schema:
            $ref: '#/components/schemas/ID'
        - name: created_after
          in: query
          required: false
          description: Return only Invitations created at or after this instant.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Return only Invitations created before this instant.
          schema:
            type: string
            format: date-time
        - name: expires_after
          in: query
          required: false
          description: Return only Invitations that expire at or after this instant.
          schema:
            type: string
            format: date-time
        - name: expires_before
          in: query
          required: false
          description: Return only Invitations that expire before this instant. It must be later than `expires_after`.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: >-
            Return only Invitations whose invited address or suggested display name starts with this text, compared
            case-insensitively after trimming spaces. It is matched literally, at most 254 characters.
          schema:
            type: string
            maxLength: 254
        - name: delivery_state
          in: query
          required: false
          description: >-
            Return only Invitations whose newest delivery is in one of these states. Repeat the parameter for several
            states. An Invitation with no delivery matches none.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            items:
              type: string
              enum:
                - queued
                - sending
                - accepted
                - failed
                - suppressed
                - canceled
        - name: sort
          in: query
          required: false
          description: >-
            Sort by creation (`created`, the default) or expiry (`expires`) time, with Invitation ID breaking ties. A
            cursor works only with the sort and direction that produced it.
          schema:
            type: string
            enum:
              - created
              - expires
            default: created
        - name: dir
          in: query
          required: false
          description: Descending (`desc`, the default, newest or latest first) or ascending (`asc`) by the `sort` key.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page, passed back unchanged.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: The most Invitations to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          $ref: '#/components/responses/InvitationAdministrationListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    get:
      operationId: getInvitation
      summary: Get one Invitation within the caller's authorized scope
      description: >-
        Returns one Invitation, what it grants and its state, if you may see its scope. The response never includes
        the one-time claim, the email contents or any credential.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/InvitationAdministrationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/student-class/accept:
    post:
      operationId: acceptStudentClassInvitation
      summary: Accept a student Class Invitation using its one-time claim
      description: >-
        Creates or admits the student account and the Class enrollment that the claim stands for, in one step. Before
        it uses up the claim, it checks the Invitation's state, the Access Policy and the Class again, and that the
        enrollment does not clash with another in the same Academic Period.
      tags:
        - Invitations and onboarding
      x-proctor-auth: public
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - service.busy
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.user_invalid
        - invitation.mail_unavailable
        - invitation.unavailable
        - authentication.password.invalid
        - authentication.password.pattern_invalid
        - authentication.password.common_invalid
        - authentication.password.identity_invalid
      security: []
      requestBody:
        required: true
        description: The one-time claim from the Invitation email, and the password and profile for the student account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptStudentClassInvitationRequest'
            example:
              claim: 2IpyNuCaKGazPneWZPgJHzvc1vdw7PV4aonvCyId37s
              password: correct-horse-battery-staple-2026
              username: student.one
              display_name: Student One
              locale: en
              timezone: Europe/Paris
      responses:
        "200":
          description: The Invitation was accepted, or an earlier identical acceptance was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceResponse'
              example:
                user_id: jxcnnw8a7u4ux5azhhmby97xh7
                invitation_id: ccrzmhoygspnzijnponpyw4zmu
                affiliation_id: rga9cuen6wdafkq3c6mpn3kas8
                class_member_id: o59e9myujxww7zfc3kx4rn6wk5
                replayed: false
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/teacher-academic-unit/accept:
    post:
      operationId: acceptTeacherAcademicUnitInvitation
      summary: Accept a teacher Academic Unit Invitation using its one-time claim
      description: >-
        Creates the teacher account and applies the teacher relationship and Academic Unit Role the Invitation
        records, in one step, after checking the current Access Policy and that the scope is still valid. The
        one-time claim is used up and can never be used again.
      tags:
        - Invitations and onboarding
      x-proctor-auth: public
      security: []
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - service.busy
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.user_invalid
        - invitation.mail_unavailable
        - invitation.unavailable
        - authentication.password.invalid
        - authentication.password.pattern_invalid
        - authentication.password.common_invalid
        - authentication.password.identity_invalid
      requestBody:
        required: true
        description: The one-time claim from the Invitation email, and the password and profile for the teacher account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptTeacherAcademicUnitInvitationRequest'
            example:
              claim: JCPcYrAzk0xF_0tMv6-lLn8wNNQMJANizm90rm9cgWY
              password: careful-teacher-passphrase-2026
              username: teacher.one
              display_name: Teacher One
              locale: en
              timezone: Europe/Paris
      responses:
        "200":
          description: The Invitation was accepted, or an earlier identical acceptance was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceResponse'
              example:
                user_id: xgqjjg7fnyeqnueo58grucaoqy
                invitation_id: id9tzepftxa3h5uben569yr37h
                affiliation_id: p9qhih5ecxfmifwxzocb4a4pat
                academic_unit_member_id: fd4he19dek64i1uoo3xu638kkr
                role_binding_id: 9tq4y1cdbbxwnspu3ojoa8hmrz
                replayed: false
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/academic-unit-role/accept:
    post:
      operationId: acceptAcademicUnitRoleInvitation
      summary: Accept an Academic Unit Role Invitation as the authenticated User
      description: >-
        Applies the Academic Unit Role the Invitation records to you, the signed-in User it was sent to, after
        checking the scope and the Access Policy again. Acceptance cannot change what the Invitation grants or pass it
        to another account.
      tags:
        - Invitations and onboarding
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - audit.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        description: The one-time claim of the Academic Unit Role Invitation to accept as the signed-in User.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptScopedRoleInvitationRequest'
            example:
              claim: 2TRSHJWS39QTbBRa05Er-c39xctr79Ge9SWZasZqSGA
      responses:
        "200":
          description: The Invitation was accepted, or the outcome of an earlier identical acceptance was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceResponse'
              example:
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                invitation_id: kq8ewbhn3zr5ap6xsy1ofdm4ui
                role_binding_id: 7ugcsj9wnebd1hmq4taxo8yzrk
                replayed: false
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/institution-role/accept:
    post:
      operationId: acceptInstitutionRoleInvitation
      summary: Accept an Institution Role Invitation as the authenticated User
      description: >-
        Applies the Institution Role the Invitation records to you, the signed-in User it was sent to, after the
        strict authorization checks for Institution Roles are run again. The Invitation cannot be used for another
        Role or User.
      tags:
        - Invitations and onboarding
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - audit.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        description: The one-time claim of the Institution Role Invitation to accept as the signed-in User.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptScopedRoleInvitationRequest'
            example:
              claim: 3bccheCqCcpjrmgYuT-1oF_RH9lXXwQ_4BKEF2W3Rg0
      responses:
        "200":
          description: The Invitation was accepted, or the outcome of an earlier identical acceptance was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceResponse'
              example:
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                invitation_id: zb6mfx1rkaew3ncypoh8d4ts9j
                role_binding_id: 3jdn5wpxagoi6rbuk1eh7fzmcy
                replayed: false
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    InvitationAdministrationListOK:
      description: One page of the Invitations you can see.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationAdministrationListResponse'
          example:
            items:
              - id: ccrzmhoygspnzijnponpyw4zmu
                purpose: student_class
                state: pending
                class_id: sjebyge5cpbop1xwo4eds74ejb
                academic_period_id: p6y6sf8ac6m5if373fkkebj7j6
                start_at: '2026-09-01T00:00:00Z'
                expires_at: '2026-08-27T10:00:00Z'
                email: student.one@example.edu
                inviter_user_id: rpn96r4g3jfk3t41u4dus44bzc
                inviter:
                  id: rpn96r4g3jfk3t41u4dus44bzc
                  display_name: Priya Raman
                scope:
                  type: class
                  id: sjebyge5cpbop1xwo4eds74ejb
                  display_name: Year 1 Mathematics A
                created_at: '2026-08-20T10:00:00Z'
                updated_at: '2026-08-20T10:00:03Z'
                revision: 1
                delivery:
                  template_key: access.student_class_invitation
                  state: accepted
                  masked_recipient: s***@example.edu
                  created_at: '2026-08-20T10:00:00Z'
                  updated_at: '2026-08-20T10:00:03Z'
                  deadline: '2026-08-21T10:00:00Z'
                  accepted_at: '2026-08-20T10:00:03Z'
              - id: id9tzepftxa3h5uben569yr37h
                purpose: teacher_academic_unit
                state: accepted
                academic_unit_id: 889766ufjgio6kbpzjbufozksq
                role_id: nybc6xhg593upqice3sdeyro5k
                role_actions:
                  - exam.create
                  - class.view
                start_at: '2026-08-10T09:00:00Z'
                expires_at: '2026-08-17T09:00:00Z'
                email: teacher.one@example.edu
                inviter_user_id: rpn96r4g3jfk3t41u4dus44bzc
                inviter:
                  id: rpn96r4g3jfk3t41u4dus44bzc
                  display_name: Priya Raman
                role:
                  id: nybc6xhg593upqice3sdeyro5k
                  display_name: Teacher
                scope:
                  type: academic_unit
                  id: 889766ufjgio6kbpzjbufozksq
                  display_name: Computer Science
                accepted_user_id: xgqjjg7fnyeqnueo58grucaoqy
                created_at: '2026-08-10T09:00:00Z'
                updated_at: '2026-08-11T15:42:10Z'
                revision: 2
            next_cursor: eyJjcmVhdGVkX2F0IjoiMjAyNi0wOC0xMFQwOTowMDowMFoifQ
            total: 37
            total_is_lower_bound: false
  schemas:
    AcceptStudentClassInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - claim
        - password
        - username
      properties:
        claim:
          type: string
          minLength: 43
          maxLength: 43
          description: The one-time claim from the Invitation email.
        password:
          type: string
          description: The password for the new account. It must meet the password policy.
        username:
          type: string
          maxLength: 64
          description: The username for the new account.
        display_name:
          type: string
          maxLength: 128
          description: The new account's display name.
        first_name:
          type: string
          maxLength: 64
          description: The account holder's first name.
        last_name:
          type: string
          maxLength: 64
          description: The account holder's last name.
        locale:
          type: string
          maxLength: 35
          description: The account's language, as a language tag such as `en`.
        timezone:
          type: string
          maxLength: 64
          description: >-
            The account's time zone, such as `Europe/Paris`. Omit it to use the time zone the inviter suggested.
    AcceptTeacherAcademicUnitInvitationRequest:
      $ref: '#/components/schemas/AcceptStudentClassInvitationRequest'
      description: The same fields as accepting a student Class Invitation.
    AcceptScopedRoleInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - claim
      properties:
        claim:
          type: string
          minLength: 43
          maxLength: 43
          description: The one-time claim from the Invitation email.
    InvitationAdministrationListResponse:
      type: object
      additionalProperties: false
      description: One page of Invitations. Only the first page carries `total`.
      required:
        - items
      properties:
        items:
          type: array
          description: The Invitations on this page.
          items:
            $ref: '#/components/schemas/InvitationAdministrationResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many Invitations match the filters and your visibility across all pages. Present only on the first
            page. Counting stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when counting stopped at 10,000 and there may be more. Present with `total`.
