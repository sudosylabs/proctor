paths:
  /api/v1/onboarding-imports/{onboarding_import_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OnboardingImportID'
    post:
      operationId: cancelOnboardingImport
      summary: Cooperatively cancel an onboarding parse or execution
      description: >-
        Asks to cancel the import's validation or commit Job while it can still be canceled. The work stops at its
        next safe point. Rows that already committed are not undone, and the uploaded file, preview and Job history
        are kept.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/onboarding-imports/grofpg49hmqe47x811ttzoochx/cancel' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.conflict
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - invitation.unavailable
        - student_progression.conflict
        - student_progression.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/OnboardingImportOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
