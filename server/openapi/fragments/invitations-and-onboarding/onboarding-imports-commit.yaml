paths:
  /api/v1/onboarding-imports/{onboarding_import_id}/commit:
    parameters:
      - $ref: '#/components/parameters/OnboardingImportID'
    post:
      operationId: commitOnboardingImport
      summary: Commit one exact validated onboarding preview
      description: >-
        Starts applying the preview you reviewed, but only if its revision and digest still match and the commit
        policy you chose allows it. Each row is applied on its own and gets its own outcome. A file that was not
        validated, or that changed since, is never applied. The work runs in the background; poll the import to
        follow it.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.conflict
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - administration.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - authentication.mfa.unavailable
        - invitation.unavailable
        - student_progression.conflict
        - student_progression.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CommitOnboardingImport'
      responses:
        "202":
          $ref: '#/components/responses/OnboardingImportAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CommitOnboardingImport:
      description: The revision and digest of the preview you reviewed, and the commit policy.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingImportCommitRequest'
          example:
            expected_revision: 2
            preview_digest: 43bb00d0ce7790a53b91256b370c887b24791a5539a6fbfb70c5870e8c91ae5d
            policy: require_all_valid
  schemas:
    OnboardingImportCommitRequest:
      type: object
      additionalProperties: false
      description: The revision and SHA-256 digest of the preview you reviewed, and how to treat invalid rows.
      required:
        - expected_revision
        - preview_digest
        - policy
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The import's `revision` when you reviewed it.
        preview_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: The import's `preview_digest`, a SHA-256 digest in lowercase hexadecimal.
        policy:
          type: string
          enum:
            - require_all_valid
            - valid_rows_only
          description: >-
            `require_all_valid` refuses the commit if any row is invalid. `valid_rows_only` commits the valid rows and
            skips the invalid ones.
