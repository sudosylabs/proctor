paths:
  /api/v1/onboarding-imports:
    get:
      operationId: listOnboardingImports
      summary: List onboarding imports within the caller's authorized scope
      description: >-
        Lists the onboarding imports that have not expired and that you could read one by one through your current
        Institution, Academic Unit or Class onboarding authority. They are newest first unless `order=asc` asks for
        oldest first. Items are summaries without rows; read one import to see its preview or report rows. Student
        progressions have their own listing and never appear here.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.unavailable
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: Return only imports in these lifecycle states. Repeat the parameter to select several; omit it for all.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items:
              type: string
              enum:
                - uploading
                - parsing
                - preview_ready
                - executing
                - completed
                - completed_with_errors
                - canceled
                - failed
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page, passed back unchanged.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: The most onboarding imports to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: order
          in: query
          required: false
          description: >-
            Read newest first by creation (`desc`, the default) or oldest first (`asc`). A cursor continues only
            the order that produced it.
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
      x-codeSamples:
        - lang: Shell
          label: List imports awaiting review
          source: |-
            curl --header "Authorization: Bearer $PROCTOR_TOKEN" \
              "https://proctor.example.edu/api/v1/onboarding-imports?state=preview_ready&limit=20"
      responses:
        "200":
          $ref: '#/components/responses/OnboardingImportListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: uploadOnboardingImport
      summary: Upload a bounded onboarding CSV for asynchronous validation
      description: >-
        Stores one CSV file, at most 10 MiB, and starts a background Job that validates it for the mode and scope you
        give. The file's contents are treated as data, never as spreadsheet formulas. Uploading creates no account,
        membership or Role. Review the resulting preview, then commit it separately.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.conflict
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - administration.unavailable
        - authentication.mfa.unavailable
        - invitation.role_not_delegable
        - invitation.unavailable
        - student_progression.conflict
        - student_progression.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: mode
          in: query
          required: true
          description: The onboarding workflow, which decides the CSV columns and the validation rules.
          schema:
            type: string
            enum:
              - student_class
              - teacher_academic_unit
              - institution
              - academic_administration
        - name: scope_type
          in: query
          required: true
          description: The kind of resource that owns every row of the import.
          schema:
            type: string
            enum:
              - class
              - academic_unit
              - institution
        - name: scope_id
          in: query
          required: true
          description: The Class, Academic Unit or Institution that owns the import.
          schema:
            $ref: '#/components/schemas/ID'
        - name: role_id
          in: query
          required: false
          description: The Role that teacher or Institution Invitation rows grant. Refused for modes that use no Role.
          schema:
            $ref: '#/components/schemas/ID'
        - name: file_name
          in: query
          required: false
          description: >-
            Name of the uploaded file, remembered so the import can be recognised later and returned as `file_name`. Surrounding whitespace is trimmed; the result must be a base name of 1 to 255 characters without `/`, `\`, or control characters, and not `.` or `..`. Omit it to remember no name.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        description: >-
          The UTF-8 CSV file to validate, at most 10 MiB. Uploading only creates a preview; it changes no accounts or
          memberships.
        content:
          text/csv:
            schema:
              type: string
              format: binary
              maxLength: 10485760
      x-codeSamples:
        - lang: Shell
          label: Upload a student Class roster
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Content-Type: text/csv" \
              --data-binary '@./onboarding.csv' \
              "https://proctor.example.edu/api/v1/onboarding-imports?mode=student_class&scope_type=class&scope_id=ybndrfg8ejkmcpqxot1uwisza3"
      responses:
        "202":
          $ref: '#/components/responses/OnboardingImportAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/onboarding-imports/{onboarding_import_id}:
    parameters:
      - $ref: '#/components/parameters/OnboardingImportID'
    get:
      operationId: getOnboardingImport
      summary: Get one authorized immutable onboarding preview or final report projection
      description: >-
        Returns the state, preview digest and row outcomes of one onboarding import you may read. It never includes
        claims, passwords, email contents, internal Job data or raw parsing diagnostics.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.unavailable
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/OnboardingImportOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
