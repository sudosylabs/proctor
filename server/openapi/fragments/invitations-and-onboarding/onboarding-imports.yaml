paths:
  /api/v1/onboarding-imports:
    get:
      operationId: listOnboardingImports
      summary: List onboarding imports within the caller's authorized scope
      description: >-
        Lists the unexpired administrative onboarding imports the caller could read one by one through its current Institution, Academic Unit, or Class onboarding authority, newest first. Items are summary projections without rows; read one import for its preview or report rows. Student progressions are listed through their own resource and never appear here.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.unavailable
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: Return only imports in these lifecycle states. Repeat the parameter to select several; omit it for all.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items:
              type: string
              enum:
                - uploading
                - parsing
                - preview_ready
                - executing
                - completed
                - completed_with_errors
                - canceled
                - failed
        - name: cursor
          in: query
          required: false
          description: Continue from the opaque cursor returned by the preceding page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Maximum number of onboarding imports to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      x-codeSamples:
        - lang: Shell
          label: List imports awaiting review
          source: |-
            curl --header "Authorization: Bearer $PROCTOR_TOKEN" \
              "https://proctor.example.edu/api/v1/onboarding-imports?state=preview_ready&limit=20"
      responses:
        "200":
          $ref: '#/components/responses/OnboardingImportListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: uploadOnboardingImport
      summary: Upload a bounded onboarding CSV for asynchronous validation
      description: >-
        Stores one bounded formula-safe CSV source and creates a durable validation Job for the explicit mode and authorization scope. Upload performs no account, membership, or Role mutation; the resulting immutable preview must be reviewed and committed separately.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.conflict
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - administration.unavailable
        - authentication.mfa.unavailable
        - invitation.role_not_delegable
        - invitation.unavailable
        - student_progression.conflict
        - student_progression.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: mode
          in: query
          required: true
          description: Selects the onboarding workflow and therefore the CSV columns and validation rules to apply.
          schema:
            type: string
            enum:
              - student_class
              - teacher_academic_unit
              - institution
              - academic_administration
        - name: scope_type
          in: query
          required: true
          description: Declares the kind of resource that owns every row in this import.
          schema:
            type: string
            enum:
              - class
              - academic_unit
              - institution
        - name: scope_id
          in: query
          required: true
          description: Identifies the exact Class, Academic Unit, or Institution that owns the import.
          schema:
            $ref: '#/components/schemas/ID'
        - name: role_id
          in: query
          required: false
          description: Role to package into applicable teacher or institution Invitation rows; rejected for modes that do not use Roles.
          schema:
            $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Contains the bounded UTF-8 CSV source to validate; the upload creates only a preview and performs no account or membership mutations.
        content:
          text/csv:
            schema:
              type: string
              format: binary
              maxLength: 10485760
      x-codeSamples:
        - lang: Shell
          label: Upload a student Class roster
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Content-Type: text/csv" \
              --data-binary '@./onboarding.csv' \
              "https://proctor.example.edu/api/v1/onboarding-imports?mode=student_class&scope_type=class&scope_id=ybndrfg8ejkmcpqxot1uwisza3"
      responses:
        "202":
          $ref: '#/components/responses/OnboardingImportAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/onboarding-imports/{onboarding_import_id}:
    parameters:
      - $ref: '#/components/parameters/OnboardingImportID'
    get:
      operationId: getOnboardingImport
      summary: Get one authorized immutable onboarding preview or final report projection
      description: >-
        Returns the bounded authorized state, preview digest, and row outcomes for one onboarding import. The projection omits original claims, passwords, mail payloads, internal Job data, and unsafe parsing diagnostics.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.unavailable
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/OnboardingImportOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    OnboardingImportListOK:
      description: Bounded authorized onboarding import page
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingImportListResponse'
          example:
            items: []
  schemas:
    OnboardingImportListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OnboardingImportResponse'
        next_cursor:
          type: string
