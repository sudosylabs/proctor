components:
  parameters:
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of the Invitation.
    OnboardingImportID:
      name: onboarding_import_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of the onboarding import.
  requestBodies:
    MutateInvitation:
      description: The Invitation's current revision. The request is refused if the Invitation has changed since.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationMutationRequest'
          example:
            expected_revision: 3
  responses:
    InvitationAdministrationOK:
      description: The Invitation as administrators see it. It never includes the claim.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationAdministrationResponse'
          example:
            id: ccrzmhoygspnzijnponpyw4zmu
            purpose: student_class
            state: pending
            class_id: sjebyge5cpbop1xwo4eds74ejb
            academic_period_id: p6y6sf8ac6m5if373fkkebj7j6
            start_at: '2026-09-01T00:00:00Z'
            expires_at: '2026-08-27T10:00:00Z'
            email: student.one@example.edu
            inviter_user_id: rpn96r4g3jfk3t41u4dus44bzc
            inviter:
              id: rpn96r4g3jfk3t41u4dus44bzc
              display_name: Priya Raman
            scope:
              type: class
              id: sjebyge5cpbop1xwo4eds74ejb
              name: Year 1 Mathematics A
            created_at: '2026-08-20T10:00:00Z'
            updated_at: '2026-08-20T10:00:03Z'
            revision: 1
            delivery:
              template_key: access.student_class_invitation
              state: accepted
              masked_recipient: s***@example.edu
              created_at: '2026-08-20T10:00:00Z'
              updated_at: '2026-08-20T10:00:03Z'
              deadline: '2026-08-21T10:00:00Z'
              accepted_at: '2026-08-20T10:00:03Z'
