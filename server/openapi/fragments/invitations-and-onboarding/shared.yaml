  schemas:
    IssueScopedRoleInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role_id
      properties:
        email:
          type: string
          format: email
          description: The email address of the existing User to invite.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role the Invitation grants. You must be allowed to delegate it at this scope.
        start_at:
          type: string
          format: date-time
          description: When the Role Binding starts once accepted. Omit it to start when the Invitation is issued.
        end_at:
          type: string
          format: date-time
          description: When the Role Binding ends; it must be after the start. Omit it for no end.
        expires_in_days:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 30
          description: >-
            How many whole days the Invitation can be accepted for, from 1 to 30. Omit it or send null for 7 days. A
            value outside the range is refused with invitation.invalid.
    InvitationMutationRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Invitation's `revision` as you last read it.
    InvitationDeliveryResponse:
      type: object
      additionalProperties: false
      description: The latest email delivery of an Invitation. The recipient address is shown only masked.
      required:
        - template_key
        - state
        - masked_recipient
        - created_at
        - updated_at
        - deadline
      properties:
        template_key:
          type: string
          description: The email template used, such as `access.student_class_invitation`.
        state:
          type: string
          enum:
            - queued
            - sending
            - accepted
            - failed
            - suppressed
            - canceled
          description: >-
            Where the delivery stands: `queued` or `sending` while it is being sent, `accepted` once the mail server
            took the message, `failed` when it gave up, `suppressed` when the message was deliberately not sent, or
            `canceled`.
        masked_recipient:
          type: string
          description: The recipient address with most of its local part hidden, such as `s***@example.edu`.
        created_at:
          type: string
          format: date-time
          description: When the delivery was queued.
        updated_at:
          type: string
          format: date-time
          description: When the delivery last changed.
        deadline:
          type: string
          format: date-time
          description: The time after which the delivery is no longer attempted.
        accepted_at:
          type: string
          format: date-time
          description: When the mail server accepted the message. Present only once accepted.
        public_failure_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/MailFailureCode'
            - type: string
          description: >-
            Why the latest attempt failed. Present after a failed attempt, including while the delivery is retried.
    InvitationAdministrationResponse:
      type: object
      additionalProperties: false
      description: >-
        An Invitation as administrators see it, with its recipient, lifecycle and latest delivery. It never includes
        the claim, the rendered email or mail provider details.
      required:
        - id
        - purpose
        - state
        - start_at
        - expires_at
        - email
        - inviter_user_id
        - scope
        - created_at
        - updated_at
        - revision
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of the Invitation.
        purpose:
          type: string
          enum:
            - student_class
            - teacher_academic_unit
            - academic_unit_role
            - institution_role
          description: >-
            What accepting the Invitation does. `student_class` creates a student account and Class enrollment, and
            `teacher_academic_unit` creates a teacher account with an Academic Unit membership and Role.
            `academic_unit_role` and `institution_role` give an existing User a Role at that scope.
        state:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
            - superseded
          description: >-
            `pending` until the Invitation is accepted, revoked, expires, or is replaced by a new one
            (`superseded`).
        class_id:
          $ref: '#/components/schemas/ID'
          description: The Class a student Class Invitation enrolls the student in. Present only for `student_class`.
        academic_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period of that Class. Present only for `student_class`.
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Academic Unit a teacher or Academic Unit Role Invitation applies to. Present only for those purposes.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role the Invitation grants. Present for every purpose except `student_class`.
        role_actions:
          type: array
          description: The actions the Role allowed when the Invitation was issued, as recorded in the Invitation.
          items:
            type: string
        start_at:
          type: string
          format: date-time
          description: >-
            When the relationship the Invitation grants starts. When the issuer gave no start, a student Class
            Invitation starts with its Academic Period and every other Invitation starts when it was issued.
        end_at:
          type: string
          format: date-time
          description: When the relationship the Invitation grants ends. Omitted when it has no end.
        expires_at:
          type: string
          format: date-time
          description: When the Invitation can no longer be accepted.
        email:
          type: string
          format: email
          description: The address the Invitation was sent to.
        inviter_user_id:
          $ref: '#/components/schemas/ID'
          description: The User who issued the Invitation.
        inviter:
          $ref: '#/components/schemas/PersonRef'
          description: The User who issued the Invitation, named. For an imported Invitation, this is the importer.
        role:
          type: object
          additionalProperties: false
          description: The Role the Invitation grants, named. Omitted for an Invitation that grants no Role.
          required:
            - id
          properties:
            id:
              $ref: '#/components/schemas/ID'
            display_name:
              type: string
              maxLength: 512
              description: The Role's display name. Omitted for an archived Role.
        scope:
          type: object
          additionalProperties: false
          description: Where the Invitation admits the person, named.
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - institution
                - academic_unit
                - class
              description: Kind of scope.
            id:
              $ref: '#/components/schemas/ID'
            name:
              type: string
              maxLength: 512
              description: The Institution, Academic Unit or Class display name. Omitted when it is archived.
        accepted_user_id:
          $ref: '#/components/schemas/ID'
          description: The User who accepted the Invitation. Present only once accepted.
        created_at:
          type: string
          format: date-time
          description: When the Invitation was issued.
        updated_at:
          type: string
          format: date-time
          description: When the Invitation last changed.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Invitation's revision, which goes up each time it changes. Send it as `expected_revision` to resend,
            revoke or replace the Invitation.
        delivery:
          $ref: '#/components/schemas/InvitationDeliveryResponse'
          description: The latest email delivery of the Invitation. Omitted when there is none.
    InvitationResponse:
      type: object
      additionalProperties: false
      description: A newly issued Invitation. It never includes the claim or the recipient's mailbox details.
      required:
        - id
        - purpose
        - state
        - start_at
        - expires_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of the Invitation.
        purpose:
          type: string
          enum:
            - student_class
            - teacher_academic_unit
            - academic_unit_role
            - institution_role
          description: >-
            What accepting the Invitation does. `student_class` creates a student account and Class enrollment, and
            `teacher_academic_unit` creates a teacher account with an Academic Unit membership and Role.
            `academic_unit_role` and `institution_role` give an existing User a Role at that scope.
        state:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
            - superseded
          description: >-
            `pending` until the Invitation is accepted, revoked, expires, or is replaced by a new one
            (`superseded`).
        class_id:
          $ref: '#/components/schemas/ID'
          description: The Class a student Class Invitation enrolls the student in. Present only for `student_class`.
        academic_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period of that Class. Present only for `student_class`.
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Academic Unit a teacher or Academic Unit Role Invitation applies to. Present only for those purposes.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role the Invitation grants. Present for every purpose except `student_class`.
        role_actions:
          type: array
          description: The actions the Role allowed when the Invitation was issued, as recorded in the Invitation.
          items:
            type: string
        start_at:
          type: string
          format: date-time
          description: >-
            When the relationship the Invitation grants starts. When the issuer gave no start, a student Class
            Invitation starts with its Academic Period and every other Invitation starts when it was issued.
        end_at:
          type: string
          format: date-time
          description: When the relationship the Invitation grants ends. Omitted when it has no end.
        expires_at:
          type: string
          format: date-time
          description: When the Invitation can no longer be accepted.
    InvitationAcceptanceResponse:
      type: object
      additionalProperties: false
      description: The account and the relationships that accepting the Invitation created.
      required:
        - user_id
        - invitation_id
        - replayed
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
          description: The User who accepted. For a student or teacher Invitation, this is the new account.
        invitation_id:
          $ref: '#/components/schemas/ID'
          description: The accepted Invitation.
        affiliation_id:
          $ref: '#/components/schemas/ID'
          description: The Affiliation acceptance created. Present for student Class and teacher Academic Unit Invitations.
        class_member_id:
          $ref: '#/components/schemas/ID'
          description: The Class enrollment acceptance created. Present for student Class Invitations.
        academic_unit_member_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit membership acceptance created. Present for teacher Academic Unit Invitations.
        role_binding_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Role Binding acceptance created. Present for teacher Academic Unit, Academic Unit Role and Institution
            Role Invitations.
        replayed:
          type: boolean
          description: True when this request repeated an acceptance that had already succeeded, and the stored outcome was returned.
