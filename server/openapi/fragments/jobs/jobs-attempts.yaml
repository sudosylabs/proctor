paths:
  /api/v1/jobs/{job_id}/attempts:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ID of the Job whose Attempts to list.
    get:
      operationId: listJobAttempts
      summary: List ordered execution Attempts for one Job
      tags:
        - Jobs
      description: >-
        Returns the execution history of one Job the caller may see, highest attempt number first. Each Attempt shows its status, timing and public failure reason. Worker identities, private payloads, stack traces and infrastructure diagnostics are never included.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - job.query.invalid
        - request.invalid
        - resource.not_found
        - job.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of execution Attempts to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            The `next_cursor` value from the previous page for this Job. Treat it as an unreadable token: don't parse it or build one.
      responses:
        "200":
          $ref: '#/components/responses/JobAttemptListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    JobAttemptListOK:
      description: One page of the Job's Attempts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobAttemptListResponse'
          example:
            items:
              - id: 1asb7sk89dp1ex339fkh3te5t4
                number: 2
                status: succeeded
                started_at: '2026-08-01T02:20:03Z'
                heartbeat_at: '2026-08-01T02:21:30Z'
                lease_expires_at: '2026-08-01T02:22:30Z'
                completed_at: '2026-08-01T02:21:41Z'
              - id: saqjfmjqqy9mo1yj4zwed73333
                number: 1
                status: failed
                started_at: '2026-08-01T02:15:02Z'
                heartbeat_at: '2026-08-01T02:15:32Z'
                lease_expires_at: '2026-08-01T02:16:32Z'
                completed_at: '2026-08-01T02:15:40Z'
                public_error_code: database.unavailable
  schemas:
    JobAttemptStatus:
      description: >-
        State of one execution Attempt. `lease_expired` means the worker stopped reporting before it finished. `incompatible` means the worker that picked up the Job could not run it and handed it back to the queue.
      type: string
      enum:
        - running
        - succeeded
        - failed
        - canceled
        - lease_expired
        - incompatible
    JobAttemptResponse:
      description: One execution Attempt of a Job.
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - status
        - started_at
        - heartbeat_at
        - lease_expires_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: ID of the Attempt.
        number:
          type: integer
          minimum: 1
          description: Position of this Attempt within its Job. The first Attempt is 1 and each new one goes up by one.
        status:
          $ref: '#/components/schemas/JobAttemptStatus'
          description: Where the Attempt is in its lifecycle.
        started_at:
          type: string
          format: date-time
          description: Time the Attempt started running.
        heartbeat_at:
          type: string
          format: date-time
          description: Time the worker last reported that it was still running the Attempt.
        lease_expires_at:
          type: string
          format: date-time
          description: >-
            Time the worker's hold on the Job runs out. If the worker hasn't reported again by then, the Attempt is treated as abandoned.
        completed_at:
          type: string
          format: date-time
          description: Time the Attempt finished. Omitted while it is still running.
        public_error_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/JobErrorCode'
            - type: string
          description: Public reason the Attempt failed. Internal error detail is never returned. Omitted when there is no failure to report.
    JobAttemptListResponse:
      description: One page of a Job's execution Attempts.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobAttemptResponse'
          description: Attempts on this page, highest attempt number first.
        next_cursor:
          type: string
          description: Token to pass as `cursor` to read the next page. Treat it as unreadable. Omitted on the last page.
