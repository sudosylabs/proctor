paths:
  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: List allowlisted durable Jobs
      tags:
        - Jobs
      description: >-
        Lists the Jobs the caller may see, limited to the Job types the public API exposes. Results are newest first by creation time, or oldest first with `order=asc`. Private payloads, worker details and infrastructure errors are never included.
        The first page, read without a cursor, also reports `total`: the number of Jobs that match the filters and that the caller may see, across all pages. The count is exact below 10,000. At 10,000 it stops and `total_is_lower_bound` is true. Later pages carry no total, so keep the one from the first page.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - job.query.invalid
        - job.unavailable
        - request.invalid
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of Jobs to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            The `next_cursor` value from the previous page. Send the same filters and order with it. Treat it as an unreadable token: don't parse it or build one.
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobStatus'
          description: Return only Jobs in these states. Repeat the parameter to include several. Omit it to include every state.
        - name: type
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobType'
          description: >-
            Return only Jobs of these types. Repeat the parameter to include several. Omit it to include every type.
            A type the operator view doesn't show matches nothing.
        - name: order
          in: query
          required: false
          description: >-
            Read newest first by creation (`desc`, the default) or oldest first (`asc`). A cursor continues only
            the order that produced it.
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
      responses:
        "200":
          $ref: '#/components/responses/JobListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ID of the Job to return.
    get:
      operationId: getJob
      summary: Get one allowlisted durable Job
      tags:
        - Jobs
      description: >-
        Returns the current state of one Job. If the caller may not see the Job, or its type isn't exposed through the public API, the request fails with the documented not-found or authorization error, so the Job stays hidden.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - resource.not_found
        - job.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/JobOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
