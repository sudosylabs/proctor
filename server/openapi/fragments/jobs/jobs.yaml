paths:
  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: List allowlisted durable Jobs
      tags:
        - Jobs
      description: >-
        Lists only Job types deliberately exposed through the public administration contract and authorized for the current principal. Private payloads, claims, worker identities, and infrastructure errors are omitted from every projection.
        The first page, read without a cursor, also reports `total`: the Jobs the filters and the caller's visibility match across every page, exact below 10,000 and reported as 10,000 with `total_is_lower_bound` at that bound. Later pages carry no total; keep the first page's.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - job.query.invalid
        - job.unavailable
        - request.invalid
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of Jobs to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque continuation emitted by the preceding page for the same filters.
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobStatus'
          description: Optional set of durable lifecycle states to include.
      responses:
        "200":
          $ref: '#/components/responses/JobListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: The allowlisted durable Job to retrieve.
    get:
      operationId: getJob
      summary: Get one allowlisted durable Job
      tags:
        - Jobs
      description: >-
        Returns the safe current projection of one authorized, allowlisted durable Job. A Job outside the caller's permitted scope or public type allowlist is concealed through the documented not-found or authorization behavior.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - resource.not_found
        - job.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/JobOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    JobListOK:
      description: Safe durable Job collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobListResponse'
          example:
            items: []
            total: 0
            total_is_lower_bound: false
  schemas:
    JobListResponse:
      description: One bounded page of safe durable Job projections.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobResponse'
        next_cursor:
          type: string
          description: Opaque continuation for the next page, omitted after the final page.
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Jobs matching the filters and the caller's visibility across every page, present only on the
            first page. At 10,000 counting stops and `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached the 10,000 bound and there may be more. Present with `total`.
