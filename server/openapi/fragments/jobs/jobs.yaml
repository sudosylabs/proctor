            Number of Jobs, across all pages, that match the filters and that the caller may see. Present only on
            the first page. Counting stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached the 10,000 limit and there may be more Jobs. Present whenever `total` is.
