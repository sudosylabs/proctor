components:
  responses:
    JobOK:
      description: Safe durable Job projection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobResponse'
  schemas:
    JobType:
      type: string
      description: >-
        Stable type of a background Job. The catalogue is closed and may grow; clients own the labels and should present an unknown value generically.
      enum:
        - audit.attempt_sweep
        - command_outcome.cleanup
        - exam_export.build
        - exam_export.cleanup
        - exam_sitting.lifecycle
        - exam_sitting.lifecycle_recovery
        - exam_sitting.sealing
        - file.purge_expired_content
        - invitation.maintenance
        - job.cleanup
        - mail.cleanup
        - mail.deliver
        - mail.deliver_credential
        - mail.expand_sitting
        - mail.rekey
        - mfa.rekey
        - onboarding_import.execute
        - onboarding_import.parse
        - profile_picture.generate_default
        - profile_picture.reconcile_defaults
        - retention.expire
        - retention.notices
        - retention.purge
        - retention.reconcile
        - session.purge_retired
        - student_progression.preview
    JobStage:
      type: string
      description: >-
        Stable name of a Job processing stage. The catalogue is closed and may grow; clients own the labels and should present an unknown value generically.
      enum:
        - completed
        - executing
        - expanding
        - purging
        - reconciling
        - reencrypting
        - resealing
        - sealing
    JobErrorCode:
      type: string
      description: >-
        Stable safe failure category of a Job or Job Attempt. The catalogue is closed and may grow; clients own the labels and should present an unknown value generically.
      enum:
        - database.unavailable
        - dependency.unavailable
        - exam.export.expired
        - exam.export.unavailable
        - file.backend_unavailable
        - job.canceled
        - job.checkpoint.invalid
        - job.command.invalid
        - job.invariant_failed
        - mail.delivery.conflict
        - mail.delivery.failed
        - mail.delivery.not_found
        - mail.delivery.unavailable
        - mail.message.invalid
        - mail.payload.unavailable
        - mail.rekey.fenced
        - mail.rekey.incomplete
        - mail.rekey.invariant_failed
        - mail.rekey.payload_unavailable
        - mail.rekey.primary_mismatch
        - mail.sitting.bundle_unavailable
        - mail.sitting.invalid
        - mail.sitting.recipient_unavailable
        - mail.sitting.unavailable
        - mail.transport.acceptance_uncertain
        - mail.transport.permanent
        - mail.transport.temporary
        - mail.transport.unknown
        - mfa.rekey.fenced
        - mfa.rekey.incomplete
        - mfa.rekey.invariant_failed
        - mfa.rekey.primary_mismatch
        - mfa.rekey.secret_unavailable
        - onboarding_import.authorization_lost
        - onboarding_import.file_invalid
        - retention.unavailable
        - student_progression.authorization_lost
        - student_progression.effective_date_conflict
        - student_progression.lineage_conflict
        - student_progression.roster_too_large
        - student_progression.target_conflict
        - user.not_found
    JobProgressResponse:
      description: Bounded coarse progress reported by a Job implementation.
      type: object
      additionalProperties: false
      required:
        - current
        - total
        - stage
      properties:
        current:
          type: integer
          format: int64
          minimum: 0
          description: Completed work units in the current stage.
        total:
          type: integer
          format: int64
          minimum: 1
          description: Total work units expected in the current stage.
        stage:
          $ref: '#/components/schemas/JobStage'
          description: Stable safe name of the current processing stage.
    JobResponse:
      description: Safe durable state of an allowlisted background Job.
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - status
        - created_at
        - updated_at
        - available_at
        - attempt_count
        - maximum_attempts
        - revision
      properties:
        id:
          $ref: '#/components/schemas/ID'
        type:
          $ref: '#/components/schemas/JobType'
          description: Stable allowlisted Job type.
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
          description: Time when the Job was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest durable Job change.
        available_at:
          type: string
          format: date-time
          description: Time at or after which queued work may be claimed.
        started_at:
          type: string
          format: date-time
          description: Time when the current or latest Attempt started.
        completed_at:
          type: string
          format: date-time
          description: Time when the Job reached a terminal state.
        public_error_code:
          $ref: '#/components/schemas/JobErrorCode'
          description: Stable safe failure category; private worker and infrastructure errors are never exposed.
        attempt_count:
          type: integer
          minimum: 0
          description: Number of durable execution Attempts created so far.
        maximum_attempts:
          type: integer
          minimum: 1
          description: Maximum execution Attempts allowed by this Job's retry policy.
        progress:
          $ref: '#/components/schemas/JobProgressResponse'
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Monotonic durable Job revision for concurrency-aware consumers.
        created_by_user_id:
          $ref: '#/components/schemas/ID'
          description: >-
            User whose request started the Job. Omitted for recurring and system work, and after that User is deleted.
        created_by_display_name:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Display name of the User who started the Job, or their username when they have none. Omitted with created_by_user_id, and while that User is archived.
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            What the Job is about, for the Job types that say: an Examination Export build names the title of the Exam revision its Sitting runs. Omitted for every other type.
