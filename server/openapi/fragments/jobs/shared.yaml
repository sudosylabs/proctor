components:
  responses:
    JobOK:
      description: The Job's current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobResponse'
          example:
            id: wj3drgzdpnf54rxf5d8qd3dqne
            type: exam_export.build
            status: running
            created_at: '2026-08-01T09:00:00Z'
            updated_at: '2026-08-01T09:02:30Z'
            available_at: '2026-08-01T09:00:00Z'
            started_at: '2026-08-01T09:00:05Z'
            attempt_count: 1
            maximum_attempts: 5
            progress:
              current: 120
              total: 300
              stage: executing
            revision: 4
            created_by_user_id: 14j8umgczgrdp95w77zuxmxfu9
            created_by_display_name: Ada Okafor
            subject: Introduction to Databases final
  schemas:
    JobType:
      type: string
      description: >-
        Type of a background Job. The server only uses the values listed here, but later releases may add more. Clients choose their own labels and should show an unknown value in a generic way.
      enum:
        - academic_administration_preview.resolve
        - audit.attempt_sweep
        - audit_export.build
        - audit_export.cleanup
        - command_outcome.cleanup
        - domain_event.dispatch
        - exam_export.build
        - exam_export.cleanup
        - exam_sitting.lifecycle
        - exam_sitting.lifecycle_recovery
        - exam_sitting.sealing
        - file.purge_expired_content
        - invitation.maintenance
        - job.cleanup
        - mail.cleanup
        - mail.deliver
        - mail.deliver_credential
        - mail.expand_sitting
        - mail.rekey
        - mfa.rekey
        - onboarding_import.execute
        - onboarding_import.parse
        - profile_picture.generate_default
        - profile_picture.reconcile_defaults
        - retention.expire
        - retention.notices
        - retention.purge
        - retention.reconcile
        - session.purge_retired
        - student_progression.preview
    JobStage:
      type: string
      description: >-
        Name of a stage a Job works through. The server only uses the values listed here, but later releases may add more. Clients choose their own labels and should show an unknown value in a generic way.
      enum:
        - completed
        - executing
        - expanding
        - purging
        - reconciling
        - reencrypting
        - resealing
        - sealing
    JobErrorCode:
      type: string
      description: >-
        Public reason a Job or Job Attempt failed. It never carries internal error detail. The server only uses the values listed here, but later releases may add more. Clients choose their own labels and should show an unknown value in a generic way.
      enum:
        - academic_administration_preview.authorization_lost
        - academic_administration_preview.target_conflict
        - academic_administration_preview.too_many_users
        - audit.export.expired
        - audit.export.unavailable
        - database.unavailable
        - dependency.unavailable
        - exam.export.expired
        - exam.export.unavailable
        - file.backend_unavailable
        - job.canceled
        - job.checkpoint.invalid
        - job.command.invalid
        - job.invariant_failed
        - mail.delivery.conflict
        - mail.delivery.failed
        - mail.delivery.not_found
        - mail.delivery.unavailable
        - mail.message.invalid
        - mail.payload.unavailable
        - mail.rekey.fenced
        - mail.rekey.incomplete
        - mail.rekey.invariant_failed
        - mail.rekey.payload_unavailable
        - mail.rekey.primary_mismatch
        - mail.sitting.bundle_unavailable
        - mail.sitting.invalid
        - mail.sitting.recipient_unavailable
        - mail.sitting.unavailable
        - mail.transport.acceptance_uncertain
        - mail.transport.permanent
        - mail.transport.temporary
        - mail.transport.unknown
        - mfa.rekey.fenced
        - mfa.rekey.incomplete
        - mfa.rekey.invariant_failed
        - mfa.rekey.primary_mismatch
        - mfa.rekey.secret_unavailable
        - onboarding_import.authorization_lost
        - onboarding_import.file_invalid
        - retention.unavailable
        - student_progression.authorization_lost
        - student_progression.effective_date_conflict
        - student_progression.lineage_conflict
        - student_progression.roster_too_large
        - student_progression.target_conflict
        - user.not_found
    JobProgressResponse:
      description: Approximate progress a running Job reports for its current stage.
      type: object
      additionalProperties: false
      required:
        - current
        - total
        - stage
      properties:
        current:
          type: integer
          format: int64
          minimum: 0
          description: Number of work units finished in the current stage.
        total:
          type: integer
          format: int64
          minimum: 1
          description: Number of work units the current stage expects to process.
        stage:
          type: string
          anyOf:
            - $ref: '#/components/schemas/JobStage'
            - type: string
          description: Name of the stage the Job is in.
    JobResponse:
      description: >-
        State of a background Job whose type the public API exposes. Private payloads, worker details and internal errors are never included.
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - status
        - created_at
        - updated_at
        - available_at
        - attempt_count
        - maximum_attempts
        - revision
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: ID of the Job.
        type:
          type: string
          anyOf:
            - $ref: '#/components/schemas/JobType'
            - type: string
          description: What kind of work the Job does.
        status:
          $ref: '#/components/schemas/JobStatus'
          description: >-
            Where the Job is in its lifecycle. `cancel_requested` means cancellation was asked for but the running work has not stopped yet.
        created_at:
          type: string
          format: date-time
          description: Time when the Job was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the most recent change to the Job.
        available_at:
          type: string
          format: date-time
          description: Earliest time a worker may pick up the Job while it is queued.
        started_at:
          type: string
          format: date-time
          description: Time the current or most recent Attempt started. Omitted until the first Attempt starts.
        completed_at:
          type: string
          format: date-time
          description: Time the Job finished, whether it succeeded, failed or was canceled. Omitted while it has not finished.
        public_error_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/JobErrorCode'
            - type: string
          description: >-
            Public reason for the Job's most recent failure. Worker and infrastructure errors are never returned. Omitted when no failure is recorded.
        attempt_count:
          type: integer
          minimum: 0
          description: Number of execution Attempts made so far.
        maximum_attempts:
          type: integer
          minimum: 1
          description: Most execution Attempts this Job's retry policy allows.
        progress:
          $ref: '#/components/schemas/JobProgressResponse'
          description: Latest progress the Job reported. Omitted when it has reported none.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Version number of the Job's state. It goes up with every change, so a client can tell a newer state from an older one.
        created_by_user_id:
          $ref: '#/components/schemas/ID'
          description: >-
            User whose request started the Job. Omitted for recurring and system work, and after that User is deleted.
        created_by_display_name:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Display name of the User who started the Job, or their username when they have none. Omitted with created_by_user_id, and while that User is archived.
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            What the Job is about, for the Job types that say: an Examination Export build names the title of the Exam revision its Sitting runs. Omitted for every other type.
