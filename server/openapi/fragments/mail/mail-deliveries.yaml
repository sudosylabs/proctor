paths:
  /api/v1/mail/deliveries:
    get:
      operationId: listMailDeliveries
      summary: List safe mail delivery metadata
      tags:
        - Mail
      description: >-
        Lists the mail deliveries the caller may see that match the filters. Results are most recently updated first, unless `sort` and `dir` choose another order. Recipient addresses stay masked. The response never includes encrypted payloads, message bodies, SMTP credentials or mail provider diagnostics. A delivery addressed to a User carries `recipient_display_name` only when the caller can see that User right now. The names are looked up once for the whole page.
        The first page, read without a cursor, also reports `total`: the number of deliveries that match the filters and that the caller may see, across all pages. The count is exact below 10,000. At 10,000 it stops and `total_is_lower_bound` is true. Later pages carry no total, so keep the one from the first page.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - mail.query.invalid
        - mail.unavailable
        - request.invalid
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of deliveries to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            The `next_cursor` value from the previous page. Send the same filters, `sort` and `dir` with it. Treat it as an unreadable token: don't parse it or build one.
        - name: state
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MailDeliveryState'
          description: Return only deliveries in these states. Repeat the parameter to include several. Omit it to include every state.
        - name: template_key
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MailTemplateKey'
          description: Return only deliveries of these templates. Repeat the parameter to include several. Omit it to include every template.
        - name: recipient_user_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: >-
            Return only deliveries addressed to this User. A delivery to an Invitation has no recipient User, so it
            never matches. Mail history can't be searched by email address.
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
          description: Return only deliveries created at or after this time (RFC 3339).
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
          description: Return only deliveries created before this time (RFC 3339).
        - name: sort
          in: query
          required: false
          description: >-
            Sort by the time of the last change (`updated`, the default) or by creation time (`created`). Ties are
            broken by delivery ID. A cursor only works with the sort and direction that produced it.
          schema:
            type: string
            enum:
              - updated
              - created
            default: updated
        - name: dir
          in: query
          required: false
          description: Newest first (`desc`, the default) or oldest first (`asc`), by the time `sort` names.
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
      responses:
        "200":
          $ref: '#/components/responses/MailDeliveryListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mail/deliveries/{mail_delivery_id}:
    parameters:
      - name: mail_delivery_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ID of the mail delivery to return.
    get:
      operationId: getMailDelivery
      summary: Get one safe mail delivery status
      tags:
        - Mail
      description: >-
        Returns the status of one mail delivery the caller may see. The recipient address stays masked. The response never includes the encrypted payload, the message content, SMTP response details or encryption keys. It names the recipient User in `recipient_display_name` only when the caller can see that User right now.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - mail.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MailDeliveryOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mail/deliveries/{mail_delivery_id}/cancel:
    parameters:
      - name: mail_delivery_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ID of the queued mail delivery to cancel.
    post:
      operationId: cancelMailDelivery
      summary: Cancel queued mail delivery work
      tags:
        - Mail
      description: >-
        Cancels one delivery while it is still queued, so no worker starts sending it. A delivery that has left the queue can't be canceled. The delivery's history and audit record are kept, and canceling doesn't delete its encrypted payload.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/mail/deliveries/<mail-delivery-id>/cancel' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - mail.conflict
        - mail.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/MailDeliveryOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mail/deliveries/{mail_delivery_id}/retry:
    parameters:
      - name: mail_delivery_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ID of the failed mail delivery to retry.
    post:
      operationId: retryMailDelivery
      summary: Retry a still-relevant failed mail delivery
      tags:
        - Mail
      description: >-
        Puts a failed delivery back in the queue, but only while its message is still worth sending and its retry limit allows another attempt. Earlier attempts and failure details are kept. A delivery past its deadline, or one whose recipient can no longer receive it, is rejected and nothing is sent.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/mail/deliveries/<mail-delivery-id>/retry' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - mail.conflict
        - mail.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/MailDeliveryOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
