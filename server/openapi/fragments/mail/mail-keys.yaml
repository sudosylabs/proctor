paths:
  /api/v1/mail/keys:
    get:
      operationId: inspectMailKeyState
      summary: Inspect safe mail payload-key identities and active reference counts
      tags:
        - Mail
      description: >-
        Returns the IDs of the mail payload encryption keys and how many stored encrypted payloads still use each one. Use it to plan a key rotation or check that one finished. The caller must have signed in recently with strong authentication. Key IDs aren't secret. The response never includes key bytes, wrapping keys, ciphertext, recipients or message content.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - mail.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MailKeyStateOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    MailKeyStateOK:
      description: Mail payload key IDs and how many stored payloads use each one.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailKeyStateResponse'
          example:
            primary_key_id: 7d3e9a10c4b2f6e8a1d5c7b9e3f20a46
            required_primary_key_id: 7d3e9a10c4b2f6e8a1d5c7b9e3f20a46
            active:
              - key_id: 7d3e9a10c4b2f6e8a1d5c7b9e3f20a46
                active_references: 1284
                created_at: '2026-09-14T08:00:00Z'
              - key_id: 2b8f4c6a0e1d3957b2c4e6f8a0b1c3d5
                active_references: 37
                created_at: '2026-03-02T10:30:00Z'
  schemas:
    MailPayloadKeyUsage:
      description: How many stored encrypted mail payloads use one configured key.
      type: object
      additionalProperties: false
      required:
        - key_id
        - active_references
        - created_at
      properties:
        key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: ID of the key, a 128-bit value in lowercase hexadecimal. It isn't secret.
        active_references:
          type: integer
          format: int64
          minimum: 1
          description: Number of stored encrypted mail payloads that are still encrypted with this key.
        created_at:
          type: string
          format: date-time
          description: >-
            When this key's current use began: the first payload it encrypted since it last encrypted none. The server
            has no rotation policy, so it suggests no rotation date.
    MailKeyStateResponse:
      description: Which keys encrypt mail payloads, and how many payloads each key still covers.
      type: object
      additionalProperties: false
      required:
        - primary_key_id
        - active
      properties:
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: ID of the key this server uses to encrypt new payloads.
        required_primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: >-
            ID of the primary key that the most recent key rotation recorded. New payloads must be encrypted with it, so a configured primary key that differs has to be resolved. Omitted before the first rotation.
        active:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/MailPayloadKeyUsage'
          description: Keys that still encrypt at least one stored payload, at most nine.
