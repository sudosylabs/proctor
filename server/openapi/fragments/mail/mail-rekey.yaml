paths:
  /api/v1/mail/rekey:
    post:
      operationId: startMailRekey
      summary: Start a durable fenced mail payload-key rotation
      tags:
        - Mail
      description: >-
        Starts a Job that re-encrypts stored mail payloads from the key you're retiring to the configured primary key. The caller must have signed in recently with strong authentication. Only one rotation can run at a time, and a key counts as safe to retire only when the finished Job shows that no payload uses it any more.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - mail.rekey.invalid
        - mail.rekey.conflict
        - mail.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/StartMailRekey'
      responses:
        "202":
          $ref: '#/components/responses/MailRekeyAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mail/rekey/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: ID of the mail key rotation Job, as returned when it was started.
    get:
      operationId: getMailRekeyStatus
      summary: Inspect safe progress and final retirement proof for one mail rekey Job
      tags:
        - Mail
      description: >-
        Returns the progress of one mail key rotation Job. After the Job succeeds, it also returns the final counts that show whether the retiring key is safe to remove. Payload content, key bytes, recipients and worker diagnostics are never included.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - mail.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MailRekeyStatusOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    StartMailRekey:
      description: The key this rotation retires. It must be a key other than the primary that still encrypts stored payloads.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailRekeyRequest'
          example:
            retiring_key_id: 2b8f4c6a0e1d3957b2c4e6f8a0b1c3d5
  responses:
    MailRekeyAccepted:
      description: The key rotation Job was created.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailRekeyResponse'
          example:
            job_id: f6tcxyfofj3n3buuqfjaw9j1jn
            primary_key_id: 7d3e9a10c4b2f6e8a1d5c7b9e3f20a46
            retiring_key_id: 2b8f4c6a0e1d3957b2c4e6f8a0b1c3d5
            created_at: '2026-08-03T14:00:00Z'
    MailRekeyStatusOK:
      description: The rotation's progress and, once it has succeeded, its final counts.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailRekeyStatusResponse'
          example:
            job_id: f6tcxyfofj3n3buuqfjaw9j1jn
            status: succeeded
            primary_key_id: 7d3e9a10c4b2f6e8a1d5c7b9e3f20a46
            retiring_key_id: 2b8f4c6a0e1d3957b2c4e6f8a0b1c3d5
            created_at: '2026-08-03T14:00:00Z'
            updated_at: '2026-08-03T14:06:20Z'
            completed_at: '2026-08-03T14:06:20Z'
            attempt_count: 1
            maximum_attempts: 3
            processed: 37
            reencrypted: 37
            progress:
              current: 37
              total: 37
              stage: reencrypting
            proof:
              non_primary_references: 0
              retiring_references: 0
              retirement_safe: true
  schemas:
    MailRekeyRequest:
      description: Which key a new rotation Job retires.
      type: object
      additionalProperties: false
      required:
        - retiring_key_id
      properties:
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: ID of the configured key to retire, in lowercase hexadecimal. It must not be the primary key.
    MailRekeyResponse:
      description: The rotation Job that was created and the keys it works with.
      type: object
      additionalProperties: false
      required:
        - job_id
        - primary_key_id
        - retiring_key_id
        - created_at
      properties:
        job_id:
          $ref: '#/components/schemas/ID'
          description: ID of the rotation Job. Use it to check progress.
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: ID of the primary key that payloads are re-encrypted with.
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: ID of the key being retired.
        created_at:
          type: string
          format: date-time
          description: Time when the rotation Job was created.
    MailRekeyProgress:
      description: Approximate progress while stored payloads are re-encrypted. Omitted until the Job has saved its first progress.
      type: object
      additionalProperties: false
      required:
        - current
        - total
        - stage
      properties:
        current:
          type: integer
          format: int64
          minimum: 0
          description: Number of payloads checked so far.
        total:
          type: integer
          format: int64
          minimum: 1
          description: Number of payloads the rotation expects to check.
        stage:
          type: string
          enum:
            - reencrypting
          description: Name of the stage the rotation is in.
    MailRekeyProof:
      description: >-
        Final counts that show whether the retiring key can be removed. Present only after the rotation succeeds.
      type: object
      additionalProperties: false
      required:
        - non_primary_references
        - retiring_references
        - retirement_safe
      properties:
        non_primary_references:
          type: integer
          format: int64
          minimum: 0
          description: Number of stored payloads still encrypted with any key other than the primary, after the rotation.
        retiring_references:
          type: integer
          format: int64
          minimum: 0
          description: Number of stored payloads still encrypted with the retiring key.
        retirement_safe:
          type: boolean
          description: True only when the final counts show that no payload uses the retiring key, so it can be removed.
    MailRekeyStatusResponse:
      description: Status and progress of a mail key rotation Job, with its final counts once it succeeds.
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
        - primary_key_id
        - retiring_key_id
        - created_at
        - updated_at
        - attempt_count
        - maximum_attempts
        - processed
        - reencrypted
      properties:
        job_id:
          $ref: '#/components/schemas/ID'
          description: ID of the rotation Job.
        status:
          $ref: '#/components/schemas/JobStatus'
          description: Where the rotation Job is in its lifecycle.
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: ID of the primary key that payloads are re-encrypted with.
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: ID of the key being retired.
        created_at:
          type: string
          format: date-time
          description: Time when the rotation Job was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the rotation Job's most recent change.
        completed_at:
          type: string
          format: date-time
          description: Time the rotation Job finished. Omitted while it has not finished.
        public_error_code:
          type: string
          maxLength: 128
          description: Public reason for the Job's most recent failure, from the Job error codes. Omitted when there is none.
        attempt_count:
          type: integer
          minimum: 0
          description: Number of execution Attempts made so far.
        maximum_attempts:
          type: integer
          minimum: 1
          description: Most execution Attempts the Job's retry policy allows.
        processed:
          type: integer
          format: int64
          minimum: 0
          description: Number of stored payloads the rotation has checked so far.
        reencrypted:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of checked payloads that the rotation re-encrypted. It is never more than `processed`.
        progress:
          $ref: '#/components/schemas/MailRekeyProgress'
          description: Progress of the re-encryption. Omitted until the Job has saved its first progress.
        proof:
          $ref: '#/components/schemas/MailRekeyProof'
          description: >-
            Final counts that show whether the retiring key can be removed. Present only after the Job
            succeeds.
