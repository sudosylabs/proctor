paths:
  /api/v1/mail/test:
    post:
      operationId: sendControlledTestMail
      summary: Enqueue a controlled test message to the operator's verified address
      tags:
        - Mail
      description: >-
        Queues the built-in test message to the caller's own verified email address. The caller's address must be able to receive mail. The server chooses the recipient and the content, and applies its own rate limit to this endpoint. The response holds the new delivery's status, with the address masked.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/mail/test' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - mail.recipient_unverified
        - mail.recipient_ineligible
        - mail.test.rate_limited
        - mail.conflict
        - mail.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          $ref: '#/components/responses/MailDeliveryAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    MailDeliveryAccepted:
      description: The test message was queued.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailDeliveryResponse'
          example:
            id: nybc6xhg593upqice3sdeyro5k
            occurrence_id: dfa1x1n7mkthyoziwxnupsmyia
            target_user_id: 14j8umgczgrdp95w77zuxmxfu9
            template_key: system.mail_test
            template_digest: 0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
            masked_recipient: a***@example.edu
            state: queued
            created_at: '2026-08-01T11:00:00Z'
            updated_at: '2026-08-01T11:00:00Z'
            message_date: '2026-08-01T11:00:00Z'
            deadline: '2026-08-02T11:00:00Z'
