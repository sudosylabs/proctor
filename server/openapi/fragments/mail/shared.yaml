components:
  schemas:
    MailFailureCode:
      type: string
      description: >-
        Public reason a mail delivery failed, was suppressed or canceled, or was retried by an operator. The server only uses the values listed here, but later releases may add more. Clients choose their own labels and should show an unknown value in a generic way.
      enum:
        - mail.delivery.canceled
        - mail.delivery.expired
        - mail.delivery.obsolete
        - mail.delivery.recipient_ineligible
        - mail.delivery.suppressed_disabled
        - mail.message.invalid
        - mail.operator.retry
        - mail.payload.unavailable
        - mail.transport.acceptance_uncertain
        - mail.transport.permanent
        - mail.transport.temporary
        - mail.transport.unknown
    MailTemplateKey:
      type: string
      description: >-
        Key of one of the server's built-in transactional mail templates. The server only uses the values listed here, but later releases may add more. Clients choose their own labels and should show an unknown value in a generic way.
      enum:
        - academic.academic_unit_assigned
        - academic.academic_unit_assignment_ended
        - academic.class_enrolled
        - academic.class_enrollment_ended
        - academic.class_transferred
        - access.academic_unit_role_invitation
        - access.institution_role_invitation
        - access.invitation_accepted
        - access.invitation_revoked
        - access.student_class_invitation
        - access.teacher_academic_unit_invitation
        - authorization.institution_role_assigned
        - authorization.institution_role_ended
        - authorization.scoped_role_assigned
        - authorization.scoped_role_ended
        - exam.manager_added
        - exam.manager_removed
        - exam.ownership_transferred_from_you
        - exam.ownership_transferred_to_you
        - exam.result_released
        - exam.retention_scheduled
        - exam.sitting_assignment_removed
        - exam.sitting_canceled
        - exam.sitting_rescheduled
        - exam.sitting_scheduled
        - exam.submission_automatically_sealed
        - exam.submission_manager_ended
        - exam.submission_received
        - identity.account_disabled
        - identity.account_enabled
        - identity.email_change_verify_new
        - identity.email_change_warning_old
        - identity.email_verified_by_admin
        - identity.mfa_disabled
        - identity.mfa_enabled
        - identity.mfa_recovery_codes_regenerated
        - identity.mfa_reset
        - identity.password_changed
        - identity.password_reset
        - identity.personal_access_token_created
        - identity.personal_access_token_disabled
        - identity.personal_access_token_enabled
        - identity.personal_access_token_revoked
        - identity.sessions_revoked_by_admin
        - identity.verify_email
        - system.mail_test
    MailDeliveryState:
      description: >-
        Where one mail delivery is in its lifecycle. `accepted` means the SMTP server took the message. It doesn't prove the message reached the inbox.
      type: string
      enum:
        - queued
        - sending
        - accepted
        - failed
        - suppressed
        - canceled
    MailDeliveryResponse:
      description: >-
        Status and routing details of one mail delivery. The recipient address is masked and the message content is never included.
      type: object
      additionalProperties: false
      required:
        - id
        - occurrence_id
        - template_key
        - template_digest
        - masked_recipient
        - state
        - created_at
        - updated_at
        - message_date
        - deadline
        - message_id
        - attempt_count
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: ID of the delivery.
        occurrence_id:
          $ref: '#/components/schemas/ID'
          description: >-
            ID of the notification this delivery belongs to. When one notification goes to several recipients, each of their deliveries carries the same value.
        target_user_id:
          $ref: '#/components/schemas/ID'
          description: >-
            User the mail is addressed to. Each delivery has exactly one of `target_user_id` and
            `target_invitation_id`. Invitation mail uses the second, because the invitee has no account yet.
        target_invitation_id:
          $ref: '#/components/schemas/ID'
          description: Invitation the mail is addressed to. Present instead of `target_user_id` for Invitation mail.
        template_key:
          type: string
          anyOf:
            - $ref: '#/components/schemas/MailTemplateKey'
            - type: string
          description: Template the message was written from.
        template_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 hash, in lowercase hexadecimal, of the exact template version used to write the message.
        masked_recipient:
          type: string
          maxLength: 254
          description: >-
            Recipient address with the local part hidden, such as `a***@example.edu`. Safe to show to administrators.
        state:
          $ref: '#/components/schemas/MailDeliveryState'
          description: Where the delivery is in its lifecycle.
        created_at:
          type: string
          format: date-time
          description: Time when the delivery was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the delivery's most recent change.
        message_date:
          type: string
          format: date-time
          description: Time written in the message's `Date` header.
        deadline:
          type: string
          format: date-time
          description: Time after which the message is no longer worth sending. A delivery still unsent by then expires.
        message_id:
          type: string
          maxLength: 900
          description: >-
            The message's `Message-ID` header, for matching the delivery with mail server logs. It isn't a secret.
        attempt_count:
          type: integer
          minimum: 0
          maximum: 8
          description: Number of send attempts made so far.
        accepted_at:
          type: string
          format: date-time
          description: Time the SMTP server accepted the message. Omitted until then.
        failed_at:
          type: string
          format: date-time
          description: Time the delivery failed for good. Omitted unless it failed.
        public_failure_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/MailFailureCode'
            - type: string
          description: >-
            Public reason the delivery failed, was suppressed or canceled, or was retried by an operator. Raw SMTP and infrastructure errors are never returned. Omitted when there is no such reason.
        recipient_display_name:
          type: string
          maxLength: 256
          description: >-
            Current display name of the User in `target_user_id`. Present only when the delivery is listed or
            fetched by ID, and only while the caller can see that User in the User directory (`user.view` or
            `class.members.view`). `mail.view` alone doesn't reveal it. Omitted for Invitation mail, for a User the
            caller can't see, and in the responses to sending a test, canceling or retrying. It is the account's
            name, not the address the mail went to, which stays masked.
