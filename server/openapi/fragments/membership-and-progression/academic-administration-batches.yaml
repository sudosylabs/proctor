paths:
  /api/v1/academic-administration-batches:
    post:
      operationId: runAcademicAdministrationBatch
      summary: Run one bounded typed existing-User academic administration batch
      tags:
        - Membership and progression
      description: >-
        Applies one operation to 1 to 200 existing Users in a single request. Each item runs on its own, with the same
        authorization, audit, mail and retry behavior as the matching single-item endpoint, so one failed item does not
        stop the others. The response reports every item's outcome in request order. A direct `user.disable` batch
        also records one audit entry with its overall outcome.

        Item keys must be unique within the request; repeated keys fail those items with `request.invalid`. An item
        that would make the same change as another item in the request fails with `onboarding_batch.duplicate`. Role
        Binding operations, `user.enable`, `user.disable` and `user_sessions.revoke` also need a strong, recent
        Session.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - authentication.strong_required
        - authentication.reauthentication_required
        - idempotency.key_required
        - idempotency.key_invalid
        - administration.unavailable
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RunAcademicAdministrationBatch'
      responses:
        "200":
          $ref: '#/components/responses/AcademicAdministrationBatchOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    RunAcademicAdministrationBatch:
      description: One operation, the scope it runs in, and 1 to 200 items, each with its own key.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicAdministrationBatchRequest'
          example:
            operation: user.enable
            scope_type: institution
            scope_id: ybndrfg8ejkmcpqxot1uwisza3
            items:
              - key: enable-user-001
                user_id: ybndrfg8ejkmcpqxot1uwisza4
  responses:
    AcademicAdministrationBatchOK:
      description: The outcome of every item, in request order, with counts by outcome.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicAdministrationBatchResponse'
          example:
            operation: user.enable
            items:
              - index: 0
                status: succeeded
                resource_id: ybndrfg8ejkmcpqxot1uwisza4
              - index: 1
                status: no_op
                resource_id: g63dcrphk8idgyjgzbrpajosz6
              - index: 2
                status: failed
                error_code: resource.not_found
            succeeded: 1
            no_op: 1
            failed: 1
  schemas:
    AcademicAdministrationBatchItemRequest:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
          pattern: ^[A-Za-z0-9._~-]{1,128}$
          description: >-
            Your key for this item, unique within the request. Together with the request's Idempotency-Key it lets
            you retry the item safely.
        user_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The User to change. Required for every operation except the `.end` operations, which take
            `relationship_id` instead.
        relationship_id:
          $ref: '#/components/schemas/ID'
          description: >-
            For the `.end` operations, the Affiliation, Academic Unit membership, Class enrollment or Role Binding to
            end. For `class.transfer`, the student's current enrollment that the new one replaces. Not allowed for
            other operations.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role to bind. Required for `role_binding.create` and not allowed for other operations.
        affiliation_kind:
          $ref: '#/components/schemas/AffiliationKind'
          description: The kind of Affiliation to add. Required for `affiliation.add` and not allowed for other operations.
        start_at:
          type: string
          format: date-time
          description: >-
            When the new relationship starts, for operations that create one (`affiliation.add`,
            `academic_unit_member.add`, `class.enroll`, `class.transfer` and `role_binding.create`). Omit it to start
            when the item runs.
        end_at:
          type: string
          format: date-time
          description: >-
            When the new relationship ends; it must be after `start_at`. Allowed for `affiliation.add`,
            `class.enroll`, `class.transfer` and `role_binding.create`. Omit it for no end.
    AcademicAdministrationBatchRequest:
      type: object
      additionalProperties: false
      required:
        - operation
        - scope_type
        - scope_id
        - items
      properties:
        operation:
          type: string
          description: The one change applied to every item.
          enum:
            - affiliation.add
            - affiliation.end
            - academic_unit_member.add
            - academic_unit_member.end
            - class.enroll
            - class.end
            - class.transfer
            - role_binding.create
            - role_binding.end
            - user.enable
            - user.disable
            - user_sessions.revoke
        scope_type:
          type: string
          description: >-
            The kind of scope the batch is authorized at. Academic Unit membership operations take `academic_unit`,
            Class operations take `class`, Affiliation and User operations take `institution`, and Role Binding
            operations take any of the three.
          enum:
            - institution
            - academic_unit
            - class
        scope_id:
          $ref: '#/components/schemas/ID'
          description: The Institution, Academic Unit or Class the batch runs in.
        reason:
          type: string
          maxLength: 500
          description: >-
            Why the accounts are disabled, given once for the whole batch. Only `user.disable` takes it; any other
            operation is refused with `request.invalid` on `reason`. It has the limits of a single disable: leading
            and trailing spaces are removed, up to 500 characters, no control characters, and not only spaces. An
            empty string means no reason. It is written to every disabled User's audit record.
        items:
          type: array
          minItems: 1
          maxItems: 200
          description: The items to process, from 1 to 200.
          items:
            $ref: '#/components/schemas/AcademicAdministrationBatchItemRequest'
    AcademicAdministrationBatchErrorCode:
      type: string
      description: >-
        Why one academic administration batch item failed. New codes may be added later, so show an unknown code as a
        generic failure.
      enum:
        - request.invalid
        - resource.not_found
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - administration.unavailable
        - mail.unavailable
        - authentication.token_invalid
        - authentication.strong_required
        - authentication.reauthentication_required
        - affiliation.invalid
        - affiliation.conflict
        - affiliation.student_has_active_enrollment
        - academic_unit_member.invalid
        - academic_unit_member.conflict
        - class_member.invalid
        - class_member.student_affiliation_required
        - class.enrollment_conflict
        - role_binding.invalid
        - role_binding.conflict
        - role_binding.last_system_admin
        - role_binding.scope_member_required
        - role_binding.system_admin_scope_invalid
        - user.invalid
        - user.conflict
        - user.last_system_admin
        - session.not_found
        - idempotency.conflict
        - idempotency.in_progress
        - onboarding_batch.duplicate
    AcademicAdministrationBatchItemResponse:
      type: object
      additionalProperties: false
      required:
        - index
        - status
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 199
          description: The item's position in the request, starting at 0.
        status:
          type: string
          enum:
            - succeeded
            - no_op
            - failed
          description: >-
            `succeeded` when the item made its change, `no_op` when an earlier request with the same keys already made
            it, so nothing changed again, and `failed` when it could not be applied.
        resource_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Affiliation, membership, enrollment, Role Binding or User the item created or changed. Omitted when the
            item failed.
        error_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/AcademicAdministrationBatchErrorCode'
            - type: string
          description: Why the item failed. Present only when `status` is `failed`.
    AcademicAdministrationBatchResponse:
      type: object
      additionalProperties: false
      required:
        - operation
        - items
        - succeeded
        - no_op
        - failed
      properties:
        operation:
          type: string
          description: The operation the batch ran.
          enum:
            - affiliation.add
            - affiliation.end
            - academic_unit_member.add
            - academic_unit_member.end
            - class.enroll
            - class.end
            - class.transfer
            - role_binding.create
            - role_binding.end
            - user.enable
            - user.disable
            - user_sessions.revoke
        items:
          type: array
          minItems: 1
          maxItems: 200
          description: One outcome for each request item, in request order.
          items:
            $ref: '#/components/schemas/AcademicAdministrationBatchItemResponse'
        succeeded:
          type: integer
          minimum: 0
          maximum: 200
          description: How many items succeeded.
        no_op:
          type: integer
          minimum: 0
          maximum: 200
          description: How many items changed nothing because an earlier request had already applied them.
        failed:
          type: integer
          minimum: 0
          maximum: 200
          description: How many items failed.
