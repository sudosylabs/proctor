paths:
  /api/v1/academic-administration-previews:
    post:
      operationId: createAcademicAdministrationPreview
      summary: Preview one academic administration operation over the Users a directory filter matches
      tags:
        - Membership and progression
      description: >-
        Previews one academic administration operation applied to every existing User that a User directory filter
        matches. The filter takes the same fields as the User directory, with the same validation and visibility
        rules, including the fields only an Institution-wide viewer may use. A filter the directory would refuse is
        refused here too.

        Nothing changes yet. A background Job applies the filter with your visibility at that moment, saves the
        ordered list of matching Users, and puts each row in `will_change`, `no_op` or `skipped`, with a reason for
        each skipped row. Your own account is always skipped, and a disable or Session revocation also skips System
        Administrators. If more than 10,000 Users match, the preview fails with
        `academic_administration_preview.too_many_users`; narrow the filter and try again.

        Poll the preview until it is `preview_ready` or `failed`. `class.transfer` is not offered, because a
        transfer must name the exact enrollment it replaces; a Student Progression does that instead. Requires a
        strong, recent interactive Session.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.mfa.unavailable
        - invitation.unavailable
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - student_progression.conflict
        - student_progression.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicAdministrationPreview'
      responses:
        "202":
          $ref: '#/components/responses/AcademicAdministrationPreviewAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/academic-administration-previews/{academic_administration_preview_id}:
    parameters:
      - $ref: '#/components/parameters/AcademicAdministrationPreviewID'
    get:
      operationId: getAcademicAdministrationPreview
      summary: Read one academic administration preview and its counts
      tags:
        - Membership and progression
      description: >-
        Reads one of your own previews: its state, operation, filter, digest and revision and, once it is ready, a
        `summary` of its rows by group, with skipped rows counted by reason. The summary counts only the rows whose
        User your User directory shows now, which are the rows the rows listing returns. After commit, the row
        counts report what happened when each row ran.

        Only the User who created a preview can read it, and only while they can see onboarding batches at its
        scope. A caller without that access is denied, and any other User gets not found. If your directory would
        now refuse the preview's filter (for example an activity filter after you lose Institution-wide `user.view`,
        or a Role filter after you lose `role.view`), the read is refused with
        `academic_administration_preview.authorization_lost`.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - academic_administration_preview.authorization_lost
        - administration.unavailable
        - onboarding_import.unavailable
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AcademicAdministrationPreviewOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/academic-administration-previews/{academic_administration_preview_id}/rows:
    parameters:
      - $ref: '#/components/parameters/AcademicAdministrationPreviewID'
    get:
      operationId: listAcademicAdministrationPreviewRows
      summary: Show who is in one group of an academic administration preview
      tags:
        - Membership and progression
      description: >-
        Pages through the saved rows of one group of your own preview, in row order. Each row names its User and,
        after commit, its outcome. A row appears only while your User directory still shows its User, so if your
        visibility has narrowed since the preview was made, you no longer see the Users you lost. Once your directory
        would refuse the preview's filter, the read is refused with
        `academic_administration_preview.authorization_lost`. A cursor only continues the group and reason it was
        issued for.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - academic_administration_preview.authorization_lost
        - administration.unavailable
        - onboarding_import.unavailable
        - invitation.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: group
          in: query
          required: true
          description: The group of rows to list.
          schema:
            type: string
            enum:
              - will_change
              - no_op
              - skipped
        - name: reason
          in: query
          required: false
          description: Only with `group=skipped`. List only the rows skipped for this reason.
          schema:
            $ref: '#/components/schemas/AcademicAdministrationPreviewSkipReason'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/AcademicAdministrationPreviewRowsOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/academic-administration-previews/{academic_administration_preview_id}/commit:
    parameters:
      - $ref: '#/components/parameters/AcademicAdministrationPreviewID'
    post:
      operationId: commitAcademicAdministrationPreview
      summary: Commit one exact academic administration preview
      tags:
        - Membership and progression
      description: >-
        Commits your own ready preview if its revision and digest still match, within 15 minutes of it becoming
        ready, measured by the server's database clock. After that the commit is refused with
        `academic_administration_preview.expired`, and you need a new preview. A preview another User created reads
        as not found, and the commit is refused with `academic_administration_preview.authorization_lost` once your
        User directory would refuse the preview's filter.

        One background Job then runs the saved rows. It never runs the filter again, so a User who starts matching
        after the preview is not changed. Each row is authorized again when it runs. A row whose User your directory
        no longer shows fails with `authorization.denied`, and once your directory would refuse the filter, every
        remaining row fails the same way. The first commit records one audit entry for the whole batch, with the
        operation, filter, counts and preview ID. Each row also gets its own audit entry naming the preview and row,
        whether it succeeds or fails. The response is the preview as the commit recorded it, and repeating the request
        with the same Idempotency-Key returns that same commit. Requires a strong, recent interactive Session.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_administration_preview.authorization_lost
        - academic_administration_preview.conflict
        - academic_administration_preview.expired
        - administration.unavailable
        - authentication.mfa.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - invitation.unavailable
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - student_progression.conflict
        - student_progression.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CommitAcademicAdministrationPreview'
      responses:
        "202":
          $ref: '#/components/responses/AcademicAdministrationPreviewAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "410":
          $ref: '#/components/responses/Gone'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/academic-administration-previews/{academic_administration_preview_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/AcademicAdministrationPreviewID'
    post:
      operationId: cancelAcademicAdministrationPreview
      summary: Cancel one unfinished academic administration preview
      tags:
        - Membership and progression
      description: >-
        Cancels your own preview before it finishes. Rows that have not run yet are canceled. A row that is already
        running finishes, and rows that already completed are never undone.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/academic-administration-previews/ybndrfg8ejkmcpqxot1uwisza3/cancel' \
              --header 'Authorization: Bearer <session-access-token>'
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - invitation.unavailable
        - onboarding_import.conflict
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - student_progression.conflict
        - student_progression.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/AcademicAdministrationPreviewOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    AcademicAdministrationPreviewID:
      name: academic_administration_preview_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of the academic administration preview.
  requestBodies:
    CreateAcademicAdministrationPreview:
      description: The operation, its scope and fields, and the User directory filter that picks the Users it applies to.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicAdministrationPreviewRequest'
          example:
            operation: user.disable
            scope_type: institution
            scope_id: ybndrfg8ejkmcpqxot1uwisza3
            filter:
              affiliation:
                - student
              never_signed_in: true
    CommitAcademicAdministrationPreview:
      description: The revision and digest of the preview you reviewed.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicAdministrationPreviewCommitRequest'
          example:
            expected_revision: 2
            preview_digest: 3946ca64ff78d93ca61090a437cbb6b3d2ca0d488f5f9ccf3059608368b27693
  responses:
    AcademicAdministrationPreviewAccepted:
      description: >-
        The preview. Its background Job has been queued: resolving the filter after you create the preview, or
        running the rows after you commit it.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicAdministrationPreviewResponse'
          example:
            id: yu7twx6xxb4udbc94foq5zq9ni
            state: parsing
            operation: user.disable
            scope_type: institution
            scope_id: ybndrfg8ejkmcpqxot1uwisza3
            filter:
              affiliation:
                - student
              never_signed_in: true
            total_rows: 0
            succeeded_rows: 0
            no_op_rows: 0
            failed_rows: 0
            skipped_rows: 0
            preview_job_id: dpbj4ddm3hw8fkicm7nuazihkg
            created_at: '2026-09-01T09:00:00Z'
            updated_at: '2026-09-01T09:00:00Z'
            expires_at: '2026-09-08T09:00:00Z'
            revision: 1
    AcademicAdministrationPreviewOK:
      description: Your academic administration preview.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicAdministrationPreviewResponse'
          example:
            id: yu7twx6xxb4udbc94foq5zq9ni
            state: preview_ready
            operation: user.disable
            scope_type: institution
            scope_id: ybndrfg8ejkmcpqxot1uwisza3
            filter:
              affiliation:
                - student
              never_signed_in: true
            preview_digest: 3946ca64ff78d93ca61090a437cbb6b3d2ca0d488f5f9ccf3059608368b27693
            summary:
              will_change: 41
              no_op: 3
              skipped: 1
              skip_reasons:
                - reason: academic_administration_preview.system_administrator
                  rows: 1
            total_rows: 45
            succeeded_rows: 0
            no_op_rows: 0
            failed_rows: 0
            skipped_rows: 0
            preview_job_id: dpbj4ddm3hw8fkicm7nuazihkg
            created_at: '2026-09-01T09:00:00Z'
            updated_at: '2026-09-01T09:00:06Z'
            preview_expires_at: '2026-09-01T09:15:06Z'
            expires_at: '2026-09-08T09:00:00Z'
            revision: 2
    AcademicAdministrationPreviewRowsOK:
      description: One page of the preview's rows that your User directory shows.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicAdministrationPreviewRowListResponse'
          example:
            items:
              - row: 1
                user_id: yftfs48pasu5fd6czhcwz6b4x3
                username: student.one
                display_name: Student One
                group: will_change
                status: valid
              - row: 2
                user_id: nan7rdocriztinowtuyrbqg67a
                username: student.two
                display_name: Student Two
                group: will_change
                status: valid
            next_cursor: eyJyb3ciOjIsImdyb3VwIjoid2lsbF9jaGFuZ2UiLCJyZWFzb24iOiIifQ
  schemas:
    AcademicAdministrationPreviewSkipReason:
      type: string
      description: >-
        Why a preview skips a row: the row is your own account (`self`), a System Administrator in a disable or
        Session revocation (`system_administrator`), a Class enrollment of a User already enrolled in another Class of
        the same Academic Period (`enrollment_conflict`) or without a current student Affiliation
        (`student_affiliation_required`), or an end for a User who holds several current relationships it could end
        (`ambiguous`). New reasons may be added later, so show an unknown reason as a generic skip.
      enum:
        - academic_administration_preview.ambiguous
        - academic_administration_preview.enrollment_conflict
        - academic_administration_preview.self
        - academic_administration_preview.student_affiliation_required
        - academic_administration_preview.system_administrator
    AcademicAdministrationPreviewOperation:
      type: string
      description: The existing-User academic administration operation a preview applies to every matching User.
      enum:
        - affiliation.add
        - affiliation.end
        - academic_unit_member.add
        - academic_unit_member.end
        - class.enroll
        - class.end
        - role_binding.create
        - role_binding.end
        - user.enable
        - user.disable
        - user_sessions.revoke
    AcademicAdministrationPreviewFilter:
      description: >-
        The User directory filter of a preview, using the directory's query parameter names. Each field narrows the
        Users you can see, and none widens it.
      type: object
      additionalProperties: false
      properties:
        q:
          type: string
          maxLength: 256
          description: Text matched, without regard to case, anywhere in the User directory fields you can see.
        affiliation:
          type: array
          maxItems: 4
          description: Keep Users who hold a current Affiliation of any of these kinds.
          items:
            type: string
            enum:
              - student
              - teacher
              - staff
              - external
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: Keep Users with a current membership in this Academic Unit or one of its descendants.
        role_id:
          type: array
          maxItems: 16
          description: >-
            Keep Users who hold a current Role Binding of any of these Roles, within the scopes where you hold
            role_binding.view. Using it needs Institution-wide role.view.
          items:
            $ref: '#/components/schemas/ID'
        state:
          type: string
          enum:
            - active
            - disabled
          description: >-
            Keep only `active` or only `disabled` accounts. Only Institution-wide user.view can see disabled Users.
        never_signed_in:
          type: boolean
          description: >-
            When true, keep Users who have never signed in. Needs Institution-wide user.view, and cannot be combined
            with `last_active_after` or `last_active_before`.
        last_active_after:
          type: string
          format: date-time
          description: >-
            Keep Users whose last account activity is at or after this instant. Needs Institution-wide user.view.
        last_active_before:
          type: string
          format: date-time
          description: >-
            Keep Users whose last account activity is before this instant. It must be later than
            `last_active_after`. Needs Institution-wide user.view.
    AcademicAdministrationPreviewRequest:
      type: object
      additionalProperties: false
      required:
        - operation
        - scope_type
        - scope_id
        - filter
      properties:
        operation:
          $ref: '#/components/schemas/AcademicAdministrationPreviewOperation'
          description: The operation to apply to every matching User.
        scope_type:
          type: string
          enum:
            - institution
            - academic_unit
            - class
          description: >-
            The kind of scope the operation runs in: `academic_unit` for Academic Unit membership operations, `class`
            for Class operations, `institution` for Affiliation and User operations, and any of the three for Role
            Binding operations.
        scope_id:
          $ref: '#/components/schemas/ID'
          description: The Institution, Academic Unit or Class the operation runs in.
        filter:
          $ref: '#/components/schemas/AcademicAdministrationPreviewFilter'
          description: The User directory filter that picks the Users the operation applies to.
        role_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Role to bind or unbind. Required for `role_binding.create` and `role_binding.end`, and not allowed
            for other operations.
        affiliation_kind:
          type: string
          enum:
            - student
            - teacher
            - staff
            - external
          description: >-
            The kind of Affiliation to add or end. Required for `affiliation.add` and `affiliation.end`, and not
            allowed for other operations.
        start_at:
          description: >-
            When the relationship made by a creating operation starts (`affiliation.add`, `academic_unit_member.add`,
            `class.enroll` or `role_binding.create`). Omit it and every row starts at the time the preview was
            created. Not allowed for other operations.
          type: string
          format: date-time
        end_at:
          description: >-
            When the relationship made by `affiliation.add`, `class.enroll` or `role_binding.create` ends. It must be
            after `start_at`, or after the preview's creation time when `start_at` is omitted; otherwise the request
            is refused with `request.invalid` on `end_at`.
          type: string
          format: date-time
    AcademicAdministrationPreviewCommitRequest:
      description: >-
        The revision and SHA-256 digest of the preview you reviewed. The commit is refused if the preview has
        changed since.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - preview_digest
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The preview's `revision` when you reviewed it.
        preview_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: The preview's `preview_digest`, a SHA-256 digest in lowercase hexadecimal.
    AcademicAdministrationPreviewSummary:
      description: A ready preview's row counts by group, and its skipped rows counted by reason.
      type: object
      additionalProperties: false
      required:
        - will_change
        - no_op
        - skipped
        - skip_reasons
      properties:
        will_change:
          type: integer
          minimum: 0
          maximum: 10000
          description: Rows the operation will change.
        no_op:
          type: integer
          minimum: 0
          maximum: 10000
          description: Rows where the change already holds, so the operation leaves them as they are.
        skipped:
          type: integer
          minimum: 0
          maximum: 10000
          description: Rows the operation will skip.
        skip_reasons:
          type: array
          description: The skipped rows, counted by reason.
          items:
            type: object
            additionalProperties: false
            required:
              - reason
              - rows
            properties:
              reason:
                type: string
                anyOf:
                  - $ref: '#/components/schemas/AcademicAdministrationPreviewSkipReason'
                  - type: string
                description: Why these rows are skipped.
              rows:
                type: integer
                minimum: 1
                maximum: 10000
                description: How many rows are skipped for this reason.
    AcademicAdministrationPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - operation
        - scope_type
        - scope_id
        - filter
        - total_rows
        - succeeded_rows
        - no_op_rows
        - failed_rows
        - skipped_rows
        - preview_job_id
        - created_at
        - updated_at
        - expires_at
        - revision
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of the preview.
        state:
          type: string
          enum:
            - parsing
            - preview_ready
            - executing
            - completed
            - completed_with_errors
            - canceled
            - failed
          description: >-
            Where the preview stands: `parsing` while the filter is resolved, `preview_ready` when it can be reviewed
            and committed, `executing` while its rows run, and then `completed`, `completed_with_errors`, `canceled`
            or `failed`.
        operation:
          $ref: '#/components/schemas/AcademicAdministrationPreviewOperation'
          description: The operation the preview applies.
        scope_type:
          type: string
          enum:
            - institution
            - academic_unit
            - class
          description: The kind of scope the operation runs in.
        scope_id:
          $ref: '#/components/schemas/ID'
          description: The Institution, Academic Unit or Class the operation runs in.
        filter:
          $ref: '#/components/schemas/AcademicAdministrationPreviewFilter'
          description: The User directory filter the preview resolved.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role a Role Binding operation binds or unbinds. Omitted for other operations.
        affiliation_kind:
          type: string
          enum:
            - student
            - teacher
            - staff
            - external
          description: The kind of Affiliation an Affiliation operation adds or ends. Omitted for other operations.
        start_at:
          type: string
          format: date-time
          description: >-
            The start requested for a creating operation. Omitted when none was given, in which case every row starts
            at the time the preview was created.
        end_at:
          type: string
          format: date-time
          description: The end requested for a creating operation. Omitted when none was given.
        preview_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: >-
            SHA-256 digest of the ready preview, in lowercase hexadecimal. Send it back to commit. Present once the
            preview is ready.
        summary:
          $ref: '#/components/schemas/AcademicAdministrationPreviewSummary'
          description: The rows you can see, counted by group. Present once the preview is ready.
        total_rows:
          type: integer
          minimum: 0
          maximum: 10000
          description: How many rows the preview saved, one for each matching User.
        succeeded_rows:
          type: integer
          minimum: 0
          description: Rows that ran successfully. Zero until the preview is committed.
        no_op_rows:
          type: integer
          minimum: 0
          description: Rows that changed nothing because the change already held. Zero until the preview is committed.
        failed_rows:
          type: integer
          minimum: 0
          description: Rows that failed when they ran. Zero until the preview is committed.
        skipped_rows:
          type: integer
          minimum: 0
          description: Rows that were skipped. Zero until the preview is committed.
        preview_job_id:
          $ref: '#/components/schemas/ID'
          description: The Job that resolves the filter and builds the rows.
        execution_job_id:
          $ref: '#/components/schemas/ID'
          description: The Job that runs the rows. Present once the preview is committed.
        failure_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/OnboardingImportFailureCode'
            - type: string
          description: Why the preview failed. Present only when it failed.
        created_at:
          type: string
          format: date-time
          description: When the preview was created.
        updated_at:
          type: string
          format: date-time
          description: When the preview last changed.
        preview_expires_at:
          type: string
          format: date-time
          description: When the ready preview can no longer be committed, 15 minutes after it became ready.
        expires_at:
          type: string
          format: date-time
          description: When the preview and its rows are deleted, seven days after it was created.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The preview's revision, which goes up each time it changes. Send it back as `expected_revision` to
            commit.
    AcademicAdministrationPreviewRowResponse:
      type: object
      additionalProperties: false
      required:
        - row
        - user_id
        - username
        - display_name
        - group
        - status
      properties:
        row:
          type: integer
          minimum: 1
          maximum: 10000
          description: The row's number in the preview, starting at 1.
        user_id:
          $ref: '#/components/schemas/ID'
          description: The User this row applies to.
        username:
          type: string
          description: The User's username.
        display_name:
          type: string
          description: The User's display name.
        group:
          type: string
          enum:
            - will_change
            - no_op
            - skipped
          description: The group the row is in.
        reason:
          type: string
          anyOf:
            - $ref: '#/components/schemas/AcademicAdministrationPreviewSkipReason'
            - type: string
          description: Why the row is skipped. Present only for skipped rows.
        status:
          type: string
          enum:
            - valid
            - invalid
            - pending
            - succeeded
            - no_op
            - failed
            - skipped
            - canceled
          description: >-
            Where the row stands. Before commit, a row that will change is `valid` and every other row is
            `invalid`. After commit it shows the row's outcome: `pending` until it runs, then `succeeded`, `no_op`,
            `failed`, `skipped` or `canceled`.
        public_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/OnboardingImportRowCode'
            - type: string
          description: Why the row failed when it ran. Present only for failed rows.
        resource_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Affiliation, membership, enrollment, Role Binding or User the row created or changed. Present once
            the row has run successfully.
    AcademicAdministrationPreviewRowListResponse:
      description: One page of preview rows, in row order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          description: The rows on this page.
          items:
            $ref: '#/components/schemas/AcademicAdministrationPreviewRowResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
