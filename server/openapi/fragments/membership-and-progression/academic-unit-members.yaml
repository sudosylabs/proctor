paths:
  /api/v1/academic-unit-members/{academic_unit_member_id}:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitMemberID'
    delete:
      operationId: endAcademicUnitMember
      summary: End organizational membership while retaining history
      tags:
        - Membership and progression
      description: >-
        Ends one Academic Unit membership that is in effect, after checking that you may manage members of its
        Academic Unit. The membership keeps its dates and audit history. Ending it does not remove the member's
        Affiliations, Roles or Role Bindings.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/academic-unit-members/iqcx3qc9sbbt6ocshszfqgq6ci' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit_member.conflict
        - administration.unavailable
        - mail.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitMemberEnded'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    AcademicUnitMemberID:
      name: academic_unit_member_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of the Academic Unit membership.
  responses:
    AcademicUnitMemberEnded:
      description: The membership, now ended.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberResponse'
          example:
            id: iqcx3qc9sbbt6ocshszfqgq6ci
            created_at: '2026-08-01T00:00:00Z'
            updated_at: '2027-01-15T10:30:00Z'
            academic_unit_id: 889766ufjgio6kbpzjbufozksq
            user_id: wj3drgzdpnf54rxf5d8qd3dqne
            start_at: '2026-08-01T00:00:00Z'
            end_at: '2027-01-15T10:30:00Z'
