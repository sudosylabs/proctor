paths:
  /api/v1/academic-units/{academic_unit_id}/members:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: listAcademicUnitMembers
      summary: List effective-dated organizational members
      tags:
        - Membership and progression
      description: >-
        Lists the memberships of one Academic Unit that you may see: either those in effect at one instant, or the
        full history. A membership records a relationship only. It never grants permissions by itself.

        Pages are ordered by `sort` and `dir`, by default by membership start (`since`), oldest first, then by ID. The
        first page also reports `total`, the number of memberships the filter matches across all pages. It is exact
        below 10,000; at 10,000 counting stops and `total_is_lower_bound` is true. A cursor keeps the first page's
        instant or history filter and its order, but every page reads current data, so memberships added or changed
        between requests can change later pages.

        Each item names the member in `user`. `email` is included only if you hold Institution-wide user.view. If you
        hold role_binding.view on this Academic Unit, each item also lists the member's current Role Bindings scoped
        exactly to it, in `roles_here`.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: affiliation
          in: query
          required: false
          description: >-
            Keeps members who hold a current Affiliation of any listed kind: at `active_at`, or now for the full
            history. Repeat the parameter for several kinds, each kind at most once. It also narrows `total`.
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 4
            items:
              type: string
              enum:
                - student
                - teacher
                - staff
                - external
        - name: active_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >-
            Return the memberships in effect at this instant. Defaults to now. It cannot be combined with
            `history=true`. When following a cursor you may omit it, because the cursor keeps the first page's
            instant.
        - name: history
          in: query
          required: false
          description: >-
            When true, return the full membership history instead of only the memberships in effect at one instant.
            It cannot be combined with `active_at`.
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          required: false
          description: >-
            The page order, each key followed by membership ID: `since` (the membership start, the default) or
            `name` (the member's display name, or their username when there is none, compared case-insensitively on
            its first 64 characters). A cursor only continues the sort and direction that produced it, so repeat both
            when following it.
          schema:
            type: string
            enum:
              - since
              - name
            default: since
        - name: dir
          in: query
          required: false
          description: Ascending (`asc`, the default) or descending (`desc`) by the `sort` key.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitMemberListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAcademicUnitMember
      summary: Create organizational membership without granting permissions
      tags:
        - Membership and progression
      description: >-
        Adds an existing User to the Academic Unit in the path, from an optional start time. The request rechecks
        your authority over the Academic Unit and refuses a membership that overlaps another one. It creates no Role
        or Role Binding.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit_member.invalid
        - academic_unit_member.conflict
        - administration.unavailable
        - mail.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicUnitMember'
      responses:
        "201":
          $ref: '#/components/responses/AcademicUnitMemberCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateAcademicUnitMember:
      description: The existing User to add and, optionally, when the membership starts.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAcademicUnitMemberRequest'
          example:
            user_id: ybndrfg8ejkmcpqxot1uwisza3
            start_at: '2026-08-01T00:00:00Z'
  responses:
    AcademicUnitMemberCreated:
      description: The new membership.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberResponse'
          example:
            id: iqcx3qc9sbbt6ocshszfqgq6ci
            created_at: '2026-07-20T14:05:00Z'
            updated_at: '2026-07-20T14:05:00Z'
            academic_unit_id: 889766ufjgio6kbpzjbufozksq
            user_id: ybndrfg8ejkmcpqxot1uwisza3
            start_at: '2026-08-01T00:00:00Z'
    AcademicUnitMemberListOK:
      description: One page of the Academic Unit's memberships.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberListResponse'
          example:
            items:
              - id: iqcx3qc9sbbt6ocshszfqgq6ci
                created_at: '2026-07-20T14:05:00Z'
                updated_at: '2026-07-20T14:05:00Z'
                academic_unit_id: 889766ufjgio6kbpzjbufozksq
                user_id: ybndrfg8ejkmcpqxot1uwisza3
                start_at: '2026-08-01T00:00:00Z'
                user:
                  id: ybndrfg8ejkmcpqxot1uwisza3
                  display_name: Teacher One
                  username: teacher.one
                email: teacher.one@example.edu
                roles_here:
                  - role_id: nybc6xhg593upqice3sdeyro5k
                    display_name: Department Lead
                roles_here_more: 0
              - id: dfa1x1n7mkthyoziwxnupsmyia
                created_at: '2026-07-21T09:00:00Z'
                updated_at: '2026-07-21T09:00:00Z'
                academic_unit_id: 889766ufjgio6kbpzjbufozksq
                user_id: f6tcxyfofj3n3buuqfjaw9j1jn
                start_at: '2026-08-15T00:00:00Z'
                user:
                  id: f6tcxyfofj3n3buuqfjaw9j1jn
                  display_name: Staff Two
                  username: staff.two
                email: staff.two@example.edu
                roles_here: []
                roles_here_more: 0
            next_cursor: eyJhZnRlciI6ImRmYTF4MW43bWt0aHlveml3eG51cHNteWlhIn0
            total: 14
            total_is_lower_bound: false
  schemas:
    AcademicUnitMemberListResponse:
      description: One page of memberships in the requested order. Only the first page carries `total`.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The memberships on this page.
          items:
            $ref: '#/components/schemas/AcademicUnitMemberListItemResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many memberships match the instant or history filter across all pages. Present only on the first
            page. Counting stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when counting stopped at 10,000 and there may be more. Present with `total`.
    AcademicUnitMemberListItemResponse:
      type: object
      additionalProperties: false
      description: >-
        One membership and who the member is. `roles_here` and `roles_here_more` are present only if you hold
        role_binding.view on this Academic Unit.
      required:
        - id
        - created_at
        - updated_at
        - academic_unit_id
        - user_id
        - start_at
        - user
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of the membership.
        created_at:
          type: string
          format: date-time
          description: When the membership was created.
        updated_at:
          type: string
          format: date-time
          description: When the membership last changed, for example when it was ended.
        archived_at:
          type: string
          format: date-time
          description: When the membership was archived. An archived membership is never in effect. Omitted unless archived.
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit the User is a member of.
        user_id:
          $ref: '#/components/schemas/ID'
          description: The member.
        start_at:
          type: string
          format: date-time
          description: When the membership takes effect.
        end_at:
          type: string
          format: date-time
          description: >-
            When the membership stops being in effect. The membership is no longer in effect at this instant.
            Omitted while it has no end.
        user:
          $ref: '#/components/schemas/PersonRef'
          description: Who the member is. Username and profile picture follow directory visibility.
        email:
          type: string
          format: email
          maxLength: 254
          description: The member's email address. Present only with Institution-wide user.view.
        roles_here:
          type: array
          maxItems: 5
          description: Up to five of the member's current Role Bindings scoped exactly to this Academic Unit, oldest first.
          items:
            $ref: '#/components/schemas/AcademicUnitMemberRole'
        roles_here_more:
          type: integer
          minimum: 0
          description: >-
            How many more current Role Bindings the member holds on this Academic Unit beyond the five listed.
            Present with `roles_here`.
    AcademicUnitMemberRole:
      type: object
      additionalProperties: false
      description: One Role the member holds through a Role Binding scoped to this Academic Unit.
      required:
        - role_id
        - display_name
      properties:
        role_id:
          $ref: '#/components/schemas/ID'
          description: The ID of the Role.
        display_name:
          type: string
          description: The Role's display name.
    CreateAcademicUnitMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
          description: The existing User to add.
        start_at:
          type: string
          format: date-time
          description: When the membership starts. Omit it to start now.
