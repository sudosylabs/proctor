paths:
  /api/v1/affiliations/{affiliation_id}:
    parameters:
      - $ref: '#/components/parameters/AffiliationID'
    delete:
      operationId: endAffiliation
      summary: End an Affiliation while retaining history
      tags:
        - Membership and progression
      description: >-
        Ends one Affiliation that is in effect, after checking that you may manage the User. The User's other
        Affiliations stay in effect, and ending this one never revokes credentials or permissions.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/affiliations/14j8umgczgrdp95w77zuxmxfu9' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - affiliation.student_has_active_enrollment
        - affiliation.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/AffiliationEnded'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    AffiliationID:
      name: affiliation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of the Affiliation.
  responses:
    AffiliationEnded:
      description: The Affiliation, now ended.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffiliationResponse'
          example:
            id: 14j8umgczgrdp95w77zuxmxfu9
            created_at: '2026-08-01T00:00:00Z'
            updated_at: '2027-06-30T16:00:00Z'
            user_id: wj3drgzdpnf54rxf5d8qd3dqne
            kind: teacher
            start_at: '2026-08-01T00:00:00Z'
            end_at: '2027-06-30T16:00:00Z'
