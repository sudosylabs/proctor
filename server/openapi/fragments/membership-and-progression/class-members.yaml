paths:
  /api/v1/class-members/{class_member_id}:
    parameters:
      - $ref: '#/components/parameters/ClassMemberID'
    delete:
      operationId: endClassMember
      summary: End an enrollment while retaining history
      tags:
        - Membership and progression
      description: >-
        Ends one Class enrollment and keeps its Academic Period history. It does not delete the User, the Class, past
        participation or audit records, and it never enrolls the student in another Class.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/class-members/ih1r84kij94nrwis97rft6rduh' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.enrollment_conflict
        - mail.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/ClassMemberEnded'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    ClassMemberID:
      name: class_member_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The ID of the Class enrollment.
  responses:
    ClassMemberEnded:
      description: The enrollment, now ended.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassMemberResponse'
          example:
            id: ih1r84kij94nrwis97rft6rduh
            created_at: '2026-08-01T00:00:00Z'
            updated_at: '2026-11-02T08:15:00Z'
            class_id: sjebyge5cpbop1xwo4eds74ejb
            academic_period_id: p6y6sf8ac6m5if373fkkebj7j6
            user_id: 5ebqfbnezgahdbx9oy7rfr6oro
            start_at: '2026-09-01T00:00:00Z'
            end_at: '2026-11-02T08:15:00Z'
