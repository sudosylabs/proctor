paths:
  /api/v1/classes/{class_id}/members:
    parameters:
      - $ref: '#/components/parameters/ClassID'
    get:
      operationId: listClassMembers
      summary: List active or historical student enrollments for a Class
      tags:
        - Membership and progression
      description: >-
        Lists the student enrollments of one Class that you may see: either those in effect at one instant, or the
        full history. Each item describes the enrollment only. It never includes the student's credentials, answers
        or other profile data.

        Pages are ordered by `sort` and `dir`, by default by enrollment start (`enrolled`), oldest first, then by ID.
        The first page also reports `total`, the number of enrollments the filter matches across all pages. It is
        exact below 10,000; at 10,000 counting stops and `total_is_lower_bound` is true. A cursor keeps the first
        page's instant or history filter and its order, but every page reads current data, so enrollments added or
        changed between requests can change later pages.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Keeps students whose username, display name, first or last name contains this text, matched literally and
            ignoring case, as the User directory matches. Their email address is matched too only if you hold
            Institution-wide user.view. It also narrows `total`. A cursor doesn't remember it, so repeat it on every
            page.
          schema:
            type: string
        - name: active_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >-
            Return the enrollments in effect at this instant. Defaults to now. It cannot be combined with
            `history=true`. When following a cursor you may omit it, because the cursor keeps the first page's
            instant.
        - name: history
          in: query
          required: false
          description: >-
            When true, return the full enrollment history instead of only the enrollments in effect at one instant.
            It cannot be combined with `active_at`.
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          required: false
          description: >-
            The page order, each key followed by enrollment ID: `enrolled` (the enrollment start, the default) or
            `name` (the student's display name, or their username when there is none, compared case-insensitively on
            its first 64 characters). A cursor only continues the sort and direction that produced it, so repeat both
            when following it.
          schema:
            type: string
            enum:
              - enrolled
              - name
            default: enrolled
        - name: dir
          in: query
          required: false
          description: Ascending (`asc`, the default) or descending (`desc`) by the `sort` key.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/ClassMemberListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: enrollClassMember
      summary: Enroll, transfer, or progress a student transactionally
      tags:
        - Membership and progression
      description: >-
        Enrolls an existing User in the Class in the path. If the student already has an enrollment in effect in
        another Class of the same Academic Period, and a transfer or progression is allowed, that enrollment is ended
        in the same step. Every earlier enrollment keeps its dates.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class_member.invalid
        - class_member.student_affiliation_required
        - class.enrollment_conflict
        - mail.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/EnrollClassMember'
      responses:
        "201":
          $ref: '#/components/responses/ClassMemberEnrolled'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EnrollClassMember:
      description: The existing User to enroll and, optionally, when the enrollment starts and ends.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnrollClassMemberRequest'
          example:
            user_id: ybndrfg8ejkmcpqxot1uwisza3
            start_at: '2026-08-01T00:00:00Z'
  responses:
    ClassMemberListOK:
      description: One page of the Class's enrollments.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassMemberListResponse'
          example:
            items:
              - id: ih1r84kij94nrwis97rft6rduh
                created_at: '2026-07-28T10:00:00Z'
                updated_at: '2026-07-28T10:00:00Z'
                class_id: sjebyge5cpbop1xwo4eds74ejb
                academic_period_id: p6y6sf8ac6m5if373fkkebj7j6
                user_id: 5ebqfbnezgahdbx9oy7rfr6oro
                start_at: '2026-09-01T00:00:00Z'
                user:
                  id: 5ebqfbnezgahdbx9oy7rfr6oro
                  display_name: Amara Okafor
                  username: aokafor
                email: amara.okafor@example.edu
              - id: xpq79ar61ncrjiouey6d9tgp91
                created_at: '2026-07-28T10:00:02Z'
                updated_at: '2026-07-28T10:00:02Z'
                class_id: sjebyge5cpbop1xwo4eds74ejb
                academic_period_id: p6y6sf8ac6m5if373fkkebj7j6
                user_id: 17778cuf6b17rhtapprfjozet8
                start_at: '2026-09-01T00:00:00Z'
                end_at: '2027-01-11T00:00:00Z'
                user:
                  id: 17778cuf6b17rhtapprfjozet8
                  display_name: Tomas Lindqvist
                  username: tlindqvist
                email: tomas.lindqvist@example.edu
                transfer:
                  to_class:
                    id: 8kpous3h9nfemqtwz47ydgjcx1
                    display_name: Year 1, Group B
                  at: '2027-01-11T00:00:00Z'
            next_cursor: eyJhZnRlciI6InhwcTc5YXI2MW5jcmppb3VleTZkOXRncDkxIn0
            total: 28
            total_is_lower_bound: false
    ClassMemberEnrolled:
      description: The new enrollment and, for a transfer, the enrollment it ended.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassEnrollmentResponse'
          example:
            membership:
              id: zq993bky9h3uj4saw8iywi38cy
              created_at: '2027-01-10T08:00:00Z'
              updated_at: '2027-01-10T08:00:00Z'
              class_id: 1ozr3arz5tdtgd1jxt5wcz5b3p
              academic_period_id: p6y6sf8ac6m5if373fkkebj7j6
              user_id: 5ebqfbnezgahdbx9oy7rfr6oro
              start_at: '2027-01-10T08:00:00Z'
            previous:
              id: ih1r84kij94nrwis97rft6rduh
              created_at: '2026-07-28T10:00:00Z'
              updated_at: '2027-01-10T08:00:00Z'
              class_id: sjebyge5cpbop1xwo4eds74ejb
              academic_period_id: p6y6sf8ac6m5if373fkkebj7j6
              user_id: 5ebqfbnezgahdbx9oy7rfr6oro
              start_at: '2026-09-01T00:00:00Z'
              end_at: '2027-01-10T08:00:00Z'
  schemas:
    ClassMemberListResponse:
      description: One page of enrollments in the requested order. Only the first page carries `total`.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The enrollments on this page.
          items:
            $ref: '#/components/schemas/ClassMemberListItemResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many enrollments match the instant or history filter across all pages. Present only on the first
            page. Counting stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when counting stopped at 10,000 and there may be more. Present with `total`.
    ClassMemberListItemResponse:
      description: >-
        One enrollment, who the student is, and, when its end moves the student to another Class, that transfer. A
        disabled account's enrollment is listed only to a caller with Institution-wide user.view, with `disabled_at`.
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - class_id
        - academic_period_id
        - user_id
        - start_at
        - user
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of the enrollment.
        created_at:
          type: string
          format: date-time
          description: When the enrollment was created.
        updated_at:
          type: string
          format: date-time
          description: When the enrollment last changed, for example when it was ended.
        archived_at:
          type: string
          format: date-time
          description: When the enrollment was archived. Omitted unless archived.
        class_id:
          $ref: '#/components/schemas/ID'
          description: The Class the student is enrolled in.
        academic_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period of the Class, which the enrollment belongs to.
        user_id:
          $ref: '#/components/schemas/ID'
          description: The enrolled student.
        start_at:
          type: string
          format: date-time
          description: When the enrollment takes effect.
        end_at:
          type: string
          format: date-time
          description: When the enrollment stops being in effect. Omitted while it has no end.
        user:
          $ref: '#/components/schemas/PersonRef'
          description: The enrolled student. Directory visibility controls the username and profile picture.
        email:
          type: string
          format: email
          description: The student email, present with Institution-wide user.view.
        disabled_at:
          type: string
          format: date-time
          description: >-
            When the student's account was disabled. Present only while it is disabled, and only with
            Institution-wide user.view; without it, students whose account is disabled aren't listed, and `total`
            doesn't count them.
        transfer:
          $ref: '#/components/schemas/ClassMemberTransfer'
    ClassMemberTransfer:
      description: >-
        The transfer that ends this enrollment: the student's enrollment in another Class starts exactly when this one
        ends. Omitted when the end is not a transfer.
      type: object
      additionalProperties: false
      required:
        - to_class
        - at
      properties:
        to_class:
          $ref: '#/components/schemas/ClassRef'
          description: The Class the student moves to, when visible to the reader.
        at:
          type: string
          format: date-time
          description: When the student moves, which is this enrollment's `end_at`.
    ClassEnrollmentResponse:
      type: object
      additionalProperties: false
      required:
        - membership
      properties:
        membership:
          $ref: '#/components/schemas/ClassMemberResponse'
          description: The new enrollment.
        previous:
          $ref: '#/components/schemas/ClassMemberResponse'
          description: >-
            The student's earlier enrollment in the same Academic Period that this request ended, for a transfer or
            progression. Omitted when there was none.
    EnrollClassMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
          description: The existing User to enroll.
        start_at:
          type: string
          format: date-time
          description: When the enrollment starts. Omit it to start now.
        end_at:
          type: string
          format: date-time
          description: When the enrollment ends; it must be after the start. Omit it for no end.
