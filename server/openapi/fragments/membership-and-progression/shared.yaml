  schemas:
    AffiliationKind:
      type: string
      description: >-
        The kind of relationship a User has with the Institution. A User can hold several kinds at once, and an
        Affiliation grants no permissions by itself.
      enum:
        - student
        - teacher
        - staff
        - external
    AffiliationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - user_id
        - kind
        - start_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of the Affiliation.
        created_at:
          type: string
          format: date-time
          description: When the Affiliation was created.
        updated_at:
          type: string
          format: date-time
          description: When the Affiliation last changed, for example when it was ended.
        archived_at:
          type: string
          format: date-time
          description: When the Affiliation was archived. An archived Affiliation is never in effect. Omitted unless archived.
        user_id:
          $ref: '#/components/schemas/ID'
          description: The User who holds the Affiliation.
        kind:
          $ref: '#/components/schemas/AffiliationKind'
          description: The kind of relationship this Affiliation records.
        start_at:
          type: string
          format: date-time
          description: When the Affiliation takes effect. When the request gave no start, this is the time it was created.
        end_at:
          type: string
          format: date-time
          description: >-
            When the Affiliation stops being in effect. The Affiliation is no longer in effect at this instant.
            Omitted while it has no end.
    AcademicUnitMemberResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - academic_unit_id
        - user_id
        - start_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of the membership.
        created_at:
          type: string
          format: date-time
          description: When the membership was created.
        updated_at:
          type: string
          format: date-time
          description: When the membership last changed, for example when it was ended.
        archived_at:
          type: string
          format: date-time
          description: When the membership was archived. An archived membership is never in effect. Omitted unless archived.
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit the User is a member of.
        user_id:
          $ref: '#/components/schemas/ID'
          description: The member.
        start_at:
          type: string
          format: date-time
          description: When the membership takes effect. When the request gave no start, this is the time it was created.
        end_at:
          type: string
          format: date-time
          description: >-
            When the membership stops being in effect. The membership is no longer in effect at this instant.
            Omitted while it has no end.
    ClassMemberResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - class_id
        - academic_period_id
        - user_id
        - start_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The ID of the enrollment.
        created_at:
          type: string
          format: date-time
          description: When the enrollment was created.
        updated_at:
          type: string
          format: date-time
          description: When the enrollment last changed, for example when it was ended.
        archived_at:
          type: string
          format: date-time
          description: When the enrollment was archived. An archived enrollment is never in effect. Omitted unless archived.
        class_id:
          $ref: '#/components/schemas/ID'
          description: The Class the student is enrolled in.
        academic_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period of the Class, which the enrollment belongs to.
        user_id:
          $ref: '#/components/schemas/ID'
          description: The enrolled student.
        start_at:
          type: string
          format: date-time
          description: When the enrollment takes effect. When the request gave no start, this is the time it was created.
        end_at:
          type: string
          format: date-time
          description: >-
            When the enrollment stops being in effect. The enrollment is no longer in effect at this instant.
            Omitted while it has no end.
