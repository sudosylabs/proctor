paths:
  /api/v1/student-progressions/{student_progression_id}/commit:
    parameters:
      - $ref: '#/components/parameters/StudentProgressionID'
    post:
      operationId: commitStudentProgression
      summary: Commit one exact student progression preview
      description: >-
        Applies the dry-run preview you reviewed, but only if its revision and digest still match the current source
        Class, destination Class and students. For every affected student, enrollments are ended and created together
        in one step, and earlier enrollments keep their history. The work runs in the background; poll the
        progression to follow it.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      tags:
        - Membership and progression
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.conflict
        - student_progression.unavailable
        - administration.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - authentication.mfa.unavailable
        - invitation.unavailable
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CommitStudentProgression'
      responses:
        "202":
          $ref: '#/components/responses/StudentProgressionAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CommitStudentProgression:
      description: The revision and digest of the preview you reviewed.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentProgressionCommitRequest'
          example:
            expected_revision: 3
            preview_digest: f64551fcd6f07823cb87971cfb91446425da18286b3ab1ef935e0cbd7a69f68a
  schemas:
    StudentProgressionCommitRequest:
      description: >-
        The revision and SHA-256 digest of the dry-run preview you reviewed. The commit is refused if the preview has
        changed since.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - preview_digest
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: The progression's `revision` when you reviewed it.
        preview_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: The progression's `preview_digest`, a SHA-256 digest in lowercase hexadecimal.
