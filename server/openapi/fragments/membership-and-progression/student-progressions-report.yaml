paths:
  /api/v1/student-progressions/{student_progression_id}/report:
    parameters:
      - $ref: '#/components/parameters/StudentProgressionID'
    get:
      operationId: downloadStudentProgressionReport
      summary: Download the authorized formula-safe student progression report
      description: >-
        Downloads the report for one progression preview or result as CSV. Values a spreadsheet would run as
        formulas are neutralized, so they show as plain text. The report holds the progression's rows and no
        internal Job data, credentials or database selectors.
      x-proctor-auth: principal_required
      tags:
        - Membership and progression
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.unavailable
        - student_progression.conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/StudentProgressionReport'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    StudentProgressionReport:
      description: The progression report as CSV, with formulas neutralized. It shows no recipient addresses.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        text/csv:
          schema:
            type: string
            format: binary
