paths:
  /api/v1/student-progressions:
    get:
      operationId: listStudentProgressions
      summary: List student progressions within the caller's progression authority
      tags:
        - Membership and progression
      description: >-
        Lists the student progressions that have not expired and that you could read one by one, newest first.
        Reading a progression needs progression authority over both its source and its destination Class, so a
        progression appears only when your current Institution, Academic Unit or Class progression authority covers
        both. Items are summaries without rows, each naming its source and destination Classes. Read one progression
        to see its preview or result rows.

        The first page, read without a cursor, also reports `total`: the number of progressions the filters and your
        authority match across all pages. It is exact below 10,000; at 10,000 counting stops and
        `total_is_lower_bound` is true. Later pages carry no total, so keep the first page's.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.unavailable
        - invitation.unavailable
        - student_progression.conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: Return only progressions in these lifecycle states. Repeat the parameter to select several; omit it for all.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items:
              type: string
              enum:
                - uploading
                - parsing
                - preview_ready
                - executing
                - completed
                - completed_with_errors
                - canceled
                - failed
        - name: source_period_id
          in: query
          required: false
          description: Return only progressions from this exact source Academic Period.
          schema:
            $ref: '#/components/schemas/ID'
        - name: source_class_id
          in: query
          required: false
          description: Return only progressions from this exact source Class.
          schema:
            $ref: '#/components/schemas/ID'
        - name: destination_period_id
          in: query
          required: false
          description: Return only progressions into this exact destination Academic Period.
          schema:
            $ref: '#/components/schemas/ID'
        - name: destination_class_id
          in: query
          required: false
          description: Return only progressions into this exact destination Class.
          schema:
            $ref: '#/components/schemas/ID'
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` from the previous page, passed back unchanged.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: The most student progressions to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      x-codeSamples:
        - lang: Shell
          label: List progressions into one Class awaiting review
          source: |-
            curl --header "Authorization: Bearer $PROCTOR_TOKEN" \
              "https://proctor.example.edu/api/v1/student-progressions?destination_class_id=ybndrfg8ejkmcpqxot1uwisza6&state=preview_ready"
      responses:
        "200":
          $ref: '#/components/responses/StudentProgressionListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: dryRunStudentProgression
      summary: Create an asynchronous dry-run for one exact student progression
      tags:
        - Membership and progression
      description: >-
        Starts a background Job that checks the source and destination Classes and Academic Periods without changing
        any enrollment. When it finishes, the progression holds a preview of each student's outcome and a digest of
        that preview. Review the preview, then commit it.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.target_conflict
        - student_progression.lineage_conflict
        - student_progression.effective_date_conflict
        - student_progression.conflict
        - student_progression.unavailable
        - administration.unavailable
        - authentication.mfa.unavailable
        - invitation.unavailable
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/DryRunStudentProgression'
      responses:
        "202":
          $ref: '#/components/responses/StudentProgressionAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/student-progressions/{student_progression_id}:
    parameters:
      - $ref: '#/components/parameters/StudentProgressionID'
    get:
      operationId: getStudentProgression
      summary: Get one authorized student progression preview or result
      tags:
        - Membership and progression
      description: >-
        Returns the preview or final result of one progression you may read. It contains no credentials, student
        answers or internal worker diagnostics.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.unavailable
        - invitation.unavailable
        - onboarding_import.unavailable
        - student_progression.conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/StudentProgressionOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    StudentProgressionListOK:
      description: One page of the student progressions you may read.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentProgressionListResponse'
          example:
            items:
              - id: 1asb7sk89dp1ex339fkh3te5t4
                mode: student_progression
                state: completed
                scope_type: class
                scope_id: 6xoche483hwrx5rpu8jzjoe7qg
                source_period_id: p6y6sf8ac6m5if373fkkebj7j6
                source_class_id: sjebyge5cpbop1xwo4eds74ejb
                destination_period_id: hmyjmj68dw6gdxctnghbrhwcth
                destination_class_id: 6xoche483hwrx5rpu8jzjoe7qg
                source_class_name: Year 10 Chemistry A
                destination_class_name: Year 11 Chemistry A
                effective_at: '2027-08-01T00:00:00Z'
                preview_digest: f64551fcd6f07823cb87971cfb91446425da18286b3ab1ef935e0cbd7a69f68a
                total_rows: 3
                valid_rows: 2
                invalid_rows: 1
                succeeded_rows: 2
                no_op_rows: 0
                failed_rows: 0
                skipped_rows: 1
                parse_job_id: saqjfmjqqy9mo1yj4zwed73333
                execution_job_id: 33py5k58f3z7keydj3fzkjs1kk
                created_at: '2027-06-20T09:00:00Z'
                updated_at: '2027-06-20T09:12:40Z'
                expires_at: '2027-06-27T09:00:00Z'
                revision: 4
            total: 1
            total_is_lower_bound: false
  requestBodies:
    DryRunStudentProgression:
      description: >-
        The source and destination Class and Academic Period, and the instant the change takes effect. The dry-run
        checks them without changing anything.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentProgressionDryRunRequest'
          example:
            source_period_id: ybndrfg8ejkmcpqxot1uwisza3
            source_class_id: ybndrfg8ejkmcpqxot1uwisza4
            destination_period_id: ybndrfg8ejkmcpqxot1uwisza5
            destination_class_id: ybndrfg8ejkmcpqxot1uwisza6
            effective_at: "2027-08-01T00:00:00Z"
  schemas:
    StudentProgressionListResponse:
      description: Student progression summaries, newest first, without rows.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          description: The progressions on this page.
          items:
            $ref: '#/components/schemas/OnboardingImportResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many student progressions match the filters and your authority across all pages. Present only on the
            first page. Counting stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when counting stopped at 10,000 and there may be more. Present with `total`.
    StudentProgressionDryRunRequest:
      description: The source, destination and effective instant to preview.
      type: object
      additionalProperties: false
      required:
        - source_period_id
        - source_class_id
        - destination_period_id
        - destination_class_id
        - effective_at
      properties:
        source_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period of the source Class.
        source_class_id:
          $ref: '#/components/schemas/ID'
          description: The Class whose students move.
        destination_period_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Period of the destination Class.
        destination_class_id:
          $ref: '#/components/schemas/ID'
          description: The Class the students move into. It must be a different Class from the source.
        effective_at:
          type: string
          format: date-time
          description: >-
            When the students start in the destination Class. It must fall within the destination Academic Period.
            When both Classes are in the same Academic Period, each student is transferred; otherwise each is
            enrolled in the destination Class.
