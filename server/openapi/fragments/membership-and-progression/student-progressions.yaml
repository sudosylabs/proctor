paths:
  /api/v1/student-progressions:
    get:
      operationId: listStudentProgressions
      summary: List student progressions within the caller's progression authority
      tags:
        - Membership and progression
      description: >-
        Lists the unexpired student progressions the caller could read one by one, newest first. A single read requires progression authority on both the source and the destination Class, so a progression appears only when the caller's current Institution, Academic Unit, or Class progression authority covers both. Items are summary projections without rows, each naming its source and destination Classes; read one progression for its preview or result rows.
        The first page, read without a cursor, also reports `total`: the progressions the filters and the caller's authority match across every page, exact below 10,000 and reported as 10,000 with `total_is_lower_bound` at that bound. Later pages carry no total; keep the first page's.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.unavailable
        - invitation.unavailable
        - student_progression.conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: Return only progressions in these lifecycle states. Repeat the parameter to select several; omit it for all.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items:
              type: string
              enum:
                - uploading
                - parsing
                - preview_ready
                - executing
                - completed
                - completed_with_errors
                - canceled
                - failed
        - name: source_period_id
          in: query
          required: false
          description: Return only progressions from this exact source Academic Period.
          schema:
            $ref: '#/components/schemas/ID'
        - name: source_class_id
          in: query
          required: false
          description: Return only progressions from this exact source Class.
          schema:
            $ref: '#/components/schemas/ID'
        - name: destination_period_id
          in: query
          required: false
          description: Return only progressions into this exact destination Academic Period.
          schema:
            $ref: '#/components/schemas/ID'
        - name: destination_class_id
          in: query
          required: false
          description: Return only progressions into this exact destination Class.
          schema:
            $ref: '#/components/schemas/ID'
        - name: cursor
          in: query
          required: false
          description: Continue from the opaque cursor returned by the preceding page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Maximum number of student progressions to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      x-codeSamples:
        - lang: Shell
          label: List progressions into one Class awaiting review
          source: |-
            curl --header "Authorization: Bearer $PROCTOR_TOKEN" \
              "https://proctor.example.edu/api/v1/student-progressions?destination_class_id=ybndrfg8ejkmcpqxot1uwisza6&state=preview_ready"
      responses:
        "200":
          $ref: '#/components/responses/StudentProgressionListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: dryRunStudentProgression
      summary: Create an asynchronous dry-run for one exact student progression
      tags:
        - Membership and progression
      description: >-
        Creates a durable Job that validates the exact source and destination Classes and Academic Periods without changing enrollment. Its immutable preview and digest expose bounded row outcomes for review before commit.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.target_conflict
        - student_progression.lineage_conflict
        - student_progression.effective_date_conflict
        - student_progression.conflict
        - student_progression.unavailable
        - administration.unavailable
        - authentication.mfa.unavailable
        - invitation.unavailable
        - onboarding_import.file_invalid
        - onboarding_import.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/DryRunStudentProgression'
      responses:
        "202":
          $ref: '#/components/responses/StudentProgressionAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/student-progressions/{student_progression_id}:
    parameters:
      - $ref: '#/components/parameters/StudentProgressionID'
    get:
      operationId: getStudentProgression
      summary: Get one authorized student progression preview or result
      tags:
        - Membership and progression
      description: >-
        Returns the authorized immutable preview or terminal result for one progression Job. The projection is bounded and contains no credentials, student answers, or unsafe worker diagnostics.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.unavailable
        - invitation.unavailable
        - onboarding_import.unavailable
        - student_progression.conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/StudentProgressionOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    StudentProgressionListOK:
      description: Bounded authorized student progression page
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentProgressionListResponse'
          example:
            items: []
            total: 0
            total_is_lower_bound: false
  requestBodies:
    DryRunStudentProgression:
      description: Exact source and destination academic structure plus the future effective instant to validate without mutation.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentProgressionDryRunRequest'
          example:
            source_period_id: ybndrfg8ejkmcpqxot1uwisza3
            source_class_id: ybndrfg8ejkmcpqxot1uwisza4
            destination_period_id: ybndrfg8ejkmcpqxot1uwisza5
            destination_class_id: ybndrfg8ejkmcpqxot1uwisza6
            effective_at: "2027-08-01T00:00:00Z"
  schemas:
    StudentProgressionListResponse:
      description: Student progression summaries newest first, without rows.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OnboardingImportResponse'
        next_cursor:
          type: string
          description: Opaque continuation for the next page, omitted after the final page.
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Student progressions matching the filters and the caller's authority across every page, present only on the
            first page. At 10,000 counting stops and `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached the 10,000 bound and there may be more. Present with `total`.
    StudentProgressionDryRunRequest:
      description: Exact source, destination, and effective instant for an immutable progression preview.
      type: object
      additionalProperties: false
      required:
        - source_period_id
        - source_class_id
        - destination_period_id
        - destination_class_id
        - effective_at
      properties:
        source_period_id:
          $ref: '#/components/schemas/ID'
        source_class_id:
          $ref: '#/components/schemas/ID'
        destination_period_id:
          $ref: '#/components/schemas/ID'
        destination_class_id:
          $ref: '#/components/schemas/ID'
        effective_at:
          type: string
          format: date-time
