paths:
  /api/v1/users/{user_id}/affiliations:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listAffiliations
      summary: List a User's effective-dated Affiliations
      tags:
        - Membership and progression
      description: >-
        Lists the current and past Affiliations of one User that you may see. A User can hold several Affiliations
        at once. Affiliations describe the person and are never used in place of Role Bindings to check
        permissions.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AffiliationListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAffiliation
      summary: Create a non-exclusive effective-dated Affiliation
      tags:
        - Membership and progression
      description: >-
        Adds one student, teacher, staff or external Affiliation to an existing User, with optional start and end
        times. Other kinds of Affiliation can exist at the same time, and adding one grants no permissions or
        credentials.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - affiliation.invalid
        - affiliation.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAffiliation'
      responses:
        "201":
          $ref: '#/components/responses/AffiliationCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateAffiliation:
      description: The kind of Affiliation for the User in the path and, optionally, when it starts and ends.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAffiliationRequest'
          example:
            kind: teacher
            start_at: '2026-08-01T00:00:00Z'
  responses:
    AffiliationCreated:
      description: The new Affiliation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffiliationResponse'
          example:
            id: 14j8umgczgrdp95w77zuxmxfu9
            created_at: '2026-07-15T11:20:00Z'
            updated_at: '2026-07-15T11:20:00Z'
            user_id: wj3drgzdpnf54rxf5d8qd3dqne
            kind: teacher
            start_at: '2026-08-01T00:00:00Z'
    AffiliationListOK:
      description: One page of the User's Affiliations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffiliationListResponse'
          example:
            items:
              - id: 4z3cy1rp9cucq7qo1g9mq94dj3
                created_at: '2023-09-01T08:00:00Z'
                updated_at: '2026-07-01T00:00:00Z'
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                kind: student
                start_at: '2023-09-01T08:00:00Z'
                end_at: '2026-07-01T00:00:00Z'
              - id: 14j8umgczgrdp95w77zuxmxfu9
                created_at: '2026-07-15T11:20:00Z'
                updated_at: '2026-07-15T11:20:00Z'
                user_id: wj3drgzdpnf54rxf5d8qd3dqne
                kind: teacher
                start_at: '2026-08-01T00:00:00Z'
  schemas:
    AffiliationListResponse:
      description: One page of Affiliations, in a fixed order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The Affiliations on this page.
          items:
            $ref: '#/components/schemas/AffiliationResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CreateAffiliationRequest:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/AffiliationKind'
          description: The kind of Affiliation to add.
        start_at:
          type: string
          format: date-time
          description: When the Affiliation starts. Omit it to start now.
        end_at:
          type: string
          format: date-time
          description: When the Affiliation ends; it must be after the start. Omit it for no end.
