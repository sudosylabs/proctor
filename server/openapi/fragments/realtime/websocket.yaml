paths:
  /api/v1/websocket:
    get:
      operationId: connectWebSocket
      summary: Upgrade to the WebSocket protocol
      tags:
        - Realtime
      description: >-
        Opens a Proctor WebSocket connection for a signed-in Session. The first `hello` message gives the connection's ID and its starting sequence number, which goes up with every message. To reconnect, send the old `connection_id` and the last `sequence_number` you processed. If the same server node still has the missed messages, it sends them again. Otherwise it sends `resync_required`, and the client should reload its state.
      x-codeSamples:
        - lang: Shell
          source: |-
            websocat \
              --header='Authorization: Bearer <interactive-session-access-token>' \
              'wss://proctor.example.edu/api/v1/websocket?connection_id=rpn96r4g3jfk3t41u4dus44bzc&sequence_number=42'
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - request.invalid
        - websocket.origin.invalid
        - websocket.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: connection_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ID'
          description: The ID of an earlier connection to resume. Send it with `sequence_number`.
        - name: sequence_number
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
          description: >-
            The last sequence number you processed on that connection. Zero is allowed. Send it with `connection_id`.
      responses:
        "101":
          description: Switching Protocols
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
