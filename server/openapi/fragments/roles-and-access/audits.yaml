paths:
  /api/v1/audits:
    get:
      operationId: listAuditEvents
      summary: List authorized institution or Academic Unit audit history
      tags:
        - Roles and access
      description: >-
        Lists the audit Events you can see through Institution-wide or Academic Unit audit permissions, newest first unless `order=asc` asks for oldest first. Events never include the raw request parameters, earlier state, results, credentials, protected content or internal error details.
        The first page (read without a cursor) also has `total`, the number of matching Events across all pages. It is exact up to 10,000. Above that it shows 10,000 and `total_is_lower_bound` is true. Later pages have no total, so keep the one from the first page.
        Each Event also has a `summary` sentence, written from its codes, in the language `Accept-Language` picks. It falls back to the installation language and then English. It names the actor, the User the Event is about, and a User, Academic Unit or Class resource by their current names only if you could see that record now, through `user.view` or `class.members.view`, `academic_unit.view` or `class.view`. Otherwise it uses a general phrase such as "a user" or "a class". For an Academic Unit auditor the summary names only the action, never the recorded operation or the User the Event is about.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.query.invalid
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of audit Events to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: The `next_cursor` from the previous page, sent back unchanged with the same filters.
        - name: actor_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Events where this User performed the action.
        - name: subject_user_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Events about this User, such as a change to their account.
        - name: action
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 32
            items:
              $ref: '#/components/schemas/AuditAction'
          description: >-
            Return only Events with one of these actions. Repeat the parameter for up to 32 actions. An Academic
            Unit auditor still sees only the academic actions they are allowed to, so any other action matches
            nothing.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - attempt
              - success
              - fail
          description: >-
            Return only Events with this outcome: `attempt` (no outcome recorded yet), `success` or `fail`.
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - change
              - read
          description: >-
            Return only Events whose action changes something (`change`: a mutation, a sign-in or other
            authentication, a credential issued or revoked, mail sent) or only looks (`read`: a view, a search, a
            list, or an export). Every audit action is one of the two. It only narrows `action` and what you can
            see, so an Academic Unit auditor still sees only their own academic actions.
        - name: resource_type
          in: query
          schema:
            $ref: '#/components/schemas/ResourceType'
          description: Return only Events about resources of this type. Send it together with `resource_id`.
        - name: resource_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Events about the resource with this ID. Send it together with `resource_type`.
        - name: created_after
          in: query
          required: false
          description: Return only Events recorded at or after this RFC 3339 time.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Return only Events recorded before this RFC 3339 time. It must be later than `created_after`.
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          required: false
          description: >-
            Read newest first (`desc`, the default) or oldest first (`asc`). A cursor works only with the order
            that produced it.
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
      responses:
        "200":
          $ref: '#/components/responses/AuditListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    AuditListOK:
      description: Audit Event collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditListResponse'
          example:
            items:
              - id: ybndrfg8ejkmcpqxot1uwisza3
                created_at: '2026-08-01T09:30:00Z'
                updated_at: '2026-08-01T09:30:00Z'
                actor_id: ybndrfg8ejkmcpqxot1uwisza4
                actor:
                  id: ybndrfg8ejkmcpqxot1uwisza4
                  display_name: Ada Admin
                action: class.members.manage
                resource:
                  type: class
                  id: ybndrfg8ejkmcpqxot1uwisza5
                scope_type: academic_unit
                scope_id: ybndrfg8ejkmcpqxot1uwisza6
                status: success
                summary: Ada Admin enrolled a user in Year 1 Mathematics A
            total: 1
            total_is_lower_bound: false
  schemas:
    AuditEventResponse:
      description: One audit record you can see, without sensitive detail.
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - action
        - resource
        - status
        - summary
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: Time the Event was recorded.
        updated_at:
          type: string
          format: date-time
          description: Time the Event's outcome was last updated.
        actor_id:
          type: string
          description: The User who performed the action. Omitted for actions the system took on its own.
        actor:
          $ref: '#/components/schemas/PersonRef'
          description: >-
            The User who performed the action, named for every reader of the Event. Omitted with `actor_id`.
        session_id:
          type: string
          description: >-
            The Session the action was made in, when recorded. It is an ID, never a credential. Omitted for
            Academic Unit auditors.
        action:
          type: string
          anyOf:
            - $ref: '#/components/schemas/AuditAction'
            - type: string
          description: The action that was attempted, named like a permission, such as `class.members.manage`.
        resource:
          type: object
          additionalProperties: false
          description: The record the action was about.
          required:
            - type
            - id
          properties:
            type:
              type: string
              anyOf:
                - $ref: '#/components/schemas/ResourceType'
                - type: string
              description: Type of the record.
            id:
              $ref: '#/components/schemas/ID'
              description: ID of the record.
        scope_type:
          type: string
          description: Kind of scope the permission check used, when the action belongs to a scope.
        scope_id:
          type: string
          description: The scope the permission check used, when the action belongs to a scope.
        status:
          type: string
          description: Outcome of the action, `attempt` (not recorded yet), `success` or `fail`.
        request_id:
          type: string
          description: >-
            ID of the request that caused the action, when it came in over HTTP or WebSocket. Omitted for Academic
            Unit auditors.
        node_id:
          type: string
          description: The server node that handled the action. Omitted for Academic Unit auditors.
        client_type:
          type: string
          description: Kind of client the actor used, such as `web` or `desktop`. Omitted for Academic Unit auditors.
        authentication_method:
          type: string
          description: How the actor signed in, such as `password`. Omitted for Academic Unit auditors.
        ip_address:
          type: string
          description: The client's IP address, when recorded. Omitted for Academic Unit auditors.
        user_agent:
          type: string
          description: The client's User-Agent header, up to 512 characters. Omitted for Academic Unit auditors.
        error_code:
          type: string
          description: Error code of a failed action. Internal error details are never included.
        summary:
          type: string
          maxLength: 2048
          description: >-
            One sentence describing the Event in the request's language, for display only. Programs should read
            the Event's codes instead. People and records appear by name only if you could see them now, and an
            unfinished or failed Event says so.
        reason:
          type: string
          maxLength: 500
          description: >-
            Reason given when an account was disabled. Present only on that Event, only when a reason was given,
            and only for Institution-wide audit readers.
    AuditListResponse:
      description: One page of audit Events you can see.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The Events on this page.
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        next_cursor:
          type: string
          description: Token for the next page. Send it back unchanged as `cursor`. Omitted on the last page.
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Number of Events that match the filters and that you can see, across all pages. Sent on the first
            page only. Counting stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached 10,000 and there may be more. Sent with `total`.
