paths:
  /api/v1/audits:
    get:
      operationId: listAuditEvents
      summary: List authorized institution or Academic Unit audit history
      tags:
        - Roles and access
      description: >-
        Lists bounded durable audit facts visible through the caller's Institution or Academic Unit authority, newest first unless `order=asc` asks for oldest first. The projection omits raw parameters, prior state, result payloads, credentials, protected content, and unsafe internal failures.
        The first page, read without a cursor, also reports `total`: the audit Events the filters and the caller's visibility match across every page, exact below 10,000 and reported as 10,000 with `total_is_lower_bound` at that bound. Later pages carry no total; keep the first page's.
        Each Event also carries a `summary` sentence in the language `Accept-Language` selects, falling back to the installation language and then English, beside the stable codes it is written from. It names the actor, the User the Event is about, and a User, Academic Unit, or Class resource by their current names only when the caller could see that record now through `user.view` or `class.members.view`, `academic_unit.view`, or `class.view`; otherwise it uses a generic noun such as "a user" or "a class". An Academic Unit auditor's summary names the action alone, never the recorded operation or the User the Event is about.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.query.invalid
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of audit Events to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque continuation emitted by the preceding page for the same filters.
        - name: actor_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Events attributed to this actor User.
        - name: subject_user_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Events about this User, such as a change to their account.
        - name: action
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 32
            items:
              $ref: '#/components/schemas/AuditAction'
          description: >-
            Return only Events with one of these exact stable actions. Repeat the parameter for up to 32 actions.
            An Academic Unit auditor still reads only the academic actions its authority allows, so naming any other
            action matches nothing.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - attempt
              - success
              - fail
          description: >-
            Return only Events in this durable outcome state: an `attempt` whose outcome is not yet recorded, a
            `success`, or a `fail`.
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - change
              - read
          description: >-
            Return only Events whose action changes something (`change`: a mutation, a sign-in or other
            authentication, a credential issued or revoked, mail sent) or only looks (`read`: a view, a search, a
            list, or an export). Every audit action is one of the two. It narrows `action` and the caller's
            visibility rather than adding to them, so an Academic Unit auditor still reads only its own academic
            actions.
        - name: resource_type
          in: query
          schema:
            $ref: '#/components/schemas/ResourceType'
          description: Exact resource type to filter; resource_id is required when present.
        - name: resource_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Exact resource identity to filter; resource_type is required when present.
        - name: created_after
          in: query
          required: false
          description: Return only Events recorded at or after this RFC 3339 instant.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Return only Events recorded before this RFC 3339 instant; it must be later than `created_after`.
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          required: false
          description: >-
            Read newest first (`desc`, the default) or oldest first (`asc`). A cursor continues only the order
            that produced it.
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
      responses:
        "200":
          $ref: '#/components/responses/AuditListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    AuditListOK:
      description: Audit Event collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditListResponse'
          example:
            items:
              - id: ybndrfg8ejkmcpqxot1uwisza3
                created_at: '2026-08-01T09:30:00Z'
                updated_at: '2026-08-01T09:30:00Z'
                actor_id: ybndrfg8ejkmcpqxot1uwisza4
                action: class.members.manage
                resource:
                  type: class
                  id: ybndrfg8ejkmcpqxot1uwisza5
                scope_type: academic_unit
                scope_id: ybndrfg8ejkmcpqxot1uwisza6
                status: success
                summary: Ada Admin enrolled a user in Year 1 Mathematics A
            total: 1
            total_is_lower_bound: false
  schemas:
    AuditEventResponse:
      description: Safe durable audit fact visible to the authorized caller.
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - action
        - resource
        - status
        - summary
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: Time when the audit Attempt was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest durable audit status change.
        actor_id:
          type: string
          description: User that initiated the action, omitted for actor-less system transitions.
        session_id:
          type: string
          description: Safe Session identity associated with the action when retained; never a credential.
        action:
          type: string
          anyOf:
            - $ref: '#/components/schemas/AuditAction'
            - type: string
          description: Stable permission-style name of the attempted action.
        resource:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
              anyOf:
                - $ref: '#/components/schemas/ResourceType'
                - type: string
              description: Stable resource type acted upon.
            id:
              $ref: '#/components/schemas/ID'
        scope_type:
          type: string
          description: Authorization scope type under which the action was evaluated.
        scope_id:
          type: string
          description: Authorization scope identity, when the action has a scoped owner.
        status:
          type: string
          description: Durable outcome state of the audited Attempt.
        request_id:
          type: string
          description: Safe request correlation value when the action originated over a request transport.
        node_id:
          type: string
        client_type:
          type: string
        authentication_method:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        error_code:
          type: string
          description: Stable safe failure category for an unsuccessful action; internal detail is omitted.
        summary:
          type: string
          maxLength: 2048
          description: >-
            One sentence describing the Event in the negotiated language, for display only; clients that need to
            reason about the Event read its codes. People and records appear by name only when the caller could see
            them now, and an unfinished or failed Event says so.
        reason:
          type: string
          maxLength: 500
          description: >-
            Reason recorded when an account was disabled, present only on that event, only when one was given, and
            only for Institution-wide audit readers.
    AuditListResponse:
      description: One bounded page of authorized audit Events.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        next_cursor:
          type: string
          description: Opaque continuation for the next page, omitted after the final page.
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Audit Events matching the filters and the caller's visibility across every page, present only on the
            first page. At 10,000 counting stops and `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached the 10,000 bound and there may be more. Present with `total`.
