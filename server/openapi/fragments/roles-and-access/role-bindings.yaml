paths:
  /api/v1/role-bindings:
    get:
      operationId: listRoleBindings
      summary: List Role Bindings by user, scope, or Role
      tags:
        - Roles and access
      description: >-
        Lists Role Bindings you can see, filtered in exactly one of three ways. Combining them fails with `request.invalid`.
        `user_id` lists one User's current and past Bindings inside your role_binding.view scopes. `scope_type` with `scope_id` lists every Binding at one scope you can view. Both return the whole history, newest first.
        `role_id`, repeated for up to 16 Roles, lists who holds those Roles now: Bindings of any listed Role that are in effect at the time of the request, on a Role and scope that are not archived, inside your role_binding.view scopes. They are sorted newest first by `created_at`, then `id`. You need Institution-wide role.view to name Roles. Without it, or for a Role that does not exist or is archived, the request fails with `request.invalid` on `role_id`. Its cursor works only with the same set of Roles.
        A Binding grants a Role for a period of time. Memberships and Affiliations on their own are not listed here.
        The first page (read without a cursor) also has `total`, the number of matching Bindings across all pages. It is exact up to 10,000. Above that it shows 10,000 and `total_is_lower_bound` is true. Later pages have no total, so keep the one from the first page.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - administration.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: user_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Bindings for this User.
        - name: scope_type
          in: query
          schema:
            type: string
          description: >-
            Return only Bindings at this kind of scope, `institution`, `academic_unit` or `class`. Send it with
            `scope_id`.
        - name: scope_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Bindings at this Institution, Academic Unit or Class. Send it with `scope_type`.
        - name: role_id
          in: query
          required: false
          description: >-
            Return the current Bindings of any listed Role inside your role_binding.view scopes. Repeat the
            parameter for up to 16 Roles. A repeated Role counts once. You need Institution-wide role.view, and
            every Role must exist and not be archived, or the request fails with `request.invalid` on `role_id`.
            You can't combine it with `user_id`, `scope_type` or `scope_id`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 16
            items:
              $ref: '#/components/schemas/ID'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/RoleBindingListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createRoleBinding
      summary: Create a Role Binding
      tags:
        - Roles and access
      description: >-
        Grants a Role to a User at one scope, for a period of time. You must have signed in recently with a strong method. The server checks again that you may grant this Role here. The System Administrator Role can only be granted at the Institution scope.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - role_binding.invalid
        - role_binding.conflict
        - role_binding.system_admin_scope_invalid
        - administration.unavailable
        - mail.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateRoleBinding'
      responses:
        "201":
          $ref: '#/components/responses/RoleBindingCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/role-bindings/{role_binding_id}:
    parameters:
      - $ref: '#/components/parameters/RoleBindingID'
    delete:
      operationId: endRoleBinding
      summary: End a Role Binding
      tags:
        - Roles and access
      description: >-
        Ends a Role Binding now by setting its `end_at`. The Binding and its audit history are kept. The server refuses to end the last System Administrator's Binding. The User, Role, memberships and Affiliations are not changed.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/role-bindings/g63dcrphk8idgyjgzbrpajosz6' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - role_binding.conflict
        - role_binding.last_system_admin
        - administration.unavailable
        - mail.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/RoleBindingEnded'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    RoleBindingID:
      name: role_binding_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Role Binding identifier.
  requestBodies:
    CreateRoleBinding:
      description: The User, the Role, the scope, and when the grant starts and ends.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRoleBindingRequest'
          example:
            user_id: ybndrfg8ejkmcpqxot1uwisza3
            role_id: ybndrfg8ejkmcpqxot1uwisza4
            scope_type: academic_unit
            scope_id: ybndrfg8ejkmcpqxot1uwisza5
            start_at: '2026-08-01T00:00:00Z'
  responses:
    RoleBindingListOK:
      description: Role Binding collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleBindingListResponse'
          example:
            items:
              - id: g63dcrphk8idgyjgzbrpajosz6
                created_at: '2026-08-01T09:30:00Z'
                updated_at: '2026-08-01T09:30:00Z'
                user_id: ih1r84kij94nrwis97rft6rduh
                role_id: 1asb7sk89dp1ex339fkh3te5t4
                scope_type: academic_unit
                scope_id: 14j8umgczgrdp95w77zuxmxfu9
                start_at: '2026-08-01T09:30:00Z'
                role:
                  id: 1asb7sk89dp1ex339fkh3te5t4
                  display_name: Teacher
                scope:
                  type: academic_unit
                  id: 14j8umgczgrdp95w77zuxmxfu9
                  display_name: Mathematics
                granted_by:
                  id: sjebyge5cpbop1xwo4eds74ejb
                  display_name: Priya Raman
                granted_via: manual
              - id: 889766ufjgio6kbpzjbufozksq
                created_at: '2026-02-10T08:00:00Z'
                updated_at: '2026-07-31T17:00:00Z'
                user_id: ih1r84kij94nrwis97rft6rduh
                role_id: iqcx3qc9sbbt6ocshszfqgq6ci
                scope_type: class
                scope_id: fotnmte5o3j9wftdm5rtbfofqr
                start_at: '2026-02-10T08:00:00Z'
                end_at: '2026-07-31T17:00:00Z'
                role:
                  id: iqcx3qc9sbbt6ocshszfqgq6ci
                  display_name: Teacher
                scope:
                  type: class
                  id: fotnmte5o3j9wftdm5rtbfofqr
                  display_name: Year 2 Statistics
                granted_by:
                  id: sjebyge5cpbop1xwo4eds74ejb
                  display_name: Priya Raman
                granted_via: manual
            total: 2
            total_is_lower_bound: false
    RoleBindingCreated:
      description: Role Binding created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleBindingResponse'
          example:
            id: g63dcrphk8idgyjgzbrpajosz6
            created_at: '2026-07-28T15:04:00Z'
            updated_at: '2026-07-28T15:04:00Z'
            user_id: ih1r84kij94nrwis97rft6rduh
            role_id: 1asb7sk89dp1ex339fkh3te5t4
            scope_type: academic_unit
            scope_id: 14j8umgczgrdp95w77zuxmxfu9
            start_at: '2026-08-01T00:00:00Z'
            role:
              id: 1asb7sk89dp1ex339fkh3te5t4
              display_name: Teacher
            scope:
              type: academic_unit
              id: 14j8umgczgrdp95w77zuxmxfu9
              display_name: Mathematics
            granted_by:
              id: sjebyge5cpbop1xwo4eds74ejb
              display_name: Priya Raman
            granted_via: manual
    RoleBindingEnded:
      description: Role Binding ended
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleBindingResponse'
          example:
            id: g63dcrphk8idgyjgzbrpajosz6
            created_at: '2026-07-28T15:04:00Z'
            updated_at: '2026-09-30T12:00:00Z'
            user_id: ih1r84kij94nrwis97rft6rduh
            role_id: 1asb7sk89dp1ex339fkh3te5t4
            scope_type: academic_unit
            scope_id: 14j8umgczgrdp95w77zuxmxfu9
            start_at: '2026-08-01T00:00:00Z'
            end_at: '2026-09-30T12:00:00Z'
            role:
              id: 1asb7sk89dp1ex339fkh3te5t4
              display_name: Teacher
            scope:
              type: academic_unit
              id: 14j8umgczgrdp95w77zuxmxfu9
              display_name: Mathematics
            granted_by:
              id: sjebyge5cpbop1xwo4eds74ejb
              display_name: Priya Raman
            granted_via: manual
  schemas:
    RoleBindingListResponse:
      description: A page of current and past Role Bindings you can see.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The Role Bindings on this page.
          items:
            $ref: '#/components/schemas/RoleBindingResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Number of Role Bindings that match the filters, across all pages. Sent on the first page only.
            Counting stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached 10,000 and there may be more. Sent with `total`.
    CreateRoleBindingRequest:
      description: The Role grant to create.
      type: object
      additionalProperties: false
      required:
        - user_id
        - role_id
        - scope_type
        - scope_id
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
          description: The User who receives the Role.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role to grant.
        scope_type:
          type: string
          description: >-
            Kind of scope to grant at, `institution`, `academic_unit` or `class`. The Role's permissions must
            make sense at that kind of scope.
        scope_id:
          $ref: '#/components/schemas/ID'
          description: The Institution, Academic Unit or Class to grant at.
        start_at:
          type: string
          format: date-time
          description: Time the grant takes effect. Omit it to start now.
        end_at:
          type: string
          format: date-time
          description: Time the grant stops. Omit it for a grant with no end.
