paths:
  /api/v1/roles:
    get:
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listRoles
      summary: List Roles
      tags:
        - Roles and access
      description: >-
        Lists the built-in and custom Roles you can see, sorted by `name` and then `id`. A Role only names permissions. A User gets them only through a current Role Binding at a scope, and each request still checks access at that moment. Each item has `holders`, counting the current Role Bindings of that Role you can see through role_binding.view, all read at the same moment for the whole page. `holders` is left out if you hold role_binding.view nowhere.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - administration.unavailable
        - request.invalid
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/RoleListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createRole
      summary: Create a custom Role
      tags:
        - Roles and access
      description: >-
        Creates a custom Role with a machine name and a set of known permissions. A new Role is granted to nobody. It has no effect until you create a Role Binding for it.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - role.invalid
        - role.conflict
        - role.permission.invalid
        - administration.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateRole'
      responses:
        "201":
          $ref: '#/components/responses/RoleCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/roles/{role_id}:
    parameters:
      - $ref: '#/components/parameters/RoleID'
    get:
      operationId: getRole
      summary: Get a Role
      tags:
        - Roles and access
      description: >-
        Returns one built-in or custom Role you can see, with its permissions and whether it is built in. `holders` counts the current Role Bindings of the Role you can see through role_binding.view. It is left out if you hold role_binding.view nowhere. A Role existing does not mean anyone holds it.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/RoleOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateRole
      summary: Update a custom Role
      tags:
        - Roles and access
      description: >-
        Changes the display name, description or full permission list of a custom Role, after checking your permission again. Built-in Roles can't be changed. A permission change can be refused when existing grants would make it unsafe.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - role.invalid
        - role.conflict
        - role.built_in.protected
        - role.permission.invalid
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateRole'
      responses:
        "200":
          $ref: '#/components/responses/RoleOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteRole
      summary: Delete a custom Role
      tags:
        - Roles and access
      description: >-
        Deletes a custom Role, unless Role Bindings that are kept still depend on it. Built-in Roles can't be deleted, and neither can a Role whose removal would break the record of current grants.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/roles/1asb7sk89dp1ex339fkh3te5t4' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - role.built_in.protected
        - role.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/RoleDeleted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    RoleID:
      name: role_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Role identifier.
  requestBodies:
    CreateRole:
      description: The new Role's machine name, display text and full list of permissions.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRoleRequest'
          example:
            name: assessment-reviewer
            display_name: Assessment Reviewer
            description: Reviews examination integrity records.
            permissions:
              - class.view
    UpdateRole:
      description: The Role fields to change. Omitted or null fields stay as they are.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateRoleRequest'
          example:
            display_name: Senior Assessment Reviewer
            description: Reviews examination and integrity records.
            permissions:
              - class.view
  responses:
    RoleListOK:
      description: Role collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleListResponse'
          example:
            items:
              - id: 1asb7sk89dp1ex339fkh3te5t4
                created_at: '2026-03-02T10:00:00Z'
                updated_at: '2026-05-18T12:30:00Z'
                name: assessment-reviewer
                display_name: Assessment Reviewer
                description: Reviews examination integrity records.
                permissions:
                  - class.view
                  - submission.review
                built_in: false
                grantable_scope_types:
                  - institution
                  - academic_unit
                  - class
                holders:
                  bindings: 12
                  users: 9
                  scopes: 3
                  bindings_is_lower_bound: false
                  users_is_lower_bound: false
                  scopes_is_lower_bound: false
            next_cursor: eyJuYW1lIjoiYXNzZXNzbWVudC1yZXZpZXdlciJ9
    RoleOK:
      description: Role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleResponse'
          example:
            id: 1asb7sk89dp1ex339fkh3te5t4
            created_at: '2026-03-02T10:00:00Z'
            updated_at: '2026-08-01T09:30:00Z'
            name: assessment-reviewer
            display_name: Senior Assessment Reviewer
            description: Reviews examination and integrity records.
            permissions:
              - class.view
            built_in: false
            grantable_scope_types:
              - institution
              - academic_unit
              - class
            holders:
              bindings: 12
              users: 9
              scopes: 3
              bindings_is_lower_bound: false
              users_is_lower_bound: false
              scopes_is_lower_bound: false
    RoleCreated:
      description: Role created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleResponse'
          example:
            id: 1asb7sk89dp1ex339fkh3te5t4
            created_at: '2026-08-01T09:30:00Z'
            updated_at: '2026-08-01T09:30:00Z'
            name: assessment-reviewer
            display_name: Assessment Reviewer
            description: Reviews examination integrity records.
            permissions:
              - class.view
            built_in: false
            grantable_scope_types:
              - institution
              - academic_unit
              - class
    RoleDeleted:
      description: Role deleted
  schemas:
    RoleListResponse:
      description: A page of Roles you can see.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The Roles on this page, sorted by `name` and then `id`.
          items:
            $ref: '#/components/schemas/RoleResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CreateRoleRequest:
      description: The machine name, display text and full permission list of a new custom Role.
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
        - permissions
      properties:
        name:
          type: string
          description: Machine name of the Role. It must be unique and can't change later.
        display_name:
          type: string
          description: Name shown to people.
        description:
          type: string
          description: What the Role is for, in plain text.
        permissions:
          type: array
          description: >-
            Every permission the Role grants, such as `class.view`, each listed once. Each must be a permission
            Proctor knows.
          items:
            type: string
    UpdateRoleRequest:
      description: Custom Role fields to change. The machine name can't change.
      type: object
      additionalProperties: false
      properties:
        display_name:
          type:
            - string
            - "null"
          description: New name shown to people. Omit or send null to keep it. An empty string is checked like any other value.
        description:
          type:
            - string
            - "null"
          description: New description. Omit or send null to keep it. An empty string is checked like any other value.
        permissions:
          type:
            - array
            - "null"
          description: >-
            The new full permission list, which replaces the old one. Omit or send null to keep it. An empty list
            is checked like any other value.
          items:
            type: string
