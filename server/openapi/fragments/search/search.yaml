paths:
  /api/v1/search:
    get:
      operationId: searchAccessible
      summary: Search Exams, Classes, and Users
      tags:
        - Search
      description: >-
        Finds Exams by Draft title, Classes by name or display name, and Users by directory fields. Each match contains the trimmed `q` as literal text, ignoring case. Each type is checked, audited and limited exactly as its own list is: active Exams the caller may see in the Exam catalog, unarchived Classes within the caller's class.view scope, and enabled Users visible in the User directory. A requested type the caller may not list adds no items. The request is denied only when the caller may list none of the requested types. Items are grouped by type in the order exam, class, user. Each group keeps its own list's order and holds at most `limit` items. Search returns a single page and never continues: `next_cursor` is always omitted and `cursor` is rejected. Email addresses are never returned, and the search text is kept out of logs and audit records.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - search.query.invalid
        - exam.invalid
        - exam.unavailable
        - administration.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          description: The text to find, 2 to 100 characters after surrounding spaces are removed. It is matched literally, ignoring case.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: types
          in: query
          required: false
          style: form
          explode: true
          description: The result types to search, repeated once per type, such as `types=exam&types=user`. Leave it out to search every type. A type may appear only once.
          schema:
            type: array
            minItems: 1
            maxItems: 3
            uniqueItems: true
            items:
              $ref: '#/components/schemas/SearchType'
        - name: limit
          in: query
          required: false
          description: The most items to return for each type.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: cursor
          in: query
          required: false
          description: Not accepted. Search returns a single page and never issues `next_cursor`, so any cursor is rejected with `request.invalid`.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        "200":
          $ref: '#/components/responses/SearchOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    SearchOK:
      description: Matches of each requested type that the caller could see in that type's own list.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchResponse'
          example:
            items:
              - type: exam
                id: nybc6xhg593upqice3sdeyro5k
                title: Algorithms midterm
                academic_unit_id: 14j8umgczgrdp95w77zuxmxfu9
              - type: class
                id: 6xoche483hwrx5rpu8jzjoe7qg
                display_name: Algorithms, group A
                programme_level_id: p6y6sf8ac6m5if373fkkebj7j6
              - type: user
                id: dfa1x1n7mkthyoziwxnupsmyia
                display_name: Ada Example
                username: ada.example
  schemas:
    SearchType:
      type: string
      enum:
        - exam
        - class
        - user
      description: The kind of search result.
    SearchResponse:
      description: Up to `limit` matches of each requested type, grouped by type. Search never continues, so `next_cursor` is always omitted.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'
          description: The matches, Exams first, then Classes, then Users.
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
          description: Never present. Search does not continue past its single page.
    SearchItem:
      description: One search match, discriminated by type.
      oneOf:
        - $ref: '#/components/schemas/SearchExamItem'
        - $ref: '#/components/schemas/SearchClassItem'
        - $ref: '#/components/schemas/SearchUserItem'
      discriminator:
        propertyName: type
        mapping:
          exam: '#/components/schemas/SearchExamItem'
          class: '#/components/schemas/SearchClassItem'
          user: '#/components/schemas/SearchUserItem'
    SearchExamItem:
      description: An Exam the caller may see in the Exam catalog, titled by its current Draft.
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - title
        - academic_unit_id
      properties:
        type:
          type: string
          const: exam
          description: Always `exam` for an Exam match.
        id:
          $ref: '#/components/schemas/ID'
          description: The Exam identifier.
        title:
          type: string
          description: The title of the Exam's current Draft.
        academic_unit_id:
          $ref: '#/components/schemas/ID'
          description: The Academic Unit that owns the Exam.
    SearchClassItem:
      description: An unarchived Class within the caller's class.view scope.
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - display_name
        - programme_level_id
      properties:
        type:
          type: string
          const: class
          description: Always `class` for a Class match.
        id:
          $ref: '#/components/schemas/ID'
          description: The Class identifier.
        display_name:
          type: string
          description: The Class name shown to people.
        programme_level_id:
          $ref: '#/components/schemas/ID'
          description: The Programme Level the Class belongs to.
    SearchUserItem:
      description: A User visible in the caller's User directory. The email address is never included.
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - display_name
        - username
      properties:
        type:
          type: string
          const: user
          description: Always `user` for a User match.
        id:
          $ref: '#/components/schemas/ID'
          description: The User identifier.
        display_name:
          type: string
          description: The User's name as shown to people.
        username:
          type: string
          description: The User's username.
