    BrowserSourceSessionID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    BrowserDeliveryRecord:
      description: >-
        Strict closed record. Lifecycle records omit navigation members; optional members are omitted rather
        than null. Redirect selectors must reference an earlier successful hop in the same source and policy.
        Policy validation, canonical URL minimization, safe integer spelling and UTC millisecond precision are
        enforced by the server.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            kind:
              type: string
              const: browser_opened
            policy_revision_id:
              $ref: '#/components/schemas/ID'
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            kind:
              type: string
              const: browser_closed
            policy_revision_id:
              $ref: '#/components/schemas/ID'
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
            - location
            - matched_rule_id
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            kind:
              type: string
              const: top_level_navigation
            policy_revision_id:
              $ref: '#/components/schemas/ID'
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
            location:
              type: object
              additionalProperties: false
              required:
                - scheme
                - host
                - path
              properties:
                scheme:
                  type: string
                  maxLength: 32
                host:
                  type: string
                  maxLength: 2048
                port:
                  type: string
                  minLength: 1
                  maxLength: 5
                path:
                  type: string
                  maxLength: 2048
            matched_rule_id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9_-]{1,64}$
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
            - location
            - matched_rule_id
            - redirect_from_sequence
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            kind:
              type: string
              const: top_level_redirect
            policy_revision_id:
              $ref: '#/components/schemas/ID'
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
            location:
              type: object
              additionalProperties: false
              required:
                - scheme
                - host
                - path
              properties:
                scheme:
                  type: string
                  maxLength: 32
                host:
                  type: string
                  maxLength: 2048
                port:
                  type: string
                  minLength: 1
                  maxLength: 5
                path:
                  type: string
                  maxLength: 2048
            matched_rule_id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9_-]{1,64}$
            redirect_from_sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
            - location
            - block_reason
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
            kind:
              type: string
              const: blocked_top_level_navigation
            policy_revision_id:
              $ref: '#/components/schemas/ID'
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
            location:
              type: object
              additionalProperties: false
              required:
                - scheme
                - host
                - path
              properties:
                scheme:
                  type: string
                  maxLength: 32
                host:
                  type: string
                  maxLength: 2048
                port:
                  type: string
                  minLength: 1
                  maxLength: 5
                path:
                  type: string
                  maxLength: 2048
            matched_rule_id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9_-]{1,64}$
            block_reason:
              type: string
              enum:
                - scheme_not_allowed
                - origin_not_allowed
                - path_not_allowed
                - redirect_not_allowed
                - invalid_url
            redirect_from_sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
    DeliveryRecovery:
      type: object
      additionalProperties: false
      description: >-
        Current authorized progress and budget after a delivery refusal, bounded at 32 KiB. These observations
        do not acknowledge rejected bytes. Independent reads may reflect concurrent progress. Omitted when
        fresh ownership cannot be established or the family has retired. Available on pending_capacity,
        replay_window_exceeded, detail_budget_exhausted, sequence_limit, declaration_conflict, upload_expired
        and delivery rate-limit errors.
      required:
        - family
        - budget
      properties:
        family:
          type: string
          enum:
            - native
            - browser
        budget:
          $ref: '#/components/schemas/DeliveryBudgetSnapshot'
        native_status:
          $ref: '#/components/schemas/NativeSecurityStreamStatus'
        browser_status:
          $ref: '#/components/schemas/BrowserSourceStatus'
      oneOf:
        - properties:
            family:
              const: native
          not:
            required:
              - browser_status
        - properties:
            family:
              const: browser
          not:
            required:
              - native_status
