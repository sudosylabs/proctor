        - submission.review.override
        - submission.view
        - submission.view.override
        - user.manage
        - user.mfa.reset
        - user.profile_picture.manage
        - user.search
        - user.settings.replace
        - user.view
    ResourceType:
      type: string
      description: >-
        Type of a resource in permission checks and audit records. Later versions may add values. Show your own
        label for each value, and a general message for one you don't recognize.
      enum:
        - academic_period
        - academic_unit
        - class
        - exam
        - exam_sitting
        - institution
        - mail_delivery
        - programme
        - programme_level
        - submission
        - user
    ProblemDetails:
      type: object
      additionalProperties: false
      description: >-
        The RFC 9457 error body returned by every failed request. Use `code` to decide what to do. `title` and
        `detail` are text for people, in the request's language.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            Link to this error's page on the installation's documentation site, such as
            `https://docs.example.edu/problems/request.invalid`, or `about:blank` when the installation has not
            configured one. Use `code`, not `type`, to decide what to do.
        title:
          type: string
          description: Short summary of the error for people.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code of the response.
        detail:
          type: string
          description: Longer explanation of this occurrence for people. Omitted when there is nothing to add.
        instance:
          type: string
          format: uri-reference
          description: The request path that failed, when the server includes it.
        code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: string
          description: Machine-readable error code, such as `request.invalid`. Base your error handling on this.
        request_id:
          type: string
          description: The server's ID for the request. Quote it when you report a problem.
        control_metadata_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097152
          description: Bytes of delivery control data already stored. Present only with `exam.delivery.metadata_capacity`.
        control_metadata_limit_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097152
          description: >-
            Most bytes of delivery control data that can be stored. Present only with
            `exam.delivery.metadata_capacity`.
        required_reservation_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097152
          description: Bytes the refused request needed to reserve. Present only with `exam.delivery.metadata_capacity`.
        remaining_reservable_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 2097152
          description: Bytes that can still be reserved. Present only with `exam.delivery.metadata_capacity`.
        fields:
          type: object
          description: For validation errors, the request fields that were wrong, each mapped to a short reason.
          additionalProperties:
            type: string
        delivery:
          $ref: '#/components/schemas/DeliveryRecovery'
          description: Current delivery progress and budget, sent with some Exam delivery errors.
    BrowserSourceSessionID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: Lowercase version 4 UUID that Proctor Desktop assigns to one browser source.
    BrowserDeliveryRecord:
      description: >-
        One Browser Activity record sent by Proctor Desktop. `kind` decides which members it has: open and close
        records carry no location, and members a record does not use are left out, never null. A redirect names an
        earlier successful navigation of the same source and policy. The server checks every record against the
        browser policy and rejects URLs that are not already in minimal form, unsafe integers, and times that are
        not UTC with millisecond precision.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
              description: Position of the record in this browser source. Each record's number is higher than the last.
            kind:
              type: string
              const: browser_opened
              description: The exam browser opened.
            policy_revision_id:
              $ref: '#/components/schemas/ID'
              description: The Exam Revision whose browser policy was in force.
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
              description: When it happened by the Desktop's clock, in UTC with millisecond precision.
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
              description: Position of the record in this browser source. Each record's number is higher than the last.
            kind:
              type: string
              const: browser_closed
              description: The exam browser closed.
            policy_revision_id:
              $ref: '#/components/schemas/ID'
              description: The Exam Revision whose browser policy was in force.
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
              description: When it happened by the Desktop's clock, in UTC with millisecond precision.
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
            - location
            - matched_rule_id
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
              description: Position of the record in this browser source. Each record's number is higher than the last.
            kind:
              type: string
              const: top_level_navigation
              description: The browser moved to a page the policy allows.
            policy_revision_id:
              $ref: '#/components/schemas/ID'
              description: The Exam Revision whose browser policy was in force.
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
              description: When it happened by the Desktop's clock, in UTC with millisecond precision.
            location:
              type: object
              additionalProperties: false
              description: The page address with the query and fragment removed.
              required:
                - scheme
                - host
                - path
              properties:
                scheme:
                  type: string
                  maxLength: 32
                  description: URL scheme in lowercase, such as `https`.
                host:
                  type: string
                  maxLength: 2048
                  description: Host name in lowercase. Empty when the scheme has no host.
                port:
                  type: string
                  minLength: 1
                  maxLength: 5
                  description: Port number. Omitted when it is the scheme's default port.
                path:
                  type: string
                  maxLength: 2048
                  description: URL path.
            matched_rule_id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9_-]{1,64}$
              description: The browser policy rule that allowed the page.
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
            - location
            - matched_rule_id
            - redirect_from_sequence
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
              description: Position of the record in this browser source. Each record's number is higher than the last.
            kind:
              type: string
              const: top_level_redirect
              description: A page redirected to another page the policy allows.
            policy_revision_id:
              $ref: '#/components/schemas/ID'
              description: The Exam Revision whose browser policy was in force.
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
              description: When it happened by the Desktop's clock, in UTC with millisecond precision.
            location:
              type: object
              additionalProperties: false
              description: The page address with the query and fragment removed.
              required:
                - scheme
                - host
                - path
              properties:
                scheme:
                  type: string
                  maxLength: 32
                  description: URL scheme in lowercase, such as `https`.
                host:
                  type: string
                  maxLength: 2048
                  description: Host name in lowercase. Empty when the scheme has no host.
                port:
                  type: string
                  minLength: 1
                  maxLength: 5
                  description: Port number. Omitted when it is the scheme's default port.
                path:
                  type: string
                  maxLength: 2048
                  description: URL path.
            matched_rule_id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9_-]{1,64}$
              description: The browser policy rule that allowed the target page.
            redirect_from_sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
              description: The `sequence` of the earlier navigation that redirected here.
        - type: object
          additionalProperties: false
          required:
            - sequence
            - kind
            - policy_revision_id
            - client_occurred_at
            - location
            - block_reason
          properties:
            sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
              description: Position of the record in this browser source. Each record's number is higher than the last.
            kind:
              type: string
              const: blocked_top_level_navigation
              description: The browser blocked a page the policy does not allow.
            policy_revision_id:
              $ref: '#/components/schemas/ID'
              description: The Exam Revision whose browser policy was in force.
            client_occurred_at:
              type: string
              format: date-time
              pattern: Z$
              description: When it happened by the Desktop's clock, in UTC with millisecond precision.
            location:
              type: object
              additionalProperties: false
              description: The page address with the query and fragment removed.
              required:
                - scheme
                - host
                - path
              properties:
                scheme:
                  type: string
                  maxLength: 32
                  description: URL scheme in lowercase, such as `https`.
                host:
                  type: string
                  maxLength: 2048
                  description: Host name in lowercase. Empty when the scheme has no host.
                port:
                  type: string
                  minLength: 1
                  maxLength: 5
                  description: Port number. Omitted when it is the scheme's default port.
                path:
                  type: string
                  maxLength: 2048
                  description: URL path.
            matched_rule_id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9_-]{1,64}$
              description: >-
                The browser policy rule that matched the page, when one did. Never sent for `scheme_not_allowed` or
                `invalid_url`.
            block_reason:
              type: string
              description: Why the page was blocked.
              enum:
                - scheme_not_allowed
                - origin_not_allowed
                - path_not_allowed
                - redirect_not_allowed
                - invalid_url
            redirect_from_sequence:
              type: integer
              format: int64
              minimum: 1
              maximum: 9007199254740991
              description: >-
                The `sequence` of the earlier navigation that tried to redirect here. Required when `block_reason`
                is `redirect_not_allowed`.
    DeliveryRecovery:
      type: object
      additionalProperties: false
      description: >-
        Current delivery progress and budget, sent with a refused delivery so the client can recover. It is at most
        32 KiB. It does not mean the server accepted any of the refused data, and progress read at different
        moments may differ while other uploads run. Left out when the server can't confirm you still own the
        delivery, or the delivery has ended. Sent with `pending_capacity`, `replay_window_exceeded`,
        `detail_budget_exhausted`, `sequence_limit`, `declaration_conflict`, `upload_expired` and the delivery
        rate-limit errors.
      required:
        - family
        - budget
      properties:
        family:
          type: string
          description: Which delivery the data belongs to, `native` security data or `browser` activity.
          enum:
            - native
            - browser
        budget:
          $ref: '#/components/schemas/DeliveryBudgetSnapshot'
        native_status:
          $ref: '#/components/schemas/NativeSecurityStreamStatus'
          description: Current status of the native security stream. Present only when `family` is `native`.
        browser_status:
          $ref: '#/components/schemas/BrowserSourceStatus'
          description: Current status of the browser source. Present only when `family` is `browser`.
      oneOf:
        - properties:
            family:
              const: native
          not:
            required:
              - browser_status
        - properties:
            family:
              const: browser
          not:
            required:
              - native_status
