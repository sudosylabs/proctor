    OnboardingImportRowResponse:
      type: object
      additionalProperties: false
      description: >-
        One row of an import: where it sits, what it does and how it ended. It never repeats the email address or
        names the row holds.
      required:
        - row
        - reference
        - operation
        - status
      properties:
        row:
          type: integer
          minimum: 1
          maximum: 50000
          description: Row number, starting at 1 for the first data row after the header.
        reference:
          type: string
          maxLength: 128
          description: >-
            Your label for the row: the value of the CSV `reference` column, or the row number when that column is
            empty or longer than 128 characters. For a student progression or an academic administration preview,
            it is the ID of the Class membership or User the row is about.
        operation:
          type: string
          description: The change the row makes when the import runs.
          enum:
            - student_class.create
            - teacher_academic_unit.create
            - academic_unit_role.create
            - institution_role.create
            - affiliation.add
            - affiliation.end
            - academic_unit_member.add
            - academic_unit_member.end
            - class.enroll
            - class.end
            - class.transfer
            - role_binding.create
            - role_binding.end
            - user.enable
            - user.disable
            - user_sessions.revoke
        status:
          type: string
          description: >-
            Where the row stands. Before commit it is `valid`, `invalid` or `duplicate`. On commit, valid rows
            become `pending`, rows that would change nothing become `no_op`, and the rest are `skipped`. A pending
            row ends as `succeeded` or `failed`, or `canceled` if the import is canceled first.
          enum:
            - valid
            - invalid
            - duplicate
            - pending
            - succeeded
            - no_op
            - failed
            - skipped
            - canceled
        preview_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/OnboardingImportPreviewCode'
            - type: string
          description: Why the preview marked the row invalid or duplicate, or a note about it. Omitted when there is none.
        public_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/OnboardingImportRowCode'
            - type: string
          description: Why the row failed when the import ran. Present only on a `failed` row.
        invitation_id:
          $ref: '#/components/schemas/ID'
          description: The Invitation the row created, for rows that invite someone.
        resource_id:
          $ref: '#/components/schemas/ID'
          description: The ID of the record the row created or changed, when the operation reports one.
    OnboardingImportResponse:
      type: object
      additionalProperties: false
      description: >-
        A CSV onboarding import, a student progression or an academic administration preview. The server parses it
        into rows you can review, then runs the rows when you commit it.
      required:
        - id
        - mode
        - state
        - scope_type
        - scope_id
        - total_rows
        - valid_rows
        - invalid_rows
        - succeeded_rows
        - no_op_rows
        - failed_rows
        - skipped_rows
        - parse_job_id
        - created_at
        - updated_at
        - expires_at
        - revision
      properties:
        id:
          $ref: '#/components/schemas/ID'
        mode:
          type: string
          description: What kind of import this is, which decides the CSV columns and the operations its rows run.
          enum:
            - student_class
            - teacher_academic_unit
            - institution
            - academic_administration
            - student_progression
        state:
          type: string
          description: >-
            Progress of the import. It goes from `uploading` and `parsing` to `preview_ready`, then `executing`
            after commit, and ends as `completed`, `completed_with_errors`, `canceled` or `failed`.
          enum:
            - uploading
            - parsing
            - preview_ready
            - executing
            - completed
            - completed_with_errors
            - canceled
            - failed
        scope_type:
          type: string
          description: Kind of scope the import works in.
          enum:
            - class
            - academic_unit
            - institution
        scope_id:
          $ref: '#/components/schemas/ID'
          description: The Class, Academic Unit or Institution the import works in.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role the import grants, for modes that grant one.
        source_period_id:
          $ref: '#/components/schemas/ID'
          description: Academic Period students progress from. Student progressions only.
        source_class_id:
          $ref: '#/components/schemas/ID'
          description: Class students progress from. Student progressions only.
        destination_period_id:
          $ref: '#/components/schemas/ID'
          description: Academic Period students progress into. Student progressions only.
        destination_class_id:
          $ref: '#/components/schemas/ID'
          description: Class students progress into. Student progressions only.
        source_class_name:
          type: string
          maxLength: 512
          description: Display name of the source Class, present only on student progression reads and listings.
        destination_class_name:
          type: string
          maxLength: 512
          description: Display name of the destination Class, present only on student progression reads and listings.
        effective_at:
          type: string
          format: date-time
          description: Time the student progression takes effect. Omitted for other modes.
        preview_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: >-
            SHA-256 fingerprint of the parsed preview, as 64 hexadecimal characters. Send it back when you commit,
            to confirm you reviewed this exact preview. Present once parsing has finished.
        ignored_headers:
          type: array
          maxItems: 64
          description: CSV column names the import did not recognize and ignored, in lowercase and sorted.
          items:
            type: string
            maxLength: 128
        rows:
          type: array
          maxItems: 50000
          description: Every row of the import. Present only when you read one import, not in listings.
          items:
            $ref: '#/components/schemas/OnboardingImportRowResponse'
        total_rows:
          type: integer
          minimum: 0
          maximum: 50000
          description: Number of data rows in the import.
        valid_rows:
          type: integer
          minimum: 0
          maximum: 50000
          description: Rows the preview found valid.
        invalid_rows:
          type: integer
          minimum: 0
          maximum: 50000
          description: Rows the preview found invalid.
        succeeded_rows:
          type: integer
          minimum: 0
          maximum: 50000
          description: Rows that ran and made their change.
        no_op_rows:
          type: integer
          minimum: 0
          maximum: 50000
          description: Rows that needed no change.
        failed_rows:
          type: integer
          minimum: 0
          maximum: 50000
          description: Rows that ran and failed.
        skipped_rows:
          type: integer
          minimum: 0
          maximum: 50000
          description: Rows that did not run, because they were left out at commit or the import was canceled.
        commit_policy:
          type: string
          description: >-
            How the import was committed: `require_all_valid` runs only if every row is valid, and
            `valid_rows_only` runs the valid rows and skips the rest. Present after commit.
          enum:
            - require_all_valid
            - valid_rows_only
        parse_job_id:
          $ref: '#/components/schemas/ID'
          description: The background Job that parses the file.
        execution_job_id:
          $ref: '#/components/schemas/ID'
          description: The background Job that runs the rows. Present after commit.
        created_at:
          type: string
          format: date-time
          description: Time the import was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest change to the import.
        expires_at:
          type: string
          format: date-time
          description: Time after which the import can no longer be read, seven days after it was created.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Version number that goes up with each change. Send it as `expected_revision` when you commit.
        failure_code:
          type: string
          anyOf:
            - $ref: '#/components/schemas/OnboardingImportFailureCode'
            - type: string
          description: Why the import failed. Present only when `state` is `failed`.
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Base name of the uploaded file as the uploader gave it, omitted when none was given and for student
            progressions.
    ExternalAuthenticationProviderResponse:
