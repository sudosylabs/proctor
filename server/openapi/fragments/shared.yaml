components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A Session access token or a Personal Access Token. Each operation says which kinds of credential it
        accepts.
    dpopAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        A Desktop Session access token sent with the DPoP scheme. Each request also carries a fresh RFC 9449 DPoP
        proof, including the latest server nonce, in the DPoP header.
    sessionCookie:
      type: apiKey
      in: cookie
      name: PROCTOR_ACCESS
      description: The browser Session cookie. It is HttpOnly and sent only to this host.
    csrfToken:
      type: apiKey
      in: header
      name: X-Proctor-CSRF-Token
      description: The CSRF token. Send it with the Session cookie on every request that changes data.
    refreshBearerAuth:
      type: http
      scheme: bearer
      description: A refresh token. Only the refresh operation accepts it.
    refreshDPoPAuth:
      type: apiKey
      in: header
      name: Authorization
      description: A Desktop refresh token sent with the DPoP scheme, with a fresh proof in the DPoP header.
    refreshCookie:
      type: apiKey
      in: cookie
      name: PROCTOR_REFRESH
      description: The browser refresh cookie. It is HttpOnly and sent only to this host.
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in this page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` from the previous page, sent back exactly as received. Omit it to get the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A unique key you choose for this request, such as a random UUID. If you retry with the same key and the
        same input within 24 hours, you get the first result back and the change is not made twice. Reusing a key
        with different input fails with `idempotency.conflict`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
    AcademicUnitID:
      name: academic_unit_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Academic Unit identifier.
    ExamID:
      name: exam_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Exam identifier.
    ExamSittingID:
      name: exam_sitting_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Exam Sitting identifier.
    ExamAttemptID:
      name: exam_attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Exam Attempt identifier.
    SubmissionID:
      name: submission_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Submission identifier.
    AttemptWorkspaceEntryID:
      name: attempt_workspace_entry_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The identifier of an entry in the Attempt Workspace.
    CandidateAttemptCredential:
      name: X-Proctor-Attempt-Credential
      in: header
      required: true
      description: >-
        The secret continuity credential of the active Participation: 32 bytes as unpadded URL-safe base64. Treat
        it like a password. Never log, store, cache or put it in a URL.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: ^[A-Za-z0-9_-]{43}$
    CandidateAttemptConnectionID:
      name: X-Proctor-Attempt-Connection-ID
      in: header
      required: true
      description: The identifier of the open Attempt Connection that belongs to the current Session.
      schema:
        $ref: '#/components/schemas/ID'
    ExamResourceID:
      name: exam_resource_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Exam Resource identifier.
    ClassID:
      name: class_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Class identifier.
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The User identifier.
  responses:
    BadRequest:
      description: Invalid request
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/request.invalid
            title: Invalid request
            status: 400
            detail: One or more request fields are invalid.
            code: request.invalid
            request_id: req_docs_bad_request
            fields:
              title: must not be empty
    Unauthorized:
      description: Authentication required
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/authentication.required
            title: Authentication required
            status: 401
            detail: Supply a credential accepted by this operation.
            code: authentication.required
            request_id: req_docs_unauthorized
    Forbidden:
      description: Access denied
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/authorization.denied
            title: Access denied
            status: 403
            detail: The authenticated principal is not authorized for this action.
            code: authorization.denied
            request_id: req_docs_forbidden
    NotFound:
      description: Resource not found
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/resource.not_found
            title: Resource not found
            status: 404
            detail: The requested resource is unavailable or not visible to this principal.
            code: resource.not_found
            request_id: req_docs_not_found
    Conflict:
      description: Conflict
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/idempotency.conflict
            title: Request conflict
            status: 409
            detail: The idempotency key was already used with different input.
            code: idempotency.conflict
            request_id: req_docs_conflict
    Gone:
      description: Gone
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/exam.security.preflight_expired
            title: Gone
            status: 410
            detail: The security preflight expired.
            code: exam.security.preflight_expired
            request_id: req_docs_gone
    InternalError:
      description: Internal server error
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/server.internal
            title: Internal server error
            status: 500
            detail: An unexpected error occurred.
            code: server.internal
            request_id: req_docs_internal
    TooManyRequests:
      description: Rate limited
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/authentication.rate_limited
            title: Too many requests
            status: 429
            detail: Retry after the client backoff interval.
            code: authentication.rate_limited
            request_id: req_docs_rate_limited
    ServiceUnavailable:
      description: >-
        Service unavailable. The `service.busy` code means this server is already handling as many password checks
        or file-processing jobs as it can. The refused request had no effect. Retry after the `Retry-After` delay,
        with the same Idempotency-Key if the operation takes one.
      headers:
        Retry-After:
          description: Sent with `service.busy`, with the value 1. Wait at least this many seconds before you retry.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.example.edu/problems/administration.unavailable
            title: Service unavailable
            status: 503
            detail: A service this request needs is temporarily unavailable.
            code: administration.unavailable
            request_id: req_docs_unavailable
  headers:
    NoStore:
      description: Always `no-store`. Browsers and proxies must not keep a copy of this response.
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      description: Always `private, no-store`. The response is for this caller only, and nothing may keep a copy.
      schema:
        type: string
        const: private, no-store
    NoSniff:
      description: Always `nosniff`. Browsers must use the declared Content-Type and not guess another.
      schema:
        type: string
        const: nosniff
  schemas:
    NextCursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Token for the next page. Send it back unchanged as `cursor`, and do not parse it. Omitted on the last page.
    ID:
      type: string
      pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$
      description: A Proctor identifier, 26 lowercase z-base-32 characters. Compare it as an exact string.
    ExamResourceMediaType:
      type: string
      description: The media type of an Exam Resource file.
      enum:
        - application/pdf
        - image/png
        - image/jpeg
        - image/webp
        - text/plain
        - text/markdown
        - text/csv
        - application/json
    StarterWorkspacePath:
      type: string
      minLength: 1
      maxLength: 1024
      description: >-
        A case-sensitive relative path that uses `/` between segments, with at most 16 segments of up to 255 UTF-8
        bytes each. The server does not clean paths up. It rejects an empty or absolute path, `.` or `..` segments,
        repeated or trailing slashes, backslashes, control characters and the reserved `.proctor` folder.
    WorkspaceContentVersion:
      type: string
      pattern: ^[A-Za-z0-9_-]{26}$
      description: >-
        A token for one saved version of a Workspace file's content. Compare it or send it back unchanged. It is
        not an identifier, and you should not read meaning into its characters.
    SHA256:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: A SHA-256 digest as 64 lowercase hexadecimal characters.
    InstitutionResponse:
      type: object
      additionalProperties: false
      description: The installation's Institution.
      required:
        - id
        - created_at
        - updated_at
        - name
        - display_name
        - description
        - exam_capacity
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: Time the Institution was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest change to the Institution.
        archived_at:
          type: string
          format: date-time
          description: Time the Institution was archived. Omitted while it is active.
        name:
          type: string
          description: Short machine name of the Institution.
        display_name:
          type: string
          description: Name shown to people.
        description:
          type: string
          description: Free-text description. It can be empty.
        exam_capacity:
          $ref: '#/components/schemas/ExamCapacityPolicy'
    ExamCapacityPolicy:
      type: object
      additionalProperties: false
      description: >-
        Size limits for Exam content and candidate Workspaces across the Institution. Publishing an Exam Revision
        keeps the limits in force at that moment, so later changes do not affect a Sitting already under way.
      required:
        - resource_maximum_count
        - resource_maximum_bytes
        - workspace_maximum_entries
        - workspace_maximum_file_bytes
        - workspace_maximum_total_bytes
      properties:
        resource_maximum_count:
          type: integer
          minimum: 1
          maximum: 100
          description: Most Exam Resources one Exam can have. The default is 10.
        resource_maximum_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
          description: Largest size of one Exam Resource, in bytes. The default is 10 MiB.
        workspace_maximum_entries:
          type: integer
          minimum: 1
          maximum: 5000
          description: Most files and folders one Workspace can hold. The default is 500.
        workspace_maximum_file_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
          description: Largest size of one Workspace file, in bytes. The default is 10 MiB.
        workspace_maximum_total_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1073741824
          description: Largest total size of all files in one Workspace, in bytes. The default is 50 MiB.
    UserProfileResponse:
      type: object
      additionalProperties: false
      description: >-
        A User's profile. The email, verification, locale, time zone, activity and disabled fields appear only when
        you read your own profile or hold Institution-wide user.view.
      required:
        - id
        - created_at
        - updated_at
        - username
        - display_name
        - first_name
        - last_name
        - profile_picture_url
        - profile_picture_kind
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: Time the User account was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest change to the account.
        archived_at:
          type: string
          format: date-time
          description: Time the account was archived. Omitted while it is not archived.
        username:
          type: string
          description: Unique sign-in name, in lowercase.
        email:
          type: string
          format: email
          description: The User's email address.
        email_verified:
          type: boolean
          description: True when the User has confirmed they own the current email address.
        display_name:
          type: string
          description: Name shown to other people. It can be empty.
        first_name:
          type: string
          description: Given name. It can be empty.
        last_name:
          type: string
          description: Family name. It can be empty.
        locale:
          type: string
          description: Preferred language tag, such as `en` or `fr-CA`. Defaults to `en`.
        timezone:
          type: string
          description: Preferred time zone name, such as `Europe/Paris`. Defaults to `UTC`.
        last_login_at:
          type: string
          format: date-time
          description: Time the User last signed in. Omitted if they never have.
        last_activity_at:
          type: string
          format: date-time
          description: >-
            Time the User was last active in any Session: signing in, or using or refreshing a Session. The server
            records use at most once per Session every five minutes by default, so it can lag the latest request by
            that much. It never moves backwards.
        disabled_at:
          type: string
          format: date-time
          description: Time the account was disabled. Omitted while it is enabled.
        profile_picture_url:
          type: string
          description: >-
            Relative URL of the User's profile picture. Once a picture has been uploaded, the URL carries a version
            query that changes with each account change, so a new upload or removal gets a new URL.
        profile_picture_changed_at:
          type: string
          format: date-time
          description: >-
            Time of the latest upload or removal. It does not tell you whether a custom picture exists. Use
            `profile_picture_kind` for that.
        profile_picture_kind:
          $ref: '#/components/schemas/ProfilePictureKind'
    ProfilePictureKind:
      type: string
      enum:
        - custom
        - default
      description: >-
        Which picture the profile picture route serves: the User's own upload (custom), which can be removed, or
        the picture generated for every User (default).
    RoleResponse:
      description: >-
        A named set of permissions. A Role grants nothing by itself. A User gets its permissions only through a
        Role Binding at a scope.
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - name
        - display_name
        - description
        - permissions
        - built_in
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: Time the Role was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest change to the Role.
        archived_at:
          type: string
          format: date-time
          description: Time the Role was archived. Omitted while it is active.
        name:
          type: string
          description: Machine name of the Role. It can't change after creation.
        display_name:
          type: string
          description: Name shown to people.
        description:
          type: string
          description: What the Role is for, in plain text.
        permissions:
          type: array
          description: The permissions the Role grants, such as `class.view`. Each appears once.
          items:
            type: string
        built_in:
          type: boolean
          description: True for a Role that ships with Proctor. Built-in Roles can't be edited or deleted.
        holders:
          $ref: '#/components/schemas/RoleHolders'
          description: Who holds the Role now. Present only if you hold role_binding.view somewhere.
    RoleHolders:
      description: >-
        Who holds a Role now, counting only the Role Bindings you can see. A Binding counts when it is in effect at
        the time of the request, its scope is not archived, and it sits inside your role_binding.view scopes. Sent
        on Role reads only, and only if you hold role_binding.view somewhere. Counting stops at 10,000 Bindings.
        `users` and `scopes` are counted from those Bindings, so when `bindings` reaches 10,000 all three numbers
        are minimums.
      type: object
      additionalProperties: false
      required:
        - bindings
        - users
        - scopes
        - bindings_is_lower_bound
        - users_is_lower_bound
        - scopes_is_lower_bound
      properties:
        bindings:
          type: integer
          minimum: 0
          maximum: 10000
          description: Number of current Role Bindings of this Role that you can see.
        users:
          type: integer
          minimum: 0
          maximum: 10000
          description: Number of different Users who hold those Bindings.
        scopes:
          type: integer
          minimum: 0
          maximum: 10000
          description: Number of different scopes (scope type and ID) those Bindings are at.
        bindings_is_lower_bound:
          type: boolean
          description: True when `bindings` reached 10,000 and there may be more.
        users_is_lower_bound:
          type: boolean
          description: True when `users` may be higher than reported, because counting stopped at 10,000 Bindings.
        scopes_is_lower_bound:
          type: boolean
          description: True when `scopes` may be higher than reported, because counting stopped at 10,000 Bindings.
    RoleBindingResponse:
      description: >-
        A grant of one Role to one User at one scope: the Institution, an Academic Unit or a Class. It is in effect
        from `start_at` until `end_at`, if set.
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - user_id
        - role_id
        - scope_type
        - scope_id
        - start_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: Time the Role Binding was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest change, such as ending the Binding.
        archived_at:
          type: string
          format: date-time
          description: Time the Role Binding was archived. Omitted while it is not archived.
        user_id:
          $ref: '#/components/schemas/ID'
          description: The User who receives the Role.
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role granted.
        scope_type:
          type: string
          description: Kind of scope the grant applies to, `institution`, `academic_unit` or `class`.
        scope_id:
          $ref: '#/components/schemas/ID'
          description: The Institution, Academic Unit or Class the grant applies to.
        start_at:
          type: string
          format: date-time
          description: Time the grant takes effect.
        end_at:
          type: string
          format: date-time
          description: Time the grant stops. Omitted for a grant with no end.
    JobStatus:
      type: string
      description: >-
        State of a background Job: waiting to run (`queued`), running, asked to stop (`cancel_requested`), or
        finished as `succeeded`, `failed` or `canceled`.
      enum:
        - queued
        - running
        - cancel_requested
        - succeeded
        - failed
        - canceled
    OnboardingImportFailureCode:
      type: string
      description: >-
        Why an onboarding import, student progression or academic administration preview failed as a whole.
        Examples are lost credentials or permissions, an unreadable file, a target that is no longer valid, or a
        preview filter that matched too many Users. Later versions may add values. Show your own label for each
        value, and a general message for one you don't recognize.
      enum:
        - academic_administration_preview.authorization_lost
        - academic_administration_preview.target_conflict
        - academic_administration_preview.too_many_users
        - administration.unavailable
        - audit.unavailable
        - authentication.reauthentication_required
        - authentication.strong_required
        - authentication.token_invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - idempotency.conflict
        - idempotency.in_progress
        - invitation.class_period_conflict
        - invitation.conflict
        - invitation.invalid
        - invitation.mail_unavailable
        - invitation.role_not_delegable
        - invitation.unavailable
        - onboarding_batch.duplicate
        - onboarding_import.file_invalid
        - request.invalid
        - resource.not_found
        - student_progression.authorization_lost
        - student_progression.conflict
        - student_progression.effective_date_conflict
        - student_progression.lineage_conflict
        - student_progression.roster_too_large
        - student_progression.target_conflict
    OnboardingImportPreviewCode:
      type: string
      description: >-
        Why a preview row is invalid, a duplicate, or carries a note. Examples are a malformed or repeated CSV row,
        a target that can't be found, a student who can't progress or is already enrolled in the destination, or an
        academic administration row that will be skipped or changes nothing. Later versions may add values. Show
        your own label for each value, and a general message for one you don't recognize.
      enum:
        - academic_administration_preview.ambiguous
        - academic_administration_preview.enrollment_conflict
        - academic_administration_preview.no_change
        - academic_administration_preview.self
        - academic_administration_preview.student_affiliation_required
        - academic_administration_preview.system_administrator
        - administration.unavailable
        - audit.unavailable
        - authentication.reauthentication_required
        - authentication.strong_required
        - authentication.token_invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - idempotency.conflict
        - idempotency.in_progress
        - invitation.class_period_conflict
        - invitation.conflict
        - invitation.invalid
        - invitation.mail_unavailable
        - invitation.role_not_delegable
        - invitation.unavailable
        - onboarding_batch.duplicate
        - request.invalid
        - resource.not_found
        - student_progression.conflict
        - student_progression.destination_conflict
        - student_progression.destination_exists
        - student_progression.effective_date_conflict
        - student_progression.ineligible_target
        - student_progression.target_conflict
    OnboardingImportRowCode:
      type: string
      description: >-
        Why a row failed when an onboarding import, student progression or academic administration preview ran. It
        is the code the Invitation or academic administration operation for that row returned, or
        `academic_administration_preview.system_administrator` when the row's User became a System Administrator
        after the preview was taken. Later versions may add values. Show your own label for each value, and a
        general message for one you don't recognize.
      enum:
        - academic_administration_preview.system_administrator
        - academic_unit_member.conflict
        - academic_unit_member.invalid
        - administration.unavailable
        - affiliation.conflict
        - affiliation.invalid
        - affiliation.student_has_active_enrollment
        - audit.unavailable
        - authentication.reauthentication_required
        - authentication.strong_required
        - authentication.token_invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - class.enrollment_conflict
        - class_member.invalid
        - class_member.student_affiliation_required
        - idempotency.conflict
        - idempotency.in_progress
        - invitation.class_period_conflict
        - invitation.conflict
        - invitation.invalid
        - invitation.mail_unavailable
        - invitation.role_not_delegable
        - invitation.unavailable
        - mail.unavailable
        - onboarding_batch.duplicate
        - request.invalid
        - resource.not_found
        - role_binding.conflict
