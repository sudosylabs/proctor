paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: cancelExamSitting
      summary: Cancel a Scheduled Exam Sitting with a private manager reason
      tags:
        - Sittings
      description: >-
        Cancels a Sitting that has not opened yet. Send the Sitting's current revision; the request fails
        if it changed since you read it. Your private reason is kept for audit. Canceling never creates
        Attempts or Submissions, and a Sitting that has already opened can't be canceled.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.archived
        - exam.sitting.revision_conflict
        - exam.sitting.state_conflict
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CancelExamSitting'
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CancelExamSitting:
      description: The Sitting's current revision and a private reason for canceling it.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CancelExamSittingRequest'
          example:
            expected_revision: 2
            reason: The examination timetable was withdrawn.
  schemas:
    CancelExamSittingRequest:
      description: The Sitting revision you last read and a private reason for canceling.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - reason
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Sitting's current revision, as last read. The request fails with a conflict if the Sitting
            has changed since.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Why you are canceling. It is kept for audit and is never shown to candidates. Send valid UTF-8
            with no leading or trailing whitespace: 1 to 1000 characters and at most 4000 bytes.
