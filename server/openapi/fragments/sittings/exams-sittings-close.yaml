paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/close:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: closeExamSitting
      summary: Close an open or paused Exam Sitting early with a private manager reason
      tags:
        - Sittings
      description: >-
        Closes an open or paused Sitting before its deadline. Send the Sitting's current revision; the
        request fails if it changed since you read it. Candidates can't join or change their Workspaces
        from that moment. Unfinished Attempts are sealed as Submissions, not discarded, so the Sitting can
        stay in `closing` for a short time before it is `closed`.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.sitting.revision_conflict
        - exam.sitting.state_conflict
        - exam.sitting.deadline_reached
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.archived
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CloseExamSitting'
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CloseExamSitting:
      description: The Sitting's current revision and a private reason for closing it early.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingManagerTransitionRequest'
          example:
            expected_revision: 8
            reason: The examination room was evacuated.
