paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/correction-resource-stages:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: stageExamSittingCorrectionResourceContent
      summary: Stage one purpose-bound Exam Resource upload for a live Sitting correction
      tags:
        - Sittings
      description: >-
        Uploads the content for one resource that a live correction will add or replace. Send a
        multipart body with the `metadata` part first and the `content` part second. Then pass the
        returned `stage_id` in the correction's `resources`. The response describes the ready stage only;
        storage and upload details stay private.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/exams/wj3drgzdpnf54rxf5d8qd3dqne/sittings/14j8umgczgrdp95w77zuxmxfu9/correction-resource-stages' \
              --header 'Authorization: Bearer <token>' \
              --header 'Idempotency-Key: correction-stage-01J7YS5EP6P9M3JAXKQFRHD5TB' \
              --form 'metadata={"base_revision_id":"ih1r84kij94nrwis97rft6rduh","target_kind":"addition","media_type":"application/pdf","size":48213,"sha256":"3b0a7ca3a01569f4af07368009f9b6480354618beb93b7241df7c3dcf22619f5"};type=application/json' \
              --form 'content=@./correction.pdf;type=application/pdf'
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.correction.invalid
        - exam.sitting.correction.conflict
        - exam.sitting.correction.unavailable
        - exam.archived
        - exam.sitting.revision_conflict
        - exam.sitting.state_conflict
        - exam.sitting.deadline_reached
        - service.busy
        - exam.sitting.correction.content_invalid
        - exam.sitting.correction.stage_conflict
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        description: Two multipart parts in this order, the stage metadata and then the resource file.
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamSittingCorrectionResourceStageMultipart'
      responses:
        "201":
          $ref: '#/components/responses/ExamSittingCorrectionResourceStageCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    ExamSittingCorrectionResourceStageCreated:
      description: The content was uploaded and is ready to use in a correction of this Sitting.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingCorrectionResourceStageResponse'
          example:
            stage_id: iqcx3qc9sbbt6ocshszfqgq6ci
            resource_id: p6y6sf8ac6m5if373fkkebj7j6
            media_type: application/pdf
            size: 48213
            sha256: 3b0a7ca3a01569f4af07368009f9b6480354618beb93b7241df7c3dcf22619f5
            expires_at: '2026-12-14T10:47:12Z'
  schemas:
    ExamSittingCorrectionResourceStageMetadata:
      type: object
      additionalProperties: false
      required:
        - base_revision_id
        - target_kind
        - media_type
        - size
        - sha256
      description: >-
        What you are uploading. For an `addition`, leave out `replaces_resource_id`. For a `replacement`,
        it is required and names a resource in the base Revision.
      properties:
        base_revision_id:
          $ref: '#/components/schemas/ID'
          description: The Exam Revision the Sitting delivers now, which the correction will build on.
        target_kind:
          type: string
          enum:
            - addition
            - replacement
          description: >-
            `addition` uploads a new resource. `replacement` uploads new content for an existing resource.
        replaces_resource_id:
          $ref: '#/components/schemas/ID'
          description: The existing resource whose content you are replacing. Only for `replacement`.
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
          description: The file's media type.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: The file size in bytes, at most 100 MiB. It must match the uploaded content.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the file, as lowercase hex. It must match the uploaded content.
    ExamSittingCorrectionResourceStageMultipart:
      type: object
      additionalProperties: false
      required:
        - metadata
        - content
      description: >-
        Exactly two parts, in this order. First `metadata`, a JSON part that is not a file upload, at most
        32768 bytes. Then `content`, the file. The whole request body can be at most 100 MiB plus 64 KiB
        for multipart overhead.
      properties:
        metadata:
          $ref: '#/components/schemas/ExamSittingCorrectionResourceStageMetadata'
        content:
          type: string
          format: binary
          description: The resource file's bytes.
    ExamSittingCorrectionResourceStageResponse:
      description: A staged upload that is ready to use in a correction.
      type: object
      additionalProperties: false
      required:
        - stage_id
        - resource_id
        - media_type
        - size
        - sha256
        - expires_at
      properties:
        stage_id:
          $ref: '#/components/schemas/ID'
          description: The stage's ID. Pass it as `stage_id` in the correction's `resources`.
        resource_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The resource the content belongs to. For an addition this is a new ID; for a replacement it is
            the `replaces_resource_id` you sent.
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
          description: The uploaded file's media type.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: The uploaded file's size in bytes.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the uploaded file, as lowercase hex.
        expires_at:
          type: string
          format: date-time
          description: The time after which the stage can no longer be used in a correction.
