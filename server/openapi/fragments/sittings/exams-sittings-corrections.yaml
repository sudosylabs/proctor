paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/corrections:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: applyExamSittingCorrection
      summary: Create an immutable live correction and retarget one open or paused Sitting
      tags:
        - Sittings
      description: >-
        Publishes a corrected Exam Revision to an open or paused Sitting and switches the Sitting to it.
        The new Revision can't change afterwards. `resources` is the full list of resources you want, in
        order. A resource you leave out is removed, and its position in the array becomes its position in
        the Exam. A resource without `stage_id` keeps its current content. A resource with `stage_id` takes
        the content you uploaded to that stage. Leave out `instructions_markdown` to keep the current
        instructions, or send an empty string to clear them. You can't change the policy, the Starter
        Workspace, the Exam's default for future Sittings or the schedule here.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.correction.invalid
        - exam.sitting.correction.conflict
        - exam.sitting.correction.unavailable
        - exam.archived
        - exam.sitting.revision_conflict
        - exam.sitting.state_conflict
        - exam.sitting.deadline_reached
        - exam.sitting.correction.no_changes
        - exam.sitting.correction.manifest_conflict
        - exam.sitting.correction.stage_conflict
        - exam.resource.limit
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ApplyExamSittingCorrection'
      responses:
        "201":
          $ref: '#/components/responses/ExamSittingCorrectionCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ApplyExamSittingCorrection:
      description: >-
        The full ordered resource list, optional new instructions, the Sitting's current revision and the
        Exam Revision the Sitting currently delivers.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplyExamSittingCorrectionRequest'
          example:
            expected_revision: 8
            expected_current_revision_id: ybndrfg8ejkmcpqxot1uwisza3
            instructions_markdown: Read the corrected resource before continuing.
            candidate_summary: The formula sheet for Question 3 was corrected.
            affected_capabilities: [submission, workspace]
            acknowledgement_required: true
            reason: Question 3 contained an incorrect constant.
            resources:
              - resource_id: ybndrfg8ejkmcpqxot1uwisza4
                display_name: Corrected formula sheet
                description_markdown: Use this corrected sheet for Question 3.
                stage_id: ybndrfg8ejkmcpqxot1uwisza5
  responses:
    ExamSittingCorrectionCreated:
      description: The correction was published and the Sitting now delivers the corrected Revision.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingCorrectionResponse'
          example:
            affected_capabilities: [submission, workspace]
            exam_id: wj3drgzdpnf54rxf5d8qd3dqne
            exam_sitting_id: 14j8umgczgrdp95w77zuxmxfu9
            previous_revision_id: ih1r84kij94nrwis97rft6rduh
            revision_id: 889766ufjgio6kbpzjbufozksq
            revision_number: 3
            sitting_revision: 9
            sitting_state: open
            effective_at: '2026-12-14T09:52:30Z'
  schemas:
    ExamSittingCorrectionResourceRequest:
      type: object
      additionalProperties: false
      required:
        - resource_id
        - display_name
        - description_markdown
      description: >-
        One resource in the corrected Exam. Without `stage_id` the resource keeps its current content.
        With `stage_id` it takes the content uploaded to that stage, which must be ready and must have
        been staged for this resource and this Sitting.
      properties:
        resource_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The resource's ID. Use an existing resource's ID, or the `resource_id` returned when you staged
            a new resource.
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: The name candidates see, with no leading or trailing whitespace and at most 255 characters.
        description_markdown:
          type: string
          maxLength: 16384
          description: A Markdown description shown with the resource, at most 16384 bytes of UTF-8. Can be empty.
        stage_id:
          $ref: '#/components/schemas/ID'
          description: The staged upload whose content replaces or provides this resource's content.
    ApplyExamSittingCorrectionRequest:
      description: The corrected content for one open or paused Sitting.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - expected_current_revision_id
        - candidate_summary
        - affected_capabilities
        - acknowledgement_required
        - reason
        - resources
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Sitting's current revision, as last read. The request fails with a conflict if the Sitting
            has changed since.
        expected_current_revision_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Exam Revision the Sitting delivers now. The request fails with a conflict if another
            correction replaced it first.
        instructions_markdown:
          type: string
          maxLength: 65536
          description: >-
            New instructions in Markdown, at most 65536 bytes of UTF-8. Leave it out to keep the current
            instructions. Send an empty string to clear them. `null` is rejected.
        browser_policy:
          $ref: '#/components/schemas/BrowserPolicy'
          description: >-
            A new Browser Policy. Leave it out to keep the current one. If you send it, it replaces the
            current policy together with the rest of the correction.
        affected_capabilities:
          $ref: '#/components/schemas/CorrectionCapabilitySelection'
        candidate_summary:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            Plain text that tells candidates what changed. No leading or trailing whitespace and no control
            characters: at most 500 characters and 2000 bytes.
        acknowledgement_required:
          type: boolean
          description: >-
            Whether candidates must acknowledge the correction. While an acknowledgement is pending, the
            operations in `affected_capabilities` are blocked for that candidate.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Why you are correcting the Exam. It is kept for audit and is never shown to candidates. Send
            valid UTF-8 with no leading or trailing whitespace: at most 1000 characters and 4000 bytes.
        resources:
          type: array
          maxItems: 100
          description: >-
            Every resource the corrected Exam should have, in order. Resources you leave out are removed.
            Each `resource_id`, and each `stage_id` you send, must appear only once.
          items:
            $ref: '#/components/schemas/ExamSittingCorrectionResourceRequest'
    CorrectionCapabilitySelection:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      description: >-
        The candidate operations a correction affects, in sorted order. Changing the Browser Policy
        requires `browser`. Changing the instructions or resources requires `submission` and `workspace`.
        You may list more than the minimum. Listing capabilities without changing any content is rejected.
        The list is required even when `acknowledgement_required` is false.
      items:
        $ref: '#/components/schemas/CandidateCapability'
    CandidateCapability:
      type: string
      enum: [browser, submission, workspace]
      description: >-
        A group of candidate operations that a live correction can hold back until it is acknowledged.
        `browser` covers the exam browser, `submission` covers submitting the Attempt, and `workspace`
        covers changing the Workspace.
    ExamSittingCorrectionResponse:
      description: The new corrected Revision and the Sitting's state after the correction.
      type: object
      additionalProperties: false
      required:
        - exam_id
        - exam_sitting_id
        - previous_revision_id
        - revision_id
        - revision_number
        - sitting_revision
        - sitting_state
        - effective_at
        - affected_capabilities
      properties:
        affected_capabilities:
          $ref: '#/components/schemas/CorrectionCapabilitySelection'
          description: The candidate operations this correction affects, as sent in the request.
        exam_id:
          $ref: '#/components/schemas/ID'
          description: The Exam that was corrected.
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: The Sitting that now delivers the corrected Revision.
        previous_revision_id:
          $ref: '#/components/schemas/ID'
          description: The Exam Revision the Sitting delivered before this correction.
        revision_id:
          $ref: '#/components/schemas/ID'
          description: The new corrected Exam Revision.
        revision_number:
          type: integer
          format: int64
          minimum: 1
          description: The new Revision's number within the Exam.
        sitting_revision:
          type: integer
          format: int64
          minimum: 1
          description: The Sitting's revision after the correction. Use it as `expected_revision` next time.
        sitting_state:
          $ref: '#/components/schemas/ExamSittingState'
          description: The Sitting's state after the correction, either `open` or `paused`.
        effective_at:
          type: string
          format: date-time
          description: When the correction took effect.
