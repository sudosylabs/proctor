paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/extend:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: extendExamSitting
      summary: Extend the deadline of an open or paused Exam Sitting
      tags:
        - Sittings
      description: >-
        Moves the deadline of an open or paused Sitting to a later time. Send the Sitting's current
        revision; the request fails if it changed since you read it. The server checks again that the
        Class is eligible and that the new deadline fits its Academic Period. You can't shorten a Sitting
        or reopen a closed one.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.archived
        - exam.sitting.revision_conflict
        - exam.sitting.state_conflict
        - exam.sitting.deadline_reached
        - exam.sitting.extension_not_later
        - exam.sitting.class_ineligible
        - exam.sitting.schedule_outside_period
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ExtendExamSitting'
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ExtendExamSitting:
      description: The Sitting's current revision, the new later deadline, and a private reason.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtendExamSittingRequest'
          example:
            expected_revision: 6
            scheduled_end_at: "2026-12-14T11:30:00Z"
            reason: Thirty minutes were granted after a verified interruption.
  schemas:
    ExtendExamSittingRequest:
      description: A later deadline for an open or paused Sitting.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - scheduled_end_at
        - reason
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Sitting's current revision, as last read. The request fails with a conflict if the Sitting
            has changed since.
        scheduled_end_at:
          type: string
          format: date-time
          description: The new deadline. It must be later than the current deadline.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Why you are extending the Sitting. It is kept for audit and is never shown to candidates. Send
            valid UTF-8 with no leading or trailing whitespace: 1 to 1000 characters and at most 4000 bytes.
