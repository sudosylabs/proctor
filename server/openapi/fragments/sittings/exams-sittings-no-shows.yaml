paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/no-shows:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: listExamSittingNoShows
      summary: List candidates who were Class members at actual start but never created an Attempt
      tags:
        - Sittings
      description: >-
        Lists the candidates who were members of the Class when the Sitting actually opened and who never
        started an Attempt. Absence never creates an Attempt or Submission. The list is available only
        while the Sitting is `closing` or `closed`; in any other state the request fails with a conflict.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - exam.sitting.state_conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of no-show candidate identities to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            The `next_cursor` from the previous page. Pass it back unchanged and do not parse or build it
            yourself.
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingNoShowListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    ExamSittingNoShowListOK:
      description: One page of candidates who were in the Class when the Sitting opened and have no Attempt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingNoShowListResponse'
          example:
            items:
              - candidate_user_id: sjebyge5cpbop1xwo4eds74ejb
                candidate:
                  id: sjebyge5cpbop1xwo4eds74ejb
                  username: arao
                  display_name: Asha Rao
                class_member_since: "2026-09-04T08:00:00Z"
              - candidate_user_id: hmyjmj68dw6gdxctnghbrhwcth
                candidate:
                  id: hmyjmj68dw6gdxctnghbrhwcth
                  username: tkim
                  display_name: Tomas Kim
                class_member_since: "2026-09-04T08:00:00Z"
            next_cursor: eyJjYW5kaWRhdGVfdXNlcl9pZCI6ImhteWptajY4ZHc2Z2R4Y3RuZ2hicmh3Y3RoIn0
  schemas:
    ExamSittingNoShowResponse:
      description: A candidate who was in the Class when the Sitting opened and never started an Attempt.
      type: object
      additionalProperties: false
      required:
        - candidate_user_id
        - candidate
        - class_member_since
      properties:
        candidate_user_id:
          $ref: '#/components/schemas/ID'
          description: The candidate's user ID.
        candidate:
          description: The candidate, in the same shape the candidate statuses use.
          $ref: '#/components/schemas/PersonRef'
        class_member_since:
          type: string
          format: date-time
          description: When the class membership the candidate held as the Sitting opened began.
    ExamSittingNoShowListResponse:
      description: One page of no-show candidates, ordered by user ID.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          description: The no-show candidates on this page, at most `limit`.
          items:
            $ref: '#/components/schemas/ExamSittingNoShowResponse'
        next_cursor:
          type: string
          description: >-
            Pass this as `cursor` to get the next page. Omitted on the last page. Don't parse or
            build it yourself.
