paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/resume:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: resumeExamSitting
      summary: Resume a paused Exam Sitting with a private manager reason
      tags:
        - Sittings
      description: >-
        Resumes a paused Sitting. Send the Sitting's current revision; the request fails if it changed
        since you read it. The server checks the Exam and the delivery window again first. Resuming does
        not renew candidate Participation credentials that expired during the pause. Those candidates
        reconnect, or are re-allowed, as usual.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.archived
        - exam.sitting.revision_conflict
        - exam.sitting.state_conflict
        - exam.sitting.deadline_reached
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ResumeExamSitting'
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ResumeExamSitting:
      description: The Sitting's current revision and a private reason for resuming.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingManagerTransitionRequest'
          example:
            expected_revision: 5
            reason: The network interruption has been resolved.
