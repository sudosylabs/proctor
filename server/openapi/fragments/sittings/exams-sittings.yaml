paths:
  /api/v1/exams/{exam_id}/sittings:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      operationId: listExamSittings
      summary: List bounded Exam Sittings ordered by scheduled start and identity descending
      tags:
        - Sittings
      description: >-
        Lists the Sittings of one Exam, latest scheduled start first. You can filter by Class, by state,
        and by a time window the Sitting overlaps. The response never includes candidate credentials,
        private reasons, answers or integrity evidence.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: class_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Sittings for this Class.
        - name: state
          in: query
          required: false
          description: >-
            Return only Sittings in these states. Repeat the parameter to match several states; duplicates
            are ignored.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            items:
              $ref: '#/components/schemas/ExamSittingState'
        - name: ends_after
          in: query
          required: false
          description: >-
            Return only Sittings that end after this time. Send it together with `starts_before`, and make
            it earlier than `starts_before`.
          schema:
            type: string
            format: date-time
        - name: starts_before
          in: query
          required: false
          description: >-
            Return only Sittings that start before this time. Send it together with `ends_after`. The two
            together select Sittings that overlap the window.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of Sittings to return.
        - name: cursor
          in: query
          required: false
          description: >-
            The `next_cursor` from the previous page. Pass it back unchanged and do not parse or build it
            yourself.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: scheduleExamSitting
      summary: Schedule one immutable Exam Revision for one Class
      tags:
        - Sittings
      description: >-
        Schedules a published Exam Revision for one Class, within the Class's Academic Period. Before
        saving, the server checks that the Revision belongs to this Exam, that the Class is eligible, and
        that the window is in the future.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.archived
        - exam.sitting.class_ineligible
        - exam.sitting.schedule_outside_period
        - exam.sitting.schedule_not_future
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ScheduleExamSitting'
      responses:
        "201":
          $ref: '#/components/responses/ExamSittingCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: getExamSitting
      summary: Get one bounded Exam Sitting
      tags:
        - Sittings
      description: >-
        Returns one Sitting of the Exam, including its lifecycle times and current revision. Private
        manager reasons and candidate details are not included.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateExamSittingSchedule
      summary: Change the pre-open Exam Revision, Class, or schedule
      tags:
        - Sittings
      description: >-
        Changes the Exam Revision, Class or schedule of a Sitting that has not opened yet. Send the
        Sitting's current revision; the request fails if the Sitting changed since you read it. After
        the Sitting opens, these values can't change here. Use live corrections or the lifecycle
        operations (pause, resume, extend, close) instead.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.archived
        - exam.sitting.revision_conflict
        - exam.sitting.no_changes
        - exam.sitting.state_conflict
        - exam.sitting.class_ineligible
        - exam.sitting.schedule_outside_period
        - exam.sitting.schedule_not_future
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/UpdateExamSittingSchedule'
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ScheduleExamSitting:
      description: The published Exam Revision, the Class, and the future time window for the new Sitting.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScheduleExamSittingRequest'
          example:
            exam_revision_id: ybndrfg8ejkmcpqxot1uwisza3
            class_id: ybndrfg8ejkmcpqxot1uwisza4
            scheduled_start_at: "2026-12-14T09:00:00Z"
            scheduled_end_at: "2026-12-14T11:00:00Z"
            join_window:
              opens_at: "2026-12-14T08:50:00Z"
              closes_at: "2026-12-14T09:30:00Z"
    UpdateExamSittingSchedule:
      description: The Sitting's current revision and at least one value to change.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateExamSittingScheduleRequest'
          example:
            expected_revision: 3
            scheduled_start_at: "2026-12-14T09:30:00Z"
            scheduled_end_at: "2026-12-14T11:30:00Z"
            join_window:
              opens_at: "2026-12-14T09:20:00Z"
  responses:
    ExamSittingCreated:
      description: The Sitting was scheduled.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingResponse'
          example:
            id: 14j8umgczgrdp95w77zuxmxfu9
            exam_id: wj3drgzdpnf54rxf5d8qd3dqne
            exam_revision_id: ih1r84kij94nrwis97rft6rduh
            class_id: 1asb7sk89dp1ex339fkh3te5t4
            scheduled_start_at: '2026-12-14T09:00:00Z'
            scheduled_end_at: '2026-12-14T11:00:00Z'
            join_opens_at: '2026-12-14T08:50:00Z'
            join_closes_at: '2026-12-14T09:30:00Z'
            state: scheduled
            created_at: '2026-11-20T14:12:05Z'
            updated_at: '2026-11-20T14:12:05Z'
            revision: 1
    ExamSittingListOK:
      description: One page of Sittings.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingListResponse'
          example:
            items:
              - id: 14j8umgczgrdp95w77zuxmxfu9
                exam_id: wj3drgzdpnf54rxf5d8qd3dqne
                exam_revision_id: ih1r84kij94nrwis97rft6rduh
                class_id: 1asb7sk89dp1ex339fkh3te5t4
                scheduled_start_at: '2026-12-14T09:00:00Z'
                scheduled_end_at: '2026-12-14T11:00:00Z'
                state: scheduled
                created_at: '2026-11-20T14:12:05Z'
                updated_at: '2026-11-20T14:12:05Z'
                revision: 1
              - id: saqjfmjqqy9mo1yj4zwed73333
                exam_id: wj3drgzdpnf54rxf5d8qd3dqne
                exam_revision_id: g63dcrphk8idgyjgzbrpajosz6
                class_id: 1asb7sk89dp1ex339fkh3te5t4
                scheduled_start_at: '2026-12-07T09:00:00Z'
                scheduled_end_at: '2026-12-07T11:00:00Z'
                state: closed
                created_at: '2026-11-18T10:30:00Z'
                updated_at: '2026-12-07T11:00:41Z'
                opened_at: '2026-12-07T09:00:01Z'
                closing_at: '2026-12-07T11:00:00Z'
                closed_at: '2026-12-07T11:00:41Z'
                reason_code: scheduled_end_reached
                revision: 4
            next_cursor: eyJzdGFydF9hdCI6IjIwMjYtMTItMDdUMDk6MDA6MDBaIiwiaWQiOiJzYXFqZm1qcXF5OW1vMXlqNHp3ZWQ3MzMzMyJ9
  schemas:
    ScheduleExamSittingRequest:
      description: The Exam Revision, Class and time window for a new Sitting.
      type: object
      additionalProperties: false
      required:
        - exam_revision_id
        - class_id
        - scheduled_start_at
        - scheduled_end_at
      properties:
        exam_revision_id:
          $ref: '#/components/schemas/ID'
          description: The published Exam Revision to deliver. It must belong to this Exam.
        class_id:
          $ref: '#/components/schemas/ID'
          description: The Class whose members can take the Sitting.
        scheduled_start_at:
          type: string
          format: date-time
          description: When the Sitting opens. It must be in the future and inside the Class's Academic Period.
        scheduled_end_at:
          type: string
          format: date-time
          description: The Sitting's deadline. It must be after the start and inside the Class's Academic Period.
        join_window:
          $ref: '#/components/schemas/ExamSittingJoinWindow'
    ExamSittingJoinWindow:
      description: >-
        When candidates may start a new Attempt. Leave a bound out for none. opens_at, at or before the start, opens
        the Sitting at that time instead, so it must be in the future and inside the Class's Academic Period; the
        deadline does not move. closes_at, after the start and at or before the deadline, refuses first entry from
        then on with exam.attempt.join_closed, while candidates who already started carry on. The window is frozen
        once the Sitting opens.
      type: object
      additionalProperties: false
      properties:
        opens_at:
          type: string
          format: date-time
          description: When candidates can start joining.
        closes_at:
          type: string
          format: date-time
          description: When candidates who have not started can no longer join.
    UpdateExamSittingScheduleRequest:
      description: >-
        Changes to a Sitting that has not opened yet. Send the current revision and at least one value to
        change. Members you leave out keep their current value.
      type: object
      additionalProperties: false
      required:
        - expected_revision
      anyOf:
        - required:
            - exam_revision_id
        - required:
            - class_id
        - required:
            - scheduled_start_at
        - required:
            - scheduled_end_at
        - required:
            - join_window
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Sitting's current revision, as last read. The request fails with a conflict if the Sitting
            has changed since.
        exam_revision_id:
          $ref: '#/components/schemas/ID'
          description: A different published Revision of this Exam to deliver.
        class_id:
          $ref: '#/components/schemas/ID'
          description: A different Class to deliver the Sitting to.
        scheduled_start_at:
          type: string
          format: date-time
          description: A new opening time. It must be in the future and inside the Class's Academic Period.
        scheduled_end_at:
          type: string
          format: date-time
          description: A new deadline. It must be after the start and inside the Class's Academic Period.
        join_window:
          $ref: '#/components/schemas/ExamSittingJoinWindow'
          description: >-
            A new join window, replacing the whole current one; {} removes it. Left out, the current window is kept
            and checked against the new times.
    ExamSittingListResponse:
      description: One page of Sittings, latest scheduled start first.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          description: The Sittings on this page, at most `limit`.
          items:
            $ref: '#/components/schemas/ExamSittingResponse'
        next_cursor:
          type: string
          description: >-
            Pass this as `cursor` to get the next page. Omitted on the last page. Don't parse or
            build it yourself.
