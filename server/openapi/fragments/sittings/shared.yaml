components:
  responses:
    ExamSittingOK:
      description: The Sitting's current state.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingResponse'
          example:
            id: 14j8umgczgrdp95w77zuxmxfu9
            exam_id: wj3drgzdpnf54rxf5d8qd3dqne
            exam_revision_id: ih1r84kij94nrwis97rft6rduh
            class_id: 1asb7sk89dp1ex339fkh3te5t4
            scheduled_start_at: '2026-12-14T09:00:00Z'
            scheduled_end_at: '2026-12-14T11:00:00Z'
            join_opens_at: '2026-12-14T08:50:00Z'
            join_closes_at: '2026-12-14T09:30:00Z'
            state: paused
            created_at: '2026-11-20T14:12:05Z'
            updated_at: '2026-12-14T09:41:17Z'
            opened_at: '2026-12-14T09:00:02Z'
            paused_at: '2026-12-14T09:41:17Z'
            revision: 3
  schemas:
    ExamSittingManagerTransitionRequest:
      description: The Sitting revision you last read and a private reason for the lifecycle change.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - reason
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Sitting's current revision, as last read. The request fails with a conflict if the Sitting
            has changed since.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Why you are making the change. It is kept for audit and is never shown to candidates. Send
            valid UTF-8 with no leading or trailing whitespace: 1 to 1000 characters and at most 4000 bytes.
    ExamSittingState:
      description: >-
        Where the Sitting is in its lifecycle. `scheduled` has not opened yet. `open` accepts candidates.
        `paused` is temporarily stopped. `closing` is sealing unfinished Attempts. `closed` and `canceled`
        are final.
      type: string
      enum:
        - scheduled
        - open
        - paused
        - closing
        - closed
        - canceled
    ExamSittingReasonCode:
      description: >-
        Why the Sitting was canceled or closed. `manager_canceled`, `schedule_elapsed` and
        `academic_structure_invalid` explain a cancellation. `manager_closed` and `scheduled_end_reached`
        explain a closure. The code never contains the manager's private reason.
      type: string
      enum:
        - manager_canceled
        - schedule_elapsed
        - academic_structure_invalid
        - manager_closed
        - scheduled_end_reached
    ExamSittingResponse:
      description: >-
        One Sitting as a manager sees it. It never includes candidate credentials, answers or integrity
        evidence. Managers' private reasons appear only in history, only to those who may manage the Sitting.
      type: object
      additionalProperties: false
      required:
        - id
        - exam_id
        - exam_revision_id
        - class_id
        - scheduled_start_at
        - scheduled_end_at
        - state
        - created_at
        - updated_at
        - revision
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The Sitting's ID.
        exam_id:
          $ref: '#/components/schemas/ID'
          description: The Exam this Sitting delivers.
        exam_revision_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Exam Revision candidates receive. A live correction replaces it with the corrected
            Revision.
        class_id:
          $ref: '#/components/schemas/ID'
          description: The Class whose members can take this Sitting.
        scheduled_start_at:
          type: string
          format: date-time
          description: When the Sitting opens and every Attempt can start, whether or not candidates joined early.
        scheduled_end_at:
          type: string
          format: date-time
          description: The Sitting's deadline. An extension moves it later.
        join_opens_at:
          type: string
          format: date-time
          description: >-
            When candidates can join early, at or before the scheduled start. From then until the start they can run
            the readiness checks and read the instructions; nobody can start an Attempt or touch a workspace before
            the start, so working time is the same for everyone. Present only when set. It is frozen once the Sitting
            opens.
        join_closes_at:
          type: string
          format: date-time
          description: >-
            After this time no candidate can start a new Attempt, and admission fails with
            exam.attempt.join_closed. Candidates who already started can reconnect until the deadline. It is after
            the scheduled start and at or before the deadline. Present only when set. It is frozen once the Sitting
            opens.
        state:
          $ref: '#/components/schemas/ExamSittingState'
        created_at:
          type: string
          format: date-time
          description: When the Sitting was scheduled.
        updated_at:
          type: string
          format: date-time
          description: When the Sitting last changed.
        opened_at:
          type: string
          format: date-time
          description: When the Sitting opened. Omitted until it opens.
        paused_at:
          type: string
          format: date-time
          description: >-
            When the current pause began. Present only while the Sitting is paused; resuming or closing
            removes it.
        closing_at:
          type: string
          format: date-time
          description: When closing began. Omitted until the Sitting starts closing.
        closed_at:
          type: string
          format: date-time
          description: When the Sitting finished closing. Omitted until it is closed.
        canceled_at:
          type: string
          format: date-time
          description: When the Sitting was canceled. Omitted unless it was canceled.
        reason_code:
          $ref: '#/components/schemas/ExamSittingReasonCode'
          description: Why the Sitting was canceled or began closing. Omitted until one of those happens.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Goes up by one with every change to the Sitting. Send it as `expected_revision` when you
            change the Sitting.
        candidate_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            How many candidates the Sitting's board lists: everyone with an Attempt and the Class members it
            admits. Present on reads, not on the result of a change. Counting stops at 10,000.
        candidate_count_is_lower_bound:
          type: boolean
          description: True when counting stopped at its bound, so candidate_count is "at least". Present with candidate_count.
        corrections:
          type: array
          maxItems: 32
          description: >-
            The Sitting's live corrections, oldest first, with how many candidates have acknowledged each.
            Present when reading one Sitting.
          items:
            $ref: '#/components/schemas/ExamSittingCorrectionSummary'
        history:
          type: array
          maxItems: 20
          description: >-
            Manager actions on the Sitting with the manager's private reason, newest first. Present only when
            reading one Sitting as someone who may manage it; never shown to candidates.
          items:
            $ref: '#/components/schemas/ExamSittingHistoryEntry'
    ExamSittingCorrectionSummary:
      description: One live correction and how many of the candidates it applies to have acknowledged it.
      type: object
      additionalProperties: false
      required:
        - revision_id
        - number
        - effective_at
        - acknowledgement_required
        - acknowledged_count
        - required_count
      properties:
        revision_id:
          $ref: '#/components/schemas/ID'
          description: The correction's Revision.
        number:
          type: integer
          format: int64
          minimum: 1
          description: The correction Revision's number.
        effective_at:
          type: string
          format: date-time
          description: When the correction took effect.
        acknowledgement_required:
          type: boolean
          description: Whether candidates must acknowledge the correction.
        acknowledged_count:
          type: integer
          minimum: 0
          description: How many candidates have acknowledged it.
        required_count:
          type: integer
          minimum: 0
          description: >-
            How many candidates must acknowledge it: those admitted before it who had not submitted when it took
            effect. Zero when no acknowledgement is required.
    ExamSittingHistoryEntry:
      description: One manager action on a Sitting and the manager's private reason.
      type: object
      additionalProperties: false
      required:
        - kind
        - at
        - by_user_id
        - reason
      properties:
        kind:
          type: string
          enum:
            - canceled
            - paused
            - resumed
            - extended
            - closed
          description: What the manager did.
        at:
          type: string
          format: date-time
          description: When.
        by_user_id:
          $ref: '#/components/schemas/ID'
          description: The manager who acted.
        by:
          $ref: '#/components/schemas/PersonRef'
          description: The manager who acted, named.
        reason:
          type: string
          description: The manager's private reason, in their words.
