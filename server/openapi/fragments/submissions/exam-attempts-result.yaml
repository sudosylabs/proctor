paths:
  /api/v1/exam-attempts/{exam_attempt_id}/result:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: getStudentExamResult
      summary: Get only the explicitly released candidate result projection
      tags:
        - Submissions
      description: >-
        Returns the candidate's result once a manager has finalized the review and released it. Until then
        the result is not available. The result never includes private notes, manager reasons, integrity
        evidence, decisions or unreleased grading data.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/StudentExamResultOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    StudentExamResultOK:
      description: The released result.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentExamResultResponse'
          example:
            submission_review_id: 5ebqfbnezgahdbx9oy7rfr6oro
            submission_id: 39kqk53i4cswfzbi7hbai1r8qg
            receipt_code: 7QXR-4M2K-HV9D-3JNP
            exam_attempt_id: 6xoche483hwrx5rpu8jzjoe7qg
            student_remarks_markdown: Your submission was reviewed and no further action is needed.
            released_at: '2026-12-18T15:20:00Z'
  schemas:
    StudentExamResultResponse:
      description: A released result. It contains only what the manager approved for the candidate.
      type: object
      additionalProperties: false
      required:
        - submission_review_id
        - submission_id
        - receipt_code
        - exam_attempt_id
        - student_remarks_markdown
        - released_at
      properties:
        submission_review_id:
          $ref: '#/components/schemas/ID'
          description: The review the result comes from.
        submission_id:
          $ref: '#/components/schemas/ID'
          description: The Submission that was reviewed.
        receipt_code:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$
          description: >-
            The Submission's receipt code, the same value the candidate got when they submitted, in groups of four
            separated by hyphens.
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
          description: The candidate's Attempt.
        student_remarks_markdown:
          type: string
          maxLength: 8192
          description: >-
            The manager's remarks for the candidate, in Markdown, cleaned of unsafe content before they are
            returned. They can't change after release. Can be empty.
        released_at:
          type: string
          format: date-time
          description: When the result was released.
