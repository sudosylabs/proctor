paths:
  /api/v1/exam-attempts/{exam_attempt_id}/corrections/{exam_revision_id}/acknowledgement:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/ExamRevisionID'
    put:
      operationId: acknowledgeExamAttemptCorrection
      summary: Acknowledge one required live correction for an active Attempt
      description: >-
        Records that the candidate has read the oldest correction still waiting for acknowledgement. The
        server first checks the current Revision, the active Participation and its generation, the
        registered desktop Session, the Attempt credential and the open Attempt connection. Repeating the
        request with the same Idempotency-Key returns the saved acknowledgement and changes nothing else.
      tags:
        - Submissions
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.revision_conflict
        - exam.attempt.correction_conflict
        - exam.attempt.state_conflict
        - exam.attempt.sitting_not_open
        - exam.attempt.connection_closed
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authorization.unavailable
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/AcknowledgeExamCorrection'
      responses:
        '200':
          $ref: '#/components/responses/ExamCorrectionAcknowledged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/submissions:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: submitExamAttempt
      summary: Seal one active Exam Attempt and return a candidate-safe receipt
      tags:
        - Submissions
      description: >-
        Submits an active Attempt. In one step the server seals the Workspace as the client last saw it
        acknowledged and records the final integrity position. It checks the Session's Attempt credential
        and connection, and that the candidate is still in the Class. Repeating the request with the same
        Idempotency-Key returns the same 201 receipt without repeating realtime notifications or other side
        effects.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/exam-attempts/6xoche483hwrx5rpu8jzjoe7qg/submissions' \
              --header 'Authorization: DPoP <desktop-session-access-credential>' \
              --header 'DPoP: <fresh-proof-for-this-post-target-and-current-nonce>' \
              --header 'X-Proctor-Attempt-Credential: <attempt-credential>' \
              --header 'X-Proctor-Attempt-Connection-ID: <attempt-connection-id>' \
              --header 'Idempotency-Key: docs-submit-001' \
              --header 'Content-Type: application/json' \
              --data '{"participation_id":"o87yi4tenx8kodmcuup1hmtsbo","generation":2,"expected_current_revision_id":"ih1r84kij94nrwis97rft6rduh","expected_workspace_cursor":18,"final_focus_loss_sequence":3}'
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.attempt.workspace.cursor_conflict
        - exam.attempt.focus_loss_conflict
        - exam.attempt.revision_conflict
        - exam.attempt.correction_conflict
        - exam.attempt.browser_activity_conflict
        - exam.attempt.connection_lost
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SubmitExamAttempt'
      responses:
        '201':
          $ref: '#/components/responses/ExamSubmissionReceiptCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    AcknowledgeExamCorrection:
      description: >-
        The active Participation, its generation and the current Revision the client shows, for the
        correction named in the path.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcknowledgeExamCorrectionRequest'
          example:
            participation_id: ybndrfg8ejkmcpqxot1uwisza4
            generation: 2
            expected_current_revision_id: ybndrfg8ejkmcpqxot1uwisza5
    SubmitExamAttempt:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubmitExamAttemptRequest'
          example:
            participation_id: ybndrfg8ejkmcpqxot1uwisza4
            generation: 2
            expected_current_revision_id: ybndrfg8ejkmcpqxot1uwisza5
            expected_workspace_cursor: 18
            final_focus_loss_sequence: 3
      description: >-
        The active Participation and its generation, plus the last Workspace cursor and focus-loss sequence
        the client saw acknowledged.
  responses:
    ExamCorrectionAcknowledged:
      description: >-
        The correction is acknowledged. Repeating the request with the same Idempotency-Key returns the same
        acknowledgement.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcknowledgeExamCorrectionResponse'
          example:
            current_revision_id: 889766ufjgio6kbpzjbufozksq
            revision_id: 889766ufjgio6kbpzjbufozksq
            acknowledgement_state: acknowledged
            acknowledged_at: '2026-12-14T09:55:03Z'
            runtime_capabilities:
              schema_version: 1
              server_time: '2026-12-14T09:55:03Z'
              interaction_state: interactive
              attempt_configuration:
                attempt_configuration_revision: yftfs48pasu5fd6czhcwz6b4x3
                presentation:
                  color_theme: dark
                  prefer_high_contrast: false
                  zoom_percent: 100
                  editor_font_size_px: 14
                  editor_line_height_px: 22
                  reduced_motion: false
                  screen_reader_mode: auto
                  announcement_mode: auto
                  cursor_style: line
                  cursor_blinking: blink
                approved_commands: []
                approved_keybindings: []
                digest: sha256:af0e275da6b68d95fa034c87358d9736e4502c8602f32f8b89ee4e04ce5ac137
              focus_loss_collection_enabled: true
              pending_correction_capabilities: []
              workspace_mutation_allowed: true
              submission_allowed: true
              browser:
                state: disabled
              exam_revision:
                admission_revision_id: ih1r84kij94nrwis97rft6rduh
                current_revision_id: 889766ufjgio6kbpzjbufozksq
                acknowledgement_required: false
              departure:
                allowed: false
                reason: attempt_in_progress
    ExamSubmissionReceiptCreated:
      description: >-
        The Attempt was submitted. Repeating the request with the same Idempotency-Key returns the same
        receipt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSubmissionReceiptResponse'
          example:
            submission_id: 39kqk53i4cswfzbi7hbai1r8qg
            receipt_code: 7QXR-4M2K-HV9D-3JNP
            exam_attempt_id: 6xoche483hwrx5rpu8jzjoe7qg
            exam_revision_id: ih1r84kij94nrwis97rft6rduh
            state: submitted
            workspace_cursor: 18
            manifest_digest: 11ae3038c1fe627502b6596d5598808bb5339e26b1bfed1924adec0458cc1b26
            submitted_at: '2026-12-14T10:48:09Z'
            browser_activity:
              state: not_applicable
              inventory_revision: 1
              source_count: 0
              pending_source_count: 0
              incomplete_source_count: 0
  schemas:
    SubmitExamAttemptRequest:
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - expected_current_revision_id
        - expected_workspace_cursor
        - final_focus_loss_sequence
      properties:
        participation_id:
          $ref: '#/components/schemas/ID'
          description: The active Participation ID returned when the Attempt connected.
        generation:
          type: integer
          format: int64
          minimum: 1
          description: The generation of the active Participation, returned when the Attempt connected.
        expected_current_revision_id:
          $ref: '#/components/schemas/ID'
          description: The Exam Revision the client is showing. The request fails if a correction replaced it.
        expected_workspace_cursor:
          type: integer
          format: int64
          minimum: 0
          description: The last Workspace change cursor the server acknowledged to the client.
        final_focus_loss_sequence:
          type: integer
          format: int64
          minimum: 0
          description: The last focus-loss sequence number the client reported. Send 0 if it reported none.
      description: >-
        What the client last saw: the acknowledged Workspace, the current Exam Revision and the final
        focus-loss sequence. The server works out browser activity itself across every source in the
        Attempt, so browser activity members are not accepted.
    AcknowledgeExamCorrectionRequest:
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - expected_current_revision_id
      description: The active Participation and the Revision the client shows when acknowledging.
      properties:
        participation_id:
          $ref: '#/components/schemas/ID'
          description: The active Participation ID returned when the Attempt connected.
        generation:
          type: integer
          format: int64
          minimum: 1
          description: The generation of the active Participation.
        expected_current_revision_id:
          $ref: '#/components/schemas/ID'
          description: >-
            The Exam Revision the client is showing. The request fails if another correction replaced it.
    AcknowledgeExamCorrectionResponse:
      type: object
      additionalProperties: false
      description: The saved acknowledgement and what the candidate can do now.
      required:
        - revision_id
        - current_revision_id
        - runtime_capabilities
        - acknowledgement_state
        - acknowledged_at
      properties:
        current_revision_id:
          $ref: '#/components/schemas/ID'
          description: The Exam Revision the Sitting delivers now.
        runtime_capabilities:
          $ref: '#/components/schemas/CandidateRuntimeCapabilities'
          description: What the candidate can do after this acknowledgement.
        revision_id:
          $ref: '#/components/schemas/ID'
          description: The correction Revision that was acknowledged.
        acknowledgement_state:
          type: string
          const: acknowledged
          description: Always `acknowledged`.
        acknowledged_at:
          type: string
          format: date-time
          description: When the candidate acknowledged the correction.
    ExamSubmissionReceiptResponse:
      description: >-
        The receipt for a sealed Submission. It is safe to show the candidate and is the same every time it
        is returned.
      type: object
      additionalProperties: false
      required:
        - submission_id
        - receipt_code
        - exam_attempt_id
        - exam_revision_id
        - state
        - workspace_cursor
        - manifest_digest
        - submitted_at
        - browser_activity
      properties:
        submission_id:
          $ref: '#/components/schemas/ID'
          description: The Submission's ID.
        receipt_code:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}$
          description: >-
            Short receipt code the candidate can read out to identify this Submission, such as
            `MBY3-KBMN-EB83-TFW1`. It is minted once when the Submission seals, is unique across Submissions, and
            every replay returns it unchanged. It is sixteen Crockford base32 characters (no I, L, O, or U) in
            groups of four separated by hyphens.
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
          description: The Attempt that was sealed.
        exam_revision_id:
          $ref: '#/components/schemas/ID'
          description: The Exam Revision the Sitting delivered when the Submission was sealed.
        state:
          type: string
          const: submitted
          description: Always `submitted`.
        workspace_cursor:
          type: integer
          format: int64
          minimum: 0
          description: The last acknowledged Workspace change cursor, which is what was sealed.
        manifest_digest:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the sealed Workspace manifest, as lowercase hex.
        submitted_at:
          type: string
          format: date-time
          description: When the Submission was sealed.
        browser_activity:
          $ref: '#/components/schemas/BrowserSubmissionSettlement'
    BrowserSubmissionSettlement:
      type: object
      additionalProperties: false
      required:
        - state
        - inventory_revision
        - source_count
        - pending_source_count
        - incomplete_source_count
      properties:
        state:
          type: string
          enum:
            - not_applicable
            - settled
            - pending
            - incomplete
          description: >-
            `not_applicable` when the Attempt has no browser sources. Otherwise `pending` while any source
            can still deliver, then `incomplete` if any source is missing data, or `settled` when every
            source is complete.
        inventory_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Starts at 1 and goes up each time the server updates this summary.
        source_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: The number of browser activity sources across all Participations in the Attempt.
        pending_source_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: The number of sources that can still deliver activity. At most `source_count`.
        incomplete_source_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: >-
            The number of sources with missing or unretained activity. At most `source_count`. A source can
            be both pending and incomplete.
      description: >-
        The server's summary of browser activity across every source and Participation in the Attempt.
        Activity that arrives late but is still accepted updates this summary. It never changes the
        submitted work.
