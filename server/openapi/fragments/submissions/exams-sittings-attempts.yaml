paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/end:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: endExamAttemptByManager
      summary: End and seal one unfinished Exam Attempt
      tags:
        - Submissions
      description: >-
        Ends one active, ready or suspended Attempt on behalf of the candidate. The candidate's last
        acknowledged Workspace state is sealed as a Submission in the same step. Your reason is kept for
        audit and is never shown to the candidate. Once the Sitting deadline is reached, scheduled closure
        seals the Attempt instead.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.revision_conflict
        - exam.attempt.state_conflict
        - exam.attempt.sitting_not_open
        - exam.attempt.management_authority_conflict
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EndExamAttemptByManager'
      responses:
        '200':
          $ref: '#/components/responses/ExamSubmissionReceiptOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/submissions/{submission_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: getExamSubmission
      summary: Get one protected immutable Submission header
      tags:
        - Submissions
      description: >-
        Returns the summary of one sealed Submission: what was sealed, its size, and the state of its
        integrity data. You must currently manage the Exam. If the Submission does not belong to the Exam,
        Sitting and Attempt in the path, the request fails as not found.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/ExamSubmissionManagerOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/submissions/{submission_id}/manifest:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: listExamSubmissionManifest
      summary: List one protected immutable Submission manifest page
      tags:
        - Submissions
      description: >-
        Lists the files and directories sealed in one Submission, one page at a time. The page cursor
        never contains a file path or storage location.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of manifest entries to return.
        - name: cursor
          in: query
          required: false
          description: >-
            The `next_cursor` from the previous page. Pass it back unchanged and do not parse or build it
            yourself.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ExamSubmissionManifestOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/submissions/{submission_id}/files/{attempt_workspace_entry_id}/content:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/SubmissionID'
      - $ref: '#/components/parameters/AttemptWorkspaceEntryID'
    get:
      operationId: getExamSubmissionFileContent
      summary: Render one protected immutable Submission file inline
      tags:
        - Submissions
      description: >-
        Returns the exact bytes of one sealed file, whether it came from the Starter Workspace or was
        written during the Attempt. The bytes are served by Proctor itself. This is not a public link or an
        export, and it reveals no storage location.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.delivery.metadata_capacity
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: >-
            The `ETag` from an earlier response for this file. If it still matches, the server returns 304
            with no body.
      responses:
        '200':
          $ref: '#/components/responses/ExamSubmissionFileContent'
        '304':
          $ref: '#/components/responses/ExamSubmissionFileNotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        "409":
          $ref: '#/components/responses/Conflict'
components:
  requestBodies:
    EndExamAttemptByManager:
      description: >-
        The Attempt's current revision and your private reason for ending it before the Sitting deadline.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndExamAttemptByManagerRequest'
          example:
            expected_revision: 7
            reason: Candidate requested an early end after completing the exam.
  responses:
    ExamSubmissionReceiptOK:
      description: >-
        The receipt for the Submission. Repeating the request with the same Idempotency-Key returns the same
        receipt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSubmissionReceiptResponse'
          example:
            submission_id: 39kqk53i4cswfzbi7hbai1r8qg
            receipt_code: 7QXR-4M2K-HV9D-3JNP
            exam_attempt_id: 6xoche483hwrx5rpu8jzjoe7qg
            exam_revision_id: ih1r84kij94nrwis97rft6rduh
            state: submitted
            workspace_cursor: 18
            manifest_digest: 11ae3038c1fe627502b6596d5598808bb5339e26b1bfed1924adec0458cc1b26
            submitted_at: '2026-12-14T10:48:09Z'
            browser_activity:
              state: not_applicable
              inventory_revision: 1
              source_count: 0
              pending_source_count: 0
              incomplete_source_count: 0
    ExamSubmissionManagerOK:
      description: The Submission summary.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSubmissionManagerResponse'
          example:
            submission_id: 39kqk53i4cswfzbi7hbai1r8qg
            exam_id: wj3drgzdpnf54rxf5d8qd3dqne
            exam_sitting_id: 14j8umgczgrdp95w77zuxmxfu9
            exam_attempt_id: 6xoche483hwrx5rpu8jzjoe7qg
            exam_revision_id: ih1r84kij94nrwis97rft6rduh
            workspace_id: fotnmte5o3j9wftdm5rtbfofqr
            manifest_schema_version: 1
            workspace_cursor: 18
            manifest_digest: 11ae3038c1fe627502b6596d5598808bb5339e26b1bfed1924adec0458cc1b26
            manifest_entry_count: 3
            manifest_total_file_bytes: 2841
            final_focus_loss_sequence: 3
            integrity_state: settled
            unresolved_integrity_count: 0
            submitted_at: '2026-12-14T10:48:09Z'
            browser_activity:
              state: not_applicable
              inventory_revision: 1
              source_count: 0
              pending_source_count: 0
              incomplete_source_count: 0
    ExamSubmissionManifestOK:
      description: One page of the Submission manifest.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSubmissionManifestResponse'
          example:
            submission_id: 39kqk53i4cswfzbi7hbai1r8qg
            workspace_cursor: 18
            manifest_digest: 11ae3038c1fe627502b6596d5598808bb5339e26b1bfed1924adec0458cc1b26
            items:
              - entry_id: dfa1x1n7mkthyoziwxnupsmyia
                kind: file
                path: src/main.py
                content_version: nan7rdocriztinowtuyrbqg67a
                media_type: text/x-python
                size: 2214
                sha256: 702f63d705f0030f2b4832aff9e6a6de6923d3ef5e450ae12a4479b4adf22f8c
              - entry_id: f6tcxyfofj3n3buuqfjaw9j1jn
                kind: directory
                path: src
            next_cursor: eyJhZnRlcl9lbnRyeV9pZCI6ImY2dGN4eWZvZmozbjNidXVxZmphdzlqMWpuIn0
    ExamSubmissionFileContent:
      description: The file's bytes, served inline. This is not a public link or an export.
      headers:
        ETag:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
      content:
        '*/*':
          schema:
            type: string
            format: binary
    ExamSubmissionFileNotModified:
      description: The file has not changed since the `ETag` you sent.
      headers:
        ETag:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
  schemas:
    EndExamAttemptByManagerRequest:
      type: object
      additionalProperties: false
      description: The Attempt revision you last read and a private reason for ending it.
      required:
        - expected_revision
        - reason
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The Attempt's current revision, as last read. The request fails with a conflict if the Attempt
            has changed since.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Why you are ending the Attempt. It is kept for audit and is never shown to the candidate. Send
            valid UTF-8 with no leading or trailing whitespace: at most 1000 characters and 4000 bytes.
    ExamSubmissionManagerResponse:
      description: >-
        A summary of one sealed Submission, without file contents or integrity evidence. When the
        Institution's retention policy has retired the integrity data, the summary gives the retirement
        time and leaves out the focus-loss and unresolved counts. The submitted work stays available.
      type: object
      additionalProperties: false
      required:
        - submission_id
        - exam_id
        - exam_sitting_id
        - exam_attempt_id
        - exam_revision_id
        - workspace_id
        - manifest_schema_version
        - workspace_cursor
        - manifest_digest
        - manifest_entry_count
        - manifest_total_file_bytes
        - integrity_state
        - submitted_at
        - browser_activity
      properties:
        submission_id:
          $ref: '#/components/schemas/ID'
          description: The Submission's ID.
        exam_id:
          $ref: '#/components/schemas/ID'
          description: The Exam the Submission belongs to.
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
          description: The Sitting the Submission belongs to.
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
          description: The Attempt that was sealed.
        exam_revision_id:
          $ref: '#/components/schemas/ID'
          description: The Exam Revision the Sitting delivered when the Submission was sealed.
        workspace_id:
          $ref: '#/components/schemas/ID'
          description: The Attempt Workspace that was sealed.
        manifest_schema_version:
          type: integer
          const: 1
          description: The version of the manifest format.
        workspace_cursor:
          type: integer
          format: int64
          minimum: 0
          description: The Workspace change cursor that was sealed. Each accepted Workspace change advances it.
        manifest_digest:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the sealed manifest, as lowercase hex.
        manifest_entry_count:
          type: integer
          minimum: 0
          maximum: 5000
          description: The number of files and directories in the sealed manifest.
        manifest_total_file_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1073741824
          description: The total size of all sealed files, in bytes.
        final_focus_loss_sequence:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The last focus-loss sequence number accepted when the Attempt was sealed. Present, even when
            zero, until the integrity data is retired.
        integrity_state:
          type: string
          enum:
            - settled
            - gapped
            - retired
          description: >-
            `settled` means the integrity data is complete. `gapped` means it has a known gap. `retired`
            means the integrity data was permanently removed under the Institution's retention policy.
        integrity_retired_at:
          type: string
          format: date-time
          description: >-
            When the integrity data was retired. Present only when `integrity_state` is `retired`. A retired
            Submission is not the same as one with settled integrity.
        unresolved_integrity_count:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The number of integrity items not yet resolved for review. Present, even when zero, until the
            integrity data is retired.
        submitted_at:
          type: string
          format: date-time
          description: When the Submission was sealed.
        browser_activity:
          $ref: '#/components/schemas/BrowserSubmissionSettlement'
    ExamSubmissionManifestItemResponse:
      description: >-
        One file or directory in a sealed Submission. File entries carry `content_version`, `media_type`,
        `size` and `sha256`. Directory entries have none of them.
      type: object
      additionalProperties: false
      required:
        - entry_id
        - kind
        - path
      properties:
        entry_id:
          $ref: '#/components/schemas/ID'
          description: The entry's ID. Use it to download a file's content.
        kind:
          type: string
          enum:
            - file
            - directory
          description: Whether the entry is a file or a directory.
        path:
          $ref: '#/components/schemas/StarterWorkspacePath'
          description: The entry's path relative to the Workspace root.
        content_version:
          $ref: '#/components/schemas/WorkspaceContentVersion'
          description: The version token of the sealed file content. Files only.
        media_type:
          type: string
          minLength: 1
          maxLength: 255
          description: The file's media type. Files only.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
          description: The file size in bytes. Files only.
        sha256:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the file, as lowercase hex. Files only.
      oneOf:
        - properties:
            kind:
              const: file
          required:
            - content_version
            - media_type
            - size
            - sha256
        - properties:
            kind:
              const: directory
          not:
            anyOf:
              - required:
                  - content_version
              - required:
                  - media_type
              - required:
                  - size
              - required:
                  - sha256
    ExamSubmissionManifestResponse:
      description: One page of a sealed Submission's manifest, ordered by entry ID.
      type: object
      additionalProperties: false
      required:
        - submission_id
        - workspace_cursor
        - manifest_digest
        - items
      properties:
        submission_id:
          $ref: '#/components/schemas/ID'
          description: The Submission the manifest belongs to.
        workspace_cursor:
          type: integer
          format: int64
          minimum: 0
          description: The Workspace change cursor that was sealed.
        manifest_digest:
          $ref: '#/components/schemas/SHA256'
          description: The SHA-256 digest of the whole sealed manifest, as lowercase hex.
        items:
          type: array
          maxItems: 200
          description: The entries on this page, at most `limit`.
          items:
            $ref: '#/components/schemas/ExamSubmissionManifestItemResponse'
        next_cursor:
          type: string
          description: >-
            Pass this as `cursor` to get the next page. Omitted on the last page. Don't parse or
            build it yourself. It never contains a file path.
