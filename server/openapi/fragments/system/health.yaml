paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      tags:
        - System
      description: >-
        Reports whether this server process is running and can answer. It does not mean the services it depends on are ready, or that the node should get traffic.
      x-proctor-auth: public
      x-proctor-error-codes:
        - health.not_live
      security: []
      x-proctor-idempotency: none
      responses:
        "200":
          $ref: '#/components/responses/HealthOK'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check service readiness
      tags:
        - System
      description: >-
        Reports whether this node and the services it needs are ready for traffic. When it fails, stop sending traffic to the node, and use the liveness check to decide whether to restart it.
      x-proctor-auth: public
      x-proctor-error-codes:
        - health.not_ready
      security: []
      x-proctor-idempotency: none
      responses:
        "200":
          $ref: '#/components/responses/HealthOK'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    HealthOK:
      description: Health status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
          example:
            status: ok
  schemas:
    HealthResponse:
      description: A passed health check.
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          description: >-
            The successful health state. Readiness answers `degraded` when an enabled plugin has failed: the node still serves, without that plugin. The server log and the `proctor_plugin_state` metric name the plugin.
          enum:
            - ok
            - degraded
