paths:
  /api/v1/system/ping:
    get:
      operationId: pingSystem
      summary: Check product availability and Desktop compatibility
      tags:
        - System
      description: >-
        Tells a Proctor Desktop build whether the server is available and whether that build can work with it. When the server can't decide, the answer is not compatible. The build details are what Desktop reports about itself, and the server does not verify the binary. Every well-formed request gets 200, even for an unsupported build or while the server is unavailable. Malformed parameters get a Problem Details error. The response never reveals the installation's identity, sign-in settings, identity providers, build details or update locations.
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
      security: []
      x-proctor-idempotency: none
      parameters:
        - name: desktop_release
          in: query
          required: true
          description: Desktop's semantic version, such as `1.4.2`, without a leading `v`.
          schema:
            type: string
            minLength: 5
            maxLength: 64
            pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
        - name: desktop_build_id
          in: query
          required: true
          description: The build ID of this signed Desktop build.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        - name: platform
          in: query
          required: true
          description: Desktop's operating system, such as `darwin`, `win32` or `linux`. Any other well-formed value gets `unsupported_target`.
          schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        - name: architecture
          in: query
          required: true
          description: Desktop's processor architecture, such as `arm64` or `x64`. Any other well-formed value gets `unsupported_target`.
          schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        - name: realtime_protocol
          in: query
          required: true
          description: The realtime protocol version Desktop speaks, 1 or higher.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          $ref: '#/components/responses/SystemPingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/system/version:
    get:
      operationId: getSystemVersion
      summary: Get build and version information
      tags:
        - System
      description: >-
        Returns the version and build details of the server node that answers. It contains no configuration, credentials, service addresses or installation identity.
      x-proctor-auth: public
      x-proctor-error-codes: []
      security: []
      x-proctor-idempotency: none
      responses:
        "200":
          $ref: '#/components/responses/BuildInfoOK'
components:
  responses:
    SystemPingOK:
      description: Availability and compatibility for the Desktop build in the request
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemPingResponse'
          example:
            schema_version: 1
            server_time: '2026-08-28T10:11:12Z'
            availability: ready
            reason: ready
            compatibility: update_required
            compatibility_reason: release_too_old
            minimum_desktop_release: 1.4.0
            maximum_desktop_release: 1.6.2
            minimum_realtime_protocol: 2
            maximum_realtime_protocol: 3
    BuildInfoOK:
      description: Build information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BuildInfoResponse'
          example:
            version: 1.6.2
            commit: 3f1c9a2be47d08e6a5c3b19f0d72e84a6b5c1d09
            build_time: '2026-08-20T14:03:11Z'
            go_version: go1.25.3
  schemas:
    SystemPingResponse:
      description: Whether the server is available, and whether the Desktop build in the request can use it.
      type: object
      additionalProperties: false
      required:
        - schema_version
        - server_time
        - availability
        - reason
        - compatibility
        - compatibility_reason
      properties:
        schema_version:
          type: integer
          const: 1
          description: Version of this response format. Always 1.
        server_time:
          type: string
          format: date-time
          description: The server's current time, in RFC 3339 format.
        availability:
          type: string
          description: >-
            Whether the server is open for use: `ready`, `maintenance` (closed by an administrator) or
            `temporarily_unavailable`.
          enum:
            - ready
            - maintenance
            - temporarily_unavailable
        reason:
          type: string
          enum:
            - ready
            - maintenance
            - temporarily_unavailable
          description: Why the server has this availability. Today it always matches `availability`.
        administrator_message:
          type: string
          maxLength: 500
          description: Plain-text message from the Institution's administrators. Omitted when there is none.
        retry_at:
          type: string
          format: date-time
          description: Time after which Desktop may try again, set by the administrators. Omitted when there is none.
        compatibility:
          type: string
          description: >-
            Whether this build can use the server: `compatible`, `update_required` (the build is too old or
            revoked), `server_incompatible` (the server can't serve this build, or can't decide right now), or
            `unsupported_target` (no build exists for this platform and architecture).
          enum:
            - compatible
            - update_required
            - server_incompatible
            - unsupported_target
        compatibility_reason:
          type: string
          enum:
            - compatible
            - release_too_old
            - release_too_new
            - realtime_protocol_too_old
            - realtime_protocol_too_new
            - build_revoked
            - build_unrecognized
            - unsupported_target
            - compatibility_unavailable
          description: The specific reason for `compatibility`.
        minimum_desktop_release:
          type: string
          maxLength: 64
          description: Oldest Desktop release this server accepts for the platform and architecture. Omitted with `unsupported_target` or `compatibility_unavailable`.
        maximum_desktop_release:
          type: string
          maxLength: 64
          description: Newest Desktop release this server knows for the platform and architecture. Omitted with `unsupported_target` or `compatibility_unavailable`.
        minimum_realtime_protocol:
          type: integer
          minimum: 1
          description: Oldest realtime protocol version this server accepts for the platform and architecture. Omitted with `unsupported_target` or `compatibility_unavailable`.
        maximum_realtime_protocol:
          type: integer
          minimum: 1
          description: Newest realtime protocol version this server accepts for the platform and architecture. Omitted with `unsupported_target` or `compatibility_unavailable`.
    BuildInfoResponse:
      description: Version and build details of the server binary that answered.
      type: object
      additionalProperties: false
      required:
        - version
        - commit
        - build_time
        - go_version
      properties:
        version:
          type: string
          description: Proctor release version, or a development version string.
        commit:
          type: string
          description: Source commit the binary was built from.
        build_time:
          type: string
          description: When the binary was built, as recorded at build time.
        go_version:
          type: string
          description: Version of Go used to build the binary.
