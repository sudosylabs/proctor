paths:
  /api/v1/users/{user_id}/email:
    parameters:
      - $ref: '#/components/parameters/UserID'
    put:
      operationId: changeUserEmail
      summary: Explicitly change a User email address and require verification
      tags:
        - Users
      description: >-
        Changes a User's email address. You must have signed in recently with a strong method. The new address starts unverified. The new address gets a verification link, and the old address gets a one-time link to undo the change, valid for the configured undo period. Changes to one account count against its account-recovery rate limit. Your administrator permissions are never taken as proof that the User owns the new address.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - user.invalid
        - user.conflict
        - authentication.account_recovery.unavailable
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/ChangeUserEmail'
      responses:
        "200":
          $ref: '#/components/responses/UserEmailStateOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{user_id}/email/verify:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      operationId: verifyUserEmailPrivileged
      summary: Privileged verification of a User email address
      tags:
        - Users
      description: >-
        Marks a User's current email address as verified, as an administrator action. You must have signed in recently with a strong method. It does not change the address, enable a disabled account, bring back Sessions, or skip the usual permission checks.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/users/wj3drgzdpnf54rxf5d8qd3dqne/email/verify' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - user.conflict
        - authentication.account_recovery.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/UserEmailStateOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ChangeUserEmail:
      description: The new email address. After the change, the User must verify it.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangeUserEmailRequest'
          example:
            email: amina.diallo@example.edu
  responses:
    UserEmailStateOK:
      description: The User's email verification state after the change
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserEmailStateResponse'
          example:
            id: wj3drgzdpnf54rxf5d8qd3dqne
            email_verified: false
  schemas:
    UserEmailStateResponse:
      description: The User and whether their email address is verified, after an email change or verification.
      type: object
      additionalProperties: false
      required:
        - id
        - email_verified
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The User.
        email_verified:
          type: boolean
          description: True when the User's current email address is verified.
    ChangeUserEmailRequest:
      description: The new email address. It is stored as unverified.
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The new address. It must be a valid email address that no other User has.
