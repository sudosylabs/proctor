paths:
  /api/v1/users/{user_id}/profile-picture:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: getUserProfilePicture
      summary: Get an authorized normalized profile-picture rendition
      tags:
        - Users
      description: >-
        Returns the User's profile picture as a square WebP image, served directly rather than through a public or signed storage link. The response has an ETag and may be cached privately. Send If-None-Match to get 304 when the image has not changed. Every request checks again that you can see the User, so disabled Users stay hidden from scoped viewers.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request GET \
              --url 'https://proctor.example.edu/api/v1/users/wj3drgzdpnf54rxf5d8qd3dqne/profile-picture?size=256' \
              --header 'Authorization: Bearer <access-token>' \
              --header 'Accept: image/webp' \
              --output 'profile.webp'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - service.busy
        - request.invalid
        - resource.not_found
        - profile_picture.unavailable
        - administration.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: size
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 128
              - 256
              - 512
            default: 256
          description: Width and height of the image in pixels, 128, 256 or 512.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: One or more ETags from earlier responses. If one matches, you get 304 with no body.
      responses:
        "200":
          $ref: '#/components/responses/ProfilePictureOK'
        "304":
          description: Rendition has not changed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: uploadUserProfilePicture
      summary: Upload and normalize a custom profile picture
      tags:
        - Users
      description: >-
        Uploads a new custom profile picture for a User. Proctor checks the image and converts it to WebP at 128, 256 and 512 pixels before saving it. When you replace an existing custom picture, send If-Match so you can't overwrite a newer upload by mistake.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request PUT \
              --url 'https://proctor.example.edu/api/v1/users/wj3drgzdpnf54rxf5d8qd3dqne/profile-picture' \
              --header 'Authorization: Bearer <access-token>' \
              --header 'Content-Type: image/png' \
              --header 'If-Match: "3f1c9a2be47d08e6a5c3b19f0d72e84a6b5c1d09e3f7a28b4c6d0e1f2a3b4c5d"' \
              --data-binary '@profile.png'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - service.busy
        - request.invalid
        - resource.not_found
        - profile_picture.invalid
        - profile_picture.unavailable
        - user.conflict
        - administration.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: >-
            The ETag of the current custom picture, from any of its sizes, when you replace it. Omit it for the
            first custom upload.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
        description: >-
          The image file as raw PNG, JPEG or WebP bytes. The server checks it and stores WebP copies at 128, 256 and 512 pixels.
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: removeUserProfilePicture
      summary: Remove the custom profile picture and return to the retained default
      tags:
        - Users
      description: >-
        Removes a User's custom picture so the default picture shows again, and returns the updated profile. If-Match must name the current custom picture, so you can't remove a newer upload by mistake. The stored files are deleted after the change is saved.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/users/wj3drgzdpnf54rxf5d8qd3dqne/profile-picture' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>' \
              --header 'If-Match: "3f1c9a2be47d08e6a5c3b19f0d72e84a6b5c1d09e3f7a28b4c6d0e1f2a3b4c5d"'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - profile_picture.unavailable
        - user.conflict
        - administration.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: The ETag of the custom picture to remove, from any of its sizes.
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    ProfilePictureOK:
      description: The profile picture as a WebP image
      headers:
        ETag:
          description: >-
            The image's SHA-256 in quotes. Send it in If-None-Match to check for changes, or in If-Match to
            replace or remove this custom picture.
          schema:
            type: string
        Cache-Control:
          description: Always `private, max-age=86400`. Only this caller may cache the image, for up to a day.
          schema:
            type: string
      content:
        image/webp:
          schema:
            type: string
            format: binary
