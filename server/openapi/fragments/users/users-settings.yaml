paths:
  /api/v1/users/me/settings:
    get:
      operationId: getCurrentUserSettings
      summary: Get the signed-in User's exact settings.json source
      tags:
        - Users
      description: >-
        Returns your settings document exactly as it was saved, with its format version, revision and whether you can replace it. The server does not rewrite the document or add fields to it. The response is private and must not be stored by shared caches.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - user_settings.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/UserSettingsOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceCurrentUserSettings
      summary: Conditionally replace the signed-in User's exact settings.json source
      tags:
        - Users
      description: >-
        Checks and replaces your whole settings document. `expected_revision` must match the current revision, so an update from another client is never overwritten: a stale revision fails with `user_settings.revision_conflict`. A retry with the same Idempotency-Key returns the first result.
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - request.invalid
        - user_settings.invalid
        - user_settings.format_unsupported
        - user_settings.revision_conflict
        - user_settings.unavailable
        - audit.unavailable
        - idempotency.key_required
        - idempotency.key_invalid
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReplaceUserSettings'
      responses:
        "200":
          $ref: '#/components/responses/UserSettingsReplaced'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ReplaceUserSettings:
      description: The whole new settings document, its format version, and the revision you are replacing.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSettingsReplaceRequest'
          example:
            source: '{"appearance":{"theme":"system"}}'
            format_version: 1
            expected_revision: ybndrfg8ejkmcpqxot1uwisza3
  responses:
    UserSettingsOK:
      description: Your current settings document
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSettingsResponse'
          example:
            source: '{"appearance":{"theme":"system"}}'
            format_version: 1
            revision: ybndrfg8ejkmcpqxot1uwisza3
            writable: true
            updated_at: '2026-08-01T09:30:00Z'
    UserSettingsReplaced:
      description: Result of replacing your settings document
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSettingsReplacementResponse'
          example:
            revision: grofpg49hmqe47x811ttzoochx
            format_version: 1
            updated_at: '2026-08-02T14:12:05Z'
            changed: true
  schemas:
    UserSettingsResponse:
      description: Your settings document as saved, with the details you need to replace it safely.
      type: object
      additionalProperties: false
      required:
        - source
        - format_version
        - revision
        - writable
        - updated_at
      properties:
        source:
          type: string
          maxLength: 262144
          description: The settings document as JSON text, exactly as saved. At most 256 KiB.
        format_version:
          type: integer
          minimum: 1
          description: Version of the settings format the document uses.
        revision:
          $ref: '#/components/schemas/ID'
          description: The document's current revision. Send it as `expected_revision` when you replace the document.
        writable:
          type: boolean
          description: >-
            True when this server can write the document's format version, so you can replace it. False when the
            document uses a format this server does not support.
        updated_at:
          type: string
          format: date-time
          description: Time the document was last replaced.
    UserSettingsReplaceRequest:
      description: The whole new settings document, which replaces the current one.
      type: object
      additionalProperties: false
      required:
        - source
        - format_version
        - expected_revision
      properties:
        source:
          type: string
          maxLength: 262144
          description: The new settings document as JSON text. At most 256 KiB.
        format_version:
          type: integer
          minimum: 1
          description: Version of the settings format the document uses. This server accepts version 1.
        expected_revision:
          $ref: '#/components/schemas/ID'
          description: The `revision` you last read. The request fails if the document has changed since.
    UserSettingsReplacementResponse:
      description: The saved document's details after a replacement, or after a retry of one.
      type: object
      additionalProperties: false
      required:
        - revision
        - format_version
        - updated_at
        - changed
      properties:
        revision:
          $ref: '#/components/schemas/ID'
          description: The document's revision after the request. Use it for your next replacement.
        format_version:
          type: integer
          minimum: 1
          description: Version of the settings format the saved document uses.
        updated_at:
          type: string
          format: date-time
          description: Time the document was last replaced.
        changed:
          type: boolean
          description: False when the new document was the same as the saved one, so nothing changed.
