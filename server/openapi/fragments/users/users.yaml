paths:
  /api/v1/users:
    get:
      operationId: searchUsers
      summary: Search the authorized User directory
      tags:
        - Users
      description: >-
        Searches the Users you can see through your Institution-wide or scoped permissions. Results are sorted by username, then ID, unless `sort` and `dir` say otherwise. Disabled Users are hidden unless you hold Institution-wide user.view and ask for them.
        Each item has a `summary`: the User's current Affiliations with the current Academic Units you can see and, if you hold role_binding.view, their current Role Bindings inside your scopes. Each list is short and ends with a count of the rest.
        The first page (read without a cursor) also has `total`, the number of matching Users across all pages. It is exact up to 10,000. Above that it shows 10,000 and `total_is_lower_bound` is true. Later pages have no total, so keep the one from the first page.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - user.invalid
        - administration.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Text to find, case-insensitively, anywhere in the User fields you can see. It is matched literally.
          schema:
            type: string
        - name: include_disabled
          in: query
          required: false
          description: >-
            With `true`, also returns disabled Users. It works only with Institution-wide user.view. With scoped
            permissions, disabled Users are always left out.
          schema:
            type: boolean
            default: false
        - name: affiliation
          in: query
          required: false
          description: >-
            Keeps Users who have a current Affiliation of any listed kind. Repeat the parameter for several kinds, each kind at most once. Filters only narrow what you can already see.
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 4
            items:
              type: string
              enum:
                - student
                - teacher
                - staff
                - external
        - name: academic_unit_id
          in: query
          required: false
          description: >-
            Keeps Users who are current members of this Academic Unit or any unit below it. A unit outside your user.view scope returns an empty page, not an error.
          schema:
            $ref: '#/components/schemas/ID'
        - name: role_id
          in: query
          required: false
          description: >-
            Keeps Users who hold a current Role Binding of any listed Role inside your role_binding.view scopes,
            so it matches only Bindings the `summary` could show. Without role_binding.view you get an empty page.
            Repeat the parameter for up to 16 Roles. You need Institution-wide role.view to name Roles. Without it,
            or for a Role that does not exist or is archived, the request fails with `request.invalid` on
            `role_id`. Filters only narrow what you can already see.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 16
            items:
              $ref: '#/components/schemas/ID'
        - name: state
          in: query
          required: false
          description: >-
            Keeps only `active` or only `disabled` accounts. As with `include_disabled`, only Institution-wide
            user.view can see disabled Users, so with scoped permissions `disabled` returns an empty page. You
            can't combine it with `include_disabled=true`.
          schema:
            type: string
            enum:
              - active
              - disabled
        - name: mfa
          in: query
          required: false
          description: >-
            Keeps Users whose account has two-step verification on (`enabled`) or off (`disabled`). On means
            an active Proctor authenticator app; a second factor an external sign-in provider checks does not
            count. Only callers who can see two-step verification (Institution-wide user.view, or
            user.mfa.reset) can use it; anyone else gets `request.invalid` on `mfa`.
          schema:
            type: string
            enum:
              - enabled
              - disabled
        - name: role_holder
          in: query
          required: false
          description: >-
            With `true`, keeps active Users who hold a current Role Binding at any scope. Combined with
            `mfa=disabled` it lists exactly the role holders the access policy preflight counts in
            `role_holders_without_mfa_count`. Only Institution-wide user.view can use it; anyone else gets
            `request.invalid` on `role_holder`. The only accepted value is `true`.
          schema:
            type: boolean
            enum:
              - true
        - name: never_signed_in
          in: query
          required: false
          description: >-
            With `true`, keeps Users who have never signed in. Activity is first recorded when a User gets a
            Session. Only Institution-wide user.view can filter on activity; anyone else gets `request.invalid`.
            You can't combine it with `last_active_after` or `last_active_before`.
          schema:
            type: boolean
            default: false
        - name: last_active_after
          in: query
          required: false
          description: >-
            Keeps Users last active at or after this RFC 3339 time. A User who was never active does not match.
            Only Institution-wide user.view can filter on activity; anyone else gets `request.invalid`.
          schema:
            type: string
            format: date-time
        - name: last_active_before
          in: query
          required: false
          description: >-
            Keeps Users last active before this RFC 3339 time. It must be later than `last_active_after`. A User
            who was never active does not match. Only Institution-wide user.view can filter on activity; anyone
            else gets `request.invalid`.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: >-
            Sort order, with User ID breaking ties: `username` (the default), `name`, `created` or `last_active`.
            `name` is the display name, or the username when there is none, compared case-insensitively on its
            first 64 characters. `last_active` puts Users who were never active as least recent, and only
            Institution-wide user.view can use it; anyone else gets `request.invalid`. A cursor works only with
            the sort and direction that produced it.
          schema:
            type: string
            enum:
              - username
              - name
              - created
              - last_active
            default: username
        - name: dir
          in: query
          required: false
          description: Ascending (`asc`, the default) or descending (`desc`) by the `sort` key.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/UserProfileListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me:
    get:
      operationId: getCurrentUserProfile
      summary: Get the authenticated User profile
      tags:
        - Users
      description: >-
        Returns your own User profile. It never includes password data, identity-provider claims, Session or Personal Access Token secrets, or your Role Bindings.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - resource.not_found
        - administration.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/context:
    get:
      operationId: getCurrentUserContext
      summary: Get the signed-in User's bounded product context
      tags:
        - Users
      description: >-
        Returns what a client needs to build navigation for the current Session: the product areas you can open, up to 20 scopes you manage, and any Attempt you have not finished. It contains no Roles, permissions, identity-provider claims, credentials or Exam content. It does not prove you may do anything, and it must never be cached.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/CurrentUserContextOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: getUserProfile
      summary: Get a contextually visible User profile
      tags:
        - Users
      description: >-
        Returns one User's profile if you can currently see that User through Institution-wide or scoped permissions. Unrelated Users, and disabled Users when you have only scoped permissions, stay hidden.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateUserProfile
      summary: Administratively update a User profile
      tags:
        - Users
      description: >-
        Changes some profile fields of a User, after checking your permission on that User. It changes only names, locale and time zone. Email, sign-in methods, account state, memberships and Role Bindings each have their own operations.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - user.invalid
        - user.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateUserProfile'
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateUserProfile:
      description: The profile fields to change. Omitted or null fields stay as they are.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserProfileRequest'
          example:
            display_name: Amina Diallo
            first_name: Amina
            last_name: Diallo
            locale: en
            timezone: Europe/Paris
  responses:
    CurrentUserContextOK:
      description: Navigation context for the current User
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUserContextResponse'
          example:
            user:
              id: wj3drgzdpnf54rxf5d8qd3dqne
              username: amina.diallo
              display_name: Amina Diallo
              profile_picture_reference: /api/v1/users/wj3drgzdpnf54rxf5d8qd3dqne/profile-picture
              profile_picture_kind: custom
            no_current_affiliation: false
            no_assigned_access: false
            available_product_areas:
              - account
              - exam_management
              - settings
            management_scopes:
              - scope_type: academic_unit
                scope_id: 14j8umgczgrdp95w77zuxmxfu9
                display_name: School of Engineering
            management_scopes_has_more: false
            unresolved_attempt: null
            session_management_available: true
            current_desktop_registration_id: null
    UserProfileListOK:
      description: User profile collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileListResponse'
          example:
            items:
              - id: ih1r84kij94nrwis97rft6rduh
                created_at: '2026-01-19T10:00:00Z'
                updated_at: '2026-07-22T16:40:00Z'
                username: jonas.berg
                display_name: Jonas Berg
                first_name: Jonas
                last_name: Berg
                profile_picture_url: /api/v1/users/ih1r84kij94nrwis97rft6rduh/profile-picture
                profile_picture_kind: default
                mfa:
                  enabled: true
                  method: authenticator_app
                  enabled_at: '2026-03-14T10:22:00Z'
                summary:
                  affiliations:
                    - kind: teacher
                      academic_units:
                        - id: 14j8umgczgrdp95w77zuxmxfu9
                          name: School of Engineering
                      academic_units_more: 0
                  affiliations_more: 0
                  roles:
                    - role_id: 1asb7sk89dp1ex339fkh3te5t4
                      display_name: Exam Author
                      scope_type: academic_unit
                      scope_id: 14j8umgczgrdp95w77zuxmxfu9
                      scope_name: School of Engineering
                  roles_more: 0
            next_cursor: eyJrIjoianVvbmFzLmJlcmcifQ
            total: 128
            total_is_lower_bound: false
  schemas:
    CurrentUserContextResponse:
      type: object
      additionalProperties: false
      description: What the signed-in User can open, for building navigation.
      required:
        - user
        - no_current_affiliation
        - no_assigned_access
        - available_product_areas
        - management_scopes
        - management_scopes_has_more
        - unresolved_attempt
        - session_management_available
        - current_desktop_registration_id
      properties:
        user:
          $ref: '#/components/schemas/CurrentUserContextIdentity'
        no_current_affiliation:
          type: boolean
          description: True when the User has no current Affiliation with the Institution.
        no_assigned_access:
          type: boolean
          description: True when the User holds no Role Binding that is in effect now.
        available_product_areas:
          type: array
          minItems: 2
          uniqueItems: true
          description: >-
            Product areas the User can open. `account` and `settings` are always present. `administration` and
            `exam_management` follow from current Role Bindings, and `student_activity` from a current Class
            membership or an unfinished Attempt.
          items:
            type: string
            enum:
              - account
              - administration
              - exam_management
              - settings
              - student_activity
        management_scopes:
          type: array
          maxItems: 20
          description: Up to 20 Institution or Academic Unit scopes the User can manage.
          items:
            $ref: '#/components/schemas/CurrentUserManagementScope'
        management_scopes_has_more:
          type: boolean
          description: True when the User can manage more scopes than the 20 listed.
        unresolved_attempt:
          type:
            - object
            - "null"
          additionalProperties: false
          description: The User's Attempt that is ready, active or suspended, or null when there is none.
          required:
            - id
            - exam_sitting_id
            - state
          properties:
            id:
              $ref: '#/components/schemas/ID'
              description: The Attempt.
            exam_sitting_id:
              $ref: '#/components/schemas/ID'
              description: The Sitting the Attempt belongs to.
            state:
              type: string
              description: Current state of the Attempt.
              enum:
                - ready
                - active
                - suspended
        session_management_available:
          type: boolean
          description: True when Session management is available to the User. Always true in this version.
        current_desktop_registration_id:
          type:
            - string
            - "null"
          pattern: '^[ybndrfg8ejkmcpqxot1uwisza345h769]{26}$'
          description: The Desktop registration of the current Session, or null when the Session is not from Proctor Desktop.
    CurrentUserContextIdentity:
      type: object
      additionalProperties: false
      description: Who is signed in.
      required:
        - id
        - username
        - display_name
        - profile_picture_reference
        - profile_picture_kind
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
          description: The User's sign-in name.
        display_name:
          type: string
          description: Name shown to other people. It can be empty.
        profile_picture_reference:
          type: string
          description: Relative URL of the User's profile picture.
        profile_picture_kind:
          $ref: '#/components/schemas/ProfilePictureKind'
    CurrentUserManagementScope:
      type: object
      additionalProperties: false
      description: An Institution or Academic Unit the User can manage.
      required:
        - scope_type
        - scope_id
        - display_name
      properties:
        scope_type:
          type: string
          description: Kind of scope.
          enum:
            - institution
            - academic_unit
        scope_id:
          $ref: '#/components/schemas/ID'
          description: The Institution or Academic Unit.
        display_name:
          type: string
          description: Name of the Institution or Academic Unit.
    UserProfileListResponse:
      description: A page of Users you can see, sorted by username and then ID unless you choose another order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The Users on this page.
          items:
            $ref: '#/components/schemas/UserDirectoryEntryResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Number of Users that match the filters and that you can see, across all pages. Sent on the first page
            only. Counting stops at 10,000, and then `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached 10,000 and there may be more. Sent with `total`.
    UserDirectoryEntryResponse:
      type: object
      additionalProperties: false
      description: >-
        One User in the directory: the same profile fields as UserProfileResponse, under the same visibility
        rules, plus a short `summary` of the User's place in the Institution.
      required:
        - id
        - created_at
        - updated_at
        - username
        - display_name
        - first_name
        - last_name
        - profile_picture_url
        - profile_picture_kind
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: Time the User account was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest change to the account.
        archived_at:
          type: string
          format: date-time
          description: Time the account was archived. Omitted while it is not archived.
        username:
          type: string
          description: Unique sign-in name, in lowercase.
        email:
          type: string
          format: email
          description: The User's email address.
        email_verified:
          type: boolean
          description: True when the User has confirmed they own the email address.
        display_name:
          type: string
          description: Name shown to other people. It can be empty.
        first_name:
          type: string
          description: Given name. It can be empty.
        last_name:
          type: string
          description: Family name. It can be empty.
        locale:
          type: string
          description: Preferred language tag, such as `en`.
        timezone:
          type: string
          description: Preferred time zone name, such as `Europe/Paris`.
        last_login_at:
          type: string
          format: date-time
          description: Time the User last signed in. Omitted if they never have.
        last_activity_at:
          type: string
          format: date-time
          description: >-
            Time the User was last active in any Session. It can lag the latest request by up to five minutes by
            default.
        disabled_at:
          type: string
          format: date-time
          description: Time the account was disabled. Omitted while it is enabled.
        profile_picture_url:
          type: string
          description: Relative URL of the User's profile picture.
        profile_picture_changed_at:
          type: string
          format: date-time
          description: >-
            Time of the latest upload or removal. It does not tell you whether a custom picture exists. Use
            `profile_picture_kind` for that.
        profile_picture_kind:
          $ref: '#/components/schemas/ProfilePictureKind'
        mfa:
          $ref: '#/components/schemas/UserMFAResponse'
        summary:
          $ref: '#/components/schemas/UserDirectorySummary'
    UserMFAResponse:
      type: object
      additionalProperties: false
      description: >-
        Whether the User's account has two-step verification on: an active Proctor authenticator app. It belongs
        to the account; how strongly a sign-in was proved belongs to each Session. A second factor an external
        sign-in provider checks does not turn it on. It is present only if you hold Institution-wide user.view or
        user.mfa.reset, and never says "off" to anyone else: for them it is left out. It never shows recovery
        codes or a setup that has not been finished.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: True while the account has an active Proctor authenticator app.
        method:
          type: string
          enum: [authenticator_app]
          description: The second factor in use, as `/users/me/mfa` names it. Present only while `enabled` is true. More methods may be added later.
        enabled_at:
          type: string
          format: date-time
          description: When two-step verification was turned on. Present only while `enabled` is true.
    UserDirectorySummary:
      type: object
      additionalProperties: false
      description: >-
        Who the User is, read at the same moment as the page. `affiliations` lists up to three current
        Affiliations, oldest first. `roles` and `roles_more` appear only if you hold role_binding.view
        somewhere. They list up to three current Role Bindings inside your role_binding.view scopes, oldest
        first. Bindings outside those scopes are neither listed nor counted.
      required:
        - affiliations
        - affiliations_more
      properties:
        affiliations:
          type: array
          maxItems: 3
          description: Up to three current Affiliations, oldest first.
          items:
            $ref: '#/components/schemas/UserDirectoryAffiliation'
        affiliations_more:
          type: integer
          minimum: 0
          description: Number of current Affiliations beyond the three listed.
        roles:
          type: array
          maxItems: 3
          description: Up to three current Role Bindings you can see, oldest first.
          items:
            $ref: '#/components/schemas/UserDirectoryRole'
        roles_more:
          type: integer
          minimum: 0
          description: Number of visible current Role Bindings beyond the three listed. Sent with `roles`.
    UserDirectoryAffiliation:
      type: object
      additionalProperties: false
      description: >-
        One current Affiliation, with the User's current Academic Units. Memberships are not tied to an
        Affiliation kind, so every Affiliation lists the same units: up to two, sorted by name, from the units
        your user.view reaches (all units with Institution-wide user.view).
      required:
        - kind
        - academic_units
        - academic_units_more
      properties:
        kind:
          type: string
          description: Kind of Affiliation.
          enum:
            - student
            - teacher
            - staff
            - external
        academic_units:
          type: array
          maxItems: 2
          description: Up to two of the User's current Academic Units, sorted by name.
          items:
            $ref: '#/components/schemas/UserDirectoryAcademicUnit'
        academic_units_more:
          type: integer
          minimum: 0
          description: Number of visible current Academic Units beyond the two listed.
    UserDirectoryAcademicUnit:
      type: object
      additionalProperties: false
      description: An Academic Unit the User belongs to.
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          description: The Academic Unit's display name.
    UserDirectoryRole:
      type: object
      additionalProperties: false
      description: One current Role Binding, named by its Role and the Institution, Academic Unit or Class it is scoped to.
      required:
        - role_id
        - display_name
        - scope_type
        - scope_id
        - scope_name
      properties:
        role_id:
          $ref: '#/components/schemas/ID'
          description: The Role granted.
        display_name:
          type: string
          description: The Role's display name.
        scope_type:
          type: string
          description: Kind of scope the Binding is at.
          enum:
            - institution
            - academic_unit
            - class
        scope_id:
          $ref: '#/components/schemas/ID'
          description: The Institution, Academic Unit or Class the Binding is at.
        scope_name:
          type: string
          description: The display name of the binding's Institution, Academic Unit or Class.
    UpdateUserProfileRequest:
      description: Profile fields to change. Omitted fields and fields set to null stay as they are.
      type: object
      additionalProperties: false
      properties:
        username:
          type:
            - string
            - "null"
          description: >-
            New sign-in name. It is stored in lowercase and may use only letters, digits, `.`, `_` and `-`. Omit
            or send null to keep it.
        display_name:
          type:
            - string
            - "null"
          description: New name shown to other people. Omit or send null to keep it.
        first_name:
          type:
            - string
            - "null"
          description: New given name. Omit or send null to keep it.
        last_name:
          type:
            - string
            - "null"
          description: New family name. Omit or send null to keep it.
        locale:
          type:
            - string
            - "null"
          description: New language tag, such as `en` or `fr-CA`. Omit or send null to keep it.
        timezone:
          type:
            - string
            - "null"
          description: New time zone name, such as `Europe/Paris`. Omit or send null to keep it.
