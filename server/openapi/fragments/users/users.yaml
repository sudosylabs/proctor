paths:
  /api/v1/users:
    get:
      operationId: searchUsers
      summary: Search the authorized User directory
      tags:
        - Users
      description: >-
        Searches only User profiles visible through the caller's current Institution or scoped relationships, ordered by canonical username and identity unless `sort` and `dir` choose another order. Disabled Users remain concealed unless an Institution-wide user viewer explicitly requests them.
        Each item carries a `summary`: the User's current Affiliations with the current Academic Units the caller can see, and, for a caller holding role_binding.view, the current Role Bindings inside that authority's scopes, each list bounded and followed by a count of the rest.
        The first page, read without a cursor, also reports `total`: the Users the filters and the caller's visibility match across every page, exact below 10,000 and reported as 10,000 with `total_is_lower_bound` at that bound. Later pages carry no total; keep the first page's.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - user.invalid
        - administration.unavailable
        - resource.not_found
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Literal case-insensitive substring matched against visible User directory fields.
          schema:
            type: string
        - name: include_disabled
          in: query
          required: false
          description: Honored only for institution-wide user.view; scoped visibility always excludes disabled Users.
          schema:
            type: boolean
            default: false
        - name: affiliation
          in: query
          required: false
          description: >-
            Keeps Users holding a current Affiliation of any listed kind. Repeat the parameter to accept several kinds; a kind may appear once. The filter narrows the caller's visibility and never widens it.
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 4
            items:
              type: string
              enum:
                - student
                - teacher
                - staff
                - external
        - name: academic_unit_id
          in: query
          required: false
          description: >-
            Keeps Users with a current membership in this Academic Unit or one of its descendants. A unit outside the caller's user.view scope answers an empty page rather than an error.
          schema:
            $ref: '#/components/schemas/ID'
        - name: role_id
          in: query
          required: false
          description: >-
            Keeps Users holding a current Role Binding of any listed Role inside the caller's role_binding.view
            scopes, so the filter matches only bindings the `summary` could show; a caller without role_binding.view
            receives an empty page. Repeat the parameter for up to 16 Roles. Roles are seen through
            Institution-wide role.view: without it, and for a Role that does not exist or is archived, the request
            is `request.invalid` on `role_id` alike. The filter narrows the caller's visibility and never widens it.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 16
            items:
              $ref: '#/components/schemas/ID'
        - name: state
          in: query
          required: false
          description: >-
            Keeps only `active` or only `disabled` accounts. Like `include_disabled` it reaches disabled Users only
            for Institution-wide user.view: scoped visibility never sees a disabled User, so `disabled` answers an
            empty page. It cannot be combined with `include_disabled=true`.
          schema:
            type: string
            enum:
              - active
              - disabled
        - name: never_signed_in
          in: query
          required: false
          description: >-
            With `true`, keeps Users who have no recorded account activity, which is first recorded when a Session
            is issued to them, so they have never signed in. Account activity is visible only to Institution-wide
            user.view; any other caller receives `request.invalid`. It cannot be combined with `last_active_after`
            or `last_active_before`.
          schema:
            type: boolean
            default: false
        - name: last_active_after
          in: query
          required: false
          description: >-
            Keeps Users whose last account activity is at or after this RFC 3339 instant; a User never active never
            matches. Only Institution-wide user.view may filter on account activity; any other caller receives
            `request.invalid`.
          schema:
            type: string
            format: date-time
        - name: last_active_before
          in: query
          required: false
          description: >-
            Keeps Users whose last account activity is before this RFC 3339 instant; it must be later than
            `last_active_after`, and a User never active never matches. Only Institution-wide user.view may filter
            on account activity; any other caller receives `request.invalid`.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: >-
            The page order, each key then by User identity: `username` (the default), `name` (the presented name,
            the display name or else the username, compared case-insensitively on its first 64 characters),
            `created`, or `last_active` (the last account activity; a User never active sorts as the least recent).
            `last_active` reads account activity, which only an Institution-wide user.view caller can see, so any
            other caller receives `request.invalid`. A cursor continues only the sort and direction that produced it.
          schema:
            type: string
            enum:
              - username
              - name
              - created
              - last_active
            default: username
        - name: dir
          in: query
          required: false
          description: Ascending (`asc`, the default) or descending (`desc`) by the `sort` key.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/UserProfileListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me:
    get:
      operationId: getCurrentUserProfile
      summary: Get the authenticated User profile
      tags:
        - Users
      description: >-
        Returns the current principal's own safe User profile from durable state. The projection contains no password data, authentication-provider claims, Session credentials, Personal Access Token material, or private authorization bindings.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - resource.not_found
        - administration.unavailable
        - request.invalid
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/context:
    get:
      operationId: getCurrentUserContext
      summary: Get the signed-in User's bounded product context
      tags:
        - Users
      description: >-
        Returns a credential-free navigation projection for the current interactive Session. It identifies available product areas, a bounded list of management scopes, and the current unresolved Attempt selector without exposing Roles, permissions, provider claims, Session credentials, or examination content. This response is not an authorization receipt and must never be cached.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/CurrentUserContextOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: getUserProfile
      summary: Get a contextually visible User profile
      tags:
        - Users
      description: >-
        Returns one safe User profile only when the caller has current contextual visibility through the Institution or a supported scoped relationship. Disabled or unrelated Users are concealed according to the documented authorization behavior.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateUserProfile
      summary: Administratively update a User profile
      tags:
        - Users
      description: >-
        Applies a partial administrative profile update after terminal authorization against the target User. It changes presentation fields only; email, credential methods, account state, memberships, and Role Bindings use explicit separate transitions.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - user.invalid
        - user.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateUserProfile'
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateUserProfile:
      description: Mutable presentation fields for one User; omitted or null fields remain unchanged.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserProfileRequest'
          example:
            display_name: Amina Diallo
            first_name: Amina
            last_name: Diallo
            locale: en
            timezone: Europe/Paris
  responses:
    CurrentUserContextOK:
      description: Bounded current User product context
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUserContextResponse'
    UserProfileListOK:
      description: User profile collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileListResponse'
          example:
            items: []
            total: 0
            total_is_lower_bound: false
  schemas:
    CurrentUserContextResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - no_current_affiliation
        - no_assigned_access
        - available_product_areas
        - management_scopes
        - management_scopes_has_more
        - unresolved_attempt
        - session_management_available
        - current_desktop_registration_id
      properties:
        user:
          $ref: '#/components/schemas/CurrentUserContextIdentity'
        no_current_affiliation:
          type: boolean
        no_assigned_access:
          type: boolean
        available_product_areas:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - account
              - administration
              - exam_management
              - settings
              - student_activity
        management_scopes:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CurrentUserManagementScope'
        management_scopes_has_more:
          type: boolean
        unresolved_attempt:
          type:
            - object
            - "null"
          additionalProperties: false
          required:
            - id
            - exam_sitting_id
            - state
          properties:
            id:
              $ref: '#/components/schemas/ID'
            exam_sitting_id:
              $ref: '#/components/schemas/ID'
            state:
              type: string
              enum:
                - ready
                - active
                - suspended
        session_management_available:
          type: boolean
        current_desktop_registration_id:
          type:
            - string
            - "null"
          pattern: '^[a-z0-9]{26}$'
    CurrentUserContextIdentity:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - display_name
        - profile_picture_reference
        - profile_picture_kind
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        display_name:
          type: string
        profile_picture_reference:
          type: string
        profile_picture_kind:
          $ref: '#/components/schemas/ProfilePictureKind'
    CurrentUserManagementScope:
      type: object
      additionalProperties: false
      required:
        - scope_type
        - scope_id
        - display_name
      properties:
        scope_type:
          type: string
          enum:
            - institution
            - academic_unit
        scope_id:
          $ref: '#/components/schemas/ID'
        display_name:
          type: string
    UserProfileListResponse:
      description: Visible User profiles in the requested order, by canonical username and identity by default.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserDirectoryEntryResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Users matching the filters and the caller's visibility across every page, present only on the
            first page. At 10,000 counting stops and `total_is_lower_bound` is true.
        total_is_lower_bound:
          type: boolean
          description: True when `total` reached the 10,000 bound and there may be more. Present with `total`.
    UserDirectoryEntryResponse:
      type: object
      additionalProperties: false
      description: >-
        One User directory item: the User profile projection the caller may read, with the same field rules as
        UserProfileResponse, and a bounded summary of who the User is in the Institution.
      required:
        - id
        - created_at
        - updated_at
        - username
        - display_name
        - first_name
        - last_name
        - profile_picture_url
        - profile_picture_kind
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        username:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        locale:
          type: string
        timezone:
          type: string
        last_login_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
        profile_picture_url:
          type: string
        profile_picture_changed_at:
          type: string
          format: date-time
          description: >-
            Time of the latest upload or removal. It is not a sign that a custom picture exists; use
            profile_picture_kind.
        profile_picture_kind:
          $ref: '#/components/schemas/ProfilePictureKind'
        summary:
          $ref: '#/components/schemas/UserDirectorySummary'
    UserDirectorySummary:
      type: object
      additionalProperties: false
      description: >-
        Who the User is, read at the same instant as the page. `affiliations` lists at most three current
        Affiliations, oldest first. `roles` and `roles_more` are present only when the caller holds
        role_binding.view somewhere; they list at most three current Role Bindings inside the caller's
        role_binding.view scopes, oldest first, and a binding outside those scopes is neither listed nor counted.
      required:
        - affiliations
        - affiliations_more
      properties:
        affiliations:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/UserDirectoryAffiliation'
        affiliations_more:
          type: integer
          minimum: 0
          description: Current Affiliations past the three listed.
        roles:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/UserDirectoryRole'
        roles_more:
          type: integer
          minimum: 0
          description: Visible current Role Bindings past the three listed. Present with `roles`.
    UserDirectoryAffiliation:
      type: object
      additionalProperties: false
      description: >-
        One current Affiliation with the User's current Academic Units. A membership is not tied to an
        Affiliation kind, so every Affiliation carries the same units: at most two, ordered by name, from units the
        caller's user.view reaches (every unit for Institution-wide user.view).
      required:
        - kind
        - academic_units
        - academic_units_more
      properties:
        kind:
          type: string
          enum:
            - student
            - teacher
            - staff
            - external
        academic_units:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/UserDirectoryAcademicUnit'
        academic_units_more:
          type: integer
          minimum: 0
          description: Visible current Academic Units past the two listed.
    UserDirectoryAcademicUnit:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          description: The Academic Unit's display name.
    UserDirectoryRole:
      type: object
      additionalProperties: false
      description: One current Role Binding, named by its Role and the Institution, Academic Unit or Class it is scoped to.
      required:
        - role_id
        - display_name
        - scope_type
        - scope_id
        - scope_name
      properties:
        role_id:
          $ref: '#/components/schemas/ID'
        display_name:
          type: string
          description: The Role's display name.
        scope_type:
          type: string
          enum:
            - institution
            - academic_unit
            - class
        scope_id:
          $ref: '#/components/schemas/ID'
        scope_name:
          type: string
          description: The display name of the binding's Institution, Academic Unit or Class.
    UpdateUserProfileRequest:
      description: Partial User presentation update; omitted and explicit null values leave a field unchanged.
      type: object
      additionalProperties: false
      properties:
        username:
          type:
            - string
            - "null"
          description: Omitted or null leaves the canonical username unchanged.
        display_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the human-facing display name unchanged.
        first_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the first name unchanged.
        last_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the last name unchanged.
        locale:
          type:
            - string
            - "null"
          description: Omitted or null leaves the locale unchanged.
        timezone:
          type:
            - string
            - "null"
          description: Omitted or null leaves the IANA time-zone name unchanged.
