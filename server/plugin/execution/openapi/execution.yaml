paths:
  /api/v1/plugins/execution/exam-attempts/{exam_attempt_id}/terminal:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: connectExecutionTerminal
      summary: Open the candidate's terminal
      tags:
        - Attempts and workspaces
      description: >-
        Upgrades to a binary WebSocket that carries the candidate's terminal in their execution environment. Any node serves it by attaching to the environment's host itself. The first message is JSON, {"op":"attach","cols":80,"rows":24,"resume":null,"takeover":false}; resume names a terminal and the offset of the next output byte the client has not seen, and takeover replaces another attached client. Every later message starts with one type byte: 0x00 carries terminal bytes and 0x01 a JSON control. The client sends input as 0x00 and {"op":"resize","cols","rows"} or {"op":"hangup"} as 0x01. The server sends output as 0x00 and, as 0x01, {"op":"attached","terminal","start"} once attached, {"op":"waiting"} while no environment is live, and {"op":"ended","reason"} when the terminal ends, for example exited, superseded, busy or environment_restarted. When the Exam records terminal input, the server records what the client sends, with its timing and window changes, as sealed evidence before forwarding it; output is never recorded. Messages are at most 64 KiB, and the core closes the socket with code 4003 once the candidate's Attempt access no longer holds.
      x-codeSamples:
        - lang: Shell
          source: |-
            websocat --binary \
              --header='Authorization: DPoP <desktop-session-access-credential>' \
              --header='DPoP: <fresh-proof-for-this-get-target-and-current-nonce>' \
              --header='X-Proctor-Attempt-Credential: <attempt-credential>' \
              --header='X-Proctor-Attempt-Connection-ID: <attempt-connection-id>' \
              'wss://proctor.example.edu/api/v1/plugins/execution/exam-attempts/<exam-attempt-id>/terminal'
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - audit.unavailable
        - plugin.route.rate_limited
        - websocket.origin.invalid
        - websocket.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
      responses:
        '101':
          description: Switching Protocols
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/plugins/execution/exam-attempts/{exam_attempt_id}/flush:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: flushExecutionEnvironment
      summary: Flush the execution environment before submitting
      tags:
        - Attempts and workspaces
      description: >-
        Freezes the candidate's execution environment after saving its last file changes to the Attempt Workspace, and answers with the Workspace cursor that holds them, which the candidate then submits with. It waits up to 20 seconds. The environment thaws again 30 seconds later unless the Attempt ends first. 409 means no environment is live for the Attempt; 503 means the flush could not finish, and the candidate can still submit what was saved. The request has no body.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/plugins/execution/exam-attempts/<exam-attempt-id>/flush' \
              --header 'Authorization: DPoP <desktop-session-access-credential>' \
              --header 'DPoP: <fresh-proof-for-this-post-target-and-current-nonce>' \
              --header 'X-Proctor-Attempt-Credential: <attempt-credential>' \
              --header 'X-Proctor-Attempt-Connection-ID: <attempt-connection-id>'
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - audit.unavailable
        - plugin.route.rate_limited
        - plugin.route.unavailable
        - plugin.route.conflict
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
      responses:
        '200':
          description: The environment is frozen and its changes are in the Attempt Workspace
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - workspace_cursor
                properties:
                  workspace_cursor:
                    type: integer
                    format: int64
                    minimum: 0
                    description: The Attempt Workspace cursor that holds every change the environment had written. Submit with it.
              example:
                workspace_cursor: 42
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
